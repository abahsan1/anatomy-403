rvous plexus","q":"Select ALL correctly matched contributions to the pharyngeal plexus.","c":["CN IX: sensory from the pharyngeal mucosa","CN X: motor to the pharyngeal muscles","CN X: parasympathetic to the mucosal glands","Superior cervical ganglion: vasomotor"],"w":["CN IX: motor to the pharyngeal constrictors","CN XII: motor to the palatopharyngeus"],"e":"CN IX brings somatic sensory (afferent) fibers. CN X brings somatic motor fibers to the muscles and visceral motor (parasympathetic) fibers to the mucosa. The superior cervical sympathetic ganglia add vasomotor fibers. IX and X both leave the skull through the jugular foramen (Respiration slide 28)."},{"id":"r-pm4","kind":"mcq","l":4,"topic":"Pharyngeal muscles & nervous plexus","q":"Something unexpected touches the back of a patient's throat and they gag. Which nerves carry the two limbs of that reflex?","c":"Sensory: CN IX; motor: CN X","w":["Sensory: CN X; motor: CN IX","Sensory: CN V; motor: CN VII","Sensory: CN IX; motor: CN XII"],"e":"The gag (pharyngeal) reflex runs through the pharyngeal plexus: CN IX brings the sensation from the pharynx, and CN X drives the muscles that expel the foreign body (Respiration slide 28)."},{"id":"r-pm5","kind":"mcq","l":4,"topic":"Pharyngeal muscles & nervous plexus","q":"Where does the middle pharyngeal constrictor attach anteriorly?","c":"Hyoid bone","w":["Thyroid and cricoid cartilages","Buccopharyngeal raphe","Styloid process"],"e":"Superior constrictor: skull, buccopharyngeal raphe, mandible. Middle: hyoid. Inferior: thyroid and cricoid cartilages of the larynx. All meet posteriorly at the pharyngeal raphe (Respiration slide 26)."},{"id":"r-lx1","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"Which best describes where the larynx sits?","c":"Below the hyoid, in front of the laryngopharynx, above the trachea","w":["Above the hyoid, behind the laryngopharynx, above the trachea","Below the hyoid, behind the esophagus, below the trachea","Below the hyoid, behind the laryngopharynx, below the trachea"],"e":"The larynx hangs from the hyoid by the thyrohyoid membrane, lies anterior to the laryngopharynx, and the trachea hangs from it by the cricotracheal ligament. It spans roughly C4 to C6 (Respiration slide 32)."},{"id":"r-lx2","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"Which structure suspends the larynx from the hyoid bone?","c":"Thyrohyoid membrane","w":["Cricotracheal ligament","Median cricothyroid ligament","Quadrangular membrane"],"e":"The thyrohyoid membrane suspends the thyroid cartilage from the hyoid. The cricotracheal ligament suspends the trachea from the cricoid (Respiration slide 32)."},{"id":"r-lx3","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"Which major laryngeal cartilage has many intrinsic muscle attachments but does not move?","c":"Cricoid","w":["Arytenoid","Thyroid","Epiglottic"],"e":"The cricoid is the stable base: the posterior and lateral crico-arytenoids and the cricothyroid pull from it, but it is the one akinetic cartilage. The arytenoids are the most kinetic; the thyroid and epiglottis also move (Respiration slides 35 to 37)."},{"id":"r-lx4","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"What is the Adam's apple?","c":"The laryngeal prominence of the thyroid cartilage","w":["The anterior arch of the cricoid cartilage","The leaf of the epiglottic cartilage","The body of the hyoid bone"],"e":"The two thyroid laminae meet in the midline; the upper end of that meeting is the laryngeal prominence, or Adam's apple (Respiration slide 34)."},{"id":"r-lx5","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"What attaches to the two processes of each arytenoid cartilage?","c":"Vocal process: the vocal ligament; muscular process: intrinsic muscles","w":["Vocal process: intrinsic muscles; muscular process: the vocal ligament","Vocal process: the hyoid; muscular process: the thyroid cartilage","Vocal process: the epiglottis; muscular process: the vocal ligament"],"e":"The vocal process (anterior) anchors the vocal ligament, which runs forward to the thyroid cartilage. The muscular process (lateral) is where intrinsic muscles such as the crico-arytenoids pull to pivot the cartilage (Respiration slide 36)."},{"id":"r-lx6","kind":"mcq","l":4,"topic":"Larynx & laryngoskeleton","q":"The inferior horns of the thyroid cartilage articulate with the:","c":"Cricoid cartilage","w":["Hyoid bone","Arytenoid cartilages","First tracheal ring"],"e":"Inferior horns meet the cricoid at the cricothyroid joints. Superior horns point up toward the greater horns of the hyoid (Respiration slide 34)."},{"id":"r-mc1","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"Which intrinsic membrane funnels air out of the larynx and contains the vocal ligaments?","c":"Conus elasticus","w":["Quadrangular membrane","Thyrohyoid membrane","Aryepiglottic ligament"],"e":"The quadrangular membranes (proximal) funnel air in and contain the aryepiglottic and vestibular ligaments. The conus elasticus (distal) funnels air out over the vocal ligaments and includes the cricothyroid membranes (Respiration slide 40)."},{"id":"r-mc2","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"In which order does inhaled air pass through the spaces of the larynx?","c":"Vestibule → rima vestibuli → ventricle → rima glottidis → infraglottic cavity","w":["Vestibule → rima glottidis → ventricle → rima vestibuli → infraglottic cavity","Rima vestibuli → vestibule → ventricle → rima glottidis → infraglottic cavity","Vestibule → ventricle → rima vestibuli → rima glottidis → infraglottic cavity"],"e":"Laryngeal vestibule (entry), rima vestibuli (between the vestibular folds), laryngeal ventricle, rima glottidis (between the vocal folds), infraglottic cavity, then trachea (Respiration slide 41; Dr. Fox in the membranes video)."},{"id":"r-mc3","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"What is the space separating the vocal folds from the vestibular folds?","c":"Laryngeal ventricle","w":["Laryngeal vestibule","Rima glottidis","Rima vestibuli"],"e":"The laryngeal ventricle lies between the vestibular (false) and vocal (true) folds. The vestibule is where air first enters; the rimae are the gaps between each pair of folds (Respiration slides 41 and 43)."},{"id":"r-mc4","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"Throat singing produces sound by vibrating which folds?","c":"Vestibular (false vocal) folds","w":["Vocal (true vocal) folds","Aryepiglottic folds","Palatopharyngeal folds"],"e":"The vestibular folds are mainly protective for the vocal folds, but they can vibrate; that is throat singing. Normal speech uses the true vocal folds (Dr. Fox in the membranes video; Respiration slide 40)."},{"id":"r-mc5","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"In an emergency, you slide a finger down from the laryngeal prominence to the soft spot just above the cricoid. What do you cut through?","c":"Median cricothyroid ligament","w":["Thyrohyoid membrane","Cricotracheal ligament","Second tracheal ring"],"e":"A cricothyrotomy incises and cannulates the median cricothyroid ligament, between the thyroid and cricoid cartilages. Good surface landmarks and no superficial vessels make it safe to do emergently (Respiration slide 42)."},{"id":"r-mc6","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"Why must a tracheostomy be done surgically, while a cricothyrotomy can be done emergently?","c":"Vessels such as inferior thyroid veins or a thyroid ima artery may be in the way","w":["The cricothyroid site lies directly over the thyroid ima artery","The trachea can only be reached by passing behind the esophagus","The tracheostomy site has no reliable surface landmarks to palpate"],"e":"A tracheostomy is a vertical incision about 1 cm above the jugular notch, where inferior thyroid veins and, in about 10% of people, a thyroid ima artery can bleed. The cricothyroid site has no superficial vessels (Respiration slide 42; Dr. Fox in the membranes video)."},{"id":"r-mc7","kind":"mcq","l":4,"topic":"Laryngeal membranes & cavities","q":"A patient will need an artificial airway for several weeks. Which approach fits?","c":"Tracheostomy, about 1 cm above the jugular notch","w":["Cricothyrotomy through the median cricothyroid ligament","Incision through the thyrohyoid membrane","Cricothyrotomy through the lateral cricothyroid membrane"],"e":"A cricothyrotomy is for emergencies; its small size and location make it poor for long-term use. A surgical tracheostomy is used for long-term airway maintenance (Respiration slide 42; Dr. Fox in the membranes video)."},{"id":"r-lm1","kind":"mcq","l":4,"topic":"Laryngeal muscles","q":"What distinguishes extrinsic from intrinsic laryngeal muscles?","c":"Extrinsic link the larynx to other structures; intrinsic link its own cartilages","w":["Intrinsic link the larynx to other structures; extrinsic link its own cartilages","Extrinsic adjust vocal fold tension; intrinsic only raise or lower the larynx","Extrinsic are all supplied by the recurrent laryngeal nerves; intrinsic are not"],"e":"Extrinsic muscles (suprahyoids, infrahyoids, longitudinal pharyngeal muscles) move the whole larynx up or down. Intrinsic muscles connect laryngoskeleton parts to each other to abduct/adduct and tense the vocal folds (Respiration slides 46 and 47)."},{"id":"r-lm2","kind":"mcq","l":4,"topic":"Laryngeal muscles","q":"A singer lowers their larynx to get a deeper resonance. Which muscle does that?","c":"Sternothyroid","w":["Thyrohyoid","Stylopharyngeus","Mylohyoid"],"e":"A higher larynx gives a brighter, fuller voice; a lower larynx gives deeper resonance. Sternothyroid depresses the larynx. Thyrohyoid, the suprahyoids (such as mylohyoid) and the longitudinal pharyngeal muscles elevate it (Respiration slide 46)."},{"id":"r-lm3","kind":"mcq","l":4,"topic":"Laryngeal muscles","q":"How should the vocal folds be positioned to favor ventilation over phonation?","c":"Abducted, widening the rima glottidis","w":["Adducted, narrowing the rima glottidis","Adducted, widening the rima glottidis","Abducted, narrowing the rima glottidis"],"e":"Ventilation is wide: abducted folds, open rima glottidis. Phonation is narrow: adducted folds that vibrate as air passes (Respiration slides 47 and 48)."},{"id":"r-lm4","kind":"mcq","l":4,"topic":"Laryngeal muscles","q":"To raise the pitch of the voice, what has to change at the vocal ligaments?","c":"More tension","w":["Less tension","More abduction","Less adduction"],"e":"Pitch is proportional to tension on the vocal ligaments. Abduction moves the folds out of position for phonation entirely (Respiration slide 47)."},{"id":"r-il1","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"Which intrinsic laryngeal muscle is most important for ventilation?","c":"Posterior crico-arytenoid","w":["Lateral crico-arytenoid","Transverse arytenoid","Cricothyroid"],"e":"The posterior crico-arytenoids rotate the arytenoids laterally, abducting the vocal ligaments and opening the rima glottidis. They are the only intrinsic muscles that open the airway (Respiration slides 55 and 57)."},{"id":"r-il2","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"Both posterior crico-arytenoid muscles are paralyzed. What would you expect?","c":"The folds can't abduct, so the airway stays narrow","w":["The folds can't adduct, so the voice is breathy","Pitch can't rise, but breathing is unaffected","The epiglottis can't swing down when swallowing"],"e":"The posterior crico-arytenoids are the only abductors. Without them nothing opens the rima glottidis, so ventilation suffers while the adductors still work (Respiration slides 52 and 55; Dr. Fox in the intrinsic muscles video)."},{"id":"r-il3","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"What does the cricothyroid muscle do?","c":"Tips the thyroid forward and down, tensing the folds to raise pitch","w":["Rotates the arytenoids outward, opening the rima glottidis wide","Pulls the arytenoids forward, slackening the folds to lower pitch","Glides the arytenoids together, closing the rima glottidis tight"],"e":"At the cricothyroid hinge joint, the cricothyroid tips the thyroid cartilage anteriorly and downward. Since the vocal ligaments run from the arytenoids to the thyroid, that stretches them and raises pitch (Respiration slide 51)."},{"id":"r-il4","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"Select ALL muscles that adduct the vocal ligaments and close the rima glottidis.","c":["Transverse arytenoid","Oblique arytenoid","Lateral crico-arytenoid"],"w":["Posterior crico-arytenoid","Cricothyroid"],"e":"The arytenoid muscles glide the arytenoids together and the lateral crico-arytenoids rotate the vocal processes inward: both adduct for phonation. Posterior crico-arytenoids abduct; cricothyroid changes tension, not position (Respiration slides 52 to 54)."},{"id":"r-il5","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"Which muscle narrows the laryngeal inlet and swings the epiglottis down to protect the airway during swallowing?","c":"Oblique arytenoid","w":["Posterior crico-arytenoid","Cricothyroid","Thyro-arytenoid"],"e":"Besides adducting the folds, the arytenoid muscles (the oblique parts especially) narrow the laryngeal inlet and depress the epiglottis, a protective action during deglutition (Respiration slide 53; Dr. Fox in the intrinsic muscles video)."},{"id":"r-il6","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"What do the vocalis fibers of the thyro-arytenoid muscle do?","c":"Change timbre and fine-tune pitch","w":["Open the rima glottidis for breathing","Tip the thyroid cartilage forward","Raise the whole larynx for a bright voice"],"e":"The medial thyro-arytenoid fibers beside the vocal ligaments (the vocalis) add lateral tension, flattening the ligament. That changes timbre (tonal quality) and fine-tunes pitch up or down (Respiration slide 56)."},{"id":"r-il7","kind":"mcq","l":4,"topic":"Intrinsic laryngeal muscles","q":"What do the lateral fibers of the thyro-arytenoid muscle do?","c":"Pull the arytenoids forward, lowering pitch","w":["Pull the arytenoids back, raising pitch","Rotate the arytenoids out, opening the airway","Tip the thyroid forward, raising pitch"],"e":"The lateral fibers protract the arytenoids toward the thyroid, slackening the vocal ligaments: less tension, lower pitch (Respiration slide 56)."},{"id":"r-nv1","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"Which intrinsic laryngeal muscle has a unique innervation?","c":"Cricothyroid","w":["Posterior crico-arytenoid","Lateral crico-arytenoid","Thyro-arytenoid"],"e":"Every intrinsic laryngeal muscle is supplied by the recurrent laryngeal nerves except the cricothyroid, supplied by the external branch of the superior laryngeal nerve. Both are branches of the vagus (Respiration slides 47 and 63)."},{"id":"r-nv2","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"After surgery near the tracheo-esophageal groove, a patient is hoarse and one vocal fold barely moves. Which nerve was most likely injured?","c":"Recurrent laryngeal n.","w":["External branch of superior laryngeal n.","Internal branch of superior laryngeal n.","Glossopharyngeal n."],"e":"The recurrent laryngeal nerve ascends in the tracheo-esophageal groove and supplies nearly all intrinsic laryngeal muscles on its side, so injury can paralyze much of that side. The external branch only supplies cricothyroid; the internal branch is sensory and secretomotor (Respiration slides 61 and 62)."},{"id":"r-nv3","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"A crumb touches the laryngeal mucosa just above the vocal folds and triggers a cough. Which nerve carried that sensation?","c":"Internal branch of superior laryngeal n.","w":["External branch of superior laryngeal n.","Recurrent laryngeal n.","Glossopharyngeal n."],"e":"The internal branch of the superior laryngeal nerve passes through the thyrohyoid membrane and is sensory and secretomotor to mucosa proximal to the vocal folds. The recurrent laryngeal does the same distal to the folds (Respiration slides 60 and 61)."},{"id":"r-nv4","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"Which nerve is sensory and secretomotor to the laryngeal mucosa below the vocal folds?","c":"Recurrent laryngeal n.","w":["Internal branch of superior laryngeal n.","External branch of superior laryngeal n.","Phrenic n."],"e":"Distal to the vocal folds, the recurrent laryngeal nerve does for the mucosa what the internal branch of the superior laryngeal nerve does proximal to them: sensation in and parasympathetic secretion out (Respiration slide 61)."},{"id":"r-nv5","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"Which vessel does each recurrent laryngeal nerve loop under?","c":"Right: subclavian artery; left: arch of the aorta","w":["Right: arch of the aorta; left: subclavian artery","Right and left: arch of the aorta","Right and left: their subclavian arteries"],"e":"The right recurrent laryngeal wraps around the right subclavian artery; the left wraps around the concavity of the aortic arch. Both then ascend in the tracheo-esophageal groove (Respiration slide 61)."},{"id":"r-nv6","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"A surgeon ligates the inferior laryngeal artery. Which nerve, running with it in the tracheo-esophageal groove, must be spared?","c":"Recurrent laryngeal n.","w":["Internal branch of superior laryngeal n.","External branch of superior laryngeal n.","Vagus n. trunk in the carotid sheath"],"e":"The inferior laryngeal artery (from the inferior thyroid artery) ascends with the recurrent laryngeal nerve in the tracheo-esophageal groove. Damaging the nerve risks paralyzing most intrinsic laryngeal muscles on that side (Respiration slide 62; Dr. Fox in the neurovasculature video)."},{"id":"r-nv7","kind":"mcq","l":4,"topic":"Laryngeal neurovasculature","q":"Where does the superior laryngeal artery come from, and what does it travel with?","c":"Superior thyroid a.; with the internal br. of the superior laryngeal n.","w":["Inferior thyroid a.; with the recurrent laryngeal n.","Superior thyroid a.; with the recurrent laryngeal n.","Inferior thyroid a.; with the internal br. of the superior laryngeal n."],"e":"Superior thyroid a. (external carotid) → superior laryngeal a., which passes through the thyrohyoid membrane with the internal branch of the superior laryngeal n. Inferior thyroid a. → inferior laryngeal a., with the recurrent laryngeal n. (Respiration slide 62)."},{"id":"r-tb1","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"At approximately what landmark does the trachea bifurcate into primary bronchi?","c":"Thoracic plane (sternal angle, T4/5)","w":["Cricoid cartilage (C6)","C4/5 intervertebral disc","Xiphisternal joint (T9)"],"e":"The trachea bifurcates at the thoracic plane, from the sternal angle back to the T4/5 intervertebral disc. C6 is where the trachea starts below the cricoid (Respiration slides 66 and 73)."},{"id":"r-tb2","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Which primary bronchus is larger and more vertical, so an inhaled object more often goes into it?","c":"Right primary bronchus","w":["Left primary bronchus","Neither; they are the same size","Whichever side the head is turned"],"e":"The right primary bronchus is larger and more vertical than the slimmer, more oblique left bronchus (Respiration slide 66; Dr. Fox in the tracheobronchial tree video)."},{"id":"r-tb3","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Which is the correct order of branching in the tracheobronchial tree?","c":"Primary → secondary (lobar) → tertiary (segmental) → bronchioles","w":["Primary → tertiary (lobar) → secondary (segmental) → bronchioles","Primary → secondary (segmental) → tertiary (lobar) → bronchioles","Secondary → primary (lobar) → tertiary (segmental) → bronchioles"],"e":"Primary bronchi serve lungs, secondary (lobar) bronchi serve lobes, tertiary (segmental) bronchi serve bronchopulmonary segments, then bronchioles (Respiration slide 68)."},{"id":"r-tb4","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"How many secondary bronchi does each lung have?","c":"Right 3, left 2, one per lobe","w":["Right 2, left 3, one per lobe","Right 3, left 3, one per lobe","Right 2, left 2, one per hilum"],"e":"Secondary bronchi are lobar: the right lung has three lobes and three secondary bronchi, the left has two of each (Respiration slide 68)."},{"id":"r-tb5","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Moving distally along the tracheobronchial tree, how does the wall change?","c":"Cartilage decreases and smooth muscle increases","w":["Cartilage increases and smooth muscle decreases","Cartilage and smooth muscle both increase","Cartilage stays the same; smooth muscle disappears"],"e":"Hyaline cartilage diminishes and smooth muscle increases distally; bronchioles have no cartilage (or mucous glands) and are all smooth muscle (Respiration slides 68 and 70)."},{"id":"r-tb6","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Why does epinephrine help open the airways in anaphylaxis?","c":"Sympathetic input relaxes airway smooth muscle","w":["Sympathetic input contracts the trachealis","Parasympathetic input relaxes the bronchioles","It adds cartilage support to the bronchioles"],"e":"The trachealis and bronchiolar walls are smooth muscle under autonomic control; sympathetic stimulation relaxes them and dilates the bronchioles (Respiration slides 67 and 70; Dr. Fox in the tracheobronchial tree video)."},{"id":"r-tb7","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Where does the conducting zone end and the respiratory zone begin?","c":"Between terminal and respiratory bronchioles","w":["Between tertiary bronchi and bronchioles","Between conducting and terminal bronchioles","Between respiratory bronchioles and alveoli"],"e":"Conducting → terminal → respiratory bronchioles. Terminal bronchioles are the end of the conducting zone (no gas exchange); respiratory bronchioles give rise to alveoli and begin the respiratory zone (Respiration slides 70 to 72)."},{"id":"r-tb8","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"A patient confined to bed for weeks develops pneumonia. Which bronchopulmonary segment is most susceptible?","c":"Superior segment of the inferior lobe","w":["Apical segment of the superior lobe","Lingula of the left superior lobe","Medial segment of the middle lobe"],"e":"The superior segments of the inferior lobes point straight posteriorly, so in someone lying on their back fluid and infection collect there (Respiration slide 69; Dr. Fox in the tracheobronchial tree video)."},{"id":"r-tb9","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Why can a single bronchopulmonary segment be surgically removed?","c":"It has its own tertiary bronchus and blood supply","w":["It is walled off from the others by a fissure","It has its own primary bronchus and lymphatics","It is wrapped in its own layer of parietal pleura"],"e":"Each segment is served by its own tertiary (segmental) bronchus with its own blood supply, so it can be resected and the rest of the lung keeps working. Fissures separate lobes, not segments (Respiration slide 69)."},{"id":"r-tb10","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"A foreign body hits the densely innervated ridge where the trachea splits and triggers a cough. What is that ridge?","c":"Carina","w":["Hilum","Lingula","Cricoid"],"e":"The carina (keel) is the cartilage ridge at the bifurcation; its mucosa is densely innervated, so contact triggers coughing (Respiration slide 68)."},{"id":"r-tb11","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"Which cells line the terminal bronchioles, protect them and produce surfactant?","c":"Club cells","w":["Type I alveolar cells","Dust cells","Reserve cells"],"e":"Club cells in the terminal bronchioles are protective and produce surfactant. Reserve (stem) cells there can replace injured epithelium (Respiration slide 71)."},{"id":"r-tb12","kind":"mcq","l":4,"topic":"Tracheobronchial tree","q":"What forms the posterior wall of the trachea?","c":"Trachealis smooth muscle","w":["A complete hyaline cartilage ring","The anterior wall of the esophagus","Elastic cartilage plates"],"e":"Tracheal (hyaline) cartilages are anterolateral, like a U; the gap posteriorly is closed by the trachealis muscle, next to the esophagus (Respiration slides 66 and 67)."},{"id":"r-al1","kind":"mcq","l":4,"topic":"Alveoli","q":"Which cells secrete surfactant in the alveoli?","c":"Type II alveolar cells","w":["Type I alveolar cells","Dust cells"],"e":"Type II alveolar cells are cuboidal, secretory cells that make surfactant. Type I cells are the respiratory epithelium; dust cells are macrophages (Respiration slides 77 and 78)."},{"id":"r-al2","kind":"mcq","l":4,"topic":"Alveoli","q":"Across which epithelium does gas exchange happen?","c":"Simple squamous type I alveolar cells","w":["Cuboidal type II alveolar cells","Pseudostratified ciliated epithelium","Stratified squamous epithelium"],"e":"Type I alveolar cells are simple squamous respiratory epithelium. Together with the capillary's own simple squamous wall they make a very thin barrier for gases (Respiration slide 77)."},{"id":"r-al3","kind":"mcq","l":4,"topic":"Alveoli","q":"Without surfactant, what would happen to the alveoli?","c":"They would tend to collapse from surface tension","w":["They would overinflate from low surface tension","They would lose their capillary blood supply","They would fill up with dust cells"],"e":"Surfactant reduces surface tension and keeps alveoli open. Without it they collapse on themselves (Respiration slide 77)."},{"id":"r-al4","kind":"mcq","l":4,"topic":"Alveoli","q":"Fine inhaled particles that reach the alveoli are cleared by which cells?","c":"Alveolar macrophages (dust cells)","w":["Type II alveolar cells","Club cells","Type I alveolar cells"],"e":"Mucus and the mucus elevator handle most debris higher up. Particles that reach the alveoli are phagocytized by dust cells, the alveolar macrophages (Respiration slide 77; Dr. Fox in the alveoli video)."},{"id":"r-al5","kind":"mcq","l":4,"topic":"Alveoli","q":"The alveolar capillaries belong to which circulation, and what blood arrives in them?","c":"Pulmonary; deoxygenated blood from the right ventricle","w":["Systemic; oxygenated blood from the bronchial arteries","Pulmonary; oxygenated blood from the left atrium","Systemic; deoxygenated blood from the venae cavae"],"e":"Pulmonary arteries carry relatively deoxygenated blood from the right ventricle to the alveolar capillary beds; there it drops CO2, picks up O2, and returns by the pulmonary veins (Respiration slide 76)."},{"id":"r-pc1","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Which vessels serving the lungs have the highest pressure?","c":"Bronchial arteries","w":["Pulmonary trunk","Pulmonary arteries","Pulmonary veins"],"e":"Bronchial arteries branch from the thoracic aorta, so they carry systemic pressure (about 120/80). The pulmonary trunk and its branches run at low pressure (about 25/8) (Respiration slides 81 and 84). Note: at the very end of the video Dr. Fox says pulmonary arteries, but he had just called bronchial arteries number one, and the slide supports that."},{"id":"r-pc2","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Why are the bronchial arteries the most common source of hemoptysis (coughing up blood)?","c":"They are high-pressure systemic branches of the aorta","w":["They carry the lowest-pressure blood in the lungs","They are low-pressure branches of the pulmonary trunk","They run inside the alveolar walls with the veins"],"e":"Bleeding is worst from a high-pressure source. The bronchial arteries are systemic, from the thoracic aorta, supplying the conducting pathway; the pulmonary loop is low pressure (Respiration slide 81)."},{"id":"r-pc3","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Which sequence traces blood from the right ventricle through the lungs to the left side of the heart?","c":"Pulmonary valve → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → left atrium","w":["Pulmonary valve → pulmonary arteries → pulmonary trunk → alveolar capillaries → pulmonary veins → left atrium","Pulmonary valve → pulmonary trunk → pulmonary veins → alveolar capillaries → pulmonary arteries → left atrium","Aortic valve → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → left atrium"],"e":"From the conus arteriosus of the right ventricle, through the pulmonary valve into the pulmonary trunk, which splits into left and right pulmonary arteries. They branch to the alveolar capillaries, and four pulmonary veins return to the left atrium (Respiration slides 81 to 83)."},{"id":"r-pc4","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Which vessels follow the branching of the bronchial tree with high fidelity, all the way to the alveolar capillaries?","c":"Pulmonary arteries","w":["Pulmonary veins","Venae cavae","Thoracic aorta"],"e":"Pulmonary arteries branch exactly as the bronchi do. The pulmonary veins do not follow the bronchial pathways (Respiration slides 82 and 83)."},{"id":"r-pc5","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Select ALL statements that are true of the pulmonary veins.","c":["They carry richly oxygenated blood","They drain into the left atrium","They also receive blood from bronchial arterial pathways","There are usually four, two from each lung"],"w":["They follow the bronchial tree branch for branch","They carry blood at systemic pressure"],"e":"Four pulmonary veins (two per lung) bring oxygenated blood to the left atrium, and they also drain most of the bronchial arterial blood. Unlike the arteries, they don't follow the bronchi, and the pulmonary loop is low pressure (Respiration slides 81 and 83)."},{"id":"r-pc6","kind":"mcq","l":4,"topic":"Pulmonary circulation","q":"Where does most of the blood from the bronchial arteries drain?","c":"Pulmonary veins","w":["Pulmonary arteries","Coronary sinus","Pulmonary trunk"],"e":"Bronchial arteries supply the conducting pathway out to about the respiratory bronchioles; their venous blood mostly goes to the pulmonary veins, some to the venae cavae (Respiration slide 81)."},{"id":"r-lu1","kind":"mcq","l":4,"topic":"Lungs","q":"The horizontal fissure separates the middle lobe of the right lung from which lobe?","c":"Superior lobe","w":["Inferior lobe","Lingula","Base"],"e":"Horizontal fissure: superior from middle lobe. Oblique fissure: inferior lobe from the rest (Respiration slides 88 and 91)."},{"id":"r-lu2","kind":"mcq","l":4,"topic":"Lungs","q":"What is the difference between the hilum and the root of a lung?","c":"Hilum is the region; the root is the contents passing through it","w":["Root is the region; the hilum is the contents passing through it","Hilum is on the costal surface; the root is on the base","Both terms mean the primary bronchus alone"],"e":"The hilum is the region on the mediastinal surface where structures enter and leave; the root is those contents: primary bronchus, pulmonary arteries, pulmonary veins, lymphatics (Respiration slides 87 and 90)."},{"id":"r-lu3","kind":"mcq","l":4,"topic":"Lungs","q":"Select ALL structures that are part of the root of the lung.","c":["Primary bronchus","Pulmonary arteries","Pulmonary veins","Lymphatics"],"w":["Phrenic nerve","Inferior vena cava"],"e":"Root contents: primary bronchus, pulmonary arteries, pulmonary veins and lymphatics (with hilar nodes) (Respiration slide 90)."},{"id":"r-lu4","kind":"mcq","l":4,"topic":"Lungs","q":"The cardiac notch and the lingula belong to which lobe?","c":"Superior lobe of the left lung","w":["Inferior lobe of the left lung","Middle lobe of the right lung","Superior lobe of the right lung"],"e":"Both are features of the left lung's superior lobe: the notch where the heart shows, and the tongue-shaped lingula below it. The lingula is not part of the inferior lobe (Respiration slide 89)."},{"id":"r-lu5","kind":"mcq","l":4,"topic":"Lungs","q":"The diaphragmatic surface of the lung is also called the:","c":"Base","w":["Apex","Hilum","Cupula"],"e":"Costal surface faces costal pleura; mediastinal surface faces mediastinal pleura and holds the hilum; diaphragmatic surface (the base) faces the diaphragmatic pleura. The apex is the top (Respiration slide 87)."},{"id":"r-lu6","kind":"mcq","l":4,"topic":"Lungs","q":"In the right lung, what does the oblique fissure separate?","c":"The inferior lobe from the middle and superior lobes","w":["The superior lobe from the middle lobe only","The middle lobe from the lingula of the lung","The superior lobe from the base of the lung"],"e":"The oblique fissure separates the inferior lobe from everything else; in the right lung the horizontal fissure then splits superior from middle. The left lung has only the oblique fissure (Respiration slide 88)."},{"id":"r-lu7","kind":"mcq","l":4,"topic":"Lungs","q":"Which surface of the lung holds the hilum, and what does it face?","c":"Mediastinal surface, facing the mediastinal pleura","w":["Costal surface, facing the costal pleura","Diaphragmatic surface, facing the diaphragmatic pleura","Mediastinal surface, facing the costal pleura"],"e":"The hilum is on the mediastinal surface, which faces the mediastinal pleura (Respiration slide 87)."},{"id":"r-vn1","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"Any muscles that increase the volume of the thoracic cavity serve which process?","c":"Inhalation","w":["Exhalation"],"e":"More volume means lower pressure (Boyle's law), and air moves from high to low pressure, so it flows in (Respiration slides 94 and 97)."},{"id":"r-vn2","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"When the diaphragm contracts, what happens?","c":"Thoracic volume rises, pressure falls, air flows in","w":["Thoracic volume rises, pressure rises, air flows in","Thoracic volume falls, pressure falls, air flows out","Thoracic volume falls, pressure rises, air flows in"],"e":"Contraction pulls the diaphragm down, increasing thoracic volume. By Boyle's law pressure drops, and air follows the pressure gradient into the lungs. Relaxation reverses it (Respiration slides 94 and 95)."},{"id":"r-vn3","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"How do ventilation and respiration differ?","c":"Ventilation moves air in and out; respiration is gas crossing membranes","w":["Respiration moves air in and out; ventilation is gas crossing membranes","Both terms mean gas crossing the alveolar walls","Ventilation is gas crossing cell membranes; respiration is breathing"],"e":"Ventilation = moving air into and out of the lungs and alveoli. Respiration = gases crossing membranes: external across the alveolar walls, internal across cell membranes (Respiration slide 94)."},{"id":"r-vn4","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"Oxygen moving from an alveolus into the blood is an example of:","c":"External respiration","w":["Internal respiration","Alveolar ventilation","Tidal breathing"],"e":"External respiration is gas exchange across the alveolar walls; internal respiration is across a cell's plasma membrane (Respiration slide 94)."},{"id":"r-vn5","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"A patient's right phrenic nerve is cut. What would you expect?","c":"Only the right hemidiaphragm stops working","w":["Both hemidiaphragms stop working","Only the right external intercostals stop","The diaphragm keeps working through CN X"],"e":"Each hemidiaphragm has its own phrenic nerve (C3, 4, 5). They work together, but injury to one leaves only the other hemidiaphragm functioning (Respiration slide 95; Dr. Fox in the ventilation video)."},{"id":"r-vn6","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"Which spinal nerve roots form the phrenic nerves?","c":"C3, C4, C5","w":["C1, C2, C3","C5, C6, C7","T1 to T6"],"e":"“C3, 4, 5 keeps the diaphragm alive” (Respiration slide 95)."},{"id":"r-vn7","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"Which structure passes through the central tendon of the diaphragm?","c":"Inferior vena cava","w":["Esophagus","Thoracic aorta","Sympathetic trunk"],"e":"The central tendon sits at about T8, is fused to the pericardium, and holds the caval hiatus for the inferior vena cava on its way to the right atrium (Respiration slide 95)."},{"id":"r-vn8","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"During quiet breathing, exhalation is mainly driven by:","c":"Passive relaxation of the diaphragm","w":["Contraction of the internal intercostals","Contraction of the abdominal muscles","Contraction of the scalene muscles"],"e":"In tidal breathing the diaphragm does the work: contraction for inhalation, relaxation (a passive process) for exhalation. Internal intercostals and abdominal muscles are recruited only for forceful exhalation (Respiration slides 95 and 96)."},{"id":"r-vn9","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"Select ALL accessory muscles of forceful inhalation.","c":["External intercostals","Sternocleidomastoid","Scalenes","Pectoralis minor"],"w":["Internal intercostals","Abdominal muscles"],"e":"Forceful inhalation: external intercostals (ribs up and out), sternocleidomastoid (manubrium), scalenes (ribs 1-2), pectoralis minor (ribs 3-5). Forceful exhalation: internal intercostals and abdominal muscles (Respiration slide 96)."},{"id":"r-vn10","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"How do the abdominal muscles help in a forceful cough?","c":"They raise abdominal pressure, pushing the diaphragm up","w":["They pull the ribs up and out","They pull the diaphragm down","They lift the sternum at the manubrium"],"e":"Abdominal muscles act on the abdominal cavity's volume and the diaphragm: squeezing the abdomen pushes the diaphragm up, shrinking the thorax and forcing air out (Respiration slide 96; Dr. Fox in the ventilation video)."},{"id":"r-vn11","kind":"mcq","l":4,"topic":"Muscles of ventilation","q":"What do the internal intercostal muscles do?","c":"Pull the ribs down and in for forceful exhalation","w":["Pull the ribs up and out for forceful inhalation","Pull the ribs down and in for quiet inhalation","Lift ribs 1 and 2 for forceful inhalation"],"e":"Internal intercostals pull the ribs inward and downward, decreasing thoracic volume for forceful exhalation; the external intercostals do the opposite (Respiration slide 96)."},{"id":"r-pl1","kind":"mcq","l":4,"topic":"Pleurae","q":"Which part of the pleurae dips into the fissures of the lungs?","c":"Visceral pleura","w":["Costal pleura","Mediastinal pleura","Diaphragmatic pleura","Cervical pleura"],"e":"Visceral pleura adheres to the lung surface, so it follows the lung into its fissures. Costal, mediastinal, diaphragmatic and cervical are all parts of the parietal pleura lining the cavity (Respiration slides 100 and 102)."},{"id":"r-pl2","kind":"mcq","l":4,"topic":"Pleurae","q":"Which pleura lines the inner surface of the rib cage?","c":"Costal pleura","w":["Visceral pleura","Mediastinal pleura","Cervical pleura"],"e":"Parietal pleura has costal (rib cage), mediastinal, diaphragmatic and cervical (cupula, up into the root of the neck) parts. Visceral pleura covers the lungs (Respiration slide 100)."},{"id":"r-pl3","kind":"mcq","l":4,"topic":"Pleurae","q":"Which pleura lines the cupula that rises into the root of the neck?","c":"Cervical pleura","w":["Costal pleura","Diaphragmatic pleura","Visceral pleura"],"e":"The cervical pleura lines the cupula; some describe it as where costal and mediastinal pleura come together (Respiration slide 100; Dr. Fox in the pleurae video)."},{"id":"r-pl4","kind":"mcq","l":4,"topic":"Pleurae","q":"What does the small amount of normal pleural fluid do?","c":"Lubricates the pleurae so they don't stick together","w":["Holds the lungs well away from the chest wall","Carries oxygen to the visceral pleura","Inflates the lungs by filling the cavity"],"e":"There are only about 5-15 ml of pleural fluid. It keeps visceral and parietal pleura from forming adhesions, while they stay right against each other so the lungs expand with the chest wall (Respiration slide 100; Dr. Fox in the pleurae video)."},{"id":"r-pl5","kind":"mcq","l":4,"topic":"Pleurae","q":"A stab wound lets air into the pleural cavity and the lung collapses. What are these called?","c":"Pneumothorax leading to atelectasis","w":["Hemothorax leading to atelectasis","Atelectasis leading to pneumothorax","Hydrothorax leading to empyema"],"e":"Air in the pleural cavity is a pneumothorax; it breaks the lung's coupling to the chest wall and can progress to atelectasis, a collapsed lung or lobe (Respiration slide 101)."},{"id":"r-pl6","kind":"mcq","l":4,"topic":"Pleurae","q":"Select ALL correctly matched pleural conditions.","c":["Hemothorax: blood","Chylothorax: lymph","Pyothorax: pus","Hydrothorax: serous fluid"],"w":["Pneumothorax: serous fluid","Chylothorax: pus"],"e":"Pleural effusion types: hydrothorax (serous fluid), hemothorax (blood), chylothorax (lymph), pyothorax or empyema (exudate, pus). Pneumothorax is air (Respiration slide 101)."},{"id":"r-pl7","kind":"mcq","l":4,"topic":"Pleurae","q":"A patient with a large pleural effusion struggles to breathe. Why, and how is it relieved?","c":"Fluid presses on the lung so it can't expand; drain it by thoracentesis","w":["Fluid blocks the bronchi so air can't enter; open it by cricothyrotomy","Fluid shrinks the pleural cavity so it can't fill; drain it by pericardiocentesis","Fluid fills the alveoli so gas can't cross; open it by tracheostomy"],"e":"Like cardiac tamponade, extra fluid in the pleural cavity presses on the lung so it can't expand on inhalation. Thoracentesis drains it with a needle (Respiration slide 101; Dr. Fox in the pleurae video)."},{"id":"b-cv1","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Arteries carry blood [[away from]] the heart; veins carry blood [[toward|towards|to]] the heart."},{"id":"b-cv2","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Blood is a [[liquid]] connective tissue made of [[plasma]] and [[formed elements]]."},{"id":"b-cv3","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Lymphatics pick up excess [[interstitial fluid|filtrate]] and return it to the [[venous|veins]] circulation."},{"id":"b-cv4","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Exchange of nutrients and wastes happens in the [[capillary beds|capillaries]], between arterioles and [[venules]]."},{"id":"b-th1","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The thoracic cavity is bounded superiorly by the [[first ribs]] and inferiorly by the [[diaphragm]]."},{"id":"b-th2","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The [[parietal]] pleura adheres to the walls and the [[visceral]] pleura adheres to the lungs."},{"id":"b-th3","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The thoracic plane runs from the [[sternal angle|angle of louis]] to the intervertebral disc between [[T4 and T5|T4/T5|T4-T5]]."},{"id":"b-th4","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The middle mediastinum is defined by the [[pericardium]]; the posterior mediastinum extends down to [[T12]]."},{"id":"b-pc1","kind":"blank","l":1,"topic":"Pericardium","s":"The visceral layer of the serous pericardium is also called the [[epicardium]]."},{"id":"b-pc2","kind":"blank","l":1,"topic":"Pericardium","s":"Between the parietal and visceral layers of serous pericardium is the [[pericardial cavity]]."},{"id":"b-pc3","kind":"blank","l":1,"topic":"Pericardium","s":"The fibrous pericardium is innervated by the [[phrenic]] nerves, from spinal levels [[C3 to C5|C3-C5|C3-5|C3, C4, C5]]."},{"id":"b-pc4","kind":"blank","l":1,"topic":"Pericardium","s":"Fluid that constricts the heart in the pericardial cavity causes cardiac [[tamponade]], treated by [[pericardiocentesis]]."},{"id":"b-pc5","kind":"blank","l":1,"topic":"Pericardium","s":"The amount of subserosal adipose tissue is proportional to [[cardiometabolic]] risk."},{"id":"b-hb1","kind":"blank","l":1,"topic":"Heart basics","s":"From outside in, the heart wall is the [[epicardium]], [[myocardium]] and [[endocardium]]."},{"id":"b-hb2","kind":"blank","l":1,"topic":"Heart basics","s":"The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."},{"id":"b-hb3","kind":"blank","l":1,"topic":"Heart basics","s":"Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."},{"id":"b-hb4","kind":"blank","l":1,"topic":"Heart basics","s":"Cells joined by gap junctions act as one, a [[functional syncytium]]."},{"id":"b-hb5","kind":"blank","l":1,"topic":"Heart basics","s":"The [[chordae tendineae]] anchor the AV valve cusps to the [[papillary]] muscles."},{"id":"b-hb6","kind":"blank","l":1,"topic":"Heart basics","s":"The right atrium receives blood from the [[superior]] and inferior venae cavae and the [[coronary sinus]]."},{"id":"b-hb7","kind":"blank","l":1,"topic":"Heart basics","s":"The two semilunar valves are the [[pulmonary|pulmonic]] valve and the [[aortic]] valve."},{"id":"b-ex1","kind":"blank","l":1,"topic":"External features","s":"The left border is also called the [[obtuse]] margin; the inferior border is the [[acute]] margin."},{"id":"b-ex2","kind":"blank","l":1,"topic":"External features","s":"The right border of the heart is formed by the [[right atrium]]."},{"id":"b-ex3","kind":"blank","l":1,"topic":"External features","s":"The base of the heart faces [[posteriorly|posterior]] and is formed mostly by the [[left atrium]]."},{"id":"b-ex4","kind":"blank","l":1,"topic":"Internal features","s":"All four valves sit roughly in one plane, anchored by the [[fibrous skeleton]] of the heart, which lines up with the [[coronary]] sulcus."},{"id":"b-in1","kind":"blank","l":1,"topic":"Internal features","s":"The smooth posterior part of the right atrium is the [[sinus venarum]], separated from the pectinate part by the [[crista terminalis]]."},{"id":"b-in2","kind":"blank","l":1,"topic":"Internal features","s":"The [[fossa ovalis]] on the interatrial septum is the remnant of the fetal [[foramen ovale]]."},{"id":"b-in3","kind":"blank","l":1,"topic":"Internal features","s":"The septomarginal trabecula, or [[moderator band]], carries the [[right bundle branch|right bundle]]."},{"id":"b-in4","kind":"blank","l":1,"topic":"Internal features","s":"The RCA arises from the [[right]] aortic sinus; the sinus above the posterior cusp is the [[non-coronary|noncoronary|non coronary]] sinus."},{"id":"b-co1","kind":"blank","l":1,"topic":"Coronary arteries","s":"The SA nodal branch comes from the RCA about [[60]] percent of the time."},{"id":"b-co2","kind":"blank","l":1,"topic":"Coronary arteries","s":"The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."},{"id":"b-co3","kind":"blank","l":1,"topic":"Coronary arteries","s":"Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."},{"id":"b-cv7-n1","kind":"blank","l":1,"topic":"Cardiovascular system","s":"In the [[capillary beds|capillaries|capillary bed]], nutrients leave the blood for the interstitial fluid and [[wastes|waste products|waste]] are picked up by the blood."},{"id":"b-co3-n1","kind":"blank","l":1,"topic":"Coronary arteries","s":"The right marginal branch follows the [[inferior]] border to the right ventricle wall; at the crux the RCA gives the [[AV nodal]] branch and the [[posterior interventricular|PDA|posterior descending]] branch."},{"id":"b-co4","kind":"blank","l":1,"topic":"Coronary arteries","s":"The [[circumflex]] branch of the L (function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OWNER="a1be1e0f-896a-49c9-b997-a06979110fae";
const PAGE=40;
const st={l:0,show:"all",q:"",limit:PAGE,open:new Set()};
let notes=new Map(), token=null;

async function api(method,body,qs){
  const r=await fetch("/api/notes"+(qs||""),{method,cache:"no-store",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Couldn't reach the notes store.");
  return j;
}

function gate(html){$("gate").innerHTML=html;$("gate").hidden=false;$("app").hidden=true}
let started=null;
async function start(u){
  // the sign-in event repeats on token refreshes: only react when the account changes
  const who=u?u.id:"none";if(who===started)return;started=who;
  if(!u){gate('<p>Sign in with your GitHub account to use question notes.</p><a class="btn primary" href="/login?next=/exam-3/notes">Sign in</a>');return}
  if(u.id!==OWNER){gate('<p>Question notes are only for the site owner. Your progress on the practice page still saves as usual.</p><a class="btn" href="/exam-3/cardio">Back to Exam 3 practice</a>');return}
  try{
    const sb=await window.a403Sync.client();
    const {data}=await sb.auth.getSession();
    token=data.session&&data.session.access_token;
    const j=await api("GET");
    notes=new Map(j.notes.map(n=>[n.qid,n]));
  }catch(e){gate('<p>'+esc(e.message)+'</p><button class="btn" type="button" onclick="location.reload()">Try again</button>');return}
  $("gate").hidden=true;$("app").hidden=false;
  setup();render();
}

function setup(){
  $("new-l").innerHTML=LECTURES.filter(L=>L.ready).map(L=>`<option value="${L.n}">Cardio ${L.n} · ${esc(L.name)}</option>`).join("")+`<option value="0">Any lecture</option>`;
  $("new-save").onclick=async()=>{
    const t=$("new-t").value.trim();$("new-err").textContent="";
    if(!t){$("new-err").textContent="Write what the question should test first.";return}
    const l=$("new-l").value, qid="new:"+Math.random().toString(36).slice(2,10);
    $("new-save").disabled=true;
    try{const j=await api("PUT",{qid,note:t,snap:l==="0"?"New question, any lecture":"New question for Cardio "+l});notes.set(qid,j.note);$("new-t").value="";st.show="new";render()}
    catch(e){$("new-err").textContent=e.message}
    $("new-save").disabled=false;
  };
  $("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();st.limit=PAGE;render()};
  $("more").onclick=()=>{st.limit+=PAGE;render()};
}

const lecName=n=>(LECTURES.find(L=>L.n===n)||{}).name||"";
const blankHtml=s=>esc(s).replace(/\[\[([^\]]+)\]\]/g,(_,a)=>"<b>"+a.split("|")[0]+"</b>");
const plain=s=>String(s).replace(/\[\[([^\]]+)\]\]/g,(_,a)=>a.split("|")[0]);
const snapOf=x=>x.kind==="blank"?plain(x.s):x.q;
const hay=x=>(x.id+" "+(x.q||"")+" "+(x.s||"")+" "+[].concat(x.c||[]).join(" ")+" "+(x.w||[]).join(" ")+" "+(x.e||"")+" "+x.topic+" "+((notes.get(x.id)||{}).note||"")).toLowerCase();

function newItems(){return [...notes.values()].filter(n=>n.qid.startsWith("new:")).map(n=>({id:n.qid,kind:"new",l:0,topic:"",q:n.snap}))}
function pool(){
  const inL=x=>!st.l||x.l===st.l;
  const base=[...newItems(),...ITEMS].filter(x=>x.kind==="new"?!st.l||n2l(x)===st.l:inL(x));
  const has=x=>notes.has(x.id);
  const f={all:()=>true,notes:has,open:x=>has(x)&&notes.get(x.id).status==="open",done:x=>has(x)&&notes.get(x.id).status==="done",new:x=>x.kind==="new"};
  return {base,f};
}
const n2l=x=>{const m=/Cardio (\d)/.exec(x.q||"");return m?+m[1]:0};

function render(){
  const {base,f}=pool();
  $("lects").innerHTML=[{n:0,name:"All lectures",ready:true},...LECTURES.filter(L=>L.ready)].map(L=>`<button class="f" type="button" data-l="${L.n}" aria-pressed="${st.l===L.n}">${L.n?"Cardio "+L.n:"All lectures"}</button>`).join("");
  const shows=[["all","All"],["notes","With notes"],["open","Waiting for Claude"],["done","Updated"],["new","New requests"]];
  $("shows").innerHTML=shows.map(([k,t])=>`<button class="f" type="button" data-show="${k}" aria-pressed="${st.show===k}">${t}<span class="n">${base.filter(f[k]).length}</span></button>`).join("");
  $("lects").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.l=+b.dataset.l;st.limit=PAGE;render()});
  $("shows").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.show=b.dataset.show;st.limit=PAGE;render()});
  let rows=base.filter(f[st.show]);
  if(st.q)rows=rows.filter(x=>hay(x).includes(st.q));
  $("count").textContent=rows.length?(rows.length===1?"1 item":rows.length+" items"):"";
  $("list").innerHTML=rows.length?rows.slice(0,st.limit).map(card).join(""):'<div class="item"><p style="margin:0;color:var(--x-muted)">Nothing here'+(st.q?" for that search":"")+'.</p></div>';
  $("more").hidden=rows.length<=st.limit;
  $("list").querySelectorAll(".item").forEach(wire);
}

function card(x){
  const n=notes.get(x.id), editing=st.open.has(x.id);
  let body="";
  if(x.kind==="mcq"){
    body=`<p class="qt">${esc(x.q)}</p><ul class="ans">${[].concat(x.c).map(a=>`<li>${esc(a)}</li>`).join("")}</ul><ul class="wr">${x.w.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`+
      (x.e?`<details class="ex"><summary>Explanation</summary><p>${esc(x.e)}</p></details>`:"");
  }else if(x.kind==="blank"){body=`<p class="qt blank">${blankHtml(x.s)}</p>`+(x.e?`<details class="ex"><summary>Explanation</summary><p>${esc(x.e)}</p></details>`:"")}
  else body=`<p class="qt">${esc(x.q)}</p>`;
  const tag=x.kind==="new"?`New question request <span>· ${esc(x.id.slice(4))}</span>`:
    `Cardio ${x.l} · ${esc(x.topic)} <span>· ${x.kind==="mcq"?"Multiple choice":"Fill in the blank"} · ${esc(x.id)}</span>`;
  let nh="";
  if(editing)nh=`<textarea aria-label="Note on ${esc(x.id)}" placeholder="What's wrong, unclear or missing?">${esc(n?n.note:"")}</textarea>
    <div class="row"><button class="btn primary quiet" data-act="save" type="button">Save note</button><button class="btn quiet" data-act="cancel" type="button">Cancel</button><p class="err" role="alert"></p></div>`;
  else if(n)nh=`<p class="st ${n.status}">${n.status==="done"?"Updated by Claude":"Waiting for Claude"}</p><div class="saved">${esc(n.note)}</div>`+
    (n.reply?`<div class="reply"><b>Claude</b>${esc(n.reply)}</div>`:"")+
    `<div class="row"><button class="btn quiet" data-act="edit" type="button">Edit note</button><button class="btn quiet" data-act="del" type="button">Delete note</button><p class="err" role="alert"></p></div>`;
  else nh=`<div class="row"><button class="btn quiet" data-act="edit" type="button">Add note</button></div>`;
  return `<article class="item${n?" has":""}" data-id="${esc(x.id)}"><p class="tag">${tag}</p>${body}<div class="note">${nh}</div></article>`;
}

function wire(el){
  const id=el.dataset.id, x=ITEMS.find(i=>i.id===id)||{kind:"new",q:(notes.get(id)||{}).snap||""};
  const err=()=>el.querySelector(".err");
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    const act=b.dataset.act;
    if(act==="edit"){st.open.add(id);const t=rerender(el,id).querySelector("textarea");t.focus();t.setSelectionRange(t.value.length,t.value.length);return}
    if(act==="cancel"){st.open.delete(id);rerender(el,id);return}
    b.disabled=true;
    try{
      if(act==="save"){
        const note=el.querySelector("textarea").value.trim();
        if(!note){err().textContent="Write a note first, or cancel.";b.disabled=false;return}
        const j=await api("PUT",{qid:id,note,snap:x.kind==="new"?(notes.get(id)||{}).snap:snapOf(x)});
        notes.set(id,j.note);st.open.delete(id);
      }
      if(act==="del"){
        if(!confirm("Delete this note?")){b.disabled=false;return}
        await api("DELETE",null,"?qid="+encodeURIComponent(id));notes.delete(id);
      }
      render();
    }catch(e){err().textContent=e.message;b.disabled=false}
  });
}
function rerender(el,id){
  const x=ITEMS.find(i=>i.id===id)||newItems().find(i=>i.id===id);
  const tmp=document.createElement("div");tmp.innerHTML=card(x);const nw=tmp.firstElementChild;el.replaceWith(nw);wire(nw);return nw;
}

const S=window.a403Sync;
if(!S){gate("<p>Sign-in didn't load. Reload the page to try again.</p>");return}
addEventListener("a403-auth",e=>start(e.detail));
if(S.ready())start(S.user());
})();
</script>
