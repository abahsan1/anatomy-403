rves the medial and deep anterior forearm and some of the hand, and feeds the superficial palmar arch"],"w":["The radial a. serves the medial anterior forearm and hand, and feeds the superficial palmar arch","The brachial a. divides at the inferior border of teres major, high in the arm"],"e":"Radial = lateral (thumb side), deep arch. Ulnar = medial, superficial arch. The arches may anastomose."},{"id":"v-sc9","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"The radial artery primarily feeds the:","c":"Deep palmar arch","w":["Superficial palmar arch","Dorsal venous arch","Cubital fossa"],"e":"Ulnar → superficial palmar arch."},{"id":"v-sc10","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"During an Allen test, both radial and ulnar arteries are compressed and the hand is clenched. When pressure on the ulnar artery is released, the palm stays pale. What does this mean?","c":"The ulnar–radial anastomosis is inadequate, so cannulating the radial artery is not safe","w":["The test passed; collateral flow is adequate, so the radial artery is safe to cannulate","The radial artery is blocked, so it should be cannulated to restore flow to the palm","The brachial artery is occluded above the elbow, so neither forearm artery can be used"],"e":"The test occludes both arteries, then releases one at a time and watches the palm flush with color. If color doesn't return with only the ulnar side open, the ulnar can't supply the hand on its own, a failed Allen test."},{"id":"v-sv1","kind":"mcq","l":2,"topic":"Superior vena cava","q":"The venous angle is the union of the subclavian v. with which other vein?","c":"Internal jugular v.","w":["External jugular v.","Inferior vena cava","Superior vena cava"],"e":"Internal jugular + subclavian = brachiocephalic v. The venous angle is where lymph (thoracic duct or right lymphatic duct) returns to venous blood."},{"id":"v-sv2","kind":"mcq","l":2,"topic":"Superior vena cava","q":"Select ALL correct statements about the superior vena cava and its tributaries.","c":["The SVC drains everything above the diaphragm into the right atrium","It is the union of the right and left brachiocephalic veins","The left brachiocephalic v. is longer and more oblique than the right","The internal jugular v. drains the head and neck; the subclavian v. drains the upper limb, neck and thorax"],"w":["The SVC is formed by the union of the two internal jugular veins behind the manubrium","The right brachiocephalic v. is longer and more oblique than the left"],"e":"Each brachiocephalic v. = internal jugular + subclavian, meeting at the venous angle. The SVC empties into the sinus venarum of the right atrium."},{"id":"v-sv3","kind":"mcq","l":2,"topic":"Superior vena cava","q":"Which statement about the superficial veins of the upper limb is correct?","c":"Cephalic v.: lateral, into the axillary v. Basilic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","w":["Basilic v.: lateral, into the axillary v. Cephalic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","Cephalic v.: lateral, joins the brachial veins to form the axillary v. Basilic v.: medial, into the cephalic v. Median cubital v.: a deep vena comitans","Cephalic v.: medial, into the subclavian v. Basilic v.: lateral, into the cephalic v. Median cubital v.: links them; avoided for venipuncture"],"e":"Basilic + brachial veins = axillary v.; the cephalic v. joins the axillary v. later. All deep veins of the limb are venae comitantes."},{"id":"v-sv4","kind":"mcq","l":2,"topic":"Superior vena cava","q":"Which vein is commonly used for venipuncture?","c":"Median cubital vein","w":["Cephalic vein at the deltopectoral groove","Brachial vein","Internal jugular vein"],"e":"It connects the cephalic and basilic veins across the cubital fossa."},{"id":"v-sv5","kind":"mcq","l":2,"topic":"Superior vena cava","q":"The axillary vein is formed by:","c":"The basilic vein joining the brachial veins","w":["The cephalic and basilic veins joining at the elbow","The internal jugular and subclavian veins joining","The radial and ulnar veins joining in the cubital fossa"],"e":"The cephalic v. drains into the axillary v. as it crosses the axilla."},{"id":"v-iv1","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"Which structures' venous pathway includes the left renal vein?","c":"Left gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland","w":["Left inferior surface of the diaphragm, left kidney, left suprarenal gland and liver","Spleen, and left inferior surface of the diaphragm, kidney and suprarenal gland","Right gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland"],"e":"The long left renal v. collects the left gonadal v. and a common trunk from the left hemidiaphragm and left suprarenal gland. The spleen drains to the hepatic portal system, and the liver through the hepatic veins."},{"id":"v-iv2","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"Select ALL correct statements about the inferior vena cava.","c":["It drains everything inferior to the diaphragm into the right atrium","It passes through the caval hiatus of the diaphragm at about T8","It lies to the right of the abdominal aorta","It begins as the union of the common iliac veins"],"w":["It receives the superior and inferior mesenteric veins directly","It passes through the aortic hiatus at T12"],"e":"Diaphragm hiatuses: caval T8, esophageal T10, aortic T12. Gut blood goes through the hepatic portal system and reaches the IVC only via the hepatic veins."},{"id":"v-iv3","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"IVC tributaries roughly mirror the branches of the abdominal aorta. What is the major exception, and why?","c":"No veins match the celiac trunk, SMA or IMA, because gut blood goes to the liver through the hepatic portal system","w":["No veins match the renal arteries, because the kidneys drain into the hepatic portal system instead of the IVC","No veins match the gonadal arteries, because the gonads drain into the internal iliac veins instead of the IVC","No veins match the lumbar arteries, because the body wall drains only into the azygos system instead of the IVC"],"e":"Gut blood enters the hepatic portal v., passes through the liver sinusoids, and returns to the IVC via the three hepatic veins."},{"id":"v-iv4","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"Where does the right gonadal vein drain, compared with the left?","c":"Right: directly into the IVC; left: into the left renal vein","w":["Right: into the right renal vein; left: directly into the IVC","Both drain into the hepatic portal vein","Both drain directly into the IVC"],"e":"The asymmetry of the left veins is mostly about the long left renal vein, which crosses the aorta (under the SMA) to reach the IVC on the right."},{"id":"v-iv5","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"The great saphenous vein drains into the:","c":"Femoral vein, in the femoral triangle","w":["Popliteal vein, in the popliteal fossa","External iliac vein, above the inguinal ligament","Small saphenous vein at the knee"],"e":"Great saphenous: medial foot (closely related to the medial malleolus), up the medial limb to the femoral v. Small saphenous: lateral foot, up the leg to the popliteal v."},{"id":"v-iv6","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"The boundary between the external iliac vein and the femoral vein is the:","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Medial malleolus"],"e":"Same landmark as for the arteries."},{"id":"v-iv7","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"The small saphenous vein drains the:","c":"Lateral foot and leg, into the popliteal vein","w":["Medial foot and leg, into the femoral vein","Plantar foot, into the posterior tibial artery","Medial thigh, into the great saphenous vein"],"e":"Deep lower limb veins are venae comitantes (posterior tibial, popliteal, femoral)."},{"id":"v-hp1","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"The hepatic portal system delivers material from which source tissues to the sinusoids of the liver?","c":"GI tract","w":["Esophagus, proximal","Kidneys","Lower limbs"],"e":"From the distal esophagus to the rectum. Kidneys and lower limbs drain to the caval system."},{"id":"v-hp2","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"Trace absorbed nutrients from the small intestine back to the heart.","c":"GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → IVC → right atrium","w":["GI capillaries → superior mesenteric v. → hepatic veins → liver sinusoids → hepatic portal v. (SMV + splenic v.) → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + renal v.) → liver sinusoids → hepatic veins → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → SVC → right atrium"],"e":"The hepatic portal v. is portal (connects GI capillaries to liver sinusoids). The three hepatic veins are caval. The inferior mesenteric v. usually drains into the splenic v."},{"id":"v-hp3","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"The hepatic portal vein is formed by the union of the:","c":"Superior mesenteric vein and splenic vein","w":["Inferior mesenteric vein and splenic vein","Superior and inferior mesenteric veins","Hepatic veins and the IVC"],"e":"SMV + splenic v. = hepatic portal v. Everything else is a tributary of one of those two."},{"id":"v-hp4","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"Select ALL sites where portacaval anastomoses can form varices in portal hypertension.","c":["Distal esophagus (esophageal varices)","Periumbilical region (caput medusae)","Anorectal submucosa (superior with inferior rectal veins)"],"w":["The dorsal venous arch of the foot (saphenous varices)","The venous angle of the neck (jugular varices)"],"e":"Portal hypertension (e.g. cirrhosis, thrombosis) enlarges portal tributaries until they connect with nearby caval veins. Mnemonic: “butts, guts and caputs.” Esophageal varices are the most diagnostic."},{"id":"v-hp5","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"Which pairing of portal and caval veins forms the esophageal portacaval anastomosis?","c":"Left gastric v. (portal) with esophageal veins (caval)","w":["Paraumbilical v. (portal) with epigastric veins (caval)","Superior rectal v. (portal) with inferior rectal v. (caval)","Splenic v. (portal) with left renal v. (caval)"],"e":"Periumbilical: paraumbilical with epigastric veins. Anorectal: superior rectal (portal) with inferior rectal (caval)."},{"id":"v-hp6","kind":"mcq","l":2,"topic":"Hepatic portal system","q":"Are the hepatic veins part of the portal or the caval system?","c":"Caval: they drain the liver sinusoids into the IVC","w":["Portal: they carry absorbed GI blood into the liver sinusoids","Neither: they are lymphatic vessels of the liver","Portal: they connect two capillary beds in series"],"e":"Hepatic portal v. = portal (into the liver). Hepatic veins (3) = caval (out of the liver)."},{"id":"bl-in1","kind":"mcq","l":3,"topic":"Introduction to blood","q":"A patient experiencing acidemia may compensate for that with which mechanism?","c":"An elevated rate of respiration","w":["A depressed rate of respiration","Increased retention of protons by the kidneys","Increased rate of excretion of bicarbonate by the kidneys"],"e":"Hyperventilating blows off more CO2, a volatile acid, which raises pH. In acidemia the kidneys should excrete protons and retain bicarbonate, the opposite of the other options."},{"id":"bl-in2","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Select ALL correct statements about the components of whole blood.","c":["Plasma is about 55% of whole blood and formed elements about 45%","Plasma is about 92% water","Erythrocytes are the most abundant formed element (4.8 to 5.4 million/µL)","Leukocytes are the least abundant formed element (5,000 to 10,000/µL)"],"w":["Thrombocytes are the most abundant formed element","Formed elements make up about 55% of whole blood"],"e":"Thrombocytes (150,000 to 400,000/µL) sit between erythrocytes and leukocytes. Whole blood is about 8% of body weight."},{"id":"bl-in3","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Select ALL correct pairs of blood function category and example.","c":["Transportation: gases, nutrients, wastes, hormones and cytokines","Regulation: pH, temperature and water balance","Protection: immune responses and clotting"],"w":["Regulation: producing antibodies in the liver","Protection: maintaining oncotic pressure"],"e":"Transportation, regulation and protection are the three buckets. Blood is a part-time host to the immune system; the lymphatic system is the other host."},{"id":"bl-in4","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Blood pH below 7.35 is called:","c":"Acidemia","w":["Alkalemia","Hypoxemia","Acidosis of the tissues only"],"e":"Normal range 7.35 to 7.45 (“physiologically neutral”, slightly alkaline chemically). Above 7.45 = alkalemia."},{"id":"bl-in5","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Why must blood pH stay between 7.35 and 7.45? Select ALL reasons given in lecture.","c":["Protein chemistry: proteins can stop working or denature","Neuron and muscle cell physiology depends on delicate ion balances","Oxygen delivery to tissues","Electrolyte balance"],"w":["It keeps erythrocytes from developing nuclei","It sets the ABO blood type"],"e":"Outside the range, cardiac, skeletal and smooth muscle and the nervous system stop working optimally."},{"id":"bl-in6","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Which statement about compensation for a pH disturbance is correct?","c":"Lungs adjust pH quickly through ventilation (CO2 loss); kidneys adjust slowly by excreting or retaining H+ and HCO3−","w":["Kidneys adjust pH quickly by excreting or retaining H+ and HCO3−; lungs adjust slowly over days by changing ventilation","In alkalemia the lungs hyperventilate to retain CO2, and the kidneys retain extra bicarbonate to help","In acidemia the kidneys excrete bicarbonate and retain protons, and the lungs slow ventilation to match"],"e":"Acidemia: hyperventilate, kidneys excrete H+ and retain HCO3−. Alkalemia: hypoventilate (retain CO2), kidneys excrete HCO3− and retain H+."},{"id":"bl-in7","kind":"mcq","l":3,"topic":"Introduction to blood","q":"By Le Châtelier's principle, what happens to the carbonic acid–bicarbonate system when protons build up in the blood?","c":"It shifts toward carbonic acid, then CO2 and water, and the CO2 can be breathed out","w":["It shifts toward more bicarbonate and protons, which the kidneys then excrete in urine","It stops working, because the buffer system operates only during alkalemia","Hemoglobin releases more oxygen so that the extra protons are absorbed"],"e":"An equilibrium shifts to counteract a disturbance. CO2 is volatile, so the lungs can remove it. Carbonic acid and bicarbonate are also how most CO2 is transported."},{"id":"bl-in8","kind":"mcq","l":3,"topic":"Introduction to blood","q":"The three major formed elements and their main jobs are:","c":"Erythrocytes: gas transport; thrombocytes: clotting; leukocytes: immune responses","w":["Erythrocytes: clotting; thrombocytes: gas transport; leukocytes: immune responses","Erythrocytes: immune responses; thrombocytes: oncotic pressure; leukocytes: gas transport","Albumins: clotting; globulins: gas transport; fibrinogens: immunity"],"e":"Formed elements are the cells and cell fragments; albumins, globulins and fibrinogens are plasma proteins."},{"id":"bl-pl1","kind":"mcq","l":3,"topic":"Blood plasma","q":"Most blood proteins are produced by which organ(s)?","c":"Liver","w":["Endocrine glands","Kidneys","Spleen","Stomach"],"e":"The liver makes the lion's share. Kidneys, hematopoietic tissue and some endocrine glands make a minor portion; the stomach makes none."},{"id":"bl-pl2","kind":"mcq","l":3,"topic":"Blood plasma","q":"Select ALL correct pairs of plasma protein and function.","c":["Albumins: oncotic pressure","Alpha and beta globulins: transport and modulating immune responses","Gamma globulins (immunoglobulins): antibodies such as IgG, IgA and IgM","Fibrinogens: clotting"],"w":["Albumins: antibodies such as IgG, IgA and IgM","Fibrinogens: oncotic pressure and transport of lipids"],"e":"Oncotic pressure holds water in the vessels and balances blood hydrostatic pressure, which pushes water out."},{"id":"bl-pl3","kind":"mcq","l":3,"topic":"Blood plasma","q":"A patient's albumin is very low. What would you expect?","c":"Lower oncotic pressure, so fluid leaks out of the vessels into the tissues","w":["Poor clotting, because albumin normally forms the fibrin mesh at wounds","Fewer circulating antibodies, because albumins are the main immunoglobulins","Higher oncotic pressure, so more fluid is drawn into the vessels from the tissues"],"e":"Albumin favors water staying in the vasculature. With less of it, blood hydrostatic pressure wins and fluid moves out."},{"id":"bl-pl4","kind":"mcq","l":3,"topic":"Blood plasma","q":"Which is the correct breakdown of plasma?","c":"About 92% water, 7% proteins and 1 to 1.5% other solutes","w":["About 55% water, 45% proteins and under 1% other solutes","About 92% proteins, 7% water and 1 to 1.5% other solutes","About 70% water, 29% electrolytes and 1% dissolved proteins"],"e":"Other solutes: electrolytes, nutrients, wastes, hormones and signaling molecules."},{"id":"bl-fe1","kind":"mcq","l":3,"topic":"Formed elements","q":"Leukocytes are the product of which stem cells?","c":"Myeloid and lymphoid stem cells","w":["Erythroid and megakaryocyte progenitors","Lymphoid stem cells only","Myeloid stem cells only"],"e":"Myeloid stem cells give the granular leukocytes and monocytes; lymphoid stem cells give the lymphocytes (T, B and NK cells). So both."},{"id":"bl-fe2","kind":"mcq","l":3,"topic":"Formed elements","q":"Order the leukocytes from most to least abundant.","c":"Neutrophils → lymphocytes → monocytes → eosinophils → basophils","w":["Lymphocytes → neutrophils → monocytes → basophils → eosinophils","Neutrophils → monocytes → lymphocytes → eosinophils → basophils","Basophils → eosinophils → monocytes → lymphocytes → neutrophils"],"e":"Mnemonic: Never Let Monkeys Eat Bananas."},{"id":"bl-fe3","kind":"mcq","l":3,"topic":"Formed elements","q":"Select ALL current uses of a blood smear.","c":["A follow-up to a complete blood count (CBC)","Estimating the relative abundances of formed elements","Checking cell size and shape (microcytic, normocytic, macrocytic)","Looking for blood parasites"],"w":["Measuring blood pH and bicarbonate levels","Determining ABO blood type and Rh status before a transfusion"],"e":"The smear was the original CBC. Abnormally small (microcytic) or large (macrocytic) cells can point to various pathologies."},{"id":"bl-fe4","kind":"mcq","l":3,"topic":"Formed elements","q":"On a blood smear, erythrocytes that are abnormally large are described as:","c":"Macrocytic","w":["Microcytic","Normocytic","Polycythemic"],"e":"Micro = abnormally small; normo = typical; macro = abnormally large."},{"id":"bl-fe5","kind":"mcq","l":3,"topic":"Formed elements","q":"Select ALL formed elements that come from myeloid stem cells.","c":["Erythrocytes","Thrombocytes","Neutrophils, eosinophils and basophils","Monocytes","Mast cells"],"w":["T cells (helper and cytotoxic)","B cells","Natural killer cells"],"e":"Myeloid stem cells give nearly everything except most agranular leukocytes. Lymphoid stem cells give the lymphocytes: T cells, B cells (→ plasma cells) and NK cells."},{"id":"bl-fe6","kind":"mcq","l":3,"topic":"Formed elements","q":"How does the main site of hematopoiesis change over a lifetime?","c":"Yolk sac (first trimester) → liver and spleen (second trimester) → red bone marrow, which dominates after birth","w":["Red bone marrow (first trimester) → liver and spleen (second trimester) → yolk sac, which dominates after birth","Spleen (first trimester) → yolk sac (second trimester) → liver, which dominates after birth","Lymph nodes (first trimester) → yolk sac (second trimester) → red bone marrow, which dominates after birth"],"e":"After birth, red bone marrow (hematopoietic connective tissue) of the vertebrae, pelvis, sternum and ribs is the main source; the long bones decline with age."},{"id":"bl-fe7","kind":"mcq","l":3,"topic":"Formed elements","q":"Which growth factor stimulates production of thrombocytes?","c":"Thrombopoietin (TPO)","w":["Erythropoietin (EPO)","Interleukins","Hypoxia-inducible factors"],"e":"EPO → erythrocytes. TPO → thrombocytes. Interleukins → mitosis and development of hemopoietic cells (notably leukocytes)."},{"id":"bl-fe8","kind":"mcq","l":3,"topic":"Formed elements","q":"Hemopoiesis mainly begins in which tissue after birth?","c":"Red bone marrow","w":["Yolk sac","Liver","Yellow bone marrow"],"e":"Red bone marrow, also called hematopoietic connective tissue, in the epiphyses and metaphyses of long bones and in flat bones."},{"id":"bl-er1","kind":"mcq","l":3,"topic":"Erythrocytes","q":"Low levels of what substance will immediately increase the production of erythropoietin?","c":"Oxygen","w":["Carbon dioxide","Iron","Magnesium","Phosphate"],"e":"Hypoxia drives EPO release from the peritubular interstitial cells (fibroblasts) of the kidneys, with hypoxia-inducible factors (HIF)."},{"id":"bl-er2","kind":"mcq","l":3,"topic":"Erythrocytes","q":"Select ALL correct statements about erythrocyte structure.","c":["They are biconcave discs, which minimizes the diffusion distance for oxygen","They are 7 to 8 µm across, just fitting through 5 to 10 µm capillaries","They are anucleate and lack mitochondria","They are essentially bags of hemoglobin"],"w":["They have many mitochondria to power oxygen transport","They live about 7 to 10 days before the spleen removes them"],"e":"They live about 120 days on average and are made at about 2 million per second."},{"id":"bl-er3","kind":"mcq","l":3,"topic":"Erythrocytes","q":"The average lifespan of an erythrocyte is about:","c":"120 days","w":["7 to 10 days","Less than a week","1 to 2 years"],"e":"7 to 10 days is thrombocytes; under a week is neutrophils; 1 to 2 years is basophils."},{"id":"bl-er4","kind":"mcq","l":3,"topic":"Erythrocytes","q":"In an adult, erythropoietin is secreted mainly by:","c":"Peritubular interstitial cells (fibroblasts) of the kidneys","w":["Hepatocytes of the liver, around the central veins","Megakaryocytes in the red bone marrow","Juxtaglomerular (granular) cells of the kidney's afferent arteriole"],"e":"In the fetus, perisinusoidal cells of the liver secrete it. EPO can rise from about 10 to 10,000 mU/mL in hypoxia."},{"id":"bl-er5","kind":"mcq","l":3,"topic":"Erythrocytes","q":"Normal hematocrit is about 38 to 54%. Select ALL correct statements.","c":["Below the range is anemia; above it is polycythemia","Hematocrit can change through RBC numbers or plasma volume (e.g. hemorrhage, dehydration)","Below about 15% risks cardiac failure; above about 60% risks spontaneous clotting","After a hemorrhage, plasma recovers quickly but RBCs take about 10 days"],"w":["Dehydration lowers hematocrit by removing red blood cells from the circulation","Hematocrit is the percentage of blood volume made up of leukocytes"],"e":"Hematocrit = percentage of RBCs of total blood volume. Dehydration loses plasma, which raises the percentage. Erythropoiesis takes about 10 days."},{"id":"bl-er6","kind":"mcq","l":3,"topic":"Erythrocytes","q":"Right after a large hemorrhage, blood volume returns within a day or so but the patient stays anemic for over a week. Why?","c":"Plasma returns quickly, but erythropoiesis takes about 10 days to replace red cells","w":["The spleen destroys the newly made red blood cells for about a week after bleeding","EPO is released only once hematocrit drops below 15%, about a week later","Red blood cells are replaced first, within a day, and plasma lags behind for a week"],"e":"Replacing plasma before red cells dilutes the remaining RBCs, so hematocrit stays low until erythropoiesis catches up."},{"id":"bl-hb1","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Which hemoglobin type is dominant in a fetus during the third trimester?","c":"2α2γ","w":["2α2β","2α2δ","2α2ε"],"e":"2α2γ = fetal hemoglobin (HbF). 2α2β = adult HbA (97 to 98% of adult Hb). 2α2δ = HbA2. Beta overtakes gamma about four weeks after birth."},{"id":"bl-hb2","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Which statement correctly distinguishes hypoxemia from hypoxia?","c":"Hypoxemia is low oxygen in the blood; hypoxia is low oxygen in the tissues, from anemia, ischemia, poisoning or low output","w":["Hypoxemia is low oxygen in the tissues; hypoxia is low oxygen in the blood, from anemia, ischemia, poisoning or low output","They are synonyms for low oxygen anywhere in the body, whether in the blood or in the tissues","Hypoxemia is low oxygen in the blood; hypoxia is low CO2 in the tissues, caused mainly by hyperventilation"],"e":"An anemic patient's fewer RBCs may be fully loaded with oxygen (normal blood oxygen per cell) yet still deliver too little to tissues, which is hypoxia."},{"id":"bl-hb3","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Why do humans need oxygen?","c":"It is the terminal proton acceptor in chemiosmosis, so mitochondria can make much ATP","w":["It is needed to build the heme group of hemoglobin inside developing red blood cells","It buffers blood pH by combining with excess protons in the plasma to form water","It drives the kidneys to produce erythropoietin whenever blood levels rise"],"e":"Without oxygen, metabolically active tissues don't have enough energy."},{"id":"bl-hb4","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Select ALL correct statements about hemoglobin's structure and genetics.","c":["It is a heterotetramer of four polypeptides, each with an iron-containing heme","Every type has two alpha chains plus two of another chain (beta, delta or gamma)","Alpha globin is coded on chromosome 16; beta and beta-like globins on chromosome 11","It is about a third of an erythrocyte's weight and nearly all of its dry weight"],"w":["Adult hemoglobin A is 2α2γ, with the gamma chains coded on chromosome 16","All four globin chains are coded on chromosome 11, with no chains from chromosome 16"],"e":"About 280 million Hb molecules per RBC; about 33% of the cell's weight vs. 96% dehydrated."},{"id":"bl-hb5","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Select ALL correct pairs of binding type and molecule.","c":["Cooperative: O2 (each bound O2 raises affinity for more)","Competitive: CO (binds the heme site in place of O2)","Allosteric: CO2 and H+ (and nitric oxide), at other sites that change O2 binding"],"w":["Competitive: CO2 (binds the heme site in place of O2)","Cooperative: CO (each bound CO raises affinity for O2)"],"e":"Most CO2 travels as bicarbonate; about 10 to 20% is carried by hemoglobin. Binding H+ lets hemoglobin act a little as a pH buffer."},{"id":"bl-hb6","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Near metabolically active tissues (higher temperature, higher CO2, lower pH), what happens to hemoglobin's affinity for oxygen?","c":"It decreases (a right shift), so hemoglobin unloads oxygen to the tissues","w":["It increases (a left shift), so hemoglobin holds on to oxygen more tightly there","It stays the same; only carbon monoxide can change hemoglobin's affinity","It increases (a right shift), which is why active tissues receive more oxygen"],"e":"Lung conditions (cooler, lower CO2, higher pH) shift the curve left for loading. Tissue conditions shift it right for unloading."},{"id":"bl-hb7","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Why is carbon monoxide so dangerous?","c":"Hemoglobin binds CO about 240 times more strongly than O2, so CO fills heme sites and O2 delivery falls","w":["CO destroys erythrocytes directly by hemolysis, so hemoglobin spills into the plasma and is filtered out","CO binds the globin chains, not heme, and blocks the CO2 that hemoglobin carries back to the lungs","CO lowers blood pH below 7.35 by forming carbonic acid, so hemoglobin's heme groups denature"],"e":"CO is colorless, odorless and tasteless, made by incomplete combustion (furnaces, heaters, generators, grills). CO detectors save lives."},{"id":"bl-hb8","kind":"mcq","l":3,"topic":"Hemoglobin","q":"Which set lists symptoms of carbon monoxide poisoning?","c":"Headache, dizziness, nausea, confusion, chest pain, dyspnea, ataxia, seizures, coma","w":["Fever, rash, joint pain, swollen lymph nodes, sore throat, muscle aches, night sweats","Jaundice, itching, dark urine, pale stools, abdominal pain, fatigue and weight loss","Bleeding gums, easy bruising, nosebleeds, petechiae, heavy periods and blood in the urine"],"e":"Because CO is undetectable by the senses, symptoms are often the first sign."},{"id":"bl-hb9","kind":"mcq","l":3,"topic":"Hemoglobin","q":"About what percentage of adult hemoglobin is HbA (2α2β)?","c":"97 to 98%","w":["About 50%","About 75%","About 33%"],"e":"HbA2 (2α2δ) and a little HbF (2α2γ) make up the rest."},{"id":"bl-bt1","kind":"mcq","l":3,"topic":"Blood type","q":"For which blood type would it be easiest to find a transfusion donor?","c":"Type AB","w":["Type A","Type B","Type O negative"],"e":"AB has no anti-A or anti-B antibodies, so it can receive A, B, AB or O: the universal recipient. Type O can receive only O."},{"id":"bl-bt2","kind":"mcq","l":3,"topic":"Blood type","q":"Which statement about how blood groups are determined is correct?","c":"They are based on RBC surface antigens (agglutinogens); an antibody meeting its antigen causes agglutination","w":["They are based on antibodies on the surface of leukocytes; an antigen meeting its antibody causes hemolysis","There are only two systems, ABO and Rh, both based on plasma proteins that make blood clot when mismatched","They are based on the hemoglobin type inside the RBC; a mismatch makes donor hemoglobin hold oxygen too tightly"],"e":"Over 100 genetically identified blood types and about 35 recognized systems. ABO and Rh are the two most important for crossmatching."},{"id":"bl-bt3","kind":"mcq","l":3,"topic":"Blood type","q":"Select ALL correct pairs of ABO type and plasma antibodies.","c":["Type A: anti-B","Type B: anti-A","Type AB: neither anti-A nor anti-B","Type O: both anti-A and anti-B"],"w":["Type O: neither","Type AB: both anti-A and anti-B"],"e":"People typically carry IgM against the A/B antigen they don't have. ABO antigens are glycosphingolipids."},{"id":"bl-bt4","kind":"mcq","l":3,"topic":"Blood type","q":"A type B patient is given whole blood from a type A donor. What happens?","c":"The patient's anti-A antibodies agglutinate the donor's red cells, a potentially lethal reaction","w":["Nothing happens, because types A and B share the same agglutinogens on their red cells","The donor's anti-B antibodies destroy only the patient's leukocytes, a mild reaction","The patient's anti-B antibodies agglutinate the donor's red cells, a potentially lethal reaction"],"e":"Always ask: does the recipient's plasma have antibodies against the donor's RBC antigens? A crossmatch (donor RBCs + recipient plasma) tests this directly."},{"id":"bl-bt5","kind":"mcq","l":3,"topic":"Blood type","q":"Type O is called the universal donor because:","c":"Its red cells carry neither A nor B antigen","w":["Its plasma has no anti-A or anti-B antibodies","Its red cells carry both A and B antigens","It is Rh negative by definition, so it lacks the D antigen"],"e":"Type O plasma has both anti-A and anti-B, which is why O can receive only O."},{"id":"bl-bt6","kind":"mcq","l":3,"topic":"Blood type","q":"A crossmatch test mixes:","c":"Donor red cells with recipient plasma","w":["Donor plasma with recipient red cells","Donor and recipient leukocytes","Recipient red cells with anti-Rh serum"],"e":"No agglutination = safe to transfuse. Most transfusions today are packed RBCs or fresh frozen plasma; whole blood is rare."},{"id":"bl-bt7","kind":"mcq","l":3,"topic":"Blood type","q":"Why can an Rh− mother's antibodies harm an Rh+ fetus when ABO antibodies usually don't?","c":"Anti-Rh antibodies include IgG, small enough to cross the placenta; ABO antibodies are IgM, too large to cross","w":["Rh antigens are small glycosphingolipids that cross the placenta; ABO antigens are too large to cross","The fetus makes anti-Rh antibodies against the mother, which then cross back to attack its own red cells","Anti-Rh antibodies are IgM, small enough to cross the placenta; ABO antibodies are IgG, too large to cross"],"e":"Hemolytic disease of the newborn: after fetal blood reaches the mother, she makes anti-Rh antibodies; the IgG crosses the placenta and causes hemolysis and agglutination. Most common in later pregnancies; prevented by RhoGAM."},{"id":"bl-bt8","kind":"mcq","l":3,"topic":"Blood type","q":"Hemolytic disease of the newborn is a risk in which pregnancy?","c":"An Rh− mother with an Rh+ fetus","w":["An Rh+ mother with an Rh− fetus","A type O mother with a type O fetus","An Rh+ mother with an Rh+ fetus"],"e":"RhoGAM given to Rh− mothers prevents the immune response."},{"id":"bl-bt9","kind":"mcq","l":3,"topic":"Blood type","q":"Rh antigens are:","c":"Integral membrane proteins","w":["Glycosphingolipids","IgM antibodies","Plasma proteins made by the liver"],"e":"ABO antigens are glycosphingolipids; Rh antigens are proteins in the RBC membrane."},{"id":"bl-lk1","kind":"mcq","l":3,"topic":"Leukocytes","q":"Which leukocyte would you presume to be the most abundant in the blood smear?","c":"Neutrophils","w":["Basophils","Eosinophils","Lymphocytes","Monocytes"],"e":"Neutrophils ~60%, lymphocytes ~25%, monocytes ~10%, eosinophils ~3%, basophils <1%."},{"id":"bl-lk2","kind":"mcq","l":3,"topic":"Leukocytes","q":"Select ALL correct pairs of leukocyte and feature.","c":["Neutrophil: multilobed nucleus, phagocytic, first on the scene, dead ones make pus","Eosinophil: major basic protein kills endoparasites such as schistosomes","Basophil: releases histamine and heparin; lives 1 to 2 years","Monocyte: becomes a macrophage or dendritic cell in tissues","Lymphocyte: never phagocytic; basis of acquired immunity"],"w":["Basophil: the most abundant leukocyte, living only a few hours","Lymphocyte: the main phagocyte of bacteria, whose dead cells make pus"],"e":"Neutrophils <1 week; eosinophils <2 weeks; monocytes <3 days in blood but months as macrophages; basophils 1 to 2 years."},{"id":"bl-lk3","kind":"mcq","l":3,"topic":"Leukocytes","q":"Eosinophils release both leukotrienes and histaminidase. What is the effect on allergies?","c":"Leukotrienes exacerbate allergic responses while histaminidase breaks down histamine and slows them","w":["Both slow allergic responses: leukotrienes and histaminidase each break down histamine","Both exacerbate allergic responses: leukotrienes and histaminidase each release histamine","Histaminidase exacerbates allergic responses while leukotrienes break down histamine and slow them"],"e":"Eosinophils are found in blood and especially mucosae, with limited phagocytosis. Major basic protein is their anti-parasite weapon."},{"id":"bl-lk4","kind":"mcq","l":3,"topic":"Leukocytes","q":"How do basophils contribute to anaphylaxis?","c":"Once activated, they stimulate IgE that binds mast cells, which then release histamine","w":["They phagocytose allergens and present them to helper T cells, which then release histamine","They release major basic protein, which dilates blood vessels and drops blood pressure suddenly","They become plasma cells that secrete IgG, which attaches to mast cells and releases histamine"],"e":"Basophils amplify allergies (e.g. food allergies) and help fight ectoparasites such as fleas and ticks. They are mostly in the blood and rare in tissues."},{"id":"bl-lk5","kind":"mcq","l":3,"topic":"Leukocytes","q":"Movement of a leukocyte toward a chemical signal is called:","c":"Chemotaxis","w":["Emigration (diapedesis)","Phagocytosis","Degranulation"],"e":"Chemotaxis draws the cell to the site; emigration is leaving the vessel into tissue; phagocytosis is “cell eating”."},{"id":"bl-lk6","kind":"mcq","l":3,"topic":"Leukocytes","q":"Which cells become antigen-presenting cells (APCs) that link innate and adaptive immunity?","c":"Dendritic cells derived from monocytes","w":["Neutrophils derived from myeloid stem cells","Basophils","Natural killer cells"],"e":"Monocytes mature in tissues into macrophages (fixed or wandering) or dendritic cells, which present pieces of pathogens to lymphocytes."},{"id":"bl-lk7","kind":"mcq","l":3,"topic":"Leukocytes","q":"Select ALL correct statements about lymphocytes.","c":["T cells include helper, cytotoxic and suppressor (regulatory) types","B cells become plasma cells that secrete antibodies","Natural killer cells act in innate immunity without prior exposure","About 90% in blood are small; large ones are activated"],"w":["Lymphocytes come from myeloid stem cells, like neutrophils","Lymphocytes are the most phagocytic leukocyte in the blood"],"e":"Lymphocytes come from lymphoid stem cells, are found in blood, lymph and tissues, and are about 25% of WBCs."},{"id":"bl-lk8","kind":"mcq","l":3,"topic":"Leukocytes","q":"A WBC count above about 11,000/µL is called:","c":"Leukocytosis","w":["Leukopenia","Thrombocytosis","Polycythemia"],"e":"Leukopenia is below about 4,000/µL. The same pattern applies to each type (neutropenia, monocytosis, etc.)."},{"id":"bl-lk9","kind":"mcq","l":3,"topic":"Leukocytes","q":"Which leukocytes are granular?","c":"Neutrophils, eosinophils and basophils","w":["Monocytes, lymphocytes and basophils","Neutrophils, eosinophils and lymphocytes","Monocytes, eosinophils and basophils"],"e":"Granular: neutrophils, eosinophils, basophils (all myeloid). Agranular: monocytes (myeloid) and lymphocytes (lymphoid)."},{"id":"bl-th1","kind":"mcq","l":3,"topic":"Thrombocytes","q":"With which blood protein must thrombocytes interact to form a clot?","c":"Fibrin","w":["Albumin","IgG","IgM"],"e":"Fibrin forms the mesh that traps and anchors thrombocytes. Albumin is for oncotic pressure; IgG and IgM are antibodies."},{"id":"bl-th2","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Select ALL correct statements about thrombocytes.","c":["They are anucleate fragments of cytoplasm from megakaryocytes","They work in hemostasis by degranulating clot-promoting substances","They live about 7 to 10 days","The spleen stores them and removes old ones"],"w":["They are the least abundant formed element in blood","They are made from lymphoid stem cells in the thymus"],"e":"Thrombocytes (150,000 to 400,000/µL) are less abundant than RBCs but more abundant than WBCs, and come from the myeloid line."},{"id":"bl-th3","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Trace thrombocyte development.","c":"Pluripotent stem cell → myeloid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","w":["Pluripotent stem cell → lymphoid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → megakaryocyte → megakaryoblast → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → monoblast → monocyte → proplatelets shed into lymph node sinuses → platelets"],"e":"Thrombopoietin (TPO) increases megakaryocyte formation and activates them. Splenic macrophages phagocytize old thrombocytes."},{"id":"bl-th4","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Thrombopoietin (TPO):","c":"Increases megakaryocyte formation and activates megakaryocytes","w":["Stimulates erythrocyte production by acting on the kidneys","Converts fibrinogen to fibrin at the site of a vascular injury","Breaks down old platelets in the spleen and recycles their iron"],"e":"EPO is for RBCs; thrombin converts fibrinogen; splenic macrophages remove old platelets."},{"id":"bl-th5","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Put the clotting steps in order.","c":"Injury → platelets bind exposed collagen via vWF → platelets form pseudopodia and degranulate → thrombin converts fibrinogen to fibrin → fibrin mesh traps more platelets","w":["Injury → platelets bind exposed collagen via vWF → thrombin converts fibrin to fibrinogen → platelets form pseudopodia and degranulate → fibrinogen mesh traps more platelets","Injury → platelets bind exposed albumin via vWF → platelets form pseudopodia and degranulate → albumin converts fibrinogen to fibrin → albumin mesh traps more platelets","Injury → fibrin binds exposed collagen directly → vWF converts fibrinogen to fibrin → platelets form pseudopodia and degranulate → the mesh traps more platelets"],"e":"Fibrinogen is soluble; fibrin is insoluble and forms the mesh. Von Willebrand factor is the intermediate between collagen and platelets."},{"id":"bl-th6","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Thrombin converts:","c":"Soluble fibrinogen into insoluble fibrin","w":["Insoluble fibrin into soluble fibrinogen","Albumin into fibrin","Prothrombin into von Willebrand factor"],"e":"The insoluble fibrin mesh is the basis of the clot."},{"id":"bl-th7","kind":"mcq","l":3,"topic":"Thrombocytes","q":"A patient has 600,000 platelets/µL and is bleeding from a small wound that won't clot. How can too many platelets cause bleeding?","c":"Paradoxical bleeding: excess platelets overwhelm von Willebrand factor, so it can't bridge collagen and platelets","w":["The extra platelets use up all the plasma albumin, so oncotic pressure falls and the small wound keeps oozing","Too many platelets block the capillaries around the wound, so fibrinogen can't reach the injured site","The spleen destroys fibrinogen when platelet counts are high, so no fibrin mesh can form at the wound"],"e":"Thrombocytosis (>400,000/µL) risks spontaneous clotting (e.g. DVT → PE) or, paradoxically, dysfunctional clotting and bleeding."},{"id":"bl-th8","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Thrombocytopenia (<150,000/µL) mainly increases the risk of:","c":"Bleeding or hemorrhage","w":["Spontaneous clotting in the veins","Deep vein thrombosis","Polycythemia"],"e":"-penia = shortage. Spontaneous clotting is a risk of thrombocytosis."},{"id":"bl-th9","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Which is a spontaneous-clotting risk of thrombocytosis?","c":"Deep vein thrombosis that can embolize to the lungs","w":["Hemolytic disease of the newborn in later pregnancies","Carbon monoxide poisoning","Leukopenia from crowding out of the marrow"],"e":"A DVT of the lower limb can travel through the heart into the pulmonary arteries, a life-threatening pulmonary embolism."},{"id":"pc-x1","kind":"mcq","l":1,"topic":"Pericardium","q":"Select ALL correct statements about the location and gross structure of the pericardium.","c":["It is a sac surrounding the heart within the middle mediastinum","Inferiorly it is associated with and fused to the diaphragm","It has a tough outer fibrous layer and an inner serous layer"],"w":["It lies in the anterior mediastinum, directly behind the sternum only","It is part of the myocardium, fused to the cardiac muscle"],"e":"The pericardium defines the middle mediastinum. The fibrous pericardium is fused to the diaphragm below; the serous pericardium has parietal and visceral (epicardium) layers."},{"id":"au-x3","kind":"mcq","l":1,"topic":"Auscultation","q":"Select ALL correct statements about the heart sounds.","c":["S1 (lub) and S2 (dub) are the normal heart sounds","S3 and S4 are extra sounds, also called gallops","Murmurs are abnormal sounds that in adults most often point to a valve disorder"],"w":["S1 is the louder sound because the semilunar valves close","S3 and S4 are always normal findings in older adults"],"e":"S3 = Kentucky gallop (ventricular filling); S4 = Tennessee gallop (atrium contracting into a stiff ventricle). Murmurs are common and usually benign in children."},{"id":"v-il9","kind":"mcq","l":2,"topic":"Common iliac artery","q":"At about which vertebral level does the abdominal aorta bifurcate into the common iliac arteries?","c":"L4","w":["T12","L1","S2"],"e":"T12 is the aortic hiatus. After the L4 bifurcation, the common iliac arteries split again at the pelvic brim."},{"id":"v-sc11","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"Select ALL correct statements about the overall pattern of blood supply to the upper limb.","c":["One continuous vessel changes name: subclavian, then axillary, then brachial","The name changes at landmarks: lateral margin of rib 1 (axillary), teres major (brachial)","The brachial artery ends near the cubital fossa by dividing into radial and ulnar arteries","The radial and ulnar arteries feed the palmar arches, which may anastomose"],"w":["The upper limb gets most of its blood from the internal thoracic artery","The axillary artery divides into radial and ulnar arteries in the axilla"],"e":"Subclavian → axillary → brachial → radial + ulnar → palmar arches. Deep veins follow the same pattern as venae comitantes."},{"id":"bl-in9","kind":"mcq","l":3,"topic":"Introduction to blood","q":"Rank the formed elements from most to least abundant, with their approximate counts.","c":"Erythrocytes (4.8 to 5.4 million/µL) → thrombocytes (150,000 to 400,000/µL) → leukocytes (5,000 to 10,000/µL)","w":["Leukocytes (4.8 to 5.4 million/µL) → thrombocytes (150,000 to 400,000/µL) → erythrocytes (5,000 to 10,000/µL)","Thrombocytes (4.8 to 5.4 million/µL) → erythrocytes (150,000 to 400,000/µL) → leukocytes (5,000 to 10,000/µL)","Erythrocytes (4.8 to 5.4 million/µL) → leukocytes (150,000 to 400,000/µL) → thrombocytes (5,000 to 10,000/µL)"],"e":"Leukocytes are the least abundant even though they come in five types."},{"id":"bl-fe9","kind":"mcq","l":3,"topic":"Formed elements","q":"Select ALL correct statements about the formed elements.","c":["Erythrocytes are the most abundant and transport gases","Thrombocytes are the next most abundant and work in clotting","Leukocytes are the least abundant and handle immune responses","There are five major types of leukocytes"],"w":["Thrombocytes are complete cells with nuclei","Leukocytes are the most abundant formed element"],"e":"Erythrocytes and thrombocytes are anucleate. The five leukocytes: neutrophils, lymphocytes, monocytes, eosinophils, basophils."},{"id":"bl-bt10","kind":"mcq","l":3,"topic":"Blood type","q":"Blood types are categories based on:","c":"Surface antigens (agglutinogens) on red blood cells","w":["The type of hemoglobin inside the red blood cells","The number and kind of leukocytes in a sample","The clotting proteins made by the liver and found in plasma"],"e":"An antibody meeting the antigen it recognizes causes a reaction such as agglutination or complement-mediated destruction."},{"id":"bl-th10","kind":"mcq","l":3,"topic":"Thrombocytes","q":"Thrombocytes are best described as:","c":"Anucleate pieces of cytoplasm shed from megakaryocytes","w":["Small nucleated cells that develop from lymphoid stem cells","Immature erythrocytes that still hold their ribosomes","Granular leukocytes released from the red bone marrow"],"e":"Also called platelets; they work in hemostasis by degranulating clot-promoting substances."},{"id":"v-vs15","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Which layer helps pull an artery wall back together after it is deformed?","c":"Tunica externa (elastin and collagen)","w":["Tunica media (smooth muscle)","Tunica interna (endothelium)","Basement membrane of the endothelium"],"e":"The tunica externa's elastin and collagen help the wall recoil after deformation. The media's smooth muscle sets vessel diameter under autonomic control; the elastic laminae add elasticity."},{"id":"v-vs16","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Structurally, a capillary is like an artery that has lost which layers?","c":"Tunica externa, tunica media and the internal elastic lamina","w":["Only the tunica externa, keeping the media and elastic lamina","The endothelium and basement membrane, keeping the media","Tunica interna and tunica media, keeping the externa"],"e":"A capillary wall is just tunica interna: endothelium on a basement membrane. Strip an artery of its externa, media and internal elastic lamina and that is what is left."},{"id":"v-vs17","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"How does breathing (respiratory milking) help return venous blood to the heart?","c":"The diaphragm changes cavity volume, and so the pressure on the veins","w":["The lungs squeeze the venae cavae directly with each breath","Inhaled oxygen makes venous smooth muscle contract","The intercostal arteries pump blood into the azygos veins"],"e":"As the diaphragm moves, thoracic and abdominal cavity volumes change, changing pressure and drawing venous blood toward the heart. Muscle milking is the other pump: skeletal muscle squeezing nearby veins."},{"id":"v-ao8","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Which branch of the abdominal aorta arises at about L3 and supplies the hindgut?","c":"Inferior mesenteric a.","w":["Superior mesenteric a.","Celiac trunk","Gonadal aa."],"e":"Celiac trunk ~T12 (foregut), superior mesenteric a. ~L1 (midgut), inferior mesenteric a. ~L3 (hindgut: last third of the transverse colon to the rectum)."},{"id":"v-ao9","kind":"mcq","l":2,"topic":"Aorta and branches","q":"The superior mesenteric artery arises at about which level, and what does it supply?","c":"About L1; the midgut","w":["About T12; the foregut","About L3; the hindgut","About L2; the gonads"],"e":"SMA ~L1 → midgut (distal duodenum to about two thirds of the transverse colon). Renal aa. also arise ~L1; gonadal aa. ~L2."},{"id":"v-ao10","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Which opening in the diaphragm is the lowest?","c":"Aortic hiatus (T12)","w":["Esophageal hiatus (T10)","Caval opening (T8)","Sternocostal hiatus (T7)"],"e":"Caval opening T8, esophageal hiatus T10, aortic hiatus T12 (“I 8 10 eggs at 12”). The thoracic aorta is above the diaphragm; below the aortic hiatus it is the abdominal aorta."},{"id":"v-sc12","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"The second part of the axillary artery lies:","c":"Posterior to pectoralis minor","w":["Medial to pectoralis minor","Lateral to pectoralis minor","Posterior to the anterior scalene"],"e":"Pectoralis minor defines the axillary artery's parts: 1st medial to it (from the lateral margin of rib 1), 2nd posterior to it, 3rd lateral to it (to teres major). The anterior scalene defines the subclavian artery's parts."},{"id":"v-iv8","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"The inferior vena cava is formed by the union of the:","c":"Common iliac veins","w":["External iliac veins","Internal iliac veins","Left and right renal veins"],"e":"The internal and external iliac veins join to form each common iliac vein, and the two common iliac veins unite to form the IVC."},{"id":"v-iv9","kind":"mcq","l":2,"topic":"Inferior vena cava","q":"Which superficial vein passes the medial malleolus?","c":"Great saphenous v.","w":["Small saphenous v.","Popliteal v.","Femoral v."],"e":"Great saphenous v.: medial lower limb, past the medial malleolus, into the femoral v. Small saphenous v.: lateral, past the lateral malleolus, into the popliteal v."},{"id":"bl-lk10","kind":"mcq","l":3,"topic":"Leukocytes","q":"Emigration of a leukocyte means that it:","c":"Leaves the bloodstream to work in the tissues","w":["Moves toward a chemical signal","Engulfs and digests a pathogen","Releases the contents of its granules"],"e":"Emigration = leaving the vessel. Chemotaxis = moving toward a chemical signal; phagocytosis = cell eating; degranulation = releasing granule contents."},{"id":"bl-bt11","kind":"mcq","l":3,"topic":"Blood type","q":"A crossmatch shows no agglutination. What does that mean?","c":"The donor blood is safe to transfuse to that recipient","w":["The recipient has no plasma antibodies of any kind","The donor and recipient match for Rh type only","The donor's red cells must be washed before use"],"e":"A crossmatch mixes donor RBCs with recipient plasma. No agglutination means the recipient's antibodies don't attack the donor's cells, so the transfusion is safe."},{"id":"bl-th11","kind":"mcq","l":3,"topic":"Thrombocytes","q":"In terms of how the blood behaves, thrombocytopenia and thrombocytosis are:","c":"Thin blood and thick blood","w":["Thick blood and thin blood","Low WBCs and high WBCs","Anemia and polycythemia"],"e":"Too few platelets (<150k/µL) means bleeding risk, “thin blood”; too many (>400k/µL) means spontaneous clotting risk, “thick blood” (though paradoxical bleeding can occur)."},{"id":"b-cv1","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Arteries carry blood [[away from]] the heart; veins carry blood [[toward|towards|to]] the heart."},{"id":"b-cv2","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Blood is a [[liquid]] connective tissue made of [[plasma]] and [[formed elements]]."},{"id":"b-cv3","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Lymphatics pick up excess [[interstitial fluid|filtrate]] and return it to the [[venous|veins]] circulation."},{"id":"b-cv4","kind":"blank","l":1,"topic":"Cardiovascular system","s":"Exchange of nutrients and wastes happens in the [[capillary beds|capillaries]], between arterioles and [[venules]]."},{"id":"b-th1","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The thoracic cavity is bounded superiorly by the [[first ribs]] and inferiorly by the [[diaphragm]]."},{"id":"b-th2","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The [[parietal]] pleura adheres to the walls and the [[visceral]] pleura adheres to the lungs."},{"id":"b-th3","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The thoracic plane runs from the [[sternal angle|angle of louis]] to the intervertebral disc between [[T4 and T5|T4/T5|T4-T5]]."},{"id":"b-th4","kind":"blank","l":1,"topic":"Thoracic cavity","s":"The middle mediastinum is defined by the [[pericardium]]; the posterior mediastinum extends down to [[T12]]."},{"id":"b-pc1","kind":"blank","l":1,"topic":"Pericardium","s":"The visceral layer of the serous pericardium is also called the [[epicardium]]."},{"id":"b-pc2","kind":"blank","l":1,"topic":"Pericardium","s":"Between the parietal and visceral layers of serous pericardium is the [[pericardial cavity]]."},{"id":"b-pc3","kind":"blank","l":1,"topic":"Pericardium","s":"The fibrous pericardium is innervated by the [[phrenic]] nerves, from spinal levels [[C3 to C5|C3-C5|C3-5|C3, C4, C5]]."},{"id":"b-pc4","kind":"blank","l":1,"topic":"Pericardium","s":"Fluid that constricts the heart in the pericardial cavity causes cardiac [[tamponade]], treated by [[pericardiocentesis]]."},{"id":"b-pc5","kind":"blank","l":1,"topic":"Pericardium","s":"The amount of subserosal adipose tissue is proportional to [[cardiometabolic]] risk."},{"id":"b-hb1","kind":"blank","l":1,"topic":"Heart basics","s":"From outside in, the heart wall is the [[epicardium]], [[myocardium]] and [[endocardium]]."},{"id":"b-hb2","kind":"blank","l":1,"topic":"Heart basics","s":"The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."},{"id":"b-hb3","kind":"blank","l":1,"topic":"Heart basics","s":"Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."},{"id":"b-hb4","kind":"blank","l":1,"topic":"Heart basics","s":"Cells joined by gap junctions act as one, a [[functional syncytium]]."},{"id":"b-hb5","kind":"blank","l":1,"topic":"Heart basics","s":"The [[chordae tendineae]] ":"Coronary arteries","s":"The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."},{"id":"b-co3","kind":"blank","l":1,"topic":"Coronary arteries","s":"Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."},{"id":"b-co4","kind":"blank","l":1,"topic":"Coronary arteries","s":"The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery."},{"id":"b-ve1","kind":"blank","l":1,"topic":"Cardiac veins","s":"The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch."},{"id":"b-ve2","kind":"blank","l":1,"topic":"Cardiac veins","s":"Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium."},{"id":"b-ve3","kind":"blank","l":1,"topic":"Cardiac veins","s":"Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium."},{"id":"b-cc1","kind":"blank","l":1,"topic":"Conduction and control","s":"The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm."},{"id":"b-cc2","kind":"blank","l":1,"topic":"Conduction and control","s":"The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm."},{"id":"b-cc3","kind":"blank","l":1,"topic":"Conduction and control","s":"During [[isovolumetric]] ventricular contraction, all four valves are closed."},{"id":"b-cc4","kind":"blank","l":1,"topic":"Conduction and control","s":"Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]]."},{"id":"b-cc5","kind":"blank","l":1,"topic":"Conduction and control","s":"The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]]."},{"id":"b-cc6","k e inferior mesenteric a. the [[hindgut]]."},{"id":"b-v-cc1","kind":"blank","l":2,"topic":"Common carotid artery","s":"The [[maxillary]] artery supplies the deep face; the [[superficial temporal]] artery supplies the scalp."},{"id":"b-v-cc2","kind":"blank","l":2,"topic":"Common carotid artery","s":"The [[vertebral]] arteries enter the skull through foramen magnum and supply the [[posterior]] brain."},{"id":"b-v-il1","kind":"blank","l":2,"topic":"Common iliac artery","s":"The femoral artery becomes the popliteal artery at the [[adductor hiatus]]."},{"id":"b-v-il2","kind":"blank","l":2,"topic":"Common iliac artery","s":"The internal iliac artery has an [[anterior]] division serving pelvic viscera and perineum and a [[posterior]] division serving the posterior pelvic wall."},{"id":"b-v-sc1","kind":"blank","l":2,"topic":"Subclavian artery and upper limb","s":"The parts of the subclavian artery are defined by the [[anterior scalene]] muscle; the parts of the axillary artery by [[pectoralis minor|pec minor]]."},{"id":"b-v-sc2","kind":"blank","l":2,"topic":"Subclavian artery and upper limb","s":"The axillary artery becomes the brachial artery at [[teres major]]."},{"id":"b-v-sc3","kind":"blank","l":2,"topic":"Subclavian artery and upper limb","s":"The radial artery feeds the [[deep]] palmar arch; the ulnar artery feeds the [[superficial]] palmar arch."},{"id":"b-v-sc4","kind":"blank","l":2,"topic":"Subclavian artery and upper limb","s":"The [[Allen]] test checks for an anastomosis between the radial and [[ulnar]] arteries."},{"id":"b-v-sv1","kind":"blank","l":2,"topic":"Superior vena cava","s":"Each brachiocephalic vein is formed by the [[internal jugular]] vein and the [[subclavian]] vein, which meet at the venous angle."},{"id":"b-v-sv2","kind":"blank","l":2,"topic":"Superior vena cava","s":"The [[basilic]] vein joins the brachial veins to form the axillary vein; the [[cephalic]] vein drains into the axillary vein later."},{"id":"b-v-iv1","kind":"blank","l":2,"topic":"Inferior vena cava","s":"The IVC passes through the diaphragm at about [[T8]], the esophagus at [[T10]], and the aorta at [[T12]]."},{"id":"b-v-iv2","kind":"blank","l":2,"topic":"Inferior vena cava","s":"The left gonadal vein drains into the left [[renal]] vein; the right gonadal vein drains directly into the [[IVC|inferior vena cava]]."},{"id":"b-v-hp1","kind":"blank","l":2,"topic":"Hepatic portal system","s":"The hepatic portal vein is formed by the [[superior mesenteric]] vein and the [[splenic]] vein."},{"id":"b-v-hp2","kind":"blank","l":2,"topic":"Hepatic portal system","s":"Blood leaves the liver sinusoids through the [[hepatic]] veins into the [[IVC|inferior vena cava]]."},{"id":"b-bl-in1","kind":"blank","l":3,"topic":"Introduction to blood","s":"Whole blood is about [[55]]% plasma and [[45]]% formed elements."},{"id":"b-bl-in2","kind":"blank","l":3,"topic":"Introduction to blood","s":"Blood pH is kept between [[7.35]] and [[7.45]]; below that is acidemia and above it is alkalemia."},{"id":"b-bl-in3","kind":"blank","l":3,"topic":"Introduction to blood","s":"In acidemia the lungs [[hyperventilate]] to blow off CO2; in alkalemia they [[hypoventilate]] to retain it."},{"id":"b-bl-in4","kind":"blank","l":3,"topic":"Introduction to blood","s":"The [[lungs]] adjust blood pH quickly; the [[kidneys]] adjust it slowly."},{"id":"b-bl-pl1","kind":"blank","l":3,"topic":"Blood plasma","s":"[[Albumins|Albumin]] maintain oncotic pressure; [[fibrinogens|fibrinogen]] are needed for clotting."},{"id":"b-bl-pl2","kind":"blank","l":3,"topic":"Blood plasma","s":"Gamma globulins are also called [[immunoglobulins|antibodies]]."},{"id":"b-bl-fe1","kind":"blank","l":3,"topic":"Formed elements","s":"Leukocytes from most to least abundant: neutrophils, [[lymphocytes]], [[monocytes]], eosinophils, basophils."},{"id":"b-bl-fe2","kind":"blank","l":3,"topic":"Formed elements","s":"[[Lymphoid]] stem cells give rise to T cells, B cells and natural killer cells; [[myeloid]] stem cells give rise to nearly everything else."},{"id":"b-bl-fe3","kind":"blank","l":3,"topic":"Formed elements","s":"[[Erythropoietin|EPO]] stimulates red blood cell production; [[thrombopoietin|TPO]] stimulates platelet production."},{"id":"b-bl-er1","kind":"blank","l":3,"topic":"Erythrocytes","s":"Erythrocytes are [[biconcave]] discs that lack a [[nucleus]] and mitochondria."},{"id":"b-bl-er2","kind":"blank","l":3,"topic":"Erythrocytes","s":"Hematocrit below the normal range is [[anemia]]; above it is [[polycythemia]]."},{"id":"b-bl-hb1","kind":"blank","l":3,"topic":"Hemoglobin","s":"Adult hemoglobin A is [[2α2β|2 alpha 2 beta|2a2b]]; fetal hemoglobin is [[2α2γ|2 alpha 2 gamma|2a2g]]."},{"id":"b-bl-hb2","kind":"blank","l":3,"topic":"Hemoglobin","s":"Low oxygen in the blood is [[hypoxemia]]; low oxygen in the tissues is [[hypoxia]]."},{"id":"b-bl-hb3","kind":"blank","l":3,"topic":"Hemoglobin","s":"Hemoglobin's affinity for carbon monoxide is about [[240]] times its affinity for oxygen."},{"id":"b-bl-bt1","kind":"blank","l":3,"topic":"Blood type","s":"Type [[AB]] is the universal recipient; type [[O]] is the universal donor."},{"id":"b-bl-bt2","kind":"blank","l":3,"topic":"Blood type","s":"In hemolytic disease of the newborn, maternal [[IgG]] antibodies cross the placenta; it is prevented with [[RhoGAM]]."},{"id":"b-bl-lk1","kind":"blank","l":3,"topic":"Leukocytes","s":"Monocytes mature in tissues into [[macrophages]] or [[dendritic]] cells."},{"id":"b-bl-lk2","kind":"blank","l":3,"topic":"Leukocytes","s":"Eosinophils release major basic protein, which kills [[endoparasites|parasites]]; basophils release [[histamine]] and heparin."},{"id":"b-bl-th1","kind":"blank","l":3,"topic":"Thrombocytes","s":"Platelets are shed from [[megakaryocytes]] and old ones are removed by macrophages in the [[spleen]]."},{"id":"b-bl-th2","kind":"blank","l":3,"topic":"Thrombocytes","s":"Platelets bind exposed collagen through [[von Willebrand]] factor, and [[thrombin]] converts fibrinogen to fibrin."},{"id":"b-bl-th3","kind":"blank","l":3,"topic":"Thrombocytes","s":"Fewer than 150,000 platelets/µL is [[thrombocytopenia]]; more than 400,000/µL is [[thrombocytosis]]."}];
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OWNER="a1be1e0f-896a-49c9-b997-a06979110fae";
const PAGE=40;
const st={l:0,show:"all",q:"",limit:PAGE,open:new Set()};
let notes=new Map(), token=null;

async function api(method,body,qs){
  const r=await fetch("/api/notes"+(qs||""),{method,cache:"no-store",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Couldn't reach the notes store.");
  return j;
}

function gate(html){$("gate").innerHTML=html;$("gate").hidden=false;$("app").hidden=true}
let started=null;
async function start(u){
  // the sign-in event repeats on token refreshes: only react when the account changes
  const who=u?u.id:"none";if(who===started)return;started=who;
  if(!u){gate('<p>Sign in with your GitHub account to use question notes.</p><a class="btn primary" href="/login?next=/exam-3/notes">Sign in</a>');return}
  if(u.id!==OWNER){gate('<p>Question notes are only for the site owner. Your progress on the practice page still saves as usual.</p><a class="btn" href="/exam-3/cardio">Back to Exam 3 practice</a>');return}
  try{
    const sb=await window.a403Sync.client();
    const {data}=await sb.auth.getSession();
    token=data.session&&data.session.access_token;
    const j=await api("GET");
    notes=new Map(j.notes.map(n=>[n.qid,n]));
  }catch(e){gate('<p>'+esc(e.message)+'</p><button class="btn" type="button" onclick="location.reload()">Try again</button>');return}
  $("gate").hidden=true;$("app").hidden=false;
  setup();render();
}

function setup(){
  $("new-l").innerHTML=LECTURES.filter(L=>L.ready).map(L=>`<option value="${L.n}">Cardio ${L.n} · ${esc(L.name)}</option>`).join("")+`<option value="0">Any lecture</option>`;
  $("new-save").onclick=async()=>{
    const t=$("new-t").value.trim();$("new-err").textContent="";
    if(!t){$("new-err").textContent="Write what the question should test first.";return}
    const l=$("new-l").value, qid="new:"+Math.random().toString(36).slice(2,10);
    $("new-save").disabled=true;
    try{const j=await api("PUT",{qid,note:t,snap:l==="0"?"New question, any lecture":"New question for Cardio "+l});notes.set(qid,j.note);$("new-t").value="";st.show="new";render()}
    catch(e){$("new-err").textContent=e.message}
    $("new-save").disabled=false;
  };
  $("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();st.limit=PAGE;render()};
  $("more").onclick=()=>{st.limit+=PAGE;render()};
}

const lecName=n=>(LECTURES.find(L=>L.n===n)||{}).name||"";
const blankHtml=s=>esc(s).replace(/\[\[([^\]]+)\]\]/g,(_,a)=>"<b>"+a.split("|")[0]+"</b>");
const plain=s=>String(s).replace(/\[\[([^\]]+)\]\]/g,(_,a)=>a.split("|")[0]);
const snapOf=x=>x.kind==="blank"?plain(x.s):x.q;
const hay=x=>(x.id+" "+(x.q||"")+" "+(x.s||"")+" "+[].concat(x.c||[]).join(" ")+" "+(x.w||[]).join(" ")+" "+(x.e||"")+" "+x.topic+" "+((notes.get(x.id)||{}).note||"")).toLowerCase();

function newItems(){return [...notes.values()].filter(n=>n.qid.startsWith("new:")).map(n=>({id:n.qid,kind:"new",l:0,topic:"",q:n.snap}))}
function pool(){
  const inL=x=>!st.l||x.l===st.l;
  const base=[...newItems(),...ITEMS].filter(x=>x.kind==="new"?!st.l||n2l(x)===st.l:inL(x));
  const has=x=>notes.has(x.id);
  const f={all:()=>true,notes:has,open:x=>has(x)&&notes.get(x.id).status==="open",done:x=>has(x)&&notes.get(x.id).status==="done",new:x=>x.kind==="new"};
  return {base,f};
}
const n2l=x=>{const m=/Cardio (\d)/.exec(x.q||"");return m?+m[1]:0};

function render(){
  const {base,f}=pool();
  $("lects").innerHTML=[{n:0,name:"All lectures",ready:true},...LECTURES.filter(L=>L.ready)].map(L=>`<button class="f" type="button" data-l="${L.n}" aria-pressed="${st.l===L.n}">${L.n?"Cardio "+L.n:"All lectures"}</button>`).join("");
  const shows=[["all","All"],["notes","With notes"],["open","Waiting for Claude"],["done","Updated"],["new","New requests"]];
  $("shows").innerHTML=shows.map(([k,t])=>`<button class="f" type="button" data-show="${k}" aria-pressed="${st.show===k}">${t}<span class="n">${base.filter(f[k]).length}</span></button>`).join("");
  $("lects").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.l=+b.dataset.l;st.limit=PAGE;render()});
  $("shows").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.show=b.dataset.show;st.limit=PAGE;render()});
  let rows=base.filter(f[st.show]);
  if(st.q)rows=rows.filter(x=>hay(x).includes(st.q));
  $("count").textContent=rows.length?(rows.length===1?"1 item":rows.length+" items"):"";
  $("list").innerHTML=rows.length?rows.slice(0,st.limit).map(card).join(""):'<div class="item"><p style="margin:0;color:var(--x-muted)">Nothing here'+(st.q?" for that search":"")+'.</p></div>';
  $("more").hidden=rows.length<=st.limit;
  $("list").querySelectorAll(".item").forEach(wire);
}

function card(x){
  const n=notes.get(x.id), editing=st.open.has(x.id);
  let body="";
  if(x.kind==="mcq"){
    body=`<p class="qt">${esc(x.q)}</p><ul class="ans">${[].concat(x.c).map(a=>`<li>${esc(a)}</li>`).join("")}</ul><ul class="wr">${x.w.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`+
      (x.e?`<details class="ex"><summary>Explanation</summary><p>${esc(x.e)}</p></details>`:"");
  }else if(x.kind==="blank"){body=`<p class="qt blank">${blankHtml(x.s)}</p>`+(x.e?`<details class="ex"><summary>Explanation</summary><p>${esc(x.e)}</p></details>`:"")}
  else body=`<p class="qt">${esc(x.q)}</p>`;
  const tag=x.kind==="new"?`New question request <span>· ${esc(x.id.slice(4))}</span>`:
    `Cardio ${x.l} · ${esc(x.topic)} <span>· ${x.kind==="mcq"?"Multiple choice":"Fill in the blank"} · ${esc(x.id)}</span>`;
  let nh="";
  if(editing)nh=`<textarea aria-label="Note on ${esc(x.id)}" placeholder="What's wrong, unclear or missing?">${esc(n?n.note:"")}</textarea>
    <div class="row"><button class="btn primary quiet" data-act="save" type="button">Save note</button><button class="btn quiet" data-act="cancel" type="button">Cancel</button><p class="err" role="alert"></p></div>`;
  else if(n)nh=`<p class="st ${n.status}">${n.status==="done"?"Updated by Claude":"Waiting for Claude"}</p><div class="saved">${esc(n.note)}</div>`+
    (n.reply?`<div class="reply"><b>Claude</b>${esc(n.reply)}</div>`:"")+
    `<div class="row"><button class="btn quiet" data-act="edit" type="button">Edit note</button><button class="btn quiet" data-act="del" type="button">Delete note</button><p class="err" role="alert"></p></div>`;
  else nh=`<div class="row"><button class="btn quiet" data-act="edit" type="button">Add note</button></div>`;
  return `<article class="item${n?" has":""}" data-id="${esc(x.id)}"><p class="tag">${tag}</p>${body}<div class="note">${nh}</div></article>`;
}

function wire(el){
  const id=el.dataset.id, x=ITEMS.find(i=>i.id===id)||{kind:"new",q:(notes.get(id)||{}).snap||""};
  const err=()=>el.querySelector(".err");
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    const act=b.dataset.act;
    if(act==="edit"){st.open.add(id);const t=rerender(el,id).querySelector("textarea");t.focus();t.setSelectionRange(t.value.length,t.value.length);return}
    if(act==="cancel"){st.open.delete(id);rerender(el,id);return}
    b.disabled=true;
    try{
      if(act==="save"){
        const note=el.querySelector("textarea").value.trim();
        if(!note){err().textContent="Write a note first, or cancel.";b.disabled=false;return}
        const j=await api("PUT",{qid:id,note,snap:x.kind==="new"?(notes.get(id)||{}).snap:snapOf(x)});
        notes.set(id,j.note);st.open.delete(id);
      }
      if(act==="del"){
        if(!confirm("Delete this note?")){b.disabled=false;return}
        await api("DELETE",null,"?qid="+encodeURIComponent(id));notes.delete(id);
      }
      render();
    }catch(e){err().textContent=e.message;b.disabled=false}
  });
}
function rerender(el,id){
  const x=ITEMS.find(i=>i.id===id)||newItems().find(i=>i.id===id);
  const tmp=document.createElement("div");tmp.innerHTML=card(x);const nw=tmp.firstElementChild;el.replaceWith(nw);wire(nw);return nw;
}

const S=window.a403Sync;
if(!S){gate("<p>Sign-in didn't load. Reload the page to try again.</p>");return}
addEventListener("a403-auth",e=>start(e.detail));
if(S.ready())start(S.user());
})();
</script>
