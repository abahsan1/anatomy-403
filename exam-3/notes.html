const LECTURES=[{"n":1,"name":"The heart","ready":true},{"n":2,"name":"Vasculature","ready":true},{"n":3,"name":"Blood","ready":true},{"n":4,"name":"Lecture 4","ready":false},{"n":5,"name":"Lecture 5","ready":false},{"n":6,"name":"Lecture 6","ready":false}];
const ITEMS=[{"id":"cv1","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Select ALL correctly matched pairs of cardiovascular component and role.","c":["Heart: the ever-working pump that drives circulation","Vasculature: the vessel pathways that transport blood","Lymphatics: fluid return to the veins, plus immunity","Blood: a liquid connective tissue that transports, regulates and protects"],"w":["Interstitial fluid: carries blood back to the heart through the veins","Capillaries: carry blood away from the heart to the arterioles"],"e":"Heart = pump. Vasculature = pathways (arteries → arterioles → capillary beds → venules → veins). Blood = the vehicle (transport, regulation, protection). Lymphatics = reclamation of excess filtrate back to venous circulation, plus immunity. Interstitial fluid is the go-between that connects blood, active tissues and lymph."},{"id":"cv2","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Which fluid connects the functions of blood and lymphatic fluids?","c":"Interstitial fluid","w":["Blood plasma","Cerebrospinal fluid","Lymph"],"e":"Blood exchanges with the interstitial fluid around metabolically active cells; excess interstitial fluid that capillaries don't reabsorb is picked up by lymphatics. Filtrate is a kidney term."},{"id":"cv3","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Which is NOT one of the three functions of blood given in lecture?","c":"Contraction","w":["Transportation","Regulation","Protection"],"e":"Transportation (nutrients, hormones, wastes), regulation (e.g. a narrow pH of 7.35 to 7.45) and protection (clotting; part-time host to the immune system)."},{"id":"cv4","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Blood keeps its pH within which narrow range?","c":"7.35 to 7.45","w":["6.85 to 6.95","7.75 to 7.85","7.00 to 7.10"],"e":"Maintaining a narrow, physiologically neutral pH is part of blood's regulation function."},{"id":"cv5","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"The two major constituents of blood are:","c":"Plasma and formed elements","w":["Plasma and interstitial fluid","Formed elements and lymph","Red blood cells and platelets only"],"e":"Plasma = the fluid plus dissolved substances (proteins, electrolytes). Formed elements = blood cells and their derivatives, including platelets."},{"id":"cv6","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Because the heart never stops working, cardiac muscle relies on aerobic respiration and therefore has:","c":"A greater density of mitochondria","w":["More nuclei per cell than skeletal muscle","Large glycogen stores instead of mitochondria","No need for oxygen-rich blood"],"e":"Aerobic (O2-dependent) ATP production happens in mitochondria, so cardiac muscle has more, and larger, mitochondria."},{"id":"cv7","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Where does exchange between the blood and the interstitial fluid happen?","c":"Capillary beds","w":["Arteriole walls","Venules","Elastic arteries"],"e":"Arteries → arterioles → capillary beds (exchange) → venules → veins. Arteries carry blood away from the heart; veins carry it toward the heart."},{"id":"cv8","kind":"mcq","l":1,"topic":"Cardiovascular system","q":"Lymphatic vessels return excess filtrate to the:","c":"Venous circulation","w":["Arterial circulation","Capillary beds","Kidneys"],"e":"Lymphatics reclaim fluid the capillaries do not reabsorb and deliver it back to venous circulation in the thorax. They are sometimes considered a separate system because of their immune role."},{"id":"th1","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Select ALL correct boundaries of the thoracic cavity.","c":["Superior: the first ribs (root of the neck)","Inferior: the diaphragm","Anterior: the sternum","Posterior: the vertebral column","Lateral: the ribs and intercostal spaces"],"w":["Inferior: the twelfth ribs and the costal margin","Anterior: the clavicles and the manubrium only"],"e":"First ribs (superior), diaphragm (inferior), sternum (anterior), vertebral column (posterior), ribs and intercostal spaces (lateral). The upper limbs are superolateral and the abdominopelvic cavity is inferior."},{"id":"th2","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"The thoracic cavity is divided into which spaces?","c":"Two pulmonary cavities and a central mediastinum","w":["A superior mediastinum above an inferior mediastinum, with no pulmonary cavities","A pericardial cavity and two pleural cavities, with no mediastinum","Anterior and posterior pulmonary cavities around the heart"],"e":"Pulmonary cavities (lateral, contain the lungs, lined by pleurae) and the mediastinum (medial, contains the pericardium and heart, great vessels, nerves and other viscera)."},{"id":"th3","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Which statement about the pleurae is correct?","c":"Parietal pleura adheres to the walls, visceral pleura adheres to the lungs, and the pleural space lies between them","w":["Visceral pleura adheres to the walls, parietal pleura adheres to the lungs, and the pleural space lies outside both","Parietal pleura is fibrous connective tissue and visceral pleura is a serous membrane","Both layers adhere to the lungs, and the pleural space lies between the lungs and the ribs"],"e":"Pleurae are serous membranes. Parietal = walls (rib cage, diaphragm, mediastinum). Visceral = on the lungs. Pleural space = between the two layers."},{"id":"th4","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Every serous membrane in the thorax has which three components?","c":"A parietal layer, a visceral layer and a space between them","w":["A fibrous outer layer, a serous inner layer and a fat pad between them","An inner, middle and outer fibrous layer","A parietal layer, a visceral layer and a basement membrane between them"],"e":"Pleura: parietal pleura, pleural space, visceral pleura. Pericardium: parietal layer, pericardial cavity, visceral layer (epicardium). Same plan, different names."},{"id":"th5","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"The thoracic plane runs between which two points, and what does it separate?","c":"Sternal angle to the T4/T5 disc; it separates the superior mediastinum from the inferior mediastinum","w":["Jugular notch to the T2/T3 disc; it separates the superior mediastinum from the root of the neck","Xiphisternal joint to the T9/T10 disc; it separates the middle mediastinum from the posterior mediastinum","Sternal angle to the T8 vertebra; it separates the anterior mediastinum from the posterior mediastinum"],"e":"Above the thoracic plane and below the first ribs is the superior mediastinum. Below it are the anterior, middle and posterior mediastina (nobody calls that region the inferior mediastinum)."},{"id":"th6","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Which space within the thorax contains the heart?","c":"Middle mediastinum","w":["Anterior mediastinum","Posterior mediastinum","Superior mediastinum","Pulmonary cavity"],"e":"The middle mediastinum is defined by the pericardium, which contains the heart (about T5 to T8)."},{"id":"th7","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Select ALL correct pairs of mediastinal part and boundary.","c":["Superior: below the first ribs, above the thoracic plane","Middle: the pericardium, about T5 to T8","Anterior: in front of the pericardium and behind the sternum, down to about T9","Posterior: behind the pericardium and in front of the vertebral column, down to T12"],"w":["Middle: everything between the sternum and the vertebral column","Posterior: ends at the diaphragm, at about T8"],"e":"Because the diaphragm curves, the anterior mediastinum reaches T9 and the posterior mediastinum runs far behind the diaphragm to T12."},{"id":"th8","kind":"mcq","l":1,"topic":"Thoracic cavity","q":"Which of these is NOT found in the mediastinum?","c":"The lungs","w":["The esophagus","The trachea","The great vessels of the heart"],"e":"The lungs sit in the pulmonary cavities on either side. The mediastinum holds the pericardium and heart, great vessels, trachea, esophagus, lymphatics and neurovasculature."},{"id":"pc1","kind":"mcq","l":1,"topic":"Pericardium","q":"Put the pericardium in order from superficial to deep.","c":"Fibrous pericardium → parietal serous layer → pericardial cavity → visceral serous layer (epicardium)","w":["Parietal serous layer → fibrous pericardium → pericardial cavity → visceral serous layer (epicardium)","Fibrous pericardium → visceral serous layer (epicardium) → pericardial cavity → parietal serous layer","Visceral serous layer (epicardium) → pericardial cavity → parietal serous layer → fibrous pericardium"],"e":"Think of a fist pushed into a balloon: the balloon touching the fist is the visceral layer, the outer balloon wall is the parietal layer (stuck to the fibrous pericardium), and the inside of the balloon is the pericardial cavity."},{"id":"pc2","kind":"mcq","l":1,"topic":"Pericardium","q":"Which layer of the pericardium is part of the heart wall?","c":"Visceral layer of serous pericardium","w":["Fibrous pericardium","Parietal layer of serous pericardium","Serous pericardium"],"e":"The visceral layer of the serous pericardium = visceral pericardium = epicardium, the outermost layer of the heart wall."},{"id":"pc3","kind":"mcq","l":1,"topic":"Pericardium","q":"The fibrous pericardium is best described as:","c":"Superficial, durable, inelastic, made of three layers of collagen","w":["Deep, delicate and elastic, made of a single layer of elastin fibers","A serous membrane fused to the heart that secretes pericardial fluid","Smooth muscle that contracts with the heart to help it eject blood"],"e":"A collagen trilayer laid down at angles: rough and tumble, shiny and inelastic. The serous pericardium deep to it is delicate."},{"id":"pc4","kind":"mcq","l":1,"topic":"Pericardium","q":"Why does the fibrous pericardium being inelastic matter for heart function?","c":"Its volume sets how far the heart can expand during diastole","w":["It lets the heart stretch without limit as the ventricles fill in systole","It squeezes the ventricles during systole to help eject blood","It produces the serous fluid that lubricates and fills the ventricles"],"e":"The heart must fully dilate in diastole to fill. The pericardial cavity is the room it expands into, and the inelastic fibrous layer caps that room."},{"id":"pc5","kind":"mcq","l":1,"topic":"Pericardium","q":"The pericardium is fused to the:","c":"Diaphragm","w":["Sternum","Visceral pleura","Vertebral column"],"e":"It sits atop the diaphragm, medial to the pleurae, and delimits the middle mediastinum."},{"id":"pc6","kind":"mcq","l":1,"topic":"Pericardium","q":"Pain from the fibrous pericardium and parietal serous pericardium travels in which nerves?","c":"Phrenic nerves (C3 to C5, somatic)","w":["Vagus nerves (parasympathetic)","Cardiac accelerator nerves (sympathetic)","Intercostal nerves T1 to T4"],"e":"The phrenic nerves run through the mediastinum enmeshed in the fibrous pericardium on the way to the diaphragm. The visceral layer (epicardium) shares the heart's autonomic cardiac plexus innervation."},{"id":"pc7","kind":"mcq","l":1,"topic":"Pericardium","q":"Pericarditis leads to a large pericardial effusion. What is the main danger, and how is it treated?","c":"Cardiac tamponade compresses the heart in diastole; the fluid is drained by pericardiocentesis","w":["Cardiac tamponade stops the SA node from firing; it is treated by implanting a pacemaker","The fibrous pericardium tears open; it is treated by suturing it back to the diaphragm","The coronary arteries dilate and leak; it is treated with vasoconstrictor drugs"],"e":"Fluid (transudate, blood or exudate) in the pericardial cavity leaves no room for the heart to expand in diastole, so it cannot fill. A needle is passed below the sternum, through the diaphragm, into the cavity. It may need repeating."},{"id":"pc8","kind":"mcq","l":1,"topic":"Pericardium","q":"The coronary arteries and cardiac veins run in the:","c":"Subserosal (epicardial) adipose tissue","w":["Pericardial cavity, bathed in serous fluid","Fibrous pericardium's collagen layers","Endocardium"],"e":"The fat just deep to the epicardium carries the vessels. Its amount is proportional to cardiometabolic risk: more fat, more risk of coronary artery disease, atherosclerosis and type 2 diabetes."},{"id":"hb1","kind":"mcq","l":1,"topic":"Heart basics","q":"Select ALL correct statements about the layers of the heart wall.","c":["The epicardium is the visceral layer of serous pericardium","The myocardium is the thickest layer and is mostly cardiac muscle","The endocardium is endothelium that lines the chambers and covers the valves","The endocardium's smooth surface helps prevent clots"],"w":["The endocardium is the outermost layer of the heart, fused to the fibrous pericardium","The myocardium is thickest in the right ventricle, which pumps against the most resistance"],"e":"Outer to inner: epicardium, myocardium, endocardium. The left ventricular myocardium is thickest because it pumps to the whole body."},{"id":"hb2","kind":"mcq","l":1,"topic":"Heart basics","q":"The endocardium is made of which epithelium?","c":"Simple squamous (endothelium)","w":["Stratified squamous (keratinized)","Simple cuboidal","Transitional"],"e":"Simple squamous endothelium on a basement membrane, continuous with the endothelium of the vessels. It is non-thrombogenic, which matters because a clot in the heart can become a pulmonary embolism."},{"id":"hb3","kind":"mcq","l":1,"topic":"Heart basics","q":"How is the myocardium arranged differently in the atria and the ventricles?","c":"Atria: pectinate muscles anteriorly. Ventricles: trabeculae carneae and papillary muscles","w":["Atria: trabeculae carneae and papillary muscles. Ventricles: pectinate muscles anteriorly","Atria: papillary muscles and chordae. Ventricles: smooth walls with no ridges at all","Atria and ventricles: identical pectinate muscle throughout every chamber wall"],"e":"Atria receive blood and are smooth posteriorly with pectinate muscle anteriorly. Ventricles send blood out and have meaty beams (trabeculae carneae) plus papillary muscles tied to the valve cusps."},{"id":"hb4","kind":"mcq","l":1,"topic":"Heart basics","q":"After myocardial ischemia destroys cardiac muscle, what replaces it?","c":"Connective tissue laid down by fibroblasts (fibrosis)","w":["New cardiac muscle grown from resident satellite stem cells","Smooth muscle that migrates in from the endocardium","Adipose tissue spreading in from the epicardial fat"],"e":"Fibroblasts throughout the myocardium deposit connective tissue in place of the lost muscle."},{"id":"hb5","kind":"mcq","l":1,"topic":"Heart basics","q":"Select ALL correct pairs of chamber and what connects to it.","c":["Right atrium: superior and inferior venae cavae plus the coronary sinus","Right ventricle: pulmonary valve to the pulmonary trunk","Left atrium: four pulmonary veins","Left ventricle: aortic valve to the ascending aorta"],"w":["Left atrium: superior vena cava and the coronary sinus","Right ventricle: aortic valve to the ascending aorta"],"e":"The right heart collects deoxygenated systemic blood and sends it to the lungs. The left heart collects oxygen-rich blood from the lungs and sends it to the body."},{"id":"hb6","kind":"mcq","l":1,"topic":"Heart basics","q":"Which sequence of blood flow is correct?","c":"Venae cavae → right atrium → tricuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → left atrium → bicuspid valve → left ventricle → aortic valve → aorta","w":["Venae cavae → right atrium → bicuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → left atrium → tricuspid valve → left ventricle → aortic valve → aorta","Venae cavae → right atrium → tricuspid valve → right ventricle → aortic valve → pulmonary trunk → lungs → pulmonary veins → left atrium → bicuspid valve → left ventricle → pulmonary valve → aorta","Pulmonary veins → right atrium → tricuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → venae cavae → left atrium → bicuspid valve → left ventricle → aortic valve → aorta"],"e":"Tricuspid on the right, bicuspid (mitral) on the left. Each side: atrium → AV valve → ventricle → semilunar valve → great artery."},{"id":"hb7","kind":"mcq","l":1,"topic":"Heart basics","q":"Which vessels carry the most oxygen-rich blood in the body to the heart?","c":"Pulmonary veins","w":["Pulmonary arteries","Venae cavae","Coronary sinus"],"e":"Veins carry blood toward the heart, arteries away, whatever their oxygen content. Pulmonary veins (oxygenated) → left atrium; pulmonary arteries carry deoxygenated blood to the lungs."},{"id":"hb8","kind":"mcq","l":1,"topic":"Heart basics","q":"What feature of cardiac muscle tissue allows for coordinated depolarization?","c":"Gap junctions","w":["Autorhythmicity","Desmosomes","Large mitochondria","Uninucleate cells"],"e":"Gap junctions in the intercalated discs let ions flow cell to cell, so depolarization spreads as a wave and the cells act as one (a functional syncytium). Desmosomes are structural anchors."},{"id":"hb9","kind":"mcq","l":1,"topic":"Heart basics","q":"Select ALL features of cardiac muscle tissue.","c":["Branching fibers","Uninucleate cells","Larger and more numerous mitochondria","Intercalated discs with desmosomes and gap junctions","Autorhythmic"],"w":["Multinucleate cells, like skeletal muscle fibers","Under voluntary control through somatic motor nerves"],"e":"Each feature supports function: mitochondria for aerobic ATP, intercalated discs for anchoring and ion flow, autorhythmicity so the heart sets its own rate."},{"id":"hb10","kind":"mcq","l":1,"topic":"Heart basics","q":"A functional syncytium is:","c":"A group of cells working as one","w":["A single cell with many nuclei","A bundle of nerve fibers in the heart","A group of cells that contract one at a time"],"e":"Gap junctions pass depolarization from cell to cell so the myocardium contracts as a unit."},{"id":"hb11","kind":"mcq","l":1,"topic":"Heart basics","q":"Select ALL correct statements about the heart valves.","c":["All valves prevent retrograde (backward) flow","The tricuspid valve has three cusps and sits on the right","The bicuspid (mitral) valve has two cusps and sits on the left","The semilunar valves are the pulmonary and aortic valves"],"w":["The AV valves separate the ventricles from the great arteries","The aortic valve sits between the left atrium and the left ventricle"],"e":"AV valves separate atria from ventricles. Semilunar valves separate ventricles from the great arteries and are named for the vessel they open into."},{"id":"hb12","kind":"mcq","l":1,"topic":"Heart basics","q":"What actually brings the cusps of an AV valve together?","c":"Rising ventricular pressure pushes the cusps up, like air filling a parachute","w":["Papillary muscles contract and pull the chordae tendineae to draw the cusps shut","Back-pressure in the aorta and pulmonary trunk pushes the cusps closed","The atria contract against the cusps and press them together"],"e":"Papillary muscles put tension on the chordae tendineae, which keep the cusps from blowing back into the atrium (prolapse). Ventricular pressure is what closes them."},{"id":"hb13","kind":"mcq","l":1,"topic":"Heart basics","q":"How many groups of papillary muscles are in the right and left ventricles?","c":"Three on the right, two on the left","w":["Two on the right, three on the left","Three in each","One per ventricle"],"e":"One group per cusp: tricuspid (anterior, posterior, septal) and bicuspid (anterior, posterior)."},{"id":"ex1","kind":"mcq","l":1,"topic":"External features","q":"The base of the heart faces which direction, and which chamber mainly forms it?","c":"Posteriorly; mostly the left atrium, with a little of the right atrium","w":["Inferiorly; mostly the left ventricle, with a little of the right ventricle","Anteriorly; mostly the right ventricle, with a little of the left ventricle","Superiorly; the aorta and pulmonary trunk, with a little of both atria"],"e":"The pulmonary veins enter the left atrium on the base, and the venae cavae enter the right atrium beside it."},{"id":"ex2","kind":"mcq","l":1,"topic":"External features","q":"Select ALL correct pairs of heart surface and what it contacts.","c":["Anterior (sternocostal): behind the sternum and ribs","Right: the right pleura and right lung","Left (pulmonary): the left mediastinal pleura and left lung","Diaphragmatic: the central tendon of the diaphragm"],"w":["Base: the central tendon of the diaphragm","Diaphragmatic: the back of the sternum and costal cartilages"],"e":"Every surface is still wrapped in pericardium. The diaphragmatic surface is much larger than it looks from the front."},{"id":"ex3","kind":"mcq","l":1,"topic":"External features","q":"Select ALL correct pairs of heart border and chamber.","c":["Right border: right atrium","Left border (obtuse margin): mostly left ventricle, a little left atrium (left auricle)","Inferior border (acute margin): both ventricles, mostly the right","Superior border: both atria"],"w":["Right border: mostly the right ventricle, with a little right auricle","Inferior border (acute margin): mostly the left atrium"],"e":"Borders are set from an anterior view. The apex is where the left and inferior borders meet."},{"id":"ex4","kind":"mcq","l":1,"topic":"External features","q":"The obtuse margin of the heart is the:","c":"Left border","w":["Inferior border","Right border","Superior border"],"e":"Left border = obtuse margin (an obtuse angle between surfaces). Inferior border = acute margin."},{"id":"ex5","kind":"mcq","l":1,"topic":"External features","q":"The apex of the heart points:","c":"Left, inferior and anterior","w":["Right, superior and posterior","Straight inferiorly","Left and posterior"],"e":"It lies where the left and inferior borders meet. In cardiomegaly the gap between the apex and the left rib cage shrinks on a radiograph."},{"id":"ex6","kind":"mcq","l":1,"topic":"Internal features","q":"The coronary sulcus carries heart vasculature and corresponds to which deeper structure?","c":"Fibrous skeleton of the heart","w":["Chordae tendineae","Interatrial septum","Interventricular septum","Papillary muscles of the left ventricle"],"e":"The fibrous skeleton is connective tissue around all four valves, which lie roughly in one plane. The interventricular sulci match the interventricular septum."},{"id":"ex8","kind":"mcq","l":1,"topic":"External features","q":"The auricles of the heart are:","c":"Ear-like expansions of the atria","w":["Openings of the coronary sinus into the right atrium","Pouch-like extensions of the ventricles","The cusps of the AV valves"],"e":"There is a right and a left auricle. The left auricle shows along the left border; the right auricle holds pectinate muscle."},{"id":"ex9","kind":"mcq","l":1,"topic":"Internal features","q":"What is the main job of the fibrous skeleton of the heart?","c":"Anchors the valves","w":["Conducts impulses from the SA node","Produces pericardial fluid","Stores fat for the coronary vessels"],"e":"It surrounds and anchors all four valves and lines up with the coronary sulcus."},{"id":"in1","kind":"mcq","l":1,"topic":"Internal features","q":"Inside the right atrium, which structure separates the smooth sinus venarum from the pectinate part?","c":"Crista terminalis","w":["Septomarginal trabecula","Fossa ovalis","Conus arteriosus"],"e":"The sinus venarum (space of veins) is the smooth posterior part that receives the venae cavae. The ridge of crista terminalis divides it from the anterior pectinate muscle. The SA node sits at its superior end."},{"id":"in2","kind":"mcq","l":1,"topic":"Internal features","q":"The fossa ovalis is:","c":"A depression in the interatrial septum, remnant of the fetal foramen ovale","w":["An opening in the interventricular septum that stays patent in adults","The depression around the opening of the coronary sinus in the right atrium","A remnant of the fetal ductus arteriosus in the wall of the right ventricle"],"e":"In the fetus, oxygenated blood from the placenta goes right atrium → foramen ovale → left atrium, skipping the lungs. At birth the septa shut. A persisting opening is a patent foramen ovale (PFO)."},{"id":"in3","kind":"mcq","l":1,"topic":"Internal features","q":"Where is the AV node?","c":"In the atrioventricular septum, near the opening of the coronary sinus","w":["At the superior end of the crista terminalis, near the opening of the SVC","In the septomarginal trabecula, near the base of the anterior papillary muscle","In the wall of the left atrium beside the pulmonary veins"],"e":"SA node: superior crista terminalis. AV node: where the atrioventricular septum meets the interatrial septum, beside the coronary sinus opening."},{"id":"in4","kind":"mcq","l":1,"topic":"Internal features","q":"The septomarginal trabecula (moderator band) runs from where to where, and what is its job?","c":"Interventricular septum to the base of the anterior papillary muscle; a shortcut for the right bundle branch","w":["Crista terminalis to the AV node; a shortcut that carries impulses from the SA node","Anterior papillary muscle to the pulmonary valve; anchors the semilunar cusps in systole","Interatrial septum to the tricuspid valve; structural support for the valve, with no conduction role"],"e":"It is specialized myocardium of the right ventricle."},{"id":"in5","kind":"mcq","l":1,"topic":"Internal features","q":"Which is the largest papillary muscle of the right ventricle?","c":"Anterior","w":["Posterior","Septal","They are all equal"],"e":"Right ventricle: anterior (largest), posterior and septal papillary muscles, matching the three tricuspid cusps."},{"id":"in6","kind":"mcq","l":1,"topic":"Internal features","q":"The conus arteriosus is the part of the right ventricle that:","c":"Funnels blood up to the pulmonary valve","w":["Receives blood returning from the coronary sinus","Holds the AV node and the AV bundle","Connects the right ventricle to the aorta"],"e":"During ventricular systole blood rises through the conus arteriosus to the pulmonary valve and pulmonary trunk."},{"id":"in7","kind":"mcq","l":1,"topic":"Internal features","q":"Select ALL features found in BOTH ventricles.","c":["Trabeculae carneae","Papillary muscles","Chordae tendineae","The interventricular septum"],"w":["Septomarginal trabecula","Pectinate muscles","Conus arteriosus"],"e":"The septomarginal trabecula and conus arteriosus belong to the right ventricle. Pectinate muscles are in the atria."},{"id":"in8","kind":"mcq","l":1,"topic":"Internal features","q":"Select ALL correct statements about the aortic sinuses (of Valsalva).","c":["The right coronary artery arises from the right sinus","The left coronary artery arises from the left sinus","The sinus above the posterior cusp is the non-coronary sinus"],"w":["The coronary arteries arise from the pulmonary trunk","The right coronary artery arises from the posterior sinus"],"e":"The aortic valve has right, left and posterior cusps; the space above each is a sinus. No artery arises from the posterior one."},{"id":"in9","kind":"mcq","l":1,"topic":"Internal features","q":"Because of where they arise, the coronary arteries fill mainly during:","c":"Diastole","w":["Ventricular systole","Atrial systole","Isovolumetric contraction"],"e":"In diastole blood rushes back toward the aortic valve, closes the cusps and flows into the coronary arteries from the sinuses."},{"id":"in10","kind":"mcq","l":1,"topic":"Internal features","q":"Which pairing of valve state and phase is correct?","c":"AV valves open in diastole, closed in systole; semilunar valves open in systole, closed in diastole","w":["AV valves open in systole, closed in diastole; semilunar valves open in diastole, closed in systole","AV and semilunar valves all open together in diastole and all close together in systole","Semilunar valves close in systole, when ventricular pressure rises above arterial pressure"],"e":"Semilunar cusps act like scoops: when arterial pressure exceeds ventricular pressure, blood catches in them and closes them. AV valves close when ventricular pressure exceeds atrial pressure."},{"id":"in11","kind":"mcq","l":1,"topic":"Internal features","q":"What structures anchor atrioventricular cusps to papillary muscles?","c":"Chordae tendineae","w":["Crista terminalis","Pectinate muscles","Septomarginal trabecula","Trabeculae carneae"],"e":"Their real job is to stop valve prolapse."},{"id":"in12","kind":"mcq","l":1,"topic":"Internal features","q":"The bicuspid valve is also called the mitral valve because:","c":"It looks like a bishop's miter","w":["It was named for the anatomist Mitra","It has a middle cusp","It sits in the middle of the heart"],"e":"Two cusps (anterior and posterior) with matching anterior and posterior papillary muscles."},{"id":"co1","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Which statement about the origin of the coronary arteries is correct?","c":"They are the only branches of the ascending aorta; they arise from the aortic sinuses and run in the sulci","w":["They branch from the aortic arch and run deep inside the myocardium instead of the sulci","They branch from the pulmonary trunk just above the pulmonary valve and run in the coronary sulcus","They branch from the descending thoracic aorta and enter the heart at the apex"],"e":"RCA from the right aortic sinus, LCA from the left. Both head straight for the coronary sulcus."},{"id":"co2","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Select ALL branches that usually come from the RCA.","c":["SA nodal branch (about 60%)","Right marginal branch","AV nodal branch (about 67%)","Posterior interventricular branch / PDA (about 67%)"],"w":["Anterior interventricular branch (LAD) (about 67%)","Circumflex branch (about 60%)","Left marginal artery"],"e":"The SA nodal branch comes from the LCA the other 40% of the time. AV nodal and PDA arise at the crux."},{"id":"co3","kind":"mcq","l":1,"topic":"Coronary arteries","q":"The right marginal branch runs along which border, and what does it supply?","c":"The inferior border; the right ventricle","w":["The right border; the right atrium and SA node","The left border; the left ventricle","The superior border; both atria and the auricles"],"e":"It leaves the RCA and follows the inferior (acute) margin."},{"id":"co4","kind":"mcq","l":1,"topic":"Coronary arteries","q":"The posterior interventricular branch (PDA) supplies:","c":"The diaphragmatic surface of the ventricles and the posterior interventricular septum","w":["The SA node, the right atrium and the anterior wall of the right ventricle","The sternocostal surface of the left ventricle and the anterior interventricular septum","The left atrium and the base of the heart, through the posterior atrial branches"],"e":"It runs in the posterior interventricular sulcus and sends branches deep into the septum."},{"id":"co5","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Select ALL correct statements about the left coronary artery.","c":["It splits into the anterior interventricular branch (LAD) and the circumflex branch","The LAD supplies the sternocostal surface of the ventricles and the anterior septum","The circumflex gives off the left marginal artery to the left ventricle"],"w":["The LAD runs in the posterior interventricular sulcus to the diaphragmatic surface","The left marginal artery runs along the inferior border to the right ventricle"],"e":"The circumflex wraps around in the coronary sulcus and serves the left ventricle's wall and diaphragmatic surface. The left marginal follows the left border."},{"id":"co6","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Which branch is one of the few named an artery rather than a branch?","c":"Left marginal artery","w":["Right marginal","Anterior interventricular","Circumflex"],"e":"It comes off the circumflex and runs along the left border."},{"id":"co7","kind":"mcq","l":1,"topic":"Coronary arteries","q":"In addition to the posterior interventricular artery, the dominant blood supply to the crux also supplies which branch?","c":"AV nodal branch","w":["Anterior interventricular branch","Left marginal artery","Right marginal branch","SA nodal branch"],"e":"The crux is where the coronary sulcus meets the posterior interventricular sulcus. Whatever supplies the PDA and AV nodal branch there sets dominance."},{"id":"co8","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Rank heart dominance from most to least common.","c":"Right dominant (about two thirds) → codominant → left dominant","w":["Left dominant (about two thirds) → codominant → right dominant","Codominant (about two thirds) → right dominant → left dominant","Right dominant (about two thirds) → left dominant → codominant"],"e":"Right dominant: RCA supplies the crux. Codominant: both. Left dominant: the LCA (via the circumflex)."},{"id":"co9","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Why do left-dominant hearts have worse outcomes with myocardial ischemia?","c":"An LCA occlusion cuts off nearly all the interventricular septum, which carries the bundle branches","w":["The RCA is blocked more often in left-dominant hearts, and it supplies both bundle branches","Left-dominant hearts have no SA nodal branch, so any occlusion stops the pacemaker","The left ventricular wall is thinner in left-dominant hearts, so it ruptures more easily"],"e":"The LCA always supplies the LAD, circumflex and left marginal. In a left-dominant heart it also supplies the posterior septum, so one common blockage takes out the whole septum and the conduction pathway in it."},{"id":"co10","kind":"mcq","l":1,"topic":"Coronary arteries","q":"A clot blocks the anterior interventricular branch (LAD). Which region is most at risk?","c":"The sternocostal surface of the ventricles and the anterior interventricular septum","w":["The SA node and the crista terminalis of the right atrium","The diaphragmatic surface of the ventricles and the posterior interventricular septum","The right atrium and the right border of the heart"],"e":"The LAD runs in the anterior interventricular sulcus and sends branches deep into the septum."},{"id":"ve1","kind":"mcq","l":1,"topic":"Cardiac veins","q":"Which veins of the greater system drain directly into the right atrium rather than the coronary sinus?","c":"Anterior cardiac veins","w":["Great cardiac vein","Middle cardiac vein","Posterior vein of the left ventricle"],"e":"They drain the subepicardial myocardium of the right ventricle and bridge over the RCA. Delicate in dissection."},{"id":"ve2","kind":"mcq","l":1,"topic":"Cardiac veins","q":"Select ALL correct pairs of vein and the artery it accompanies.","c":["Great cardiac vein: anterior interventricular branch (LAD)","Middle cardiac vein: posterior interventricular branch (PDA)","Small cardiac vein: right marginal branch"],"w":["Great cardiac vein: right marginal branch of the RCA","Middle cardiac vein: circumflex branch of the LCA"],"e":"Great with the LAD in the anterior interventricular sulcus; middle with the PDA in the posterior sulcus; small along the inferior border with the right marginal."},{"id":"ve3","kind":"mcq","l":1,"topic":"Cardiac veins","q":"Map the greater system: where does blood from the subepicardial myocardium end up?","c":"Great, middle and small cardiac veins → coronary sinus → right atrium; anterior cardiac veins → right atrium directly","w":["Great, middle and small cardiac veins → coronary sinus → left atrium; anterior cardiac veins → left atrium directly","Great cardiac vein → right atrium directly; middle, small and anterior cardiac veins → coronary sinus → right atrium","All cardiac veins, anterior ones included → coronary sinus → superior vena cava → right atrium"],"e":"“All veins lead to the right atrium.” The coronary sinus opens into the right atrium beside the AV node."},{"id":"ve4","kind":"mcq","l":1,"topic":"Cardiac veins","q":"Which statement about the smaller system is correct?","c":"Small (Thebesian) veins drain subendocardial myocardium straight into the chambers, densest in the right atrium","w":["Small (Thebesian) veins drain subepicardial myocardium into the coronary sinus, densest in the left ventricle","The smaller system is another name for the small cardiac vein, which runs with the right marginal branch","Small (Thebesian) veins drain subendocardial myocardium straight into the chambers, densest in the left ventricle"],"e":"Greater system = named veins, subepicardial, to the coronary sinus (or right atrium). Smaller system = microscopic veins, subendocardial, into the chamber they sit beside."},{"id":"ve5","kind":"mcq","l":1,"topic":"Cardiac veins","q":"How do you tell the small cardiac vein from the small cardiac (Thebesian) veins?","c":"If you can see it, it's the small cardiac vein; the Thebesian veins are microscopic","w":["The small cardiac vein drains into the left atrium; the Thebesian veins drain into the right","The Thebesian veins run with the right marginal branch; the small cardiac vein runs alone","There is no difference; they are two names for the same vessels"],"e":"The small cardiac vein runs with the right marginal branch to the coronary sinus."},{"id":"cc1","kind":"mcq","l":1,"topic":"Conduction and control","q":"Put the cardiac cycle in order, starting with diastole.","c":"Diastole → atrial systole → isovolumetric ventricular contraction → ejection","w":["Diastole → isovolumetric ventricular contraction → atrial systole → ejection","Diastole → ejection → atrial systole → isovolumetric ventricular contraction","Diastole → atrial systole → ejection → isovolumetric ventricular contraction"],"e":"Then back to diastole. Blood always moves from high to low pressure, and volume is inversely proportional to pressure."},{"id":"cc2","kind":"mcq","l":1,"topic":"Conduction and control","q":"Select ALL correct pairs of phase and valve state.","c":["Diastole: AV valves open, semilunar valves closed","Atrial systole: AV valves open, semilunar valves closed","Isovolumetric contraction: all valves closed","Ejection: AV valves closed, semilunar valves open"],"w":["Ejection: AV valves open, semilunar valves open","Diastole: AV valves closed, semilunar valves open"],"e":"About 75% of ventricular filling happens in diastole; atrial systole (the atrial kick) adds the last quarter."},{"id":"cc3","kind":"mcq","l":1,"topic":"Conduction and control","q":"How much of ventricular filling happens during diastole, before the atria contract?","c":"About 75%","w":["About 25%","About 50%","100%"],"e":"The atrial kick in atrial systole supplies the remaining quarter."},{"id":"cc4","kind":"mcq","l":1,"topic":"Conduction and control","q":"Which conduction pathway is in the right order?","c":"SA node → AV node → AV bundle (of His) → right and left bundle branches → Purkinje fibers","w":["SA node → AV bundle (of His) → AV node → right and left bundle branches → Purkinje fibers","AV node → SA node → AV bundle (of His) → right and left bundle branches → Purkinje fibers","SA node → AV node → right and left bundle branches → AV bundle (of His) → Purkinje fibers"],"e":"Bundle branches run down the interventricular septum; the right one takes the septomarginal trabecula shortcut."},{"id":"cc5","kind":"mcq","l":1,"topic":"Conduction and control","q":"Select ALL correct intrinsic rates.","c":["SA node: about 100 bpm","AV node: about 40 to 60 bpm","AV bundle (of His): about 20 to 35 bpm"],"w":["SA node: about 60 bpm","AV node: about 100 to 120 bpm"],"e":"Rates fall the further you go down the pathway. The SA node is the pacemaker."},{"id":"cc6","kind":"mcq","l":1,"topic":"Conduction and control","q":"The heart's conduction system is made of:","c":"Specialized cardiomyocytes","w":["Nerve fibers from the vagus nerve","Purkinje neurons","Sympathetic postganglionic axons"],"e":"Every part of it is specialized cardiac muscle capable of autorhythmic depolarization."},{"id":"cc7","kind":"mcq","l":1,"topic":"Conduction and control","q":"The SA node's intrinsic rate is about 100 bpm, yet resting heart rate is lower because:","c":"Parasympathetic stimulation dominates at rest","w":["The AV node's slower rhythm overrides the SA node at rest","Sympathetic stimulation dominates at rest","The SA node fires on only every other impulse at rest"],"e":"Vagal (parasympathetic) input from the cardiac plexus slows the SA node to perhaps 60 to 70 bpm."},{"id":"cc8","kind":"mcq","l":1,"topic":"Conduction and control","q":"What is the difference between cardiac arrest and a heart attack?","c":"Cardiac arrest is a conduction failure; a heart attack is a blocked coronary blood supply","w":["Cardiac arrest is a blocked coronary blood supply; a heart attack is a conduction failure","They are two names for the same event, a blocked coronary artery","Cardiac arrest affects only the atria; a heart attack affects only the ventricles"],"e":"Electrical vs vascular."},{"id":"cc9","kind":"mcq","l":1,"topic":"Conduction and control","q":"Fibers that cause a depression of heart rate are conducted by which nervous structures?","c":"Vagus nerves (CN X)","w":["Cardiac (accelerator) nerves","Postganglionic sympathetic fibers","Preganglionic sympathetic fibers from T1 to T4/5"],"e":"Vagal cardiac branches are parasympathetic: they slow the rate and dilate the coronary arteries. The sympathetic fibers raise the rate."},{"id":"cc10","kind":"mcq","l":1,"topic":"Conduction and control","q":"Select ALL correct statements about sympathetic control of the heart.","c":["Preganglionic fibers come from T1 to T4/5","They reach the cardiac plexus as cardiac (accelerator) nerves from the sympathetic trunk","They raise heart rate","Their constriction of the coronary arteries is only a minor effect"],"w":["Preganglionic fibers travel to the heart in the vagus nerve (CN X)","They slow heart rate and reduce the force of contraction"],"e":"The faster rate increases perfusion overall, and some beta-2 dilation offsets the constriction."},{"id":"cc11","kind":"mcq","l":1,"topic":"Conduction and control","q":"Where are the two cardiac plexuses?","c":"Superficial: in the concavity of the aortic arch. Deep: at the tracheal bifurcation","w":["Superficial: at the tracheal bifurcation. Deep: in the concavity of the aortic arch","Superficial: on the apex of the heart. Deep: inside the interventricular septum","Superficial: behind the manubrium. Deep: on the central tendon of the diaphragm"],"e":"Together they carry vagal and sympathetic fibers that act on the SA node."},{"id":"cc12","kind":"mcq","l":1,"topic":"Conduction and control","q":"Which definitions are correct?","c":"Normal sinus rhythm: 60 to 100 bpm, typical EKG. Bradycardia: under 60. Tachycardia: over 100","w":["Normal sinus rhythm: 40 to 60 bpm, typical EKG. Bradycardia: under 40. Tachycardia: over 60","Normal sinus rhythm: 60 to 100 bpm, any EKG. Bradycardia: over 100. Tachycardia: under 60","Normal sinus rhythm: 70 to 120 bpm, typical EKG. Bradycardia: under 70. Tachycardia: over 120"],"e":"Rate and rhythm both count: normal sinus rhythm needs a typical EKG."},{"id":"cc13","kind":"mcq","l":1,"topic":"Conduction and control","q":"Select ALL correctly classified arrhythmias.","c":["Sinus node dysfunction: bradyarrhythmia","AV block: bradyarrhythmia","Atrial fibrillation: tachyarrhythmia","Ventricular fibrillation: tachyarrhythmia"],"w":["AV block: tachyarrhythmia","Ventricular fibrillation: bradyarrhythmia"],"e":"Arrhythmias are also called dysrhythmias."},{"id":"cc14","kind":"mcq","l":1,"topic":"Conduction and control","q":"Which arrhythmia is an emergency because the ventricles stop pumping blood?","c":"Ventricular fibrillation","w":["Atrial fibrillation","Sinus node dysfunction","Sinus bradycardia at 55 bpm"],"e":"V-fib is uncoordinated ventricular contraction, corrected with defibrillation. A-fib is usually chronic and manageable with medication but can throw a clot."},{"id":"au1","kind":"mcq","l":1,"topic":"Auscultation","q":"Select ALL correct pairs of heart sound and event.","c":["S1 (lub): turbulence as the AV valves close at the start of ventricular systole","S2 (dub): turbulence as the semilunar valves close at the start of diastole","S3: turbulence during ventricular filling","S4: turbulence during atrial systole into a non-compliant ventricle"],"w":["S1 (lub): turbulence as the semilunar valves close at the start of ventricular systole","S2 (dub): turbulence as the AV valves close at the start of diastole"],"e":"S1 and S2 are primary; S3 and S4 are secondary."},{"id":"au2","kind":"mcq","l":1,"topic":"Auscultation","q":"Which secondary heart sound is common and often normal in children?","c":"S3","w":["S4","S2","S1"],"e":"S3 (S1, S2, S3) = the Kentucky gallop. S4 (S4, S1, S2) = Tennessee; rare and often atypical, usually from ventricular non-compliance."},{"id":"au3","kind":"mcq","l":1,"topic":"Auscultation","q":"A murmur heard in an adult most often points to:","c":"A valve disorder","w":["Normal ventricular filling","Atrial kick","A healthy S3"],"e":"Murmurs are abnormal clicking, gurgling or rushing sounds. Common and usually benign in children."},{"id":"au4","kind":"mcq","l":1,"topic":"Auscultation","q":"Where should the bell of the stethoscope be placed when auscultating the aortic valve?","c":"2nd intercostal space, just right of the sternum","w":["2nd to 3rd intercostal space, just left of the sternum","4th to 5th intercostal space, just left of the sternum","5th intercostal space, left midclavicular line","Wherever you'd like; auscultation is a vibe"],"e":"Mnemonic “Apartment”: A P T M = aortic, pulmonic, tricuspid, mitral, moving down and to the left."},{"id":"au5","kind":"mcq","l":1,"topic":"Auscultation","q":"Select ALL correct auscultation sites.","c":["Aortic: right 2nd intercostal space","Pulmonary: left 2nd (to 3rd) intercostal space","Tricuspid: left 4th to 5th intercostal space, usually 5th","Bicuspid (mitral): left 5th intercostal space, midclavicular line"],"w":["Mitral: right 5th intercostal space, midclavicular line","Pulmonary: right 2nd intercostal space, beside the sternum"],"e":"Aortic on the right; everything else on the left."},{"id":"au6","kind":"mcq","l":1,"topic":"Auscultation","q":"Why isn't the stethoscope placed directly over each valve?","c":"Sound travels with blood flow, so you listen downstream of each valve","w":["The sternum and costal cartilages block all sound coming directly from the heart","The valves sit too deep for any of their sound to reach the chest wall","Each valve makes sound only in diastole, when the stethoscope can't pick it up"],"e":"Directionality carries the sound energy, which is why you count intercostal spaces instead of listening over the valve itself."},{"id":"ex-x1","kind":"mcq","l":1,"topic":"External features","q":"Select ALL correct statements about the auricles.","c":["They are external expansions of their respective atria","There is a right auricle and a left auricle","Internally, the auricles contain pectinate muscle","The left auricle is seen along the left border, the only part of the left atrium there"],"w":["They are expansions of the ventricles that hold trabeculae carneae","Only the right atrium has an auricle"],"e":"Each atrium has an ear-like auricle projecting from it on the external surface. Inside, they are lined with pectinate muscle. On the anterior view, the left border is mostly left ventricle with a little left atrium, seen as the left auricle."},{"id":"ex-x2","kind":"mcq","l":1,"topic":"External features","q":"The internal surface of the auricles is lined with:","c":"Pectinate muscle","w":["Trabeculae carneae","Chordae tendineae","Smooth sinus venarum"],"e":"Pectinate muscle is atrial (crista terminalis and auricles). Trabeculae carneae line the ventricles; the sinus venarum is the smooth posterior part of the right atrium."},{"id":"hb-x1","kind":"mcq","l":1,"topic":"Heart basics","q":"Which chamber receives blood from the pulmonary veins?","c":"Left atrium","w":["Right atrium","Left ventricle","Right ventricle"],"e":"Right atrium: SVC, IVC, coronary sinus. Right ventricle: out the pulmonary trunk. Left atrium: pulmonary veins. Left ventricle: out the ascending aorta."},{"id":"hb-x2","kind":"mcq","l":1,"topic":"Heart basics","q":"Blood leaving the right ventricle passes which structures, in order, before it next enters the heart?","c":"Pulmonary valve → pulmonary trunk → pulmonary arteries → lungs → pulmonary veins → left atrium","w":["Pulmonary valve → pulmonary veins → lungs → pulmonary arteries → pulmonary trunk → left atrium","Tricuspid valve → pulmonary trunk → pulmonary arteries → lungs → pulmonary veins → right atrium","Aortic valve → ascending aorta → pulmonary arteries → lungs → pulmonary veins → left atrium"],"e":"The right side pumps to the lungs (pulmonary loop) and the blood returns to the left atrium. Arteries carry blood away from the heart even when, as in the pulmonary loop, it is deoxygenated."},{"id":"co-x1","kind":"mcq","l":1,"topic":"Coronary arteries","q":"The right coronary artery arises from the:","c":"Right aortic sinus","w":["Left aortic sinus","Non-coronary (posterior) aortic sinus","Arch of the aorta"],"e":"Right sinus → RCA, left sinus → LCA; the third sinus has no coronary artery. The coronary arteries are the only branches of the ascending aorta."},{"id":"co-x2","kind":"mcq","l":1,"topic":"Coronary arteries","q":"Why do the coronary arteries fill mainly during diastole?","c":"When the aortic valve closes, blood recoils into the aortic sinuses and into the coronary openings","w":["The coronary openings are uncovered only when the AV valves close at the end of diastole","The relaxing myocardium pumps blood forward into the coronary arteries as it lengthens","Coronary blood is pulled in by the negative pressure of the relaxing atria"],"e":"During systole the open aortic cusps sit against the sinus walls and the contracting myocardium compresses the vessels. In diastole, backflow fills the sinuses and the coronary arteries."},{"id":"au-x1","kind":"mcq","l":1,"topic":"Auscultation","q":"The S2 (“dub”) heart sound is made by:","c":"Closure of the semilunar (aortic and pulmonary) valves at the start of diastole","w":["Closure of the AV (tricuspid and bicuspid) valves at the start of ventricular systole","Blood rushing from the atria into the ventricles in early diastole","The atria contracting against a stiff ventricle late in diastole"],"e":"S1 = AV valves closing as ventricular systole begins. S2 = semilunar valves closing as diastole begins. S3 = turbulence of ventricular filling. S4 = atrial contraction into a stiff ventricle."},{"id":"au-x2","kind":"mcq","l":1,"topic":"Auscultation","q":"Between S1 and S2, the ventricles contract with all four valves closed for a moment. What is this phase called, and what ends it?","c":"Isovolumetric contraction; it ends when ventricular pressure exceeds arterial pressure and the semilunar valves open","w":["Isovolumetric relaxation; it ends when ventricular pressure falls below atrial pressure and the AV valves open","Atrial systole; it ends when atrial pressure falls below ventricular pressure and the AV valves close","Rapid ventricular ejection; it ends when arterial pressure exceeds ventricular pressure and the semilunar valves close"],"e":"S1 marks AV valve closure. Pressure then rises with no change in volume (isovolumetric contraction) until the semilunar valves open and ejection begins. S2 marks their closure."},{"id":"v-vs1","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Which layer of a blood vessel is most affected by autonomic stimulus?","c":"Tunica media","w":["Tunica externa","Tunica interna"],"e":"The tunica media holds the smooth muscle, and that muscle is under autonomic control: constricted = vasoconstriction, relaxed = vasodilation."},{"id":"v-vs2","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Select ALL correct statements comparing arteries and veins.","c":["Arteries carry blood away from the heart at higher pressure","Arteries tend to be tortuous","Veins are thin walled and their tunica media lacks the elastic lamina","The tunica interna of many veins forms valves"],"w":["Arteries always carry oxygenated blood","Veins have a thicker tunica media than arteries of the same size"],"e":"Direction defines the vessel, not oxygen: the pulmonary arteries carry deoxygenated blood. Veins keep all three tunics, but the media is a narrow band of smooth muscle with no elastic lamina, and the endothelium often folds into valves for one-way flow."},{"id":"v-vs3","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"From the lumen outward, the tunica interna of an artery is made of:","c":"Endothelium, basement membrane and a thin elastic lamina","w":["Endothelium, smooth muscle and a thick external elastic lamina","Elastin and collagen fibers with their own vasa vasorum","Endothelium alone, with no basement membrane or lamina"],"e":"Interna: endothelium + basement membrane + thin elastic lamina. Media: smooth muscle (ANS) + a more robust elastic lamina. Externa: elastin and collagen, sometimes with vasa vasorum (vessels that serve the vessel wall)."},{"id":"v-vs4","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"How do elastic (conducting) arteries differ from muscular (distributing) arteries?","c":"Elastic arteries (aorta, pulmonary trunk) have relatively thin walls and act as pressure reservoirs; muscular arteries have a thick tunica media and more tone","w":["Elastic arteries have the thickest tunica media and set vascular tone; muscular arteries (aorta, pulmonary trunk) act as pressure reservoirs","Elastic arteries are the smallest arteries and feed capillary beds directly; muscular arteries are the largest and act as pressure reservoirs","Muscular arteries (aorta, pulmonary trunk) have relatively thin walls and act as pressure reservoirs; elastic arteries have a thick tunica media and more tone"],"e":"The heart ejects straight into the elastic arteries; their well-defined elastic laminae stretch in systole and recoil to keep blood moving. Muscular arteries are the tortuous distributing vessels, toned by the autonomic nervous system."},{"id":"v-vs5","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Arterioles are called “resistance vessels” because:","c":"Their thick smooth muscle, under autonomic control, sets flow into capillary beds","w":["Their walls are a single layer of endothelium that resists the passage of plasma","They have internal valves, like veins, that resist the backflow of blood into arteries","They hold most of the blood volume and resist changes in total blood pressure"],"e":"Arterioles have a thick tunica media and feed capillary beds via metarterioles, whose precapillary sphincters control how much exchange happens."},{"id":"v-vs6","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Sympathetic stimulation mostly causes vasoconstriction of arterioles. Where does it cause vasodilation instead, and why?","c":"Skeletal muscle (and the coronaries), via beta receptors responding mainly to epinephrine","w":["The skin of the face and hands, through alpha receptors that respond to norepinephrine","The gut wall, through parasympathetic fibers that travel with the sympathetic chain","Every capillary bed, because capillaries have no smooth muscle to constrict"],"e":"Alpha receptors “clamp down” (vasoconstriction). Beta receptors, stimulated more by epinephrine than norepinephrine, relax smooth muscle, so skeletal muscle gets more blood during a sympathetic response."},{"id":"v-vs7","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Capillaries are about 5 to 10 µm across. Why does that matter?","c":"Erythrocytes pass one at a time, maximizing gas exchange","w":["It keeps plasma and dissolved solutes from ever leaving the vessel","It lets leukocytes pass through but blocks the larger erythrocytes","It makes capillaries act as pressure reservoirs"],"e":"Capillaries are exchange vessels: just the tunica interna (endothelium + basement membrane), about the width of one erythrocyte."},{"id":"v-vs8","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Select ALL mechanisms that help venous blood return to the heart despite low venous pressure.","c":["Valves that keep flow one-way","Muscle milking by adjacent skeletal muscle","Respiratory milking as the diaphragm changes cavity pressures","Venae comitantes squeezed by the pulsing artery they accompany"],"w":["The elastic recoil of the venous tunica media","Precapillary sphincters pushing blood into venules"],"e":"Veins have no elastic lamina in the media, so they rely on valves plus external squeezing: skeletal muscle, breathing, and the pulse of an accompanying artery bound in the same fascia."},{"id":"v-vs9","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Venae comitantes are:","c":"Accompanying veins, named for the artery they run with","w":["Superficial veins of the limbs that run alone in the subcutaneous fat","Veins that connect two capillary beds in series","Veins of the heart wall that drain into the coronary sinus"],"e":"For example, the radial veins accompany the radial artery and the brachial veins the brachial artery. Deep limb veins are venae comitantes."},{"id":"v-vs10","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"A passenger develops a clot in a deep vein of the leg after a long flight. It breaks loose. Where is it most likely to lodge, and what is that called?","c":"A pulmonary artery, via the IVC and right heart: a pulmonary embolism","w":["A coronary artery, via the left ventricle and aorta: a myocardial infarction","A cerebral artery, via the carotid arteries: an ischemic stroke","The liver sinusoids, via the hepatic portal vein: portal hypertension"],"e":"Thrombus = clot in a vessel; embolism = a clot that travels and lodges. Venous clots go up the IVC, through the right atrium and ventricle, and stop in the narrowing pulmonary arteries. DVT + PE = venous thromboembolism (VTE). Stasis, vascular injury and hypercoagulability raise the risk."},{"id":"v-vs11","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Select ALL correctly classified portal systems.","c":["Hepatic portal system: venous, GI tract capillaries to liver sinusoids","Hypophyseal portal system: venous, hypothalamus to anterior pituitary","Renal portal system: arterial, glomerulus to peritubular capillaries"],"w":["Renal portal system: venous, kidney capillaries to liver sinusoids","Coronary circulation: arterial, aortic sinuses to the cardiac veins"],"e":"A portal system is a vessel connecting two or more capillary beds. Two examples are venous (hepatic, hypophyseal); the glomerulus → efferent arteriole → peritubular capillaries arrangement is arterial, with at least one per nephron."},{"id":"v-vs12","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"What defines a portal system?","c":"A vessel that connects two or more capillary beds","w":["Any vein that drains into the venae cavae","An artery that supplies an organ with two blood supplies","An anastomosis between an artery and a vein"],"e":"It contrasts with the caval system (the superior and inferior venae cavae and all their tributaries), which returns capillary blood straight to the right atrium."},{"id":"v-vs13","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Which statement correctly contrasts systemic and pulmonary circulation?","c":"Systemic: left heart → body tissues → right atrium. Pulmonary: right heart → lungs for gas exchange → left atrium","w":["Systemic: right heart → body tissues → left atrium. Pulmonary: left heart → lungs for gas exchange → right atrium","Systemic arteries always carry oxygenated blood, and pulmonary arteries always carry oxygenated blood too","Pulmonary circulation includes the coronary and cerebral circulations; systemic circulation includes the lungs"],"e":"Coronary, cerebral, the caval system and the portal systems are all named parts of the systemic loop. In the pulmonary loop, the arteries carry deoxygenated blood."},{"id":"v-vs14","kind":"mcq","l":2,"topic":"Vessels and circulation","q":"Which of these is part of the pulmonary circulation rather than the systemic circulation?","c":"Pulmonary trunk","w":["Coronary arteries","Hepatic portal vein","Cerebral arterial circle"],"e":"Coronary, cerebral and portal routes are regional names within the systemic loop."},{"id":"v-ao1","kind":"mcq","l":2,"topic":"Aorta and branches","q":"The brachiocephalic trunk predominantly serves which areas of the body with blood?","c":"Right head and neck, and right upper limb","w":["Both sides of the head and neck, and both upper limbs","Left head and neck","Left head and neck, and left upper limb","Right head and neck only"],"e":"Its two branches are the right common carotid a. (right head and neck) and the right subclavian a. (right upper limb). The left side gets its own common carotid and subclavian straight off the arch."},{"id":"v-ao2","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Put the parts of the aorta in order with their vertebral levels.","c":"Ascending aorta → arch (~T4) → thoracic aorta (T5 to the aortic hiatus at T12) → abdominal aorta (T12 to the bifurcation at L4)","w":["Ascending aorta → arch (~T12) → thoracic aorta (T5 to the aortic hiatus at T8) → abdominal aorta (T8 to the bifurcation at L1)","Arch (~T4) → ascending aorta → abdominal aorta (T5 to the aortic hiatus at T12) → thoracic aorta (T12 to the bifurcation at L4)","Ascending aorta → arch (~T4) → thoracic aorta (T5 to the esophageal hiatus at T10) → abdominal aorta (T10 to the bifurcation at L2)"],"e":"The arch sits at the thoracic plane (sternal angle to the T4/T5 disc). The descending aorta has a thoracic part above the diaphragm and an abdominal part below; it bifurcates into the common iliac arteries at about L4."},{"id":"v-ao3","kind":"mcq","l":2,"topic":"Aorta and branches","q":"The only branches of the ascending aorta are the:","c":"Coronary arteries","w":["Brachiocephalic trunk and left common carotid","Bronchial arteries","Internal thoracic arteries"],"e":"The ascending aorta starts at the aortic valve; the right and left coronary arteries leave from the right and left aortic sinuses (of Valsalva). The third sinus is non-coronary."},{"id":"v-ao4","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Which is the usual order of branches from the arch of the aorta?","c":"Brachiocephalic trunk → left common carotid a. → left subclavian a.","w":["Right subclavian a. → right common carotid a. → brachiocephalic trunk","Left subclavian a. → left common carotid a. → brachiocephalic trunk","Brachiocephalic trunk → left subclavian a. → left common carotid a."],"e":"The pattern can vary, but typically the first and largest branch is the brachiocephalic trunk."},{"id":"v-ao5","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Select ALL correct pairs of abdominal aorta branch, approximate level and territory.","c":["Celiac trunk, ~T12: foregut (distal esophagus, stomach, proximal duodenum)","Superior mesenteric a., ~L1: midgut (distal duodenum to about two thirds of the transverse colon)","Inferior mesenteric a., ~L3: hindgut (last third of transverse colon to rectum)","Renal aa., ~L1: kidneys","Gonadal aa., ~L2: ovaries or testes"],"w":["Inferior mesenteric a., ~L1: midgut (distal duodenum to two thirds of the transverse colon)","Celiac trunk, ~L4: hindgut (last third of transverse colon to rectum)"],"e":"Anterior visceral branches (celiac, SMA, IMA) serve the gut. Lateral visceral branches (renal, gonadal) serve paired organs. Parietal branches (e.g. inferior phrenic, lumbar) serve the body wall. Bifurcation at L4."},{"id":"v-ao6","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Where does the thoracic aorta lie, and where does it pass through the diaphragm?","c":"Left posterior mediastinum; aortic hiatus at T12","w":["Middle mediastinum, behind the heart; aortic hiatus at T8","Superior mediastinum; esophageal hiatus at T10","Right posterior mediastinum; caval opening at T8"],"e":"The aortic hiatus is the lowest of the three diaphragm openings: caval T8, esophageal T10, aortic T12."},{"id":"v-ao7","kind":"mcq","l":2,"topic":"Aorta and branches","q":"Branches of the thoracic aorta to the intercostal spaces are called:","c":"Parietal branches","w":["Visceral branches","Anterior visceral branches","Mesenteric branches"],"e":"Parietal (paries = wall) branches serve the thoracic wall; visceral branches serve contents such as the bronchi, pericardium and esophagus."},{"id":"v-cc1","kind":"mcq","l":2,"topic":"Common carotid artery","q":"Which areas external to the cranial cavity are served by the internal carotid arteries?","c":"Orbit and forehead","w":["Deep face","External cranium and scalp","Face"],"e":"The ophthalmic branch supplies the orbit and reaches the forehead. Deep face = maxillary a.; scalp = superficial temporal a.; face = facial a. (all external carotid)."},{"id":"v-cc2","kind":"mcq","l":2,"topic":"Common carotid artery","q":"Select ALL correct statements about the common carotid artery.","c":["The right one arises from the brachiocephalic trunk and the left from the arch of the aorta","It ascends in the carotid sheath with the internal jugular v. and the vagus n. (CN X)","Its terminal branches are the internal and external carotid arteries"],"w":["It passes through the carotid canal into the cranial cavity before it branches","The left one arises from the brachiocephalic trunk and the right from the arch of the aorta"],"e":"Only the internal carotid enters the carotid canal. The external carotid is more anterior and stays outside the skull."},{"id":"v-cc3","kind":"mcq","l":2,"topic":"Common carotid artery","q":"Which structures share the carotid sheath with the common carotid artery?","c":"Internal jugular vein and vagus nerve","w":["External jugular vein and phrenic nerve","Vertebral artery and sympathetic trunk","Subclavian vein and hypoglossal nerve"],"e":"Carotid sheath: common carotid a., internal jugular v., vagus n. (CN X)."},{"id":"v-cc4","kind":"mcq","l":2,"topic":"Common carotid artery","q":"Match the external carotid branches to their territories. Which set is correct?","c":"Facial a.: superficial face; maxillary a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp","w":["Facial a.: deep face (infratemporal fossa, muscles of mastication); maxillary a.: external cranium and scalp; superficial temporal a.: superficial face","Facial a.: orbit and forehead; maxillary a.: superficial face (lips, nose, cheek); superficial temporal a.: the brain and meninges","Maxillary a.: superficial face; facial a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp"],"e":"The maxillary and superficial temporal arteries are the two terminal branches of the external carotid. The facial artery crosses the mandible to the muscles of facial expression."},{"id":"v-cc5","kind":"mcq","l":2,"topic":"Common carotid artery","q":"The two terminal branches of the external carotid artery are the:","c":"Maxillary and superficial temporal arteries","w":["Facial and superficial temporal arteries","Superficial temporal and posterior auricular arteries","Maxillary and occipital arteries"],"e":"They're starred on the slide. The facial artery is a branch, but not terminal."},{"id":"v-cc6","kind":"mcq","l":2,"topic":"Common carotid artery","q":"The internal carotid artery enters the cranium through the:","c":"Carotid canal","w":["Foramen magnum","Jugular foramen","Transverse foramina"],"e":"The vertebral arteries use the transverse foramina (C6 to C1) and foramen magnum."},{"id":"v-cc7","kind":"mcq","l":2,"topic":"Common carotid artery","q":"Which statement about the blood supply to the brain is correct?","c":"Internal carotids supply the anterior circulation and vertebrals the posterior; only about 1 in 5 people have a complete cerebral arterial circle","w":["Vertebral arteries supply the anterior circulation through the carotid canals; nearly everyone has a complete cerebral arterial circle","External carotids supply most of the cerebrum and internal carotids the face; about 1 in 5 people have a complete cerebral arterial circle","Internal carotids supply the posterior circulation and vertebrals the anterior; nearly everyone has a complete cerebral arterial circle"],"e":"Internal carotids enter through the carotid canals (anterior); vertebrals through foramen magnum (posterior). The anterior and posterior communicating arteries complete the circle and allow left-right and front-back collateral flow."},{"id":"v-cc8","kind":"mcq","l":2,"topic":"Common carotid artery","q":"The vertebral arteries reach the brain by passing through:","c":"The transverse foramina of C6 to C1, then foramen magnum","w":["The carotid canals of the temporal bones","The jugular foramina, alongside the internal jugular veins","The intervertebral foramina of C7 to C1, then the foramen ovale"],"e":"They're branches of the first part of the subclavian a. and join each other inside the skull (forming the basilar a.)."},{"id":"v-cc9","kind":"mcq","l":2,"topic":"Common carotid artery","q":"The completeness of the cerebral arterial circle (of Willis) depends on the:","c":"Communicating arteries","w":["External carotid arteries","Maxillary arteries","Subclavian arteries"],"e":"With the communicating arteries in place, blood can be shared left-right and anterior-posterior."},{"id":"v-il1","kind":"mcq","l":2,"topic":"Common iliac artery","q":"Which landmark indicates the transition of the external iliac a. to the femoral a.?","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Pelvic brim","Popliteal fossa"],"e":"The adductor hiatus marks femoral → popliteal. The pelvic brim is where the common iliac splits into internal and external."},{"id":"v-il2","kind":"mcq","l":2,"topic":"Common iliac artery","q":"Select ALL correct statements about the common iliac arteries.","c":["They arise when the abdominal aorta bifurcates at about L4","They bifurcate at the pelvic brim into internal and external iliac arteries","The ureters cross into the pelvis near that bifurcation"],"w":["They bifurcate at the inguinal ligament into internal and external iliac arteries","They arise when the aorta passes the aortic hiatus at about T12"],"e":"Internal iliac → pelvis, viscera and perineum. External iliac → lower limb. The ureter reliably crosses at the common iliac bifurcation."},{"id":"v-il3","kind":"mcq","l":2,"topic":"Common iliac artery","q":"Which statement about the divisions of the internal iliac artery is correct?","c":"Anterior division (most of the flow): pelvic viscera, perineum and gluteal region; posterior division: posterior pelvic wall and gluteal region","w":["Anterior division: lower limb and posterior pelvic wall; posterior division (most of the flow): perineum, pelvic viscera and gluteal region","Posterior division (most of the flow): pelvic viscera and perineum; anterior division: posterior pelvic wall only, never the gluteal region","Anterior division (most of the flow): pelvic viscera and perineum only; posterior division: lower limb and anterior abdominal wall"],"e":"Between them, everything in and making up the pelvis is served by the internal iliac artery. Both divisions send branches to the gluteal region."},{"id":"v-il4","kind":"mcq","l":2,"topic":"Common iliac artery","q":"The internal iliac artery serves the:","c":"Pelvis, pelvic viscera and perineum","w":["Lower limb, through the femoral artery","Kidneys and suprarenal glands","Anterior abdominal wall only"],"e":"The external iliac takes the lower limb."},{"id":"v-il5","kind":"mcq","l":2,"topic":"Common iliac artery","q":"Trace blood from the external iliac a. to the plantar surface of the foot.","c":"External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot","w":["External iliac → (adductor hiatus) femoral → (inguinal ligament) popliteal → posterior tibial → branches to the plantar foot","External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → anterior tibial → branches to the plantar foot","Internal iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot"],"e":"The popliteal artery sends a branch to the anterior leg and dorsal foot, and continues as the larger posterior tibial a. (posterior and lateral leg), whose branches serve the plantar surface."},{"id":"v-il6","kind":"mcq","l":2,"topic":"Common iliac artery","q":"The posterior thigh is served by:","c":"A branch of the femoral artery (the deep femoral)","w":["The posterior tibial artery, through its ascending branches","The anterior division of the internal iliac artery only","The popliteal artery"],"e":"The femoral a. serves the anterior thigh and gives a branch to the posterior thigh."},{"id":"v-il7","kind":"mcq","l":2,"topic":"Common iliac artery","q":"Which structures are found in the femoral triangle?","c":"Femoral vein, artery and nerve (plus lymphatics)","w":["Femoral artery and great saphenous nerve, with no veins","Popliteal artery and vein, with the tibial nerve","External iliac artery and vein, with the ureter"],"e":"The femoral triangle sits just below the inguinal ligament, bordered by sartorius and adductor longus."},{"id":"v-il8","kind":"mcq","l":2,"topic":"Common iliac artery","q":"The femoral artery becomes the popliteal artery at the:","c":"Adductor hiatus","w":["Inguinal ligament","Pelvic brim","Medial malleolus"],"e":"The adductor hiatus is the tunnel through the adductor muscles into the popliteal fossa behind the knee."},{"id":"v-sc1","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"If present, an anastomosis with which artery allows for safe cannulation of the radial artery?","c":"Ulnar a.","w":["Axillary a.","Brachial a.","Deep brachial a.","Subclavian a."],"e":"The radial (deep palmar arch) and ulnar (superficial palmar arch) arteries may anastomose. If they do, the hand still gets blood when the radial is cannulated. The Allen test checks this."},{"id":"v-sc2","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"What is the order of arteries supplying the upper limb?","c":"Subclavian → axillary → brachial → radial and ulnar","w":["Axillary → subclavian → brachial → radial and ulnar","Subclavian → brachial → axillary → radial and ulnar","Brachiocephalic → axillary → radial → brachial"],"e":"Subclavian becomes axillary at the lateral margin of rib 1; axillary becomes brachial at teres major; brachial divides near the cubital fossa."},{"id":"v-sc3","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"Select ALL correct statements about the subclavian artery.","c":["The right one arises from the brachiocephalic trunk; the left from the arch of the aorta","Its three parts are defined by the anterior scalene muscle: medial, posterior and lateral to it","The first part gives off the vertebral a. (brain) and the internal thoracic a. (anterior thoracic and abdominal walls)","It becomes the axillary a. at the lateral margin of rib 1"],"w":["Its three parts are defined by pectoralis minor: medial, posterior and lateral to it","It becomes the axillary a. at the inferior border of teres major"],"e":"Pectoralis minor defines the axillary parts, and teres major marks axillary → brachial. The first part of the subclavian has the most significant branches."},{"id":"v-sc4","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"The internal thoracic artery is a branch of the:","c":"First part of the subclavian artery","w":["Third part of the axillary artery","Thoracic aorta","Second part of the subclavian artery"],"e":"It's the major supply to the anterior thoracic wall and some abdominal wall muscles."},{"id":"v-sc5","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"Which muscle defines the second part of the subclavian artery?","c":"Anterior scalene","w":["Pectoralis minor","Teres major","Sternocleidomastoid"],"e":"First part: medial to anterior scalene. Second: posterior to it. Third: lateral, out to the lateral margin of rib 1."},{"id":"v-sc6","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"Which statement about the axillary artery is correct?","c":"It runs from the lateral margin of rib 1 to teres major, in three parts defined by pectoralis minor; its branches mainly serve the shoulder","w":["It runs from the anterior scalene to the cubital fossa, in three parts defined by teres major; its branches mainly serve the forearm","It runs from the lateral margin of rib 1 to teres major, in two parts defined by subclavius; its first part gives off the vertebral artery","It runs from teres major to the lateral margin of rib 1, where it becomes the subclavian artery; its branches serve the neck"],"e":"Part 1: rib 1 to the medial margin of pectoralis minor. Part 2: behind pectoralis minor. Part 3: lateral to it, down to teres major, where it becomes the brachial a."},{"id":"v-sc7","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"The axillary artery becomes the brachial artery at the:","c":"Inferior border of teres major","w":["Lateral margin of the first rib","Inferior border of pectoralis minor","Cubital fossa"],"e":"Brachial = arm."},{"id":"v-sc8","kind":"mcq","l":2,"topic":"Subclavian artery and upper limb","q":"Select ALL correct statements about the brachial, radial and ulnar arteries.","c":["The brachial a. supplies the arm and has a branch to the posterior arm","The brachial a. divides near the cubital fossa","The radial a. serves the lateral anterior forearm and hand, and feeds the deep palmar arch","The ulnar a. se
