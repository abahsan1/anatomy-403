pace, just right of the sternum","w":["2nd to 3rd intercostal space, just left of the sternum","4th to 5th intercostal space, just left of the sternum","5th intercostal space, left midclavicular line","Wherever you'd like; auscultation is a vibe"],"e":"Right and left here are the patient's right and left (anatomical directions), not the examiner's: Dr. Fox says the aortic site is just to the patient's right of the sternum in the 2nd intercostal space. If you face the patient, that is on your left. The bell goes downstream of the valve, where blood flowing away from it carries the sound. Mnemonic “Apartment”: A P T M = aortic, pulmonic, tricuspid, mitral, moving down and to the patient's left.","lo":"Outline the external locations for valve auscultation.","said":"Dr. Fox's own check question at the end of Cardiac Auscultation.","note":"Stethoscope goes downstream of the valve, in the direction blood flows from it, because the flow carries the sound of the turbulence."},{"l":1,"t":"Auscultation","q":"Select ALL correct auscultation sites.","c":["Aortic: right 2nd intercostal space","Pulmonary: left 2nd (to 3rd) intercostal space","Tricuspid: left 4th to 5th intercostal space, usually 5th","Bicuspid (mitral): left 5th intercostal space, midclavicular line"],"w":["Mitral: right 5th intercostal space, midclavicular line","Pulmonary: right 2nd intercostal space, beside the sternum"],"e":"Aortic on the right; everything else on the left.","lo":"Outline the external locations for valve auscultation.","deep":true},{"l":1,"t":"Auscultation","q":"Why isn't the stethoscope placed directly over each valve?","c":"Sound travels with blood flow, so you listen downstream of each valve","w":["The sternum and costal cartilages block all sound coming directly from the heart","The valves sit too deep for any of their sound to reach the chest wall","Each valve makes sound only in diastole, when the stethoscope can't pick it up","The lungs cover the whole heart, so no sound reaches the front of the chest"],"e":"Directionality carries the sound energy, which is why you count intercostal spaces instead of listening over the valve itself.","lo":"Outline the external locations for valve auscultation.","deep":true},{"l":1,"t":"Auscultation","q":"You stand facing a supine patient to auscultate the aortic valve. Where, from your own point of view, do you place the bell?","c":"On your left of the sternum, in the 2nd intercostal space","w":["On your right of the sternum, in the 2nd intercostal space","On your left of the sternum, in the 5th intercostal space","On your right of the sternum, in the 5th intercostal space","Directly over the sternum, at the level of the 2nd rib"],"e":"Auscultation sites are given in anatomical directions, so “right of the sternum” is the patient's right. Facing the patient, their right is on your left. The aortic site is the patient's right 2nd intercostal space (Dr. Fox, Cardiac Auscultation).","lo":"Outline the external locations for valve auscultation.","deep":true,"note":"Right/left of the sternum means the patient's right/left, not the examiner's."},{"l":1,"t":"Auscultation","q":"Facing a patient, a classmate puts the bell just to her own right of the sternum in the 2nd intercostal space. Which valve is she listening for?","c":"Pulmonary valve","w":["Aortic valve","Tricuspid valve","Bicuspid (mitral) valve","None; this is not a listening site"],"e":"Her right, facing the patient, is the patient's left. The patient's left 2nd (to 3rd) intercostal space beside the sternum is the pulmonary site; the aortic site is the patient's right 2nd space (Dr. Fox, Cardiac Auscultation).","lo":"Outline the external locations for valve auscultation.","deep":true,"note":"Right/left of the sternum means the patient's right/left, not the examiner's."},{"l":1,"t":"External features","q":"Select ALL correct statements about the auricles.","c":["They are external expansions of their respective atria","There is a right auricle and a left auricle","Internally, the auricles contain pectinate muscle","The left auricle is seen along the left border, the only part of the left atrium there"],"w":["They are expansions of the ventricles that hold trabeculae carneae","Only the right atrium has an auricle"],"e":"Each atrium has an ear-like auricle projecting from it on the external surface. Inside, they are lined with pectinate muscle. On the anterior view, the left border is mostly left ventricle with a little left atrium, seen as the left auricle.","lo":"Describe the auricles of the heart.","deep":true},{"l":1,"t":"External features","q":"The internal surface of the auricles is lined with:","c":"Pectinate muscle","w":["Trabeculae carneae","Chordae tendineae","Smooth sinus venarum","Papillary muscles"],"e":"This is stated in the Internal heart features video, not the External features one. At 01:10, with the right atrium opened, Dr. Fox says the pectinate muscle anterior to the crista terminalis is inside the right auricle. At 09:38 the lecture adds that the left atrium has a little pectinate muscle, barely there, anteriorly with the left auricle. Heart basics (03:28) gives the general rule: atria are smooth posteriorly and have comb-like pectinate muscle anteriorly. Trabeculae carneae line the ventricles; the sinus venarum is the smooth posterior right atrium.","lo":"Describe the auricles of the heart.","said":"Internal heart features, 01:10: the pectinate muscle “is going to be inside the auricle of the right atrium.”"},{"l":1,"t":"External features","q":"A dissector opens the left atrium and finds its posterior wall smooth. What would you expect on the anterior wall, near the left auricle?","c":"A little pectinate muscle","w":["Prominent trabeculae carneae","A crista terminalis ridge","Papillary muscles with chordae","A septomarginal trabecula"],"e":"Both atria follow the same rule: smooth posteriorly, pectinate muscle anteriorly in the auricle. In the left atrium the pectinate muscle is described as barely there. The crista terminalis is a right-atrium ridge, and trabeculae carneae and papillary muscles belong to the ventricles.","lo":"Describe the auricles of the heart.","deep":true,"note":"You asked where “auricles are lined with pectinate muscle” was stated: Internal heart features video, 01:10 and 09:38."},{"l":1,"t":"External features","q":"In the opened right atrium, the comb-like pectinate muscle lies anterior to the crista terminalis. Which part of the right atrium is this?","c":"Inside the right auricle","w":["The smooth sinus venarum","The interatrial septum","The rim of the fossa ovalis","The conus arteriosus"],"e":"The crista terminalis divides the right atrium in two: the smooth sinus venarum behind it, where the venae cavae enter, and the pectinate part in front of it, which is the inside of the right auricle. The interatrial septum and fossa ovalis are on the medial wall.","lo":"Describe the auricles of the heart.","deep":true,"note":"You asked where “auricles are lined with pectinate muscle” was stated: Internal heart features video, 01:10 and 09:38."},{"l":1,"t":"Heart basics","q":"Which chamber receives blood from the pulmonary veins?","c":"Left atrium","w":["Right atrium","Left ventricle","Right ventricle","Conus arteriosus"],"e":"Right atrium: SVC, IVC, coronary sinus. Right ventricle: out the pulmonary trunk. Left atrium: pulmonary veins. Left ventricle: out the ascending aorta.","lo":"Describe the four chambers of the heart and how they connect to other parts of the body through vasculature."},{"l":1,"t":"Heart basics","q":"Blood leaving the right ventricle passes which structures, in order, before it next enters the heart?","c":"Pulmonary valve → pulmonary trunk → pulmonary arteries → lungs → pulmonary veins → left atrium","w":["Pulmonary valve → pulmonary veins → lungs → pulmonary arteries → pulmonary trunk → left atrium","Tricuspid valve → pulmonary trunk → pulmonary arteries → lungs → pulmonary veins → right atrium","Aortic valve → ascending aorta → pulmonary arteries → lungs → pulmonary veins → left atrium","Pulmonary valve → pulmonary trunk → pulmonary veins → lungs → pulmonary arteries → left atrium"],"e":"The right side pumps to the lungs (pulmonary loop) and the blood returns to the left atrium. Arteries carry blood away from the heart even when, as in the pulmonary loop, it is deoxygenated.","lo":"Describe the four chambers of the heart and how they connect to other parts of the body through vasculature.","deep":true},{"l":1,"t":"Coronary arteries","q":"The right coronary artery arises from the:","c":"Right aortic sinus","w":["Left aortic sinus","Non-coronary (posterior) aortic sinus","Arch of the aorta","Pulmonary trunk"],"e":"Right sinus → RCA, left sinus → LCA; the third sinus has no coronary artery. The coronary arteries are the only branches of the ascending aorta.","lo":"Explain the origin and pathways of the coronary arteries."},{"l":1,"t":"Coronary arteries","q":"Why do the coronary arteries fill mainly during diastole?","c":"When the aortic valve closes, blood recoils into the aortic sinuses and into the coronary openings","w":["The coronary openings are uncovered only when the AV valves close at the end of diastole","The relaxing myocardium pumps blood forward into the coronary arteries as it lengthens","Coronary blood is pulled in by the negative pressure of the relaxing atria","The coronary arteries have their own valves that open only when the ventricles relax"],"e":"During systole the open aortic cusps sit against the sinus walls and the contracting myocardium compresses the vessels. In diastole, backflow fills the sinuses and the coronary arteries.","lo":"Explain the origin and pathways of the coronary arteries.","deep":true},{"l":1,"t":"Auscultation","q":"The S2 (“dub”) heart sound is made by:","c":"Closure of the semilunar (aortic and pulmonary) valves at the start of diastole","w":["Closure of the AV (tricuspid and bicuspid) valves at the start of ventricular systole","Blood rushing from the atria into the ventricles in early diastole","The atria contracting against a stiff ventricle late in diastole","Turbulent blood leaking back through an AV valve during ventricular systole"],"e":"S1 = AV valves closing as ventricular systole begins. S2 = semilunar valves closing as diastole begins. S3 = turbulence of ventricular filling. S4 = atrial contraction into a stiff ventricle.","lo":"Explain the events that correspond with the various heart sounds."},{"l":1,"t":"Auscultation","q":"Between S1 and S2, the ventricles contract with all four valves closed for a moment. What is this phase called, and what ends it?","c":"Isovolumetric contraction; it ends when ventricular pressure exceeds arterial pressure and the semilunar valves open","w":["Isovolumetric relaxation; it ends when ventricular pressure falls below atrial pressure and the AV valves open","Atrial systole; it ends when atrial pressure falls below ventricular pressure and the AV valves close","Rapid ventricular ejection; it ends when arterial pressure exceeds ventricular pressure and the semilunar valves close","Isovolumetric contraction; it ends when atrial pressure exceeds ventricular pressure and the AV valves open"],"e":"S1 marks AV valve closure. Pressure then rises with no change in volume (isovolumetric contraction) until the semilunar valves open and ejection begins. S2 marks their closure.","lo":"Explain the events that correspond with the various heart sounds.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Which layer of a blood vessel is most affected by autonomic stimulus?","c":"Tunica media","w":["Tunica externa","Tunica interna","Endothelium","Vasa vasorum"],"e":"The tunica media holds the smooth muscle, and that muscle is under autonomic control: constricted = vasoconstriction, relaxed = vasodilation.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","said":"Dr. Fox's own check question at the end of Introduction to Vasculature.","note":"The tunica media is the most variable layer (autonomic control). The interna's elastic lamina provides elasticity; the media's elastic lamina helps bring the wall back together after deformation. · Media = Muscle."},{"l":2,"t":"Vessels and circulation","q":"Select ALL correct statements comparing arteries and veins.","c":["Arteries carry blood away from the heart at higher pressure","Arteries tend to be tortuous","Veins are thin walled and their tunica media lacks the elastic lamina","The tunica interna of many veins forms valves"],"w":["Arteries always carry oxygenated blood","Veins have a thicker tunica media than arteries of the same size"],"e":"Direction defines the vessel, not oxygen: the pulmonary arteries carry deoxygenated blood. Veins keep all three tunics, but the media is a narrow band of smooth muscle with no elastic lamina, and the endothelium often folds into valves for one-way flow.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true,"note":"Arteries typically carry higher O2 (not in the pulmonary circuit). Tortuous = spiral or curled."},{"l":2,"t":"Vessels and circulation","q":"From the lumen outward, the tunica interna of an artery is made of:","c":"Endothelium, basement membrane and a thin elastic lamina","w":["Endothelium, smooth muscle and a thick external elastic lamina","Elastin and collagen fibers with their own vasa vasorum","Endothelium alone, with no basement membrane or lamina","Smooth muscle, elastin and an external elastic lamina"],"e":"Interna: endothelium + basement membrane + thin elastic lamina. Media: smooth muscle (ANS) + a more robust elastic lamina. Externa: elastin and collagen, sometimes with vasa vasorum (vessels that serve the vessel wall).","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins."},{"l":2,"t":"Vessels and circulation","q":"How do elastic (conducting) arteries differ from muscular (distributing) arteries?","c":"Elastic arteries (aorta, pulmonary trunk) have relatively thin walls and act as pressure reservoirs; muscular arteries have a thick tunica media and more tone","w":["Elastic arteries have the thickest tunica media and set vascular tone; muscular arteries (aorta, pulmonary trunk) act as pressure reservoirs","Elastic arteries are the smallest arteries and feed capillary beds directly; muscular arteries are the largest and act as pressure reservoirs","Muscular arteries (aorta, pulmonary trunk) have relatively thin walls and act as pressure reservoirs; elastic arteries have a thick tunica media and more tone","Elastic and muscular arteries have identical walls; they differ only in where they sit in the body"],"e":"The heart ejects straight into the elastic arteries; their well-defined elastic laminae stretch in systole and recoil to keep blood moving. Muscular arteries are the tortuous distributing vessels, toned by the autonomic nervous system.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Arterioles are called “resistance vessels” because:","c":"Their thick smooth muscle narrows or widens them, controlling how much blood gets through","w":["Their walls are a single layer of endothelium that resists the passage of plasma","They have internal valves, like veins, that resist the backflow of blood into arteries","They hold most of the blood volume and resist changes in total blood pressure","Their elastic walls stretch with each beat and store pressure, like the aorta"],"e":"“Resistance” means they can resist (restrict) flow. Arterioles have very thick walls of smooth muscle under autonomic control: constrict them and the lumen narrows, resistance rises and less blood reaches the capillary bed downstream; relax them and more blood gets through. That is how the autonomic nervous system controls how much blood flows into each capillary bed (via metarterioles and their precapillary sphincters).","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"Arterioles are the primary resistance vessel: dilated = more exchange, constricted = less."},{"l":2,"t":"Vessels and circulation","q":"During a sympathetic response, alpha receptors make the arterioles feeding a capillary bed in the skin constrict. What happens to that bed?","c":"Resistance rises, so less blood reaches the bed","w":["Resistance falls, so more blood reaches the bed","Resistance rises, so more blood is forced into the bed","Nothing, since capillaries set their own flow","Resistance falls, so less blood reaches the bed"],"e":"Constricting an arteriole narrows its lumen, which raises resistance and cuts flow to the capillary bed it feeds; “alpha clamps down.” Capillaries have no smooth muscle of their own, so flow into them is set upstream by arterioles (and precapillary sphincters).","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true,"note":"You asked for the resistance-vessel answer to make more sense."},{"l":2,"t":"Vessels and circulation","q":"Sympathetic stimulation mostly causes vasoconstriction of arterioles. Where does it cause vasodilation instead, and why?","c":"Skeletal muscle (and the coronaries), via beta receptors responding mainly to epinephrine","w":["The skin of the face and hands, through alpha receptors that respond to norepinephrine","The gut wall, through parasympathetic fibers that travel with the sympathetic chain","Every capillary bed, because capillaries have no smooth muscle to constrict","The kidneys, through alpha receptors that respond mainly to acetylcholine"],"e":"Alpha receptors “clamp down” (vasoconstriction). Beta receptors, stimulated more by epinephrine than norepinephrine, relax smooth muscle, so skeletal muscle gets more blood during a sympathetic response.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Capillaries are about 5 to 10 µm across. Why does that matter?","c":"Erythrocytes pass one at a time, maximizing gas exchange","w":["It keeps plasma and dissolved solutes from ever leaving the vessel","It lets leukocytes pass through but blocks the larger erythrocytes","It makes capillaries act as pressure reservoirs","It lets erythrocytes pass several abreast for faster flow"],"e":"Capillaries are exchange vessels: just the tunica interna (endothelium + basement membrane), about the width of one erythrocyte.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"A capillary is an artery stripped of its externa, media and internal elastic lamina."},{"l":2,"t":"Vessels and circulation","q":"Select ALL mechanisms that help venous blood return to the heart despite low venous pressure.","c":["Valves that keep flow one-way","Muscle milking by adjacent skeletal muscle","Respiratory milking as the diaphragm changes cavity pressures","Venae comitantes squeezed by the pulsing artery they accompany"],"w":["The elastic recoil of the venous tunica media","Precapillary sphincters pushing blood into venules"],"e":"Veins have no elastic lamina in the media, so they rely on valves plus external squeezing: skeletal muscle, breathing, and the pulse of an accompanying artery bound in the same fascia.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true,"note":"Valves encourage one-way flow. Muscle milking: veins squeezed by adjacent skeletal muscle. Respiratory milking: the diaphragm changes cavity volume, which changes pressure."},{"l":2,"t":"Vessels and circulation","q":"Venae comitantes are:","c":"Accompanying veins, named for the artery they run with","w":["Superficial veins of the limbs that run alone in the subcutaneous fat","Veins that connect two capillary beds in series","Veins of the heart wall that drain into the coronary sinus","Large veins that run without any accompanying artery"],"e":"For example, the radial veins accompany the radial artery and the brachial veins the brachial artery. Deep limb veins are venae comitantes.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins."},{"l":2,"t":"Vessels and circulation","q":"A passenger develops a clot in a deep vein of the leg after a long flight. It breaks loose. Where is it most likely to lodge, and what is that called?","c":"A pulmonary artery, via the IVC and right heart: a pulmonary embolism","w":["A coronary artery, via the left ventricle and aorta: a myocardial infarction","A cerebral artery, via the carotid arteries: an ischemic stroke","The liver sinusoids, via the hepatic portal vein: portal hypertension","A renal artery, via the abdominal aorta: a kidney infarct"],"e":"Thrombus = clot in a vessel; embolism = a clot that travels and lodges. Venous clots go up the IVC, through the right atrium and ventricle, and stop in the narrowing pulmonary arteries. DVT + PE = venous thromboembolism (VTE). Stasis, vascular injury and hypercoagulability raise the risk.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Select ALL correctly classified portal systems.","c":["Hepatic portal system: venous, GI tract capillaries to liver sinusoids","Hypophyseal portal system: venous, hypothalamus to anterior pituitary","Renal portal system: arterial, glomerulus to peritubular capillaries"],"w":["Renal portal system: venous, kidney capillaries to liver sinusoids","Coronary circulation: arterial, aortic sinuses to the cardiac veins"],"e":"A portal system is a vessel connecting two capillary beds in a row, and it is named for that connecting vessel. In the hepatic portal system the GI capillaries drain into veins (the hepatic portal v.), which carry the blood to the liver sinusoids: venous. In the kidney the first bed, the glomerulus, is drained not by a vein but by an efferent arteriole, which carries the blood to the second bed, the peritubular capillaries: arterial. There is at least one per nephron.","lo":"Define the various portal systems and give examples of venous and arterial portal systems.","deep":true,"note":"The renal portal system is a specialized arterial filtration bed."},{"l":2,"t":"Vessels and circulation","q":"What makes the renal portal system arterial rather than venous?","c":"The glomerulus drains into an efferent arteriole, not a vein","w":["The glomerulus drains into the renal vein, not an arteriole","Its blood skips capillaries and goes from artery to vein","It links the kidney capillaries to the liver sinusoids","Its capillaries drain straight into the IVC with no second bed"],"e":"Blood leaves the glomerulus through an efferent arteriole and goes on to the peritubular capillaries. Because the vessel linking the two capillary beds is an arteriole, the system is arterial. In the hepatic portal system that link is a vein, so it is venous.","lo":"Define the various portal systems and give examples of venous and arterial portal systems.","deep":true,"note":"You asked why the renal portal system is arterial."},{"l":2,"t":"Vessels and circulation","q":"The hepatic portal system is called venous and the renal portal system arterial. What decides which label a portal system gets?","c":"The type of vessel linking its two capillary beds","w":["Whether it drains into the venae cavae or the aorta","Whether its organ filters the blood or stores it","How many capillary beds it connects in a row","Whether its first capillary bed is in the thorax or the abdomen"],"e":"Every portal system connects capillary beds in series; the label comes from the connecting vessel. GI capillaries → veins → liver sinusoids is venous; glomerulus → efferent arteriole → peritubular capillaries is arterial.","lo":"Define the various portal systems and give examples of venous and arterial portal systems.","deep":true,"note":"You asked why the renal portal system is arterial."},{"l":2,"t":"Vessels and circulation","q":"What defines a portal system?","c":"A vessel that connects two or more capillary beds","w":["Any vein that drains into the venae cavae","An artery that supplies an organ with two blood supplies","An anastomosis between an artery and a vein","A capillary bed that drains directly into the heart"],"e":"It contrasts with the caval system (the superior and inferior venae cavae and all their tributaries), which returns capillary blood straight to the right atrium.","lo":"Define the various portal systems and give examples of venous and arterial portal systems.","note":"Portal = any vessel connecting 2 sets of capillary beds."},{"l":2,"t":"Vessels and circulation","q":"Which statement correctly contrasts systemic and pulmonary circulation?","c":"Systemic: left heart → body tissues → right atrium. Pulmonary: right heart → lungs for gas exchange → left atrium","w":["Systemic: right heart → body tissues → left atrium. Pulmonary: left heart → lungs for gas exchange → right atrium","Systemic arteries always carry oxygenated blood, and pulmonary arteries always carry oxygenated blood too","Pulmonary circulation includes the coronary and cerebral circulations; systemic circulation includes the lungs","Systemic: left heart → lungs → right atrium. Pulmonary: right heart → body tissues → left atrium"],"e":"Coronary, cerebral, the caval system and the portal systems are all named parts of the systemic loop. In the pulmonary loop, the arteries carry deoxygenated blood.","lo":"Contrast systemic and pulmonary circulation.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Which of these is part of the pulmonary circulation rather than the systemic circulation?","c":"Pulmonary trunk","w":["Coronary arteries","Hepatic portal vein","Cerebral arterial circle","Renal arteries"],"e":"Coronary, cerebral and portal routes are regional names within the systemic loop.","lo":"Contrast systemic and pulmonary circulation."},{"l":2,"t":"Aorta and branches","q":"The brachiocephalic trunk predominantly serves which areas of the body with blood?","c":"Right head and neck, and right upper limb","w":["Both sides of the head and neck, and both upper limbs","Left head and neck","Left head and neck, and left upper limb","Right head and neck only"],"e":"Its two branches are the right common carotid a. (right head and neck) and the right subclavian a. (right upper limb). The left side gets its own common carotid and subclavian straight off the arch.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","said":"Dr. Fox's own check question at the end of Aorta & Branches.","note":"Brachiocephalic = arm and head."},{"l":2,"t":"Aorta and branches","q":"Put the parts of the aorta in order with their vertebral levels.","c":"Ascending aorta → arch (~T4) → thoracic aorta (T5 to the aortic hiatus at T12) → abdominal aorta (T12 to the bifurcation at L4)","w":["Ascending aorta → arch (~T12) → thoracic aorta (T5 to the aortic hiatus at T8) → abdominal aorta (T8 to the bifurcation at L1)","Arch (~T4) → ascending aorta → abdominal aorta (T5 to the aortic hiatus at T12) → thoracic aorta (T12 to the bifurcation at L4)","Ascending aorta → arch (~T4) → thoracic aorta (T5 to the esophageal hiatus at T10) → abdominal aorta (T10 to the bifurcation at L2)","Ascending aorta → thoracic aorta (T4 to T12) → arch (~T12) → abdominal aorta (T12 to the bifurcation at L4)"],"e":"The arch sits at the thoracic plane (sternal angle to the T4/T5 disc). The descending aorta has a thoracic part above the diaphragm and an abdominal part below; it bifurcates into the common iliac arteries at about L4.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","deep":true,"note":"Thoracic aorta: superior to the diaphragm. Abdominal aorta: inferior to it."},{"l":2,"t":"Aorta and branches","q":"The only branches of the ascending aorta are the:","c":"Coronary arteries","w":["Brachiocephalic trunk and left common carotid","Bronchial arteries","Internal thoracic arteries","Left subclavian and vertebral arteries"],"e":"The ascending aorta starts at the aortic valve; the right and left coronary arteries leave from the right and left aortic sinuses (of Valsalva). The third sinus is non-coronary.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied."},{"l":2,"t":"Aorta and branches","q":"Which is the usual order of branches from the arch of the aorta?","c":"Brachiocephalic trunk → left common carotid a. → left subclavian a.","w":["Right subclavian a. → right common carotid a. → brachiocephalic trunk","Left subclavian a. → left common carotid a. → brachiocephalic trunk","Brachiocephalic trunk → left subclavian a. → left common carotid a.","Left common carotid a. → brachiocephalic trunk → left subclavian a."],"e":"The pattern can vary, but typically the first and largest branch is the brachiocephalic trunk.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied."},{"l":2,"t":"Aorta and branches","q":"Select ALL correct pairs of abdominal aorta branch, approximate level and territory.","c":["Celiac trunk, ~T12: foregut (distal esophagus, stomach, proximal duodenum)","Superior mesenteric a., ~L1: midgut (distal duodenum to about two thirds of the transverse colon)","Inferior mesenteric a., ~L3: hindgut (last third of transverse colon to rectum)","Renal aa., ~L1: kidneys","Gonadal aa., ~L2: ovaries or testes"],"w":["Inferior mesenteric a., ~L1: midgut (distal duodenum to two thirds of the transverse colon)","Celiac trunk, ~L4: hindgut (last third of transverse colon to rectum)"],"e":"Anterior visceral branches (celiac, SMA, IMA) serve the gut. Lateral visceral branches (renal, gonadal) serve paired organs. Parietal branches (e.g. inferior phrenic, lumbar) serve the body wall. Bifurcation at L4.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","deep":true,"note":"Matching question: levels, where the branches go, and which artery or trunk. · Celiac ~T12 comes first; SMA and renals ~L1; gonadals ~L2, in between; IMA lowest (~L3)."},{"l":2,"t":"Aorta and branches","q":"Where does the thoracic aorta lie, and where does it pass through the diaphragm?","c":"Left posterior mediastinum; aortic hiatus at T12","w":["Middle mediastinum, behind the heart; aortic hiatus at T8","Superior mediastinum; esophageal hiatus at T10","Right posterior mediastinum; caval opening at T8","Anterior mediastinum, behind the sternum; aortic hiatus at T12"],"e":"The aortic hiatus is the lowest of the three diaphragm openings: caval T8, esophageal T10, aortic T12.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"The aortic hiatus (T12) is the lowest of the caval, esophageal and aortic openings."},{"l":2,"t":"Aorta and branches","q":"Branches of the thoracic aorta to the intercostal spaces are called:","c":"Parietal branches","w":["Visceral branches","Anterior visceral branches","Mesenteric branches","Coronary branches"],"e":"Parietal (paries = wall) branches serve the thoracic wall; visceral branches serve contents such as the bronchi, pericardium and esophagus.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied."},{"l":2,"t":"Common carotid artery","q":"Which areas external to the cranial cavity are served by the internal carotid arteries?","c":"Orbit and forehead","w":["Deep face","External cranium and scalp","Face","Brain and meninges"],"e":"The ophthalmic branch supplies the orbit and reaches the forehead. Deep face = maxillary a.; scalp = superficial temporal a.; face = facial a. (all external carotid).","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served.","said":"Dr. Fox's own check question at the end of Common Carotid Artery & Branches.","note":"Orbit and forehead = ophthalmic a., a branch of the ICA."},{"l":2,"t":"Common carotid artery","q":"Select ALL correct statements about the common carotid artery.","c":["The right one arises from the brachiocephalic trunk and the left from the arch of the aorta","It ascends in the carotid sheath with the internal jugular v. and the vagus n. (CN X)","Its terminal branches are the internal and external carotid arteries"],"w":["It passes through the carotid canal into the cranial cavity before it branches","The left one arises from the brachiocephalic trunk and the right from the arch of the aorta"],"e":"Terminal branches are the two vessels the common carotid ends by splitting into: the internal and external carotids. The ophthalmic a. does not come off the common carotid at all. It is a branch of the internal carotid, given off after the ICA passes through the carotid canal, so it sits one level further down the tree. The external carotid works the same way: it has its own terminal branches (maxillary, superficial temporal) plus other branches such as the facial. Don't mix up the carotid sheath and the carotid canal: the sheath is the fascial tube in the neck that the common carotid ascends in, with the internal jugular v. and vagus n.; the canal is the opening in the skull, and only the internal carotid passes through it. The external carotid stays outside the skull.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true},{"l":2,"t":"Common carotid artery","q":"Following the common carotid a. up the neck in a dissection, where would you find the origin of the ophthalmic a.?","c":"On the internal carotid a., after the carotid canal","w":["On the common carotid a., just below its bifurcation","On the external carotid a., near the facial a.","On the maxillary a., in the infratemporal fossa","On the superficial temporal a., in front of the ear"],"e":"The common carotid gives rise to the internal and external carotids. The ophthalmic a. is a branch of the internal carotid, after the ICA has passed through the carotid canal; it supplies the orbit and forehead. The facial and maxillary aa. are external carotid branches.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true,"note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common carotid artery","q":"Why does the ophthalmic a. not contradict the rule that the internal and external carotids are the terminal branches of the common carotid?","c":"It comes off the internal carotid, after the common carotid has ended","w":["It is a third terminal branch, too small to be named on most slides","It comes off the vertebral a., after it passes through foramen magnum","It branches off the common carotid, but only after entering the skull","It comes off the external carotid, which ends before the internal does"],"e":"Terminal means the vessel ends by splitting into those branches. The common carotid ends by dividing into the internal and external carotids; the ophthalmic comes off the internal carotid, one level down. The vertebral aa. enter through foramen magnum and supply the posterior brain, not the orbit.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true,"note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common carotid artery","q":"Which structures share the carotid sheath with the common carotid artery?","c":"Internal jugular vein and vagus nerve","w":["External jugular vein and phrenic nerve","Vertebral artery and sympathetic trunk","Subclavian vein and hypoglossal nerve","Recurrent laryngeal nerve and thyroid gland"],"e":"Carotid sheath: common carotid a., internal jugular v., vagus n. (CN X).","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a."},{"l":2,"t":"Common carotid artery","q":"Match the external carotid branches to their territories. Which set is correct?","c":"Facial a.: superficial face; maxillary a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp","w":["Facial a.: deep face (infratemporal fossa, muscles of mastication); maxillary a.: external cranium and scalp; superficial temporal a.: superficial face","Facial a.: orbit and forehead; maxillary a.: superficial face (lips, nose, cheek); superficial temporal a.: the brain and meninges","Maxillary a.: superficial face; facial a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp","Superficial temporal a.: superficial face; facial a.: external cranium and scalp; maxillary a.: deep face (infratemporal fossa, muscles of mastication)"],"e":"The maxillary and superficial temporal arteries are the two terminal branches of the external carotid. The facial artery crosses the mandible to the muscles of facial expression.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served.","deep":true,"note":"Facial a. → muscles of facial expression. * = terminal branch (maxillary, superficial temporal)."},{"l":2,"t":"Common carotid artery","q":"The two terminal branches of the external carotid artery are the:","c":"Maxillary and superficial temporal arteries","w":["Facial and superficial temporal arteries","Superficial temporal and posterior auricular arteries","Maxillary and occipital arteries","Facial and maxillary arteries"],"e":"They're starred on the slide. The facial artery is a branch, but not terminal.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served."},{"l":2,"t":"Common carotid artery","q":"The internal carotid artery enters the cranium through the:","c":"Carotid canal","w":["Foramen magnum","Jugular foramen","Transverse foramina","Foramen ovale"],"e":"The vertebral arteries use the transverse foramina (C6 to C1) and foramen magnum.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served."},{"l":2,"t":"Common carotid artery","q":"Which statement about the blood supply to the brain is correct?","c":"Internal carotids supply the anterior circulation and vertebrals the posterior; only about 1 in 5 people have a complete cerebral arterial circle","w":["Vertebral arteries supply the anterior circulation through the carotid canals; nearly everyone has a complete cerebral arterial circle","External carotids supply most of the cerebrum and internal carotids the face; about 1 in 5 people have a complete cerebral arterial circle","Internal carotids supply the posterior circulation and vertebrals the anterior; nearly everyone has a complete cerebral arterial circle","Internal carotids and vertebrals each supply half of the brain from the same side; about 1 in 5 people lack a cerebral arterial circle"],"e":"Internal carotids enter through the carotid canals (anterior); vertebrals through foramen magnum (posterior). The anterior and posterior communicating arteries complete the circle and allow left-right and front-back collateral flow.","lo":"Diagram the major blood supply to the brain.","deep":true},{"l":2,"t":"Common carotid artery","q":"The vertebral arteries reach the brain by passing through:","c":"The transverse foramina of C6 to C1, then foramen magnum","w":["The carotid canals of the temporal bones","The jugular foramina, alongside the internal jugular veins","The intervertebral foramina of C7 to C1, then the foramen ovale","The foramen lacerum, after running up beside the trachea"],"e":"They're branches of the first part of the subclavian a. and join each other inside the skull (forming the basilar a.).","lo":"Diagram the major blood supply to the brain."},{"l":2,"t":"Common carotid artery","q":"The completeness of the cerebral arterial circle (of Willis) depends on the:","c":"Communicating arteries","w":["External carotid arteries","Maxillary arteries","Subclavian arteries","Vertebral arteries"],"e":"With the communicating arteries in place, blood can be shared left-right and anterior-posterior.","lo":"Diagram the major blood supply to the brain."},{"l":2,"t":"Common iliac artery","q":"Which landmark indicates the transition of the external iliac a. to the femoral a.?","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Pelvic brim","Popliteal fossa"],"e":"The adductor hiatus marks femoral → popliteal. The pelvic brim is where the common iliac splits into internal and external.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","said":"Dr. Fox's own check question at the end of Common Iliac Artery & Branches."},{"l":2,"t":"Common iliac artery","q":"Select ALL correct statements about the common iliac arteries.","c":["They arise when the abdominal aorta bifurcates at about L4","They bifurcate at the pelvic brim into internal and external iliac arteries","The ureters cross into the pelvis near that bifurcation"],"w":["They bifurcate at the inguinal ligament into internal and external iliac arteries","They arise when the aorta passes the aortic hiatus at about T12"],"e":"Internal iliac → pelvis, viscera and perineum. External iliac → lower limb. The ureter reliably crosses at the common iliac bifurcation.","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery.","deep":true,"note":"External iliac → femoral at the inguinal ligament."},{"l":2,"t":"Common iliac artery","q":"Which statement about the divisions of the internal iliac artery is correct?","c":"Anterior division (most of the flow): pelvic viscera, perineum and gluteal region; posterior division: posterior pelvic wall and gluteal region","w":["Anterior division: lower limb and posterior pelvic wall; posterior division (most of the flow): perineum, pelvic viscera and gluteal region","Posterior division (most of the flow): pelvic viscera and perineum; anterior division: posterior pelvic wall only, never the gluteal region","Anterior division (most of the flow): pelvic viscera and perineum only; posterior division: lower limb and anterior abdominal wall","Both divisions share the flow equally; each supplies only the pelvic viscera, never the perineum or gluteal region"],"e":"Between them, everything in and making up the pelvis is served by the internal iliac artery. Both divisions send branches to the gluteal region.","lo":"Describe the divisions of the internal iliac artery and regions served.","deep":true},{"l":2,"t":"Common iliac artery","q":"The internal iliac artery serves the:","c":"Pelvis, pelvic viscera and perineum","w":["Lower limb, through the femoral artery","Kidneys and suprarenal glands","Anterior abdominal wall only","Anterior thigh, through the deep femoral artery"],"e":"The external iliac takes the lower limb.","lo":"Describe the divisions of the internal iliac artery and regions served."},{"l":2,"t":"Common iliac artery","q":"Trace blood from the external iliac a. to the plantar surface of the foot.","c":"External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot","w":["External iliac → (adductor hiatus) femoral → (inguinal ligament) popliteal → posterior tibial → branches to the plantar foot","External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → anterior tibial → branches to the plantar foot","Internal iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot","External iliac → (inguinal ligament) popliteal → (adductor hiatus) femoral → posterior tibial → branches to the plantar foot"],"e":"The popliteal artery sends a branch to the anterior leg and dorsal foot, and continues as the larger posterior tibial a. (posterior and lateral leg), whose branches serve the plantar surface.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","deep":true,"note":"Posterior tibial a. = plantar surface of the foot. The path to the sole never goes through the branch to the anterior leg and dorsal foot."},{"l":2,"t":"Common iliac artery","q":"The posterior thigh is served by:","c":"A branch of the femoral artery (the deep femoral)","w":["The posterior tibial artery, through its ascending branches","The anterior division of the internal iliac artery only","The popliteal artery","The superficial branches of the great saphenous vein"],"e":"The femoral a. serves the anterior thigh and gives a branch to the posterior thigh.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery."},{"l":2,"t":"Common iliac artery","q":"Which structures are found in the femoral triangle?","c":"Femoral vein, artery and nerve (plus lymphatics)","w":["Femoral artery and great saphenous nerve, with no veins","Popliteal artery and vein, with the tibial nerve","External iliac artery and vein, with the ureter","Femoral artery, vein and nerve, with the sciatic nerve"],"e":"The femoral triangle sits just below the inguinal ligament, bordered by sartorius and adductor longus.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery."},{"l":2,"t":"Common iliac artery","q":"The femoral artery becomes the popliteal artery at the:","c":"Adductor hiatus","w":["Inguinal ligament","Pelvic brim","Medial malleolus","Popliteal fossa's lower border"],"e":"The adductor hiatus is the tunnel through the adductor muscles into the popliteal fossa behind the knee.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","note":"Femoral → popliteal at the adductor hiatus."},{"l":2,"t":"Subclavian artery and upper limb","q":"If present, an anastomosis with which artery allows for safe cannulation of the radial artery?","c":"Ulnar a.","w":["Axillary a.","Brachial a.","Deep brachial a.","Subclavian a."],"e":"The radial (deep palmar arch) and ulnar (superficial palmar arch) arteries typically anastomose, but not always. If they do, the hand still gets blood when the radial is cannulated. The Allen test checks this.","lo":"Explain the Allen test.","said":"Dr. Fox's own check question at the end of Subclavian Artery & Branches."},{"l":2,"t":"Subclavian artery and upper limb","q":"What is the order of arteries supplying the upper limb?","c":"Subclavian → axillary → brachial → radial and ulnar","w":["Axillary → subclavian → brachial → radial and ulnar","Subclavian → brachial → axillary → radial and ulnar","Brachiocephalic → axillary → radial → brachial","Subclavian → axillary → radial → brachial and ulnar"],"e":"Subclavian becomes axillary at the lateral margin of rib 1; axillary becomes brachial at teres major; brachial divides near the cubital fossa.","lo":"Describe the high-level pattern of blood supply to the upper limb."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the subclavian artery.","c":["The right one arises from the brachiocephalic trunk; the left from the arch of the aorta","Its three parts are defined by the anterior scalene muscle: medial, posterior and lateral to it","The first part gives off the vertebral a. (brain) and the internal thoracic a. (anterior thoracic and abdominal walls)","It becomes the axillary a. at the lateral margin of rib 1"],"w":["Its three parts are defined by pectoralis minor: medial, posterior and lateral to it","It becomes the axillary a. at the inferior border of teres major"],"e":"Pectoralis minor defines the axillary parts, and teres major marks axillary → brachial. The first part of the subclavian has the most significant branches.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve.","deep":true,"note":"1st part: medial to anterior scalene (vertebral a. → posterior brain supply). 2nd: posterior to it. 3rd: lateral to it, to the first rib."},{"l":2,"t":"Subclavian artery and upper limb","q":"The internal thoracic artery is a branch of the:","c":"First part of the subclavian artery","w":["Third part of the axillary artery","Thoracic aorta","Second part of the subclavian artery","Brachiocephalic trunk"],"e":"It's the major supply to the anterior thoracic wall and some abdominal wall muscles.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"Which muscle defines the second part of the subclavian artery?","c":"Anterior scalene","w":["Pectoralis minor","Teres major","Sternocleidomastoid","Subclavius"],"e":"First part: medial to anterior scalene. Second: posterior to it. Third: lateral, out to the lateral margin of rib 1.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"Which statement about the axillary artery is correct?","c":"It runs from the lateral margin of rib 1 to teres major, in three parts defined by pectoralis minor; its branches mainly serve the shoulder","w":["It runs from the anterior scalene to the cubital fossa, in three parts defined by teres major; its branches mainly serve the forearm","It runs from the lateral margin of rib 1 to teres major, in two parts defined by subclavius; its first part gives off the vertebral artery","It runs from teres major to the lateral margin of rib 1, where it becomes the subclavian artery; its branches serve the neck","It runs from the lateral margin of rib 1 to pectoralis minor, in three parts defined by teres major; its branches mainly serve the neck"],"e":"Part 1: rib 1 to the medial margin of pectoralis minor. Part 2: behind pectoralis minor. Part 3: lateral to it, down to teres major, where it becomes the brachial a.","lo":"Describe the axillary a. and its parts (and what defines them).","deep":true,"note":"1st part: lateral margin of rib 1 to the medial margin of pec minor. 2nd: posterior to pec minor. 3rd: lateral to pec minor, to teres major. Brachial = arm."},{"l":2,"t":"Subclavian artery and upper limb","q":"The axillary artery becomes the brachial artery at the:","c":"Inferior border of teres major","w":["Lateral margin of the first rib","Inferior border of pectoralis minor","Cubital fossa","Lateral border of pectoralis minor"],"e":"Brachial = arm.","lo":"Describe the axillary a. and its parts (and what defines them)."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the brachial, radial and ulnar arteries.","c":["The brachial a. supplies the arm and has a branch to the posterior arm","The brachial a. divides near the cubital fossa","The radial a. serves the lateral anterior forearm and hand, and feeds the deep palmar arch","The ulnar a. serves the medial and deep anterior forearm and some of the hand, and feeds the superficial palmar arch"],"w":["The radial a. serves the medial anterior forearm and hand, and feeds the superficial palmar arch","The brachial a. divides at the inferior border of teres major, high in the arm"],"e":"Radial = lateral (thumb side), deep arch. Ulnar = medial, superficial arch. The arches may anastomose.","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve.","deep":true},{"l":2,"t":"Subclavian artery and upper limb","q":"The radial artery primarily feeds the:","c":"Deep palmar arch","w":["Superficial palmar arch","Dorsal venous arch","Cubital fossa","Palmar digital arteries only"],"e":"Ulnar → superficial palmar arch.","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"During an Allen test, both radial and ulnar arteries are compressed and the hand is clenched. When pressure on the ulnar artery is released, the palm stays pale. What does this mean?","c":"The ulnar–radial anastomosis is inadequate, so cannulating the radial artery is not safe","w":["The test passed; collateral flow is adequate, so the radial artery is safe to cannulate","The radial artery is blocked, so it should be cannulated to restore flow to the palm","The brachial artery is occluded above the elbow, so neither forearm artery can be used","The ulnar artery is adequate, so the radial artery can be cannulated without risk"],"e":"The test occludes both arteries, then releases one at a time and watches the palm flush with color. If color doesn't return with only the ulnar side open, the ulnar can't supply the hand on its own, a failed Allen test.","lo":"Explain the Allen test.","deep":true},{"l":2,"t":"Superior vena cava","q":"The venous angle is the union of the subclavian v. with which other vein?","c":"Internal jugular v.","w":["External jugular v.","Inferior vena cava","Superior vena cava","Brachiocephalic v."],"e":"Internal jugular + subclavian = brachiocephalic v. The venous angle is where lymph (thoracic duct or right lymphatic duct) returns to venous blood.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","said":"Dr. Fox's own check question at the end of Superior Vena Cava & Tributaries."},{"l":2,"t":"Superior vena cava","q":"Select ALL correct statements about the superior vena cava and its tributaries.","c":["The SVC drains everything above the diaphragm into the right atrium","It is the union of the right and left brachiocephalic veins","The left brachiocephalic v. is longer and more oblique than the right","The internal jugular v. drains the head and neck; the subclavian v. drains the upper limb, neck and thorax"],"w":["The SVC is formed by the union of the two internal jugular veins behind the manubrium","The right brachiocephalic v. is longer and more oblique than the left"],"e":"Each brachiocephalic v. = internal jugular + subclavian, meeting at the venous angle. The SVC empties into the sinus venarum of the right atrium.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","deep":true,"note":"The left brachiocephalic vein is longer. · SVC = union of the right and left brachiocephalic veins."},{"l":2,"t":"Superior vena cava","q":"Which statement about the superficial veins of the upper limb is correct?","c":"Cephalic v.: lateral, into the axillary v. Basilic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","w":["Basilic v.: lateral, into the axillary v. Cephalic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","Cephalic v.: lateral, joins the brachial veins to form the axillary v. Basilic v.: medial, into the cephalic v. Median cubital v.: a deep vena comitans","Cephalic v.: medial, into the subclavian v. Basilic v.: lateral, into the cephalic v. Median cubital v.: links them; avoided for venipuncture","Cephalic v.: lateral, into the brachial veins. Basilic v.: medial, into the internal jugular v. Median cubital v.: links them; used for venipuncture"],"e":"Basilic + brachial veins = axillary v.; the cephalic v. joins the axillary v. later. All deep veins of the limb are venae comitantes.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","deep":true},{"l":2,"t":"Superior vena cava","q":"Which vein is commonly used for venipuncture?","c":"Median cubital vein","w":["Cephalic vein at the deltopectoral groove","Brachial vein","Internal jugular vein","Subclavian vein"],"e":"It connects the cephalic and basilic veins across the cubital fossa.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava."},{"l":2,"t":"Superior vena cava","q":"The axillary vein is formed by:","c":"The basilic vein joining the brachial veins","w":["The cephalic and basilic veins joining at the elbow","The internal jugular and subclavian veins joining","The radial and ulnar veins joining in the cubital fossa","The cephalic vein joining the subclavian vein"],"e":"The cephalic v. drains into the axillary v. as it crosses the axilla.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava."},{"l":2,"t":"Inferior vena cava","q":"Which structures' venous pathway includes the left renal vein?","c":"Left gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland","w":["Left inferior surface of the diaphragm, left kidney, left suprarenal gland and liver","Spleen, and left inferior surface of the diaphragm, kidney and suprarenal gland","Right gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland","Left gonad, right inferior surface of the diaphragm, right kidney and right suprarenal gland"],"e":"The long left renal v. collects the left gonadal v. and a common trunk from the left hemidiaphragm and left suprarenal gland. The spleen drains to the hepatic portal system, and the liver through the hepatic veins.","lo":"Explain regions drained by IVC tributaries.","said":"Dr. Fox's own check question at the end of Inferior Vena Cava & Tributaries."},{"l":2,"t":"Inferior vena cava","q":"Select ALL correct statements about the inferior vena cava.","c":["It drains everything inferior to the diaphragm into the right atrium","It passes through the caval hiatus of the diaphragm at about T8","It lies to the right of the abdominal aorta","It begins as the union of the common iliac veins"],"w":["It receives the superior and inferior mesenteric veins directly","It passes through the aortic hiatus at T12"],"e":"Diaphragm hiatuses: caval T8, esophageal T10, aortic T12. Gut blood goes through the hepatic portal system and reaches the IVC only via the hepatic veins.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","deep":true,"note":"The IVC is the conduit of blood return below the diaphragm; it is formed by the union of the common iliac veins. · The gut territories of the celiac, SMA and IMA drain into the hepatic portal system, not straight into the IVC."},{"l":2,"t":"Inferior vena cava","q":"IVC tributaries roughly mirror the branches of the abdominal aorta. What is the major exception, and why?","c":"No veins match the celiac trunk, SMA or IMA, because gut blood goes to the liver through the hepatic portal system","w":["No veins match the renal arteries, because the kidneys drain into the hepatic portal system instead of the IVC","No veins match the gonadal arteries, because the gonads drain into the internal iliac veins instead of the IVC","No veins match the lumbar arteries, because the body wall drains only into the azygos system instead of the IVC","No veins match the common iliac arteries, because the legs drain into the azygos system instead of the IVC"],"e":"Gut blood enters the hepatic portal v., passes through the liver sinusoids, and returns to the IVC via the three hepatic veins.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","deep":true,"note":"No celiac or superior mesenteric veins: they are part of the hepatic portal system, the exception to arteries being mirrored."},{"l":2,"t":"Inferior vena cava","q":"Where does the right gonadal vein drain, compared with the left?","c":"Right: directly into the IVC; left: into the left renal vein","w":["Right: into the right renal vein; left: directly into the IVC","Both drain into the hepatic portal vein","Both drain directly into the IVC","Right: into the left renal vein; left: directly into the IVC"],"e":"The asymmetry of the left veins is mostly about the long left renal vein, which crosses the aorta (under the SMA) to reach the IVC on the right.","lo":"Explain regions drained by IVC tributaries.","deep":true},{"l":2,"t":"Inferior vena cava","q":"The great saphenous vein drains into the:","c":"Femoral vein, in the femoral triangle","w":["Popliteal vein, in the popliteal fossa","External iliac vein, above the inguinal ligament","Small saphenous vein at the knee","Internal iliac vein, in the pelvis"],"e":"Great saphenous: medial foot (closely related to the medial malleolus), up the medial limb to the femoral v. Small saphenous: lateral foot, up the leg to the popliteal v.","lo":"Explain regions drained by IVC tributaries.","note":"Great saphenous: medial, passes the medial malleolus. · Small saphenous drains into the popliteal v.; great saphenous drains into the femoral v."},{"l":2,"t":"Inferior vena cava","q":"The boundary between the external iliac vein and the femoral vein is the:","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Medial malleolus","Pelvic brim"],"e":"Same landmark as for the arteries.","lo":"Explain regions drained by IVC tributaries."},{"l":2,"t":"Inferior vena cava","q":"The small saphenous vein drains the:","c":"Lateral foot and leg, into the popliteal vein","w":["Medial foot and leg, into the femoral vein","Plantar foot, into the posterior tibial artery","Medial thigh, into the great saphenous vein","Anterior thigh, into the external iliac vein"],"e":"Deep lower limb veins are venae comitantes (posterior tibial, popliteal, femoral).","lo":"Explain regions drained by IVC tributaries.","note":"Small saphenous: lateral, passes the lateral malleolus."},{"l":2,"t":"Hepatic portal system","q":"The hepatic portal system delivers material from which source tissues to the sinusoids of the liver?","c":"GI tract","w":["Esophagus, proximal","Kidneys","Lower limbs","Upper limbs"],"e":"From the distal esophagus to the rectum. Kidneys and lower limbs drain to the caval system.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","said":"Dr. Fox's own check question at the end of Hepatic Portal System."},{"l":2,"t":"Hepatic portal system","q":"Trace absorbed nutrients from the small intestine back to the heart.","c":"GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → IVC → right atrium","w":["GI capillaries → superior mesenteric v. → hepatic veins → liver sinusoids → hepatic portal v. (SMV + splenic v.) → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + renal v.) → liver sinusoids → hepatic veins → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → SVC → right atrium","GI capillaries → hepatic portal v. (SMV + splenic v.) → superior mesenteric v. → liver sinusoids → hepatic veins → IVC → right atrium"],"e":"The hepatic portal v. is portal (connects GI capillaries to liver sinusoids). The three hepatic veins are caval. The inferior mesenteric v. usually drains into the splenic v.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","deep":true},{"l":2,"t":"Hepatic portal system","q":"The hepatic portal vein is formed by the union of the:","c":"Superior mesenteric vein and splenic vein","w":["Inferior mesenteric vein and splenic vein","Superior and inferior mesenteric veins","Hepatic veins and the IVC","Splenic vein and left renal vein"],"e":"SMV + splenic v. = hepatic portal v. Everything else is a tributary of one of those two.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses."},{"l":2,"t":"Hepatic portal system","q":"Select ALL sites where portacaval anastomoses can form varices in portal hypertension.","c":["Distal esophagus (esophageal varices)","Periumbilical region (caput medusae)","Anorectal submucosa (superior with inferior rectal veins)"],"w":["The dorsal venous arch of the foot (saphenous varices)","The venous angle of the neck (jugular varices)"],"e":"Portal hypertension (e.g. cirrhosis, thrombosis) enlarges portal tributaries until they connect with nearby caval veins. Mnemonic: “butts, guts and caputs.” Esophageal varices are the most diagnostic.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","deep":true,"note":"Varices = enlarged blood vessels from raised pressure."},{"l":2,"t":"Hepatic portal system","q":"Which pairing of portal and caval veins forms the esophageal portacaval anastomosis?","c":"Left gastric v. (portal) with esophageal veins (caval)","w":["Paraumbilical v. (portal) with epigastric veins (caval)","Superior rectal v. (portal) with inferior rectal v. (caval)","Splenic v. (portal) with left renal v. (caval)","Hepatic v. (portal) with azygos veins (caval)"],"e":"Periumbilical: paraumbilical with epigastric veins. Anorectal: superior rectal (portal) with inferior rectal (caval).","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses."},{"l":2,"t":"Hepatic portal system","q":"Are the hepatic veins part of the portal or the caval system?","c":"Caval: they drain the liver sinusoids into the IVC","w":["Portal: they carry absorbed GI blood into the liver sinusoids","Neither: they are lymphatic vessels of the liver","Portal: they connect two capillary beds in series","Caval: they drain the GI tract directly into the IVC"],"e":"Hepatic portal v. = portal (into the liver). Hepatic veins (3) = caval (out of the liver).","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","note":"Hepatic portal vein: portal in nature. The 3 hepatic veins: caval in nature."},{"l":3,"t":"Introduction to blood","q":"A patient experiencing acidemia may compensate for that with which mechanism?","c":"An elevated rate of respiration","w":["A depressed rate of respiration","Increased retention of protons by the kidneys","Increased rate of excretion of bicarbonate by the kidneys","Slower breathing to retain more CO2"],"e":"Hyperventilating blows off more CO2, a volatile acid, which raises pH. In acidemia the kidneys should excrete protons and retain bicarbonate, the opposite of the other options.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","said":"Dr. Fox's own check question at the end of Intro to Blood."},{"l":3,"t":"Introduction to blood","q":"Select ALL correct statements about the components of whole blood.","c":["Plasma is about 55% of whole blood and formed elements about 45%","Plasma is about 92% water","Erythrocytes are the most abundant formed element (4.8 to 5.4 million/µL)","Leukocytes are the least abundant formed element (5,000 to 10,000/µL)"],"w":["Thrombocytes are the most abundant formed element","Formed elements make up about 55% of whole blood"],"e":"Thrombocytes (150,000 to 400,000/µL) sit between erythrocytes and leukocytes. Whole blood is about 8% of body weight.","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Introduction to blood","q":"Select ALL correct pairs of blood function category and example.","c":["Transportation: gases, nutrients, wastes, hormones and cytokines","Regulation: pH, temperature and water balance","Protection: immune responses and clotting"],"w":["Regulation: producing antibodies in the liver","Protection: maintaining oncotic pressure"],"e":"Transportation, regulation and protection are the three buckets. Blood is a part-time host to the immune system; the lymphatic system is the other host.","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Introduction to blood","q":"Blood pH below 7.35 is called:","c":"Acidemia","w":["Alkalemia","Hypoxemia","Acidosis of the tissues only","Hypercapnia"],"e":"Normal range 7.35 to 7.45 (“physiologically neutral”, slightly alkaline chemically). Above 7.45 = alkalemia.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis."},{"l":3,"t":"Introduction to blood","q":"Why must blood pH stay between 7.35 and 7.45? Select ALL reasons given in lecture.","c":["Protein chemistry: proteins can stop working or denature","Neuron and muscle cell physiology depends on delicate ion balances","Oxygen delivery to tissues","Electrolyte balance"],"w":["It keeps erythrocytes from developing nuclei","It sets the ABO blood type"],"e":"Outside the range, cardiac, skeletal and smooth muscle and the nervous system stop working optimally.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true,"note":"7.35 to 7.45 is physiologically neutral."},{"l":3,"t":"Introduction to blood","q":"Which statement about compensation for a pH disturbance is correct?","c":"Lungs adjust pH quickly through ventilation (CO2 loss); kidneys adjust slowly by excreting or retaining H+ and HCO3−","w":["Kidneys adjust pH quickly by excreting or retaining H+ and HCO3−; lungs adjust slowly over days by changing ventilation","In alkalemia the lungs hyperventilate to retain CO2, and the kidneys retain extra bicarbonate to help","In acidemia the kidneys excrete bicarbonate and retain protons, and the lungs slow ventilation to match","Lungs and kidneys both adjust pH within seconds; neither can hold CO2 or bicarbonate back"],"e":"Acidemia: hyperventilate, kidneys excrete H+ and retain HCO3−. Alkalemia: hypoventilate (retain CO2), kidneys excrete HCO3− and retain H+.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true,"note":"Hyperventilation moves more gas through the lungs; hypoventilation decreases gas exchange. The kidneys are slow."},{"l":3,"t":"Introduction to blood","q":"By Le Châtelier's principle, what happens to the carbonic acid–bicarbonate system when protons build up in the blood?","c":"It shifts toward carbonic acid, then CO2 and water, and the CO2 can be breathed out","w":["It shifts toward more bicarbonate and protons, which the kidneys then excrete in urine","It stops working, because the buffer system operates only during alkalemia","Hemoglobin releases more oxygen so that the extra protons are absorbed","It shifts toward bicarbonate, so more protons are stored inside red blood cells"],"e":"An equilibrium shifts to counteract a disturbance. CO2 is volatile, so the lungs can remove it. Carbonic acid and bicarbonate are also how most CO2 is transported.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true},{"l":3,"t":"Introduction to blood","q":"The three major formed elements and their main jobs are:","c":"Erythrocytes: gas transport; thrombocytes: clotting; leukocytes: immune responses","w":["Erythrocytes: clotting; thrombocytes: gas transport; leukocytes: immune responses","Erythrocytes: immune responses; thrombocytes: oncotic pressure; leukocytes: gas transport","Albumins: clotting; globulins: gas transport; fibrinogens: immunity","Erythrocytes: gas transport; thrombocytes: immune responses; leukocytes: clotting"],"e":"Formed elements are the cells and cell fragments; albumins, globulins and fibrinogens are plasma proteins.","lo":"Describe the basics of the formed elements."},{"l":3,"t":"Blood plasma","q":"Most blood proteins are produced by which organ(s)?","c":"Liver","w":["Endocrine glands","Kidneys","Spleen","Stomach"],"e":"The liver makes the lion's share. Kidneys, hematopoietic tissue and some endocrine glands make a minor portion; the stomach makes none.","lo":"Describe blood plasma, its components and their functions.","said":"Dr. Fox's own check question at the end of Blood Plasma.","note":"The liver is the primary organ."},{"l":3,"t":"Blood plasma","q":"Select ALL correct pairs of plasma protein and function.","c":["Albumins: oncotic pressure","Alpha and beta globulins: transport and modulating immune responses","Gamma globulins (immunoglobulins): antibodies such as IgG, IgA and IgM","Fibrinogens: clotting"],"w":["Albumins: antibodies such as IgG, IgA and IgM","Fibrinogens: oncotic pressure and transport of lipids"],"e":"Oncotic pressure holds water in the vessels and balances blood hydrostatic pressure, which pushes water out.","lo":"Describe blood plasma, its components and their functions.","deep":true},{"l":3,"t":"Blood plasma","q":"A patient's albumin is very low. What would you expect?","c":"Lower oncotic pressure, so fluid leaks out of the vessels into the tissues","w":["Poor clotting, because albumin normally forms the fibrin mesh at wounds","Fewer circulating antibodies, because albumins are the main immunoglobulins","Higher oncotic pressure, so more fluid is drawn into the vessels from the tissues","Higher hematocrit, because albumin normally dilutes the red cells"],"e":"Albumin favors water staying in the vasculature. With less of it, blood hydrostatic pressure wins and fluid moves out.","lo":"Describe blood plasma, its components and their functions.","deep":true,"note":"Albumin is an important part of the movement of water."},{"l":3,"t":"Blood plasma","q":"Which best describes the make-up of plasma?","c":"Mostly water, then plasma proteins, then a small share of other solutes","w":["Mostly plasma proteins, then water, then a small share of other solutes","Mostly electrolytes, then water, then a small share of plasma proteins","Mostly formed elements, then water, then a small share of proteins","About half water and half plasma proteins, with no other solutes"],"e":"Other solutes: electrolytes, nutrients, wastes, hormones and signaling molecules.","lo":"Describe blood plasma, its components and their functions."},{"l":3,"t":"Formed elements","q":"Leukocytes are the product of which stem cells?","c":"Myeloid and lymphoid stem cells","w":["Erythroid and megakaryocyte progenitors","Lymphoid stem cells only","Myeloid stem cells only","Hemocytoblasts in the liver only"],"e":"Myeloid stem cells give the granular leukocytes and monocytes; lymphoid stem cells give the lymphocytes (T, B and NK cells). So both.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","said":"Dr. Fox's own check question at the end of Formed Elements."},{"l":3,"t":"Formed elements","q":"Order the leukocytes from most to least abundant.","c":"Neutrophils → lymphocytes → monocytes → eosinophils → basophils","w":["Lymphocytes → neutrophils → monocytes → basophils → eosinophils","Neutrophils → monocytes → lymphocytes → eosinophils → basophils","Basophils → eosinophils → monocytes → lymphocytes → neutrophils","Neutrophils → eosinophils → lymphocytes → basophils → monocytes"],"e":"Mnemonic: Never Let Monkeys Eat Bananas.","lo":"Describe the basics of the formed elements.","note":"Most to least abundant: Never Let Monkeys Eat Bananas."},{"l":3,"t":"Formed elements","q":"Select ALL current uses of a blood smear.","c":["A follow-up to a complete blood count (CBC)","Estimating the relative abundances of formed elements","Checking cell size and shape (microcytic, normocytic, macrocytic)","Looking for blood parasites"],"w":["Measuring blood pH and bicarbonate levels","Determining ABO blood type and Rh status before a transfusion"],"e":"The smear was the original CBC. Abnormally small (microcytic) or large (macrocytic) cells can point to various pathologies.","lo":"Describe the uses of a blood smear.","deep":true},{"l":3,"t":"Formed elements","q":"On a blood smear, erythrocytes that are abnormally large are described as:","c":"Macrocytic","w":["Microcytic","Normocytic","Polycythemic","Hypochromic"],"e":"Micro = abnormally small; normo = typical; macro = abnormally large.","lo":"Describe the uses of a blood smear."},{"l":3,"t":"Formed elements","q":"Select ALL formed elements that come from myeloid stem cells.","c":["Erythrocytes","Thrombocytes","Neutrophils, eosinophils and basophils","Monocytes","Mast cells"],"w":["T cells (helper and cytotoxic)","B cells","Natural killer cells"],"e":"Myeloid stem cells give nearly everything except most agranular leukocytes. Lymphoid stem cells give the lymphocytes: T cells, B cells (→ plasma cells) and NK cells.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"How does the main site of hematopoiesis change over a lifetime?","c":"Yolk sac (first trimester) → liver and spleen (second trimester) → red bone marrow, which dominates after birth","w":["Red bone marrow (first trimester) → liver and spleen (second trimester) → yolk sac, which dominates after birth","Spleen (first trimester) → yolk sac (second trimester) → liver, which dominates after birth","Lymph nodes (first trimester) → yolk sac (second trimester) → red bone marrow, which dominates after birth","Liver (first trimester) → red bone marrow (second trimester) → spleen, which dominates after birth"],"e":"After birth, red bone marrow (hematopoietic connective tissue) of the vertebrae, pelvis, sternum and ribs is the main source; the long bones decline with age.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"Which growth factor stimulates production of thrombocytes?","c":"Thrombopoietin (TPO)","w":["Erythropoietin (EPO)","Interleukins","Hypoxia-inducible factors","Thrombin"],"e":"EPO → erythrocytes. TPO → thrombocytes. Interleukins → mitosis and development of hemopoietic cells (notably leukocytes).","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements."},{"l":3,"t":"Formed elements","q":"Hemopoiesis mainly begins in which tissue after birth?","c":"Red bone marrow","w":["Yolk sac","Liver","Yellow bone marrow","Spleen"],"e":"Red bone marrow, also called hematopoietic connective tissue, in the epiphyses and metaphyses of long bones and in flat bones.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","note":"Hematopoiesis = formation of blood cells."},{"l":3,"t":"Erythrocytes","q":"Low levels of what substance will immediately increase the production of erythropoietin?","c":"Oxygen","w":["Carbon dioxide","Iron","Magnesium","Pho
