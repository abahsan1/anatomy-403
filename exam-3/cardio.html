es and how they function: blood, heart, vasculature and lymphatics."},{"l":1,"t":"Cardiovascular system","q":"Lymphatic vessels return excess filtrate to the:","c":"Venous circulation","w":["Arterial circulation","Capillary beds","Kidneys"],"e":"Lymphatics reclaim fluid the capillaries do not reabsorb and deliver it back to venous circulation in the thorax. They are sometimes considered a separate system because of their immune role.","lo":"Outline the components of the cardiovascular system and their roles and how they function: blood, heart, vasculature and lymphatics."},{"l":1,"t":"Thoracic cavity","q":"Select ALL correct boundaries of the thoracic cavity.","c":["Superior: the first ribs (root of the neck)","Inferior: the diaphragm","Anterior: the sternum","Posterior: the vertebral column","Lateral: the ribs and intercostal spaces"],"w":["Inferior: the twelfth ribs","Anterior: the clavicles"],"e":"First ribs (superior), diaphragm (inferior), sternum (anterior), vertebral column (posterior), ribs and intercostal spaces (lateral). The upper limbs are superolateral and the abdominopelvic cavity is inferior.","lo":"Discuss the relative position and boundaries, contents and subdivisions of the thoracic cavity.","deep":true},{"l":1,"t":"Thoracic cavity","q":"The thoracic cavity is divided into which spaces?","c":"Two lateral pulmonary cavities and a central mediastinum","w":["A superior and an inferior mediastinum only","A pericardial cavity and two pleural cavities only","Anterior and posterior pulmonary cavities"],"e":"Pulmonary cavities (lateral, contain the lungs, lined by pleurae) and the mediastinum (medial, contains the pericardium and heart, great vessels, nerves and other viscera).","lo":"Discuss the relative position and boundaries, contents and subdivisions of the thoracic cavity."},{"l":1,"t":"Thoracic cavity","q":"Which statement about the pleurae is correct?","c":"Parietal pleura adheres to the walls, visceral pleura adheres to the lungs, and the pleural space lies between them","w":["Visceral pleura adheres to the walls, parietal pleura adheres to the lungs, and the pleural space lies outside both","Parietal pleura is fibrous connective tissue and visceral pleura is a serous membrane","Both layers adhere to the lungs, and the pleural space lies between the lungs and the ribs"],"e":"Pleurae are serous membranes. Parietal = walls (rib cage, diaphragm, mediastinum). Visceral = on the lungs. Pleural space = between the two layers.","lo":"Discuss the locations and contents of the pulmonary cavities.","deep":true},{"l":1,"t":"Thoracic cavity","q":"Every serous membrane in the thorax has which three components?","c":"A parietal layer, a visceral layer and a space between them","w":["A fibrous layer, a serous layer and a fat layer","An inner, middle and outer fibrous layer","A parietal layer, a visceral layer and a basement membrane"],"e":"Pleura: parietal pleura, pleural space, visceral pleura. Pericardium: parietal layer, pericardial cavity, visceral layer (epicardium). Same plan, different names.","lo":"Discuss the locations and contents of the pulmonary cavities.","said":"Dr. Fox calls this concept a “very high return on investment” because it repeats in the pericardium."},{"l":1,"t":"Thoracic cavity","q":"The thoracic plane runs between which two points, and what does it separate?","c":"The sternal angle and the T4/T5 intervertebral disc; it separates the superior mediastinum from the rest of the mediastinum","w":["The jugular notch and T2; it separates the superior mediastinum from the neck","The xiphoid process and T10; it separates the thorax from the abdomen","The sternal angle and T8; it separates the anterior from the posterior mediastinum"],"e":"Above the thoracic plane and below the first ribs is the superior mediastinum. Below it are the anterior, middle and posterior mediastina (nobody calls that region the inferior mediastinum).","lo":"Outline the location of the mediastinum, its subdivisions and boundaries, and major contents.","deep":true},{"l":1,"t":"Thoracic cavity","q":"Which space within the thorax contains the heart?","c":"Middle mediastinum","w":["Anterior mediastinum","Posterior mediastinum","Superior mediastinum","Pulmonary cavity"],"e":"The middle mediastinum is defined by the pericardium, which contains the heart (about T5 to T8).","lo":"Outline the location of the mediastinum, its subdivisions and boundaries, and major contents.","said":"“Mediastinum generally would be correct, but the most correct answer would be middle mediastinum.”"},{"l":1,"t":"Thoracic cavity","q":"Select ALL correct pairs of mediastinal part and boundary.","c":["Superior: below the first ribs, above the thoracic plane","Middle: the pericardium, about T5 to T8","Anterior: in front of the pericardium and behind the sternum, down to about T9","Posterior: behind the pericardium and in front of the vertebral column, down to T12"],"w":["Middle: everything between the sternum and the vertebral column","Posterior: ends at the diaphragm, at about T8"],"e":"Because the diaphragm curves, the anterior mediastinum reaches T9 and the posterior mediastinum runs far behind the diaphragm to T12.","lo":"Outline the location of the mediastinum, its subdivisions and boundaries, and major contents.","deep":true},{"l":1,"t":"Thoracic cavity","q":"Which of these is NOT found in the mediastinum?","c":"The lungs","w":["The esophagus","The trachea","The great vessels of the heart"],"e":"The lungs sit in the pulmonary cavities on either side. The mediastinum holds the pericardium and heart, great vessels, trachea, esophagus, lymphatics and neurovasculature.","lo":"Outline the location of the mediastinum, its subdivisions and boundaries, and major contents."},{"l":1,"t":"Pericardium","q":"Put the pericardium in order from superficial to deep.","c":"Fibrous pericardium → parietal layer of serous pericardium → pericardial cavity → visceral layer of serous pericardium (epicardium)","w":["Parietal layer of serous pericardium → fibrous pericardium → pericardial cavity → epicardium","Fibrous pericardium → visceral layer → pericardial cavity → parietal layer","Epicardium → pericardial cavity → parietal layer → fibrous pericardium"],"e":"Think of a fist pushed into a balloon: the balloon touching the fist is the visceral layer, the outer balloon wall is the parietal layer (stuck to the fibrous pericardium), and the inside of the balloon is the pericardial cavity.","lo":"Diagram the layers of the pericardium.","deep":true},{"l":1,"t":"Pericardium","q":"Which layer of the pericardium is part of the heart wall?","c":"Visceral layer of serous pericardium","w":["Fibrous pericardium","Parietal layer of serous pericardium","Serous pericardium"],"e":"The visceral layer of the serous pericardium = visceral pericardium = epicardium, the outermost layer of the heart wall.","lo":"Diagram the layers of the pericardium.","said":"On choosing “serous pericardium”: “That's too big. That includes both parietal and visceral layers.”"},{"l":1,"t":"Pericardium","q":"The fibrous pericardium is best described as:","c":"Superficial, durable, inelastic, made of three layers of collagen","w":["Deep, delicate and elastic","A serous membrane fused to the heart","Smooth muscle that helps the heart contract"],"e":"A collagen trilayer laid down at angles: rough and tumble, shiny and inelastic. The serous pericardium deep to it is delicate.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Pericardium","q":"Why does the fibrous pericardium being inelastic matter for heart function?","c":"Its volume sets the total volume into which the heart can expand during diastole","w":["It lets the heart stretch without limit during systole","It squeezes the ventricles to help eject blood","It produces the fluid that fills the ventricles"],"e":"The heart must fully dilate in diastole to fill. The pericardial cavity is the room it expands into, and the inelastic fibrous layer caps that room.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true},{"l":1,"t":"Pericardium","q":"The pericardium is fused to the:","c":"Diaphragm","w":["Sternum","Visceral pleura","Vertebral column"],"e":"It sits atop the diaphragm, medial to the pleurae, and delimits the middle mediastinum.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Pericardium","q":"Pain from the fibrous pericardium and parietal serous pericardium travels in which nerves?","c":"Phrenic nerves (C3 to C5, somatic)","w":["Vagus nerves (parasympathetic)","Cardiac accelerator nerves (sympathetic)","Intercostal nerves T1 to T4"],"e":"The phrenic nerves run through the mediastinum enmeshed in the fibrous pericardium on the way to the diaphragm. The visceral layer (epicardium) shares the heart's autonomic cardiac plexus innervation.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true,"said":"“C three four five keeps the diaphragm alive.”"},{"l":1,"t":"Pericardium","q":"Pericarditis leads to a large pericardial effusion. What is the main danger, and how is it treated?","c":"Cardiac tamponade constricts the heart during diastole; fluid is removed by pericardiocentesis","w":["Cardiac tamponade stops the SA node; it is treated with a pacemaker","The fibrous pericardium tears; it is treated by suturing it to the diaphragm","The coronary arteries dilate; it is treated with vasoconstrictors"],"e":"Fluid (transudate, blood or exudate) in the pericardial cavity leaves no room for the heart to expand in diastole, so it cannot fill. A needle is passed below the sternum, through the diaphragm, into the cavity. It may need repeating.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true},{"l":1,"t":"Pericardium","q":"The coronary arteries and cardiac veins run in the:","c":"Subserosal (epicardial) adipose tissue","w":["Pericardial cavity","Fibrous pericardium","Endocardium"],"e":"The fat just deep to the epicardium carries the vessels. Its amount is proportional to cardiometabolic risk: more fat, more risk of coronary artery disease, atherosclerosis and type 2 diabetes.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Heart basics","q":"Select ALL correct statements about the layers of the heart wall.","c":["The epicardium is the visceral layer of serous pericardium","The myocardium is the thickest layer and is mostly cardiac muscle","The endocardium is endothelium that lines the chambers and covers the valves","The endocardium's smooth surface helps prevent clots"],"w":["The endocardium is the outermost layer of the heart","The myocardium is thickest in the right ventricle"],"e":"Outer to inner: epicardium, myocardium, endocardium. The left ventricular myocardium is thickest because it pumps to the whole body.","lo":"Describe the three layers of the heart, their features and function.","deep":true},{"l":1,"t":"Heart basics","q":"The endocardium is made of which epithelium?","c":"Simple squamous (endothelium)","w":["Stratified squamous","Simple cuboidal","Transitional"],"e":"Simple squamous endothelium on a basement membrane, continuous with the endothelium of the vessels. It is non-thrombogenic, which matters because a clot in the heart can become a pulmonary embolism.","lo":"Describe the three layers of the heart, their features and function."},{"l":1,"t":"Heart basics","q":"How is the myocardium arranged differently in the atria and the ventricles?","c":"Atria: comb-like pectinate muscles anteriorly. Ventricles: trabeculae carneae and papillary muscles arranged for maximum force","w":["Atria: trabeculae carneae. Ventricles: pectinate muscles","Atria: papillary muscles. Ventricles: smooth walls throughout","Both have identical pectinate muscle throughout"],"e":"Atria receive blood and are smooth posteriorly with pectinate muscle anteriorly. Ventricles send blood out and have meaty beams (trabeculae carneae) plus papillary muscles tied to the valve cusps.","lo":"Describe the three layers of the heart, their features and function.","deep":true},{"l":1,"t":"Heart basics","q":"After myocardial ischemia destroys cardiac muscle, what replaces it?","c":"Connective tissue laid down by fibroblasts (fibrosis)","w":["New cardiac muscle from satellite cells","Smooth muscle from the endocardium","Adipose tissue from the epicardium"],"e":"Fibroblasts throughout the myocardium deposit connective tissue in place of the lost muscle.","lo":"Describe the three layers of the heart, their features and function."},{"l":1,"t":"Heart basics","q":"Select ALL correct pairs of chamber and what connects to it.","c":["Right atrium: superior and inferior venae cavae plus the coronary sinus","Right ventricle: pulmonary valve to the pulmonary trunk","Left atrium: four pulmonary veins","Left ventricle: aortic valve to the ascending aorta"],"w":["Left atrium: superior vena cava","Right ventricle: aortic valve to the aorta"],"e":"The right heart collects deoxygenated systemic blood and sends it to the lungs. The left heart collects oxygen-rich blood from the lungs and sends it to the body.","lo":"Describe the four chambers of the heart and how they connect to other parts of the body through vasculature.","deep":true},{"l":1,"t":"Heart basics","q":"Which sequence of blood flow is correct?","c":"Venae cavae → right atrium → tricuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → left atrium → bicuspid valve → left ventricle → aortic valve → aorta","w":["Venae cavae → right atrium → bicuspid valve → right ventricle → aortic valve → lungs → pulmonary veins → left atrium → tricuspid valve → left ventricle → aorta","Pulmonary veins → right atrium → tricuspid valve → right ventricle → aorta → lungs → venae cavae → left atrium → left ventricle","Venae cavae → right ventricle → right atrium → pulmonary trunk → lungs → left ventricle → left atrium → aorta"],"e":"Tricuspid on the right, bicuspid (mitral) on the left. Each side: atrium → AV valve → ventricle → semilunar valve → great artery.","lo":"Diagram the flow of blood to, through and away from each side of the heart.","deep":true},{"l":1,"t":"Heart basics","q":"Which vessels carry the most oxygen-rich blood in the body to the heart?","c":"Pulmonary veins","w":["Pulmonary arteries","Venae cavae","Coronary sinus"],"e":"Veins carry blood toward the heart, arteries away, whatever their oxygen content. Pulmonary veins (oxygenated) → left atrium; pulmonary arteries carry deoxygenated blood to the lungs.","lo":"Diagram the flow of blood to, through and away from each side of the heart."},{"l":1,"t":"Heart basics","q":"What feature of cardiac muscle tissue allows for coordinated depolarization?","c":"Gap junctions","w":["Autorhythmicity","Desmosomes","Large mitochondria","Uninucleate cells"],"e":"Gap junctions in the intercalated discs let ions flow cell to cell, so depolarization spreads as a wave and the cells act as one (a functional syncytium). Desmosomes are structural anchors.","lo":"Describe the features of cardiac muscle tissue and how they support heart function.","said":"Dr. Fox's own check question at the end of Heart Basics."},{"l":1,"t":"Heart basics","q":"Select ALL features of cardiac muscle tissue.","c":["Branching fibers","Uninucleate cells","Larger and more numerous mitochondria","Intercalated discs with desmosomes and gap junctions","Autorhythmic"],"w":["Multinucleate cells","Under voluntary control"],"e":"Each feature supports function: mitochondria for aerobic ATP, intercalated discs for anchoring and ion flow, autorhythmicity so the heart sets its own rate.","lo":"Describe the features of cardiac muscle tissue and how they support heart function.","deep":true},{"l":1,"t":"Heart basics","q":"A functional syncytium is:","c":"A group of cells working as one","w":["A single cell with many nuclei","A bundle of nerve fibers in the heart","A group of cells that contract one at a time"],"e":"Gap junctions pass depolarization from cell to cell so the myocardium contracts as a unit.","lo":"Describe the features of cardiac muscle tissue and how they support heart function."},{"l":1,"t":"Heart basics","q":"Select ALL correct statements about the heart valves.","c":["All valves prevent retrograde (backward) flow","The tricuspid valve has three cusps and sits on the right","The bicuspid (mitral) valve has two cusps and sits on the left","The semilunar valves are the pulmonary and aortic valves"],"w":["The AV valves separate the ventricles from the great arteries","The aortic valve sits between the left atrium and the left ventricle"],"e":"AV valves separate atria from ventricles. Semilunar valves separate ventricles from the great arteries and are named for the vessel they open into.","lo":"Outline the heart valves and their functions.","deep":true},{"l":1,"t":"Heart basics","q":"What actually brings the cusps of an AV valve together?","c":"The rise in ventricular pressure pushing the cusps up, like air filling a parachute","w":["Papillary muscles contracting and pulling the chordae tendineae","Pressure in the aorta and pulmonary trunk","The atria contracting against the cusps"],"e":"Papillary muscles put tension on the chordae tendineae, which keep the cusps from blowing back into the atrium (prolapse). Ventricular pressure is what closes them.","lo":"Outline the heart valves and their functions.","deep":true,"said":"“A lot of people are under the impression that these valves close because the papillary muscles pull on the chordae tendineae.”"},{"l":1,"t":"Heart basics","q":"How many groups of papillary muscles are in the right and left ventricles?","c":"Three on the right, two on the left","w":["Two on the right, three on the left","Three in each","One per ventricle"],"e":"One group per cusp: tricuspid (anterior, posterior, septal) and bicuspid (anterior, posterior).","lo":"Outline the heart valves and their functions."},{"l":1,"t":"External features","q":"The base of the heart faces which direction, and which chamber mainly forms it?","c":"Posteriorly; mostly the left atrium, with a little of the right atrium","w":["Inferiorly; mostly the left ventricle","Anteriorly; mostly the right ventricle","Superiorly; the aorta and pulmonary trunk"],"e":"The pulmonary veins enter the left atrium on the base, and the venae cavae enter the right atrium beside it.","lo":"Describe the surfaces of the heart and what they contact.","deep":true,"said":"The base is “the most difficult for students to conceptualize” because it faces posteriorly."},{"l":1,"t":"External features","q":"Select ALL correct pairs of heart surface and what it contacts.","c":["Anterior (sternocostal): behind the sternum and ribs","Right: the right pleura and right lung","Left (pulmonary): the left mediastinal pleura and left lung","Diaphragmatic: the central tendon of the diaphragm"],"w":["Base: the diaphragm","Diaphragmatic: the sternum"],"e":"Every surface is still wrapped in pericardium. The diaphragmatic surface is much larger than it looks from the front.","lo":"Describe the surfaces of the heart and what they contact.","deep":true},{"l":1,"t":"External features","q":"Select ALL correct pairs of heart border and chamber.","c":["Right border: right atrium","Left border (obtuse margin): mostly left ventricle, a little left atrium (left auricle)","Inferior border (acute margin): both ventricles, mostly the right","Superior border: both atria"],"w":["Right border: right ventricle","Inferior border: left atrium"],"e":"Borders are set from an anterior view. The apex is where the left and inferior borders meet.","lo":"Describe the borders of the heart and with which chambers they associate.","deep":true},{"l":1,"t":"External features","q":"The obtuse margin of the heart is the:","c":"Left border","w":["Inferior border","Right border","Superior border"],"e":"Left border = obtuse margin (an obtuse angle between surfaces). Inferior border = acute margin.","lo":"Describe the borders of the heart and with which chambers they associate."},{"l":1,"t":"External features","q":"The apex of the heart points:","c":"Left, inferior and anterior","w":["Right, superior and posterior","Straight inferiorly","Left and posterior"],"e":"It lies where the left and inferior borders meet. In cardiomegaly the gap between the apex and the left rib cage shrinks on a radiograph.","lo":"Describe the borders of the heart and with which chambers they associate."},{"l":1,"t":"External features","q":"The coronary sulcus carries heart vasculature and corresponds to which deeper structure?","c":"Fibrous skeleton of the heart","w":["Chordae tendineae","Interatrial septum","Interventricular septum","Papillary muscles"],"e":"The fibrous skeleton is connective tissue around all four valves, which lie roughly in one plane. The interventricular sulci match the interventricular septum.","lo":"Describe the sulci of the heart and where they are found.","said":"Dr. Fox's own check question at the end of External Heart Features."},{"l":1,"t":"External features","q":"Which statement about the sulci is correct?","c":"The coronary sulcus separates atria from ventricles; the anterior and posterior interventricular sulci mark the interventricular septum","w":["The coronary sulcus separates the right ventricle from the left ventricle","The interventricular sulci separate the atria from the ventricles","The posterior interventricular sulcus is on the sternocostal surface"],"e":"Coronary sulcus = in a coronal plane, wraps around the heart, atria from ventricles. Anterior interventricular sulcus on the sternocostal surface; posterior on the diaphragmatic surface.","lo":"Describe the sulci of the heart and where they are found.","deep":true},{"l":1,"t":"External features","q":"The auricles of the heart are:","c":"Ear-like expansions of the atria","w":["Openings of the coronary sinus","Extensions of the ventricles","The cusps of the AV valves"],"e":"There is a right and a left auricle. The left auricle shows along the left border; the right auricle holds pectinate muscle.","lo":"Describe the auricles of the heart."},{"l":1,"t":"External features","q":"What is the main job of the fibrous skeleton of the heart?","c":"Anchors the valves","w":["Conducts impulses from the SA node","Produces pericardial fluid","Stores fat for the coronary vessels"],"e":"It surrounds and anchors all four valves and lines up with the coronary sulcus.","lo":"Describe the sulci of the heart and where they are found."},{"l":1,"t":"Internal features","q":"Inside the right atrium, which structure separates the smooth sinus venarum from the pectinate part?","c":"Crista terminalis","w":["Septomarginal trabecula","Fossa ovalis","Conus arteriosus"],"e":"The sinus venarum (space of veins) is the smooth posterior part that receives the venae cavae. The ridge of crista terminalis divides it from the anterior pectinate muscle. The SA node sits at its superior end.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"The fossa ovalis is:","c":"A depression in the interatrial septum, the remnant of the fetal foramen ovale","w":["An opening in the interventricular septum present in adults","The opening of the coronary sinus","A remnant of the ductus arteriosus in the right ventricle"],"e":"In the fetus, oxygenated blood from the placenta goes right atrium → foramen ovale → left atrium, skipping the lungs. At birth the septa shut. A persisting opening is a patent foramen ovale (PFO).","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"Where is the AV node?","c":"In the atrioventricular septum, near the opening of the coronary sinus","w":["At the superior end of the crista terminalis","In the septomarginal trabecula","In the wall of the left atrium beside the pulmonary veins"],"e":"SA node: superior crista terminalis. AV node: where the atrioventricular septum meets the interatrial septum, beside the coronary sinus opening.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Internal features","q":"The septomarginal trabecula (moderator band) runs from where to where, and what is its job?","c":"Interventricular septum to the base of the anterior papillary muscle; a shortcut for the right bundle branch","w":["Crista terminalis to the AV node; a shortcut for the SA node","Anterior papillary muscle to the pulmonary valve; anchors the cusps","Interatrial septum to the tricuspid valve; structural support only"],"e":"It is specialized myocardium of the right ventricle.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true,"said":"First described by da Vinci and thought to give structural strength; “we now know that it is a shortcut for the right bundle branch.”"},{"l":1,"t":"Internal features","q":"Which is the largest papillary muscle of the right ventricle?","c":"Anterior","w":["Posterior","Septal","They are all equal"],"e":"Right ventricle: anterior (largest), posterior and septal papillary muscles, matching the three tricuspid cusps.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Internal features","q":"The conus arteriosus is the part of the right ventricle that:","c":"Funnels blood up to the pulmonary valve","w":["Receives blood from the coronary sinus","Holds the AV node","Connects to the aorta"],"e":"During ventricular systole blood rises through the conus arteriosus to the pulmonary valve and pulmonary trunk.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Internal features","q":"Select ALL features found in BOTH ventricles.","c":["Trabeculae carneae","Papillary muscles","Chordae tendineae","The interventricular septum"],"w":["Septomarginal trabecula","Pectinate muscles","Conus arteriosus"],"e":"The septomarginal trabecula and conus arteriosus belong to the right ventricle. Pectinate muscles are in the atria.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"Select ALL correct statements about the aortic sinuses (of Valsalva).","c":["The right coronary artery arises from the right sinus","The left coronary artery arises from the left sinus","The sinus above the posterior cusp is the non-coronary sinus"],"w":["The coronary arteries arise from the pulmonary trunk","The right coronary artery arises from the posterior sinus"],"e":"The aortic valve has right, left and posterior cusps; the space above each is a sinus. No artery arises from the posterior one.","lo":"Describe the aortic sinuses and their significance.","deep":true},{"l":1,"t":"Internal features","q":"Because of where they arise, the coronary arteries fill mainly during:","c":"Diastole","w":["Ventricular systole","Atrial systole","Isovolumetric contraction"],"e":"In diastole blood rushes back toward the aortic valve, closes the cusps and flows into the coronary arteries from the sinuses.","lo":"Describe the aortic sinuses and their significance."},{"l":1,"t":"Internal features","q":"Which pairing of valve state and phase is correct?","c":"AV valves open in diastole and closed in systole; semilunar valves open in systole and closed in diastole","w":["AV valves open in systole and closed in diastole; semilunar valves open in diastole","All four valves open together in diastole","Semilunar valves close when ventricular pressure is higher than arterial pressure"],"e":"Semilunar cusps act like scoops: when arterial pressure exceeds ventricular pressure, blood catches in them and closes them. AV valves close when ventricular pressure exceeds atrial pressure.","lo":"Explain how heart valves are structured and work.","deep":true},{"l":1,"t":"Internal features","q":"What structures anchor atrioventricular cusps to papillary muscles?","c":"Chordae tendineae","w":["Crista terminalis","Pectinate muscles","Septomarginal trabecula","Trabeculae carneae"],"e":"Their real job is to stop valve prolapse.","lo":"Explain how heart valves are structured and work.","said":"Dr. Fox's own check question at the end of Internal Heart Features."},{"l":1,"t":"Internal features","q":"The bicuspid valve is also called the mitral valve because:","c":"It looks like a bishop's miter","w":["It was named for the anatomist Mitra","It has a middle cusp","It sits in the middle of the heart"],"e":"Two cusps (anterior and posterior) with matching anterior and posterior papillary muscles.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Coronary arteries","q":"Which statement about the origin of the coronary arteries is correct?","c":"They are the only branches of the ascending aorta, arising from the aortic sinuses and running in the coronary and interventricular sulci","w":["They branch from the aortic arch and run inside the myocardium","They arise from the pulmonary trunk and run in the coronary sulcus","They arise from the descending aorta and enter at the apex"],"e":"RCA from the right aortic sinus, LCA from the left. Both head straight for the coronary sulcus.","lo":"Explain the origin and pathways of the coronary arteries.","deep":true},{"l":1,"t":"Coronary arteries","q":"Select ALL branches that usually come from the RCA.","c":["SA nodal branch (about 60%)","Right marginal branch","AV nodal branch (about 67%)","Posterior interventricular branch / PDA (about 67%)"],"w":["Anterior interventricular branch (LAD)","Circumflex branch","Left marginal artery"],"e":"The SA nodal branch comes from the LCA the other 40% of the time. AV nodal and PDA arise at the crux.","lo":"Explain the pathways, branches and tissues served by the RCA.","deep":true},{"l":1,"t":"Coronary arteries","q":"The right marginal branch runs along which border, and what does it supply?","c":"The inferior border; the right ventricle","w":["The right border; the right atrium","The left border; the left ventricle","The superior border; both atria"],"e":"It leaves the RCA and follows the inferior (acute) margin.","lo":"Explain the pathways, branches and tissues served by the RCA.","said":"“Not the right border, but the inferior border of the heart.”"},{"l":1,"t":"Coronary arteries","q":"The posterior interventricular branch (PDA) supplies:","c":"The diaphragmatic surface of the ventricles and the posterior interventricular septum","w":["The SA node and right atrium","The sternocostal surface of the left ventricle","The left atrium only"],"e":"It runs in the posterior interventricular sulcus and sends branches deep into the septum.","lo":"Explain the pathways, branches and tissues served by the RCA."},{"l":1,"t":"Coronary arteries","q":"Select ALL correct statements about the left coronary artery.","c":["It splits into the anterior interventricular branch (LAD) and the circumflex branch","The LAD supplies the sternocostal surface of the ventricles and the anterior septum","The circumflex gives off the left marginal artery to the left ventricle"],"w":["The LAD runs in the posterior interventricular sulcus","The left marginal artery runs along the inferior border"],"e":"The circumflex wraps around in the coronary sulcus and serves the left ventricle's wall and diaphragmatic surface. The left marginal follows the left border.","lo":"Explain the pathways, branches and tissues served by the LCA.","deep":true},{"l":1,"t":"Coronary arteries","q":"Which branch is one of the few named an artery rather than a branch?","c":"Left marginal artery","w":["Right marginal","Anterior interventricular","Circumflex"],"e":"It comes off the circumflex and runs along the left border.","lo":"Explain the pathways, branches and tissues served by the LCA.","said":"“Notice this is one of the few branches that is called artery.”"},{"l":1,"t":"Coronary arteries","q":"In addition to the posterior interventricular artery, the dominant blood supply to the crux also supplies which branch?","c":"AV nodal branch","w":["Anterior interventricular branch","Left marginal artery","Right marginal branch","SA nodal branch"],"e":"The crux is where the coronary sulcus meets the posterior interventricular sulcus. Whatever supplies the PDA and AV nodal branch there sets dominance.","lo":"Explain heart dominance and the relevance to myocardial ischemia.","said":"Dr. Fox's own check question at the end of Coronary Arteries."},{"l":1,"t":"Coronary arteries","q":"Rank heart dominance from most to least common.","c":"Right dominant (about two thirds) → codominant → left dominant","w":["Left dominant → codominant → right dominant","Codominant → right dominant → left dominant","Right dominant → left dominant → codominant"],"e":"Right dominant: RCA supplies the crux. Codominant: both. Left dominant: the LCA (via the circumflex).","lo":"Explain heart dominance and the relevance to myocardial ischemia.","deep":true},{"l":1,"t":"Coronary arteries","q":"Why do left-dominant hearts have worse outcomes with myocardial ischemia?","c":"An LCA occlusion cuts off nearly all the interventricular septum, which carries the bundle branches","w":["The RCA is more often blocked in left-dominant hearts","Left-dominant hearts have no SA nodal branch","The left ventricle is thinner in left-dominant hearts"],"e":"The LCA always supplies the LAD, circumflex and left marginal. In a left-dominant heart it also supplies the posterior septum, so one common blockage takes out the whole septum and the conduction pathway in it.","lo":"Explain heart dominance and the relevance to myocardial ischemia.","deep":true},{"l":1,"t":"Coronary arteries","q":"A clot blocks the anterior interventricular branch (LAD). Which region is most at risk?","c":"The sternocostal surface of the ventricles and the anterior interventricular septum","w":["The SA node","The diaphragmatic surface of the right ventricle","The right atrium"],"e":"The LAD runs in the anterior interventricular sulcus and sends branches deep into the septum.","lo":"Explain the pathways, branches and tissues served by the LCA.","deep":true},{"l":1,"t":"Cardiac veins","q":"Which veins of the greater system drain directly into the right atrium rather than the coronary sinus?","c":"Anterior cardiac veins","w":["Great cardiac vein","Middle cardiac vein","Small cardiac vein"],"e":"They drain the subepicardial myocardium of the right ventricle and bridge over the RCA. Delicate in dissection.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","said":"Dr. Fox's own check question at the end of Cardiac Veins."},{"l":1,"t":"Cardiac veins","q":"Select ALL correct pairs of vein and the artery it accompanies.","c":["Great cardiac vein: anterior interventricular branch (LAD)","Middle cardiac vein: posterior interventricular branch (PDA)","Small cardiac vein: right marginal branch"],"w":["Great cardiac vein: right marginal branch","Middle cardiac vein: circumflex branch"],"e":"Great with the LAD in the anterior interventricular sulcus; middle with the PDA in the posterior sulcus; small along the inferior border with the right marginal.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true},{"l":1,"t":"Cardiac veins","q":"Map the greater system: where does blood from the subepicardial myocardium end up?","c":"Great, middle and small cardiac veins → coronary sinus → right atrium; anterior cardiac veins → right atrium directly","w":["All cardiac veins → coronary sinus → left atrium","Great cardiac vein → right atrium directly; the rest → coronary sinus","Coronary sinus → superior vena cava → right atrium"],"e":"“All veins lead to the right atrium.” The coronary sinus opens into the right atrium beside the AV node.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true},{"l":1,"t":"Cardiac veins","q":"Which statement about the smaller system is correct?","c":"Small (Thebesian) veins drain subendocardial myocardium straight into the chambers, densest in the right atrium and sparsest in the left ventricle","w":["Small (Thebesian) veins drain subepicardial myocardium into the coronary sinus","The smaller system is just another name for the small cardiac vein","Thebesian veins are densest in the left ventricle"],"e":"Greater system = named veins, subepicardial, to the coronary sinus (or right atrium). Smaller system = microscopic veins, subendocardial, into the chamber they sit beside.","lo":"Describe the smaller system of blood return to the heart.","deep":true},{"l":1,"t":"Cardiac veins","q":"How do you tell the small cardiac vein from the small cardiac (Thebesian) veins?","c":"If you can see it, it's the greater system's small cardiac vein; the Thebesian veins are microscopic","w":["The small cardiac vein drains into the left atrium","The Thebesian veins accompany the right marginal branch","There is no difference; they are the same vessels"],"e":"The small cardiac vein runs with the right marginal branch to the coronary sinus.","lo":"Describe the smaller system of blood return to the heart.","said":"“If you can see the vein, it's of the greater system.”"},{"l":1,"t":"Conduction and control","q":"Put the cardiac cycle in order, starting with diastole.","c":"Diastole → atrial systole → isovolumetric ventricular contraction → ejection","w":["Atrial systole → diastole → ejection → isovolumetric contraction","Diastole → isovolumetric contraction → atrial systole → ejection","Ejection → atrial systole → isovolumetric contraction → diastole"],"e":"Then back to diastole. Blood always moves from high to low pressure, and volume is inversely proportional to pressure.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correct pairs of phase and valve state.","c":["Diastole: AV valves open, semilunar valves closed","Atrial systole: AV valves open, semilunar valves closed","Isovolumetric contraction: all valves closed","Ejection: AV valves closed, semilunar valves open"],"w":["Ejection: all valves open","Diastole: AV valves closed, semilunar valves open"],"e":"About 75% of ventricular filling happens in diastole; atrial systole (the atrial kick) adds the last quarter.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow.","deep":true},{"l":1,"t":"Conduction and control","q":"How much of ventricular filling happens during diastole, before the atria contract?","c":"About 75%","w":["About 25%","About 50%","100%"],"e":"The atrial kick in atrial systole supplies the remaining quarter.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow."},{"l":1,"t":"Conduction and control","q":"Which conduction pathway is in the right order?","c":"SA node → AV node → AV bundle (of His) → right and left bundle branches → Purkinje fibers","w":["AV node → SA node → bundle branches → AV bundle → Purkinje fibers","SA node → AV bundle → AV node → Purkinje fibers → bundle branches","SA node → bundle branches → AV node → AV bundle → Purkinje fibers"],"e":"Bundle branches run down the interventricular septum; the right one takes the septomarginal trabecula shortcut.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correct intrinsic rates.","c":["SA node: about 100 bpm","AV node: about 40 to 60 bpm","AV bundle (of His): about 20 to 35 bpm"],"w":["SA node: about 60 bpm","AV node: about 100 bpm"],"e":"Rates fall the further you go down the pathway. The SA node is the pacemaker.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true},{"l":1,"t":"Conduction and control","q":"The heart's conduction system is made of:","c":"Specialized cardiomyocytes","w":["Nerve fibers from the vagus nerve","Purkinje neurons","Sympathetic postganglionic axons"],"e":"Every part of it is specialized cardiac muscle capable of autorhythmic depolarization.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","said":"“People think there must be nerves or nerve fibers within the heart… everything is just a specialized cardiomyocyte.”"},{"l":1,"t":"Conduction and control","q":"The SA node's intrinsic rate is about 100 bpm, yet resting heart rate is lower because:","c":"Parasympathetic stimulation dominates at rest","w":["The AV node overrides the SA node at rest","Sympathetic stimulation dominates at rest","The SA node only fires on every other beat"],"e":"Vagal (parasympathetic) input from the cardiac plexus slows the SA node to perhaps 60 to 70 bpm.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute."},{"l":1,"t":"Conduction and control","q":"What is the difference between cardiac arrest and a heart attack?","c":"Cardiac arrest is a disruption of the conduction pathway; a heart attack is a blockage of the coronary blood supply","w":["They are the same event","Cardiac arrest is a blocked coronary artery; a heart attack is a conduction failure","A heart attack only affects the atria"],"e":"Electrical vs vascular.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true,"said":"“Oftentimes people will conflate cardiac arrests with heart attacks.”"},{"l":1,"t":"Conduction and control","q":"Fibers that cause a depression of heart rate are conducted by which nervous structures?","c":"Vagus nerves (CN X)","w":["Cardiac (accelerator) nerves","Postganglionic sympathetic fibers","Preganglionic sympathetic fibers from T1 to T4/5"],"e":"Vagal cardiac branches are parasympathetic: they slow the rate and dilate the coronary arteries. The sympathetic fibers raise the rate.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","said":"Dr. Fox's own check question at the end of Conduction and Control."},{"l":1,"t":"Conduction and control","q":"Select ALL correct statements about sympathetic control of the heart.","c":["Preganglionic fibers come from T1 to T4/5","They reach the cardiac plexus as cardiac (accelerator) nerves from the sympathetic trunk","They raise heart rate","Their constriction of the coronary arteries is only a minor effect"],"w":["They travel in the vagus nerve","They slow heart rate"],"e":"The faster rate increases perfusion overall, and some beta-2 dilation offsets the constriction.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","deep":true},{"l":1,"t":"Conduction and control","q":"Where are the two cardiac plexuses?","c":"Superficial: in the concavity of the aortic arch. Deep: at the tracheal bifurcation, continuous with the pulmonary plexuses","w":["Superficial: on the apex. Deep: in the interventricular septum","Superficial: behind the sternum. Deep: on the diaphragm","Both lie inside the pericardial cavity on the left atrium"],"e":"Together they carry vagal and sympathetic fibers that act on the SA node.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","deep":true},{"l":1,"t":"Conduction and control","q":"Which definitions are correct?","c":"Normal sinus rhythm: 60 to 100 bpm with a typical EKG. Bradycardia: under 60. Tachycardia: over 100","w":["Normal sinus rhythm: 40 to 60 bpm. Bradycardia: under 40. Tachycardia: over 60","Normal sinus rhythm: 60 to 100 bpm with any EKG. Bradycardia: over 100","Normal sinus rhythm: 100 bpm exactly"],"e":"Rate and rhythm both count: normal sinus rhythm needs a typical EKG.","lo":"Describe normal sinus rhythm vs. arrhythmias.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correctly classified arrhythmias.","c":["Sinus node dysfunction: bradyarrhythmia","AV block: bradyarrhythmia","Atrial fibrillation: tachyarrhythmia","Ventricular fibrillation: tachyarrhythmia"],"w":["AV block: tachyarrhythmia","Ventricular fibrillation: bradyarrhythmia"],"e":"Arrhythmias are also called dysrhythmias.","lo":"Describe normal sinus rhythm vs. arrhythmias.","deep":true},{"l":1,"t":"Conduction and control","q":"Which arrhythmia is an emergency because the ventricles stop pumping blood?","c":"Ventricular fibrillation","w":["Atrial fibrillation","Sinus node dysfunction","Bradycardia at 55 bpm"],"e":"V-fib is uncoordinated ventricular contraction, corrected with defibrillation. A-fib is usually chronic and manageable with medication but can throw a clot.","lo":"Describe normal sinus rhythm vs. arrhythmias."},{"l":1,"t":"Auscultation","q":"Select ALL correct pairs of heart sound and event.","c":["S1 (lub): turbulence as the AV valves close at the start of ventricular systole","S2 (dub): turbulence as the semilunar valves close at the start of diastole","S3: turbulence during ventricular filling","S4: turbulence during atrial systole into a non-compliant ventricle"],"w":["S1: the semilunar valves closing","S2: the AV valves closing"],"e":"S1 and S2 are primary; S3 and S4 are secondary.","lo":"Explain the events that correspond with the various heart sounds.","deep":true},{"l":1,"t":"Auscultation","q":"Which secondary heart sound is common and often normal in children?","c":"S3","w":["S4","S2","S1"],"e":"S3 (S1, S2, S3) = the Kentucky gallop. S4 (S4, S1, S2) = Tennessee; rare and often atypical, usually from ventricular non-compliance.","lo":"Describe the heart sounds."},{"l":1,"t":"Auscultation","q":"A murmur heard in an adult most often points to:","c":"A valve disorder","w":["Normal ventricular filling","Atrial kick","A healthy S3"],"e":"Murmurs are abnormal clicking, gurgling or rushing sounds. Common and usually benign in children.","lo":"Describe the heart sounds."},{"l":1,"t":"Auscultation","q":"Where should the bell of the stethoscope be placed when auscultating the aortic valve?","c":"2nd intercostal space, just right of the sternum","w":["2nd to 3rd intercostal space, just left of the sternum","4th to 5th intercostal space, just left of the sternum","5th intercostal space, left midclavicular line","Wherever you'd like; auscultation is a vibe"],"e":"Mnemonic “Apartment”: A P T M = aortic, pulmonic, tricuspid, mitral, moving down and to the left.","lo":"Outline the external locations for valve auscultation.","said":"Dr. Fox's own check question at the end of Cardiac Auscultation."},{"l":1,"t":"Auscultation","q":"Select ALL correct auscultation sites.","c":["Aortic: right 2nd intercostal space","Pulmonary: left 2nd (to 3rd) intercostal space","Tricuspid: left 4th to 5th intercostal space, usually 5th","Bicuspid (mitral): left 5th intercostal space, midclavicular line"],"w":["Mitral: right 5th intercostal space","Pulmonary: right 2nd intercostal space"],"e":"Aortic on the right; everything else on the left.","lo":"Outline the external locations for valve auscultation.","deep":true},{"l":1,"t":"Auscultation","q":"Why isn't the stethoscope placed directly over each valve?","c":"Sound travels with the blood, so the bell goes downstream in the direction blood flows from the valve","w":["The sternum blocks all sound from the heart","The valves are too deep for any sound to reach the chest wall","Each valve only makes sound during diastole"],"e":"Directionality carries the sound energy, which is why you count intercostal spaces instead of listening over the valve itself.","lo":"Outline the external locations for valve auscultation.","deep":true}];
const BLANKS=[{"l":1,"t":"Cardiovascular system","s":"Arteries carry blood [[away from]] the heart; veins carry blood [[toward|towards|to]] the heart."},{"l":1,"t":"Cardiovascular system","s":"Blood is a [[liquid]] connective tissue made of [[plasma]] and [[formed elements]]."},{"l":1,"t":"Cardiovascular system","s":"Lymphatics pick up excess [[interstitial fluid|filtrate]] and return it to the [[venous|veins]] circulation."},{"l":1,"t":"Cardiovascular system","s":"Exchange of nutrients and wastes happens in the [[capillary beds|capillaries]], between arterioles and [[venules]]."},{"l":1,"t":"Thoracic cavity","s":"The thoracic cavity is bounded superiorly by the [[first ribs]] and inferiorly by the [[diaphragm]]."},{"l":1,"t":"Thoracic cavity","s":"The [[parietal]] pleura adheres to the walls and the [[visceral]] pleura adheres to the lungs."},{"l":1,"t":"Thoracic cavity","s":"The thoracic plane runs from the [[sternal angle|angle of louis]] to the intervertebral disc between [[T4 and T5|T4/T5|T4-T5]]."},{"l":1,"t":"Thoracic cavity","s":"The middle mediastinum is defined by the [[pericardium]]; the posterior mediastinum extends down to [[T12]]."},{"l":1,"t":"Pericardium","s":"The visceral layer of the serous pericardium is also called the [[epicardium]]."},{"l":1,"t":"Pericardium","s":"Between the parietal and visceral layers of serous pericardium is the [[pericardial cavity]]."},{"l":1,"t":"Pericardium","s":"The fibrous pericardium is innervated by the [[phrenic]] nerves, from spinal levels [[C3 to C5|C3-C5|C3-5|C3, C4, C5]]."},{"l":1,"t":"Pericardium","s":"Fluid that constricts the heart in the pericardial cavity causes cardiac [[tamponade]], treated by [[pericardiocentesis]].","said":"Dr. Fox describes tamponade as feeling like crushing substernal pressure."},{"l":1,"t":"Pericardium","s":"The amount of subserosal adipose tissue is proportional to [[cardiometabolic]] risk."},{"l":1,"t":"Heart basics","s":"From outside in, the heart wall is the [[epicardium]], [[myocardium]] and [[endocardium]]."},{"l":1,"t":"Heart basics","s":"The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."},{"l":1,"t":"Heart basics","s":"Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."},{"l":1,"t":"Heart basics","s":"Cells joined by gap junctions act as one, a [[functional syncytium]]."},{"l":1,"t":"Heart basics","s":"The [[chordae tendineae]] anchor the AV valve cusps to the [[papillary]] muscles."},{"l":1,"t":"Heart basics","s":"The right atrium receives blood from the [[superior]] and inferior venae cavae and the [[coronary sinus]]."},{"l":1,"t":"Heart basics","s":"The two semilunar valves are the [[pulmonary|pulmonic]] valve and the [[aortic]] valve."},{"l":1,"t":"External features","s":"The left border is also called the [[obtuse]] margin; the inferior border is the [[acute]] margin."},{"l":1,"t":"External features","s":"The right border of the heart is formed by the [[right atrium]]."},{"l":1,"t":"External features","s":"The base of the heart faces [[posteriorly|posterior]] and is formed mostly by the [[left atrium]]."},{"l":1,"t":"External features","s":"The [[coronary]] sulcus separates the atria from the ventricles and lines up with the [[fibrous skeleton]]."},{"l":1,"t":"Internal features","s":"The smooth posterior part of the right atrium is the [[sinus venarum]], separated from the pectinate part by the [[crista terminalis]]."},{"l":1,"t":"Internal features","s":"The [[fossa ovalis]] on the interatrial septum is the remnant of the fetal [[foramen ovale]]."},{"l":1,"t":"Internal features","s":"The septomarginal trabecula, or [[moderator band]], carries the [[right bundle branch|right bundle]]."},{"l":1,"t":"Internal features","s":"The RCA arises from the [[right]] aortic sinus; the sinus above the posterior cusp is the [[non-coronary|noncoronary|non coronary]] sinus."},{"l":1,"t":"Coronary arteries","s":"The SA nodal branch comes from the RCA about [[60]] percent of the time."},{"l":1,"t":"Coronary arteries","s":"The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."},{"l":1,"t":"Coronary arteries","s":"Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."},{"l":1,"t":"Coronary arteries","s":"The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery."},{"l":1,"t":"Cardiac veins","s":"The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch."},{"l":1,"t":"Cardiac veins","s":"Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium."},{"l":1,"t":"Cardiac veins","s":"Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium."},{"l":1,"t":"Conduction and control","s":"The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm."},{"l":1,"t":"Conduction and control","s":"The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm."},{"l":1,"t":"Conduction and control","s":"During [[isovolumetric]] ventricular contraction, all four valves are closed."},{"l":1,"t":"Conduction and control","s":"Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]]."},{"l":1,"t":"Conduction and control","s":"The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]]."},{"l":1,"t":"Conduction and control","s":"A resting rate under 60 bpm is [[bradycardia]]; over 100 bpm is [[tachycardia]]."},{"l":1,"t":"Auscultation","s":"S1 is heard when the [[AV|atrioventricular]] valves close; S2 when the [[semilunar]] valves close."},{"l":1,"t":"Auscultation","s":"The aortic valve is heard at the [[right]] 2nd intercostal space; the mitral valve at the left 5th intercostal space, [[midclavicular]] line."},{"l":1,"t":"Auscultation","s":"S3 is the [[Kentucky]] gallop; S4 is the [[Tennessee]] gallop."}];

const STOP=new Set(['the','of','n','nn','nerve','nerves','a','artery','an','cn']);
const ROMAN={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12};
function norm(s){
  return s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w))
    .map(w=>ROMAN[w]?String(ROMAN[w]):w).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const OPP=[['afferent','efferent'],['medial','lateral'],['anterior','posterior'],['superior','inferior'],['dorsal','ventral'],['flexor','extensor'],['ipsilateral','contralateral'],['left','right'],['presynaptic','postsynaptic'],['sensory','motor'],['cranial','caudal'],['internal','external'],['internum','externum'],['epineurium','perineurium','endoneurium'],['gyri','gyru','sulci','sulcu'],['proximal','distal'],['maxillary','mandibular'],['monosynaptic','polysynaptic'],['cervical','sacral'],['periosteal','meningeal'],['gracili','cuneatu']];
function opposite(a,b){const A=a.split(' '),B=b.split(' ');for(let i=0;i<Math.min(A.length,B.length);i++){if(A[i]===B[i])continue;if(OPP.some(g=>g.includes(A[i])&&g.includes(B[i])))return true;
  if(OPP.some(g=>g.some(w=>A[i].startsWith(w.slice(0,5)))&&g.some(w=>B[i].startsWith(w.slice(0,5)))&&A[i].slice(0,3)!==B[i].slice(0,3)))return true}return false}
function grade(input,ans,others){
  const base=ans.a, opts=[base, base.replace(/\s*\(.*?\)\s*/g,' '), ...((base.match(/\((.*?)\)/)||[])[1]?[base.match(/\((.*?)\)/)[1]]:[]), ...ans.alt];
  const v=norm(input);
  if(!v){if(!input.trim())return 'empty';const raw=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim();return opts.map(raw).includes(raw(input))?'ok':'no'}
  const N=opts.map(norm).filter(Boolean);
  if(N.includes(v))return 'ok';
  if(others.some(o=>[o.a,o.a.replace(/\s*\(.*?\)\s*/g,' '),...o.alt].map(norm).includes(v)))return 'no';
  for(const t of N){const d=lev(v,t);if(d<=(t.length>7?2:t.length>4?1:0)&&!opposite(v,t))return 'near';}
  return 'no';
}

/* ---------- flashcards ---------- */
function wc(s){return s.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).length}
function kind(a){
  const s=a.trim();
  if(/\(CN [IVX]+\)$/.test(s)||/ n\.$/.test(s)||/\bnerves?\b/i.test(s)&&wc(s)<=4)return 'Nerve name';
  if(/ a\.$/.test(s)||/\barter(y|ies)\b/i.test(s)&&wc(s)<=5)return 'Artery name';
  if(/^\d+$/.test(s))return 'A number';
  if(/^[CTLS]\d/.test(s))return 'Spinal level(s)';
  if(/^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)(, | and |$)/.test(s))return 'Cranial nerve number(s)';
  if(/\blobes?\b/i.test(s)&&wc(s)<=3)return 'Lobe';
  if(/\b(sulcus|fissure|gyrus|gyri|lobule)\b/i.test(s)&&wc(s)<=4)return 'Brain landmark';
  if(/\b(ventricle|aqueduct|foramen|canal)\b/i.test(s)&&wc(s)<=5)return 'Part of the ventricular system';
  if(/\b(sinus|falx|tentorium|confluens)\b/i.test(s)&&wc(s)<=4)return 'Dural fold or sinus';
  if(/(cells?|cytes?|glia|neurons?)$/i.test(s)&&wc(s)<=4)return 'Cell type';
  if(/(mater|neurium)$/i.test(s)&&wc(s)<=3)return 'Covering layer';
  return null;
}
function fmtHint(c){
  if(c.type==='l'){const k=kind(c.a.a);const n=wc(c.a.a);return (k||'Structure name')+' · '+n+' word'+(n>1?'s':'')}
  if(c.type==='m')return 'Give each: '+c.m.f.map(x=>x[0]).join(' · ');
  if(c.type==='b'){const ws=c.b.answers.map(a=>wc(a.a));return c.b.answers.length+' blank'+(c.b.answers.length>1?'s':'')+' · '+ws.map(w=>w+' word'+(w>1?'s':'')).join(', ')}
  const q=c.q, ans=q.c;
  if(Array.isArray(ans))return 'List '+ans.length+' items';
  if(/full profile of CN/.test(q.q))return 'Name · modality (sensory / motor / mixed) · targets · brain stem attachment';
  if(ans.includes('→')&&/\. [A-Z]/.test(ans))return 'Order of the layers, then their functions';
  if(ans.includes('→'))return 'Sequence of '+(ans.split('→').length)+' steps, in order';
  const segs=ans.split(' · ');
  if(segs.length>1){const labs=segs.map(s=>{const m=s.match(/^([^:]{1,25}):/);return m?m[1].trim():null});
    if(labs.every(Boolean))return 'Give each: '+labs.join(' · ');
    return segs.length+' parts';}
  const k=kind(ans); if(k)return k+(wc(ans)>1?' · '+wc(ans)+' words':'');
  const n=wc(ans);
  if(n<=4)return 'Short answer · '+n+' word'+(n>1?'s':'');
  return 'One-sentence description';
}
const needsChoices=q=>/\bNOT\b|EXCEPT/.test(q.q);

let fc={src:'missed',deck:[],i:0,got:0};
function buildDeck(src){
  const inLec=l=>!st.lec||l===st.lec, cards=[];
  QUESTIONS.forEach(q=>{if(!inLec(q.l))return;const k=qKey(q);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(k)))cards.push({type:'q',q,key:k})});
  BL.forEach(b=>{if(!inLec(b.l))return;if(src==='all'||(src==='missed'&&missed.has(b.key))||(src==='flagged'&&flags.has(b.key)))cards.push({type:'b',b,key:b.key})});
  MUSCLES.forEach(m=>{if(!inLec(m.l))return;if(src==='all'||src==='muscles')cards.push({type:'m',m,key:m.key})});
  FIGS.forEach(f=>{if(!inLec(f.lec))return;f.answers.forEach(a=>{const k=lKey(f,a);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(fKey(f))))cards.push({type:'l',f,a,key:k})})});
  return cards;
}
function cardFromKey(k){
  if(k.startsWith('m:')){const m=MUSCLES.find(x=>x.key===k);return m?{type:'m',m,key:k}:null}
  if(k.startsWith('b:')){const b=BLBY.get(k);return b?{type:'b',b,key:k}:null}
  if(k.startsWith('l:')){const [img,n]=k.slice(2).split('|');const f=FBY.get(img);const a=f&&f.answers.find(x=>String(x.n)===n);return a?{type:'l',f,a,key:k}:null}
  const q=QBY().get(k);return q?{type:'q',q,key:k}:null;
}
function saveFC(){putSess('fc',{deck:fc.deck.map(c=>c.key),i:fc.i,got:fc.got,flipped:!!fc.flipped});try{localStorage.setItem('cardio-v2-fcsrc',fc.src)}catch(e){}}
function startFC(src,fresh){
  if(src)fc.src=src;
  if(!fresh){const s=getSess('fc');
    if(s&&s.deck){const deck=s.deck.map(cardFromKey).filter(Boolean);
      if(deck.length){fc={src:fc.src,deck,i:Math.min(s.i,deck.length),got:s.got,flipped:s.flipped};renderFC(true);return}}}
  fc={src:fc.src,deck:shuffle(buildDeck(fc.src)),i:0,got:0,flipped:false};
  renderFC();
}
try{const s=localStorage.getItem('cardio-v2-fcsrc');if(s)fc.src=s}catch(e){}
function srcChips(){
  const n=s=>buildDeck(s).length;
  return `<div class="src" role="group" aria-label="Deck">
   <button class="chip" data-src="missed" aria-pressed="${fc.src==='missed'}">Missed (${n('missed')})</button>
   <button class="chip" data-src="flagged" aria-pressed="${fc.src==='flagged'}">Flagged (${n('flagged')})</button>
   ${MUSCLES.length?`<button class="chip" data-src="muscles" aria-pressed="${fc.src==='muscles'}">Muscles (${n('muscles')})</button>`:''}
   <button class="chip" data-src="all" aria-pressed="${fc.src==='all'}">Everything (${n('all')})</button></div>`;
}
function wireSrc(){view.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>startFC(b.dataset.src))}
function renderFC(replay){
  const n=fc.deck.length, left=n-fc.i;
  if(!replay)fc.flipped=false;
  saveFC();
  if(!n){
    const msg=fc.src==='missed'?'Every question you miss, and every fill-in sentence you miss on its first check, lands here automatically.'
      :fc.src==='flagged'?'Tap Flag on a question or sentence and it shows up here.':'Nothing in this lecture.';
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>${fc.src==='missed'?'No misses yet':'Nothing here yet'}</h2><p>${msg}</p><div class="nav" style="justify-content:center"><button class="btn primary" id="goall">Study everything instead</button></div></div>`;
    wireSrc();$('#goall').onclick=()=>startFC('all');return;
  }
  if(fc.i>=n){
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>Deck done</h2><p>${fc.got} card${fc.got===1?'':'s'} marked "Got it"${fc.src==='missed'?' and removed from your misses':''}.</p><div class="nav" style="justify-content:center"><button class="btn primary" id="again">Go again</button></div></div>`;
    wireSrc();$('#again').onclick=()=>startFC(null,true);return;
  }
  const c=fc.deck[fc.i];
  let front,back,tag;
  if(c.type==='m'){tag=LECT[c.m.l]+' · '+esc(c.m.g)+' · muscle';front=`<div class="front">${esc(c.m.n)}</div>`;
    back=c.m.f.map(([k,v])=>`<div class="why"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');}
  else if(c.type==='b'){tag=LECT[c.b.l]+' · '+esc(c.b.t)+' · fill in '+saidBadge(c.b);
    front=`<div class="front" style="font-weight:500">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'_____').join('')}</div>`;
    back=`<div class="why filled" style="font-size:1.05rem">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'<b>'+esc(c.b.answers[sg.blank-1].a)+'</b>').join('')}</div>`;}
  else if(c.type==='q'){tag=LECT[c.q.l]+' · '+esc(c.q.t)+' '+saidBadge(c.q);front=(c.q.lo?`<p class="lo"><b>Objective:</b> ${esc(c.q.lo)}</p>`:'')+`<div class="front">${esc(c.q.q)}</div>`;
    if(needsChoices(c.q)){const ch=shuffle([...(Array.isArray(c.q.c)?c.q.c:[c.q.c]),...c.q.w]);front+=`<ol class="choices" type="A">${ch.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`;}
    back=(Array.isArray(c.q.c)?`<ul class="ans-list">${c.q.c.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:`<div class="ans">${esc(c.q.c)}</div>`)+`<div class="why">${esc(c.q.e)}</div>`+saidNote(c.q);
  }
  else{tag=LECT[c.f.lec]+' · '+esc(c.f.title);front=`<div class="front">What is structure <span class="num" style="display:inline-grid;vertical-align:middle;margin:0 2px">${c.a.n}</span>?</div>
    <div class="plate"><img src="${IMG[c.f.img]}" alt="${esc(c.f.title)}" style="cursor:pointer"></div><div><button class="btn" id="fczoom" style="padding:6px 12px;font-size:.82rem">Enlarge image</button></div>`;
    back=`<div class="ans">${esc(c.a.a)}</div>`;}
  view.innerHTML=srcChips()+`<div class="meta"><span>Card ${fc.i+1} of ${n} · ${restartBtn}</span><span class="score">${left} left · <b>${fc.got}</b> got it</span></div>
  <div class="progress"><i style="width:${fc.i/n*100}%"></i></div>
  <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card"><span class="tag">${tag}</span>${front}
   <div class="fmt"><span class="fl">Answer format</span><span>${esc(fmtHint(c))}</span></div>
   <div class="back" id="back" hidden>${back}</div><div class="tapnote" id="tapnote">Tap the card to see the answer</div></div>
  <div class="nav"><button class="btn" id="fcback" ${fc.i?'':'disabled'}>Back</button><span class="spacer"></span><span id="rate" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn again" id="again">Still learning</button><button class="btn got" id="got">Got it</button></span></div>`;
  wireSrc(); $('#restart').onclick=()=>startFC(null,true);
  const show=()=>{$('#back').hidden=false;$('#tapnote').hidden=true;$('#rate').hidden=false};
  const flip=()=>{if(fc.flipped)return;fc.flipped=true;show();saveFC()};
  if(replay&&fc.flipped)show();
  $('#flash').onclick=e=>{if(e.target.id==='fczoom'){e.stopPropagation();$('#zimg').src=IMG[c.f.img];$('#zoom').hidden=false;return}flip()};
  $('#flash').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const next=()=>{fc.i++;renderFC();window.scrollTo({top:0})};
  $('#fcback').onclick=()=>{fc.i--;renderFC();window.scrollTo({top:0})};
  $('#got').onclick=()=>{fc.got++;if(fc.src==='missed'){missed.delete(c.key);saveMissed()}next()};
  $('#again').onclick=()=>{const pos=Math.min(fc.deck.length,fc.i+4);fc.deck.splice(pos,0,c);next()};
}

/* ---------- controls ---------- */
function sync(){
  if(!FIGS.length&&st.mode==='id')st.mode='mcq';
  $('#m-mcq').setAttribute('aria-pressed',st.mode==='mcq');$('#m-id').setAttribute('aria-pressed',st.mode==='id');$('#m-fb').setAttribute('aria-pressed',st.mode==='fb');$('#m-fc').setAttribute('aria-pressed',st.mode==='fc');
  $('#fchip').hidden=st.mode==='fc'; if(st.mode==='fc')st.flagOnly=false;
  document.querySelectorAll('.chip[data-l]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.l===st.lec));
  {const sel=document.querySelector('.chip[data-l][aria-pressed="true"]'),row=$('#chips');if(sel&&row.scrollWidth>row.clientWidth)row.scrollLeft=Math.max(0,sel.offsetLeft-row.offsetLeft-16);}
  document.body.dataset.mode=st.mode; updateFchip(); save(); st.mode==='mcq'?startMCQ():st.mode==='id'?startID():st.mode==='fb'?startFB():startFC();
}
$('#m-mcq').onclick=()=>{st.mode='mcq';sync()};
$('#m-id').onclick=()=>{st.mode='id';sync()};
$('#m-fc').onclick=()=>{st.mode='fc';sync()};
$('#m-fb').onclick=()=>{st.mode='fb';sync()};
document.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{st.lec=+c.dataset.l;history.replaceState(null,'',st.lec?'#lecture-'+st.lec:location.pathname);sync()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#lecture-([1-6])$/);const n=m?+m[1]:0;if(n!==st.lec){st.lec=n;sync()}});
$('#fchip').onclick=()=>{st.flagOnly=!st.flagOnly;sync()};
sync();
})();
</script>
