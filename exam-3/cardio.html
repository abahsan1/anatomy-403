capillary beds|capillaries|capillary bed]], nutrients leave the blood for the interstitial fluid and [[wastes|waste products|waste]] are picked up by the blood.","b-cv7-n1"],["b:The right marginal branch follows the [[inferior]] border to the right ventricle wall; at the crux the RCA gives the [[AV nodal]] branch and the [[posterior interventricular|PDA|posterior descending]] branch.","b-co3-n1"],["b:The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery.","b-co4"],["b:The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch.","b-ve1"],["b:The small cardiac vein accompanies the [[right marginal]] branch along the [[inferior]] border and drains into the [[coronary sinus]].","b-ve2-n1"],["b:Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium.","b-ve2"],["b:Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium.","b-ve3"],["b:The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm.","b-cc1"],["b:The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm.","b-cc2"],["b:During [[isovolumetric]] ventricular contraction, all four valves are closed.","b-cc3"],["b:Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]].","b-cc4"],["b:The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]].","b-cc5"],["b:A resting rate under 60 bpm is [[bradycardia]]; over 100 bpm is [[tachycardia]].","b-cc6"],["b:S1 is heard when the [[AV|atrioventricular]] valves close; S2 when the [[semilunar]] valves close.","b-au1"],["b:The aortic valve is heard at the [[right]] 2nd intercostal space; the mitral valve at the left 5th intercostal space, [[midclavicular]] line.","b-au2"],["b:S3 is the [[Kentucky]] gallop; S4 is the [[Tennessee]] gallop.","b-au3"],["b:Auscultation sites use the [[patient's|patient|patients]] right and left: facing the patient, the aortic site (their right 2nd intercostal space) is on your [[left]].","b-au4-n1"],["b:The three layers of a vessel wall, from inside out, are the tunica [[interna|intima]], tunica [[media]] and tunica [[externa|adventitia]].","b-v-vs1"],["b:Elastic arteries such as the aorta act as pressure [[reservoirs|reservoir]]; arterioles are [[resistance]] vessels; capillaries are [[exchange]] vessels.","b-v-vs2"],["b:Veins accompanying an artery and named for it are called venae [[comitantes]].","b-v-vs3"],["b:A clot inside a vessel is a [[thrombus]]; when it travels and lodges elsewhere it is an [[embolism|embolus]].","b-v-vs4"],["b:The [[hypophyseal]] portal system connects the hypothalamus to the anterior pituitary; the renal portal system is [[arterial]].","b-v-vs5"],["b:In the renal portal system, blood leaves the glomerulus through an [[efferent arteriole|efferent arterioles|efferent]] and flows into the [[peritubular capillaries|peritubular|peritubular capillary]], so the vessel linking the two beds is arterial.","b-v-vs11-n1"],["b:The arch of the aorta sits at about [[T4]], and the abdominal aorta bifurcates into the common iliac arteries at about [[L4]].","b-v-ao1"],["b:The celiac trunk serves the [[foregut]], the superior mesenteric a. the [[midgut]], and the inferior mesenteric a. the [[hindgut]].","b-v-ao2"],["b:The [[maxillary]] artery supplies the deep face; the [[superficial temporal]] artery supplies the scalp.","b-v-cc1"],["b:The [[vertebral]] arteries enter the skull through foramen magnum and supply the [[posterior]] brain.","b-v-cc2"],["b:The common carotid ends by splitting into the internal and external carotids; the ophthalmic a., which supplies the orbit and forehead, is a branch of the [[internal carotid|internal carotid artery|ICA]].","b-v-cc2-n1"],["b:The common carotid ascends the neck in the carotid [[sheath]] with the internal jugular v. and vagus n.; only the [[internal carotid|internal carotid artery|ICA]] then passes through the carotid canal into the skull.","b-v-cc2-n2"],["b:The femoral artery becomes the popliteal artery at the [[adductor hiatus]].","b-v-il1"],["b:The internal iliac artery has an [[anterior]] division serving pelvic viscera and perineum and a [[posterior]] division serving the posterior pelvic wall.","b-v-il2"],["b:The parts of the subclavian artery are defined by the [[anterior scalene]] muscle; the parts of the axillary artery by [[pectoralis minor|pec minor]].","b-v-sc1"],["b:The axillary artery becomes the brachial artery at [[teres major]].","b-v-sc2"],["b:The radial artery feeds the [[deep]] palmar arch; the ulnar artery feeds the [[superficial]] palmar arch.","b-v-sc3"],["b:The [[Allen]] test checks for an anastomosis between the radial and [[ulnar]] arteries.","b-v-sc4"],["b:Each brachiocephalic vein is formed by the [[internal jugular]] vein and the [[subclavian]] vein, which meet at the venous angle.","b-v-sv1"],["b:The [[basilic]] vein joins the brachial veins to form the axillary vein; the [[cephalic]] vein drains into the axillary vein later.","b-v-sv2"],["b:The IVC passes through the diaphragm at about [[T8]], the esophagus at [[T10]], and the aorta at [[T12]].","b-v-iv1"],["b:The left gonadal vein drains into the left [[renal]] vein; the right gonadal vein drains directly into the [[IVC|inferior vena cava]].","b-v-iv2"],["b:The hepatic portal vein is formed by the [[superior mesenteric]] vein and the [[splenic]] vein.","b-v-hp1"],["b:Blood leaves the liver sinusoids through the [[hepatic]] veins into the [[IVC|inferior vena cava]].","b-v-hp2"],["b:Whole blood is about [[55]]% plasma and [[45]]% formed elements.","b-bl-in1"],["b:Blood pH is kept between [[7.35]] and [[7.45]]; below that is acidemia and above it is alkalemia.","b-bl-in2"],["b:In acidemia the lungs [[hyperventilate]] to blow off CO2; in alkalemia they [[hypoventilate]] to retain it.","b-bl-in3"],["b:The [[lungs]] adjust blood pH quickly; the [[kidneys]] adjust it slowly.","b-bl-in4"],["b:[[Albumins|Albumin]] maintain oncotic pressure; [[fibrinogens|fibrinogen]] are needed for clotting.","b-bl-pl1"],["b:Gamma globulins are also called [[immunoglobulins|antibodies]].","b-bl-pl2"],["b:Leukocytes from most to least abundant: neutrophils, [[lymphocytes]], [[monocytes]], eosinophils, basophils.","b-bl-fe1"],["b:[[Lymphoid]] stem cells give rise to T cells, B cells and natural killer cells; [[myeloid]] stem cells give rise to nearly everything else.","b-bl-fe2"],["b:[[Erythropoietin|EPO]] stimulates red blood cell production; [[thrombopoietin|TPO]] stimulates platelet production.","b-bl-fe3"],["b:Erythrocytes are [[biconcave]] discs that lack a [[nucleus]] and mitochondria.","b-bl-er1"],["b:Hematocrit below the normal range is [[anemia]]; above it is [[polycythemia]].","b-bl-er2"],["b:Adult hemoglobin A is [[2α2β|2 alpha 2 beta|2a2b]]; fetal hemoglobin is [[2α2γ|2 alpha 2 gamma|2a2g]].","b-bl-hb1"],["b:Low oxygen in the blood is [[hypoxemia]]; low oxygen in the tissues is [[hypoxia]].","b-bl-hb2"],["b:Hemoglobin's affinity for carbon monoxide is about [[240]] times its affinity for oxygen.","b-bl-hb3"],["b:Type [[AB]] is the universal recipient; type [[O]] is the universal donor.","b-bl-bt1"],["b:In hemolytic disease of the newborn, maternal [[IgG]] antibodies cross the placenta; it is prevented with [[RhoGAM]].","b-bl-bt2"],["b:Monocytes mature in tissues into [[macrophages]] or [[dendritic]] cells.","b-bl-lk1"],["b:Eosinophils release major basic protein, which kills [[endoparasites|parasites]]; basophils release [[histamine]] and heparin.","b-bl-lk2"],["b:Platelets are shed from [[megakaryocytes]] and old ones are removed by macrophages in the [[spleen]].","b-bl-th1"],["b:Platelets bind exposed collagen through [[von Willebrand]] factor, and [[thrombin]] converts fibrinogen to fibrin.","b-bl-th2"],["b:Fewer than 150,000 platelets/µL is [[thrombocytopenia]]; more than 400,000/µL is [[thrombocytosis]].","b-bl-th3"],["b:The upper respiratory tract is everything [[proximal|superior|above]] to the vocal folds; the lower tract is everything [[distal|inferior|below]] to them.","b-r-sf1"],["b:In acidemia we [[increase|speed up|raise]] ventilation to blow off [[CO2|carbon dioxide]], a volatile acid.","b-r-sf2"],["b:The nasal cavity ends posteriorly at the [[choanae|choana]], which open into the [[nasopharynx]].","b-r-nm1"],["b:The mucosa-covered bony shelves on the lateral nasal wall are the [[conchae|nasal conchae]]; the spaces below them are the [[meatuses|meatus|nasal meatuses]].","b-r-nm2"],["b:Orbicularis oris is supplied by the [[facial|CN VII|CN 7]] nerve; the muscles of mastication by the [[mandibular|V3|CN V3]] nerve.","b-r-nm3"],["b:From top to bottom, the pharynx is the [[nasopharynx]], [[oropharynx]] and [[laryngopharynx|hypopharynx]].","b-r-ph1"],["b:The adenoid is the [[pharyngeal]] tonsil; the tonsil on the root of the tongue is the [[lingual]] tonsil.","b-r-ph2"],["b:The ring of tonsils around the naso- and oropharynx is [[Waldeyer's|Waldeyer|Waldeyers]] ring.","b-r-ph3"],["b:The [[piriform]] recesses lie on either side of the larynx, inside the [[laryngopharynx]]; swallowed pills can lodge there.","b-r-ph8-n1"],["b:The pharyngeal constrictors meet posteriorly at the pharyngeal [[raphe]].","b-r-pm1"],["b:Stylopharyngeus is supplied by the [[glossopharyngeal|CN IX|CN 9]] nerve, not the pharyngeal plexus.","b-r-pm2"],["b:The [[cricoid]] cartilage is the only laryngeal cartilage that completely encircles the airway.","b-r-lx1"],["b:The [[arytenoid|arytenoids]] cartilages are the most kinetic; they pivot and glide on the cricoid.","b-r-lx2"],["b:The trachea is suspended from the cricoid by the [[cricotracheal]] ligament.","b-r-lx3"],["b:The larynx sits [[inferior|below]] to the hyoid, [[anterior|in front]] to the laryngopharynx and [[superior|proximal|above]] to the trachea.","b-r-lx1-n1"],["b:The gap between the vocal folds is the rima [[glottidis]]; the gap between the vestibular folds is the rima [[vestibuli]].","b-r-mc1"],["b:The [[quadrangular]] membranes funnel air in; the [[conus elasticus]] funnels air out.","b-r-mc2"],["b:An emergency cricothyrotomy goes through the [[median cricothyroid|cricothyroid]] ligament.","b-r-mc3"],["b:Vocal folds are [[abducted]] for ventilation and [[adducted]] for phonation.","b-r-lm1"],["b:Pitch rises as vocal ligament [[tension]] increases.","b-r-lm2"],["b:The only intrinsic muscles that open the rima glottidis are the [[posterior crico-arytenoid|posterior cricoarytenoid|posterior crico-arytenoids|posterior cricoarytenoids|PCA]] muscles.","b-r-il1"],["b:The cricothyroid tips the thyroid cartilage [[anteriorly|forward|anterior]] and down, raising pitch.","b-r-il2"],["b:The lateral fibers of the thyro-arytenoid pull the arytenoids [[forward|anteriorly|toward the thyroid]], which [[decreases|lowers|reduces]] vocal ligament tension and lowers pitch.","b-r-il7-n1"],["b:Every intrinsic laryngeal muscle except the [[cricothyroid]] is supplied by the [[recurrent laryngeal]] nerves.","b-r-nv1"],["b:The internal branch of the superior laryngeal nerve serves mucosa [[above|proximal to|superior to]] the vocal folds; the recurrent laryngeal serves mucosa [[below|distal to|inferior to]] them.","b-r-nv2"],["b:The inferior laryngeal artery and recurrent laryngeal nerve ascend together in the [[tracheo-esophageal|tracheoesophageal]] groove.","b-r-nv3"],["b:The [[superior thyroid]] artery gives off the superior laryngeal artery, which pierces the thyrohyoid membrane with the [[internal]] branch of the superior laryngeal nerve.","b-r-nv7-n1"],["b:The trachea bifurcates at the [[thoracic plane|sternal angle]], about T4/5.","b-r-tb1"],["b:Secondary bronchi are also called [[lobar]] bronchi; tertiary bronchi are also called [[segmental]] bronchi.","b-r-tb2"],["b:The conducting zone ends at the [[terminal]] bronchioles; gas exchange begins at the [[respiratory]] bronchioles.","b-r-tb3"],["b:Type [[I|1|one]] alveolar cells are simple squamous and handle gas exchange; type [[II|2|two]] cells secrete surfactant.","b-r-al1"],["b:Surfactant [[reduces|lowers|decreases]] surface tension so the alveoli don't [[collapse]].","b-r-al2"],["b:Bronchial arteries are [[systemic]] vessels from the thoracic [[aorta]].","b-r-pc1"],["b:The pulmonary trunk leaves the [[right]] ventricle; the pulmonary veins return oxygenated blood to the [[left]] atrium.","b-r-pc2"],["b:The right lung has [[three|3]] lobes; the left lung has [[two|2]].","b-r-lu1"],["b:The right lung's horizontal fissure separates the [[superior|upper]] lobe from the [[middle]] lobe.","b-r-lu2"],["b:Boyle's law: pressure is [[inversely|inverse]] proportional to volume.","b-r-vn1"],["b:“C3, 4, 5 keeps the diaphragm alive”: the [[phrenic]] nerves.","b-r-vn2"],["b:The central tendon of the diaphragm holds the caval hiatus for the [[inferior vena cava|IVC]].","b-r-vn3"],["b:[[Visceral]] pleura covers the lungs; [[parietal]] pleura lines the pulmonary cavity.","b-r-pl1"],["b:Air in the pleural cavity is a [[pneumothorax]]; a collapsed lung is [[atelectasis]].","b-r-pl2"],["b:Draining fluid from the pleural cavity with a needle is [[thoracentesis]].","b-r-pl3"],["b:The cupula is lined by [[cervical]] pleura, which is part of the [[parietal]] pleura.","b-r-pl3-n1"],["b:The kidneys and [[ureters|ureter]] are paired and retroperitoneal; the urinary bladder and [[urethra]] are unpaired and pelvic.","b-u-sf1"],["b:The kidneys make [[calcitriol]] to raise blood calcium, [[erythropoietin|EPO]] for red blood cell production, and [[renin]] to start the RAA pathway.","b-u-sf2"],["b:To fix pH the kidneys secrete [[H+|protons|hydrogen ions]] and conserve [[bicarbonate|HCO3-|HCO3]].","b-u-sf3"],["b:The lateral border of the kidney is [[convex]] and the medial border is [[concave]].","b-u-k1"],["b:Accessory renal arteries that supply a pole of the kidney are called [[polar]] arteries.","b-u-k2"],["b:At the hilum, the major calices form the [[renal pelvis]], which drains into the [[ureter]].","b-u-k3"],["b:Cortex between neighbouring pyramids forms the renal [[columns|column]]; cortex between a pyramid's base and the capsule is the [[cortical arch]].","b-u-k4"],["b:The apex of a renal pyramid is the renal [[papilla|papillae]], which is cupped by a [[minor calyx|minor calix|minor calices]].","b-u-k5"],["b:The [[perirenal]] space is inside the renal fascia; the [[pararenal]] space is outside it.","b-u-fs1"],["b:The renal hila lie at the [[transpyloric]] plane, at about vertebral level [[L1]].","b-u-fs2"],["b:When lost perirenal fat lets the kidney drop and kink the ureter, the condition is [[nephroptosis]].","b-u-fs3"],["b:Segmental arteries are [[end]] arteries, so a partial [[nephrectomy]] can remove one renal segment.","b-u-v1"],["b:A renal lobe is a [[pyramid]] plus its surrounding cortex; a lobule is cortical arch around one [[medullary ray]].","b-u-v2"],["b:[[Interlobar]] arteries run between the medulla and renal columns; [[arcuate]] arteries run between the medulla and cortical arch.","b-u-v3"],["b:In the renal portal system, [[efferent]] arterioles carry blood from the glomeruli to the peritubular capillaries and [[vasa recta]].","b-u-v4"],["b:The left renal vein passes between the [[superior mesenteric artery|SMA|superior mesenteric a.]] and the aorta; squeezing it there is called [[nutcracker]] syndrome.","b-u-v5"],["b:The left renal vein receives the left [[gonadal]], left suprarenal and left inferior [[phrenic]] veins.","b-u-v6"],["b:Moving material from peritubular capillaries into the tubules is tubular [[secretion]]; moving it from filtrate back to the blood is tubular [[reabsorption]].","b-u-n1"],["b:The visceral layer of the glomerular capsule is made of [[podocytes]], whose feet leave filtration [[slits]].","b-u-n2"],["b:The primary site of reabsorption is the [[proximal convoluted tubule|PCT|proximal tubule]]; water follows [[salts|salt|sodium|Na+]].","b-u-n3"],["b:The [[macula densa]] in the distal convoluted tubule senses [[NaCl|salt|sodium chloride]] as a proxy for GFR.","b-u-n4"],["b:In the DCT, [[intercalated]] cells adjust pH, and [[principal]] cells reabsorb Na+ and water.","b-u-n5"],["b:Alcohol is a diuretic because it inhibits [[vasopressin|ADH|antidiuretic hormone]].","b-u-n6"],["b:[[Juxtamedullary]] nephrons have long nephron loops and make more concentrated urine; [[cortical]] nephrons are the most common.","b-u-n7"],["b:The two intrinsic controls of the kidney are the [[myogenic]] response and [[tubuloglomerular]] feedback.","b-u-rr1"],["b:Constricting the afferent arteriole [[lowers|decreases|reduces]] GFR; constricting the efferent arteriole [[raises|increases]] GFR.","b-u-rr2"],["b:Renin converts angiotensinogen to angiotensin [[I|1|one]], and [[ACE|angiotensin converting enzyme]] converts it to angiotensin II.","b-u-rr3"],["b:Angiotensin II makes the adrenal cortex release [[aldosterone]] and the hypothalamus release [[ADH|vasopressin|antidiuretic hormone]].","b-u-rr4"],["b:When present, the [[least]] thoracic splanchnic nerve innervates the renal plexus directly.","b-u-rr5"],["b:Urine passes from minor calices to [[major calices|major calyx|major calyces]] to the [[renal pelvis]] to the ureter.","b-u-e1"],["b:The ureters cross into the pelvis at the bifurcation of the [[common iliac]] artery, then pass under the [[uterine]] artery.","b-u-e2"],["b:The longest part of the ureter is the [[abdominal]] part and the shortest is the [[intramural]] part.","b-u-e3"],["b:The most common kidney stone is made of [[calcium oxalate]]; kidney pain from a stone is renal [[colic]].","b-u-e4"],["b:The urinary bladder is [[subperitoneal]], and the ureters enter it at its base or [[fundus]].","b-u-b1"],["b:The [[trigone]] is the smooth area between the ureteric orifices and the internal urethral [[meatus|orifice]].","b-u-b2"],["b:The bladder wall's smooth muscle is the [[detrusor]]; the bladder is supplied by the superior and inferior [[vesical]] arteries.","b-u-b3"],["b:The vesical plexus is part of the inferior [[hypogastric]] plexus.","b-u-b4"],["b:The tripartite urethra runs through the [[prostatic]], [[membranous]] and [[spongy|penile]] parts.","b-u-b5"],["b:The lymphatic system's three functions are fluid balance, [[fat|lipid]] absorption and [[immune]] responses.","b-ly-o1"],["b:Lymphatic tissue is reticular connective tissue, the [[stroma]], plus lymphocytes, the [[parenchyma]].","b-ly-o2"],["b:Innate immunity is [[non-specific|nonspecific]]; acquired immunity is specific to [[antigens|antigen]].","b-ly-o3"],["b:Antibody-mediated immunity is called [[humoral]] immunity; T-cells provide [[cellular|cell-mediated]] immunity.","b-ly-o4"],["b:Activated B-cells become [[plasma]] cells in the tissues.","b-ly-o5"],["b:Lymph flows from capillaries to vessels and nodes, then to [[trunks]], then to [[ducts]].","b-ly-o6"],["b:In the skin, lymph vessels follow [[veins]]; in the viscera, they follow [[arteries]].","b-ly-o7"],["b:Lacteals of the small intestine carry fat-rich lymph called [[chyle]].","b-ly-o8"],["b:Edema occurs when filtration exceeds [[reabsorption]]; swelling from failed lymph drainage is [[lymphedema|lymphoedema]].","b-ly-o9"],["b:The primary lymphatic organs are the red bone marrow and the [[thymus]].","b-ly-p1"],["b:Thymocytes undergo positive selection in the thymic [[cortex]] and negative selection in the [[medulla]].","b-ly-p2"],["b:After puberty the thymus undergoes [[involution]], and much of it is replaced by [[adipose|fat|adipose tissue]].","b-ly-p3"],["b:The thymus lies in the [[mediastinum]].","b-ly-p4"],["b:B-cells and T-cells arise from [[lymphoid]] stem cells; erythrocytes and platelets from [[myeloid]] stem cells.","b-ly-p5"],["b:Lymph enters a node through [[afferent]] vessels and leaves through [[efferent]] vessels at the hilum.","b-ly-s1"],["b:Immune responses in the spleen occur in the [[white]] pulp; old red cells are removed in the [[red]] pulp.","b-ly-s2"],["b:The spleen lies in the left [[hypochondriac]] region.","b-ly-s3"],["b:Lymphatic nodules have no [[capsule]], so they are tissues rather than organs.","b-ly-s4"],["b:Waldeyer's ring is made of the pharyngeal, [[palatine]] and [[lingual]] tonsils.","b-ly-s5"],["b:The pharyngeal tonsil is also called the [[adenoid|adenoids]].","b-ly-s6"],["b:Inflamed lymph nodes are [[lymphadenitis]]; inflamed lymph vessels are [[lymphangitis]].","b-ly-s7"],["b:Carcinomas typically spread by the [[lymphogenous|lymphatic]] route; sarcomas by the [[hematogenous|haematogenous|blood]] route.","b-ly-s8"],["b:The right lymphatic duct ends at the [[right]] venous angle; the thoracic duct at the [[left]] venous angle.","b-ly-r1"],["b:Lymph from below the diaphragm collects in the [[cisterna chyli]] before entering the thoracic duct.","b-ly-r2"],["b:The deep cervical nodes are split into superior and inferior groups by the tendon of the [[omohyoid]] muscle.","b-ly-h1"],["b:An enlarged left supraclavicular node, [[Virchow's|Virchows|Virchow]] node, can be an early sign of [[gastric|stomach]] cancer.","b-ly-h2"],["b:Bronchopulmonary nodes are also called [[hilar]] nodes.","b-ly-pu1"],["b:Most breast lymph drains to the [[axillary]] nodes; the rest goes to the [[parasternal]] nodes and the opposite breast.","b-ly-b1"],["b:Deep upper-limb lymph reaches the [[humeral|lateral]] axillary nodes first, then the central and [[apical]] nodes.","b-ly-ul1"],["b:Abdominal lymph converges on the lateral aortic nodes and [[lumbar]] trunks, which empty into the cisterna chyli.","b-ly-a1"],["b:Superficial lymph above the [[transumbilical]] plane drains to the axillary nodes; below it, to the superficial [[inguinal]] nodes.","b-ly-w1"],["b:Superficial lower-limb lymph follows the [[saphenous]] veins to the superficial inguinal nodes.","b-ly-ll1"],["b:Deep inguinal nodes drain to the external [[iliac]] nodes.","b-ly-ll2"]]); // practice-page key -> question id

async function token(){const sb=await window.a403Sync.client();const {data}=await sb.auth.getSession();return data.session&&data.session.access_token}
async function api(method,body,qs){
  const r=await fetch("/api/notes"+(qs||""),{method,cache:"no-store",headers:{"content-type":"application/json",authorization:"Bearer "+await token()},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Couldn't reach the notes store.");
  return j;
}
const load=()=>loading||(loading=api("GET").then(j=>{notes=new Map(j.notes.map(n=>[n.qid,n]))}).catch(e=>{loading=null;throw e}));

    if(box)return;

  function draw(){
    const n=notes.get(id);
    box.innerHTML=(n?`<p class="st ${n.status==="done"?"done":""}">${n.status==="done"?"Updated by Claude":"Saved · waiting for Claude"}</p>`+(n.reply?`<div class="reply"><b>Claude</b>${esc(n.reply)}</div>`:""):"")+
      `<textarea aria-label="Your note on this question" placeholder="What's wrong, unclear or missing? Claude reads this and fixes the question.">${esc(n?n.note:"")}</textarea>

      <p class="msg" role="status"></p>`;
    const ta=box.querySelector("textarea"), msg=box.querySelector(".msg[role]");
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();box.querySelector('[data-a=save]').click()}});
    box.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;

          msg.textContent="Saving…";

        }else{
          if(!confirm("Delete your note on this question?")){b.disabled=false;return}

      }catch(e){msg.className="msg err";msg.textContent=e.message;b.disabled=false}
    });
    if(!n)ta.focus();
  }
  btn.onclick=()=>box?close():open();
  // flagging a question opens the note box
  flag.addEventListener("click",()=>{if(flag.getAttribute("aria-pressed")==="true")open()});
};

  <script>// Owner-only lab identification: when the owner's GitHub sign-in is detected, fetch the figures from
// /api/labfigs (which refuses every other account), fill FIGS and IMG, and reveal the Identification tab.
// Nobody else's page ever receives the images or the answers.
(function(){
  const OWN="a1be1e0f-896a-49c9-b997-a06979110fae";let started=false;
  async function tok(){const sb=await window.a403Sync.client();const {data}=await sb.auth.getSession();return data.session&&data.session.access_token}
  const btn=()=>document.getElementById("m-id");
  const label=t=>{const b=btn();if(b)b.textContent=t};
  async function go(u){
    if(started||!u||u.id!==OWN)return;started=true;
    const b=btn();if(b){b.hidden=false;b.disabled=true}
    label("Identification (loading)");
    try{
      const t=await tok();if(!t)throw new Error("no session");
      const h={authorization:"Bearer "+t};
      const r=await fetch("/api/labfigs",{headers:h,cache:"no-store"});if(!r.ok)throw new Error("list "+r.status);
      const figs=(await r.json()).figs||[];if(!figs.length)throw new Error("no figures");
      // each figure joins as soon as its image arrives, so the tab works before all of them are in
      let done=0,ok=0;const q=[...figs];
      await Promise.all(Array.from({length:6},async()=>{while(q.length){const f=q.shift();
        try{const ir=await fetch("/api/labfigs?img="+encodeURIComponent(f.id)+"&v="+encodeURIComponent(f.v),{headers:h});
          if(ir.ok){IMG[f.id]=URL.createObjectURL(await ir.blob());FIGS.push({img:f.id,title:f.title,lec:f.lec,answers:f.answers});ok++}}catch(e){}
        done++;if(b&&ok)b.disabled=false;
        label(done<figs.length?"Identification ("+done+"/"+figs.length+")":"Identification")}}));
      // keep the lab's order once everything is in
      const ord=new Map(figs.map((f,i)=>[f.id,i]));FIGS.sort((x,y)=>ord.get(x.img)-ord.get(y.img));
      if(!ok)throw new Error("no images");
    }catch(e){
      // show the failure instead of hiding the tab; tapping retries
      started=false;
      if(b){b.hidden=false;b.disabled=false;label("Identification (couldn't load, tap to retry)");
        b.addEventListener("click",ev=>{if(!FIGS.length){ev.stopImmediatePropagation();go(window.a403Sync&&a403Sync.user())}},{capture:true,once:true})}
      console.warn("lab figures:",e&&e.message);
    }
  }
  // FIGS and IMG are declared by the data script further down the page, so wait for it to parse
  const run=u=>document.readyState==="loading"?addEventListener("DOMContentLoaded",()=>go(u),{once:true}):go(u);
  addEventListener("a403-auth",e=>run(e.detail));
  if(window.a403Sync&&a403Sync.ready())run(a403Sync.user());
})();
</script>

e blood and this fluid?","c":"Capillary beds","w":["Arteriole walls","Venules","Elastic arteries","Muscular arteries"],"e":"“Exchange” means things crossing between the blood and the interstitial fluid around metabolically active cells: nutrients and hormones leave the blood for the cells, and wastes from the cells are picked up by the blood (and later removed by organs such as the kidneys or lungs). In the lecture this happens in the capillary beds. The pathway is arteries → arterioles → capillary beds (exchange) → venules → veins; arterioles feed the capillary beds and venules pick up the blood after it.","lo":"Outline the components of the cardiovascular system and their roles and how they function: blood, heart, vasculature and lymphatics."},{"l":1,"t":"Cardiovascular system","q":"A glucose molecule travels in the blood toward a working muscle cell. At which point does it leave the cardiovascular system to reach that cell?","c":"Across a capillary bed, into the interstitial fluid","w":["Across an arteriole wall, into the lymphatic fluid","Across a venule wall, into the interstitial fluid","Across an elastic artery wall, into the lymph","Across a vein wall, into the lymphatic fluid"],"e":"Nutrients leave the cardiovascular system in the capillary beds and enter the interstitial fluid that surrounds metabolically active cells. Arterioles only feed the capillary beds and venules pick up blood from them. Lymphatics take up the excess interstitial fluid the capillaries don't reabsorb; they are not where nutrients leave the blood.","lo":"Outline the components of the cardiovascular system and their roles and how they function: blood, heart, vasculature and lymphatics.","deep":true,"note":"You asked what this question means: “exchange” is nutrients and wastes crossing between the blood and the fluid around the cells."},{"l":1,"t":"Cardiovascular system","q":"Lymphatic vessels return excess filtrate to the:","c":"Venous circulation","w":["Arterial circulation","Capillar n trilayer laid down at angles: rough and tumble, shiny and inelastic. The serous pericardium deep to it is delicate.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Pericardium","q":"Why does the fibrous pericardium being inelastic matter for heart function?","c":"Its volume sets how far the heart can expand during diastole","w":["It lets the heart stretch without limit as the ventricles fill in systole","It squeezes the ventricles during systole to help eject blood","It produces the serous fluid that lubricates and fills the ventricles","It conducts impulses from the atria down to the ventricles"],"e":"The heart must fully dilate in diastole to fill. The pericardial cavity is the room it expands into, and the inelastic fibrous layer caps that room.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true},{"l":1,"t":"Pericardium","q":"The pericardium is fused to the:","c":"Diaphragm","w":["Sternum","Visceral pleura","Vertebral column","Liver"],"e":"It sits atop the diaphragm, medial to the pleurae, and delimits the middle mediastinum.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Pericardium","q":"Pain from the fibrous pericardium and parietal serous pericardium travels in which nerves?","c":"Phrenic nerves (C3 to C5, somatic)","w":["Vagus nerves (parasympathetic)","Cardiac accelerator nerves (sympathetic)","Intercostal nerves T1 to T4","Recurrent laryngeal nerves (CN X)"],"e":"The phrenic nerves run through the mediastinum enmeshed in the fibrous pericardium on the way to the diaphragm. The visceral layer (epicardium) shares the heart's autonomic cardiac plexus innervation.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true,"said":"“C three four five keeps the diaphragm alive.”"},{"l":1,"t":"Pericardium","q":"Pericarditis leads to a large pericardial effusion. What is the main danger, and how is it treated?","c":"Cardiac tamponade compresses the heart in diastole; the fluid is drained by pericardiocentesis","w":["Cardiac tamponade stops the SA node from firing; it is treated by implanting a pacemaker","The fibrous pericardium tears open; it is treated by suturing it back to the diaphragm","The coronary arteries dilate and leak; it is treated with vasoconstrictor drugs","Fluid clots inside the coronary arteries; it is treated with clot-dissolving drugs"],"e":"Fluid (transudate, blood or exudate) in the pericardial cavity leaves no room for the heart to expand in diastole, so it cannot fill. A needle is passed below the sternum, through the diaphragm, into the cavity. It may need repeating.","lo":"Relate the structure and function of the pericardium to heart function, and understand the potential consequences of pericarditis.","deep":true},{"l":1,"t":"Pericardium","q":"The coronary arteries and cardiac veins run in the:","c":"Subserosal (epicardial) adipose tissue","w":["Pericardial cavity, bathed in serous fluid","Fibrous pericardium's collagen layers","Endocardium","Trabeculae carneae of the inner myocardium"],"e":"The fat just deep to the epicardium carries the vessels. Its amount is proportional to cardiometabolic risk: more fat, more risk of coronary artery disease, atherosclerosis and type 2 diabetes.","lo":"Understand the location and gross structure of the pericardium."},{"l":1,"t":"Heart basics","q":"Select ALL correct statements about the layers of the heart wall.","c":["The epicardium is the visceral layer of serous pericardium","The myocardium is the thickest layer and is mostly cardiac muscle","The endocardium is endothelium that lines the chambers and covers the valves","The endocardium's smooth surface helps prevent clots"],"w":["The endocardium is the outermost layer of the heart, fused to the fibrous pericardium","The myocardium is thickest in the right ventricle, which pumps against the most resistance"],"e":"Outer to inner: epicardium, myocardium, endocardium. The left ventricular myocardium is thickest because it pumps to the whole body.","lo":"Describe the three layers of the heart, their features and function.","deep":true},{"l":1,"t":"Heart basics","q":"The endocardium is made of which epithelium?","c":"Simple squamous (endothelium)","w":["Stratified squamous (keratinized)","Simple cuboidal","Transitional","Pseudostratified columnar"],"e":"Simple squamous endothelium on a basement membrane, continuous with the endothelium of the vessels. It is non-thrombogenic, which matters because a clot in the heart can become a pulmonary embolism.","lo":"Describe the three layers of the heart, their features and function."},{"l":1,"t":"Heart basics","q":"How is the myocardium arranged differently in the atria and the ventricles?","c":"Atria: pectinate muscles anteriorly. Ventricles: trabeculae carneae and papillary muscles","w":["Atria: trabeculae carneae and papillary muscles. Ventricles: pectinate muscles anteriorly","Atria: papillary muscles and chordae. Ventricles: smooth walls with no ridges at all","Atria and ventricles: identical pectinate muscle throughout every chamber wall","Atria: smooth walls throughout. Ventricles: pectinate muscles and chordae tendineae"],"e":"Atria receive blood and are smooth posteriorly with pectinate muscle anteriorly. Ventricles send blood out and have meaty beams (trabeculae carneae) plus papillary muscles tied to the valve cusps.","lo":"Describe the three layers of the heart, their features and function.","deep":true},{"l":1,"t":"Heart basics","q":"After myocardial ischemia destroys cardiac muscle, what replaces it?","c":"Connective tissue laid down by fibroblasts (fibrosis)","w":["New cardiac muscle grown from resident satellite stem cells","Smooth muscle that migrates in from the endocardium","Adipose tissue spreading in from the epicardial fat","Cardiac muscle regrown from dividing cardiomyocytes nearby"],"e":"Fibroblasts throughout the myocardium deposit connective tissue in place of the lost muscle.","lo":"Describe the three layers of the heart, their features and function."},{"l":1,"t":"Heart basics","q":"Select ALL correct pairs of chamber and what connects to it.","c":["Right atrium: superior and inferior venae cavae plus the coronary sinus","Right ventricle: pulmonary valve to the pulmonary trunk","Left atrium: four pulmonary veins","Left ventricle: aortic valve to the ascending aorta"],"w":["Left atrium: superior vena cava and the coronary sinus","Right ventricle: aortic valve to the ascending aorta"],"e":"The right heart collects deoxygenated systemic blood and sends it to the lungs. The left heart collects oxygen-rich blood from the lungs and sends it to the body.","lo":"Describe the four chambers of the heart and how they connect to other parts of the body through vasculature.","deep":true},{"l":1,"t":"Heart basics","q":"Which sequence of blood flow is correct?","c":"Venae cavae → right atrium → tricuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → left atrium → bicuspid valve → left ventricle → aortic valve → aorta","w":["Venae cavae → right atrium → bicuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → left atrium → tricuspid valve → left ventricle → aortic valve → aorta","Venae cavae → right atrium → tricuspid valve → right ventricle → aortic valve → pulmonary trunk → lungs → pulmonary veins → left atrium → bicuspid valve → left ventricle → pulmonary valve → aorta","Pulmonary veins → right atrium → tricuspid valve → right ventricle → pulmonary valve → pulmonary trunk → lungs → venae cavae → left atrium → bicuspid valve → left ventricle → aortic valve → aorta","Venae cavae → left atrium → bicuspid valve → left ventricle → pulmonary valve → pulmonary trunk → lungs → pulmonary veins → right atrium → tricuspid valve → right ventricle → aortic valve → aorta"],"e":"Tricuspid on the right, bicuspid (mitral) on the left. Each side: atrium → AV valve → ventricle → semilunar valve → great artery.","lo":"Diagram the flow of blood to, through and away from each side of the heart.","deep":true},{"l":1,"t":"Heart basics","q":"Which vessels carry the most oxygen-rich blood in the body to the heart?","c":"Pulmonary veins","w":["Pulmonary arteries","Venae cavae","Coronary sinus","Inferior vena cava"],"e":"Veins carry blood toward the heart, arteries away, whatever their oxygen content. Pulmonary veins (oxygenated) → left atrium; pulmonary arteries carry deoxygenated blood to the lungs.","lo":"Diagram the flow of blood to, through and away from each side of the heart."},{"l":1,"t":"Heart basics","q":"What feature of cardiac muscle tissue allows for coordinated depolarization?","c":"Gap junctions","w":["Autorhythmicity","Desmosomes","Large mitochondria","Uninucleate cells"],"e":"Gap junctions in the intercalated discs let ions flow cell to cell, so depolarization spreads as a wave and the cells act as one (a functional syncytium). Desmosomes are structural anchors.","lo":"Describe the features of cardiac muscle tissue and how they support heart function.","said":"Dr. Fox's own check question at the end of Heart Basics."},{"l":1,"t":"Heart basics","q":"Select ALL features of cardiac muscle tissue.","c":["Branching fibers","Uninucleate cells","Larger and more numerous mitochondria","Intercalated discs with desmosomes and gap junctions","Autorhythmic"],"w":["Multinucleate cells, like skeletal muscle fibers","Under voluntary control through somatic motor nerves"],"e":"Each feature supports function: mitochondria for aerobic ATP, intercalated discs for anchoring and ion flow, autorhythmicity so the heart sets its own rate.","lo":"Describe the features of cardiac muscle tissue and how they support heart function.","deep":true},{"l":1,"t":"Heart basics","q":"A functional syncytium is:","c":"A group of cells working as one","w":["A single cell with many nuclei","A bundle of nerve fibers in the heart","A group of cells that contract one at a time","A cell that conducts impulses but cannot contract"],"e":"Gap junctions pass depolarization from cell to cell so the myocardium contracts as a unit.","lo":"Describe the features of cardiac muscle tissue and how they support heart function."},{"l":1,"t":"Heart basics","q":"Select ALL correct statements about the heart valves.","c":["All valves prevent retrograde (backward) flow","The tricuspid valve has three cusps and sits on the right","The bicuspid (mitral) valve has two cusps and sits on the left","The semilunar valves are the pulmonary and aortic valves"],"w":["The AV valves separate the ventricles from the great arteries","The aortic valve sits between the left atrium and the left ventricle"],"e":"AV valves separate atria from ventricles. Semilunar valves separate ventricles from the great arteries and are named for the vessel they open into.","lo":"Outline the heart valves and their functions.","deep":true},{"l":1,"t":"Heart basics","q":"What actually brings the cusps of an AV valve together?","c":"Rising ventricular pressure pushes the cusps up, like air filling a parachute","w":["Papillary muscles contract and pull the chordae tendineae to draw the cusps shut","Back-pressure in the aorta and pulmonary trunk pushes the cusps closed","The atria contract against the cusps and press them together","The chordae tendineae shorten on their own and snap the cusps shut"],"e":"Papillary muscles put tension on the chordae tendineae, which keep the cusps from blowing back into the atrium (prolapse). Ventricular pressure is what closes them.","lo":"Outline the heart valves and their functions.","deep":true,"said":"“A lot of people are under the impression that these valves close because the papillary muscles pull on the chordae tendineae.”"},{"l":1,"t":"Heart basics","q":"How many groups of papillary muscles are in the right and left ventricles?","c":"Three on the right, two on the left","w":["Two on the right, three on the left","Three in each","One per ventricle","Two in each"],"e":"One group per cusp: tricuspid (anterior, posterior, septal) and bicuspid (anterior, posterior).","lo":"Outline the heart valves and their functions."},{"l":1,"t":"External features","q":"The base of the heart faces which direction, and which chamber mainly forms it?","c":"Posteriorly; mostly the left atrium, with a little of the right atrium","w":["Inferiorly; mostly the left ventricle, with a little of the right ventricle","Anteriorly; mostly the right ventricle, with a little of the left ventricle","Superiorly; the aorta and pulmonary trunk, with a little of both atria","Posteriorly; mostly the right atrium, with a little of the left ventricle"],"e":"The pulmonary veins enter the left atrium on the base, and the venae cavae enter the right atrium beside it.","lo":"Describe the surfaces of the heart and what they contact.","deep":true,"said":"The base is “the most difficult for students to conceptualize” because it faces posteriorly."},{"l":1,"t":"External features","q":"Select ALL correct pairs of heart surface and what it contacts.","c":["Anterior (sternocostal): behind the sternum and ribs","Right: the right pleura and right lung","Left (pulmonary): the left mediastinal pleura and left lung","Diaphragmatic: the central tendon of the diaphragm"],"w":["Base: the central tendon of the diaphragm","Diaphragmatic: the back of the sternum and costal cartilages"],"e":"Every surface is still wrapped in pericardium. The diaphragmatic surface is much larger than it looks from the front.","lo":"Describe the surfaces of the heart and what they contact.","deep":true},{"l":1,"t":"External features","q":"Select ALL correct pairs of heart border and chamber.","c":["Right border: right atrium","Left border (obtuse margin): mostly left ventricle, a little left atrium (left auricle)","Inferior border (acute margin): both ventricles, mostly the right","Superior border: both atria"],"w":["Right border: mostly the right ventricle, with a little right auricle","Inferior border (acute margin): mostly the left atrium"],"e":"Borders are set from an anterior view. The apex is where the left and inferior borders meet.","lo":"Describe the borders of the heart and with which chambers they associate.","deep":true},{"l":1,"t":"External features","q":"The obtuse margin of the heart is the:","c":"Left border","w":["Inferior border","Right border","Superior border","Apex"],"e":"Left border = obtuse margin (an obtuse angle between surfaces). Inferior border = acute margin.","lo":"Describe the borders of the heart and with which chambers they associate."},{"l":1,"t":"External features","q":"The apex of the heart points:","c":"Left, inferior and anterior","w":["Right, superior and posterior","Straight inferiorly","Left and posterior","Right, inferior and anterior"],"e":"It lies where the left and inferior borders meet. In cardiomegaly the gap between the apex and the left rib cage shrinks on a radiograph.","lo":"Describe the borders of the heart and with which chambers they associate."},{"l":1,"t":"Internal features","q":"The coronary sulcus carries heart vasculature and corresponds to which deeper structure?","c":"Fibrous skeleton of the heart","w":["Chordae tendineae","Interatrial septum","Interventricular septum","Papillary muscles of the left ventricle"],"e":"The fibrous skeleton is connective tissue around all four valves, which lie roughly in one plane. The interventricular sulci match the interventricular septum.","lo":"Explain how heart valves are structured and work.","said":"Dr. Fox's own check question at the end of External Heart Features."},{"l":1,"t":"External features","q":"The auricles of the heart are:","c":"Ear-like expansions of the atria","w":["Openings of the coronary sinus into the right atrium","Pouch-like extensions of the ventricles","The cusps of the AV valves","Fat pads at the roots of the great vessels"],"e":"There is a right and a left auricle. The left auricle shows along the left border; the right auricle holds pectinate muscle.","lo":"Describe the auricles of the heart."},{"l":1,"t":"Internal features","q":"What is the main job of the fibrous skeleton of the heart?","c":"Anchors the valves","w":["Conducts impulses from the SA node","Produces pericardial fluid","Stores fat for the coronary vessels","Pumps blood into the coronary arteries"],"e":"It surrounds and anchors all four valves and lines up with the coronary sulcus.","lo":"Explain how heart valves are structured and work."},{"l":1,"t":"Internal features","q":"Inside the right atrium, which structure separates the smooth sinus venarum from the pectinate part?","c":"Crista terminalis","w":["Septomarginal trabecula","Fossa ovalis","Conus arteriosus","Interatrial septum"],"e":"The sinus venarum (space of veins) is the smooth posterior part that receives the venae cavae. The ridge of crista terminalis divides it from the anterior pectinate muscle. The SA node sits at its superior end.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"The fossa ovalis is:","c":"A depression in the interatrial septum, remnant of the fetal foramen ovale","w":["An opening in the interventricular septum that stays patent in adults","The depression around the opening of the coronary sinus in the right atrium","A remnant of the fetal ductus arteriosus in the wall of the right ventricle","The ridge between the smooth and pectinate parts of the right atrium"],"e":"In the fetus, oxygenated blood from the placenta goes right atrium → foramen ovale → left atrium, skipping the lungs. At birth the septa shut. A persisting opening is a patent foramen ovale (PFO).","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"Where is the AV node?","c":"In the atrioventricular septum, near the opening of the coronary sinus","w":["At the superior end of the crista terminalis, near the opening of the SVC","In the septomarginal trabecula, near the base of the anterior papillary muscle","In the wall of the left atrium beside the pulmonary veins","In the interventricular septum, where the bundle branches split"],"e":"SA node: superior crista terminalis. AV node: where the atrioventricular septum meets the interatrial septum, beside the coronary sinus opening (Internal Heart Features lecture).","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","note":"Double flag: high priority even though you got it right. AV node = AV septum meets interatrial septum, right next to the coronary sinus opening."},{"l":1,"t":"Internal features","q":"The septomarginal trabecula (moderator band) runs from where to where, and what is its job?","c":"Interventricular septum to the base of the anterior papillary muscle; a shortcut for the right bundle branch","w":["Crista terminalis to the AV node; a shortcut that carries impulses from the SA node","Anterior papillary muscle to the pulmonary valve; anchors the semilunar cusps in systole","Interatrial septum to the tricuspid valve; structural support for the valve, with no conduction role","Interventricular septum to the posterior papillary muscle; a shortcut for the left bundle branch"],"e":"It is specialized myocardium of the right ventricle.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true,"said":"First described by da Vinci and thought to give structural strength; “we now know that it is a shortcut for the right bundle branch.”"},{"l":1,"t":"Internal features","q":"Which is the largest papillary muscle of the right ventricle?","c":"Anterior","w":["Posterior","Septal","They are all equal","Inferior"],"e":"Right ventricle: anterior (largest), posterior and septal papillary muscles, matching the three tricuspid cusps.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Internal features","q":"The conus arteriosus is the part of the right ventricle that:","c":"Funnels blood up to the pulmonary valve","w":["Receives blood returning from the coronary sinus","Holds the AV node and the AV bundle","Connects the right ventricle to the aorta","Separates the right atrium from the left atrium"],"e":"During ventricular systole blood rises through the conus arteriosus to the pulmonary valve and pulmonary trunk.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Internal features","q":"Select ALL features found in BOTH ventricles.","c":["Trabeculae carneae","Papillary muscles","Chordae tendineae","The interventricular septum"],"w":["Septomarginal trabecula","Pectinate muscles","Conus arteriosus"],"e":"The septomarginal trabecula and conus arteriosus belong to the right ventricle. Pectinate muscles are in the atria.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart.","deep":true},{"l":1,"t":"Internal features","q":"Select ALL correct statements about the aortic sinuses (of Valsalva).","c":["The right coronary artery arises from the right sinus","The left coronary artery arises from the left sinus","The sinus above the posterior cusp is the non-coronary sinus"],"w":["The coronary arteries arise from the pulmonary trunk","The right coronary artery arises from the posterior sinus"],"e":"The aortic valve has right, left and posterior cusps; the space above each is a sinus. No artery arises from the posterior one.","lo":"Describe the aortic sinuses and their significance.","deep":true},{"l":1,"t":"Internal features","q":"Because of where they arise, the coronary arteries fill mainly during:","c":"Diastole","w":["Ventricular systole","Atrial systole","Isovolumetric contraction","Ventricular ejection"],"e":"In diastole blood rushes back toward the aortic valve, closes the cusps and flows into the coronary arteries from the sinuses.","lo":"Describe the aortic sinuses and their significance."},{"l":1,"t":"Internal features","q":"Which pairing of valve state and phase is correct?","c":"AV valves open in diastole, closed in systole; semilunar valves open in systole, closed in diastole","w":["AV valves open in systole, closed in diastole; semilunar valves open in diastole, closed in systole","AV and semilunar valves all open together in diastole and all close together in systole","Semilunar valves close in systole, when ventricular pressure rises above arterial pressure","AV valves open in systole and diastole; only the semilunar valves ever open and close"],"e":"Semilunar cusps act like scoops: when arterial pressure exceeds ventricular pressure, blood catches in them and closes them. AV valves close when ventricular pressure exceeds atrial pressure.","lo":"Explain how heart valves are structured and work.","deep":true},{"l":1,"t":"Internal features","q":"What structures anchor atrioventricular cusps to papillary muscles?","c":"Chordae tendineae","w":["Crista terminalis","Pectinate muscles","Septomarginal trabecula","Trabeculae carneae"],"e":"Their real job is to stop valve prolapse.","lo":"Explain how heart valves are structured and work.","said":"Dr. Fox's own check question at the end of Internal Heart Features."},{"l":1,"t":"Internal features","q":"The bicuspid valve is also called the mitral valve because:","c":"It looks like a bishop's miter","w":["It was named for the anatomist Mitra","It has a middle cusp","It sits in the middle of the heart","It is the valve most often heard as a murmur"],"e":"Two cusps (anterior and posterior) with matching anterior and posterior papillary muscles.","lo":"Describe the features common between atria and between ventricles, as well as those particular to each chamber of the heart."},{"l":1,"t":"Coronary arteries","q":"Which statement about the origin of the coronary arteries is correct?","c":"They are the only branches of the ascending aorta; they arise from the aortic sinuses and run in the sulci","w":["They branch from the aortic arch and run deep inside the myocardium instead of the sulci","They branch from the pulmonary trunk just above the pulmonary valve and run in the coronary sulcus","They branch from the descending thoracic aorta and enter the heart at the apex","They arise from the aortic sinuses, then run inside the interventricular septum to the apex"],"e":"RCA from the right aortic sinus, LCA from the left. Both head straight for the coronary sulcus.","lo":"Explain the origin and pathways of the coronary arteries.","deep":true},{"l":1,"t":"Coronary arteries","q":"Select ALL branches that usually come from the RCA.","c":["SA nodal branch (about 60%)","Right marginal branch","AV nodal branch (about 67%)","Posterior interventricular branch / PDA (about 67%)"],"w":["Anterior interventricular branch (LAD) (about 67%)","Circumflex branch (about 60%)","Left marginal artery"],"e":"The SA nodal branch comes from the LCA the other 40% of the time. AV nodal and PDA arise at the crux.","lo":"Explain the pathways, branches and tissues served by the RCA.","deep":true},{"l":1,"t":"Coronary arteries","q":"The right marginal branch runs along which border, and what does it supply?","c":"The inferior border; the right ventricle","w":["The right border; the right atrium and SA node","The left border; the left ventricle","The superior border; both atria and the auricles","The inferior border; the left atrium and AV node"],"e":"It leaves the RCA in the coronary sulcus and follows the inferior border, not the right border, to serve the wall of the right ventricle. The whole map: the RCA (right aortic sinus, in the coronary sulcus) gives the SA nodal branch (about 60%) to the SA node, the right marginal branch to the right ventricle wall, then at the crux the AV nodal branch to the AV node and the PDA, which runs in the posterior interventricular sulcus to the diaphragmatic surface of the ventricles and the septum. The LCA (left aortic sinus) splits into the LAD, in the anterior interventricular sulcus to the sternocostal surface and anterior septum, and the circumflex, in the coronary sulcus to the left ventricle wall and diaphragmatic surface; the circumflex gives the left marginal artery along the left border to the left ventricle wall.","lo":"Explain the pathways, branches and tissues served by the RCA.","said":"“Not the right border, but the inferior border of the heart.”"},{"l":1,"t":"Coronary arteries","q":"In a right-dominant heart whose SA nodal branch comes from the RCA, the RCA is blocked right at its origin. Which territory loses its supply?","c":"SA node, AV node, right ventricle wall, posterior septum","w":["SA node, left ventricle wall, anterior septum, left border","AV node, sternocostal ventricles, anterior septum, left atrium","Right ventricle wall only, because the crux is fed by the LCA","Left atrium, left border, apex, anterior wall of the left ventricle"],"e":"Follow the RCA from the right aortic sinus: SA nodal branch (SA node, here from the RCA), right marginal branch (right ventricle wall, along the inferior border), then at the crux the AV nodal branch (AV node) and the PDA (diaphragmatic surface of the ventricles and posterior septum). Right dominant means the RCA feeds the crux. The anterior septum, sternocostal surface and left border belong to the LAD, circumflex and left marginal.","lo":"Explain the pathways, branches and tissues served by the RCA.","deep":true,"note":"You wanted to learn the coronary vessels, their branches, pathways and what each one perfuses."},{"l":1,"t":"Coronary arteries","q":"Which branch, path and territory are correctly matched?","c":"Circumflex: in the coronary sulcus, to the left ventricle wall","w":["LAD: in the posterior interventricular sulcus, to the posterior septum","Right marginal: along the right border, to the right atrium wall","Left marginal: along the inferior border, to the right ventricle wall","Circumflex: in the anterior interventricular sulcus, to the right ventricle wall"],"e":"The circumflex wraps around in the coronary sulcus to serve the left ventricle wall and diaphragmatic surface. The LAD runs in the anterior interventricular sulcus to the sternocostal surface and anterior septum. The right marginal follows the inferior border to the right ventricle wall, and the left marginal follows the left border to the left ventricle wall.","lo":"Explain the pathways, branches and tissues served by the LCA.","deep":true,"note":"You wanted to learn the coronary vessels, their branches, pathways and what each one perfuses."},{"l":1,"t":"Coronary arteries","q":"The posterior interventricular branch (PDA) supplies:","c":"The diaphragmatic surface of the ventricles and the posterior interventricular septum","w":["The SA node, the right atrium and the anterior wall of the right ventricle","The sternocostal surface of the left ventricle and the anterior interventricular septum","The left atrium and the base of the heart, through the posterior atrial branches","The left border and the apex, through the left marginal artery and its branches"],"e":"It runs in the posterior interventricular sulcus and sends branches deep into the septum.","lo":"Explain the pathways, branches and tissues served by the RCA."},{"l":1,"t":"Coronary arteries","q":"Select ALL correct statements about the left coronary artery.","c":["It splits into the anterior interventricular branch (LAD) and the circumflex branch","The LAD supplies the sternocostal surface of the ventricles and the anterior septum","The circumflex gives off the left marginal artery to the left ventricle"],"w":["The LAD runs in the posterior interventricular sulcus to the diaphragmatic surface","The left marginal artery runs along the inferior border to the right ventricle"],"e":"The circumflex wraps around in the coronary sulcus and serves the left ventricle's wall and diaphragmatic surface. The left marginal follows the left border.","lo":"Explain the pathways, branches and tissues served by the LCA.","deep":true},{"l":1,"t":"Coronary arteries","q":"Which branch is one of the few named an artery rather than a branch?","c":"Left marginal artery","w":["Right marginal","Anterior interventricular","Circumflex","Posterior interventricular"],"e":"It comes off the circumflex and runs along the left border.","lo":"Explain the pathways, branches and tissues served by the LCA.","said":"“Notice this is one of the few branches that is called artery.”"},{"l":1,"t":"Coronary arteries","q":"In addition to the posterior interventricular artery, the dominant blood supply to the crux also supplies which branch?","c":"AV nodal branch","w":["Anterior interventricular branch","Left marginal artery","Right marginal branch","SA nodal branch"],"e":"The crux is where the coronary sulcus meets the posterior interventricular sulcus. Whatever supplies the PDA and AV nodal branch there sets dominance.","lo":"Explain heart dominance and the relevance to myocardial ischemia.","said":"Dr. Fox's own check question at the end of Coronary Arteries."},{"l":1,"t":"Coronary arteries","q":"Rank heart dominance from most to least common.","c":"Right dominant (about two thirds) → codominant → left dominant","w":["Left dominant (about two thirds) → codominant → right dominant","Codominant (about two thirds) → right dominant → left dominant","Right dominant (about two thirds) → left dominant → codominant","Left dominant (about two thirds) → right dominant → codominant"],"e":"Right dominant: RCA supplies the crux. Codominant: both. Left dominant: the LCA (via the circumflex).","lo":"Explain heart dominance and the relevance to myocardial ischemia.","deep":true},{"l":1,"t":"Coronary arteries","q":"Why do left-dominant hearts have worse outcomes with myocardial ischemia?","c":"An LCA occlusion cuts off nearly all the interventricular septum, which carries the bundle branches","w":["The RCA is blocked more often in left-dominant hearts, and it supplies both bundle branches","Left-dominant hearts have no SA nodal branch, so any occlusion stops the pacemaker","The left ventricular wall is thinner in left-dominant hearts, so it ruptures more easily","Left-dominant hearts lack an LAD, so the anterior wall depends on the RCA alone"],"e":"The LCA always supplies the LAD, circumflex and left marginal. In a left-dominant heart it also supplies the posterior septum, so one common blockage takes out the whole septum and the conduction pathway in it.","lo":"Explain heart dominance and the relevance to myocardial ischemia.","deep":true},{"l":1,"t":"Coronary arteries","q":"A clot blocks the anterior interventricular branch (LAD). Which region is most at risk?","c":"The sternocostal surface of the ventricles and the anterior interventricular septum","w":["The SA node and the crista terminalis of the right atrium","The diaphragmatic surface of the ventricles and the posterior interventricular septum","The right atrium and the right border of the heart","The left border and the posterior wall of the left atrium"],"e":"The LAD runs in the anterior interventricular sulcus and sends branches deep into the septum.","lo":"Explain the pathways, branches and tissues served by the LCA.","deep":true},{"l":1,"t":"Cardiac veins","q":"Which veins of the greater system drain directly into the right atrium rather than the coronary sinus?","c":"Anterior cardiac veins","w":["Great cardiac vein","Middle cardiac vein","Posterior vein of the left ventricle","Small cardiac vein"],"e":"They drain the subepicardial myocardium of the right ventricle and bridge over the RCA. Delicate in dissection.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","said":"Dr. Fox's own check question at the end of Cardiac Veins."},{"l":1,"t":"Cardiac veins","q":"Select ALL correct pairs of vein and the artery it accompanies.","c":["Great cardiac vein: anterior interventricular branch (LAD)","Middle cardiac vein: posterior interventricular branch (PDA)","Small cardiac vein: right marginal branch"],"w":["Great cardiac vein: right marginal branch of the RCA","Middle cardiac vein: circumflex branch of the LCA"],"e":"Each named vein of the greater system runs beside an artery: the great cardiac vein with the LAD in the anterior interventricular sulcus, the middle cardiac vein with the PDA in the posterior interventricular sulcus, and the small cardiac vein with the right marginal branch along the inferior border. All three drain into the coronary sinus, which opens into the right atrium. No named vein pairs with the circumflex in this lecture. This is in the Cardiac Veins video, 01:08 to 03:24.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true},{"l":1,"t":"Cardiac veins","q":"On the diaphragmatic surface, an artery and a vein run together in the posterior interventricular sulcus. What are they, and where does the vein drain?","c":"PDA and middle cardiac vein; into the coronary sinus","w":["LAD and great cardiac vein; into the coronary sinus","PDA and small cardiac vein; into the right atrium","Circumflex and middle cardiac vein; into the left atrium","RCA and small cardiac vein; into the coronary sinus"],"e":"The middle cardiac vein accompanies the posterior interventricular branch (PDA) in the posterior interventricular sulcus and drains into the coronary sinus. The great cardiac vein and LAD are in the anterior sulcus; the small cardiac vein runs with the right marginal branch along the inferior border.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true,"note":"You had no idea vein and artery pairs were covered: Cardiac Veins video, 01:08 to 03:24."},{"l":1,"t":"Cardiac veins","q":"The great cardiac vein begins beside the LAD near the apex. Which path does it take to the right atrium?","c":"Up the anterior sulcus, around the coronary sulcus, into the coronary sinus","w":["Down to the apex, then up the posterior sulcus, into the right atrium","Across the right ventricle, bridging over the RCA, straight into the right atrium","Along the left border with the left marginal artery, into the left atrium","Down the anterior sulcus to the apex, then straight into the left ventricle"],"e":"The great cardiac vein follows the LAD up the anterior interventricular sulcus, rounds into the coronary sulcus and drains into the coronary sinus, which empties into the right atrium. Bridging over the RCA straight into the right atrium describes the anterior cardiac veins.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true,"note":"You had no idea vein and artery pairs were covered: Cardiac Veins video, 01:08 to 03:24."},{"l":1,"t":"Cardiac veins","q":"Map the greater system: where does blood from the subepicardial myocardium end up?","c":"Great, middle and small cardiac veins → coronary sinus → right atrium; anterior cardiac veins → right atrium directly","w":["Great, middle and small cardiac veins → coronary sinus → left atrium; anterior cardiac veins → left atrium directly","Great cardiac vein → right atrium directly; middle, small and anterior cardiac veins → coronary sinus → right atrium","All cardiac veins, anterior ones included → coronary sinus → superior vena cava → right atrium","Great, middle and small cardiac veins → superior vena cava → right atrium; anterior cardiac veins → coronary sinus"],"e":"“All veins lead to the right atrium.” The coronary sinus opens into the right atrium beside the AV node.","lo":"Map the venous flow of blood from the myocardium of the heart to the right atrium (the greater system of veins).","deep":true},{"l":1,"t":"Cardiac veins","q":"Which statement about the smaller system is correct?","c":"Small (Thebesian) veins drain subendocardial myocardium straight into the chambers, densest in the right atrium","w":["Small (Thebesian) veins drain subepicardial myocardium into the coronary sinus, densest in the left ventricle","The smaller system is another name for the small cardiac vein, which runs with the right marginal branch","Small (Thebesian) veins drain subendocardial myocardium straight into the chambers, densest in the left ventricle","Small (Thebesian) veins drain the pericardium into the coronary sinus, densest in the right ventricle"],"e":"Greater system = named veins, subepicardial, to the coronary sinus (or right atrium). Smaller system = microscopic veins, subendocardial, into the chamber they sit beside.","lo":"Describe the smaller system of blood return to the heart.","deep":true},{"l":1,"t":"Cardiac veins","q":"How do you tell the small cardiac vein from the small cardiac (Thebesian) veins?","c":"If you can see it, it's the small cardiac vein; the Thebesian veins are microscopic","w":["The small cardiac vein drains into the left atrium; the Thebesian veins drain into the right","The Thebesian veins run with the right marginal branch; the small cardiac vein runs alone","There is no difference; they are two names for the same vessels","The small cardiac vein is microscopic; the Thebesian veins are visible on the surface"],"e":"The small cardiac vein runs with the right marginal branch to the coronary sinus.","lo":"Describe the smaller system of blood return to the heart.","said":"“If you can see the vein, it's of the greater system.”"},{"l":1,"t":"Conduction and control","q":"Put the cardiac cycle in order, starting with diastole.","c":"Diastole → atrial systole → isovolumetric ventricular contraction → ejection","w":["Diastole → isovolumetric ventricular contraction → atrial systole → ejection","Diastole → ejection → atrial systole → isovolumetric ventricular contraction","Diastole → atrial systole → ejection → isovolumetric ventricular contraction","Diastole → isovolumetric ventricular contraction → ejection → atrial systole"],"e":"Then back to diastole. Blood always moves from high to low pressure, and volume is inversely proportional to pressure.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correct pairs of phase and valve state.","c":["Diastole: AV valves open, semilunar valves closed","Atrial systole: AV valves open, semilunar valves closed","Isovolumetric contraction: all valves closed","Ejection: AV valves closed, semilunar valves open"],"w":["Ejection: AV valves open, semilunar valves open","Diastole: AV valves closed, semilunar valves open"],"e":"About 75% of ventricular filling happens in diastole; atrial systole (the atrial kick) adds the last quarter.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow.","deep":true},{"l":1,"t":"Conduction and control","q":"How much of ventricular filling happens during diastole, before the atria contract?","c":"About 75%","w":["About 25%","About 50%","100%","About 90%"],"e":"The atrial kick in atrial systole supplies the remaining quarter.","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow."},{"l":1,"t":"Conduction and control","q":"Which conduction pathway is in the right order?","c":"SA node → AV node → AV bundle (of His) → right and left bundle branches → Purkinje fibers","w":["SA node → AV bundle (of His) → AV node → right and left bundle branches → Purkinje fibers","AV node → SA node → AV bundle (of His) → right and left bundle branches → Purkinje fibers","SA node → AV node → right and left bundle branches → AV bundle (of His) → Purkinje fibers","SA node → right and left bundle branches → AV node → AV bundle (of His) → Purkinje fibers"],"e":"Bundle branches run down the interventricular septum; the right one takes the septomarginal trabecula shortcut.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correct intrinsic rates.","c":["SA node: about 100 bpm","AV node: about 40 to 60 bpm","AV bundle (of His): about 20 to 35 bpm"],"w":["SA node: about 60 bpm","AV node: about 100 to 120 bpm"],"e":"Rates fall the further you go down the pathway. The SA node is the pacemaker.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true},{"l":1,"t":"Conduction and control","q":"The heart's conduction system is made of:","c":"Specialized cardiomyocytes","w":["Nerve fibers from the vagus nerve","Purkinje neurons","Sympathetic postganglionic axons","Smooth muscle cells"],"e":"Every part of it is specialized cardiac muscle capable of autorhythmic depolarization.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","said":"“People think there must be nerves or nerve fibers within the heart… everything is just a specialized cardiomyocyte.”"},{"l":1,"t":"Conduction and control","q":"The SA node's intrinsic rate is about 100 bpm, yet resting heart rate is lower because:","c":"Parasympathetic stimulation dominates at rest","w":["The AV node's slower rhythm overrides the SA node at rest","Sympathetic stimulation dominates at rest","The SA node fires on only every other impulse at rest","The Purkinje fibers hold the SA node back at rest"],"e":"Vagal (parasympathetic) input from the cardiac plexus slows the SA node to perhaps 60 to 70 bpm.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute."},{"l":1,"t":"Conduction and control","q":"What is the difference between cardiac arrest and a heart attack?","c":"Cardiac arrest is a conduction failure; a heart attack is a blocked coronary blood supply","w":["Cardiac arrest is a blocked coronary blood supply; a heart attack is a conduction failure","They are two names for the same event, a blocked coronary artery","Cardiac arrest affects only the atria; a heart attack affects only the ventricles","Cardiac arrest is a valve failure; a heart attack is a conduction failure"],"e":"Electrical vs vascular.","lo":"Describe the cardiac conduction system: the nodes, fibers, rates at nodes, influences and contractions per minute.","deep":true,"said":"“Oftentimes people will conflate cardiac arrests with heart attacks.”"},{"l":1,"t":"Conduction and control","q":"Fibers that cause a depression of heart rate are conducted by which nervous structures?","c":"Vagus nerves (CN X)","w":["Cardiac (accelerator) nerves","Postganglionic sympathetic fibers","Preganglionic sympathetic fibers from T1 to T4/5","Phrenic nerves (C3 to C5)"],"e":"Vagal cardiac branches are parasympathetic: they slow the rate and dilate the coronary arteries. The sympathetic fibers raise the rate.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","said":"Dr. Fox's own check question at the end of Conduction and Control."},{"l":1,"t":"Conduction and control","q":"Select ALL correct statements about sympathetic control of the heart.","c":["Preganglionic fibers come from T1 to T4/5","They reach the cardiac plexus as cardiac (accelerator) nerves from the sympathetic trunk","They raise heart rate","Their constriction of the coronary arteries is only a minor effect"],"w":["Preganglionic fibers travel to the heart in the vagus nerve (CN X)","They slow heart rate and reduce the force of contraction"],"e":"The faster rate increases perfusion overall, and some beta-2 dilation offsets the constriction.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","deep":true},{"l":1,"t":"Conduction and control","q":"Where are the two cardiac plexuses?","c":"Superficial: in the concavity of the aortic arch. Deep: at the tracheal bifurcation","w":["Superficial: at the tracheal bifurcation. Deep: in the concavity of the aortic arch","Superficial: on the apex of the heart. Deep: inside the interventricular septum","Superficial: behind the manubrium. Deep: on the central tendon of the diaphragm","Superficial: on the base of the heart. Deep: in the coronary sulcus"],"e":"Together they carry vagal and sympathetic fibers that act on the SA node.","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses.","deep":true},{"l":1,"t":"Conduction and control","q":"Which definitions are correct?","c":"Normal sinus rhythm: 60 to 100 bpm, typical EKG. Bradycardia: under 60. Tachycardia: over 100","w":["Normal sinus rhythm: 40 to 60 bpm, typical EKG. Bradycardia: under 40. Tachycardia: over 60","Normal sinus rhythm: 60 to 100 bpm, any EKG. Bradycardia: over 100. Tachycardia: under 60","Normal sinus rhythm: 70 to 120 bpm, typical EKG. Bradycardia: under 70. Tachycardia: over 120","Normal sinus rhythm: 50 to 90 bpm, typical EKG. Bradycardia: under 50. Tachycardia: over 90"],"e":"Rate and rhythm both count: normal sinus rhythm needs a typical EKG.","lo":"Describe normal sinus rhythm vs. arrhythmias.","deep":true},{"l":1,"t":"Conduction and control","q":"Select ALL correctly classified arrhythmias.","c":["Sinus node dysfunction: bradyarrhythmia","AV block: bradyarrhythmia","Atrial fibrillation: tachyarrhythmia","Ventricular fibrillation: tachyarrhythmia"],"w":["AV block: tachyarrhythmia","Ventricular fibrillation: bradyarrhythmia"],"e":"Arrhythmias are also called dysrhythmias.","lo":"Describe normal sinus rhythm vs. arrhythmias.","deep":true},{"l":1,"t":"Conduction and control","q":"Which arrhythmia is an emergency because the ventricles stop pumping blood?","c":"Ventricular fibrillation","w":["Atrial fibrillation","Sinus node dysfunction","Sinus bradycardia at 55 bpm","Sinus tachycardia at 105 bpm"],"e":"V-fib is uncoordinated ventricular contraction, corrected with defibrillation. A-fib is usually chronic and manageable with medication but can throw a clot.","lo":"Describe normal sinus rhythm vs. arrhythmias."},{"l":1,"t":"Auscultation","q":"Select ALL correct pairs of heart sound and event.","c":["S1 (lub): turbulence as the AV valves close at the start of ventricular systole","S2 (dub): turbulence as the semilunar valves close at the start of diastole","S3: turbulence during ventricular filling","S4: turbulence during atrial systole into a non-compliant ventricle"],"w":["S1 (lub): turbulence as the semilunar valves close at the start of ventricular systole","S2 (dub): turbulence as the AV valves close at the start of diastole"],"e":"S1 and S2 are primary; S3 and S4 are secondary.","lo":"Explain the events that correspond with the various heart sounds.","deep":true},{"l":1,"t":"Auscultation","q":"Which secondary heart sound is common and often normal in children?","c":"S3","w":["S4","S2","S1","A murmur"],"e":"S3 (S1, S2, S3) = the Kentucky gallop. S4 (S4, S1, S2) = Tennessee; rare and often atypical, usually from ventricular non-compliance.","lo":"Describe the heart sounds."},{"l":1,"t":"Auscultation","q":"A murmur heard in an adult most often points to:","c":"A valve disorder","w":["Normal ventricular filling","Atrial kick","A healthy S3","A normal S1"],"e":"Murmurs are abnormal clicking, gurgling or rushing sounds. Common and usually benign in children.","lo":"Describe the heart sounds."},{"l":1,"t":"Auscultation","q":"Where should the bell of the stethoscope be placed when auscultating the aortic valve?","c":"2nd intercostal s
