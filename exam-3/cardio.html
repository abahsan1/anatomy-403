s that mature in the thymus"],"e":"Innate immunity is non-specific (fever, inflammation) and is ready without prior exposure. Acquired immunity is antigen-specific and uses T-cells, B-cells, plasma cells and memory cells (Lymphatics slide 4).","lo":"Distinguish between innate and acquired immunity.","note":"Your slide note: innate does not require previous exposure."},{"l":6,"t":"Lymphatic system overview","q":"Which pair are both examples of innate immunity?","c":"Fever and inflammation","w":["T-cells and plasma cells","Memory cells and antibodies","B-cells and fever","Inflammation and memory B-cells"],"e":"Fever and inflammation are the innate, non-specific responses on the slide; lymphocytes, plasma cells, antibodies and memory cells belong to acquired immunity (Lymphatics slide 4).","lo":"Distinguish between innate and acquired immunity."},{"l":6,"t":"Lymphatic system overview","q":"Why does a second exposure to the same virus usually cause milder illness?","c":"Acquired immunity kept antigen-specific memory cells","w":["Innate immunity learned the virus's specific antigens","Fever reaches a higher set point the second time","Inflammation becomes antigen-specific after one exposure","Red bone marrow stores the virus's antigens for later"],"e":"Memory cells are part of acquired immunity, which is specific to antigens; innate responses stay non-specific however often they fire (Lymphatics slides 4 and 7).","lo":"Distinguish between innate and acquired immunity.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Select ALL correctly matched pairs of immunity type and feature.","c":["Innate: non-specific","Innate: fever and inflammation","Acquired: specific to antigens","Acquired: T-cells, B-cells and memory cells"],"w":["Innate: needs previous exposure","Acquired: non-specific","Acquired: fever and inflammation","Innate: memory cells"],"e":"Innate = non-specific, no prior exposure needed, fever and inflammation. Acquired = antigen-specific, with T-cells, B-cells, plasma cells and memory cells (Lymphatics slide 4).","lo":"Distinguish between innate and acquired immunity.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"What makes an organ a primary lymphatic organ?","c":"Stem cells divide and lymphocytes gain immunocompetence there","w":["Lymphocytes meet antigens and mount immune responses there","It filters lymph that arrives through afferent vessels","It has no capsule and sits in the mucous membranes","It removes old red blood cells from the circulation"],"e":"Primary organs (red bone marrow, thymus) are where stem cells divide and lymphocytes become immunocompetent. Secondary organs and tissues are immune response sites (Lymphatics slides 5 and 13).","lo":"Distinguish between primary and secondary lymphatic organs & tissues."},{"l":6,"t":"Lymphatic system overview","q":"Which pair are the primary lymphatic organs?","c":"Red bone marrow and thymus","w":["Lymph nodes and spleen","Spleen and thymus","Tonsils and red bone marrow","Thymus and lymph nodes"],"e":"Red bone marrow and the thymus are primary; lymph nodes, nodules (including tonsils) and the spleen are secondary (Lymphatics slide 5).","lo":"Distinguish between primary and secondary lymphatic organs & tissues."},{"l":6,"t":"Lymphatic system overview","q":"Select ALL correctly classified lymphatic organs or tissues.","c":["Red bone marrow: primary","Thymus: primary","Lymph nodes: secondary","Spleen: secondary","Lymphatic nodules: secondary tissue"],"w":["Spleen: primary","Thymus: secondary","Lymph nodes: primary","Tonsils: primary"],"e":"Primary: red bone marrow and thymus. Secondary: lymph nodes, the spleen and the lymphatic nodules (tissues, not organs), which include the tonsils (Lymphatics slide 5).","lo":"Distinguish between primary and secondary lymphatic organs & tissues.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Comparing a lymph node with the thymus, which statement is true?","c":"The node is a response site; the thymus trains T-cells","w":["The node trains T-cells; the thymus is a response site","Both are primary lymphatic organs that train T-cells","Both are acapsular lymphatic tissues in mucosa","The node makes B-cells; the thymus filters the lymph"],"e":"Lymph nodes are secondary organs where immune responses happen; the thymus is a primary organ where T-cells are selected and mature (Lymphatics slides 5 and 15).","lo":"Distinguish between primary and secondary lymphatic organs & tissues.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Antibodies are involved in what type of immune response?","c":"Humoral immunity","w":["Cell-mediated immunity","Innate immunity","Inflammatory immunity","Cytotoxic immunity"],"e":"Humoral immunity works through antibodies made by plasma cells (activated B-cells); cell-mediated immunity works through T-cells (Lymphatics slides 7 and 10).","lo":"Describe the functional pathways of cellular and antibody mediated immune responses.","said":"Dr. Fox's own check question (Lymphatics slide 10)."},{"l":6,"t":"Lymphatic system overview","q":"Which T-cell type can directly kill infected or abnormal cells?","c":"T-cytotoxic cells (CD8+)","w":["T-helper cells (CD4+)","T-regulatory cells","T-memory cells","Thymocytes in the cortex"],"e":"T-cytotoxic (CD8+) cells kill directly; T-helper (CD4+) cells help other cells respond; T-regulatory cells guard against autoimmunity (Lymphatics slide 6).","lo":"Describe the functional pathways of cellular and antibody mediated immune responses.","note":"Your slide note: T-cytotoxic can directly kill pathogens."},{"l":6,"t":"Lymphatic system overview","q":"In humoral immunity, what do B-cells become once activated in the tissues?","c":"Plasma cells that secrete antibodies","w":["T-helper cells that coordinate others","T-cytotoxic cells that kill pathogens","Macrophages that engulf the debris","Dendritic cells of the inner cortex"],"e":"B-cells circulate in blood; once activated in the tissues they become plasma cells, and some persist as memory B-cells (Lymphatics slide 7).","lo":"Describe the functional pathways of cellular and antibody mediated immune responses."},{"l":6,"t":"Lymphatic system overview","q":"Select ALL correctly matched lymphocytes and roles.","c":["T-cytotoxic (CD8+): directly kill pathogens","T-regulatory: recognize autoimmunity","Plasma cell: secretes antibodies","Memory cells: persist for later exposures"],"w":["T-helper (CD4+): secretes antibodies","Plasma cell: directly kills pathogens","T-cytotoxic (CD8+): recognize autoimmunity","T-regulatory: secretes antibodies"],"e":"Cellular immunity: T-cytotoxic cells kill, T-helper cells help, T-regulatory cells check autoimmunity, T-memory cells persist. Humoral immunity: B-cells become antibody-secreting plasma cells, and memory B-cells persist (Lymphatics slides 6 and 7).","lo":"Describe the functional pathways of cellular and antibody mediated immune responses.","deep":true,"note":"Your slide notes: T-cytotoxic directly kill; T-reg recognize autoimmunity; memory cells are those that persist."},{"l":6,"t":"Lymphatic system overview","q":"Which pairing of immune pathway and main lymphocyte is correct?","c":"Cellular immunity relies on T-cells; humoral on B-cells","w":["Cellular immunity relies on B-cells; humoral on T-cells","Both cellular and humoral immunity rely on T-cells","Both cellular and humoral immunity rely on B-cells","Cellular immunity relies on plasma cells; humoral on T-cells"],"e":"Cellular (cell-mediated) immunity is carried out by T-cells; humoral (antibody-mediated) immunity by B-cells and the plasma cells they become (Lymphatics slides 6 and 7).","lo":"Describe the functional pathways of cellular and antibody mediated immune responses.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"In what order does lymph flow through the lymphatic system?","c":"Capillaries, vessels and nodes, trunks, then ducts","w":["Capillaries, ducts, trunks, then vessels and nodes","Trunks, capillaries, vessels and nodes, then ducts","Vessels and nodes, capillaries, ducts, then trunks","Capillaries, trunks, vessels and nodes, then ducts"],"e":"Lymphatic capillaries drain interstitial fluid into vessels that pass through nodes, then into trunks and finally the ducts that empty into the venous angles (Lymphatics slides 8 and 29).","lo":"Describe the gross pattern of lymphatic drainage."},{"l":6,"t":"Lymphatic system overview","q":"Superficial lymph vessels in the skin usually run with which structures?","c":"Veins","w":["Arteries","Nerves","Tendons","Ducts"],"e":"In the skin (superficial) lymph vessels follow veins; in the viscera (deep) they follow arteries (Lymphatics slide 8).","lo":"Describe the gross pattern of lymphatic drainage."},{"l":6,"t":"Lymphatic system overview","q":"Select ALL true statements about lymph circulation.","c":["Lymphatic capillaries are very permeable","Flow in lymphatic capillaries is one-way","Lacteals in the small intestine carry chyle","Lymph returns excess interstitial fluid to venous return"],"w":["Visceral lymph vessels follow veins","Lymph returns fluid to the arterial circulation","Lymphatic capillaries carry lymph both ways","Lacteals carry chyle in the large intestine"],"e":"Lymphatic capillaries are very permeable with unidirectional flow; lacteals in the small intestine carry chyle; lymph returns excess fluid to the veins. Visceral vessels follow arteries (Lymphatics slide 8).","lo":"Describe the gross pattern of lymphatic drainage.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Where does lymph finally re-enter the blood?","c":"At the venous angles, where the IJV meets the subclavian","w":["At the hepatic portal vein, just beneath the liver","At the right atrium, beside the coronary sinus","At the renal veins, just beside the two kidneys","At the arch of the aorta, high in the thorax"],"e":"Both ducts end at the venous angles, where the internal jugular and subclavian veins join to form the brachiocephalic vein: the right lymphatic duct on the right, the thoracic duct on the left (Lymphatics slides 29 and 31).","lo":"Describe the gross pattern of lymphatic drainage.","deep":true,"note":"Your slide note: IJV + SCV meet at the venous angle to form the BCV."},{"l":6,"t":"Lymphatic system overview","q":"Edema develops when which is true?","c":"Filtration out of capillaries exceeds reabsorption","w":["Reabsorption into capillaries exceeds filtration","Filtration and reabsorption are exactly equal","Lymph flow is greater than capillary filtration","Arterial pressure falls below venous pressure"],"e":"Edema (swelling) is filtration greater than reabsorption, so fluid builds up in the tissues faster than it is removed. It has many causes, lymphedema among them (Lymphatics slide 9).","lo":"Describe the process of edema."},{"l":6,"t":"Lymphatic system overview","q":"An arm swells after its axillary lymph nodes are removed. What is this called?","c":"Lymphedema","w":["Lymphangitis","Lymphadenitis","Lymphadenopathy","Lymphoma"],"e":"Lymphedema is edema caused by failed lymph drainage. Lymphangitis is inflamed vessels, lymphadenitis inflamed nodes, lymphadenopathy enlarged nodes (Lymphatics slides 9 and 24).","lo":"Describe the process of edema.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Why does blocked lymph drainage cause tissue swelling?","c":"Excess tissue fluid is no longer returned to the veins","w":["Too much plasma is reabsorbed back into capillaries","Lymph is pushed backward into the small arteries","Red blood cells leak out of capillaries into tissue","Lymph nodes enlarge until they fill up the tissue"],"e":"Lymphatics normally return the excess interstitial fluid that capillaries filter; without them filtration outruns removal and fluid pools (Lymphatics slides 8 and 9).","lo":"Describe the process of edema.","deep":true},{"l":6,"t":"Primary lymphatic organs","q":"Which best states the difference between primary and secondary lymphatic organs?","c":"Primary make and train lymphocytes; secondary host immune responses","w":["Primary host immune responses; secondary make and train lymphocytes","Primary are capsulated; secondary organs all lack any capsule","Primary drain lymph to ducts; secondary only filter the blood","Primary lie in the abdomen; secondary lie in the thorax"],"e":"Primary organs are for stem cell mitosis and immunocompetence; secondary organs and tissues are immune response sites (Lymphatics slide 13).","lo":"Distinguish between primary and secondary lymphatic organs.","deep":true},{"l":6,"t":"Primary lymphatic organs","q":"In a primary lymphatic organ, what does 'immunocompetence' mean?","c":"Lymphocytes gain the ability to recognize antigens","w":["Stem cells lose the ability to divide further","Lymphocytes start destroying old red blood cells","Nodes start filtering lymph from afferent vessels","Plasma cells move out into the bloodstream"],"e":"Primary organs do two things: stem cells divide (mitosis), and lymphocytes become immunocompetent, able to recognize antigens (Lymphatics slide 13).","lo":"Distinguish between primary and secondary lymphatic organs.","note":"Your slide note: 1) capable of division, 2) recognition."},{"l":6,"t":"Primary lymphatic organs","q":"Which of these is a secondary, not a primary, lymphatic organ?","c":"Spleen","w":["Thymus","Red bone marrow","Thymic cortex","Thymic medulla"],"e":"The spleen and lymph nodes are secondary organs; red bone marrow and the thymus (cortex and medulla) are primary (Lymphatics slide 13).","lo":"Distinguish between primary and secondary lymphatic organs."},{"l":6,"t":"Primary lymphatic organs","q":"In adults, where is red bone marrow most abundant?","c":"Flat bones and the ends of long bones","w":["Shafts of long bones and the skull sutures","Only within the shafts of the long bones","The mediastinum, just behind the sternum","The medullary cavities of the finger bones"],"e":"Red (hemopoietic, myeloid) marrow is abundant in flat bones and the ends of long bones (Lymphatics slides 13 and 14).","lo":"Describe the locations and functions of red bone marrow & the thymus.","note":"Your slide note: ends of long bones."},{"l":6,"t":"Primary lymphatic organs","q":"Which cells come from lymphoid stem cells?","c":"B-cells and T-cells","w":["Erythrocytes and platelets","Monocytes and granular leukocytes","Erythrocytes and monocytes","Platelets and granular leukocytes"],"e":"Lymphoid stem cells make B-cells and T-cells; myeloid stem cells make erythrocytes, thrombocytes, granular leukocytes and monocytes (Lymphatics slide 14).","lo":"Describe the locations and functions of red bone marrow & the thymus."},{"l":6,"t":"Primary lymphatic organs","q":"Select ALL cells correctly matched to their stem-cell line.","c":["Erythrocytes: myeloid","Thrombocytes: myeloid","Monocytes: myeloid","B-cells: lymphoid","T-cells: lymphoid"],"w":["Monocytes: lymphoid","Erythrocytes: lymphoid","B-cells: myeloid","Granular leukocytes: lymphoid"],"e":"Myeloid stem cells: erythrocytes, thrombocytes, granular leukocytes and monocytes. Lymphoid stem cells: B-cells and T-cells (Lymphatics slide 14).","lo":"Describe the locations and functions of red bone marrow & the thymus.","deep":true},{"l":6,"t":"Primary lymphatic organs","q":"Where is the thymus?","c":"In the mediastinum","w":["In the left hypochondriac region","In the posterior neck, behind the larynx","In the retroperitoneum, above the kidneys","In the lamina propria of the pharynx"],"e":"The thymus is a bilobed, capsulated organ in the mediastinum (Lymphatics slides 13 and 15).","lo":"Describe the locations and functions of red bone marrow & the thymus."},{"l":6,"t":"Primary lymphatic organs","q":"Where do the processes of selection occur on developing lymphocytes in the thymus?","c":"Positive selection in the cortex, negative in the medulla","w":["Positive selection in the medulla, negative in the cortex","Both positive and negative selection in the cortex","Both positive and negative selection in the medulla","Both selections take place in the red bone marrow"],"e":"Thymocytes are positively selected in the cortex (can they recognize an antigen?) and negatively selected in the medulla (will they attack the body?) (Lymphatics slides 15 and 16).","lo":"Describe the locations and functions of red bone marrow & the thymus.","said":"Dr. Fox's own check question (Lymphatics slide 16).","note":"Your slide note: + and C (cortex) come first."},{"l":6,"t":"Primary lymphatic organs","q":"What is the point of negative selection in the thymus?","c":"To remove thymocytes that would attack the body's own tissues","w":["To remove thymocytes that can't recognize any antigen","To turn the surviving thymocytes into plasma cells","To expand thymocytes that react strongly to self","To send unfit thymocytes back to the bone marrow"],"e":"Positive selection keeps thymocytes that can recognize an antigen; negative selection removes those that would mount a response against the body. Only a small fraction survive both (Lymphatics slide 15).","lo":"Describe the locations and functions of red bone marrow & the thymus.","deep":true,"note":"Your slide note: negative selection ensures the thymocyte won't mount an immune response against the body."},{"l":6,"t":"Primary lymphatic organs","q":"A 70-year-old's CT shows a small thymus mostly replaced by fat. What explains this?","c":"Normal involution after the thymus peaks at puberty","w":["A thymic tumour pressing out the mediastinal fat","Normal growth, since the thymus peaks in old age","Infection spreading down from the cervical nodes","Failure of the thymus to form during childhood"],"e":"The thymus reaches maximum size at puberty and then involutes, much of it replaced by adipose tissue (Lymphatics slide 15).","lo":"Describe the locations and functions of red bone marrow & the thymus.","deep":true,"note":"Your slide note: a large portion of the thymus is replaced with adipose tissue."},{"l":6,"t":"Primary lymphatic organs","q":"Which describes the structure of the thymus?","c":"Bilobed and capsulated, with trabeculae forming lobules","w":["Single-lobed and acapsular, with no lobules at all","Bean-shaped, with afferent and efferent vessels","Made of white and red pulp around a hilum","A ring of tonsils in the pharyngeal mucosa"],"e":"The thymus is bilobed and capsulated, and trabeculae divide it into lobules with a cortex and medulla (Lymphatics slide 15).","lo":"Describe the locations and functions of red bone marrow & the thymus."},{"l":6,"t":"Primary lymphatic organs","q":"Besides red bone marrow, where may lymphopoiesis also occur?","c":"In the thymus and lymph nodes","w":["In the liver and gallbladder","In the kidneys and adrenals","In the tonsils and the lungs","In the small intestine's lacteals"],"e":"Lymphocytes start in red marrow, but lymphopoiesis may occur elsewhere: in the thymus and lymph nodes (Lymphatics slide 14).","lo":"Describe the locations and functions of red bone marrow & the thymus."},{"l":6,"t":"Secondary lymphatic organs","q":"How does lymph enter and leave a lymph node?","c":"In through afferent vessels, out through efferent vessels at the hilum","w":["In through efferent vessels, out through afferent vessels at the hilum","In and out through afferent vessels at the hilum","In through arteries at the hilum, out through veins","In through the medulla, out through the outer cortex"],"e":"Afferent vessels carry lymph into the node's sinuses; efferent vessels carry it out at the hilus (Lymphatics slide 19).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","note":"Your slide note: afferent = into the node, efferent = out of the node."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL correctly matched lymph node regions and contents.","c":["Outer cortex: lymphatic nodules of B-cells","Inner cortex: T-cells and dendritic cells","Medullary sinuses: B-cells, plasma cells and macrophages"],"w":["Outer cortex: T-cells and dendritic cells","Inner cortex: lymphatic nodules of B-cells","Medullary sinuses: T-cells only","Hilum: afferent vessels"],"e":"Outer cortex: B-cell nodules. Inner cortex: T-cells and dendritic cells. Medulla: B-cells, plasma cells and macrophages. Efferent vessels leave at the hilum (Lymphatics slide 19).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"How do lymphatic nodules differ from lymph nodes?","c":"Nodules have no capsule and are not organs","w":["Nodules have a thick capsule and a hilum","Nodules are larger and always bean-shaped","Nodules filter blood instead of the lymph","Nodules are primary lymphatic organs"],"e":"Lymphatic nodules are acapsular, lack organized architecture and so are tissues, not organs; lymph nodes are capsulated organs (Lymphatics slides 19 and 20).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","note":"Your slide note: no capsule."},{"l":6,"t":"Secondary lymphatic organs","q":"Peyer's patches are an example of what?","c":"Aggregated lymphoid follicles of gut MALT","w":["Encapsulated lymph nodes in the mesentery","Primary lymphatic tissue of the gut wall","Red pulp of the spleen near the stomach","Tonsils that form the pharyngeal ring"],"e":"Peyer's patches are aggregated lymphoid follicles of GALT, the gut part of mucosa-associated lymphoid tissue (MALT), and make IgA (Lymphatics slide 20).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen."},{"l":6,"t":"Secondary lymphatic organs","q":"Where is the spleen?","c":"Left hypochondriac region, left upper quadrant","w":["Right hypochondriac region, right upper quadrant","Epigastric region, under the lesser curvature","Left lumbar region, just below the left kidney","Umbilical region, within the small bowel mesentery"],"e":"The spleen sits in the left hypochondriac region, LUQ, and is the largest single mass of lymphoid tissue (Lymphatics slide 23).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen."},{"l":6,"t":"Secondary lymphatic organs","q":"Immune responses typically occur in which part of the parenchyma of the spleen?","c":"White pulp","w":["Red pulp","Hilum","Gastric impression","Renal impression"],"e":"White pulp is where lymphocytes act; red pulp removes old red cells, holds platelets and can make blood cells (Lymphatics slides 23 and 26).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","said":"Dr. Fox's own check question (Lymphatics slide 26).","note":"Your slide note: white pulp is where immune responses are modulated."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL correctly matched spleen regions and functions.","c":["White pulp: lymphocyte action","Red pulp: removing old red blood cells","Red pulp: sequestering platelets","Red pulp: hemopoiesis"],"w":["White pulp: removing old red blood cells","White pulp: sequestering platelets","Red pulp: lymphocyte action","Hilum: lymphocyte action"],"e":"White pulp = lymphocyte action (immune responses). Red pulp = RBC removal, platelet sequestration and hemopoiesis (Lymphatics slide 23).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"Why is the spleen classed as a secondary lymphatic organ?","c":"It is a site of immune responses, not lymphocyte training","w":["It is where lymphocytes first gain immunocompetence","It is where lymphoid stem cells first divide","It is where thymocytes undergo positive selection","It drains the lymph from the whole left side"],"e":"Secondary organs are immune response sites; the spleen, the largest single mass of lymphoid tissue, mounts responses in its white pulp (Lymphatics slides 5 and 23).","lo":"Describe the locations and functions of lymph nodes, lymphatic nodules, & the spleen.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"Which tonsils form Waldeyer's ring?","c":"Pharyngeal, palatine and lingual tonsils","w":["Pharyngeal, palatine and laryngeal tonsils","Palatine and lingual tonsils only","Pharyngeal and palatine tonsils only","Lingual, laryngeal and tracheal tonsils"],"e":"Waldeyer's ring is the pharyngeal tonsil (adenoid), the palatine tonsils and the lingual tonsil (Lymphatics slides 20 and 21).","lo":"Describe the location, constituents, and functions of Waldeyer's ring."},{"l":6,"t":"Secondary lymphatic organs","q":"What is the pharyngeal tonsil also called?","c":"The adenoid","w":["The lingual tonsil","The palatine tonsil","Peyer's patch","The uvula"],"e":"The pharyngeal tonsil is the adenoid, one of the tonsils of Waldeyer's ring (Lymphatics slide 20).","lo":"Describe the location, constituents, and functions of Waldeyer's ring."},{"l":6,"t":"Secondary lymphatic organs","q":"What is Waldeyer's ring positioned to do?","c":"Trap antigens from food, drink and air entering the pharynx","w":["Filter lymph draining the lungs before it reaches the trunks","Produce red blood cells for the head and neck region","Train thymocytes before they are released into the blood","Remove old red blood cells from the blood of the head"],"e":"A pharyngeal ring of MALT, it samples and traps antigens from whatever is swallowed or breathed in, and promotes early B-cell activation and IgA production (Lymphatics slide 21).","lo":"Describe the location, constituents, and functions of Waldeyer's ring.","deep":true,"note":"Your slide note: samples whatever is dragged against them."},{"l":6,"t":"Secondary lymphatic organs","q":"Which antibody class is Waldeyer's ring noted for producing?","c":"IgA","w":["IgE","IgM","IgD","IgG"],"e":"As mucosal lymphoid tissue, Waldeyer's ring promotes early B-cell activation and IgA production (Lymphatics slide 21).","lo":"Describe the location, constituents, and functions of Waldeyer's ring."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL true statements about Waldeyer's ring.","c":["It is a pharyngeal ring of MALT","It traps antigens from food, drink or air","It promotes early B-cell activation","It includes the adenoid"],"w":["It is a primary lymphatic organ","It has a capsule like a lymph node","It encircles the larynx at the vocal folds","It mainly makes red blood cells"],"e":"Waldeyer's ring is unencapsulated MALT ringing the pharynx (pharyngeal tonsil or adenoid, palatine and lingual tonsils) that traps antigens and starts B-cell responses (Lymphatics slides 20 and 21).","lo":"Describe the location, constituents, and functions of Waldeyer's ring.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"Tonsillitis most often affects which tonsils?","c":"Palatine tonsils","w":["Lingual tonsil","Pharyngeal tonsil","Tubal tonsils","Laryngeal tonsils"],"e":"Tonsillitis is inflammation of the tonsils, typically the palatine tonsils (Lymphatics slide 22).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis."},{"l":6,"t":"Secondary lymphatic organs","q":"What usually causes tonsillitis?","c":"A virus, though Group A Streptococcus can too","w":["A fungus, though Group B Streptococcus can too","A parasite, though Staphylococcus can too","Always Group A Streptococcus, never a virus","An autoimmune attack by T-regulatory cells"],"e":"Tonsillitis is typically viral but can be a Group A Streptococcus infection; it is treated with time, antibiotics, or tonsillectomy (Lymphatics slide 22).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis."},{"l":6,"t":"Secondary lymphatic organs","q":"What is lymphadenitis?","c":"Inflamed lymph nodes, the commonest cause of enlargement","w":["Inflamed lymph vessels running between the nodes","Cancer reaching the lymph nodes from the blood","Swelling of a limb after its nodes are removed","Infection limited to the palatine tonsils alone"],"e":"Lymphadenopathy is enlarged nodes; its most common form is lymphadenitis, inflamed nodes. Lymphangitis is inflamed lymph vessels (Lymphatics slide 24).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL correctly matched terms and definitions.","c":["Lymphadenopathy: enlarged lymph nodes","Lymphadenitis: inflamed lymph nodes","Lymphangitis: inflamed lymph vessels","Metastasis: spread of a disease"],"w":["Lymphangitis: inflamed lymph nodes","Lymphadenitis: inflamed lymph vessels","Lymphadenopathy: inflamed tonsils","Metastasis: inflamed lymph vessels"],"e":"-adenopathy = enlarged nodes; -adenitis = inflamed nodes; -angitis = inflamed vessels; metastasis = spread of a disease (Lymphatics slides 24 and 25).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"A node is firm, fixed and painless on one side only. What is most likely?","c":"A malignancy, such as a metastasis","w":["A normal response to a common cold","Bilateral reactive lymphadenitis","Lymphedema from a blocked vein","An inflamed tonsil from strep throat"],"e":"Immune-response nodes are tender, mobile and bilateral; malignant nodes (lymphomas, metastases) are often painless, firm, fixed and unilateral (Lymphatics slides 24, 25 and 29).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis.","deep":true,"note":"Your slide note: tender, mobile, bilateral = normal; firm, fixed, unilateral = bad."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL correctly matched lymph node findings and what they suggest.","c":["Tender: immune response","Mobile: immune response","Bilateral: immune response","Firm and fixed: metastasis","Unilateral: metastasis"],"w":["Tender: metastasis","Firm and fixed: immune response","Bilateral: metastasis","Mobile: metastasis"],"e":"Tender, mobile, bilateral nodes point to an immune response; firm, fixed, unilateral nodes point to metastasis (Lymphatics slide 29).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis.","deep":true,"note":"Your slide note: tender, mobile, bilateral = normal; firm, fixed, unilateral = bad."},{"l":6,"t":"Secondary lymphatic organs","q":"Carcinomas (epithelial cancers) typically spread by which route?","c":"Lymphogenous, through the lymphatics","w":["Hematogenous, through the arteries","Transcoelomic, across the pleura only","Through the cerebrospinal fluid","Direct growth through bone marrow"],"e":"Carcinomas typically spread lymphogenously; sarcomas and renal carcinomas typically spread hematogenously, usually through veins (Lymphatics slide 25).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis."},{"l":6,"t":"Secondary lymphatic organs","q":"Select ALL correctly matched metastatic routes and typical tumours.","c":["Lymphogenous: carcinomas (epithelial)","Hematogenous: sarcomas (mesenchyme)","Hematogenous: renal carcinomas"],"w":["Lymphogenous: sarcomas (mesenchyme)","Hematogenous: only arterial spread","Transcoelomic: through the bloodstream","Lymphogenous: only arterial spread"],"e":"Lymphogenous spread: carcinomas. Hematogenous spread (typically venous): sarcomas and renal carcinomas. Transcoelomic spread crosses a body cavity (Lymphatics slide 25).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis.","deep":true},{"l":6,"t":"Secondary lymphatic organs","q":"Hematogenous metastasis typically travels in which vessels?","c":"Veins","w":["Arteries","Lymph vessels","Lacteals","Lymph ducts"],"e":"Hematogenous (blood-borne) spread is typically venous (Lymphatics slide 25).","lo":"Describe tonsillitis, lymphadenopathy, and metastasis."},{"l":6,"t":"Lymph nodes & pathways I","q":"Where does the right lymphatic duct empty?","c":"The right venous angle","w":["The left venous angle","The cisterna chyli","The azygos vein","The right atrium"],"e":"The right lymphatic duct ends at the right venous angle; the thoracic duct at the left (Lymphatics slides 29 and 31).","lo":"Describe the flow of lymph from capillaries to ducts, with },{"l":6,"t":"Lymph nodes & pathways I","q":"Select ALL lymphatic trunks that empty into the ducts at the root of the neck.","c":["Jugular trunk","Subclavian trunk","Bronchomediastinal trunk"],"w":["Cisterna chyli","Thoracic trunk","Axillary trunk","Pulmonary trunk"],"e":"The ducts near the venous angles receive the jugular, subclavian and bronchomediastinal trunks. The cisterna chyli is the start of the thoracic duct, and the pulmonary trunk is an artery (Lymphatics slide 31).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Root of Neck.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Which region's lymph returns by the right lymphatic duct?","c":"The right side of the head, neck and thorax, and the right upper limb","w":["Everything below the diaphragm, on both sides of the body","The left side of the head, neck and thorax, and the left upper limb","Both lower limbs together with the whole pelvis","The whole body except for the left upper limb"],"e":"The right lymphatic duct gathers the right jugular, subclavian and bronchomediastinal trunks; the thoracic duct drains everything else, including all lymph below the diaphragm (Lymphatics slides 29 and 31).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Root of Neck.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Waldeyer's ring drains first to which nodes?","c":"Superior deep cervical nodes, including the jugulodigastric","w":["Inferior deep cervical nodes, including the supraclavicular","Superficial cervical nodes along the external jugular","Apical axillary nodes beneath the clavicle","Superior tracheobronchial nodes beside the carina"],"e":"Waldeyer's ring (naso- and oropharynx) drains to the superior deep cervicals, including the jugulodigastric node, then down the IJV to the inferior deep cervicals and the jugular trunk (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck."},{"l":6,"t":"Lymph nodes & pathways I","q":"Which landmark separates the superior from the inferior deep cervical nodes?","c":"The tendon of the omohyoid muscle","w":["The tendon of the digastric muscle","The body of the hyoid bone","The clavicular head of sternocleidomastoid","The arch of the cricoid cartilage"],"e":"The intermediate tendon of omohyoid divides the deep cervical chain into superior and inferior groups (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck."},{"l":6,"t":"Lymph nodes & pathways I","q":"Superficial cervical nodes lie along which vein, and where do they drain?","c":"External jugular vein, to the subclavian trunk","w":["Internal jugular vein, to the jugular trunk","External jugular vein, to the jugular trunk","Internal jugular vein, to the subclavian trunk","Anterior jugular vein, to the thoracic duct"],"e":"On the schema, superficial cervicals follow the EJV to the subclavian trunk; deep cervicals follow the IJV to the jugular trunk (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck."},{"l":6,"t":"Lymph nodes & pathways I","q":"A child with strep throat has a tender node just below the angle of the jaw. Which node?","c":"Jugulodigastric node","w":["Virchow's node","Supraclavicular node","Inferior deep cervical node","Apical axillary node"],"e":"The jugulodigastric node, a superior deep cervical node, drains the tonsils and enlarges with strep and upper respiratory infections (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck.","deep":true,"note":"Your slide note: the jugulodigastric node is enlarged often during upper respiratory infection."},{"l":6,"t":"Lymph nodes & pathways I","q":"A firm left supraclavicular node is found in a patient losing weight. What should come to mind?","c":"Virchow's node, an early sign of gastric cancer","w":["Jugulodigastric node, a sign of strep throat","Virchow's node, a sign of acute tonsillitis","An apical axillary node from a breast infection","A normal reactive node from a recent cold"],"e":"Supraclavicular nodes are linked to malignancy; the left one, Virchow's node, sits where the thoracic duct ends and can be an early sign of gastric cancer (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck.","deep":true,"note":"Your slide note: Virchow's node is an early indication of gastric malignancy."},{"l":6,"t":"Lymph nodes & pathways I","q":"Select ALL correct steps in head and neck lymph flow.","c":["Waldeyer's ring → superior deep cervicals","Superior deep cervicals → inferior deep cervicals","Inferior deep cervicals → jugular trunk","Superficial cervicals → subclavian trunk"],"w":["Superficial cervicals → jugular trunk","Inferior deep cervicals → Waldeyer's ring","Waldeyer's ring → subclavian trunk","Jugular trunk → cisterna chyli"],"e":"Schema: Waldeyer's ring → superior deep cervicals → (along the IJV, past the omohyoid tendon) → inferior deep cervicals → jugular trunk → duct. Superficial cervicals (EJV) → subclavian trunk → duct (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"The deep cervical nodes follow which vein?","c":"Internal jugular vein","w":["External jugular vein","Anterior jugular vein","Facial vein","Subclavian vein"],"e":"The deep cervical chain runs along the internal jugular vein; the superficial cervicals run along the external jugular (Lymphatics slide 32).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Head & Neck."},{"l":6,"t":"Lymph nodes & pathways I","q":"Lymph from lung tissue starts in which nodes?","c":"Pulmonary nodes, within the lung","w":["Bronchopulmonary nodes, at the hilum","Inferior tracheobronchial nodes, below the carina","Superior tracheobronchial nodes, by the trachea","Parasternal nodes, alongside the sternum"],"e":"Order 0 to 3: pulmonary nodes → bronchopulmonary (hilar) → tracheobronchial (inferior, then superior) → bronchomediastinal trunk → duct (Lymphatics slide 33).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Thorax: Pulmonary."},{"l":6,"t":"Lymph nodes & pathways I","q":"Bronchopulmonary nodes are also called which nodes?","c":"Hilar nodes","w":["Carinal nodes","Pulmonary nodes","Apical nodes","Parasternal nodes"],"e":"Bronchopulmonary nodes sit at the lung hilum, so they are the hilar nodes (Lymphatics slide 33).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Thorax: Pulmonary."},{"l":6,"t":"Lymph nodes & pathways I","q":"What is the order of pulmonary lymph flow?","c":"Pulmonary, bronchopulmonary, tracheobronchial, bronchomediastinal trunk","w":["Bronchopulmonary, pulmonary, tracheobronchial, bronchomediastinal trunk","Pulmonary, tracheobronchial, bronchopulmonary, bronchomediastinal trunk","Tracheobronchial, bronchopulmonary, pulmonary, bronchomediastinal trunk","Pulmonary, bronchopulmonary, tracheobronchial, subclavian trunk"],"e":"Lung lymph moves from the periphery toward the midline: pulmonary → bronchopulmonary (hilar) → tracheobronchial → bronchomediastinal trunk → duct (Lymphatics slide 33).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Thorax: Pulmonary.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Where are the inferior tracheobronchial nodes?","c":"Below the tracheal bifurcation","w":["Above the tracheal bifurcation","At the hilum of each lung","Within the lung tissue itself","Alongside the body of the sternum"],"e":"Inferior tracheobronchial nodes lie below the bifurcation (carina); superior tracheobronchials lie above it beside the trachea (Lymphatics slide 33).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Thorax: Pulmonary.","note":"Your slide note: below bifurcation."},{"l":6,"t":"Lymph nodes & pathways I","q":"Which trunk carries the lungs' (deep) lymph to the ducts?","c":"Bronchomediastinal trunk","w":["Subclavian trunk","Jugular trunk","Lumbar trunk","Intestinal trunk"],"e":"Tracheobronchial nodes drain to the bronchomediastinal trunks, which empty into the right lymphatic duct or the thoracic duct (Lymphatics slide 33).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Thorax: Pulmonary.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Where does most lymph from the breast drain?","c":"To the axillary nodes, starting with the pectorals","w":["To the parasternal nodes, beside the sternum","To the opposite breast, across the midline","To the supraclavicular nodes, above the clavicle","To the deep cervical nodes, along the IJV"],"e":"From the subareolar plexus, about three quarters of breast lymph goes to the axillary (pectoral) nodes; the rest goes to the parasternals and the contralateral breast (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast."},{"l":6,"t":"Lymph nodes & pathways I","q":"Lymph from the breast first collects in which plexus?","c":"Subareolar plexus","w":["Pampiniform plexus","Pulmonary plexus","Brachial plexus","Vesical plexus"],"e":"Breast lymph gathers in the subareolar lymphatic plexus beneath the areola before heading to axillary or parasternal nodes (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast."},{"l":6,"t":"Lymph nodes & pathways I","q":"In what order do the axillary nodes pass on breast lymph?","c":"Pectoral, central, apical, then subclavian trunk","w":["Apical, central, pectoral, then subclavian trunk","Central, pectoral, apical, then subclavian trunk","Pectoral, apical, central, then jugular trunk","Pectoral, central, apical, then cisterna chyli"],"e":"Subareolar plexus (0) → pectoral (1) → central (2) → apical (3) → subclavian trunk (4) → duct (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Besides the axillary nodes, which route can breast cancer cells take through lymph?","c":"To the parasternal nodes and the opposite breast","w":["To the superficial inguinal nodes in the groin","To the jugulodigastric node below the jaw","To the popliteal nodes behind the knee","To the celiac nodes around the celiac trunk"],"e":"About a quarter of breast lymph goes from the subareolar plexus to the parasternal nodes and the contralateral breast (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Parasternal lymph from the breast reaches the duct by which trunk?","c":"Bronchomediastinal trunk","w":["Subclavian trunk","Jugular trunk","Cisterna chyli","Axillary trunk"],"e":"Parasternal nodes drain to the bronchomediastinal trunk; the axillary route ends in the subclavian trunk (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Select ALL correct steps in breast lymph flow.","c":["Subareolar plexus → pectoral axillary nodes","Pectoral nodes → central nodes","Central nodes → apical nodes","Apical nodes → subclavian trunk","Parasternal nodes → bronchomediastinal trunk"],"w":["Apical nodes → pectoral nodes","Parasternal nodes → subclavian trunk","Subareolar plexus → jugular trunk","Central nodes → bronchomediastinal trunk"],"e":"Main route: subareolar plexus → pectoral → central → apical → subclavian trunk → duct. Minor route: parasternals → bronchomediastinal trunk → duct (Lymphatics slide 34).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Axilla & Breast.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Deep lymphatics of the upper limb follow which vessels?","c":"The deep arteries","w":["The superficial veins","The cutaneous nerves","The flexor tendons","The cephalic vein"],"e":"Deep lymphatics follow arteries; superficial lymphatics follow the superficial veins (Lymphatics slide 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs."},{"l":6,"t":"Lymph nodes & pathways I","q":"Deep lymph from the upper limb reaches which axillary group first?","c":"Humeral nodes","w":["Apical nodes","Pectoral nodes","Parasternal nodes","Central nodes"],"e":"Deep lymphatics (with the arteries) → humeral axillary nodes → central → apical → subclavian trunk → duct (Lymphatics slide 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs."},{"l":6,"t":"Lymph nodes & pathways I","q":"On the schema, superficial upper-limb lymph (with the veins) drains to which axillary group?","c":"Apical nodes","w":["Humeral nodes","Pectoral nodes","Parasternal nodes","Supraclavicular nodes"],"e":"Superficial lymphatics follow the veins and go to the apical axillary nodes; deep lymphatics go to the humeral nodes first (Lymphatics slide 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs."},{"l":6,"t":"Lymph nodes & pathways I","q":"What order does deep lymph from the arm follow?","c":"Humeral, central, apical, then subclavian trunk","w":["Central, humeral, apical, then subclavian trunk","Humeral, apical, central, then subclavian trunk","Humeral, central, apical, then jugular trunk","Apical, central, humeral, then subclavian trunk"],"e":"Upper limb: humeral → central → apical → subclavian trunk → duct (Lymphatics slide 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"An infected cut on the hand leads to tender swelling in the armpit. Why there?","c":"Upper-limb lymph drains through the axillary nodes","w":["Upper-limb lymph drains through the cervical nodes","Hand lymph drains straight into the thoracic duct","Hand lymph drains to the parasternal nodes first","Upper-limb lymph skips nodes on its way to the veins"],"e":"Both superficial and deep lymph from the upper limb pass through the axillary nodes before the subclavian trunk, so they react to infections of the hand (Lymphatics slide 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs.","deep":true},{"l":6,"t":"Lymph nodes & pathways I","q":"Lymph from the right upper limb reaches the blood by which route?","c":"Right subclavian trunk, right lymphatic duct, right venous angle","w":["Right subclavian trunk, thoracic duct, left venous angle","Cisterna chyli, thoracic duct, left venous angle","Right jugular trunk, thoracic duct, right venous angle","Right bronchomediastinal trunk, cisterna chyli, right venous angle"],"e":"Axillary nodes → subclavian trunk; on the right that trunk joins the right lymphatic duct at the right venous angle (Lymphatics slides 31 and 35).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Upper Limbs.","deep":true},{"l":6,"t":"Lymph nodes & pathways II","q":"Lymph from the abdominal viscera follows which vessels?","c":"Arteries, such as the celiac trunk, SMA and IMA","w":["Veins, such as the hepatic portal vein","Nerves, such as the anterior vagal trunk","Veins, such as the splenic and renal veins","Ducts, such as the common bile duct"],"e":"Visceral lymph follows arteries: the celiac, SMA, IMA and renal nodes sit along those arteries (Lymphatics slides 8 and 40).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Abdominal viscera."},{"l":6,"t":"Lymph nodes & pathways II","q":"The lateral (para-) aortic nodes and lumbar t
