 mesenteric a.","Celiac trunk","Gonadal aa."],"e":"Celiac trunk ~T12 (foregut), superior mesenteric a. ~L1 (midgut), inferior mesenteric a. ~L3 (hindgut: last third of the transverse colon to the rectum).","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"Matching question: levels, where the branches go, and which artery or trunk."},{"l":2,"t":"Aorta and branches","q":"The superior mesenteric artery arises at about which level, and what does it supply?","c":"About L1; the midgut","w":["About T12; the foregut","About L3; the hindgut","About L2; the gonads"],"e":"SMA ~L1 → midgut (distal duodenum to about two thirds of the transverse colon). Renal aa. also arise ~L1; gonadal aa. ~L2.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"Matching question: levels, where the branches go, and which artery or trunk."},{"l":2,"t":"Aorta and branches","q":"Which opening in the diaphragm is the lowest?","c":"Aortic hiatus (T12)","w":["Esophageal hiatus (T10)","Caval opening (T8)","Superior thoracic aperture (T1)"],"e":"Caval opening T8, esophageal hiatus T10, aortic hiatus T12 (“I 8 10 eggs at 12”). The thoracic aorta is above the diaphragm; below the aortic hiatus it is the abdominal aorta.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"The aortic hiatus (T12) is the lowest of the caval, esophageal and aortic openings."},{"l":2,"t":"Subclavian artery and upper limb","q":"The second part of the axillary artery lies:","c":"Posterior to pectoralis minor","w":["Medial to pectoralis minor","Lateral to pectoralis minor","Posterior to the anterior scalene"],"e":"Pectoralis minor defines the axillary artery's parts: 1st medial to it (from the lateral margin of rib 1), 2nd posterior to it, 3rd lateral to it (to teres major). The anterior scalene defines the subclavian artery's parts.","lo":"Describe the axillary a. and its parts (and what defines them).","note":"2nd part: posterior to pec minor."},{"l":2,"t":"Inferior vena cava","q":"The inferior vena cava is formed by the union of the:","c":"Common iliac veins","w":["External iliac veins","Internal iliac veins","Left and right renal veins"],"e":"The internal and external iliac veins join to form each common iliac vein, and the two common iliac veins unite to form the IVC.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","note":"IVC = union of the common iliac veins."},{"l":2,"t":"Inferior vena cava","q":"Which superficial vein passes the medial malleolus?","c":"Great saphenous v.","w":["Small saphenous v.","Popliteal v.","Femoral v."],"e":"Great saphenous v.: medial lower limb, past the medial malleolus, into the femoral v. Small saphenous v.: lateral, past the lateral malleolus, into the popliteal v.","lo":"Explain regions drained by IVC tributaries.","note":"Great saphenous: medial malleolus. Small saphenous: lateral malleolus."},{"l":3,"t":"Leukocytes","q":"Emigration of a leukocyte means that it:","c":"Leaves the bloodstream to work in the tissues","w":["Moves through the blood toward a chemical signal","Engulfs and digests a pathogen in the tissues","Releases the contents of its granules"],"e":"Emigration = leaving the vessel. Chemotaxis = moving toward a chemical signal; phagocytosis = cell eating; degranulation = releasing granule contents.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Emigration = the leukocyte leaves the vessel."},{"l":3,"t":"Blood type","q":"A crossmatch shows no agglutination. What does that mean?","c":"The donor blood is safe to transfuse to that recipient","w":["The recipient has no plasma antibodies of any kind","The donor and recipient match for Rh type only","The donor's red cells must be washed before use"],"e":"A crossmatch mixes donor RBCs with recipient plasma. No agglutination means the recipient's antibodies don't attack the donor's cells, so the transfusion is safe.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","note":"No agglutination → safe to transfuse."},{"l":3,"t":"Thrombocytes","q":"In terms of how the blood behaves, thrombocytopenia and thrombocytosis are:","c":"Thin blood and thick blood","w":["Thick blood and thin blood","Low WBCs and high WBCs","Anemia and polycythemia"],"e":"Too few platelets (<150k/µL) means bleeding risk, “thin blood”; too many (>400k/µL) means spontaneous clotting risk, “thick blood” (though paradoxical bleeding can occur).","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytopenia = thin blood; thrombocytosis = thick blood."}];

ocardium]] and [[endocardium]]."},{"l":1,"t":"Heart basics","s":"The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."},{"l":1,"t":"Heart basics","s":"Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."},{"l":1,"t":"Heart basics","s":"Cells joined by gap junctions act as one, a [[functional syncytium]]."},{"l":1,"t":"Heart basics","s":"The [[chordae tendineae]] anchor the AV valve cusps to the [[papillary]] muscles."},{"l":1,"t":"Heart basics","s":"The right atrium receives blood from the [[superior]] and inferior venae cavae and the [[coronary sinus]]."},{"l":1,"t":"Heart basics","s":"The two semilunar valves are the [[pulmonary|pulmonic]] valve and the [[aortic]] valve."},{"l":1,"t":"External features","s":"The left border is also called the [[obtuse]] margin; the inferior border is the [[acute]] margin."},{"l":1,"t":"External features","s":"The right border of the heart is formed by the [[right atrium]]."},{"l":1,"t":"External features","s":"The base of the heart faces [[posteriorly|posterior]] and is formed mostly by the [[left atrium]]."},{"l":1,"t":"Internal features","s":"All four valves sit roughly in one plane, anchored by the [[fibrous skeleton]] of the heart, which lines up with the [[coronary]] sulcus."},{"l":1,"t":"Internal features","s":"The smooth posterior part of the right atrium is the [[sinus venarum]], separated from the pectinate part by the [[crista terminalis]]."},{"l":1,"t":"Internal features","s":"The [[fossa ovalis]] on the interatrial septum is the remnant of the fetal [[foramen ovale]]."},{"l":1,"t":"Internal features","s":"The septomarginal trabecula, or [[moderator band]], carries the [[right bundle branch|right bundle]]."},{"l":1,"t":"Internal features","s":"The RCA arises from the [[right]] aortic sinus; the sinus above the posterior cusp is the [[non-coronary|noncoronary|non coronary]] sinus."},{"l":1,"t":"Coronary arteries","s":"The SA nodal branch comes from the RCA about [[60]] percent of the time."},{"l":1,"t":"Coronary arteries","s":"The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."},{"l":1,"t":"Coronary arteries","s":"Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."},{"l":1,"t":"Coronary arteries","s":"The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery."},{"l":1,"t":"Cardiac veins","s":"The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch."},{"l":1,"t":"Cardiac veins","s":"Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium."},{"l":1,"t":"Cardiac veins","s":"Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium."},{"l":1,"t":"Conduction and control","s":"The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm."},{"l":1,"t":"Conduction and control","s":"The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm."},{"l":1,"t":"Conduction and control","s":"During [[isovolumetric]] ventricular contraction, all four valves are closed."},{"l":1,"t":"Conduction and control","s":"Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]]."},{"l":1,"t":"Conduction and control","s":"The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]]."},{"l":1,"t":"Conduction and control","s":"A resting rate under 60 bpm is [[bradycardia]]; over 100 bpm is [[tachycardia]]."},{"l":1,"t":"Auscultation","s":"S1 is heard when the [[AV|atrioventricular]] valves close; S2 when the [[semilunar]] valves close."},{"l":1,"t":"Auscultation","s":"The aortic valve is heard at the [[right]] 2nd intercostal space; the mitral valve at the left 5th intercostal space, [[midclavicular]] line."},{"l":1,"t":"Auscultation","s":"S3 is the [[Kentucky]] gallop; S4 is the [[Tennessee]] gallop."},{"l":2,"t":"Vessels and circulation","s":"The three layers of a vessel wall, from inside out, are the tunica [[interna|intima]], tunica [[media]] and tunica [[externa|adventitia]]."},{"l":2,"t":"Vessels and circulation","s":"Elastic arteries such as the aorta act as pressure [[reservoirs|reservoir]]; arterioles are [[resistance]] vessels; capillaries are [[exchange]] vessels."},{"l":2,"t":"Vessels and circulation","s":"Veins accompanying an artery and named for it are called venae [[comitantes]]."},{"l":2,"t":"Vessels and circulation","s":"A clot inside a vessel is a [[thrombus]]; when it travels and lodges elsewhere it is an [[embolism|embolus]].","note":"Embolus = a mobile thrombus."},{"l":2,"t":"Vessels and circulation","s":"The [[hypophyseal]] portal system connects the hypothalamus to the anterior pituitary; the renal portal system is [[arterial]]."},{"l":2,"t":"Aorta and branches","s":"The arch of the aorta sits at about [[T4]], and the abdominal aorta bifurcates into the common iliac arteries at about [[L4]]."},{"l":2,"t":"Aorta and branches","s":"The celiac trunk serves the [[foregut]], the superior mesenteric a. the [[midgut]], and the inferior mesenteric a. the [[hindgut]]."},{"l":2,"t":"Common carotid artery","s":"The [[maxillary]] artery supplies the deep face; the [[superficial temporal]] artery supplies the scalp."},{"l":2,"t":"Common carotid artery","s":"The [[vertebral]] arteries enter the skull through foramen magnum and supply the [[posterior]] brain."},{"l":2,"t":"Common carotid artery","s":"The common carotid ends by splitting into the internal and external carotids; the ophthalmic a., which supplies the orbit and forehead, is a branch of the [[internal carotid|internal carotid artery|ICA]].","note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common iliac artery","s":"The femoral artery becomes the popliteal artery at the [[adductor hiatus]]."},{"l":2,"t":"Common iliac artery","s":"The internal iliac artery has an [[anterior]] division serving pelvic viscera and perineum and a [[posterior]] division serving the posterior pelvic wall."},{"l":2,"t":"Subclavian artery and upper limb","s":"The parts of the subclavian artery are defined by the [[anterior scalene]] muscle; the parts of the axillary artery by [[pectoralis minor|pec minor]]."},{"l":2,"t":"Subclavian artery and upper limb","s":"The axillary artery becomes the brachial artery at [[teres major]]."},{"l":2,"t":"Subclavian artery and upper limb","s":"The radial artery feeds the [[deep]] palmar arch; the ulnar artery feeds the [[superficial]] palmar arch."},{"l":2,"t":"Subclavian artery and upper limb","s":"The [[Allen]] test checks for an anastomosis between the radial and [[ulnar]] arteries."},{"l":2,"t":"Superior vena cava","s":"Each brachiocephalic vein is formed by the [[internal jugular]] vein and the [[subclavian]] vein, which meet at the venous angle."},{"l":2,"t":"Superior vena cava","s":"The [[basilic]] vein joins the brachial veins to form the axillary vein; the [[cephalic]] vein drains into the axillary vein later."},{"l":2,"t":"Inferior vena cava","s":"The IVC passes through the diaphragm at about [[T8]], the esophagus at [[T10]], and the aorta at [[T12]]."},{"l":2,"t":"Inferior vena cava","s":"The left gonadal vein drains into the left [[renal]] vein; the right gonadal vein drains directly into the [[IVC|inferior vena cava]]."},{"l":2,"t":"Hepatic portal system","s":"The hepatic portal vein is formed by the [[superior mesenteric]] vein and the [[splenic]] vein."},{"l":2,"t":"Hepatic portal system","s":"Blood leaves the liver sinusoids through the [[hepatic]] veins into the [[IVC|inferior vena cava]]."},{"l":3,"t":"Introduction to blood","s":"Whole blood is about [[55]]% plasma and [[45]]% formed elements."},{"l":3,"t":"Introduction to blood","s":"Blood pH is kept between [[7.35]] and [[7.45]]; below that is acidemia and above it is alkalemia."},{"l":3,"t":"Introduction to blood","s":"In acidemia the lungs [[hyperventilate]] to blow off CO2; in alkalemia they [[hypoventilate]] to retain it.","note":"Hyperventilation moves more gas through the lungs; hypoventilation decreases gas exchange."},{"l":3,"t":"Introduction to blood","s":"The [[lungs]] adjust blood pH quickly; the [[kidneys]] adjust it slowly."},{"l":3,"t":"Blood plasma","s":"[[Albumins|Albumin]] maintain oncotic pressure; [[fibrinogens|fibrinogen]] are needed for clotting."},{"l":3,"t":"Blood plasma","s":"Gamma globulins are also called [[immunoglobulins|antibodies]]."},{"l":3,"t":"Formed elements","s":"Leukocytes from most to least abundant: neutrophils, [[lymphocytes]], [[monocytes]], eosinophils, basophils.","note":"Never Let Monkeys Eat Bananas."},{"l":3,"t":"Formed elements","s":"[[Lymphoid]] stem cells give rise to T cells, B cells and natural killer cells; [[myeloid]] stem cells give rise to nearly everything else.","note":"Lymphoid stem cells become lymphocytes, which release antibodies."},{"l":3,"t":"Formed elements","s":"[[Erythropoietin|EPO]] stimulates red blood cell production; [[thrombopoietin|TPO]] stimulates platelet production."},{"l":3,"t":"Erythrocytes","s":"Erythrocytes are [[biconcave]] discs that lack a [[nucleus]] and mitochondria."},{"l":3,"t":"Erythrocytes","s":"Hematocrit below the normal range is [[anemia]]; above it is [[polycythemia]]."},{"l":3,"t":"Hemoglobin","s":"Adult hemoglobin A is [[2α2β|2 alpha 2 beta|2a2b]]; fetal hemoglobin is [[2α2γ|2 alpha 2 gamma|2a2g]]."},{"l":3,"t":"Hemoglobin","s":"Low oxygen in the blood is [[hypoxemia]]; low oxygen in the tissues is [[hypoxia]]."},{"l":3,"t":"Hemoglobin","s":"Hemoglobin's affinity for carbon monoxide is about [[240]] const STOP=new Set(['the','of','n','nn','nerve','nerves','a','artery','an','cn']);
const ROMAN={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12};
function norm(s){
  return s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w))
    .map(w=>ROMAN[w]?String(ROMAN[w]):w).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const OPP=[['afferent','efferent'],['medial','lateral'],['anterior','posterior'],['superior','inferior'],['dorsal','ventral'],['flexor','extensor'],['ipsilateral','contralateral'],['left','right'],['presynaptic','postsynaptic'],['sensory','motor'],['cranial','caudal'],['internal','external'],['internum','externum'],['epineurium','perineurium','endoneurium'],['gyri','gyru','sulci','sulcu'],['proximal','distal'],['maxillary','mandibular'],['monosynaptic','polysynaptic'],['cervical','sacral'],['periosteal','meningeal'],['gracili','cuneatu']];
function opposite(a,b){const A=a.split(' '),B=b.split(' ');for(let i=0;i<Math.min(A.length,B.length);i++){if(A[i]===B[i])continue;if(OPP.some(g=>g.includes(A[i])&&g.includes(B[i])))return true;
  if(OPP.some(g=>g.some(w=>A[i].startsWith(w.slice(0,5)))&&g.some(w=>B[i].startsWith(w.slice(0,5)))&&A[i].slice(0,3)!==B[i].slice(0,3)))return true}return false}
function grade(input,ans,others){
  const base=ans.a, opts=[base, base.replace(/\s*\(.*?\)\s*/g,' '), ...((base.match(/\((.*?)\)/)||[])[1]?[base.match(/\((.*?)\)/)[1]]:[]), ...ans.alt];
  const v=norm(input);
  if(!v){if(!input.trim())return 'empty';const raw=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim();return opts.map(raw).includes(raw(input))?'ok':'no'}
  const N=opts.map(norm).filter(Boolean);
  if(N.includes(v))return 'ok';
  if(others.some(o=>[o.a,o.a.replace(/\s*\(.*?\)\s*/g,' '),...o.alt].map(norm).includes(v)))return 'no';
  for(const t of N){const d=lev(v,t);if(d<=(t.length>7?2:t.length>4?1:0)&&!opposite(v,t))return 'near';}
  return 'no';
}

/* ---------- flashcards ---------- */
function wc(s){return s.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).length}
function kind(a){
  const s=a.trim();
  if(/\(CN [IVX]+\)$/.test(s)||/ n\.$/.test(s)||/\bnerves?\b/i.test(s)&&wc(s)<=4)return 'Nerve name';
  if(/ a\.$/.test(s)||/\barter(y|ies)\b/i.test(s)&&wc(s)<=5)return 'Artery name';
  if(/^\d+$/.test(s))return 'A number';
  if(/^[CTLS]\d/.test(s))return 'Spinal level(s)';
  if(/^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)(, | and |$)/.test(s))return 'Cranial nerve number(s)';
  if(/\blobes?\b/i.test(s)&&wc(s)<=3)return 'Lobe';
  if(/\b(sulcus|fissure|gyrus|gyri|lobule)\b/i.test(s)&&wc(s)<=4)return 'Brain landmark';
  if(/\b(ventricle|aqueduct|foramen|canal)\b/i.test(s)&&wc(s)<=5)return 'Part of the ventricular system';
  if(/\b(sinus|falx|tentorium|confluens)\b/i.test(s)&&wc(s)<=4)return 'Dural fold or sinus';
  if(/(cells?|cytes?|glia|neurons?)$/i.test(s)&&wc(s)<=4)return 'Cell type';
  if(/(mater|neurium)$/i.test(s)&&wc(s)<=3)return 'Covering layer';
  return null;
}
function fmtHint(c){
  if(c.type==='l'){const k=kind(c.a.a);const n=wc(c.a.a);return (k||'Structure name')+' · '+n+' word'+(n>1?'s':'')}
  if(c.type==='m')return 'Give each: '+c.m.f.map(x=>x[0]).join(' · ');
  if(c.type==='b'){const ws=c.b.answers.map(a=>wc(a.a));return c.b.answers.length+' blank'+(c.b.answers.length>1?'s':'')+' · '+ws.map(w=>w+' word'+(w>1?'s':'')).join(', ')}
  const q=c.q, ans=q.c;
  if(Array.isArray(ans))return 'List '+ans.length+' items';
  if(/full profile of CN/.test(q.q))return 'Name · modality (sensory / motor / mixed) · targets · brain stem attachment';
  if(ans.includes('→')&&/\. [A-Z]/.test(ans))return 'Order of the layers, then their functions';
  if(ans.includes('→'))return 'Sequence of '+(ans.split('→').length)+' steps, in order';
  const segs=ans.split(' · ');
  if(segs.length>1){const labs=segs.map(s=>{const m=s.match(/^([^:]{1,25}):/);return m?m[1].trim():null});
    if(labs.every(Boolean))return 'Give each: '+labs.join(' · ');
    return segs.length+' parts';}
  const k=kind(ans); if(k)return k+(wc(ans)>1?' · '+wc(ans)+' words':'');
  const n=wc(ans);
  if(n<=4)return 'Short answer · '+n+' word'+(n>1?'s':'');
  return 'One-sentence description';
}
const needsChoices=q=>/\bNOT\b|EXCEPT/.test(q.q);

let fc={src:'missed',deck:[],i:0,got:0};
function buildDeck(src){
  const inLec=l=>!st.lec||l===st.lec, cards=[];
  QUESTIONS.forEach(q=>{if(!inLec(q.l))return;const k=qKey(q);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(k)))cards.push({type:'q',q,key:k})});
  BL.forEach(b=>{if(!inLec(b.l))return;if(src==='all'||(src==='missed'&&missed.has(b.key))||(src==='flagged'&&flags.has(b.key)))cards.push({type:'b',b,key:b.key})});
  MUSCLES.forEach(m=>{if(!inLec(m.l))return;if(src==='all'||src==='muscles')cards.push({type:'m',m,key:m.key})});
  FIGS.forEach(f=>{if(!inLec(f.lec))return;f.answers.forEach(a=>{const k=lKey(f,a);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(fKey(f))))cards.push({type:'l',f,a,key:k})})});
  return cards;
}
function cardFromKey(k){
  if(k.startsWith('m:')){const m=MUSCLES.find(x=>x.key===k);return m?{type:'m',m,key:k}:null}
  if(k.startsWith('b:')){const b=BLBY.get(k);return b?{type:'b',b,key:k}:null}
  if(k.startsWith('l:')){const [img,n]=k.slice(2).split('|');const f=FBY.get(img);const a=f&&f.answers.find(x=>String(x.n)===n);return a?{type:'l',f,a,key:k}:null}
  const q=QBY().get(k);return q?{type:'q',q,key:k}:null;
}
function saveFC(){putSess('fc',{deck:fc.deck.map(c=>c.key),i:fc.i,got:fc.got,flipped:!!fc.flipped});try{localStorage.setItem('cardio-v2-fcsrc',fc.src)}catch(e){}}
function startFC(src,fresh){
  if(src)fc.src=src;
  if(!fresh){const s=getSess('fc');
    if(s&&s.deck){const deck=s.deck.map(cardFromKey).filter(Boolean);
      if(deck.length){fc={src:fc.src,deck,i:Math.min(s.i,deck.length),got:s.got,flipped:s.flipped};renderFC(true);return}}}
  fc={src:fc.src,deck:shuffle(buildDeck(fc.src)),i:0,got:0,flipped:false};
  renderFC();
}
try{const s=localStorage.getItem('cardio-v2-fcsrc');if(s)fc.src=s}catch(e){}
function srcChips(){
  const n=s=>buildDeck(s).length;
  return `<div class="src" role="group" aria-label="Deck">
   <button class="chip" data-src="missed" aria-pressed="${fc.src==='missed'}">Missed (${n('missed')})</button>
   <button class="chip" data-src="flagged" aria-pressed="${fc.src==='flagged'}">Flagged (${n('flagged')})</button>
   ${MUSCLES.length?`<button class="chip" data-src="muscles" aria-pressed="${fc.src==='muscles'}">Muscles (${n('muscles')})</button>`:''}
   <button class="chip" data-src="all" aria-pressed="${fc.src==='all'}">Everything (${n('all')})</button></div>`;
}
function wireSrc(){view.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>startFC(b.dataset.src))}
function renderFC(replay){
  const n=fc.deck.length, left=n-fc.i;
  if(!replay)fc.flipped=false;
  saveFC();
  if(!n){
    const msg=fc.src==='missed'?'Every question you miss, and every fill-in sentence you miss on its first check, lands here automatically.'
      :fc.src==='flagged'?'Tap Flag on a question or sentence and it shows up here.':'Nothing in this lecture.';
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>${fc.src==='missed'?'No misses yet':'Nothing here yet'}</h2><p>${msg}</p><div class="nav" style="justify-content:center"><button class="btn primary" id="goall">Study everything instead</button></div></div>`;
    wireSrc();$('#goall').onclick=()=>startFC('all');return;
  }
  if(fc.i>=n){
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>Deck done</h2><p>${fc.got} card${fc.got===1?'':'s'} marked "Got it"${fc.src==='missed'?' and removed from your misses':''}.</p><div class="nav" style="justify-content:center"><button class="btn primary" id="again">Go again</button></div></div>`;
    wireSrc();$('#again').onclick=()=>startFC(null,true);return;
  }
  const c=fc.deck[fc.i];
  let front,back,tag;
  if(c.type==='m'){tag=LECT[c.m.l]+' · '+esc(c.m.g)+' · muscle';front=`<div class="front">${esc(c.m.n)}</div>`;
    back=c.m.f.map(([k,v])=>`<div class="why"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');}
  else if(c.type==='b'){tag=LECT[c.b.l]+' · '+esc(c.b.t)+' · fill in '+saidBadge(c.b);
    front=`<div class="front" style="font-weight:500">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'_____').join('')}</div>`;
    back=`<div class="why filled" style="font-size:1.05rem">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'<b>'+esc(c.b.answers[sg.blank-1].a)+'</b>').join('')}</div>`;}
  else if(c.type==='q'){tag=LECT[c.q.l]+' · '+esc(c.q.t)+' '+saidBadge(c.q);front=(c.q.lo?`<p class="lo"><b>Objective:</b> ${esc(c.q.lo)}</p>`:'')+`<div class="front">${esc(c.q.q)}</div>`;
    if(needsChoices(c.q)){const ch=shuffle([...(Array.isArray(c.q.c)?c.q.c:[c.q.c]),...c.q.w]);front+=`<ol class="choices" type="A">${ch.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`;}
    back=(Array.isArray(c.q.c)?`<ul class="ans-list">${c.q.c.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:`<div class="ans">${esc(c.q.c)}</div>`)+`<div class="why">${esc(c.q.e)}</div>`+saidNote(c.q);
  }
  else{tag=LECT[c.f.lec]+' · '+esc(c.f.title);front=`<div class="front">What is structure <span class="num" style="display:inline-grid;vertical-align:middle;margin:0 2px">${c.a.n}</span>?</div>
    <div class="plate"><img src="${IMG[c.f.img]}" alt="${esc(c.f.title)}" style="cursor:pointer"></div><div><button class="btn" id="fczoom" style="padding:6px 12px;font-size:.82rem">Enlarge image</button></div>`;
    back=`<div class="ans">${esc(c.a.a)}</div>`;}
  view.innerHTML=srcChips()+`<div class="meta"><span>Card ${fc.i+1} of ${n} · ${restartBtn}</span><span class="score">${left} left · <b>${fc.got}</b> got it</span></div>
  <div class="progress"><i style="width:${fc.i/n*100}%"></i></div>
  <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card"><span class="tag">${tag}</span>${front}
   <div class="fmt"><span class="fl">Answer format</span><span>${esc(fmtHint(c))}</span></div>
   <div class="back" id="back" hidden>${back}</div><div class="tapnote" id="tapnote">Tap the card to see the answer</div></div>
  <div class="nav"><button class="btn" id="fcback" ${fc.i?'':'disabled'}>Back</button><span class="spacer"></span><span id="rate" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn again" id="again">Still learning</button><button class="btn got" id="got">Got it</button></span></div>`;
  wireSrc(); $('#restart').onclick=()=>startFC(null,true);
  const show=()=>{$('#back').hidden=false;$('#tapnote').hidden=true;$('#rate').hidden=false};
  const flip=()=>{if(fc.flipped)return;fc.flipped=true;show();saveFC()};
  if(replay&&fc.flipped)show();
  $('#flash').onclick=e=>{if(e.target.id==='fczoom'){e.stopPropagation();$('#zimg').src=IMG[c.f.img];$('#zoom').hidden=false;return}flip()};
  $('#flash').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const next=()=>{fc.i++;renderFC();window.scrollTo({top:0})};
  $('#fcback').onclick=()=>{fc.i--;renderFC();window.scrollTo({top:0})};
  $('#got').onclick=()=>{fc.got++;if(fc.src==='missed'){missed.delete(c.key);saveMissed()}next()};
  $('#again').onclick=()=>{const pos=Math.min(fc.deck.length,fc.i+4);fc.deck.splice(pos,0,c);next()};
}

/* ---------- controls ---------- */
function sync(){
  if(!FIGS.length&&st.mode==='id')st.mode='mcq';
  $('#m-mcq').setAttribute('aria-pressed',st.mode==='mcq');$('#m-id').setAttribute('aria-pressed',st.mode==='id');$('#m-fb').setAttribute('aria-pressed',st.mode==='fb');$('#m-fc').setAttribute('aria-pressed',st.mode==='fc');
  $('#fchip').hidden=st.mode==='fc'; if(st.mode==='fc')st.flagOnly=false;
  document.querySelectorAll('.chip[data-l]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.l===st.lec));
  {const sel=document.querySelector('.chip[data-l][aria-pressed="true"]'),row=$('#chips');if(sel&&row.scrollWidth>row.clientWidth)row.scrollLeft=Math.max(0,sel.offsetLeft-row.offsetLeft-16);}
  document.body.dataset.mode=st.mode; updateFchip(); save(); st.mode==='mcq'?startMCQ():st.mode==='id'?startID():st.mode==='fb'?startFB():startFC();
}
$('#m-mcq').onclick=()=>{st.mode='mcq';sync()};
$('#m-id').onclick=()=>{st.mode='id';sync()};
$('#m-fc').onclick=()=>{st.mode='fc';sync()};
$('#m-fb').onclick=()=>{st.mode='fb';sync()};
document.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{st.lec=+c.dataset.l;history.replaceState(null,'',st.lec?'#lecture-'+st.lec:location.pathname);sync()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#lecture-([1-6])$/);const n=m?+m[1]:0;if(n!==st.lec){st.lec=n;sync()}});
$('#fchip').onclick=()=>{st.flagOnly=!st.flagOnly;sync()};
sync();
})();
</script>
