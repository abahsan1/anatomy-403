Renal lobe","Renal segment","Collecting duct"],"e":"The nephron is the functional unit: it filters blood and makes urine. There are millions of them in each kidney (Urinary slides 6 and 28).","lo":"Outline the major structures of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"How do the kidneys help correct a low blood pH?","c":"They secrete H+ and conserve HCO3-","w":["They secrete HCO3- and conserve H+","They secrete glucose and conserve Na+","They release renin and secrete Ca2+","They release EPO to carry more CO2"],"e":"For pH the kidneys secrete protons and conserve bicarbonate. They are slower than the lungs to adjust blood pH, but they help (Urinary slide 4).","lo":"Describe the principal functions of the urinary system.","deep":true},{"l":5,"t":"Urinary structures & functions","q":"Which hormone made in the kidneys raises blood calcium?","c":"Calcitriol","w":["Erythropoietin","Renin","Aldosterone","Vasopressin"],"e":"Calcitriol, the active form of vitamin D, is made by cells of the proximal convoluted tubules. It lets the gut absorb calcium, which raises blood Ca2+ (Urinary slide 5).","lo":"Describe the principal functions of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"Which kidney hormone drives red blood cell production?","c":"Erythropoietin","w":["Calcitriol","Renin","Angiotensin II","Aldosterone"],"e":"Peritubular cells of the kidney make erythropoietin (EPO), which drives erythrocyte production (Urinary slide 5).","lo":"Describe the principal functions of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"Glucose shows up in a person's urine. What does this usually mean?","c":"Something is off, since healthy kidneys clear no glucose","w":["Nothing; healthy kidneys excrete some glucose daily","The kidneys are making extra glucose from glutamine","The PCT is reabsorbing more glucose than usual","The bladder wall is secreting glucose into urine"],"e":"Normal renal clearance of glucose is zero, because all of it is reabsorbed. Glucose in the urine points to dysregulation of blood glucose. The kidneys make only a little glucose by gluconeogenesis, mostly during prolonged fasting (Urinary slide 4; Structures & Functions video).","lo":"Describe the principal functions of the urinary system.","deep":true},{"l":5,"t":"Urinary structures & functions","q":"Which list contains only functions of the urinary system?","c":"Fluid balance, waste excretion, hormone production","w":["Fluid balance, bile production, hormone production","Waste excretion, red cell storage, fluid balance","Hormone production, protein digestion, waste excretion","Gas exchange, fluid balance, waste excretion"],"e":"The three big functions: maintaining extracellular volume and osmolarity (ions, pH, water, glucose), excretion (catabolic wastes and drugs), and endocrine (calcitriol, EPO, renin) (Urinary slides 4 and 5).","lo":"Describe the principal functions of the urinary system.","deep":true},{"l":5,"t":"Urinary structures & functions","q":"How does the RAA pathway begin?","c":"Juxtaglomerular cells secrete renin","w":["The adrenal cortex releases aldosterone","The lungs release ACE into the blood","The liver releases angiotensin II","The hypothalamus releases vasopressin"],"e":"The RAA pathway starts in the kidneys when juxtaglomerular cells secrete renin, which raises blood pressure further along the pathway (Urinary slide 5).","lo":"Describe the principal functions of the urinary system.","said":"Dr. Fox: 'I don't expect you to know every single detail of it, but know that this RAA pathway starts with the secretion of renin in the kidneys.'","note":"Your slide note: juxtaglomerular cells secrete renin."},{"l":5,"t":"Urinary structures & functions","q":"Select ALL hormones the kidneys themselves produce.","c":["Calcitriol","Erythropoietin","Renin"],"w":["Aldosterone","Vasopressin"],"e":"The kidneys' endocrine products are calcitriol (PCT cells), erythropoietin (peritubular cells) and renin (juxtaglomerular cells). Aldosterone comes from the adrenal cortex and vasopressin from the hypothalamus (Urinary slides 5 and 44).","lo":"Describe the principal functions of the urinary system.","deep":true},{"l":5,"t":"Kidneys","q":"Which border of the kidney holds the hilum?","c":"Medial, concave border","w":["Lateral, convex border","Superior pole","Inferior pole","Lateral, concave border"],"e":"The kidney has a convex lateral border and a concave medial border, and the hilum sits on the medial border (Urinary slide 9).","lo":"Identify the borders and poles of the kidneys.","note":"Your slide note: lateral = convex; medial = concave."},{"l":5,"t":"Kidneys","q":"How is the kidney oriented on the posterior abdominal wall?","c":"Lateral border faces posterolaterally; hilum faces anteromedially","w":["Lateral border faces anterolaterally; hilum faces posteromedially","It lies flat, with the hilum facing straight anteriorly","Lateral border faces anteriorly; hilum faces posteriorly","It lies flat, with the hilum facing straight inferiorly"],"e":"The kidney is slightly canted in the paravertebral gutter: its lateral border faces posterolaterally and its medial border (with the hilum) faces anteromedially (Urinary slides 9 and 15; Kidneys video).","lo":"Identify the borders and poles of the kidneys.","deep":true},{"l":5,"t":"Kidneys","q":"What is an accessory renal artery that supplies a pole of the kidney called?","c":"Polar artery","w":["Segmental artery","Arcuate artery","Interlobar artery","Cortical radiate artery"],"e":"The kidney has superior and inferior poles, and accessory renal arteries that supply a pole are called polar arteries (Urinary slide 9).","lo":"Identify the borders and poles of the kidneys."},{"l":5,"t":"Kidneys","q":"Dissecting a donor, you find a second, smaller artery entering the left kidney beside the main renal artery. Based on lecture, how should you read this?","c":"A common variant: an accessory renal artery","w":["A rare anomaly seen in very few donors","A dissection error; kidneys get one artery","A renal vein branch mistaken for an artery","A gonadal artery that ends in the kidney"],"e":"Urinary slide 10 lists accessory renal arteries among the structures at the hilum, and slide 9 names the ones that supply a pole polar arteries. How common they are is something Dr. Fox says out loud in the Kidneys video, not on the slide: he says it twice, and adds that you may find them in anatomical donors. So a second artery at the hilum is an expected variant, not an error.","lo":"Outline the structures found at the hilum of the kidneys.","said":"Accessory renal arteries are quite common. (Kidneys video)"},{"l":5,"t":"Kidneys","q":"What structure found in the hilum of the kidney conveys urine to the ureter?","c":"Renal pelvis","w":["Cortical arch","Medulla","Pyramid","Renal column"],"e":"Major calices join to form the renal pelvis, which drains into the ureter at the hilum (Urinary slides 10 and 12).","lo":"Outline the structures found at the hilum of the kidneys.","said":"Dr. Fox's own check question at the end of the Kidneys video."},{"l":5,"t":"Kidneys","q":"Select ALL structures found at the hilum of the kidney.","c":["Renal vein","Renal artery","Renal pelvis","Renal plexus"],"w":["Renal papillae","Arcuate arteries"],"e":"At the hilum: the renal artery and vein, accessory renal arteries if present, the renal pelvis leading to the ureter, plus the renal plexus and lymphatics. Papillae and arcuate arteries are deep in the parenchyma (Urinary slide 10; Kidneys video).","lo":"Outline the structures found at the hilum of the kidneys.","deep":true},{"l":5,"t":"Kidneys","q":"What is a hilum?","c":"Where neurovasculature enters and leaves an organ","w":["Where the cortex dips between two pyramids","Where collecting ducts drain into calices","Where the ureter enters the bladder wall","Where the renal capsule is thickest"],"e":"A hilum is the region of an organ where neurovasculature enters and exits. In the kidney the renal pelvis leaves there too (Urinary slide 9).","lo":"Outline the structures found at the hilum of the kidneys.","note":"Your slide note: hilum = region where neurovasculature enters and exits."},{"l":5,"t":"Kidneys","q":"At the left renal hilum, which structure usually lies in front of the renal artery?","c":"Renal vein","w":["Renal pelvis","Ureter","Suprarenal gland","Renal plexus"],"e":"In Dr. Fox's dissection the large left renal vein is in front, and the renal artery is tucked behind it (Urinary slide 10; Kidneys video).","lo":"Outline the structures found at the hilum of the kidneys.","deep":true},{"l":5,"t":"Kidneys","q":"What is the parenchyma of an organ?","c":"Its metabolically active part","w":["Its connective tissue capsule","The fat packed around it","The space inside its hilum","The vessels that supply it"],"e":"Parenchyma is the metabolically active portion of an organ. In the kidney it is the cortex and medulla (Urinary slide 11).","lo":"Discuss the organization of the kidney parenchyma.","note":"Your slide note: metabolically active portion of organ."},{"l":5,"t":"Kidneys","q":"What are the parts of the cortex that sit between adjacent pyramids called?","c":"Renal columns","w":["Cortical arches","Renal papillae","Minor calices","Medullary rays"],"e":"The cortex has cortical arches (between the pyramid bases and the capsule) and renal columns (between neighbouring pyramids) (Urinary slide 11).","lo":"Discuss the organization of the kidney parenchyma."},{"l":5,"t":"Kidneys","q":"Which part of the cortex lies between the base of a pyramid and the renal capsule?","c":"Cortical arch","w":["Renal column","Renal papilla","Renal sinus","Minor calyx"],"e":"The base of each pyramid touches the cortical arch, and the sides of the pyramid touch the renal columns (Urinary slide 11; Kidneys video).","lo":"Discuss the organization of the kidney parenchyma."},{"l":5,"t":"Kidneys","q":"What is the apex of a renal pyramid called?","c":"Renal papilla","w":["Renal column","Cortical arch","Major calyx","Renal pelvis"],"e":"The medulla is organized into pyramids, and each pyramid's apex is a renal papilla, which is cupped by a minor calyx (Urinary slide 11).","lo":"Discuss the organization of the kidney parenchyma."},{"l":5,"t":"Kidneys","q":"Why does Dr. Fox call the renal papillae the 'point of no return'?","c":"Past them, filtrate has become urine and stays urine","w":["Past them, urine can flow back into the nephron","Before them, the blood has not yet been filtered","Past them, the ureter begins its abdominal part","Before them, no reabsorption has happened yet"],"e":"The papillae are the last point where collecting ducts drain into the minor calices, so they mark the clear border between filtrate proximally and urine distally (Urinary slides 11 and 50).","lo":"Discuss the organization of the kidney parenchyma.","deep":true,"note":"Your slide note: last point where collecting ducts drain into minor calices."},{"l":5,"t":"Kidneys","q":"Select ALL parts of the kidney parenchyma.","c":["Cortical arches","Renal columns","Pyramids","Renal papillae"],"w":["Renal pelvis","Major calices"],"e":"Parenchyma = cortex (cortical arches and renal columns) plus medulla (pyramids, whose apices are papillae). Calices and the pelvis are the excretory pathway, not parenchyma (Urinary slides 11 and 50).","lo":"Discuss the organization of the kidney parenchyma.","deep":true},{"l":5,"t":"Renal fascial spaces","q":"Which fascial space most closely surrounds the kidney?","c":"Perirenal space","w":["Pararenal space","Retroperitoneum","Subperitoneum","Peritoneal cavity"],"e":"From the kidney outward: renal capsule, perirenal fat (perirenal space), renal fascia, then the pararenal space, then the parietal peritoneum. The whole region is the retroperitoneum; the subperitoneum is below it in the pelvis (Urinary slides 16 and 17).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces.","said":"Dr. Fox's own check question. His trick: 'peri with an I is on the inside.'"},{"l":5,"t":"Renal fascial spaces","q":"Where do the kidneys sit relative to the peritoneum?","c":"Behind it, in the retroperitoneal space","w":["Within the peritoneal cavity, on a mesentery","Below it, in the subperitoneal space","In front of it, against the abdominal wall","Inside the visceral peritoneum of the liver"],"e":"Everything posterior to the parietal peritoneum is retroperitoneal, and that is where the kidneys lie. You must remove the gut and strip the peritoneum to see them (Urinary slide 16; Renal Fascial Spaces video).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal fascial spaces","q":"Which layer separates the perirenal space from the pararenal space?","c":"Renal (perirenal) fascia","w":["Parietal peritoneum","Renal capsule","Visceral peritoneum of the colon","Fat of the renal sinus"],"e":"The renal fascia divides the perirenal space (inside) from the pararenal space (outside, between the fascia and the peritoneum) (Urinary slide 16).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal fascial spaces","q":"Which kidney usually sits higher?","c":"The left kidney","w":["The right kidney","Neither; they sit level","Whichever is on the dominant side","The right, lifted by the liver"],"e":"The left kidney sits slightly higher than the right; the right sits lower (Urinary slide 15).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces.","note":"Your slide note: right kidney is lower."},{"l":5,"t":"Renal fascial spaces","q":"The hila of the kidneys lie at about which plane?","c":"Transpyloric plane (L1)","w":["Sternal angle plane (T4/T5)","Subcostal plane","Supracristal plane","Xiphisternal plane"],"e":"The renal hila, with the renal vessels and pelvis, lie near the transpyloric plane at about L1, where the pylorus of the stomach sits (Urinary slide 15).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal fascial spaces","q":"How can you approximate the transpyloric plane on a person?","c":"Midway between jugular notch and pubic symphysis","w":["Midway between xiphoid and umbilicus","At the level of the iliac crests","Midway between umbilicus and pubic symphysis","At the level of the sternal angle"],"e":"Take the midpoint between the jugular notch and the pubic symphysis. That approximates the transpyloric plane (L1), where the renal hila are (Urinary slide 15).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal fascial spaces","q":"What is the renal sinus?","c":"Perirenal space reaching into the hilum, around vessels and pelvis","w":["Pararenal space reaching around the front of the colon and liver","Peritoneal space reaching between the two kidneys at the midline","Subperitoneal space reaching down to the bladder","A cavity inside each pyramid that collects urine"],"e":"The perirenal space extends into the hilum as the renal sinus. The renal arteries and veins, their branches and the renal pelvis pass through it (Urinary slide 16; Renal Fascial Spaces video).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces.","deep":true},{"l":5,"t":"Renal fascial spaces","q":"After rapid weight loss, a patient has flank pain that eases when they lie flat. What is the likely cause?","c":"Lost perirenal fat lets the kidney drop and kink the ureter","w":["Lost pararenal fat lets the bladder press on the ureter","Lost peritoneum lets the colon compress the renal vein","The aorta presses on the left renal vein when standing","A stone lodges where the ureter enters the bladder"],"e":"Perirenal fat packs the kidney 'like packing peanuts'. When it is lost, gravity can pull the kidney down (nephroptosis), kinking the ureter so urine backs up. Lying flat takes away gravity and the kidney returns toward L1 (Urinary slide 16; Renal Fascial Spaces video).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces.","deep":true},{"l":5,"t":"Renal fascial spaces","q":"What does the renal fascia enclose?","c":"Kidney, suprarenal gland and ureter, like an inverted cone","w":["Only the kidney itself, like a tight second renal capsule","Only the renal vessels, like a sleeve around the hilum","Both kidneys and the aorta, in one sheet","The kidney and the colon, like an open bag"],"e":"The renal fascia is like an inverted cone: its base is high up, and it holds the kidney, suprarenal gland and the urine pathways, with its apex at the pelvic brim (Urinary slide 16; Renal Fascial Spaces video).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces.","deep":true},{"l":5,"t":"Renal fascial spaces","q":"Why can the kidneys shift position slightly?","c":"The diaphragm moves them during breathing","w":["The heart pushes them with each beat","The ureters pull on them as they fill","The bladder tugs on them when full","The colon pushes them during digestion"],"e":"Even though they are wrapped in fascia and fat, the kidneys move with respiration as the diaphragm is displaced, and gravity acts on them too (Urinary slide 15).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal fascial spaces","q":"In which recesses do the kidneys lie?","c":"Paravertebral gutters","w":["Paracolic gutters","Rectouterine pouches","Hepatorenal recesses","Subphrenic spaces"],"e":"The aorta and IVC sit anteriorly with the vertebral column behind them, leaving paravertebral gutters on each side where the kidneys lie (Urinary slide 15).","lo":"Describe the relative positions of the kidneys within the retroperitoneal space, with an emphasis on the perirenal and pararenal spaces."},{"l":5,"t":"Renal vasculature","q":"How many renal segments are there typically, and what defines them?","c":"Five, each defined by a segmental artery","w":["Five, each defined by a major calyx","Two, each defined by a renal vein","Ten, each defined by a pyramid","Three, each defined by a pole"],"e":"Five segments (apical, anterior superior, anterior inferior, inferior, posterior), each defined by its own segmental artery. That is the typical pattern; more or fewer is possible (Urinary slide 20).","lo":"Describe the segments of the kidneys and their blood supply."},{"l":5,"t":"Renal vasculature","q":"Why can a surgeon remove one renal segment without harming the others?","c":"Segmental arteries are end arteries that don't anastomose","w":["Segmental veins are end veins that don't anastomose","Each segment has its own ureter draining it","Segmental arteries anastomose, so others take over","Each segment has its own renal plexus"],"e":"Segmental arteries do not anastomose, so each segment has its own blood supply and a partial nephrectomy is possible (Urinary slide 20).","lo":"Describe the segments of the kidneys and their blood supply.","deep":true,"note":"Your slide note: can remove a renal segment."},{"l":5,"t":"Renal vasculature","q":"Dr. Fox compares renal segments to which other segments?","c":"Bronchopulmonary segments of the lung","w":["Lobules of the thymus in the chest","Haustra of the colon","Lobes of the thyroid gland in the neck","Lobules of the breast"],"e":"Like bronchopulmonary segments, renal segments have their own arterial supply and can be removed alone, while the veins (pulmonary or intrarenal) anastomose (Urinary slide 20; Renal Vasculature video).","lo":"Describe the segments of the kidneys and their blood supply.","note":"Your slide note: same as pulmonary veins."},{"l":5,"t":"Renal vasculature","q":"The intrarenal veins anastomose. Why isn't that a problem for a partial nephrectomy?","c":"Venous pressure is low, so they are easy to ligate","w":["The veins drain into the ureter instead of the IVC","Each vein is an end vein with no links to others","The veins regrow into the removed segment","Venous blood bypasses the kidney entirely"],"e":"On the venous side blood pressure is very low, so the anastomosing intrarenal veins are easy to tie off (Urinary slide 20; Renal Vasculature video).","lo":"Describe the segments of the kidneys and their blood supply.","deep":true},{"l":5,"t":"Renal vasculature","q":"What is a renal lobe?","c":"A pyramid plus its surrounding cortex","w":["A cortical arch around one medullary ray","A segment supplied by one segmental artery","A major calyx and its minor calices","A renal column between two pyramids"],"e":"Lobe = one renal pyramid (medulla) plus the cortex around it (Urinary slide 21).","lo":"Define lobes and lobules of the kidney."},{"l":5,"t":"Renal vasculature","q":"What is a renal lobule?","c":"A cortical arch around one medullary ray","w":["A pyramid plus its surrounding cortex","A segment supplied by one segmental artery","A minor calyx and its single papilla","A renal column between two pyramids"],"e":"Lobule = the bit of cortical arch around a single medullary ray, which you can see with light microscopy. It lies between two cortical radiate (interlobular) arteries (Urinary slide 21; Renal Vasculature video).","lo":"Define lobes and lobules of the kidney."},{"l":5,"t":"Renal vasculature","q":"Why are cortical radiate arteries also called interlobular arteries?","c":"They run between lobules","w":["They run between lobes","They run between pyramids","They run between segments","They run between calices"],"e":"Cortical radiate is the anatomical name (they radiate into the cortex). Interlobular, used mostly by histologists, refers to their running between lobules (Urinary slides 21 and 22).","lo":"Define lobes and lobules of the kidney.","deep":true},{"l":5,"t":"Renal vasculature","q":"What is the order of branching of the renal artery?","c":"Segmental, interlobar, arcuate, cortical radiate, afferent arteriole","w":["Segmental, arcuate, interlobar, cortical radiate, afferent arteriole","Interlobar, segmental, arcuate, cortical radiate, afferent arteriole","Segmental, interlobar, cortical radiate, arcuate, efferent arteriole","Arcuate, interlobar, segmental, cortical radiate, afferent arteriole"],"e":"Renal a. at L1 to the hilum, then segmental, interlobar (beside renal columns), arcuate (around pyramid bases), cortical radiate (from interlobar and arcuate), afferent arterioles, glomeruli (Urinary slide 22).","lo":"Outline the branches of the renal arteries.","deep":true},{"l":5,"t":"Renal vasculature","q":"Which part of the parenchyma of the kidney is adjacent to the arcuate arteries?","c":"Cortical arch","w":["Pyramid","Renal pelvis","Renal column","Renal sinus"],"e":"Arcuate arteries run between the medulla and the cortical arch. 'Pyramid' is too general, because pyramids border both interlobar and arcuate arteries (Urinary slides 22 and 25).","lo":"Outline the branches of the renal arteries.","said":"Dr. Fox's own check question: 'a pyramid is a little too general... it's not specific enough.'","note":"Your slide note: arcuate = between medulla and cortical arch."},{"l":5,"t":"Renal vasculature","q":"Where do the interlobar arteries run?","c":"Between the medulla and the renal columns","w":["Between the medulla and the cortical arch","Within the renal papillae","Around the minor calices","Along the renal capsule"],"e":"Interlobar arteries are between the medulla and the renal columns. When they turn to wrap around the base of a pyramid they become arcuate arteries (Urinary slide 22).","lo":"Outline the branches of the renal arteries.","note":"Your slide note: interlobar = between medulla and renal column."},{"l":5,"t":"Renal vasculature","q":"What do afferent arterioles carry blood into?","c":"Glomeruli","w":["Peritubular capillaries","Vasa recta","Arcuate veins","Collecting ducts"],"e":"Cortical radiate arteries give off afferent arterioles, which feed the glomeruli, the specialized capillary beds where blood is filtered (Urinary slide 22).","lo":"Outline the branches of the renal arteries.","note":"Your slide note: glomeruli = specialized kidney capillary beds."},{"l":5,"t":"Renal vasculature","q":"Select ALL correctly matched renal arteries.","c":["Interlobar a.: medulla and renal column","Arcuate a.: medulla and cortical arch","Cortical radiate aa.: out into the cortex","Segmental a.: defines a renal segment"],"w":["Arcuate a.: medulla and renal column","Afferent arteriole: drains the glomerulus"],"e":"Interlobar runs beside renal columns, arcuate runs along the cortical arch, cortical radiate radiates into the cortex and segmental defines a segment. The efferent arteriole, not the afferent, drains the glomerulus (Urinary slides 20, 22 and 23).","lo":"Outline the branches of the renal arteries.","deep":true},{"l":5,"t":"Renal vasculature","q":"What makes the renal circulation a portal system?","c":"Two capillary beds in series, linked by efferent arterioles","w":["Two venous beds in series, linked by the renal veins","Gut blood passing through the kidney before the liver","Glomeruli draining straight into the IVC","Filtrate returning to the arcuate veins"],"e":"A portal system connects two capillary beds. Blood goes afferent arteriole, glomerulus, efferent arteriole, then a second bed: peritubular capillaries and vasa recta, then venules (Urinary slide 23).","lo":"Discuss the renal portal system.","deep":true},{"l":5,"t":"Renal vasculature","q":"Where do the efferent arterioles carry blood?","c":"Peritubular capillaries and vasa recta","w":["Glomeruli and arcuate arteries","Cortical radiate and interlobar arteries","Collecting ducts and minor calices","Segmental and interlobar veins"],"e":"Efferent arterioles leave the glomerulus and feed the peritubular capillaries around the tubules and the vasa recta along the nephron loop (Urinary slide 23).","lo":"Discuss the renal portal system."},{"l":5,"t":"Renal vasculature","q":"Which pairing of renal capillary and job is correct?","c":"Vasa recta: pull reabsorbed water from the medulla","w":["Glomerulus: tubular reabsorption of salts","Peritubular capillaries: glomerular filtration","Vasa recta: filtering blood into filtrate","Glomerulus: tubular secretion of ammonia"],"e":"Glomeruli do filtration. Peritubular capillaries take part in tubular secretion and reabsorption. Vasa recta, along the nephron loop, return water from the medulla to the blood (Urinary slides 23 and 32).","lo":"Discuss the renal portal system.","deep":true},{"l":5,"t":"Renal vasculature","q":"Why is the left renal vein much longer than the right?","c":"It must cross the abdominal aorta to reach the IVC","w":["It must pass behind the IVC to reach the aorta","It must loop around the left ureter first","It drains the spleen before reaching the IVC","It runs up to the diaphragm before turning"],"e":"The IVC is on the right, so the right renal vein is short. The left renal vein has to get over the abdominal aorta, which makes it about three times longer (Urinary slide 24).","lo":"Discuss left renal vein entrapment syndrome, with an emphasis of tributaries of the left renal vein and the tissues they serve.","deep":true,"note":"Your slide note: right drains to IVC directly; left has to get over the abdominal aorta."},{"l":5,"t":"Renal vasculature","q":"Select ALL tributaries of the left renal vein.","c":["Left gonadal v.","Left suprarenal v.","Left inferior phrenic v."],"w":["Right gonadal v.","Superior mesenteric v."],"e":"The left renal vein drains the left gonad, left suprarenal gland and left hemidiaphragm. On the right, these veins drain straight into the IVC (Urinary slide 24).","lo":"Discuss left renal vein entrapment syndrome, with an emphasis of tributaries of the left renal vein and the tissues they serve."},{"l":5,"t":"Renal vasculature","q":"Which two arteries can compress the left renal vein in nutcracker syndrome?","c":"Superior mesenteric artery and aorta","w":["Inferior mesenteric artery and aorta","Celiac trunk and splenic artery","Left gonadal artery and aorta","Left renal artery and common iliac"],"e":"The left renal vein passes between the SMA in front and the aorta behind. An abdominal aortic aneurysm can squeeze it there: left renal vein entrapment, or nutcracker, syndrome (Urinary slide 24; Renal Vasculature video).","lo":"Discuss left renal vein entrapment syndrome, with an emphasis of tributaries of the left renal vein and the tissues they serve."},{"l":5,"t":"Renal vasculature","q":"A man has hematuria, left flank pain and a left-sided varicocele. Why only the left side?","c":"The left gonadal vein drains into the trapped left renal vein","w":["The left gonadal vein drains into the IVC directly","The left testis is supplied by the left renal artery","The left ureter compresses the left gonadal vein","The right gonadal vein drains into the left renal vein"],"e":"When the left renal vein is entrapped, blood backs up from everything that drains into it: left kidney (hematuria, flank pain), left gonad (varicocele, the swollen scrotal veins), left suprarenal gland and left hemidiaphragm. The right-side veins go straight to the IVC (Urinary slide 24).","lo":"Discuss left renal vein entrapment syndrome, with an emphasis of tributaries of the left renal vein and the tissues they serve.","deep":true,"note":"Your slide note: varicocele = expansion of scrotal vein."},{"l":5,"t":"Renal vasculature","q":"Where do the right gonadal, suprarenal and inferior phrenic veins drain?","c":"Directly into the IVC","w":["Into the right renal vein","Into the left renal vein","Into the hepatic portal vein","Into the right common iliac vein"],"e":"This is the asymmetry behind entrapment syndrome: on the left these veins join the left renal vein, on the right they go directly to the IVC (Urinary slide 24; Renal Vasculature video).","lo":"Discuss left renal vein entrapment syndrome, with an emphasis of tributaries of the left renal vein and the tissues they serve."},{"l":5,"t":"Nephrons","q":"What are the two main portions of a nephron?","c":"Renal corpuscle and tubules","w":["Cortex and medulla","Calices and renal pelvis","Pyramid and renal column","Glomerulus and vasa recta"],"e":"A nephron is a renal corpuscle (glomerulus plus glomerular capsule) and its tubules, which drain into collecting ducts (Urinary slide 28).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption."},{"l":5,"t":"Nephrons","q":"What does glomerular filtration do?","c":"Turns blood into filtrate","w":["Turns filtrate into urine","Returns filtrate to the blood","Moves wastes from blood into tubules","Concentrates urine in the medulla"],"e":"Glomerular filtration converts blood in the glomerulus into filtrate, collected by the capsule. Its rate is the GFR. Secretion and reabsorption then refine filtrate into urine (Urinary slides 28 and 29).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption."},{"l":5,"t":"Nephrons","q":"Which way does tubular secretion move materials?","c":"From peritubular capillaries into the tubules","w":["From the tubules into peritubular capillaries","From the glomerulus into the capsule","From collecting ducts into the calices","From the vasa recta into the cortex"],"e":"Secretion moves material from the blood (peritubular capillaries) into the tubules. Reabsorption is the reverse: filtrate back into the blood (Urinary slide 28).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption.","note":"Your slide note: secretion = peritubular capillaries to tubules."},{"l":5,"t":"Nephrons","q":"What is tubular reabsorption?","c":"Reclaiming materials from filtrate into the blood","w":["Moving materials from blood into the filtrate","Converting blood into filtrate at the glomerulus","Sending urine from papillae into the calices","Storing filtrate inside the collecting ducts"],"e":"Reabsorption reclaims material from the filtrate back into the cardiovascular system via the peritubular capillaries (Urinary slide 28).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption.","note":"Your slide note: reabsorb materials from filtrate into peritubular capillaries."},{"l":5,"t":"Nephrons","q":"What are podocytes?","c":"Visceral capsule cells whose feet leave filtration slits","w":["Parietal capsule cells lining the outer capsule wall","Smooth muscle cells sitting between glomerular loops","Salt-sensing cells in the distal convoluted tubule","Renin-releasing cells on the afferent arteriole"],"e":"Podocytes form the visceral layer of the capsule. Their interdigitating 'feet' leave filtration slits, so they are the filter (Urinary slide 30; Nephrons video).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption."},{"l":5,"t":"Nephrons","q":"What do mesangial cells do?","c":"Contract between glomerular loops to fine-tune GFR","w":["Sense NaCl in the distal tubule to set GFR","Secrete renin when blood pressure falls","Form filtration slits on the visceral layer","Pump Na+ out of the nephron loop"],"e":"Mesangial cells are smooth muscle between the glomerular loops. Contracting pulls the podocytes together and relaxing lets them drift apart, adjusting GFR (Urinary slide 30).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption."},{"l":5,"t":"Nephrons","q":"What is the glomerular capsule like?","c":"Serous-membrane-like, with parietal and visceral layers","w":["A true serosa, with parietal and visceral layers","A single sheet of smooth muscle around the loops","A fibrous capsule with no distinct layers","An extension of the renal fascia"],"e":"The capsule is only like a serous membrane (not true serosa): a parietal layer lines its wall and a visceral layer (podocytes) covers the glomerulus (Urinary slide 29).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption."},{"l":5,"t":"Nephrons","q":"How is GFR generally related to blood pressure?","c":"Proportional: higher pressure, higher GFR","w":["Inversely: higher pressure, lower GFR","Unrelated: GFR stays fixed","Proportional only to venous pressure","Inverse only when standing"],"e":"Generally GFR is proportional to blood pressure (Urinary slide 30).","lo":"Describe the nephron and its histological features and the processes of glomerular filtration, tubular secretion, and tubular reabsorption.","note":"Your slide note: GFR ∝ BP."},{"l":5,"t":"Nephrons","q":"Where in the nephron is the primary site of water reabsorption?","c":"Proximal convoluted tubule","w":["Glomerulus","Nephron loop","Distal convoluted tubule","Collecting duct"],"e":"The PCT is the primary site of reabsorption, about two-thirds of salts and water, with water following the salts. The loop, DCT and collecting ducts help, but none compare (Urinary slides 31 and 36).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron.","said":"Dr. Fox's own check question. He also says the PCT being the primary reabsorption site 'cannot be understated.'","note":"Your slide note: water follows salts."},{"l":5,"t":"Nephrons","q":"In a healthy person, how much filtered glucose and amino acids does the PCT reabsorb?","c":"All of it","w":["About half","About two-thirds","None of it","Only what the DCT misses"],"e":"Glucose and amino acids are fully reabsorbed in the PCT, which is why normal renal clearance of glucose is zero (Urinary slide 31; Nephrons video).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron."},{"l":5,"t":"Nephrons","q":"What does the PCT secrete into the filtrate?","c":"Ammonia and bioactive substances","w":["Glucose and amino acids","Renin and erythropoietin","Aldosterone and vasopressin","Calcium and bicarbonate"],"e":"The PCT secretes ammonia (a metabolic waste) and bioactive substances such as drugs (Urinary slide 31).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron."},{"l":5,"t":"Nephrons","q":"How does the nephron loop reabsorb water?","c":"It builds a hypertonic medulla that draws water out","w":["It pumps water out with active water transporters","It secretes vasopressin into the medulla","It filters water back into the glomerulus","It sends water straight into the calices"],"e":"Na+ leaves the loop (passively, then actively), making the medulla hypertonic. Water follows the Na+, and the vasa recta carry that water back to the blood, leaving the salt to keep the medulla hypertonic (Urinary slide 32).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron.","deep":true},{"l":5,"t":"Nephrons","q":"What do intercalated cells of the DCT and collecting ducts do?","c":"Fine-tune pH with HCO3- and H+","w":["Reabsorb Na+ under aldosterone","Sense NaCl to adjust GFR","Release renin into the blood","Reabsorb Ca2+ under PTH"],"e":"Intercalated cells handle pH by secreting or reabsorbing bicarbonate and protons. They are in the DCT and the collecting ducts (Urinary slide 33).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron."},{"l":5,"t":"Nephrons","q":"What do principal cells of the DCT and collecting ducts do?","c":"Reabsorb Na+ and water under aldosterone and ADH","w":["Secrete H+ and reabsorb HCO3- to fix pH","Reabsorb Ca2+ in response to parathyroid hormone","Sense NaCl and signal the afferent arteriole","Make calcitriol to raise blood calcium"],"e":"Principal cells reabsorb Na+ and then water (RAA system) and water with vasopressin/ADH (Urinary slide 33).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron.","note":"Your slide note: water follows solute."},{"l":5,"t":"Nephrons","q":"What does parathyroid hormone do in the distal convoluted tubule?","c":"Increases Ca2+ reabsorption","w":["Increases Ca2+ secretion","Increases glucose reabsorption","Increases H+ secretion","Increases urea reabsorption"],"e":"Epithelial cells of the DCT reabsorb calcium, and parathyroid hormone drives this as part of calcium homeostasis (Urinary slide 33).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron."},{"l":5,"t":"Nephrons","q":"What is the macula densa?","c":"A DCT salt sensor used as a proxy for GFR","w":["A PCT glucose sensor used to set GFR","A glomerular pressure sensor that releases renin","A medullary water sensor that releases ADH","A collecting duct pH sensor for bicarbonate"],"e":"The macula densa is a patch of DCT epithelium beside the glomerulus that senses NaCl in the filtrate, an indirect measure of GFR (Urinary slides 33 and 42).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron.","note":"Your slide note: salt sensor, indirect measure."},{"l":5,"t":"Nephrons","q":"Select ALL correctly matched nephron parts and roles.","c":["PCT: reabsorbs all glucose and amino acids","Nephron loop: builds a hypertonic medulla","DCT: reabsorbs Ca2+ with PTH","Intercalated cells: fine-tune pH"],"w":["Glomerulus: tubular secretion","Principal cells: release renin"],"e":"The glomerulus filters (it doesn't secrete), and renin comes from juxtaglomerular cells, not principal cells (Urinary slides 29 to 33 and 42).","lo":"Detail what substances are secreted and reabsorbed in various portions of the nephron.","deep":true},{"l":5,"t":"Nephrons","q":"How do diuretics work?","c":"They raise water secretion or lower water reabsorption","w":["They lower water secretion or raise water reabsorption","They constrict the afferent arteriole to lower GFR","They raise ADH release to retain more water","They block filtration at the glomerular capsule"],"e":"Diuretics either increase tubular secretion of water or decrease tubular reabsorption of water. Either way more water ends up in the filtrate (diuresis) (Urinary slide 35).","lo":"Explain how diuretics affect urine formation and factors involved.","note":"Your slide note: more flow into filtrate, less water to the CV system."},{"l":5,"t":"Nephrons","q":"Why are diuretics a front-line treatment for hypertension?","c":"They lower blood volume through diuresis","w":["They raise blood volume through diuresis","They constrict the efferent arteriole","They block the renal plexus directly","They increase erythropoietin release"],"e":"Moving water into the urine reduces blood volume, which brings blood pressure down (Urinary slide 35).","lo":"Explain how diuretics affect urine formation and factors involved.","deep":true},{"l":5,"t":"Nephrons","q":"How does alcohol act as a diuretic?","c":"It inhibits vasopressin (ADH)","w":["It stimulates aldosterone release","It blocks the podocyte filtration slits","It increases renin secretion","It constricts the efferent arteriole"],"e":"Alcohol inhibits vasopressin/ADH, which normally drives water reabsorption in the DCT, so less water is reabsorbed (Urinary slide 35).","lo":"Explain how diuretics affect urine formation and factors involved."},{"l":5,"t":"Nephrons","q":"How does caffeine act as a diuretic?","c":"Slows water reabsorption and raises GFR","w":["Speeds water reabsorption and lowers GFR","Raises aldosterone and lowers GFR","Raises ADH and slows filtration","Constricts afferent arterioles to lower GFR"],"e":"Caffeine slows water reabsorption, and by raising heart rate it also increases GFR (Urinary slide 35; Nephrons video).","lo":"Explain how diuretics affect urine formation and factors involved."},{"l":5,"t":"Nephrons","q":"Why does Dr. Fox warn about drinks that mix alcohol and caffeine?","c":"Two diuretics stack, pulling even more water into urine","w":["Caffeine cancels alcohol's effect on vasopressin","Alcohol blocks caffeine's effect on GFR","Together they raise ADH and retain water","Together they stop filtration in the glomerulus"],"e":"Alcohol (less ADH) and caffeine (slower reabsorption, higher GFR) are both diuretics, so a vodka-energy drink lays one diuretic on another. His advice: hydrate (Nephrons video; Urinary slide 35).","lo":"Explain how diuretics affect urine formation and factors involved.","deep":true},{"l":5,"t":"Nephrons","q":"Which type of nephron is most common in humans?","c":"Cortical nephrons","w":["Juxtamedullary nephrons","Both equally common","Medullary nephrons","Papillary nephrons"],"e":"Cortical nephrons are ubiquitous. Their corpuscles sit high in the cortex and their loops are short (Urinary slide 34).","lo":"Explain the difference between cortical vs. juxtamedullary nephrons."},{"l":5,"t":"Nephrons","q":"What lets juxtamedullary nephrons make more concentrated urine?","c":"Long nephron loops with vasa recta","w":["Short loops that stay in the cortex","Small glomeruli with a low GFR","Corpuscles high in the cortex","No peritubular capillaries at all"],"e":"Juxtamedullary nephrons have long nephron loops with vasa recta, which keep the medulla more hypertonic and pull out more water. They also have larger glomeruli and a higher GFR (Urinary slide 34).","lo":"Explain the difference between cortical vs. juxtamedullary nephrons.","deep":true},{"l":5,"t":"Nephrons","q":"Where do the corpuscles of juxtamedullary nephrons sit?","c":"Next to the medulla","w":["High in the cortex","Inside the renal papillae","Inside the renal sinus","Along the renal capsule"],"e":"Juxta means next to: their corpuscles are against the medulla. Cortical nephron corpuscles sit high in the cortex (Urinary slide 34; Nephrons video).","lo":"Explain the difference between cortical vs. juxtamedullary nephrons."},{"l":5,"t":"Nephrons","q":"Which animals have more juxtamedullary nephrons, and why?","c":"Desert dwellers, which must conserve water","w":["Ocean dwellers, which must excrete salt fast","Large mammals, which have higher blood pressure","Herbivores, which must excrete more potassium","Flying animals, which need lighter kidneys"],"e":"Juxtamedullary nephrons are less common in humans but more common in desert-dwelling animals, where concentrating urine is more important (Nephrons video; Urinary slide 34).","lo":"Explain the difference between cortical vs. juxtamedullary nephrons.","deep":true},{"l":5,"t":"Nephrons","q":"Select ALL features of juxtamedullary nephrons.","c":["Larger glomeruli","Higher GFR","Long nephron loops","Vasa recta"],"w":["Most common type in humans","Corpuscles high in the cortex"],"e":"Juxtamedullary: less common, corpuscles next to the medulla, larger glomeruli, higher GFR, long loops with vasa recta. Cortical: common, high in the cortex, short loops (Urinary slide 34).","lo":"Explain the difference between cortical vs. juxtamedullary nephrons.","deep":true},{"l":5,"t":"Renal regulation","q":"What is the most significant regulation of renal function?","c":"Intrinsic autoregulation","w":["Sympathetic renal plexus","The RAA hormone system","Parasympathetic vagal input","Natriuretic peptides"],"e":"Most renal regulation is intrinsic: the myogenic response and tubuloglomerular feedback. The ANS and hormones are extrinsic (Urinary slide 39).","lo":"Discuss intrinsic & extrinsic control of renal function."},{"l":5,"t":"Renal regulation","q":"What are the two intrinsic controls of renal function?","c":"Myogenic and tubuloglomerular","w":["Renal plexus and the RAA system","ADH and aldosterone","ANP and BNP","Vagal and splanchnic nerves"],"e":"Intrinsic control = myogenic (afferent smooth muscle reacting to stretch) and tubuloglomerular (macula densa sensing NaCl). The rest is extrinsic (Urinary slide 39).","lo":"Discuss intrinsic & extrinsic control of renal function."},{"l":5,"t":"Renal regulation","q":"What does sympathetic input from the renal plexus do to GFR?","c":"Constricts afferent arterioles and lowers GFR","w":["Dilates afferent arterioles and raises GFR","Dilates efferent arterioles and raises GFR","Constricts the renal vein and raises GFR","Relaxes mesangial cells and raises GFR"],"e":"Sympathetic stimulation constricts the afferent arterioles, lowering GFR, which keeps more blood in the cardiovascular system (Urinary slide 39).","lo":"Discuss intrinsic & extrinsic control of renal function."},{"l":5,"t":"Renal regulation","q":"Which hormones increase water excretion rather than retention?","c":"ANP and BNP","w":["ADH and aldosterone","Angiotensin II and renin","Vasopressin and angiotensin II","Renin and aldosterone"],"e":"The RAA system and ADH/vasopressin increase water reabsorption. Atrial and brain natriuretic peptides (ANP, BNP) do the opposite and increase water excretion (Urinary slide 39).","lo":"Discuss intrinsic & extrinsic control of renal function.","note":"Your slide note: ANP and BNP = opposite."},{"l":5,"t":"Renal regulation","q":"What happens to GFR when the efferent arteriole constricts?","c":"It rises, since blood is held in the glomerulus","w":["It falls, since less blood enters the glomerulus","It falls, since blood leaves the glomerulus faster","It stays the same, since only the afferent matters","It stops, since the glomerulus collapses"],"e":"Efferent diameter is inversely proportional to GFR: constrict it and blood is held in the glomerulus longer, so GFR rises. Dilate it and GFR falls (Urinary slide 40).","lo":"Discuss intrinsic & extrinsic control of renal function.","deep":true,"note":"Your slide note: efferent is the opposite of afferent."},{"l":5,"t":"Renal regulation","q":"Afferent arteriole diameter is related to GFR in which way?","c":"Directly: constriction lowers GFR","w":["Inversely: constriction raises GFR","Not at all: only efferent matters","Directly: dilation lowers GFR","Inversely: dilation lowers GFR"],"e":"The afferent arteriole is the primary site: its diameter is proportional to GFR. Constrict it and GFR falls; dilate it and GFR rises. Think of it as supply into the glomerulus (Urinary slide 40).","lo":"Discuss intrinsic & extrinsic control of renal function."},{"l":5,"t":"Renal regulation","q":"Blood pressure rises and stretches the afferent arteriole wall. What does the myogenic response do?","c":"It constricts, so GFR doesn't climb","w":["It dilates, so GFR climbs further","It releases ANP to excrete water","It signals JG cells to release renin","It relaxes the efferent arteriole"],"e":"The afferent smooth muscle is baroceptive: stretch makes it constrict (lowering GFR), relaxation makes it dilate (raising GFR). This is the first and most significant line of autoregulation (Urinary slide 41).","lo":"Discuss intrinsic & extrinsic control of renal function.","deep":true},{"l":5,"t":"Renal regulation","q":"The macula densa senses high NaCl in the distal tubule. What happens?","c":"Afferent arterioles constrict and GFR falls","w":["Afferent arterioles dilate and GFR rises","JG cells release renin and GFR rises","Efferent arterioles dilate and GFR rises","Podocytes separate and GFR rises"],"e":"Tubuloglomerular feedback uses salt as a proxy for GFR. High NaCl means GFR is high, so the afferent arterioles constrict to bring it down. Low NaCl makes them dilate (Urinary slide 42).","lo":"Discuss intrinsic & extrinsic control of renal function.","deep":true},{"l":5,"t":"Renal regulation","q":"Select ALL extrinsic controls of renal function.","c":["Sympathetic renal plexus","RAA system","ADH (vasopressin)","ANP and BNP"],"w":["Myogenic response","Tubuloglomerular feedback"],"e":"Extrinsic = the ANS (renal plexus) and hormones (RAA, ADH, natriuretic peptides). The myogenic response and tubuloglomerular feedback are intrinsic (Urinary slide 39).","lo":"Discuss intrinsic & extrinsic control of renal function.","deep":true},{"l":5,"t":"Renal regulation","q":"What triggers the RAA system?","c":"Low BP, low NaCl at the macula densa, sympathetic input","w":["High BP, high NaCl at the macula densa, vagal input","High BP, low NaCl at the macula densa, vagal input","Low BP, high NaCl at the macula densa, ANP release","High blood glucose, high calcium, sympathetic input"],"e":"RAA responds to a drop in blood pressure. Triggers: low BP, low NaCl sensed by the macula densa in the DCT, or sympathetic stimulation (Urinary slide 43).","lo":"Outline the RAA system.","note":"Your slide note: low BP, low NaCl (in DCT, by macula densa)."},{"l":5,"t":"Renal regulation","q":"What does renin do?","c":"Converts angiotensinogen to angiotensin I","w":["Converts angiotensin I to angiotensin II","Converts angiotensin II to aldosterone","Converts angiotensinogen to angiotensin II","Converts aldosterone into vasopressin"],"e":"Renin, from the JG cells, converts liver-made angiotensinogen to angiotensin I. ACE then converts angiotensin I to angiotensin II (Urinary slide 43).","lo":"Outline the RAA system."},{"l":5,"t":"Renal regulation","q":"Where does ACE convert angiotensin I to angiotensin II?","c":"On the pulmonary endothelium","w":["In the juxtaglomerular cells","In the liver","In the adrenal cortex","In the hypothalamus"],"e":"Angiotensin converting enzyme works on the lining of the lung vessels. ACE inhibitors block this step (Urinary slide 43; Renal Regulation video).","lo":"Outline the RAA system."},{"l":5,"t":"Renal regulation","q":"Select ALL effects of angiotensin II.","c":["Vasoconstriction","Aldosterone release from the adrenal cortex","ADH release from the hypothalamus"],"w":["Renin release from the liver","ANP release from the heart"],"e":"Angiotensin II is a potent vasoconstrictor, makes the adrenal cortex release aldosterone, and makes the hypothalamus release ADH. Renin comes from JG cells, and ANP opposes RAA (Urinary slide 44).","lo":"Outline the RAA system.","deep":true},{"l":5,"t":"Renal regulation","q":"What does aldosterone do?","c":"Increases Na+ and water reabsorption in the DCT","w":["Increases Na+ and water excretion in the DCT","Increases glucose reabsorption in the PCT","Increases H+ secretion in the loop","Increases Ca2+ reabsorption in the PCT"],"e":"Aldosterone, from the adrenal cortex, increases Na+ reabsorption in the distal convoluted tubule, and water follows. That raises blood volume and pressure (Urinary slide 44).","lo":"Outline the RAA system."},{"l":5,"t":"Renal regulation","q":"Angiotensin II strongly constricts the efferent arteriole. Why doesn't GFR shoot up?","c":"The afferent arteriole constricts too, balancing it","w":["The efferent arteriole relaxes within seconds","Podocytes widen their slits to compensate","The macula densa blocks angiotensin II","ADH dilates the efferent arteriole"],"e":"Efferent constriction alone would raise GFR, but angiotensin II also constricts the afferent arteriole, so the effects balance and filtration simply continues during the response (Renal Regulation video; Urinary slides 40 and 44).","lo":"Outline the RAA system.","deep":true},{"l":5,"t":"Renal regulation","q":"What are the two actions of ADH (vasopressin)?","c":"Na+ and water reabsorption, and vasoconstriction","w":["Water excretion in the DCT, and vasodilation","Renin release, and Ca2+ reabsorption in the PCT","Glucose reabsorption, and vasodilation","H+ secretion, and efferent dilation"],"e":"Like aldosterone, ADH increases Na+ and water reabsorption in the DCT. It is also a powerful vasoconstrictor, which is where 'vasopressin' comes from (Urinary slide 44).","lo":"Outline the RAA system.","note":"Your slide note: vasopressin = press vessels."},{"l":5,"t":"Renal regulation","q":"What is the correct order of the RAA pathway?","c":"Renin, angiotensin I, ACE, angiotensin II, aldosterone","w":["ACE, angiotensin I, renin, angiotensin II, aldosterone","Renin, angiotensin II, ACE, angiotensin I, aldosterone","Aldosterone, renin, angiotensin I, ACE, angiotensin II","Renin, aldosterone, angiotensin I, ACE, angiotensin II"],"e":"JG cells release renin, which converts angiotensinogen to angiotensin I. ACE in the lungs makes angiotensin II, which drives aldosterone (and ADH) release (Urinary slides 43 and 44).","lo":"Outline the RAA system.","deep":true},{"l":5,"t":"Renal regulation","q":"Where is the renal plexus located?","c":"On the renal artery","w":["On the renal vein","Around the ureter","On the superior mesenteric artery","Around the suprarenal gland"],"e":"The renal plexus is a mixed autonomic plexus on each renal artery, with small ganglia near the origin of the renal arteries (Urinary slide 46).","lo":"Map the autonomic innervation of the kidneys."},{"l":5,"t":"Renal regulation","q":"What is the main effect of the renal plexus?","c":"Sympathetic: vasoconstriction and renin release","w":["Parasympathetic: vasodilation and more filtration","Sympathetic: vasodilation and ADH release","Parasympathetic: detrusor contraction","Sympathetic: aldosterone release from the kidney"],"e":"The renal plexus is predominantly sympathetic: it constricts the afferent arterioles and stimulates renin secretion from JG cells (Urinary slide 46).","lo":"Map the autonomic innervation of the kidneys."},{"l":5,"t":"Renal regulation","q":"When present, which thoracic splanchnic nerve provides direct sympathetic innervation to the renal plexus?","c":"Least thoracic splanchnic n.","w":["1st lumbar splanchnic n.","2nd lumbar splanchnic n.","Greater thoracic splanchnic n.","Lesser thoracic splanchnic n."],"e":"The least thoracic splanchnic nerve, when present, innervates the renal plexus directly. The greater and lesser contribute indirectly through the celiac and aorticorenal plexuses, and the lumbar ones aren't thoracic (Urinary slides 46 and 47).","lo":"Map the autonomic innervation of the kidneys.","said":"Dr. Fox's own check question at the end of the Renal Regulation video."},{"l":5,"t":"Renal regulation","q":"Which spinal levels give input to the sympathetic chains?","c":"T1 to L2","w":["C1 to T1","T5 to T12","L1 to S4","S2 to S4"],"e":"The sympathetic chains (paravertebral ganglia) get their input from spinal nerves T1 to L2, which send thoracic and lumbar splanchnic nerves to the pre-aortic plexuses (Urinary slide 45).","lo":"Map the autonomic innervation of the kidneys."},{"l":5,"t":"Renal regulation","q":"Which nerve gives parasympathetic input to the pre-aortic ganglia and plexuses?","c":"Posterior vagal trunk","w":["Anterior vagal trunk","Greater thoracic splanchnic n.","Phrenic nerve","Least thoracic splanchnic n."],"e":"The posterior vagal trunk supplies the pre-aortic plexuses. The anterior vagal trunk helps mainly with the foregut (stomach, liver, gallbladder) (Urinary slide 45; Renal Regulation video).","lo":"Map the autonomic innervation of the kidneys."},{"l":5,"t":"Renal regulation","q":"Select ALL sources of input to the renal plexus.","c":["Celiac ganglia and plexus","Aorticorenal ganglion","Least thoracic splanchnic n.","1st lumbar splanchnic n."],"w":["Anterior vagal trunk","Inferior hypogastric plexus"],"e":"The renal plexus is fed by the celiac and aorticorenal ganglia, the least thoracic splanchnic nerve, the 1st lumbar splanchnic nerve and the intermesenteric plexus. The inferior hypogastric plexus serves the pelvis, including the bladder (Urinary slides 46 and 57).","lo":"Map the autonomic innervation of the kidneys.","deep":true},{"l":5,"t":"Excretory pathways & ureters","q":"In what order does urine leave the kidney?","c":"Collecting duct, papilla, minor calyx, major calyx, pelvis, ureter","w":["Collecting duct, papilla, major calyx, minor calyx, pelvis, ureter","Papilla, collecting duct, minor calyx, major calyx, pelvis, ureter","Collecting duct, minor calyx, papilla, major calyx, pelvis, ureter","Collecting duct, papilla, minor calyx, pelvis, major calyx, ureter"],"e":"Collecting ducts open at the renal papillae, which are cupped by minor calices. Minor calices join into major calices, which join into the renal pelvis, which continues as the ureter (Urinary slide 50).","lo":"Outline the pathway of urine excretion from renal papillae through to the urinary bladder.","deep":true,"note":"Your slide note: minor to major."},{"l":5,"t":"Excretory pathways & ureters","q":"Where is the boundary between filtrate and urine?","c":"Renal papillae","w":["Glomerular capsule","Distal convoluted tubule","Renal pelvis","Ureteric orifices"],"e":"At the renal papillae the collecting ducts empty into the minor calices: filtrate before, urine after (Urinary slide 50).","lo":"Outline the pathway of urine excretion from renal papillae through to the urinary bladder."},{"l":5,"t":"Excretory pathways & ureters","q":"What is the renal pelvis?","c":"The proximal expansion of the ureter","w":["The distal expansion of the urethra","The apex of a renal pyramid","A fold of cortex between pyramids","The neck of the urinary bladder"],"e":"The renal pelvis is the dilated proximal end of the ureter, formed where the major calices come together (Urinary slide 50).","lo":"Outline the pathway of urine excretion from renal papillae through to the urinary bladder.","note":"Your slide note: proximal expansion of ureter."},{"l":5,"t":"Excretory pathways & ureters","q":"What do minor calices join to form?","c":"Major calices","w":["Renal papillae","Collecting ducts","Renal columns","The ureter directly"],"e":"Several minor calices merge into each major calyx, and the major calices form the renal pelvis (Urinary slide 50).","lo":"Outline the pathway of urine excretion from renal papillae through to the urinary bladder."},{"l":5,"t":"Excretory pathways & ureters","q":"Which is the longest part of the ureter?","c":"Abdominal part","w":["Pelvic part","Intramural part","Renal pelvis","All three are equal"],"e":"The ureter is tripartite. The abdominal part (hilum to pelvic brim) is longest, then the pelvic part, and the intramural part in the bladder wall is shortest (Urinary slide 51).","lo":"Discuss the parts and pathways of the ureters."},{"l":5,"t":"Excretory pathways & ureters","q":"Where is the intramural part of the ureter?","c":"Within the wall of the urinary bladder","w":["Within the renal sinus at the hilum","Along the pelvic brim beside the iliacs","Within the perirenal fat below the kidney","Within the wall of the urethra"],"e":"Intramural means within the wall, like intramural sports within your school. It is the shortest part, inside the bladder wall (Urinary slide 51).","lo":"Discuss the parts and pathways of the ureters.","note":"Your slide note: within walls."},{"l":5,"t":"Excretory pathways & ureters","q":"Which landmark is useful in locating where the ureters cross into the pelvic cavity?","c":"Bifurcation of common iliac a.","w":["Bifurcation of abdominal aorta","Origin of renal a.","Sacral promontory","Urinary bladder"],"e":"The ureters cross into the pelvis where the common iliac artery splits into external and internal iliac arteries. The sacral promontory is too medial (Urinary slides 51 and 53).","lo":"Discuss the parts and pathways of the ureters.","said":"Dr. Fox's own check question at the end of the Excretory Pathways & Ureters video.","note":"Your slide note: best landmark for finding ureter."},{"l":5,"t":"Excretory pathways & ureters","q":"What does 'water under the bridge' describe?","c":"The ureter passing under the uterine artery","w":["The uterine artery passing under the ureter","The ureter passing under the urethra","The urethra passing under the uterine artery","The ureter passing under the renal vein"],"e":"The water (ureter) runs under the bridge (uterine artery) at the cervix. OB/GYNs use it to tell the two tubes apart in the pelvis (Urinary slide 51).","lo":"Discuss the parts and pathways of the ureters."},{"l":5,"t":"Excretory pathways & ureters","q":"Where do the ureters lie relative to the peritoneum?","c":"Retroperitoneal, like the kidneys","w":["Intraperitoneal, on their own mesentery","Within the peritoneal cavity, free","Anterior to the parietal peritoneum","Subperitoneal along their whole length"],"e":"Like the kidneys, the ureters are retroperitoneal and lie within the perirenal spaces (Urinary slides 3 and 51).","lo":"Discuss the parts and pathways of the ureters.","note":"Your slide note: retroperitoneal."},{"l":5,"t":"Excretory pathways & ureters","q":"Select ALL correctly matched parts of the ureter.","c":["Abdominal part: hilum to pelvic brim","Pelvic part: pelvic brim to bladder","Intramural part: in the bladder wall"],"w":["Intramural part: the longest part","Pelvic part: hilum to pelvic brim"],"e":"Abdominal (longest): hilum to pelvic brim. Pelvic: pelvic brim to bladder. Intramural (shortest): within the bladder wall (Urinary slide 51).","lo":"Discuss the parts and pathways of the ureters.","deep":true},{"l":5,"t":"Excretory pathways & ureters","q":"What is the most common type of kidney stone?","c":"Calcium oxalate","w":["Uric acid","Cystine","Struvite","Calcium phosphate"],"e":"Nephroliths are solid crystalline stones in the urine pathway. There are many types, but calcium oxalate is the most common (Urinary slide 52).","lo":"Discuss the basics of nephrolithiasis."},{"l":5,"t":"Excretory pathways & ureters","q":"Which set of symptoms fits nephrolithiasis?","c":"Renal colic, hematuria, nausea and vomiting","w":["Painless polyuria, thirst and weight loss","Left varicocele, flank and gonadal pain","Flank pain that goes away lying flat","Fever, productive cough and chest pain"],"e":"Kidney stones cause renal colic (kidney pain), hematuria (blood in the urine), and nausea and vomiting (Urinary slide 52). A left varicocele points to left renal vein entrapment, and pain that eases lying flat points to nephroptosis.","lo":"Discuss the basics of nephrolithiasis."},{"l":5,"t":"Excretory pathways & ureters","q":"Why do kidney stones cause pain and bleeding as they pass?","c":"They rub on and lodge in the narrow urine pathway","w":["They dissolve and burn the lining of the bladder","They block the renal artery and starve the kidney","They press on the left renal vein from behind","They stop glomerular filtration in the cortex"],"e":"Stones form in the kidney and travel down the excretory pathway. They rub against it and can get stuck, causing colic and hematuria (Urinary slide 52; Excretory Pathways video).","lo":"Discuss the basics of nephrolithiasis.","deep":true},{"l":5,"t":"Urinary bladder & urethra","q":"How does the urinary bladder relate to the peritoneum?","c":"It is subperitoneal","w":["It is intraperitoneal","It is in the perirenal space","It hangs on a mesentery","It is in the pararenal space"],"e":"The bladder lies below the peritoneum (subperitoneal) in the pelvis. Peritoneum covers only its superior surface (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"The urinary bladder lies between which structures?","c":"Pubic symphysis and the vagina or rectum","w":["Sacrum and the vagina or rectum","Pubic symphysis and the sacral promontory","Umbilicus and the pubic symphysis","The two ischial spines only"],"e":"The bladder is intermediate between the pubic symphysis in front and either the vagina or the rectum behind, depending on which organs are present (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"Which bladder surface is in contact with the peritoneum?","c":"Superior surface","w":["Inferolateral surfaces","Base (fundus)","Neck","Trigone"],"e":"The superior surface is covered by peritoneum. There are two inferolateral surfaces, a base (fundus) and a neck (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"Where do the ureters enter the urinary bladder?","c":"Base (fundus)","w":["Apex","Neck","Superior surface","Inferolateral surfaces"],"e":"The ureters, with their intramural parts, enter at the base or fundus of the bladder (Urinary slide 56; Bladder & Urethra video).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"Which part of the bladder is where the urethra begins?","c":"Neck","w":["Apex","Fundus","Superior surface","Ureteric crest"],"e":"The neck is the inferior part of the bladder, near where the urethra begins (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"Select ALL correctly matched bladder features.","c":["Superior surface: covered by peritoneum","Base (fundus): ureters enter","Neck: urethra begins"],"w":["Neck: ureters enter","Superior surface: urethra begins"],"e":"Peritoneum lies on the superior surface, the ureters enter at the base/fundus, and the urethra starts at the neck (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity.","deep":true},{"l":5,"t":"Urinary bladder & urethra","q":"What is the main job of the urinary bladder?","c":"Storing urine","w":["Filtering blood","Concentrating urine","Making renin","Absorbing water"],"e":"The bladder is a distensible organ for urine storage that empties into the urethra (Urinary slide 56).","lo":"Discuss the major surfaces and features of the urinary bladder in the context of the pelvic cavity."},{"l":5,"t":"Urinary bladder & urethra","q":"Which structure along with the ureteral orifices delimits the trigone of the bladder?","c":"Internal urethral meatus","w":["Detrusor muscle","External urethral meatus","Rugae","Uvula"],"e":"The trigone is the triangle between the two ureteric orifices (joined by the ureteric crest) and the internal urethral meatus (Urinary slides 57 and 60).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder.","said":"Dr. Fox's own check question at the end of the Urinary Bladder & Urethra video."},{"l":5,"t":"Urinary bladder & urethra","q":"How does the trigone differ from the rest of the bladder lining?","c":"It is smooth; the rest has rugae","w":["It has rugae; the rest is smooth","It is skeletal muscle; the rest is smooth","It has no muscle; the rest has detrusor","It is covered by peritoneum; the rest is not"],"e":"The trigone is smooth and distinct, with its own developmental path. The rest of the lining folds into rugae when the bladder is empty (Urinary slide 57).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder."},{"l":5,"t":"Urinary bladder & urethra","q":"Why does the bladder have rugae?","c":"They let it expand as it fills","w":["They help absorb water from urine","They move urine toward the ureters","They anchor the bladder to the pubis","They form the internal urethral sphincter"],"e":"The bladder is an expansive organ. Rugae are the folds of the empty, contracted bladder that flatten out as it fills (Urinary slide 57).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder."},{"l":5,"t":"Urinary bladder & urethra","q":"What does the detrusor muscle do?","c":"Squeezes the bladder to push urine out","w":["Closes the internal urethral meatus","Holds the ureters against the bladder","Pulls the bladder up toward the umbilicus","Pumps urine down the ureters"],"e":"The detrusor is the smooth muscle of the bladder wall, under autonomic control. It puts pressure on the urine during voiding (micturition) (Urinary slide 57).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder.","note":"Your slide note: puts pressure on urine."},{"l":5,"t":"Urinary bladder & urethra","q":"Which arteries mainly supply the urinary bladder?","c":"Superior and inferior vesical aa.","w":["Renal and gonadal aa.","External iliac and femoral aa.","Inferior mesenteric and sigmoid aa.","Lumbar and median sacral aa."],"e":"The superior and inferior vesical arteries, branches of the anterior division of the internal iliac artery, supply the bladder (Urinary slide 57).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder."},{"l":5,"t":"Urinary bladder & urethra","q":"Which plexus innervates the urinary bladder?","c":"Vesical plexus, from the inferior hypogastric","w":["Renal plexus, from the celiac plexus","Intermesenteric plexus, on the aorta","Superior mesenteric plexus, on the SMA","Aorticorenal plexus, by the renal artery"],"e":"The vesical (autonomic) plexus is part of the inferior hypogastric plexus, the clearinghouse for the pelvic autonomic plexuses (Urinary slide 57).","lo":"Discuss the internal features of the urinary bladder, the innervation and blood supply of the bladder."},{"l":5,"t":"Urinary bladder & urethra","q":"What does the internal urethral sphincter do?","c":"Contracts to keep urine in the bladder","w":["Contracts to push urine out of the bladder","Relaxes to let urine fill the bladder","Contracts to close the ureteric orifices","Relaxes to let semen into the bladder"],"e":"The internal urethral sphincter surrounds the internal urethral meatus. It is smooth muscle that contracts to maintain continence (Urinary slide 58; Bladder & Urethra video).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"In the short urethra, where is the external urethral meatus?","c":"Between the glans clitoris and vaginal orifice","w":["Between the vaginal orifice and the anus","On the distal, ventral glans penis","Just above the glans clitoris","Within the vestibule behind the vagina"],"e":"The short urethra passes through the urogenital diaphragm and opens between the glans clitoris and the vaginal orifice (Urinary slide 58).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"What are the parts of the tripartite urethra, from bladder outward?","c":"Prostatic, membranous, spongy","w":["Membranous, prostatic, spongy","Spongy, membranous, prostatic","Prostatic, spongy, membranous","Intramural, pelvic, abdominal"],"e":"The long urethra runs through the prostate (prostatic part), through the urogenital diaphragm (membranous part), then through the corpus spongiosum (spongy or penile part) (Urinary slide 59).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"Which part of the tripartite urethra passes through the urogenital diaphragm?","c":"Membranous part","w":["Prostatic part","Spongy part","Penile part","Intramural part"],"e":"The membranous part, the shortest, crosses the urogenital diaphragm between the prostatic and spongy parts (Urinary slide 59).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"Why is the spongy urethra called 'spongy'?","c":"It is encased in the corpus spongiosum","w":["It absorbs water from passing urine","It is lined with spongy rugae","It runs through the spongy prostate","It is surrounded by the detrusor"],"e":"The spongy (penile) part is completely surrounded by the corpus spongiosum, erectile tissue of the penis (Urinary slide 59).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"The middle lobe of the prostate enlarges. Why does voiding become hard?","c":"The uvula grows and blocks the internal urethral meatus","w":["The detrusor muscle is crushed and can't contract","The membranous urethra is pulled out of the diaphragm","The ureters are compressed before they reach the bladder","The external urethral meatus narrows on the glans"],"e":"The prostate surrounds the bladder neck and internal urethral sphincter. Its middle lobe makes the uvula of the bladder. If it hypertrophies, the uvula enlarges and can occlude the internal urethral meatus (Urinary slide 59; Bladder & Urethra video).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures.","deep":true},{"l":5,"t":"Urinary bladder & urethra","q":"Which part of the urethra receives the ejaculatory ducts?","c":"Prostatic part","w":["Membranous part","Spongy part","Bladder neck","Intramural part"],"e":"Semen and sperm (via the ductus deferens and ejaculatory ducts) enter the prostatic part of the urethra (Bladder & Urethra video; Urinary slide 59).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":5,"t":"Urinary bladder & urethra","q":"In the tripartite urethra, where is the external urethral meatus?","c":"On the distal, ventral glans penis","w":["On the dorsal base of the penis","Between the glans and the scrotum","At the junction with the prostate","On the proximal, dorsal glans penis"],"e":"The spongy urethra ends at the external urethral meatus on the distal, ventral surface of the glans penis. That is why this urethra is so long (Urinary slide 59).","lo":"Outline the pathways and parts of the urethra from bladder to outside world, noting anatomical relationships to other pelvic structures."},{"l":6,"t":"Lymphatic system overview","q":"Which trio lists the three functions of the lymphatic system?","c":"Fluid balance, fat absorption and immune responses","w":["Gas exchange, fat absorption and immune responses","Fluid balance, hormone release and immune responses","Fluid balance, fat absorption and blood clotting","Fluid balance, protein digestion and immune responses"],"e":"The lymphatic system drains excess interstitial fluid (fluid balance), carries absorbed lipids and fat-soluble vitamins (fat absorption) and mounts immune responses (Lymphatics slide 3).","lo":"Describe the structure and functions of the lymphatic system."},{"l":6,"t":"Lymphatic system overview","q":"Lymphatic tissue is reticular connective tissue plus lymphocytes. Which is the stroma and which the parenchyma?","c":"Reticular CT is the stroma; lymphocytes are the parenchyma","w":["Lymphocytes are the stroma; reticular CT is the parenchyma","Both reticular CT and lymphocytes form the stroma","Both reticular CT and lymphocytes form the parenchyma","Reticular CT is the capsule; lymphocytes are the stroma"],"e":"The stroma is the structural framework (reticular connective tissue); the parenchyma is the working tissue (the lymphocytes) (Lymphatics slide 3).","lo":"Describe the structure and functions of the lymphatic system.","deep":true,"note":"Your slide note: stroma = structural, parenchyma = functional."},{"l":6,"t":"Lymphatic system overview","q":"Which vitamins does the lymphatic system help absorb?","c":"The fat-soluble vitamins A, D, E and K","w":["The water-soluble B vitamins and vitamin C","Only vitamin B12, bound to intrinsic factor","The water-soluble vitamins B, C and folate","Vitamin C, folate and the mineral iron"],"e":"Lymph transports lipids and the lipid-soluble vitamins A, D, E and K absorbed from the gut (Lymphatics slide 3).","lo":"Describe the structure and functions of the lymphatic system."},{"l":6,"t":"Lymphatic system overview","q":"A patient's lymphatics in the small intestine are blocked. Which job suffers most directly?","c":"Absorbing dietary fats as chyle through the lacteals","w":["Absorbing glucose into the hepatic portal blood","Absorbing amino acids into the intestinal capillaries","Secreting bile into the duodenum for fat digestion","Producing intrinsic factor for vitamin B12 uptake"],"e":"Lacteals are the lymphatic capillaries of the small intestine; they carry absorbed fat as chyle. Sugars and amino acids go into blood capillaries instead (Lymphatics slides 3 and 8).","lo":"Describe the structure and functions of the lymphatic system.","deep":true},{"l":6,"t":"Lymphatic system overview","q":"Which list gives the components of the lymphatic system?","c":"Lymph, lymph vessels, lymphatic organs and red bone marrow","w":["Lymph, lymph vessels, lymphatic organs and the liver","Blood, veins, lymphatic organs and red bone marrow","Lymph, arteries, lymphatic organs and yellow marrow","Plasma, capillaries, the kidneys and red bone marrow"],"e":"The lymphatic system is lymph, lymph vessels, the lymphatic organs and red bone marrow (Lymphatics slide 3).","lo":"Describe the structure and functions of the lymphatic system."},{"l":6,"t":"Lymphatic system overview","q":"Which feature defines innate immunity?","c":"It is non-specific and needs no previous exposure","w":["It is specific to antigens and needs prior exposure","It relies on memory cells made after an infection","It works only through antibodies from plasma cells","It depends on T-cell
