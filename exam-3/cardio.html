e oblique parts especially) narrow the laryngeal inlet and depress the epiglottis, a protective action during deglutition (Respiration slide 53; Dr. Fox in the intrinsic muscles video).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true},{"l":4,"t":"Intrinsic laryngeal muscles","q":"What do the vocalis fibers of the thyro-arytenoid muscle do?","c":"Change timbre and fine-tune pitch","w":["Open the rima glottidis for breathing","Tip the thyroid cartilage forward","Raise the whole larynx for a bright voice","Lower the larynx for a deeper voice"],"e":"The medial thyro-arytenoid fibers beside the vocal ligaments (the vocalis) add lateral tension, flattening the ligament. That changes timbre (tonal quality) and fine-tunes pitch up or down (Respiration slide 56).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true},{"l":4,"t":"Intrinsic laryngeal muscles","q":"What do the lateral fibers of the thyro-arytenoid muscle do?","c":"Pull the arytenoids forward, lowering pitch","w":["Pull the arytenoids back, raising pitch","Rotate the arytenoids out, opening the airway","Tip the thyroid forward, raising pitch","Narrow the laryngeal inlet when swallowing"],"e":"Picture the vocal ligament as a string from the arytenoid's vocal process (back) to the thyroid cartilage (front). The thyro-arytenoid runs between those same two cartilages, so its lateral fibers pull the arytenoids forward toward the thyroid (protraction). That brings the ends of the string closer, so the ligament slackens: less tension, lower pitch (Respiration slide 56; Dr. Fox in the intrinsic laryngeal muscles video). The opposite move, the posterior crico-arytenoids pulling the arytenoids back, raises tension and pitch (slide 55).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true,"note":"thyro-arytenoid: lower pitch, affect timbre (slide 57)"},{"l":4,"t":"Intrinsic laryngeal muscles","q":"The arytenoids are pulled forward, toward the thyroid cartilage. What happens to the vocal ligaments?","c":"They slacken, so pitch drops","w":["They tighten, so pitch rises","They tighten, so pitch drops","They swing apart, opening the airway","They slacken, so pitch rises"],"e":"The vocal ligaments stretch from the arytenoids to the thyroid cartilage. Moving the arytenoids toward the thyroid shortens that distance, so tension falls and pitch drops: this is what the lateral thyro-arytenoid fibers do (Respiration slide 56). Pulling the arytenoids back (posterior crico-arytenoids) does the reverse (slide 55).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true,"note":"Guessed r-il7: why pulling arytenoids forward lowers pitch"},{"l":4,"t":"Intrinsic laryngeal muscles","q":"A singer slides down to a lower note. Which muscle action helps?","c":"Thyro-arytenoids pulling the arytenoids forward","w":["Cricothyroids tipping the thyroid forward","Posterior crico-arytenoids pulling arytenoids back","Posterior crico-arytenoids rotating arytenoids out","Oblique arytenoids narrowing the laryngeal inlet"],"e":"Lower pitch means less tension on the vocal ligaments. The lateral thyro-arytenoid fibers protract the arytenoids and slacken the ligaments (Respiration slide 56). The cricothyroid and the backward pull of the posterior crico-arytenoids both raise tension and pitch (slides 51 and 55); rotating the arytenoids out opens the airway, and the oblique arytenoids protect it during swallowing.","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true,"note":"Guessed r-il7: which muscle lowers pitch"},{"l":4,"t":"Laryngeal neurovasculature","q":"Which intrinsic laryngeal muscle has a unique innervation?","c":"Cricothyroid","w":["Posterior crico-arytenoid","Lateral crico-arytenoid","Thyro-arytenoid","Transverse arytenoid"],"e":"Every intrinsic laryngeal muscle is supplied by the recurrent laryngeal nerves except the cricothyroid, supplied by the external branch of the superior laryngeal nerve. Both are branches of the vagus (Respiration slides 47 and 63).","lo":"Describe the branches of the vagus nerves (CN X) that serve the larynx, and explain how they affect their target tissues.","deep":true,"said":"Dr. Fox's own check question at the end of the Laryngeal Neurovasculature video.","note":"recurrent laryngeal = everything but cricothyroid (slide 56)"},{"l":4,"t":"Laryngeal neurovasculature","q":"After surgery near the tracheo-esophageal groove, a patient is hoarse and one vocal fold barely moves. Which nerve was most likely injured?","c":"Recurrent laryngeal n.","w":["External branch of superior laryngeal n.","Internal branch of superior laryngeal n.","Glossopharyngeal n.","Phrenic n."],"e":"The recurrent laryngeal nerve ascends in the tracheo-esophageal groove and supplies nearly all intrinsic laryngeal muscles on its side, so injury can paralyze much of that side. The external branch only supplies cricothyroid; the internal branch is sensory and secretomotor (Respiration slides 61 and 62).","lo":"Describe the branches of the vagus nerves (CN X) that serve the larynx, and explain how they affect their target tissues.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"A crumb touches the laryngeal mucosa just above the vocal folds and triggers a cough. Which nerve carried that sensation?","c":"Internal branch of superior laryngeal n.","w":["External branch of superior laryngeal n.","Recurrent laryngeal n.","Glossopharyngeal n.","Phrenic n."],"e":"The internal branch of the superior laryngeal nerve passes through the thyrohyoid membrane and is sensory and secretomotor to mucosa proximal to the vocal folds. The recurrent laryngeal does the same distal to the folds (Respiration slides 60 and 61).","lo":"Describe the branches of the vagus nerves (CN X) that serve the larynx, and explain how they affect their target tissues.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"Which nerve is sensory and secretomotor to the laryngeal mucosa below the vocal folds?","c":"Recurrent laryngeal n.","w":["Internal branch of superior laryngeal n.","External branch of superior laryngeal n.","Phrenic n.","Glossopharyngeal n."],"e":"Distal to the vocal folds, the recurrent laryngeal nerve does for the mucosa what the internal branch of the superior laryngeal nerve does proximal to them: sensation in and parasympathetic secretion out (Respiration slide 61).","lo":"Describe the branches of the vagus nerves (CN X) that serve the larynx, and explain how they affect their target tissues.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"Which vessel does each recurrent laryngeal nerve loop under?","c":"Right: subclavian artery; left: arch of the aorta","w":["Right: arch of the aorta; left: subclavian artery","Right and left: arch of the aorta","Right and left: their subclavian arteries","Right: brachiocephalic trunk; left: left common carotid"],"e":"The right recurrent laryngeal wraps around the right subclavian artery; the left wraps around the concavity of the aortic arch. Both then ascend in the tracheo-esophageal groove (Respiration slide 61).","lo":"Describe the branches of the vagus nerves (CN X) that serve the larynx, and explain how they affect their target tissues.","deep":true,"note":"Right = subclavian; Left = concavity of aorta (slide 61)"},{"l":4,"t":"Laryngeal neurovasculature","q":"A surgeon ligates the inferior laryngeal artery. Which nerve, running with it in the tracheo-esophageal groove, must be spared?","c":"Recurrent laryngeal n.","w":["Internal branch of superior laryngeal n.","External branch of superior laryngeal n.","Vagus n. trunk in the carotid sheath","Phrenic n."],"e":"The inferior laryngeal artery (from the inferior thyroid artery) ascends with the recurrent laryngeal nerve in the tracheo-esophageal groove. Damaging the nerve risks paralyzing most intrinsic laryngeal muscles on that side (Respiration slide 62; Dr. Fox in the neurovasculature video).","lo":"Outline the blood supply of the larynx, noting sources, pathways, and adjacent anatomical relationships.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"Where does the superior laryngeal artery come from, and what does it travel with?","c":"Superior thyroid a.; with the internal br. of the superior laryngeal n.","w":["Inferior thyroid a.; with the recurrent laryngeal n.","Superior thyroid a.; with the recurrent laryngeal n.","Inferior thyroid a.; with the internal br. of the superior laryngeal n.","Thyroid ima a.; with the external br. of the superior laryngeal n."],"e":"The laryngeal arteries pair up by level. Superior: the external carotid gives the superior thyroid a., which gives the superior laryngeal a.; it pierces the thyrohyoid membrane together with the internal branch of the superior laryngeal n. Inferior: the inferior thyroid a. (thyrocervical trunk) gives the inferior laryngeal a., which runs with the recurrent laryngeal n. in the tracheo-esophageal groove (Respiration slide 62; Dr. Fox in the laryngeal neurovasculature video). So \"superior\" goes with \"superior\" all the way down the name.","lo":"Outline the blood supply of the larynx, noting sources, pathways, and adjacent anatomical relationships.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"Trace the superior laryngeal artery back to its source.","c":"External carotid → superior thyroid a. → superior laryngeal a.","w":["Subclavian → inferior thyroid a. → superior laryngeal a.","Internal carotid → superior thyroid a. → superior laryngeal a.","External carotid → inferior thyroid a. → superior laryngeal a.","Subclavian → thyrocervical trunk → superior laryngeal a."],"e":"The external carotid gives off the superior thyroid a., and that gives off the superior laryngeal a. (Respiration slide 62; Dr. Fox in the laryngeal neurovasculature video). The subclavian route (thyrocervical trunk → inferior thyroid a.) leads to the inferior laryngeal a. instead.","lo":"Outline the blood supply of the larynx, noting sources, pathways, and adjacent anatomical relationships.","deep":true,"note":"Guessed r-nv7: where the superior laryngeal artery comes from"},{"l":4,"t":"Laryngeal neurovasculature","q":"An artery and a nerve pass together through the thyrohyoid membrane into the larynx. What are they?","c":"Superior laryngeal a. and internal br. of superior laryngeal n.","w":["Inferior laryngeal a. and recurrent laryngeal n.","Superior laryngeal a. and recurrent laryngeal n.","Inferior laryngeal a. and internal br. of superior laryngeal n.","Superior laryngeal a. and external br. of superior laryngeal n."],"e":"The superior laryngeal a. accompanies the internal branch of the superior laryngeal n. through the hiatus in the thyrohyoid membrane (Respiration slide 62); the external branch is the motor nerve to the cricothyroid (slide 60). The inferior laryngeal a. and recurrent laryngeal n. enter from below, up the tracheo-esophageal groove.","lo":"Outline the blood supply of the larynx, noting sources, pathways, and adjacent anatomical relationships.","deep":true,"note":"Guessed r-nv7: what the superior laryngeal artery travels with"},{"l":4,"t":"Tracheobronchial tree","q":"At approximately what landmark does the trachea bifurcate into primary bronchi?","c":"Thoracic plane (sternal angle, T4/5)","w":["Cricoid cartilage (C6)","C4/5 intervertebral disc","Xiphisternal joint (T9)","Jugular notch (T2)"],"e":"The trachea bifurcates at the thoracic plane, from the sternal angle back to the T4/5 intervertebral disc. C6 is where the trachea starts below the cricoid (Respiration slides 66 and 73).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true,"said":"Dr. Fox's own check question at the end of the Tracheobronchial Tree video."},{"l":4,"t":"Tracheobronchial tree","q":"Which primary bronchus is larger and more vertical, so an inhaled object more often goes into it?","c":"Right primary bronchus","w":["Left primary bronchus","Neither; they are the same size","Whichever side the head is turned","The left, because it is more vertical"],"e":"The right primary bronchus is larger and more vertical than the slimmer, more oblique left bronchus (Respiration slide 66; Dr. Fox in the tracheobronchial tree video).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"Which is the correct order of branching in the tracheobronchial tree?","c":"Primary → secondary (lobar) → tertiary (segmental) → bronchioles","w":["Primary → tertiary (lobar) → secondary (segmental) → bronchioles","Primary → secondary (segmental) → tertiary (lobar) → bronchioles","Secondary → primary (lobar) → tertiary (segmental) → bronchioles","Primary → bronchioles → secondary (lobar) → tertiary (segmental)"],"e":"Primary bronchi serve lungs, secondary (lobar) bronchi serve lobes, tertiary (segmental) bronchi serve bronchopulmonary segments, then bronchioles (Respiration slide 68).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"How many secondary bronchi does each lung have?","c":"Right 3, left 2, one per lobe","w":["Right 2, left 3, one per lobe","Right 3, left 3, one per lobe","Right 2, left 2, one per hilum","Right 1, left 1, one per lung"],"e":"Secondary bronchi are lobar: the right lung has three lobes and three secondary bronchi, the left has two of each (Respiration slide 68).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"Moving distally along the tracheobronchial tree, how does the wall change?","c":"Cartilage decreases and smooth muscle increases","w":["Cartilage increases and smooth muscle decreases","Cartilage and smooth muscle both increase","Cartilage stays the same; smooth muscle disappears","Cartilage and smooth muscle both decrease"],"e":"Hyaline cartilage diminishes and smooth muscle increases distally; bronchioles have no cartilage (or mucous glands) and are all smooth muscle (Respiration slides 68 and 70).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"Why does epinephrine help open the airways in anaphylaxis?","c":"Sympathetic input relaxes airway smooth muscle","w":["Sympathetic input contracts the trachealis","Parasympathetic input relaxes the bronchioles","It adds cartilage support to the bronchioles","It constricts the bronchial arteries"],"e":"The trachealis and bronchiolar walls are smooth muscle under autonomic control; sympathetic stimulation relaxes them and dilates the bronchioles (Respiration slides 67 and 70; Dr. Fox in the tracheobronchial tree video).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"Where does the conducting zone end and the respiratory zone begin?","c":"Between terminal and respiratory bronchioles","w":["Between tertiary bronchi and bronchioles","Between conducting and terminal bronchioles","Between respiratory bronchioles and alveoli","Between the trachea and the primary bronchi"],"e":"Conducting → terminal → respiratory bronchioles. Terminal bronchioles are the end of the conducting zone (no gas exchange); respiratory bronchioles give rise to alveoli and begin the respiratory zone (Respiration slides 70 to 72).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"A patient confined to bed for weeks develops pneumonia. Which bronchopulmonary segment is most susceptible?","c":"Superior segment of the inferior lobe","w":["Apical segment of the superior lobe","Lingula of the left superior lobe","Medial segment of the middle lobe","Superior segment of the superior lobe"],"e":"The superior segments of the inferior lobes point straight posteriorly, so in someone lying on their back fluid and infection collect there (Respiration slide 69; Dr. Fox in the tracheobronchial tree video).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"Why can a single bronchopulmonary segment be surgically removed?","c":"It has its own tertiary bronchus and blood supply","w":["It is walled off from the others by a fissure","It has its own primary bronchus and lymphatics","It is wrapped in its own layer of parietal pleura","It has its own pleural cavity and fluid"],"e":"Each segment is served by its own tertiary (segmental) bronchus with its own blood supply, so it can be resected and the rest of the lung keeps working. Fissures separate lobes, not segments (Respiration slide 69).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles.","deep":true},{"l":4,"t":"Tracheobronchial tree","q":"A foreign body hits the densely innervated ridge where the trachea splits and triggers a cough. What is that ridge?","c":"Carina","w":["Hilum","Lingula","Cricoid","Lingula of the left lung"],"e":"The carina (keel) is the cartilage ridge at the bifurcation; its mucosa is densely innervated, so contact triggers coughing (Respiration slide 68).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles."},{"l":4,"t":"Tracheobronchial tree","q":"Which cells line the terminal bronchioles, protect them and produce surfactant?","c":"Club cells","w":["Type I alveolar cells","Dust cells","Reserve cells","Type II alveolar cells"],"e":"Club cells in the terminal bronchioles are protective and produce surfactant. Reserve (stem) cells there can replace injured epithelium (Respiration slide 71).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles."},{"l":4,"t":"Tracheobronchial tree","q":"What forms the posterior wall of the trachea?","c":"Trachealis smooth muscle","w":["A complete hyaline cartilage ring","The anterior wall of the esophagus","Elastic cartilage plates","Thyroid cartilage"],"e":"Tracheal (hyaline) cartilages are anterolateral, like a U; the gap posteriorly is closed by the trachealis muscle, next to the esophagus (Respiration slides 66 and 67).","lo":"Outline the conductive pathway from the larynx to the terminal bronchioles, noting regions of the tracheobronchial tree and their structure and relationships, e.g. primary, secondary, & tertiary bronchi, and conducting, terminal, and respiratory bronchioles."},{"l":4,"t":"Alveoli","q":"Which cells secrete surfactant in the alveoli?","c":"Type II alveolar cells","w":["Type I alveolar cells","Dust cells","Reserve (stem) cells","Capillary endothelial cells"],"e":"Type II alveolar cells are cuboidal, secretory cells that make surfactant. Type I cells are the respiratory epithelium; dust cells are macrophages (Respiration slides 77 and 78).","lo":"Describe the alveoli, their structure, histology, and circulation.","said":"Dr. Fox's own check question at the end of the Alveoli video."},{"l":4,"t":"Alveoli","q":"Across which epithelium does gas exchange happen?","c":"Simple squamous type I alveolar cells","w":["Cuboidal type II alveolar cells","Pseudostratified ciliated epithelium","Stratified squamous epithelium","Simple cuboidal club cells"],"e":"Type I alveolar cells are simple squamous respiratory epithelium. Together with the capillary's own simple squamous wall they make a very thin barrier for gases (Respiration slide 77).","lo":"Describe the alveoli, their structure, histology, and circulation.","deep":true},{"l":4,"t":"Alveoli","q":"Without surfactant, what would happen to the alveoli?","c":"They would tend to collapse from surface tension","w":["They would overinflate from low surface tension","They would lose their capillary blood supply","They would fill up with dust cells","They would harden into cartilage"],"e":"Surfactant reduces surface tension and keeps alveoli open. Without it they collapse on themselves (Respiration slide 77).","lo":"Describe the alveoli, their structure, histology, and circulation.","deep":true},{"l":4,"t":"Alveoli","q":"Fine inhaled particles that reach the alveoli are cleared by which cells?","c":"Alveolar macrophages (dust cells)","w":["Type II alveolar cells","Club cells","Type I alveolar cells","Reserve (stem) cells"],"e":"Mucus and the mucus elevator handle most debris higher up. Particles that reach the alveoli are phagocytized by dust cells, the alveolar macrophages (Respiration slide 77; Dr. Fox in the alveoli video).","lo":"Describe the alveoli, their structure, histology, and circulation.","deep":true},{"l":4,"t":"Alveoli","q":"The alveolar capillaries belong to which circulation, and what blood arrives in them?","c":"Pulmonary; deoxygenated blood from the right ventricle","w":["Systemic; oxygenated blood from the bronchial arteries","Pulmonary; oxygenated blood from the left atrium","Systemic; deoxygenated blood from the venae cavae","Pulmonary; oxygenated blood from the pulmonary veins"],"e":"Pulmonary arteries carry relatively deoxygenated blood from the right ventricle to the alveolar capillary beds; there it drops CO2, picks up O2, and returns by the pulmonary veins (Respiration slide 76).","lo":"Describe the alveoli, their structure, histology, and circulation.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Which vessels serving the lungs have the highest pressure?","c":"Bronchial arteries","w":["Pulmonary trunk","Pulmonary arteries","Pulmonary veins","Alveolar capillaries"],"e":"Bronchial arteries branch from the thoracic aorta, so they carry systemic pressure (about 120/80). The pulmonary trunk and its branches run at low pressure (about 25/8) (Respiration slides 81 and 84). Note: at the very end of the video Dr. Fox says pulmonary arteries, but he had just called bronchial arteries number one, and the slide supports that.","lo":"Differentiate between systemic and pulmonary circulation.","deep":true,"said":"Dr. Fox's own check question at the end of the Pulmonary Circulation video."},{"l":4,"t":"Pulmonary circulation","q":"Why are the bronchial arteries the most common source of hemoptysis (coughing up blood)?","c":"They are high-pressure systemic branches of the aorta","w":["They carry the lowest-pressure blood in the lungs","They are low-pressure branches of the pulmonary trunk","They run inside the alveolar walls with the veins","They are the pulmonary veins' main tributaries"],"e":"Bleeding is worst from a high-pressure source. The bronchial arteries are systemic, from the thoracic aorta, supplying the conducting pathway; the pulmonary loop is low pressure (Respiration slide 81).","lo":"Differentiate between systemic and pulmonary circulation.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Which sequence traces blood from the right ventricle through the lungs to the left side of the heart?","c":"Pulmonary valve → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → left atrium","w":["Pulmonary valve → pulmonary arteries → pulmonary trunk → alveolar capillaries → pulmonary veins → left atrium","Pulmonary valve → pulmonary trunk → pulmonary veins → alveolar capillaries → pulmonary arteries → left atrium","Aortic valve → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → left atrium","Pulmonary valve → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → right atrium"],"e":"From the conus arteriosus of the right ventricle, through the pulmonary valve into the pulmonary trunk, which splits into left and right pulmonary arteries. They branch to the alveolar capillaries, and four pulmonary veins return to the left atrium (Respiration slides 81 to 83).","lo":"Discuss the pathways of blood from the right ventricle to the lungs and back to the left ventricle.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Which vessels follow the branching of the bronchial tree with high fidelity, all the way to the alveolar capillaries?","c":"Pulmonary arteries","w":["Pulmonary veins","Venae cavae","Thoracic aorta","Bronchial veins"],"e":"Pulmonary arteries branch exactly as the bronchi do. The pulmonary veins do not follow the bronchial pathways (Respiration slides 82 and 83).","lo":"Discuss the pathways of blood from the right ventricle to the lungs and back to the left ventricle.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Select ALL statements that are true of the pulmonary veins.","c":["They carry richly oxygenated blood","They drain into the left atrium","They also receive blood from bronchial arterial pathways","There are usually four, two from each lung"],"w":["They follow the bronchial tree branch for branch","They carry blood at systemic pressure"],"e":"Four pulmonary veins (two per lung) bring oxygenated blood to the left atrium, and they also drain most of the bronchial arterial blood. Unlike the arteries, they don't follow the bronchi, and the pulmonary loop is low pressure (Respiration slides 81 and 83).","lo":"Discuss the pathways of blood from the right ventricle to the lungs and back to the left ventricle.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Where does most of the blood from the bronchial arteries drain?","c":"Pulmonary veins","w":["Pulmonary arteries","Coronary sinus","Pulmonary trunk","Inferior vena cava, by way of the azygos vein"],"e":"Bronchial arteries supply the conducting pathway out to about the respiratory bronchioles; their venous blood mostly goes to the pulmonary veins, some to the venae cavae (Respiration slide 81).","lo":"Differentiate between systemic and pulmonary circulation.","deep":true},{"l":4,"t":"Lungs","q":"The horizontal fissure separates the middle lobe of the right lung from which lobe?","c":"Superior lobe","w":["Inferior lobe","Lingula","Base","Cardiac notch"],"e":"Horizontal fissure: superior from middle lobe. Oblique fissure: inferior lobe from the rest (Respiration slides 88 and 91).","lo":"Describe the gross features of each lung, notably the: lobes, fissures, apices, hila & roots (contents), bases, cardiac notch, and lingula.","said":"Dr. Fox's own check question at the end of the Lungs video."},{"l":4,"t":"Lungs","q":"What is the difference between the hilum and the root of a lung?","c":"Hilum is the region; the root is the contents passing through it","w":["Root is the region; the hilum is the contents passing through it","Hilum is on the costal surface; the root is on the base","Both terms mean the primary bronchus alone","Hilum is the apex; the root is the base"],"e":"The hilum is the region on the mediastinal surface where structures enter and leave; the root is those contents: primary bronchus, pulmonary arteries, pulmonary veins, lymphatics (Respiration slides 87 and 90).","lo":"Describe the gross features of each lung, notably the: lobes, fissures, apices, hila & roots (contents), bases, cardiac notch, and lingula.","deep":true},{"l":4,"t":"Lungs","q":"Select ALL structures that are part of the root of the lung.","c":["Primary bronchus","Pulmonary arteries","Pulmonary veins","Lymphatics"],"w":["Phrenic nerve","Inferior vena cava"],"e":"Root contents: primary bronchus, pulmonary arteries, pulmonary veins and lymphatics (with hilar nodes) (Respiration slide 90).","lo":"Describe the gross features of each lung, notably the: lobes, fissures, apices, hila & roots (contents), bases, cardiac notch, and lingula.","deep":true},{"l":4,"t":"Lungs","q":"The cardiac notch and the lingula belong to which lobe?","c":"Superior lobe of the left lung","w":["Inferior lobe of the left lung","Middle lobe of the right lung","Superior lobe of the right lung","Middle lobe of the left lung"],"e":"Both are features of the left lung's superior lobe: the notch where the heart shows, and the tongue-shaped lingula below it. The lingula is not part of the inferior lobe (Respiration slide 89).","lo":"Describe the gross features of each lung, notably the: lobes, fissures, apices, hila & roots (contents), bases, cardiac notch, and lingula.","deep":true},{"l":4,"t":"Lungs","q":"The diaphragmatic surface of the lung is also called the:","c":"Base","w":["Apex","Hilum","Cupula","Lingula"],"e":"Costal surface faces costal pleura; mediastinal surface faces mediastinal pleura and holds the hilum; diaphragmatic surface (the base) faces the diaphragmatic pleura. The apex is the top (Respiration slide 87).","lo":"Describe the surfaces of the lungs."},{"l":4,"t":"Lungs","q":"In the right lung, what does the oblique fissure separate?","c":"The inferior lobe from the middle and superior lobes","w":["The superior lobe from the middle lobe only","The middle lobe from the lingula of the lung","The superior lobe from the base of the lung","The cardiac notch from the lingula"],"e":"The oblique fissure separates the inferior lobe from everything else; in the right lung the horizontal fissure then splits superior from middle. The left lung has only the oblique fissure (Respiration slide 88).","lo":"Describe the gross features of each lung, notably the: lobes, fissures, apices, hila & roots (contents), bases, cardiac notch, and lingula.","deep":true},{"l":4,"t":"Lungs","q":"Which surface of the lung holds the hilum, and what does it face?","c":"Mediastinal surface, facing the mediastinal pleura","w":["Costal surface, facing the costal pleura","Diaphragmatic surface, facing the diaphragmatic pleura","Mediastinal surface, facing the costal pleura","Costal surface, facing the mediastinal pleura"],"e":"The hilum is on the mediastinal surface, which faces the mediastinal pleura (Respiration slide 87).","lo":"Describe the surfaces of the lungs.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"Any muscles that increase the volume of the thoracic cavity serve which process?","c":"Inhalation","w":["Exhalation","Phonation","Internal respiration","Neither, since volume doesn't change pressure"],"e":"More volume means lower pressure (Boyle's law), and air moves from high to low pressure, so it flows in (Respiration slides 94 and 97).","lo":"Describe the accessory muscles of ventilation, and how they influence either forceful inhalation or exhalation.","said":"Dr. Fox's own check question at the end of the Muscles of Ventilation video."},{"l":4,"t":"Muscles of ventilation","q":"When the diaphragm contracts, what happens?","c":"Thoracic volume rises, pressure falls, air flows in","w":["Thoracic volume rises, pressure rises, air flows in","Thoracic volume falls, pressure falls, air flows out","Thoracic volume falls, pressure rises, air flows in","Thoracic volume stays the same, pressure falls, air flows in"],"e":"Contraction pulls the diaphragm down, increasing thoracic volume. By Boyle's law pressure drops, and air follows the pressure gradient into the lungs. Relaxation reverses it (Respiration slides 94 and 95).","lo":"Discuss ventilation vs. respiration, the movement of gases, and how volume influences pressure (Boyle's Law).","deep":true},{"l":4,"t":"Muscles of ventilation","q":"How do ventilation and respiration differ?","c":"Ventilation moves air in and out; respiration is gas crossing membranes","w":["Respiration moves air in and out; ventilation is gas crossing membranes","Both terms mean gas crossing the alveolar walls","Ventilation is gas crossing cell membranes; respiration is breathing","Both terms mean moving air in and out"],"e":"Ventilation = moving air into and out of the lungs and alveoli. Respiration = gases crossing membranes: external across the alveolar walls, internal across cell membranes (Respiration slide 94).","lo":"Discuss ventilation vs. respiration, the movement of gases, and how volume influences pressure (Boyle's Law).","deep":true},{"l":4,"t":"Muscles of ventilation","q":"Oxygen moving from an alveolus into the blood is an example of:","c":"External respiration","w":["Internal respiration","Alveolar ventilation","Tidal breathing","Pulmonary circulation"],"e":"External respiration is gas exchange across the alveolar walls; internal respiration is across a cell's plasma membrane (Respiration slide 94).","lo":"Discuss ventilation vs. respiration, the movement of gases, and how volume influences pressure (Boyle's Law).","deep":true},{"l":4,"t":"Muscles of ventilation","q":"A patient's right phrenic nerve is cut. What would you expect?","c":"Only the right hemidiaphragm stops working","w":["Both hemidiaphragms stop working","Only the right external intercostals stop","The diaphragm keeps working through CN X","Both phrenic nerves must be cut to affect breathing"],"e":"Each hemidiaphragm has its own phrenic nerve (C3, 4, 5). They work together, but injury to one leaves only the other hemidiaphragm functioning (Respiration slide 95; Dr. Fox in the ventilation video).","lo":"Describe the diaphragm, its relationships to thoracic and abdominal cavities, its shape, innervation, and how it drives ventilation.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"Which spinal nerve roots form the phrenic nerves?","c":"C3, C4, C5","w":["C1, C2, C3","C5, C6, C7","T1 to T6","C7, C8, T1"],"e":"“C3, 4, 5 keeps the diaphragm alive” (Respiration slide 95).","lo":"Describe the diaphragm, its relationships to thoracic and abdominal cavities, its shape, innervation, and how it drives ventilation."},{"l":4,"t":"Muscles of ventilation","q":"Which structure passes through the central tendon of the diaphragm?","c":"Inferior vena cava","w":["Esophagus","Thoracic aorta","Sympathetic trunk","Phrenic nerves"],"e":"The central tendon sits at about T8, is fused to the pericardium, and holds the caval hiatus for the inferior vena cava on its way to the right atrium (Respiration slide 95).","lo":"Describe the diaphragm, its relationships to thoracic and abdominal cavities, its shape, innervation, and how it drives ventilation.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"During quiet breathing, exhalation is mainly driven by:","c":"Passive relaxation of the diaphragm","w":["Contraction of the internal intercostals","Contraction of the abdominal muscles","Contraction of the scalene muscles","Contraction of the external intercostals"],"e":"In tidal breathing the diaphragm does the work: contraction for inhalation, relaxation (a passive process) for exhalation. Internal intercostals and abdominal muscles are recruited only for forceful exhalation (Respiration slides 95 and 96).","lo":"Describe the diaphragm, its relationships to thoracic and abdominal cavities, its shape, innervation, and how it drives ventilation.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"Select ALL accessory muscles of forceful inhalation.","c":["External intercostals","Sternocleidomastoid","Scalenes","Pectoralis minor"],"w":["Internal intercostals","Abdominal muscles"],"e":"Forceful inhalation: external intercostals (ribs up and out), sternocleidomastoid (manubrium), scalenes (ribs 1-2), pectoralis minor (ribs 3-5). Forceful exhalation: internal intercostals and abdominal muscles (Respiration slide 96).","lo":"Describe the accessory muscles of ventilation, and how they influence either forceful inhalation or exhalation.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"How do the abdominal muscles help in a forceful cough?","c":"They raise abdominal pressure, pushing the diaphragm up","w":["They pull the ribs up and out","They pull the diaphragm down","They lift the sternum at the manubrium","They lift the clavicles"],"e":"Abdominal muscles act on the abdominal cavity's volume and the diaphragm: squeezing the abdomen pushes the diaphragm up, shrinking the thorax and forcing air out (Respiration slide 96; Dr. Fox in the ventilation video).","lo":"Describe the accessory muscles of ventilation, and how they influence either forceful inhalation or exhalation.","deep":true},{"l":4,"t":"Muscles of ventilation","q":"What do the internal intercostal muscles do?","c":"Pull the ribs down and in for forceful exhalation","w":["Pull the ribs up and out for forceful inhalation","Pull the ribs down and in for quiet inhalation","Lift ribs 1 and 2 for forceful inhalation","Raise the sternum for quiet inhalation"],"e":"Internal intercostals pull the ribs inward and downward, decreasing thoracic volume for forceful exhalation; the external intercostals do the opposite (Respiration slide 96).","lo":"Describe the accessory muscles of ventilation, and how they influence either forceful inhalation or exhalation.","deep":true},{"l":4,"t":"Pleurae","q":"Which part of the pleurae dips into the fissures of the lungs?","c":"Visceral pleura","w":["Costal pleura","Mediastinal pleura","Diaphragmatic pleura","Cervical pleura"],"e":"Visceral pleura adheres to the lung surface, so it follows the lung into its fissures. Costal, mediastinal, diaphragmatic and cervical are all parts of the parietal pleura lining the cavity (Respiration slides 100 and 102).","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true,"said":"Dr. Fox's own check question at the end of the Pleurae video."},{"l":4,"t":"Pleurae","q":"Which pleura lines the inner surface of the rib cage?","c":"Costal pleura","w":["Visceral pleura","Mediastinal pleura","Cervical pleura","Diaphragmatic pleura"],"e":"Parietal pleura has costal (rib cage), mediastinal, diaphragmatic and cervical (cupula, up into the root of the neck) parts. Visceral pleura covers the lungs (Respiration slide 100).","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true},{"l":4,"t":"Pleurae","q":"Which pleura lines the cupula that rises into the root of the neck?","c":"Cervical pleura","w":["Costal pleura","Diaphragmatic pleura","Visceral pleura","Mediastinal pleura"],"e":"The cupula is the dome of the pulmonary cavity that rises up into the root of the neck. Parietal pleura is named for the surface it lines: costal (rib cage), mediastinal (mediastinum), diaphragmatic (diaphragm) and cervical (the cupula, toward the neck). So the lining of the cupula is the cervical pleura. Dr. Fox notes some treat it as where costal and mediastinal pleura meet, but he calls it by its own name (Respiration slide 100; pleurae video). Visceral pleura covers the lung itself, not the cavity.","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true},{"l":4,"t":"Pleurae","q":"What is the cupula?","c":"The dome of the pulmonary cavity rising into the neck","w":["The fold of pleura dipping into the lung fissures","The fluid-filled space between the two pleural layers","The point where bronchi and vessels enter the lung","The part of the cavity resting on the diaphragm"],"e":"Dr. Fox describes the cupula as the part of the pulmonary cavity that extends up toward the root of the neck; its lining is the cervical pleura (Respiration slide 100; pleurae video). The fold into the fissures is visceral pleura, and the space between layers is the pleural cavity.","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true,"note":"Guessed r-pl3: what the cupula and cervical pleura are"},{"l":4,"t":"Pleurae","q":"Which pleura and the surface it lines are correctly matched?","c":"Cervical pleura: the cupula","w":["Costal pleura: the lung surface","Diaphragmatic pleura: the cupula","Visceral pleura: the rib cage","Mediastinal pleura: the fissures"],"e":"Parietal pleura is named for what it lines: cervical (cupula), costal (rib cage), mediastinal (mediastinum), diaphragmatic (diaphragm). Visceral pleura covers the lung and dips into its fissures (Respiration slides 100 and 102).","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true,"note":"Guessed r-pl3: naming the parietal pleura"},{"l":4,"t":"Pleurae","q":"What does the small amount of normal pleural fluid do?","c":"Lubricates the pleurae so they don't stick together","w":["Holds the lungs well away from the chest wall","Carries oxygen to the visceral pleura","Inflates the lungs by filling the cavity","Fills the alveoli to keep them open"],"e":"There are only about 5-15 ml of pleural fluid. It keeps visceral and parietal pleura from forming adhesions, while they stay right against each other so the lungs expand with the chest wall (Respiration slide 100; Dr. Fox in the pleurae video).","lo":"Discuss the pleurae with an emphasis on the regions and structures covered or lined by each type.","deep":true},{"l":4,"t":"Pleurae","q":"A stab wound lets air into the pleural cavity and the lung collapses. What are these called?","c":"Pneumothorax leading to atelectasis","w":["Hemothorax leading to atelectasis","Atelectasis leading to pneumothorax","Hydrothorax leading to empyema","Pleural effusion leading to pneumothorax"],"e":"Air in the pleural cavity is a pneumothorax; it breaks the lung's coupling to the chest wall and can progress to atelectasis, a collapsed lung or lobe (Respiration slide 101).","lo":"Discuss the clinical ramifications of various substances entering the pleural cavity.","deep":true},{"l":4,"t":"Pleurae","q":"Select ALL correctly matched pleural conditions.","c":["Hemothorax: blood","Chylothorax: lymph","Pyothorax: pus","Hydrothorax: serous fluid"],"w":["Pneumothorax: serous fluid","Chylothorax: pus"],"e":"Pleural effusion types: hydrothorax (serous fluid), hemothorax (blood), chylothorax (lymph), pyothorax or empyema (exudate, pus). Pneumothorax is air (Respiration slide 101).","lo":"Discuss the clinical ramifications of various substances entering the pleural cavity.","deep":true},{"l":4,"t":"Pleurae","q":"A patient with a large pleural effusion struggles to breathe. Why, and how is it relieved?","c":"Fluid presses on the lung so it can't expand; drain it by thoracentesis","w":["Fluid blocks the bronchi so air can't enter; open it by cricothyrotomy","Fluid shrinks the pleural cavity so it can't fill; drain it by pericardiocentesis","Fluid fills the alveoli so gas can't cross; open it by tracheostomy","Fluid drains into the trachea; relieved by coughing it up"],"e":"Like cardiac tamponade, extra fluid in the pleural cavity presses on the lung so it can't expand on inhalation. Thoracentesis drains it with a needle (Respiration slide 101; Dr. Fox in the pleurae video).","lo":"Discuss the clinical ramifications of various substances entering the pleural cavity.","deep":true},{"l":1,"t":"Thoracic cavity","q":"Which structure forms the floor (inferior boundary) of the thoracic cavity?","c":"Diaphragm","w":["Superior thoracic aperture","Sternum","Costal margin cartilages","Thoracic vertebrae"],"e":"The thoracic cavity is bounded by the thoracic wall (ribs, sternum, thoracic vertebrae), opens superiorly at the superior thoracic aperture, and is closed inferiorly by the diaphragm (Heart lecture: thoracic cavity).","lo":"Discuss the relative position and boundaries, contents and subdivisions of the thoracic cavity."},{"l":1,"t":"Thoracic cavity","q":"Which subdivision of the thoracic cavity holds the heart, great vessels, trachea and esophagus?","c":"Mediastinum","w":["Right pulmonary cavity","Pericardial cavity","Left pulmonary cavity","Costodiaphragmatic recess"],"e":"The thoracic cavity has two lateral pulmonary cavities and the central mediastinum. The mediastinum holds the heart in its pericardium plus the great vessels, trachea and esophagus; the pericardial cavity surrounds only the heart (Heart lecture: thoracic cavity).","lo":"Discuss the relative position and boundaries, contents and subdivisions of the thoracic cavity.","deep":true},{"l":1,"t":"Thoracic cavity","q":"What do the pulmonary cavities contain?","c":"The lungs and their pleurae","w":["The heart and its pericardium","The trachea and esophagus","The great vessels and thymus","The thoracic duct and azygos vein"],"e":"The two pulmonary cavities lie on either side of the mediastinum and each holds a lung wrapped in its pleura; everything else listed sits in the mediastinum (Heart lecture: thoracic cavity).","lo":"Discuss the locations and contents of the pulmonary cavities."},{"l":1,"t":"Pericardium","q":"Where is the pericardial cavity?","c":"Between the parietal and visceral layers of serous pericardium","w":["Between the fibrous pericardium and parietal serous layer","Between the visceral serous pericardium and myocardium","Between the myocardium and the endocardium","Between the fibrous pericardium and the sternum"],"e":"Superficial to deep: fibrous pericardium, parietal serous pericardium (fused to it), pericardial cavity with a thin film of fluid, visceral serous pericardium (epicardium) on the heart (Heart lecture: pericardium).","lo":"Diagram the layers of the pericardium.","deep":true},{"l":1,"t":"Heart basics","q":"Which chamber receives the superior vena cava, inferior vena cava and coronary sinus?","c":"Right atrium","w":["Left atrium","Right ventricle","Left ventricle","Pulmonary trunk"],"e":"All systemic venous return, including the heart's own coronary sinus, enters the right atrium. The left atrium receives the pulmonary veins (Heart lecture: chambers).","lo":"Describe the four chambers of the heart and how they connect to other parts of the body through vasculature."},{"l":1,"t":"Heart basics","q":"Oxygen-poor blood leaves the heart through which vessel?","c":"Pulmonary trunk","w":["Aorta","Pulmonary veins","Superior vena cava","Coronary sinus"],"e":"The right ventricle pumps oxygen-poor blood out the pulmonary trunk to the lungs; the left ventricle pumps oxygen-rich blood out the aorta (Heart lecture: blood flow).","lo":"Diagram the flow of blood to, through and away from each side of the heart."},{"l":1,"t":"Heart basics","q":"Intercalated discs hold cardiac muscle cells together and pass signals between them using which junctions?","c":"Desmosomes and gap junctions","w":["Tight junctions and gap junctions","Desmosomes and tight junctions","Hemidesmosomes and synapses","T-tubules and sarcomeres"],"e":"Desmosomes anchor the cells so they don't pull apart during contraction; gap junctions let ions pass so the cells depolarize together as a functional syncytium (Heart lecture: cardiac muscle).","lo":"Describe the features of cardiac muscle tissue and how they support heart function.","deep":true},{"l":1,"t":"Heart basics","q":"What do the chordae tendineae and papillary muscles prevent?","c":"AV valve cusps everting into the atria during systole","w":["Semilunar cusps closing during diastole","AV valves opening during diastole","Backflow from the aorta into the ventricle","Blood entering the coronary arteries"],"e":"Blood pressure closes the AV valves; papillary muscles contract and pull on the chordae so the cusps don't blow back into the atria when the ventricles contract (Heart lecture: valves).","lo":"Outline the heart valves and their functions.","deep":true},{"l":1,"t":"External features","q":"The sternocostal (anterior) surface of the heart is formed mainly by the:","c":"Right ventricle","w":["Left ventricle","Left atrium","Right atrium","Two auricles"],"e":"The right ventricle makes up most of the anterior surface; the left atrium forms most of the base (posterior), and the left ventricle forms most of the diaphragmatic surface and the apex (Heart lecture: external features).","lo":"Describe the surfaces of the heart and what they contact."},{"l":1,"t":"External features","q":"The diaphragmatic (inferior) surface of the heart is formed mainly by the:","c":"Left ventricle, with some right ventricle","w":["Right atrium alone","Left atrium alone","Right ventricle alone","Both auricles"],"e":"The diaphragmatic surface rests on the central tendon of the diaphragm and is mostly left ventricle with part of the right ventricle (Heart lecture: external features).","lo":"Describe the surfaces of the heart and what they contact."},{"l":1,"t":"External features","q":"The right border of the heart is formed by the:","c":"Right atrium","w":["Right ventricle","Left atrium","Left ventricle","Pulmonary trunk"],"e":"Right border: right atrium. Inferior (acute) border: mainly right ventricle. Left (obtuse) border: mainly left ventricle (Heart lecture: borders).","lo":"Describe the borders of the heart and with which chambers they associate."},{"l":1,"t":"Internal features","q":"The aortic sinuses (of Valsalva) are:","c":"Dilations of the aortic root just above the valve cusps","w":["Openings of cardiac veins into the right atrium","Pockets of the pulmonary trunk behind its cusps","Grooves on the heart surface that hold vessels","Spaces between the layers of the pericardium"],"e":"Each cusp of the aortic valve has a small dilation of the aortic wall just above it; the right and left coronary arteries open from two of them (Heart lecture: coronary arteries).","lo":"Describe the aortic sinuses and their significance."},{"l":1,"t":"Internal features","q":"Which arteries arise from the aortic sinuses?","c":"Right and left coronary arteries","w":["Brachiocephalic trunk and left subclavian","Right and left pulmonary arteries","Right and left bronchial arteries","Right and left internal thoracic arteries"],"e":"The coronary arteries open from the right and left aortic sinuses, so they fill as recoiling blood fills the sinuses in diastole (Heart lecture: coronary arteries).","lo":"Describe the aortic sinuses and their significance.","deep":true},{"l":1,"t":"Cardiac veins","q":"The smallest cardiac (Thebesian) veins drain:","c":"Directly into the heart chambers","w":["Into the coronary sinus","Into the great cardiac vein","Into the superior vena cava","Into the azygos vein"],"e":"The smaller system of venous return bypasses the coronary sinus: anterior cardiac veins open into the right atrium, and the smallest cardiac veins open straight into the chambers (Heart lecture: cardiac veins).","lo":"Describe the smaller system of blood return to the heart."},{"l":1,"t":"Conduction and control","q":"While the ventricles eject blood in systole, which valves are open?","c":"Aortic and pulmonary (semilunar) valves","w":["Tricuspid and mitral (AV) valves","All four valves at once","Mitral and aortic valves only","None of the four valves"],"e":"In ventricular ejection, ventricular pressure exceeds arterial pressure, so the semilunar valves open while the AV valves stay shut. In diastole it is the reverse (Heart lecture: cardiac cycle).","lo":"Explain the cardiac cycle: systole vs. diastole, what happens with the chambers, valves and blood flow.","deep":true},{"l":1,"t":"Conduction and control","q":"Sympathetic stimulation of the heart:","c":"Increases heart rate and force of contraction","w":["Decreases heart rate and force","Increases rate but weakens force","Only constricts the coronary arteries","Is carried by the vagus nerves"],"e":"Sympathetic fibers (cardiac nerves from the sympathetic trunk) speed the heart and strengthen contraction; parasympathetic fibers in the vagus nerves slow it. Both reach the heart through the cardiac plexuses (Heart lecture: autonomic control).","lo":"Describe extrinsic (autonomic) control of the heart and how it is organized in cardiac plexuses."},{"l":1,"t":"Conduction and control","q":"In normal sinus rhythm, the heartbeat is set by the:","c":"Sinoatrial (SA) node","w":["Atrioventricular (AV) node","AV bundle (of His)","Purkinje fibers","Papillary muscles"],"e":"Sinus rhythm means the SA node, the pacemaker in the right atrial wall, starts each beat at a normal rate. An arrhythmia is any departure from that (Heart lecture: conduction and rhythm).","lo":"Describe normal sinus rhythm vs. arrhythmias."},{"l":1,"t":"Auscultation","q":"Which best describes the two normal heart sounds?","c":"S1 'lub' and S2 'dub', both from valves closing","w":["S1 and S2, both from valves opening","S3 and S4, both from atrial contraction","S1 from the apex, S2 from blood hitting the aorta","Murmurs from turbulent blood flow"],"e":"The normal heart sounds are S1 (lub) and S2 (dub), made by valve closure. S3/S4 and murmurs are extra sounds (Heart lecture: heart sounds).","lo":"Describe the heart sounds."},{"l":1,"t":"Auscultation","q":"S1 ('lub') marks the start of:","c":"Ventricular systole, as the AV valves close","w":["Ventricular diastole, as semilunar valves close","Atrial systole, as the AV valves open","Ventricular systole, as semilunar valves open","Atrial diastole, as the SA node fires"],"e":"S1 is the AV (tricuspid and mitral) valves closing as the ventricles start to contract; S2 is the semilunar valves closing as the ventricles relax (Heart lecture: heart sounds).","lo":"Explain the events that correspond with the various heart sounds.","deep":true},{"l":1,"t":"Auscultation","q":"Where is the mitral valve best heard?","c":"Left 5th intercostal space, midclavicular line","w":["Right 2nd intercostal space, beside the sternum","Left 2nd intercostal space, beside the sternum","Left 5th intercostal space, beside the sternum","Right 5th intercostal space, midclavicular line"],"e":"Auscultation sites are downstream of each valve: aortic at the right 2nd space, pulmonary at the left 2nd space, tricuspid at the lower left sternal border, mitral at the apex in the left 5th space, midclavicular line (Heart lecture: auscultation).","lo":"Outline the external locations for valve auscultation.","deep":true},{"l":2,"t":"Vessels and circulation","q":"Which circulation has arteries that carry oxygen-poor blood?","c":"Pulmonary circulation","w":["Systemic circulation","Coronary circulation","Hepatic portal circulation","Neither; arteries always carry oxygen-rich blood"],"e":"Arteries carry blood away from the heart. In the pulmonary circulation the right ventricle sends oxygen-poor blood to the lungs in the pulmonary arteries; in the systemic circulation the left ventricle sends oxygen-rich blood to the body (Vasculature lecture).","lo":"Contrast systemic and pulmonary circulation.","deep":true},{"l":2,"t":"Common iliac artery","q":"Each common iliac artery divides into the:","c":"Internal and external iliac arteries","w":["Femoral and popliteal arteries","Internal iliac and femoral arteries","Superior and inferior gluteal arteries","Median sacral and external iliac arteries"],"e":"The abdominal aorta bifurcates into the common iliacs, and each common iliac splits into an internal iliac (pelvis, gluteal region, perineum) and an external iliac (lower limb, becoming the femoral) (Vasculature lecture).","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery."},{"l":2,"t":"Common iliac artery","q":"Which sequence follows the aorta from the heart to the lower limb?","c":"Ascending aorta → arch → thoracic aorta → abdominal aorta → common iliac → external iliac","w":["Ascending aorta → arch → abdominal aorta → thoracic aorta → common iliac → external iliac","Arch → ascending aorta → thoracic aorta → abdominal aorta → internal iliac → common iliac","Ascending aorta → thoracic aorta → arch → abdominal aorta → external iliac → common iliac","Ascending aorta → arch → thoracic aorta → common iliac → abdominal aorta → internal iliac"],"e":"The aorta ascends, arches, descends as the thoracic aorta, passes the diaphragm to become the abdominal aorta, then bifurcates into the common iliacs, which give the external iliacs to the lower limb (Vasculature lecture).","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery.","deep":true},{"l":2,"t":"Common iliac artery","q":"The internal iliac artery splits into which two divisions?","c":"Anterior and posterior divisions","w":["Medial and lateral divisions","Superficial and deep divisions","Pelvic and femoral divisions","Superior and inferior divisions"],"e":"The internal iliac has an anterior division (mainly pelvic viscera, perineum, and the obturator and inferior gluteal branches) and a posterior division (mainly the posterior pelvic wall and superior gluteal region) (Vasculature lecture).","lo":"Describe the divisions of the internal iliac artery and regions served."},{"l":2,"t":"Subclavian artery and upper limb","q":"The subclavian artery becomes the axillary artery at the:","c":"Lateral border of the first rib","w":["Inferior border of teres major","Medial border of anterior scalene","Midpoint of the clavicle","Cubital fossa"],"e":"The upper limb's main artery changes name at landmarks: subclavian to axillary at the lateral border of the first rib, axillary to brachial at the inferior border of teres major, and brachial divides into radial and ulnar in the cubital fossa (Vasculature lecture).","lo":"Describe the high-level pattern of blood supply to the upper limb."},{"l":2,"t":"Subclavian artery and upper limb","q":"The axillary artery becomes the brachial artery at the:","c":"Inferior border of teres major","w":["Lateral border of the first rib","Lateral border of pectoralis minor","Surgical neck of the humerus","Cubital fossa"],"e":"Axillary to brachial happens at the inferior border of teres major; pectoralis minor only divides the axillary artery into its three parts (Vasculature lecture).","lo":"Describe the high-level pattern of blood supply to the upper limb."},{"l":2,"t":"Subclavian artery and upper limb","q":"Which branch of the first part of the subclavian artery runs up to help supply the brain?","c":"Vertebral artery","w":["Internal thoracic artery","Thyrocervical trunk","Costocervical trunk","Dorsal scapular artery"],"e":"The first part (medial to anterior scalene) gives the vertebral artery (up through the cervical transverse foramina to the brain), the internal thoracic artery (anterior chest wall) and the thyrocervical trunk (thyroid, neck, shoulder) (Vasculature lecture).","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve.","deep":true},{"l":2,"t":"Subclavian artery and upper limb","q":"In the cubital fossa, the brachial artery divides into the:","c":"Radial and ulnar arteries","w":["Anterior and posterior interosseous","Deep brachial and radial arteries","Superficial and deep palmar arches","Axillary and ulnar arteries"],"e":"The brachial artery supplies the arm, then splits in the cubital fossa into the radial (lateral forearm) and ulnar (medial forearm) arteries, which meet again in the palmar arches (Vasculature lecture).","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"The ulnar artery mainly feeds which arch of the hand?","c":"Superficial palmar arch","w":["Deep palmar arch","Dorsal carpal arch","Plantar arch","Palmar venous arch"],"e":"The ulnar artery is the main source of the superficial palmar arch; the radial artery mainly forms the deep palmar arch (Vasculature lecture).","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve.","deep":true},{"l":2,"t":"Subclavian artery and upper limb","q":"What is the Allen test checking?","c":"Whether the ulnar artery alone can supply the hand","w":["Whether the radial pulse is strong enough","Whether the brachial artery is patent","Whether venous return from the hand is normal","Whether the median nerve is intact"],"e":"Both wrist arteries are pressed, the hand blanches, then only the ulnar is released. Quick return of color means the ulnar artery and palmar arches can supply the hand, so the radial artery can be cannulated safely (Vasculature lecture).","lo":"Explain the Allen test.","deep":true},{"l":2,"t":"Inferior vena cava","q":"The inferior vena cava returns blood from:","c":"Body regions below the diaphragm","w":["The head, neck and upper limbs","The heart wall itself","The lungs","The thoracic wall only"],"e":"The IVC forms from the common iliac veins at about L5, runs up the right side of the vertebral column collecting abdominal and lower-limb blood, and passes through the central tendon of the diaphragm to the right atrium. The SVC drains above the diaphragm (Vasculature lecture).","lo":"Describe the position and major tributaries of the inferior vena cava (IVC)."},{"l":3,"t":"Introduction to blood","q":"Which formed element is a cell fragment rather than a whole cell?","c":"Thrombocytes (platelets)","w":["Erythrocytes","Neutrophils","Lymphocytes","Monocytes"],"e":"The formed elements are erythrocytes, leukocytes and thrombocytes. Thrombocytes are fragments pinched off megakaryocytes (Blood lecture: formed elements).","lo":"Describe the basics of the formed elements."},{"l":3,"t":"Introduction to blood","q":"In a centrifuged blood sample, roughly how does whole blood divide?","c":"Just over half plasma, just under half formed elements","w":["Just under half plasma, just over half formed elements","About 90% plasma, 10% formed elements","About 25% plasma, 75% formed elements","About 70% formed elements, 30% plasma"],"e":"Plasma is the larger part (about 55%); the formed elements (about 45%) are almost all erythrocytes, with a thin buffy coat of leukocytes and platelets (Blood lecture: components of blood).","lo":"Describe the functions, components and relative abundances of components of blood."},{"l":3,"t":"Introduction to blood","q":"Which is a protective function of blood?","c":"Clotting to prevent fluid loss","w":["Carrying hormones to target organs","Keeping body temperature steady","Buffering the pH of tissues","Carrying CO2 to the lungs"],"e":"Blood's three functions: transportation (gases, nutrients, hormones, wastes), regulation (temperature, pH, fluid volume) and protection (clotting, immune defense) (Blood lecture: functions).","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Introduction to blood","q":"After centrifuging blood, the thin buffy coat between plasma and red cells holds:","c":"Leukocytes and thrombocytes","w":["Erythrocytes only","Plasma proteins only","Water and electrolytes","Fibrin from clotted blood"],"e":"Leukocytes and platelets together make up under 1% of blood and form the buffy coat; erythrocytes settle beneath it and plasma sits above (Blood lecture: components of blood).","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Formed elements","q":"Which leukocytes are agranulocytes?","c":"Lymphocytes and monocytes","w":["Neutrophils and eosinophils","Basophils and monocytes","Neutrophils and lymphocytes","Eosinophils and basophils"],"e":"Granulocytes: neutrophils, eosinophils, basophils. Agranulocytes: lymphocytes and monocytes (Blood lecture: formed elements).","lo":"Describe the basics of the formed elements."},{"l":3,"t":"Formed elements","q":"Which leukocyte is the most abundant and the first responder to bacterial infection?","c":"Neutrophil","w":["Eosinophil","Basophil","Lymphocyte","Monocyte"],"e":"Neutrophils are the most common leukocyte and quickly phagocytose bacteria. Eosinophils target parasites and allergy, basophils release histamine, lymphocytes run specific immunity, monocytes become macrophages (Blood lecture: leukocytes).","lo":"Describe the basics of the formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"What does a blood smear let you assess?","c":"The shape, size and relative numbers of blood cells","w":["The patient's ABO and Rh blood type","The oxygen saturation of hemoglobin","The concentration of plasma proteins","The patient's total blood volume"],"e":"A smear spreads blood thin on a slide and stains it, so cells can be seen and compared: their shape, size, color and the relative numbers of each type (Blood lecture: blood smear).","lo":"Describe the uses of a blood smear.","deep":true},{"l":3,"t":"Formed elements","q":"On a blood smear, abnormally small erythrocytes are described as:","c":"Microcytic","w":["Macrocytic","Hypochromic","Hyperchromic","Normocytic"],"e":"Size terms: microcytic (small), normocytic (normal), macrocytic (large). Hypo- and hyperchromic describe color (hemoglobin content), not size (Blood lecture: blood smear).","lo":"Describe the uses of a blood smear."},{"l":3,"t":"Erythrocytes","q":"How does the biconcave disc shape help an erythrocyte?","c":"It adds surface area for gas exchange and lets it bend through capillaries","w":["It stores extra iron for making new hemoglobin","It lets the cell divide quickly in the blood","It holds a nucleus at the center of the cell","It helps the cell stick to vessel walls to clot"],"e":"Mature erythrocytes have no nucleus or organelles and are packed with hemoglobin. The biconcave shape gives a high surface-to-volume ratio for gas exchange and the flexibility to squeeze through narrow capillaries (Blood lecture: erythrocytes).","lo":"Describe the structure, composition, development and function of erythrocytes.","deep":true},{"l":3,"t":"Erythrocytes","q":"Polycythemia is:","c":"An abnormally high erythrocyte count","w":["An abnormally low erythrocyte count","Too little hemoglobin in each cell","Too many leukocytes in the blood","Too few platelets in the blood"],"e":"Polycythemia is too many erythrocytes (raised hematocrit, thicker blood). Anemia is reduced oxygen-carrying capacity, from too few cells or too little hemoglobin (Blood lecture: hematocrit).","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis."},{"l":3,"t":"Hemoglobin","q":"Most of the oxygen in blood is carried:","c":"Bound to hemoglobin in erythrocytes","w":["Dissolved in the plasma","Bound to albumin in plasma","As bicarbonate ions in plasma","Bound to the surface of platelets"],"e":"Only a small fraction of oxygen dissolves in plasma; nearly all of it rides bound to the iron in hemoglobin (Blood lecture: hemoglobin and oxygen).","lo":"Discuss the importance of oxygen to humans."},{"l":3,"t":"Hemoglobin","q":"What is the first-line treatment for carbon monoxide poisoning?","c":"High-flow oxygen to displace CO from hemoglobin","w":["Iron supplements to make more hemoglobin","Blood thinners to break up clots","Erythropoietin to make more erythrocytes","Rebreathing exhaled air from a bag"],"e":"CO binds hemoglobin far more tightly than oxygen, so tissues starve of oxygen. Giving high concentrations of oxygen (sometimes hyperbaric) speeds CO off hemoglobin (Blood lecture: carbon monoxide).","lo":"Discuss the ramifications of carbon monoxide poisoning.","deep":true},{"l":3,"t":"Blood type","q":"A person with type A blood has:","c":"A antigens on their red cells and anti-B antibodies in plasma","w":["B antigens on their red cells and anti-A antibodies in plasma","A antigens on their red cells and anti-A antibodies in plasma","No antigens on their red cells and both antibodies in plasma","A and B antigens on their red cells and no antibodies in plasma"],"e":"Blood groups are set by the surface antigens on erythrocytes. Plasma carries antibodies against the ABO antigens a person lacks, so type A has anti-B (Blood lecture: blood groups).","lo":"Describe the nature of blood groups and how they are determined.","deep":true},{"l":3,"t":"Thrombocytes","q":"What is the main job of thrombocytes?","c":"Forming a platelet plug and helping blood clot","w":["Carrying oxygen to the tissues","Making antibodies against antigens","Engulfing bacteria at infection sites","Transporting hormones in the blood"],"e":"Platelets stick to damaged vessel walls, clump into a plug and release factors that drive coagulation (Blood lecture: thrombocytes).","lo":"Describe the structure and function of thrombocytes."},{"l":3,"t":"Thrombocytes","q":"Which feature describes a thrombocyte?","c":"A small anucleate fragment of cytoplasm with granules","w":["A large nucleated cell with a lobed nucleus","A biconcave disc packed with hemoglobin","A large cell with a kidney-shaped nucleus","A small cell with a big round nucleus"],"e":"Thrombocytes are tiny, anucleate cell fragments with granules of clotting chemicals; the others describe a neutrophil, an erythrocyte, a monocyte and a lymphocyte (Blood lecture: thrombocytes).","lo":"Describe the structure and function of thrombocytes.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombocytes break off from which large bone-marrow cell?","c":"Megakaryocyte","w":["Myeloblast","Reticulocyte","Monocyte","Lymphoblast"],"e":"Under thrombopoietin (from the liver), megakaryocytes in red bone marrow grow huge and shed thousands of platelets into the blood (Blood lecture: thrombocytes).","lo":"Describe the development and factors affecting development of thrombocytes."},{"l":4,"t":"Respiratory structures & functions","q":"How does the respiratory system make sound?","c":"Air moving past the vocal folds in the larynx","w":["Air moving past the conchae in the nose","Air moving past the epiglottis on swallowing","Air moving through the alveoli in the lungs","Air moving through the nasopharynx into the ear"],"e":"Exhaled air vibrates the vocal folds in the larynx to make sound; the pharynx, oral and nasal cavities shape it into speech (Respiration slides: respiratory functions).","lo":"Outline the major functions of the respiratory system."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"What do the nasal conchae do?","c":"Swirl air so it is warmed, moistened and filtered","w":["Divide the nasal cavity into two halves","Detect odorants across their whole surface","Drain tears from the eye into the nose","Close off the nasopharynx when swallowing"],"e":"The superior, middle and inferior conchae project from the lateral wall and make inhaled air tumble across mucosa that warms, humidifies and filters it. The septum divides the cavity; olfactory epithelium sits only up at the roof (Respiration slides: nose).","lo":"Describe the features of the nose.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"The nasal septum:","c":"Divides the nasal cavity into right and left halves","w":["Separates the nasal cavity from the mouth","Separates the nasal cavity from the cranium","Opens the nasal cavity into the nasopharynx","Forms the lateral wall of the nasal cavity"],"e":"The septum (bone and cartilage) splits the nasal cavity into right and left halves. The palate separates it from the mouth, and the choanae open it into the nasopharynx (Respiration slides: nose).","lo":"Describe the features of the nose."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Which muscle closes the lips, and what nerve supplies it?","c":"Orbicularis oris, facial n. (CN VII)","w":["Orbicularis oris, mandibular n. (CN V3)","Masseter, mandibular n. (CN V3)","Temporalis, facial n. (CN VII)","Mentalis, hypoglossal n. (CN XII)"],"e":"The oral fissure is shaped by muscles of facial expression such as orbicularis oris (CN VII). Moving the mandible is the job of the muscles of mastication (CN V3) (Respiration slides: mouth).","lo":"Describe the mouth and the muscles that affect the oral fissure vs. movement of the mandible.","deep":true},{"l":4,"t":"Larynx & laryngoskeleton","q":"What are the main functions of the larynx?","c":"Protecting the airway and producing sound","w":["Warming the air and sensing smell","Moving food into the esophagus","Exchanging gases with the blood","Draining the middle ear"],"e":"The larynx guards the lower airway (closing during swallowing, coughing out irritants) and holds the vocal folds for phonation (Respiration slides: larynx).","lo":"Describe the larynx, where is it located, how it relates to adjacent structures, and its functions."},{"l":4,"t":"Laryngeal muscles","q":"Which of these is an extrinsic laryngeal muscle?","c":"Sternothyroid","w":["Cricothyroid","Posterior crico-arytenoid","Lateral crico-arytenoid","Transverse arytenoid"],"e":"Extrinsic muscles (suprahyoid and infrahyoid, e.g., sternothyroid) move the whole larynx. Intrinsic muscles (e.g., cricothyroid, the crico-arytenoids) move its cartilages to change the rima glottidis and the vocal folds (Respiration slides: laryngeal muscles).","lo":"Describe and give examples of extrinsic vs. intrinsic muscles of the larynx and their functions."},{"l":4,"t":"Laryngeal muscles","q":"Which intrinsic muscle opens (abducts) the rima glottidis?","c":"Posterior crico-arytenoid","w":["Lateral crico-arytenoid","Transverse arytenoid","Thyro-arytenoid","Cricothyroid"],"e":"The posterior crico-arytenoid is the only abductor, opening the airway for breathing. The lateral crico-arytenoid and arytenoids close it, the cricothyroid tenses the folds and the thyro-arytenoid relaxes them (Respiration slides: laryngeal muscles).","lo":"Outline the effects of intrinsic muscle actions on the rima glottidis, ventilation pathway, and phonation.","deep":true},{"l":4,"t":"Laryngeal neurovasculature","q":"The inferior laryngeal artery is a branch of the:","c":"Inferior thyroid a. (from the thyrocervical trunk)","w":["Superior thyroid a. (from the external carotid)","Internal carotid a.","Vertebral a.","Internal thoracic a."],"e":"Larynx supply: superior laryngeal a. from the superior thyroid a. (external carotid), and inferior laryngeal a. from the inferior thyroid a. (thyrocervical trunk of the subclavian), which travels with the recurrent laryngeal n. (Respiration slides: laryngeal vessels).","lo":"Outline the blood supply of the larynx, noting sources, pathways, and adjacent anatomical relationships.","deep":true},{"l":4,"t":"Pulmonary circulation","q":"Which vessels carry oxygenated blood from the lungs to the left atrium?","c":"Pulmonary veins","w":["Pulmonary arteries","Bronchial arteries","Bronchial veins","Pulmonary trunk"],"e":"Right ventricle → pulmonary trunk → pulmonary arteries → alveolar capillaries → pulmonary veins → left atrium → left ventricle (Respiration slides: pulmonary circulation).","lo":"Discuss the pathways of blood from the right ventricle to the lungs and back to the left ventricle."},{"l":4,"t":"Lungs","q":"The costal surface of the lung faces the:","c":"Ribs and intercostal spaces","w":["Heart and mediastinum","Dome of the diaphragm","Root of the neck","Vertebral bodies only"],"e":"Lung surfaces: costal (against the rib cage), mediastinal (medial, with the hilum), and diaphragmatic (the base, on the diaphragm). The apex rises into the root of the neck (Respiration slides: lungs).","lo":"Describe the surfaces of the lungs."},{"l":4,"t":"Pleurae","q":"Why can air in the pleural cavity collapse a lung?","c":"It breaks the pleural seal, so the lung recoils away from the chest wall","w":["It fills the alveoli, so gas can't cross into the blood","It blocks the bronchi, so air can't reach the lung","It compresses the heart, so blood can't reach the lung","It dissolves the surfactant, so the alveoli stick shut"],"e":"The thin film of pleural fluid couples the lung to the chest wall. Air (pneumothorax) breaks that coupling, so the lung's elastic recoil collapses it (atelectasis) (Respiration slide 101).","lo":"Discuss the clinical ramifications of various substances entering the pleural cavity.","deep":true},{"l":5,"t":"Urinary structures & functions","q":"Which structure conducts urine from the kidneys to the urinary bladder?","c":"Ureter","w":["Urethra","Nephron","Renal pelvis","Collecting duct"],"e":"The ureters carry urine from the hila of the kidneys down to the urinary bladder. The nephron is the functional unit of the kidney, and the urethra voids the bladder to the outside (Urinary slides 3 and 6).","lo":"Outline the major structures of the urinary system.","said":"Dr. Fox's own check question at the end of the Urinary Structures & Functions video.","note":"Your slide note: nephron = functional unit of kidney; urethra = urine to external."},{"l":5,"t":"Urinary structures & functions","q":"Which urinary organs are paired and retroperitoneal?","c":"Kidneys and ureters","w":["Urinary bladder and urethra","Kidneys and urinary bladder","Ureters and urethra","Urethra and kidneys"],"e":"The kidneys and ureters are paired and retroperitoneal. The urinary bladder and urethra are unpaired and pelvic (Urinary slide 3).","lo":"Outline the major structures of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"What does the term 'renal' refer to, compared with 'urinary'?","c":"The kidneys alone","w":["The whole urinary system","The bladder and urethra alone","The ureters alone","Everything distal to the kidneys"],"e":"'Renal' means the kidneys specifically. 'Urinary' is the inclusive term for the kidneys plus everything distal that eliminates urine (Urinary slide 3; Structures & Functions video).","lo":"Outline the major structures of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"In what order does urine pass through the urinary system?","c":"Kidney, ureter, urinary bladder, urethra","w":["Kidney, urethra, urinary bladder, ureter","Ureter, kidney, urinary bladder, urethra","Kidney, urinary bladder, ureter, urethra","Kidney, ureter, urethra, urinary bladder"],"e":"The kidneys make filtrate that becomes urine, the ureters carry it from the hila to the bladder, the bladder stores it, and the urethra drains it to the outside (Urinary slide 3).","lo":"Outline the major structures of the urinary system.","deep":true},{"l":5,"t":"Urinary structures & functions","q":"Which structure drains the urinary bladder to the outside world?","c":"Urethra","w":["Ureter","Renal pelvis","Major calyx","Nephron loop"],"e":"The urethra voids the urinary bladder to the external world (Urinary slides 3 and 58).","lo":"Outline the major structures of the urinary system."},{"l":5,"t":"Urinary structures & functions","q":"What is the functional unit of the kidney?","c":"Nephron","w":["Renal pyramid","
