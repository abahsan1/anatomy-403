 emphasis on the Abdominal wall & pelvis."},{"l":6,"t":"Lymph nodes & pathways II","q":"Superficial infections of the lower abdomen (below the umbilicus) and lower limb tend to be picked up by which group of lymph nodes?","c":"Superficial inguinal","w":["Axillary","Lateral aortic","Hilar","Para-aortic"],"e":"Skin below the umbilicus and the lower limb's superficial lymph both drain to the superficial inguinal nodes (Lymphatics slides 41 to 43).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Abdominal wall & pelvis.","said":"Dr. Fox's own check question (Lymphatics slide 43)."},{"l":6,"t":"Lymph nodes & pathways II","q":"Superficial lymph from below the umbilicus follows which path?","c":"Superficial inguinal, deep inguinal, then external iliac nodes","w":["Deep inguinal, superficial inguinal, then external iliac nodes","Superficial inguinal, external iliac, then deep inguinal nodes","Axillary, then apical nodes, then the subclavian trunk","External iliac, deep inguinal, then superficial inguinal nodes"],"e":"Below the transumbilical plane: superficial inguinal → deep inguinal → external iliac nodes, and on toward the cisterna chyli (Lymphatics slide 41).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Abdominal wall & pelvis.","deep":true,"note":"Your slide note: superficial inguinal nodes are superficial to the iliac nodes; lymph eventually gets to the cisterna chyli."},{"l":6,"t":"Lymph nodes & pathways II","q":"Which plane divides abdominal skin that drains to the axilla from skin that drains to the groin?","c":"The transumbilical plane","w":["The transpyloric plane","The subcostal plane","The intertubercular plane","The midclavicular plane"],"e":"The transumbilical plane is the watershed: above it to axillary nodes, below it to superficial inguinal nodes (Lymphatics slide 41).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Abdominal wall & pelvis.","deep":true},{"l":6,"t":"Lymph nodes & pathways II","q":"Superficial lymph of the lower limb follows which vessels?","c":"Superficial veins, such as the saphenous veins","w":["Deep arteries, such as the femoral artery","Deep veins, such as the popliteal vein","Lymph trunks, such as the lumbar trunks","Cutaneous nerves, such as the sural nerve"],"e":"In the lower limb, superficial lymph follows the superficial veins (great and lesser saphenous); deep lymph follows the deep arteries (Lymphatics slide 42).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs.","note":"Your slide note: deep = artery; superficial = vein (saphenous veins in this case)."},{"l":6,"t":"Lymph nodes & pathways II","q":"Deep lymph of the lower limb follows which vessels?","c":"Deep arteries","w":["Superficial veins","Saphenous veins","Cutaneous nerves","Lumbar trunks"],"e":"Deep lymph follows the deep arteries; superficial lymph follows superficial veins like the saphenous veins (Lymphatics slide 42).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs.","note":"Your slide note: deep = artery."},{"l":6,"t":"Lymph nodes & pathways II","q":"Superficial lymph of the lower limb first reaches which nodes?","c":"Superficial inguinal nodes","w":["Deep inguinal nodes","External iliac nodes","Common iliac nodes","Lateral aortic nodes"],"e":"Lymph following the superficial veins drains to the superficial inguinal nodes, then deep inguinal, then external iliac nodes (Lymphatics slide 42).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs."},{"l":6,"t":"Lymph nodes & pathways II","q":"Lymph following the deep arteries of the leg drains to which nodes next?","c":"Deep inguinal nodes, then external iliac nodes","w":["Superficial inguinal nodes, then axillary nodes","External iliac nodes, then deep inguinal nodes","Superficial inguinal nodes, then celiac nodes","Common iliac nodes, then deep inguinal nodes"],"e":"Deep lymph (with the arteries) goes to the deep inguinal nodes, then the external iliac nodes (Lymphatics slide 42).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs.","deep":true},{"l":6,"t":"Lymph nodes & pathways II","q":"An infected blister on the foot causes a tender lump in the groin. Which nodes?","c":"Superficial inguinal nodes","w":["Popliteal nodes","Axillary nodes","Lateral aortic nodes","Celiac nodes"],"e":"Skin lymph from the foot runs with the saphenous veins to the superficial inguinal nodes in the groin (Lymphatics slides 42 and 43).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs.","deep":true},{"l":6,"t":"Lymph nodes & pathways II","q":"Select ALL correct steps in lower-limb lymph flow.","c":["Superficial-vein lymph → superficial inguinal nodes","Superficial inguinal → deep inguinal nodes","Deep-artery lymph → deep inguinal nodes","Deep inguinal → external iliac nodes"],"w":["Superficial inguinal → axillary nodes","Deep-artery lymph → superficial inguinal nodes","External iliac → deep inguinal nodes","Deep inguinal → superficial inguinal nodes"],"e":"Superficial (veins) → superficial inguinal → deep inguinal → external iliac. Deep (arteries) → deep inguinal → external iliac (Lymphatics slide 42).","lo":"Describe the flow of lymph from capillaries to ducts, with emphasis on the Lower limbs.","deep":true}];
const BLANKS=[{"l":1,"t":"Cardiovascular system","s":"Arteries carry blood [[away from]] the heart; veins carry blood [[toward|towards|to]] the heart."},{"l":1,"t":"Cardiovascular system","s":"Blood is a [[liquid]] connective tissue made of [[plasma]] and [[formed elements]]."},{"l":1,"t":"Cardiovascular system","s":"Lymphatics pick up excess [[interstitial fluid|filtrate]] and return it to the [[venous|veins]] circulation."},{"l":1,"t":"Cardiovascular system","s":"Exchange of nutrients and wastes happens in the [[capillary beds|capillaries]], between arterioles and [[venules]]."},{"l":1,"t":"Thoracic cavity","s":"The thoracic cavity is bounded superiorly by the [[first ribs]] and inferiorly by the [[diaphragm]]."},{"l":1,"t":"Thoracic cavity","s":"The [[parietal]] pleura adheres to the walls and the [[visceral]] pleura adheres to the lungs."},{"l":1,"t":"Thoracic cavity","s":"The thoracic plane runs from the [[sternal angle|angle of louis]] to the intervertebral disc between [[T4 and T5|T4/T5|T4-T5]]."},{"l":1,"t":"Thoracic cavity","s":"The middle mediastinum is defined by the [[pericardium]]; the posterior mediastinum extends down to [[T12]]."},{"l":1,"t":"Pericardium","s":"The visceral layer of the serous pericardium is also called the [[epicardium]]."},{"l":1,"t":"Pericardium","s":"Between the parietal and visceral layers of serous pericardium is the [[pericardial cavity]]."},{"l":1,"t":"Pericardium","s":"The fibrous pericardium is innervated by the [[phrenic]] nerves, from spinal levels [[C3 to C5|C3-C5|C3-5|C3, C4, C5]]."},{"l":1,"t":"Pericardium","s":"Fluid that constricts the heart in the pericardial cavity causes cardiac [[tamponade]], treated by [[pericardiocentesis]].","said":"Dr. Fox describes tamponade as feeling like crushing substernal pressure."},{"l":1,"t":"Pericardium","s":"The amount of subserosal adipose tissue is proportional to [[cardiometabolic]] risk."},{"l":1,"t":"Heart basics","s":"From outside in, the heart wall is the [[epicardium]], [[myocardium]] and [[endocardium]]."},{"l":1,"t":"Heart basics","s":"The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."},{"l":1,"t":"Heart basics","s":"Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."},{"l":1,"t":"Heart basics","s":"Cells joined by gap junctions act as one, a [[functional syncytium]]."},{"l":1,"t":"Heart basics","s":"The [[chordae tendineae]] anchor the AV valve cusps to the [[papillary]] muscles."},{"l":1,"t":"Heart basics","s":"The right atrium receives blood from the [[superior]] and inferior venae cavae and the [[coronary sinus]]."},{"l":1,"t":"Heart basics","s":"The two semilunar valves are the [[pulmonary|pulmonic]] valve and the [[aortic]] valve."},{"l":1,"t":"External features","s":"The left border is also called the [[obtuse]] margin; the inferior border is the [[acute]] margin."},{"l":1,"t":"External features","s":"The right border of the heart is formed by the [[right atrium]]."},{"l":1,"t":"External features","s":"The base of the heart faces [[posteriorly|posterior]] and is formed mostly by the [[left atrium]]."},{"l":1,"t":"Internal features","s":"All four valves sit roughly in one plane, anchored by the [[fibrous skeleton]] of the heart, which lines up with the [[coronary]] sulcus."},{"l":1,"t":"Internal features","s":"The smooth posterior part of the right atrium is the [[sinus venarum]], separated from the pectinate part by the [[crista terminalis]]."},{"l":1,"t":"Internal features","s":"The [[fossa ovalis]] on the interatrial septum is the remnant of the fetal [[foramen ovale]]."},{"l":1,"t":"Internal features","s":"The septomarginal trabecula, or [[moderator band]], carries the [[right bundle branch|right bundle]]."},{"l":1,"t":"Internal features","s":"The RCA arises from the [[right]] aortic sinus; the sinus above the posterior cusp is the [[non-coronary|noncoronary|non coronary]] sinus."},{"l":1,"t":"Coronary arteries","s":"The SA nodal branch comes from the RCA about [[60]] percent of the time."},{"l":1,"t":"Coronary arteries","s":"The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."},{"l":1,"t":"Coronary arteries","s":"Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."},{"l":1,"t":"Cardiovascular system","s":"In the [[capillary beds|capillaries|capillary bed]], nutrients leave the blood for the interstitial fluid and [[wastes|waste products|waste]] are picked up by the blood.","note":"You asked what this question means: “exchange” is nutrients and wastes crossing between the blood and the fluid around the cells."},{"l":1,"t":"Coronary arteries","s":"The right marginal branch follows the [[inferior]] border to the right ventricle wall; at the crux the RCA gives the [[AV nodal]] branch and the [[posterior interventricular|PDA|posterior descending]] branch.","note":"You wanted to learn the coronary vessels, their branches, pathways and what each one perfuses."},{"l":1,"t":"Coronary arteries","s":"The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery."},{"l":1,"t":"Cardiac veins","s":"The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch."},{"l":1,"t":"Cardiac veins","s":"The small cardiac vein accompanies the [[right marginal]] branch along the [[inferior]] border and drains into the [[coronary sinus]].","note":"You had no idea vein and artery pairs were covered: Cardiac Veins video, 01:08 to 03:24."},{"l":1,"t":"Cardiac veins","s":"Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium."},{"l":1,"t":"Cardiac veins","s":"Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium."},{"l":1,"t":"Conduction and control","s":"The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm."},{"l":1,"t":"Conduction and control","s":"The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm."},{"l":1,"t":"Conduction and control","s":"During [[isovolumetric]] ventricular contraction, all four valves are closed."},{"l":1,"t":"Conduction and control","s":"Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]]."},{"l":1,"t":"Conduction and control","s":"The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]]."},{"l":1,"t":"Conduction and control","s":"A resting rate under 60 bpm is [[bradycardia]]; over 100 bpm is [[tachycardia]]."},{"l":1,"t":"Auscultation","s":"S1 is heard when the [[AV|atrioventricular]] valves close; S2 when the [[semilunar]] valves close."},{"l":1,"t":"Auscultation","s":"The aortic valve is heard at the [[right]] 2nd intercostal space; the mitral valve at the left 5th intercostal space, [[midclavicular]] line."},{"l":1,"t":"Auscultation","s":"S3 is the [[Kentucky]] gallop; S4 is the [[Tennessee]] gallop."},{"l":1,"t":"Auscultation","s":"Auscultation sites use the [[patient's|patient|patients]] right and left: facing the patient, the aortic site (their right 2nd intercostal space) is on your [[left]].","note":"Right/left of the sternum means the patient's right/left, not the examiner's."},{"l":2,"t":"Vessels and circulation","s":"The three layers of a vessel wall, from inside out, are the tunica [[interna|intima]], tunica [[media]] and tunica [[externa|adventitia]]."},{"l":2,"t":"Vessels and circulation","s":"Elastic arteries such as the aorta act as pressure [[reservoirs|reservoir]]; arterioles are [[resistance]] vessels; capillaries are [[exchange]] vessels."},{"l":2,"t":"Vessels and circulation","s":"Veins accompanying an artery and named for it are called venae [[comitantes]]."},{"l":2,"t":"Vessels and circulation","s":"A clot inside a vessel is a [[thrombus]]; when it travels and lodges elsewhere it is an [[embolism|embolus]].","note":"Embolus = a mobile thrombus."},{"l":2,"t":"Vessels and circulation","s":"The [[hypophyseal]] portal system connects the hypothalamus to the anterior pituitary; the renal portal system is [[arterial]]."},{"l":2,"t":"Vessels and circulation","s":"In the renal portal system, blood leaves the glomerulus through an [[efferent arteriole|efferent arterioles|efferent]] and flows into the [[peritubular capillaries|peritubular|peritubular capillary]], so the vessel linking the two beds is arterial.","note":"You asked why the renal portal system is arterial."},{"l":2,"t":"Aorta and branches","s":"The arch of the aorta sits at about [[T4]], and the abdominal aorta bifurcates into the common iliac arteries at about [[L4]]."},{"l":2,"t":"Aorta and branches","s":"The celiac trunk serves the [[foregut]], the superior mesenteric a. the [[midgut]], and the inferior mesenteric a. the [[hindgut]]."},{"l":2,"t":"Common carotid artery","s":"The [[maxillary]] artery supplies the deep face; the [[superficial temporal]] artery supplies the scalp."},{"l":2,"t":"Common carotid artery","s":"The [[vertebral]] arteries enter the skull through foramen magnum and supply the [[posterior]] brain."},{"l":2,"t":"Common carotid artery","s":"The common carotid ends by splitting into the internal and external carotids; the ophthalmic a., which supplies the orbit and forehead, is a branch of the [[internal carotid|internal carotid artery|ICA]].","note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common carotid artery","s":"The common carotid ascends the neck in the carotid [[sheath]] with the internal jugular v. and vagus n.; only the [[internal carotid|internal carotid artery|ICA]] then passes through the carotid canal into the skull.","note":"You asked whether only the internal carotid goes through the carotid sheath."},{"l":2,"t":"Common iliac artery","s":"The femoral artery becomes the popliteal artery at the [[adductor hiatus]]."},{"l":2,"t":"Common iliac artery","s":"The internal iliac artery has an [[anterior]] division serving pelvic viscera and perineum and a [[posterior]] division serving the posterior pelvic wall."},{"l":2,"t":"Subclavian artery and upper limb","s":"The parts of the subclavian artery are defined by the [[anterior scalene]] muscle; the parts of the axillary artery by [[pectoralis minor|pec minor]]."},{"l":2,"t":"Subclavian artery and upper limb","s":"The axillary artery becomes the brachial artery at [[teres major]]."},{"l":2,"t":"Subclavian artery and upper limb","s":"The radial artery feeds the [[deep]] palmar arch; the ulnar artery feeds the [[superficial]] palmar arch."},{"l":2,"t":"Subclavian artery and upper limb","s":"The [[Allen]] test checks for an anastomosis between the radial and [[ulnar]] arteries."},{"l":2,"t":"Superior vena cava","s":"Each brachiocephalic vein is formed by the [[internal jugular]] vein and the [[subclavian]] vein, which meet at the venous angle."},{"l":2,"t":"Superior vena cava","s":"The [[basilic]] vein joins the brachial veins to form the axillary vein; the [[cephalic]] vein drains into the axillary vein later."},{"l":2,"t":"Inferior vena cava","s":"The IVC passes through the diaphragm at about [[T8]], the esophagus at [[T10]], and the aorta at [[T12]]."},{"l":2,"t":"Inferior vena cava","s":"The left gonadal vein drains into the left [[renal]] vein; the right gonadal vein drains directly into the [[IVC|inferior vena cava]]."},{"l":2,"t":"Hepatic portal system","s":"The hepatic portal vein is formed by the [[superior mesenteric]] vein and the [[splenic]] vein.","note":"Mnemonic: the liver gets an SMS. S + MS = Splenic v. + Superior Mesenteric v. = hepatic portal v. The inferior mesenteric v. is not part of the SMS; it drains into the splenic v. first (Updated Vasculature slide 66)."},{"l":2,"t":"Hepatic portal system","s":"Blood leaves the liver sinusoids through the [[hepatic]] veins into the [[IVC|inferior vena cava]]."},{"l":3,"t":"Introduction to blood","s":"Whole blood is about [[55]]% plasma and [[45]]% formed elements."},{"l":3,"t":"Introduction to blood","s":"Blood pH is kept between [[7.35]] and [[7.45]]; below that is acidemia and above it is alkalemia."},{"l":3,"t":"Introduction to blood","s":"In acidemia the lungs [[hyperventilate]] to blow off CO2; in alkalemia they [[hypoventilate]] to retain it.","note":"Hyperventilation moves more gas through the lungs; hypoventilation decreases gas exchange."},{"l":3,"t":"Introduction to blood","s":"The [[lungs]] adjust blood pH quickly; the [[kidneys]] adjust it slowly."},{"l":3,"t":"Blood plasma","s":"[[Albumins|Albumin]] maintain oncotic pressure; [[fibrinogens|fibrinogen]] are needed for clotting."},{"l":3,"t":"Blood plasma","s":"Gamma globulins are also called [[immunoglobulins|antibodies]]."},{"l":3,"t":"Formed elements","s":"Leukocytes from most to least abundant: neutrophils, [[lymphocytes]], [[monocytes]], eosinophils, basophils.","note":"Never Let Monkeys Eat Bananas."},{"l":3,"t":"Formed elements","s":"[[Lymphoid]] stem cells give rise to T cells, B cells and natural killer cells; [[myeloid]] stem cells give rise to nearly everything else.","note":"Lymphoid stem cells become lymphocytes, which release antibodies."},{"l":3,"t":"Formed elements","s":"[[Erythropoietin|EPO]] stimulates red blood cell production; [[thrombopoietin|TPO]] stimulates platelet production."},{"l":3,"t":"Erythrocytes","s":"Erythrocytes are [[biconcave]] discs that lack a [[nucleus]] and mitochondria."},{"l":3,"t":"Erythrocytes","s":"Hematocrit below the normal range is [[anemia]]; above it is [[polycythemia]]."},{"l":3,"t":"Hemoglobin","s":"Adult hemoglobin A is [[2α2β|2 alpha 2 beta|2a2b]]; fetal hemoglobin is [[2α2γ|2 alpha 2 gamma|2a2g]]."},{"l":3,"t":"Hemoglobin","s":"Low oxygen in the blood is [[hypoxemia]]; low oxygen in the tissues is [[hypoxia]]."},{"l":3,"t":"Hemoglobin","s":"Hemoglobin's affinity for carbon monoxide is about [[240]] times its affinity for oxygen."},{"l":3,"t":"Blood type","s":"Type [[AB]] is the universal recipient; type [[O]] is the universal donor.","note":"AB: universal recipient. O: can only receive from O, but can donate to everyone."},{"l":3,"t":"Blood type","s":"In hemolytic disease of the newborn, maternal [[IgG]] antibodies cross the placenta; it is prevented with [[RhoGAM]]."},{"l":3,"t":"Leukocytes","s":"Monocytes mature in tissues into [[macrophages]] or [[dendritic]] cells."},{"l":3,"t":"Leukocytes","s":"Eosinophils release major basic protein, which kills [[endoparasites|parasites]]; basophils release [[histamine]] and heparin."},{"l":3,"t":"Thrombocytes","s":"Platelets are shed from [[megakaryocytes]] and old ones are removed by macrophages in the [[spleen]]."},{"l":3,"t":"Thrombocytes","s":"Platelets bind exposed collagen through [[von Willebrand]] factor, and [[thrombin]] converts fibrinogen to fibrin."},{"l":3,"t":"Thrombocytes","s":"Fewer than 150,000 platelets/µL is [[thrombocytopenia]]; more than 400,000/µL is [[thrombocytosis]]."},{"l":4,"t":"Respiratory structures & functions","s":"The upper respiratory tract is everything [[proximal|superior|above]] to the vocal folds; the lower tract is everything [[distal|inferior|below]] to them."},{"l":4,"t":"Respiratory structures & functions","s":"In acidemia we [[increase|speed up|raise]] ventilation to blow off [[CO2|carbon dioxide]], a volatile acid."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","s":"The nasal cavity ends posteriorly at the [[choanae|choana]], which open into the [[nasopharynx]]."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","s":"The mucosa-covered bony shelves on the lateral nasal wall are the [[conchae|nasal conchae]]; the spaces below them are the [[meatuses|meatus|nasal meatuses]]."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","s":"Orbicularis oris is supplied by the [[facial|CN VII|CN 7]] nerve; the muscles of mastication by the [[mandibular|V3|CN V3]] nerve."},{"l":4,"t":"Pharynx","s":"From top to bottom, the pharynx is the [[nasopharynx]], [[oropharynx]] and [[laryngopharynx|hypopharynx]]."},{"l":4,"t":"Pharynx","s":"The adenoid is the [[pharyngeal]] tonsil; the tonsil on the root of the tongue is the [[lingual]] tonsil."},{"l":4,"t":"Pharynx","s":"The ring of tonsils around the naso- and oropharynx is [[Waldeyer's|Waldeyer|Waldeyers]] ring."},{"l":4,"t":"Pharynx","s":"The [[piriform]] recesses lie on either side of the larynx, inside the [[laryngopharynx]]; swallowed pills can lodge there.","note":"Guessed r-ph8: where the piriform recess is"},{"l":4,"t":"Pharyngeal muscles & nervous plexus","s":"The pharyngeal constrictors meet posteriorly at the pharyngeal [[raphe]]."},{"l":4,"t":"Pharyngeal muscles & nervous plexus","s":"Stylopharyngeus is supplied by the [[glossopharyngeal|CN IX|CN 9]] nerve, not the pharyngeal plexus."},{"l":4,"t":"Larynx & laryngoskeleton","s":"The [[cricoid]] cartilage is the only laryngeal cartilage that completely encircles the airway."},{"l":4,"t":"Larynx & laryngoskeleton","s":"The [[arytenoid|arytenoids]] cartilages are the most kinetic; they pivot and glide on the cricoid."},{"l":4,"t":"Larynx & laryngoskeleton","s":"The trachea is suspended from the cricoid by the [[cricotracheal]] ligament."},{"l":4,"t":"Larynx & laryngoskeleton","s":"The larynx sits [[inferior|below]] to the hyoid, [[anterior|in front]] to the laryngopharynx and [[superior|proximal|above]] to the trachea.","note":"Guessed r-lx1: where the larynx sits"},{"l":4,"t":"Laryngeal membranes & cavities","s":"The gap between the vocal folds is the rima [[glottidis]]; the gap between the vestibular folds is the rima [[vestibuli]]."},{"l":4,"t":"Laryngeal membranes & cavities","s":"The [[quadrangular]] membranes funnel air in; the [[conus elasticus]] funnels air out."},{"l":4,"t":"Laryngeal membranes & cavities","s":"An emergency cricothyrotomy goes through the [[median cricothyroid|cricothyroid]] ligament."},{"l":4,"t":"Laryngeal muscles","s":"Vocal folds are [[abducted]] for ventilation and [[adducted]] for phonation."},{"l":4,"t":"Laryngeal muscles","s":"Pitch rises as vocal ligament [[tension]] increases."},{"l":4,"t":"Intrinsic laryngeal muscles","s":"The only intrinsic muscles that open the rima glottidis are the [[posterior crico-arytenoid|posterior cricoarytenoid|posterior crico-arytenoids|posterior cricoarytenoids|PCA]] muscles."},{"l":4,"t":"Intrinsic laryngeal muscles","s":"The cricothyroid tips the thyroid cartilage [[anteriorly|forward|anterior]] and down, raising pitch."},{"l":4,"t":"Intrinsic laryngeal muscles","s":"The lateral fibers of the thyro-arytenoid pull the arytenoids [[forward|anteriorly|toward the thyroid]], which [[decreases|lowers|reduces]] vocal ligament tension and lowers pitch.","note":"Guessed r-il7: thyro-arytenoid lowers pitch"},{"l":4,"t":"Laryngeal neurovasculature","s":"Every intrinsic laryngeal muscle except the [[cricothyroid]] is supplied by the [[recurrent laryngeal]] nerves."},{"l":4,"t":"Laryngeal neurovasculature","s":"The internal branch of the superior laryngeal nerve serves mucosa [[above|proximal to|superior to]] the vocal folds; the recurrent laryngeal serves mucosa [[below|distal to|inferior to]] them."},{"l":4,"t":"Laryngeal neurovasculature","s":"The inferior laryngeal artery and recurrent laryngeal nerve ascend together in the [[tracheo-esophageal|tracheoesophageal]] groove."},{"l":4,"t":"Laryngeal neurovasculature","s":"The [[superior thyroid]] artery gives off the superior laryngeal artery, which pierces the thyrohyoid membrane with the [[internal]] branch of the superior laryngeal nerve.","note":"Guessed r-nv7: superior laryngeal artery"},{"l":4,"t":"Tracheobronchial tree","s":"The trachea bifurcates at the [[thoracic plane|sternal angle]], about T4/5."},{"l":4,"t":"Tracheobronchial tree","s":"Secondary bronchi are also called [[lobar]] bronchi; tertiary bronchi are also called [[segmental]] bronchi."},{"l":4,"t":"Tracheobronchial tree","s":"The conducting zone ends at the [[terminal]] bronchioles; gas exchange begins at the [[respiratory]] bronchioles."},{"l":4,"t":"Alveoli","s":"Type [[I|1|one]] alveolar cells are simple squamous and handle gas exchange; type [[II|2|two]] cells secrete surfactant."},{"l":4,"t":"Alveoli","s":"Surfactant [[reduces|lowers|decreases]] surface tension so the alveoli don't [[collapse]]."},{"l":4,"t":"Pulmonary circulation","s":"Bronchial arteries are [[systemic]] vessels from the thoracic [[aorta]]."},{"l":4,"t":"Pulmonary circulation","s":"The pulmonary trunk leaves the [[right]] ventricle; the pulmonary veins return oxygenated blood to the [[left]] atrium."},{"l":4,"t":"Lungs","s":"The right lung has [[three|3]] lobes; the left lung has [[two|2]]."},{"l":4,"t":"Lungs","s":"The right lung's horizontal fissure separates the [[superior|upper]] lobe from the [[middle]] lobe."},{"l":4,"t":"Muscles of ventilation","s":"Boyle's law: pressure is [[inversely|inverse]] proportional to volume."},{"l":4,"t":"Muscles of ventilation","s":"“C3, 4, 5 keeps the diaphragm alive”: the [[phrenic]] nerves."},{"l":4,"t":"Muscles of ventilation","s":"The central tendon of the diaphragm holds the caval hiatus for the [[inferior vena cava|IVC]]."},{"l":4,"t":"Pleurae","s":"[[Visceral]] pleura covers the lungs; [[parietal]] pleura lines the pulmonary cavity."},{"l":4,"t":"Pleurae","s":"Air in the pleural cavity is a [[pneumothorax]]; a collapsed lung is [[atelectasis]]."},{"l":4,"t":"Pleurae","s":"Draining fluid from the pleural cavity with a needle is [[thoracentesis]]."},{"l":4,"t":"Pleurae","s":"The cupula is lined by [[cervical]] pleura, which is part of the [[parietal]] pleura.","note":"Guessed r-pl3: cervical pleura"},{"l":5,"t":"Urinary structures & functions","s":"The kidneys and [[ureters|ureter]] are paired and retroperitoneal; the urinary bladder and [[urethra]] are unpaired and pelvic."},{"l":5,"t":"Urinary structures & functions","s":"The kidneys make [[calcitriol]] to raise blood calcium, [[erythropoietin|EPO]] for red blood cell production, and [[renin]] to start the RAA pathway."},{"l":5,"t":"Urinary structures & functions","s":"To fix pH the kidneys secrete [[H+|protons|hydrogen ions]] and conserve [[bicarbonate|HCO3-|HCO3]]."},{"l":5,"t":"Kidneys","s":"The lateral border of the kidney is [[convex]] and the medial border is [[concave]]."},{"l":5,"t":"Kidneys","s":"Accessory renal arteries that supply a pole of the kidney are called [[polar]] arteries."},{"l":5,"t":"Kidneys","s":"At the hilum, the major calices form the [[renal pelvis]], which drains into the [[ureter]]."},{"l":5,"t":"Kidneys","s":"Cortex between neighbouring pyramids forms the renal [[columns|column]]; cortex between a pyramid's base and the capsule is the [[cortical arch]]."},{"l":5,"t":"Kidneys","s":"The apex of a renal pyramid is the renal [[papilla|papillae]], which is cupped by a [[minor calyx|minor calix|minor calices]]."},{"l":5,"t":"Renal fascial spaces","s":"The [[perirenal]] space is inside the renal fascia; the [[pararenal]] space is outside it."},{"l":5,"t":"Renal fascial spaces","s":"The renal hila lie at the [[transpyloric]] plane, at about vertebral level [[L1]]."},{"l":5,"t":"Renal fascial spaces","s":"When lost perirenal fat lets the kidney drop and kink the ureter, the condition is [[nephroptosis]]."},{"l":5,"t":"Renal vasculature","s":"Segmental arteries are [[end]] arteries, so a partial [[nephrectomy]] can remove one renal segment."},{"l":5,"t":"Renal vasculature","s":"A renal lobe is a [[pyramid]] plus its surrounding cortex; a lobule is cortical arch around one [[medullary ray]]."},{"l":5,"t":"Renal vasculature","s":"[[Interlobar]] arteries run between the medulla and renal columns; [[arcuate]] arteries run between the medulla and cortical arch."},{"l":5,"t":"Renal vasculature","s":"In the renal portal system, [[efferent]] arterioles carry blood from the glomeruli to the peritubular capillaries and [[vasa recta]]."},{"l":5,"t":"Renal vasculature","s":"The left renal vein passes between the [[superior mesenteric artery|SMA|superior mesenteric a.]] and the aorta; squeezing it there is called [[nutcracker]] syndrome."},{"l":5,"t":"Renal vasculature","s":"The left renal vein receives the left [[gonadal]], left suprarenal and left inferior [[phrenic]] veins."},{"l":5,"t":"Nephrons","s":"Moving material from peritubular capillaries into the tubules is tubular [[secretion]]; moving it from filtrate back to the blood is tubular [[reabsorption]]."},{"l":5,"t":"Nephrons","s":"The visceral layer of the glomerular capsule is made of [[podocytes]], whose feet leave filtration [[slits]]."},{"l":5,"t":"Nephrons","s":"The primary site of reabsorption is the [[proximal convoluted tubule|PCT|proximal tubule]]; water follows [[salts|salt|sodium|Na+]]."},{"l":5,"t":"Nephrons","s":"The [[macula densa]] in the distal convoluted tubule senses [[NaCl|salt|sodium chloride]] as a proxy for GFR."},{"l":5,"t":"Nephrons","s":"In the DCT, [[intercalated]] cells adjust pH, and [[principal]] cells reabsorb Na+ and water."},{"l":5,"t":"Nephrons","s":"Alcohol is a diuretic because it inhibits [[vasopressin|ADH|antidiuretic hormone]]."},{"l":5,"t":"Nephrons","s":"[[Juxtamedullary]] nephrons have long nephron loops and make more concentrated urine; [[cortical]] nephrons are the most common."},{"l":5,"t":"Renal regulation","s":"The two intrinsic controls of the kidney are the [[myogenic]] response and [[tubuloglomerular]] feedback."},{"l":5,"t":"Renal regulation","s":"Constricting the afferent arteriole [[lowers|decreases|reduces]] GFR; constricting the efferent arteriole [[raises|increases]] GFR."},{"l":5,"t":"Renal regulation","s":"Renin converts angiotensinogen to angiotensin [[I|1|one]], and [[ACE|angiotensin converting enzyme]] converts it to angiotensin II."},{"l":5,"t":"Renal regulation","s":"Angiotensin II makes the adrenal cortex release [[aldosterone]] and the hypothalamus release [[ADH|vasopressin|antidiuretic hormone]]."},{"l":5,"t":"Renal regulation","s":"When present, the [[least]] thoracic splanchnic nerve innervates the renal plexus directly."},{"l":5,"t":"Excretory pathways & ureters","s":"Urine passes from minor calices to [[major calices|major calyx|major calyces]] to the [[renal pelvis]] to the ureter."},{"l":5,"t":"Excretory pathways & ureters","s":"The ureters cross into the pelvis at the bifurcation of the [[common iliac]] artery, then pass under the [[uterine]] artery."},{"l":5,"t":"Excretory pathways & ureters","s":"The longest part of the ureter is the [[abdominal]] part and the shortest is the [[intramural]] part."},{"l":5,"t":"Excretory pathways & ureters","s":"The most common kidney stone is made of [[calcium oxalate]]; kidney pain from a stone is renal [[colic]]."},{"l":5,"t":"Urinary bladder & urethra","s":"The urinary bladder is [[subperitoneal]], and the ureters enter it at its base or [[fundus]]."},{"l":5,"t":"Urinary bladder & urethra","s":"The [[trigone]] is the smooth area between the ureteric orifices and the internal urethral [[meatus|orifice]]."},{"l":5,"t":"Urinary bladder & urethra","s":"The bladder wall's smooth muscle is the [[detrusor]]; the bladder is supplied by the superior and inferior [[vesical]] arteries."},{"l":5,"t":"Urinary bladder & urethra","s":"The vesical plexus is part of the inferior [[hypogastric]] plexus."},{"l":5,"t":"Urinary bladder & urethra","s":"The tripartite urethra runs through the [[prostatic]], [[membranous]] and [[spongy|penile]] parts."},{"l":6,"t":"Lymphatic system overview","s":"The lymphatic system's three functions are fluid balance, [[fat|lipid]] absorption and [[immune]] responses."},{"l":6,"t":"Lymphatic system overview","s":"Lymphatic tissue is reticular connective tissue, the [[stroma]], plus lymphocytes, the [[parenchyma]]."},{"l":6,"t":"Lymphatic system overview","s":"Innate immunity is [[non-specific|nonspecific]]; acquired immunity is specific to [[antigens|antigen]]."},{"l":6,"t":"Lymphatic system overview","s":"Antibody-mediated immunity is called [[humoral]] immunity; T-cells provide [[cellular|cell-mediated]] immunity."},{"l":6,"t":"Lymphatic system overview","s":"Activated B-cells become [[plasma]] cells in the tissues."},{"l":6,"t":"Lymphatic system overview","s":"Lymph flows from capillaries to vessels and nodes, then to [[trunks]], then to [[ducts]]."},{"l":6,"t":"Lymphatic system overview","s":"In the skin, lymph vessels follow [[veins]]; in the viscera, they follow [[arteries]]."},{"l":6,"t":"Lymphatic system overview","s":"Lacteals of the small intestine carry fat-rich lymph called [[chyle]]."},{"l":6,"t":"Lymphatic system overview","s":"Edema occurs when filtration exceeds [[reabsorption]]; swelling from failed lymph drainage is [[lymphedema|lymphoedema]]."},{"l":6,"t":"Primary lymphatic organs","s":"The primary lymphatic organs are the red bone marrow and the [[thymus]]."},{"l":6,"t":"Primary lymphatic organs","s":"Thymocytes undergo positive selection in the thymic [[cortex]] and negative selection in the [[medulla]]."},{"l":6,"t":"Primary lymphatic organs","s":"After puberty the thymus undergoes [[involution]], and much of it is replaced by [[adipose|fat|adipose tissue]]."},{"l":6,"t":"Primary lymphatic organs","s":"The thymus lies in the [[mediastinum]]."},{"l":6,"t":"Primary lymphatic organs","s":"B-cells and T-cells arise from [[lymphoid]] stem cells; erythrocytes and platelets from [[myeloid]] stem cells."},{"l":6,"t":"Secondary lymphatic organs","s":"Lymph enters a node through [[afferent]] vessels and leaves through [[efferent]] vessels at the hilum."},{"l":6,"t":"Secondary lymphatic organs","s":"Immune responses in the spleen occur in the [[white]] pulp; old red cells are removed in the [[red]] pulp."},{"l":6,"t":"Secondary lymphatic organs","s":"The spleen lies in the left [[hypochondriac]] region."},{"l":6,"t":"Secondary lymphatic organs","s":"Lymphatic nodules have no [[capsule]], so they are tissues rather than organs."},{"l":6,"t":"Secondary lymphatic organs","s":"Waldeyer's ring is made of the pharyngeal, [[palatine]] and [[lingual]] tonsils."},{"l":6,"t":"Secondary lymphatic organs","s":"The pharyngeal tonsil is also called the [[adenoid|adenoids]]."},{"l":6,"t":"Secondary lymphatic organs","s":"Inflamed lymph nodes are [[lymphadenitis]]; inflamed lymph vessels are [[lymphangitis]]."},{"l":6,"t":"Secondary lymphatic organs","s":"Carcinomas typically spread by the [[lymphogenous|lymphatic]] route; sarcomas by the [[hematogenous|haematogenous|blood]] route."},{"l":6,"t":"Lymph nodes & pathways I","s":"The right lymphatic duct ends at the [[right]] venous angle; the thoracic duct at the [[left]] venous angle."},{"l":6,"t":"Lymph nodes & pathways I","s":"Lymph from below the diaphragm collects in the [[cisterna chyli]] before entering the thoracic duct."},{"l":6,"t":"Lymph nodes & pathways I","s":"The deep cervical nodes are split into superior and inferior groups by the tendon of the [[omohyoid]] muscle."},{"l":6,"t":"Lymph nodes & pathways I","s":"An enlarged left supraclavicular node, [[Virchow's|Virchows|Virchow]] node, can be an early sign of [[gastric|stomach]] cancer."},{"l":6,"t":"Lymph nodes & pathways I","s":"Bronchopulmonary nodes are also called [[hilar]] nodes."},{"l":6,"t":"Lymph nodes & pathways I","s":"Most breast lymph drains to the [[axillary]] nodes; the rest goes to the [[parasternal]] nodes and the opposite breast."},{"l":6,"t":"Lymph nodes & pathways I","s":"Deep upper-limb lymph reaches the [[humeral|lateral]] axillary nodes first, then the central and [[apical]] nodes."},{"l":6,"t":"Lymph nodes & pathways II","s":"Abdominal lymph converges on the lateral aortic nodes and [[lumbar]] trunks, which empty into the cisterna chyli."},{"l":6,"t":"Lymph nodes & pathways II","s":"Superficial lymph above the [[transumbilical]] plane drains to the axillary nodes; below it, to the superficial [[inguinal]] nodes."},{"l":6,"t":"Lymph nodes & pathways II","s":"Superficial lower-limb lymph follows the [[saphenous]] veins to the superficial inguinal nodes."},{"l":6,"t":"Lymph nodes & pathways II","s":"Deep inguinal nodes drain to the external [[iliac]] nodes."}];

tenoid"},{"l":4,"g":"Intrinsic laryngeal muscles","n":"Lateral crico-arytenoid","f":[["Action","Rotates vocal processes inward → adducts folds"],["Use","Phonation"],["Nerve","Recurrent laryngeal n."],["Slides","54"]],"key":"m:4|Lateral crico-arytenoid"},{"l":4,"g":"Intrinsic laryngeal muscles","n":"Transverse and oblique arytenoids","f":[["Action","Glide the arytenoids together → adduct folds"],["Extra (oblique)","Narrow the laryngeal inlet and help depress the epiglottis in swallowing"],["Nerve","Recurrent laryngeal n."],["Slides","52, 53"]],"key":"m:4|Transverse and oblique arytenoids"},{"l":4,"g":"Intrinsic laryngeal muscles","n":"Cricothyroid","f":[["Action","Tips the thyroid forward and down at the cricothyroid joint"],["Effect","Stretches the vocal ligaments → raises pitch"],["Nerve","External branch of the superior laryngeal n. (the one exception)"],["Slides","51"]],"key":"m:4|Cricothyroid"},{"l":4,"g":"Intrinsic laryngeal muscles","n":"Thyro-arytenoid (and vocalis)","f":[["Action","Pulls arytenoids forward toward the thyroid → slackens the folds, lowers pitch"],["Vocalis (medial fibers)","Adjust tension beside the ligament → timbre and fine pitch"],["Nerve","Recurrent laryngeal n."],["Slides","56"]],"key":"m:4|Thyro-arytenoid (and vocalis)"},{"l":4,"g":"Intrinsic laryngeal muscles","n":"Intrinsic muscles: one-line summary","f":[["Open","Posterior crico-arytenoid"],["Close","Lateral crico-arytenoid, transverse and oblique arytenoids"],["Tighten (pitch up)","Cricothyroid"],["Loosen (pitch down)","Thyro-arytenoid"],["Slides","51 to 57"]],"key":"m:4|Intrinsic muscles: one-line summary"},{"l":4,"g":"Laryngeal neurovasculature","n":"Superior laryngeal n. (CN X)","f":[["Internal branch","Through the thyrohyoid membrane; sensory and secretomotor to mucosa ABOVE the vocal folds"],["External branch","Motor to cricothyroid only"],["Slides","60, 61, 63"]],"key":"m:4|Superior laryngeal n. (CN X)"},{"l":4,"g":"Laryngeal neurovasculature","n":"Recurrent laryngeal n. (CN X) ect ALL lymphatic trunks that empty into the ducts at the root of the neck.|Jugular trunk"],["ly-r6","d:Which region's lymph returns by the right lymphatic duct?|The right side of the head, neck and thorax, and the right upper limb"],["ly-h1","q:Waldeyer's ring drains first to which nodes?"],["ly-h2","q:Which landmark separates the superior from the inferior deep cervical nodes?"],["ly-h3","q:Superficial cervical nodes lie along which vein, and where do they drain?"],["ly-h4","d:A child with strep throat has a tender node just below the angle of the jaw. Which node?|Jugulodigastric node"],["ly-h5","d:A firm left supraclavicular node is found in a patient losing weight. What should come to mind?|Virchow's node, an early sign of gastric cancer"],["ly-h6","d:Select ALL correct steps in head and neck lymph flow.|Waldeyer's ring → superior deep cervicals"],["ly-h7","q:The deep cervical nodes follow which vein?"],["ly-pu1","q:Lymph from lung tissue starts in which nodes?"],["ly-pu2","q:Bronchopulmonary nodes are also called which nodes?"],["ly-pu3","d:What is the order of pulmonary lymph flow?|Pulmonary, bronchopulmonary, tracheobronchial, bronchomediastinal trunk"],["ly-pu4","q:Where are the inferior tracheobronchial nodes?"],["ly-pu5","d:Which trunk carries the lungs' (deep) lymph to the ducts?|Bronchomediastinal trunk"],["ly-b1","q:Where does most lymph from the breast drain?"],["ly-b2","q:Lymph from the breast first collects in which plexus?"],["ly-b3","d:In what order do the axillary nodes pass on breast lymph?|Pectoral, central, apical, then subclavian trunk"],["ly-b4","d:Besides the axillary nodes, which route can breast cancer cells take through lymph?|To the parasternal nodes and the opposite breast"],["ly-b5","d:Parasternal lymph from the breast reaches the duct by which trunk?|Bronchomediastinal trunk"],["ly-b6","d:Select ALL correct steps in breast lymph flow.|Subareolar plexus → pectoral axillary nodes"],["ly-ul1","q:Deep lymphatics of the upper limb follow w y-ll3","q:Superficial lymph of the lower limb first reaches which nodes?"],["ly-ll4","d:Lymph following the deep arteries of the leg drains to which nodes next?|Deep inguinal nodes, then external iliac nodes"],["ly-ll5","d:An infected blister on the foot causes a tender lump in the groin. Which nodes?|Superficial inguinal nodes"],["ly-ll6","d:Select ALL correct steps in lower-limb lymph flow.|Superficial-vein lymph → superficial inguinal nodes"],["b-cv1","b:Arteries carry blood [[away from]] the heart; veins carry blood [[toward|towards|to]] the heart."],["b-cv2","b:Blood is a [[liquid]] connective tissue made of [[plasma]] and [[formed elements]]."],["b-cv3","b:Lymphatics pick up excess [[interstitial fluid|filtrate]] and return it to the [[venous|veins]] circulation."],["b-cv4","b:Exchange of nutrients and wastes happens in the [[capillary beds|capillaries]], between arterioles and [[venules]]."],["b-th1","b:The thoracic cavity is bounded superiorly by the [[first ribs]] and inferiorly by the [[diaphragm]]."],["b-th2","b:The [[parietal]] pleura adheres to the walls and the [[visceral]] pleura adheres to the lungs."],["b-th3","b:The thoracic plane runs from the [[sternal angle|angle of louis]] to the intervertebral disc between [[T4 and T5|T4/T5|T4-T5]]."],["b-th4","b:The middle mediastinum is defined by the [[pericardium]]; the posterior mediastinum extends down to [[T12]]."],["b-pc1","b:The visceral layer of the serous pericardium is also called the [[epicardium]]."],["b-pc2","b:Between the parietal and visceral layers of serous pericardium is the [[pericardial cavity]]."],["b-pc3","b:The fibrous pericardium is innervated by the [[phrenic]] nerves, from spinal levels [[C3 to C5|C3-C5|C3-5|C3, C4, C5]]."],["b-pc4","b:Fluid that constricts the heart in the pericardial cavity causes cardiac [[tamponade]], treated by [[pericardiocentesis]]."],["b-pc5","b:The amount of subserosal adipose tissue is proportional to [[cardiometabolic]] risk."],["b-hb1","b:From outside in, the heart wall is the [[epicardium]], [[myocardium]] and [[endocardium]]."],["b-hb2","b:The comb-like muscle of the atria is [[pectinate]] muscle; the meaty beams of the ventricles are [[trabeculae carneae]]."],["b-hb3","b:Intercalated discs contain [[desmosomes]], which anchor cells, and [[gap junctions]], which let ions flow."],["b-hb4","b:Cells joined by gap junctions act as one, a [[functional syncytium]]."],["b-hb5","b:The [[chordae tendineae]] anchor the AV valve cusps to the [[papillary]] muscles."],["b-hb6","b:The right atrium receives blood from the [[superior]] and inferior venae cavae and the [[coronary sinus]]."],["b-hb7","b:The two semilunar valves are the [[pulmonary|pulmonic]] valve and the [[aortic]] valve."],["b-ex1","b:The left border is also called the [[obtuse]] margin; the inferior border is the [[acute]] margin."],["b-ex2","b:The right border of the heart is formed by the [[right atrium]]."],["b-ex3","b:The base of the heart faces [[posteriorly|posterior]] and is formed mostly by the [[left atrium]]."],["b-ex4","b:All four valves sit roughly in one plane, anchored by the [[fibrous skeleton]] of the heart, which lines up with the [[coronary]] sulcus."],["b-in1","b:The smooth posterior part of the right atrium is the [[sinus venarum]], separated from the pectinate part by the [[crista terminalis]]."],["b-in2","b:The [[fossa ovalis]] on the interatrial septum is the remnant of the fetal [[foramen ovale]]."],["b-in3","b:The septomarginal trabecula, or [[moderator band]], carries the [[right bundle branch|right bundle]]."],["b-in4","b:The RCA arises from the [[right]] aortic sinus; the sinus above the posterior cusp is the [[non-coronary|noncoronary|non coronary]] sinus."],["b-co1","b:The SA nodal branch comes from the RCA about [[60]] percent of the time."],["b-co2","b:The anterior interventricular branch is also called the [[left anterior descending|LAD]] artery."],["b-co3","b:Dominance is set by which artery supplies the [[crux]], where the coronary sulcus meets the [[posterior interventricular]] sulcus."],["b-cv7-n1","b:In the [[capillary beds|capillaries|capillary bed]], nutrients leave the blood for the interstitial fluid and [[wastes|waste products|waste]] are picked up by the blood."],["b-co3-n1","b:The right marginal branch follows the [[inferior]] border to the right ventricle wall; at the crux the RCA gives the [[AV nodal]] branch and the [[posterior interventricular|PDA|posterior descending]] branch."],["b-co4","b:The [[circumflex]] branch of the LCA gives off the left [[marginal]] artery."],["b-ve1","b:The great cardiac vein runs with the [[anterior interventricular|LAD]] branch; the middle cardiac vein runs with the [[posterior interventricular|PDA]] branch."],["b-ve2-n1","b:The small cardiac vein accompanies the [[right marginal]] branch along the [[inferior]] border and drains into the [[coronary sinus]]."],["b-ve2","b:Most cardiac veins drain into the [[coronary sinus]], but the [[anterior cardiac]] veins drain directly into the right atrium."],["b-ve3","b:Small cardiac veins, also called [[Thebesian]] veins, drain the [[subendocardial]] myocardium."],["b-cc1","b:The SA node sits at the superior end of the [[crista terminalis]] and fires at about [[100]] bpm."],["b-cc2","b:The AV node fires at about [[40 to 60|40-60]] bpm; the AV bundle of [[His]] at about 20 to 35 bpm."],["b-cc3","b:During [[isovolumetric]] ventricular contraction, all four valves are closed."],["b-cc4","b:Parasympathetic fibers to the heart travel in the [[vagus|CN X]] nerve; sympathetic preganglionics come from [[T1 to T4|T1-T4|T1-T5|T1 to T5|T1-4]]."],["b-cc5","b:The superficial cardiac plexus sits in the concavity of the [[aortic arch]]; the deep plexus sits at the [[tracheal bifurcation]]."],["b-cc6","b:A resting rate under 60 bpm is [[bradycardia]]; over 100 bpm is [[tachycardia]]."],["b-au1","b:S1 is heard when the [[AV|atrioventricular]] valves close; S2 when the [[semilunar]] valves close."],["b-au2","b:The aortic valve is heard at the [[right]] 2nd intercostal space; the mitral valve at the left 5th intercostal space, [[midclavicular]] line."],["b-au3","b:S3 is the [[Kentucky]] gallop; S4 is the [[Tennessee]] gallop."],["b-au4-n1","b:Auscultation sites use the [[patient's|patient|patients]] right and left: facing the patient, the aortic site (their right 2nd intercostal space) is on your [[left]]."],["b-v-vs1","b:The three layers of a vessel wall, from inside out, are the tunica [[interna|intima]], tunica [[media]] and tunica [[externa|adventitia]]."],["b-v-vs2","b:Elastic arteries such as the aorta act as pressure [[reservoirs|reservoir]]; arterioles are [[resistance]] vessels; capillaries are [[exchange]] vessels."],["b-v-vs3","b:Veins accompanying an artery and named for it are called venae [[comitantes]]."],["b-v-vs4","b:A clot inside a vessel is a [[thrombus]]; when it travels and lodges elsewhere it is an [[embolism|embolus]]."],["b-v-vs5","b:The [[hypophyseal]] portal system connects the hypothalamus to the anterior pituitary; the renal portal system is [[arterial]]."],["b-v-vs11-n1","b:In the renal portal system, blood leaves the glomerulus through an [[efferent arteriole|efferent arterioles|efferent]] and flows into the [[peritubular capillaries|peritubular|peritubular capillary]], so the vessel linking the two beds is arterial."],["b-v-ao1","b:The arch of the aorta sits at about [[T4]], and the abdominal aorta bifurcates into the common iliac arteries at about [[L4]]."],["b-v-ao2","b:The celiac trunk serves the [[foregut]], the superior mesenteric a. the [[midgut]], and the inferior mesenteric a. the [[hindgut]]."],["b-v-cc1","b:The [[maxillary]] artery supplies the deep face; the [[superficial temporal]] artery supplies the scalp."],["b-v-cc2","b:The [[vertebral]] arteries enter the skull through foramen magnum and supply the [[posterior]] brain."],["b-v-cc2-n1","b:The common carotid ends by splitting into the internal and external carotids; the ophthalmic a., which supplies the orbit and forehead, is a branch of the [[internal carotid|internal carotid artery|ICA]]."],["b-v-cc2-n2","b:The common carotid ascends the neck in the carotid [[sheath]] with the internal jugular v. and vagus n.; only the [[internal carotid|internal carotid artery|ICA]] then passes through the carotid canal into the skull."],["b-v-il1","b:The femoral artery becomes the popliteal artery at the [[adductor hiatus]]."],["b-v-il2","b:The internal iliac artery has an [[anterior]] division serving pelvic viscera and perineum and a [[posterior]] division serving the posterior pelvic wall."],["b-v-sc1","b:The parts of the subclavian artery are defined by the [[anterior scalene]] muscle; the parts of the axillary artery by [[pectoralis minor|pec minor]]."],["b-v-sc2","b:The axillary artery becomes the brachial artery at [[teres major]]."],["b-v-sc3","b:The radial artery feeds the [[deep]] palmar arch; the ulnar artery feeds the [[superficial]] palmar arch."],["b-v-sc4","b:The [[Allen]] test checks for an anastomosis between the radial and [[ulnar]] arteries."],["b-v-sv1","b:Each brachiocephalic vein is formed by the [[internal jugular]] vein and the [[subclavian]] vein, which meet at the venous angle."],["b-v-sv2","b:The [[basilic]] vein joins the brachial veins to form the axillary vein; the [[cephalic]] vein drains into the axillary vein later."],["b-v-iv1","b:The IVC passes through the diaphragm at about [[T8]], the esophagus at [[T10]], and the aorta at [[T12]]."],["b-v-iv2","b:The left gonadal vein drains into the left [[renal]] vein; the right gonadal vein drains directly into the [[IVC|inferior vena cava]]."],["b-v-hp1","b:The hepatic portal vein is formed by the [[superior mesenteric]] vein and the [[splenic]] vein."],["b-v-hp2","b:Blood leaves the liver sinusoids through the [[hepatic]] veins into the [[IVC|inferior vena cava]]."],["b-bl-in1","b:Whole blood is about [[55]]% plasma and [[45]]% formed elements."],["b-bl-in2","b:Blood pH is kept between [[7.35]] and [[7.45]]; below that is acidemia and above it is alkalemia."],["b-bl-in3","b:In acidemia the lungs [[hyperventilate]] to blow off CO2; in alkalemia they [[hypoventilate]] to retain it."],["b-bl-in4","b:The [[lungs]] adjust blood pH quickly; the [[kidneys]] adjust it slowly."],["b-bl-pl1","b:[[Albumins|Albumin]] maintain oncotic pressure; [[fibrinogens|fibrinogen]] are needed for clotting."],["b-bl-pl2","b:Gamma globulins are also called [[immunoglobulins|antibodies]]."],["b-bl-fe1","b:Leukocytes from most to least abundant: neutrophils, [[lymphocytes]], [[monocytes]], eosinophils, basophils."],["b-bl-fe2","b:[[Lymphoid]] stem cells give rise to T cells, B cells and natural killer cells; [[myeloid]] stem cells give rise to nearly everything else."],["b-bl-fe3","b:[[Erythropoietin|EPO]] stimulates red blood cell production; [[thrombopoietin|TPO]] stimulates platelet production."],["b-bl-er1","b:Erythrocytes are [[biconcave]] discs that lack a [[nucleus]] and mitochondria."],["b-bl-er2","b:Hematocrit below the normal range is [[anemia]]; above it is [[polycythemia]]."],["b-bl-hb1","b:Adult hemoglobin A is [[2α2β|2 alpha 2 beta|2a2b]]; fetal hemoglobin is [[2α2γ|2 alpha 2 gamma|2a2g]]."],["b-bl-hb2","b:Low oxygen in the blood is [[hypoxemia]]; low oxygen in the tissues is [[hypoxia]]."],["b-bl-hb3","b:Hemoglobin's affinity for carbon monoxide is about [[240]] times its affinity for oxygen."],["b-bl-bt1","b:Type [[AB]] is the universal recipient; type [[O]] is the universal donor."],["b-bl-bt2","b:In hemolytic disease of the newborn, maternal [[IgG]] antibodies cross the placenta; it is prevented with [[RhoGAM]]."],["b-bl-lk1","b:Monocytes mature in tissues into [[macrophages]] or [[dendritic]] cells."],["b-bl-lk2","b:Eosinophils release major basic protein, which kills [[endoparasites|parasites]]; basophils release [[histamine]] and heparin."],["b-bl-th1","b:Platelets are shed from [[megakaryocytes]] and old ones are removed by macrophages in the [[spleen]]."],["b-bl-th2","b:Platelets bind exposed collagen through [[von Willebrand]] factor, and [[thrombin]] converts fibrinogen to fibrin."],["b-bl-th3","b:Fewer than 150,000 platelets/µL is [[thrombocytopenia]]; more than 400,000/µL is [[thrombocytosis]]."],["b-r-sf1","b:The upper respiratory tract is everything [[proximal|superior|above]] to the vocal folds; the lower tract is everything [[distal|inferior|below]] to them."],["b-r-sf2","b:In acidemia we [[increase|speed up|raise]] ventilation to blow off [[CO2|carbon dioxide]], a volatile acid."],["b-r-nm1","b:The nasal cavity ends posteriorly at the [[choanae|choana]], which open into the [[nasopharynx]]."],["b-r-nm2","b:The mucosa-covered bony shelves on the lateral nasal wall are the [[conchae|nasal conchae]]; the spaces below them are the [[meatuses|meatus|nasal meatuses]]."],["b-r-nm3","b:Orbicularis oris is supplied by the [[facial|CN VII|CN 7]] nerve; the muscles of mastication by the [[mandibular|V3|CN V3]] nerve."],["b-r-ph1","b:From top to bottom, the pharynx is the [[nasopharynx]], [[oropharynx]] and [[laryngopharynx|hypopharynx]]."],["b-r-ph2","b:The adenoid is the [[pharyngeal]] tonsil; the tonsil on the root of the tongue is the [[lingual]] tonsil."],["b-r-ph3","b:The ring of tonsils around the naso- and oropharynx is [[Waldeyer's|Waldeyer|Waldeyers]] ring."],["b-r-ph8-n1","b:The [[piriform]] recesses lie on either side of the larynx, inside the [[laryngopharynx]]; swallowed pills can lodge there."],["b-r-pm1","b:The pharyngeal constrictors meet posteriorly at the pharyngeal [[raphe]]."],["b-r-pm2","b:Stylopharyngeus is supplied by the [[glossopharyngeal|CN IX|CN 9]] nerve, not the pharyngeal plexus."],["b-r-lx1","b:The [[cricoid]] cartilage is the only laryngeal cartilage that completely encircles the airway."],["b-r-lx2","b:The [[arytenoid|arytenoids]] cartilages are the most kinetic; they pivot and glide on the cricoid."],["b-r-lx3","b:The trachea is suspended from the cricoid by the [[cricotracheal]] ligament."],["b-r-lx1-n1","b:The larynx sits [[inferior|below]] to the hyoid, [[anterior|in front]] to the laryngopharynx and [[superior|proximal|above]] to the trachea."],["b-r-mc1","b:The gap between the vocal folds is the rima [[glottidis]]; the gap between the vestibular folds is the rima [[vestibuli]]."],["b-r-mc2","b:The [[quadrangular]] membranes funnel air in; the [[conus elasticus]] funnels air out."],["b-r-mc3","b:An emergency cricothyrotomy goes through the [[median cricothyroid|cricothyroid]] ligament."],["b-r-lm1","b:Vocal folds are [[abducted]] for ventilation and [[adducted]] for phonation."],["b-r-lm2","b:Pitch rises as vocal ligament [[tension]] increases."],["b-r-il1","b:The only intrinsic muscles that open the rima glottidis are the [[posterior crico-arytenoid|posterior cricoarytenoid|posterior crico-arytenoids|posterior cricoarytenoids|PCA]] muscles."],["b-r-il2","b:The cricothyroid tips the thyroid cartilage [[anteriorly|forward|anterior]] and down, raising pitch."],["b-r-il7-n1","b:The lateral fibers of the thyro-arytenoid pull the arytenoids [[forward|anteriorly|toward the thyroid]], which [[decreases|lowers|reduces]] vocal ligament tension and lowers pitch."],["b-r-nv1","b:Every intrinsic laryngeal muscle except the [[cricothyroid]] is supplied by the [[recurrent laryngeal]] nerves."],["b-r-nv2","b:The internal branch of the superior laryngeal nerve serves mucosa [[above|proximal to|superior to]] the vocal folds; the recurrent laryngeal serves mucosa [[below|distal to|inferior to]] them."],["b-r-nv3","b:The inferior laryngeal artery and recurrent laryngeal nerve ascend together in the [[tracheo-esophageal|tracheoesophageal]] groove."],["b-r-nv7-n1","b:The [[superior thyroid]] artery gives off the superior laryngeal artery, which pierces the thyrohyoid membrane with the [[internal]] branch of the superior laryngeal nerve."],["b-r-tb1","b:The trachea bifurcates at the [[thoracic plane|sternal angle]], about T4/5."],["b-r-tb2","b:Secondary bronchi are also called [[lobar]] bronchi; tertiary bronchi are also called [[segmental]] bronchi."],["b-r-tb3","b:The conducting zone ends at the [[terminal]] bronchioles; gas exchange begins at the [[respiratory]] bronchioles."],["b-r-al1","b:Type [[I|1|one]] alveolar cells are simple squamous and handle gas exchange; type [[II|2|two]] cells secrete surfactant."],["b-r-al2","b:Surfactant [[reduces|lowers|decreases]] surface tension so the alveoli don't [[collapse]]."],["b-r-pc1","b:Bronchial arteries are [[systemic]] vessels from the thoracic [[aorta]]."],["b-r-pc2","b:The pulmonary trunk leaves the [[right]] ventricle; the pulmonary veins return oxygenated blood to the [[left]] atrium."],["b-r-lu1","b:The right lung has [[three|3]] lobes; the left lung has [[two|2]]."],["b-r-lu2","b:The right lung's horizontal fissure separates the [[superior|upper]] lobe from the [[middle]] lobe."],["b-r-vn1","b:Boyle's law: pressure is [[inversely|inverse]] proportional to volume."],["b-r-vn2","b:“C3, 4, 5 keeps the diaphragm alive”: the [[phrenic]] nerves."],["b-r-vn3","b:The central tendon of the diaphragm holds the caval hiatus for the [[inferior vena cava|IVC]]."],["b-r-pl1","b:[[Visceral]] pleura covers the lungs; [[parietal]] pleura lines the pulmonary cavity."],["b-r-pl2","b:Air in the pleural cavity is a [[pneumothorax]]; a collapsed lung is [[atelectasis]]."],["b-r-pl3","b:Draining fluid from the pleural cavity with a needle is [[thoracentesis]]."],["b-r-pl3-n1","b:The cupula is lined by [[cervical]] pleura, which is part of the [[parietal]] pleura."],["b-u-sf1","b:The kidneys and [[ureters|ureter]] are paired and retroperitoneal; the urinary bladder and [[urethra]] are unpaired and pelvic."],["b-u-sf2","b:The kidneys make [[calcitriol]] to raise blood calcium, [[erythropoietin|EPO]] for red blood cell production, and [[renin]] to start the RAA pathway."],["b-u-sf3","b:To fix pH the kidneys secrete [[H+|protons|hydrogen ions]] and conserve [[bicarbonate|HCO3-|HCO3]]."],["b-u-k1","b:The lateral border of the kidney is [[convex]] and the medial border is [[concave]]."],["b-u-k2","b:Accessory renal arteries that supply a pole of the kidney are called [[polar]] arteries."],["b-u-k3","b:At the hilum, the major calices form the [[renal pelvis]], which drains into the [[ureter]]."],["b-u-k4","b:Cortex between neighbouring pyramids forms the renal [[columns|column]]; cortex between a pyramid's base and the capsule is the [[cortical arch]]."],["b-u-k5","b:The apex of a renal pyramid is the renal [[papilla|papillae]], which is cupped by a [[minor calyx|minor calix|minor calices]]."],["b-u-fs1","b:The [[perirenal]] space is inside the renal fascia; the [[pararenal]] space is outside it."],["b-u-fs2","b:The renal hila lie at the [[transpyloric]] plane, at about vertebral level [[L1]]."],["b-u-fs3","b:When lost perirenal fat lets the kidney drop and kink the ureter, the condition is [[nephroptosis]]."],["b-u-v1","b:Segmental arteries are [[end]] arteries, so a partial [[nephrectomy]] can remove one renal segment."],["b-u-v2","b:A renal lobe is a [[pyramid]] plus its surrounding cortex; a lobule is cortical arch around one [[medullary ray]]."],["b-u-v3","b:[[Interlobar]] arteries run between the medulla and renal columns; [[arcuate]] arteries run between the medulla and cortical arch."],["b-u-v4","b:In the renal portal system, [[efferent]] arterioles carry blood from the glomeruli to the peritubular capillaries and [[vasa recta]]."],["b-u-v5","b:The left renal vein passes between the [[superior mesenteric artery|SMA|superior mesenteric a.]] and the aorta; squeezing it there is called [[nutcracker]] syndrome."],["b-u-v6","b:The left renal vein receives the left [[gonadal]], left suprarenal and left inferior [[phrenic]] veins."],["b-u-n1","b:Moving material from peritubular capillaries into the tubules is tubular [[secretion]]; moving it from filtrate back to the blood is tubular [[reabsorption]]."],["b-u-n2","b:The visceral layer of the glomerular capsule is made of [[podocytes]], whose feet leave filtration [[slits]]."],["b-u-n3","b:The primary site of reabsorption is the [[proximal convoluted tubule|PCT|proximal tubule]]; water follows [[salts|salt|sodium|Na+]]."],["b-u-n4","b:The [[macula densa]] in the distal convoluted tubule senses [[NaCl|salt|sodium chloride]] as a proxy for GFR."],["b-u-n5","b:In the DCT, [[intercalated]] cells adjust pH, and [[principal]] cells reabsorb Na+ and water."],["b-u-n6","b:Alcohol is a diuretic because it inhibits [[vasopressin|ADH|antidiuretic hormone]]."],["b-u-n7","b:[[Juxtamedullary]] nephrons have long nephron loops and make more concentrated urine; [[cortical]] nephrons are the most common."],["b-u-rr1","b:The two intrinsic controls of the kidney are the [[myogenic]] response and [[tubuloglomerular]] feedback."],["b-u-rr2","b:Constricting the afferent arteriole [[lowers|decreases|reduces]] GFR; constricting the efferent arteriole [[raises|increases]] GFR."],["b-u-rr3","b:Renin converts angiotensinogen to angiotensin [[I|1|one]], and [[ACE|angiotensin converting enzyme]] converts it to angiotensin II."],["b-u-rr4","b:Angiotensin II makes the adrenal cortex release [[aldosterone]] and the hypothalamus release [[ADH|vasopressin|antidiuretic hormone]]."],["b-u-rr5","b:When present, the [[least]] thoracic splanchnic nerve innervates the renal plexus directly."],["b-u-e1","b:Urine passes from minor calices to [[major calices|major calyx|major calyces]] to the [[renal pelvis]] to the ureter."],["b-u-e2","b:The ureters cross into the pelvis at the bifurcation of the [[common iliac]] artery, then pass under the [[uterine]] artery."],["b-u-e3","b:The longest part of the ureter is the [[abdominal]] part and the shortest is the [[intramural]] part."],["b-u-e4","b:The most common kidney stone is made of [[calcium oxalate]]; kidney pain from a stone is renal [[colic]]."],["b-u-b1","b:The urinary bladder is [[subperitoneal]], and the ureters enter it at its base or [[fundus]]."],["b-u-b2","b:The [[trigone]] is the smooth area between the ureteric orifices and the internal urethral [[meatus|orifice]]."],["b-u-b3","b:The bladder wall's smooth muscle is the [[detrusor]]; the bladder is supplied by the superior and inferior [[vesical]] arteries."],["b-u-b4","b:The vesical plexus is part of the inferior [[hypogastric]] plexus."],["b-u-b5","b:The tripartite urethra runs through the [[prostatic]], [[membranous]] and [[spongy|penile]] parts."],["b-ly-o1","b:The lymphatic system's three functions are fluid balance, [[fat|lipid]] absorption and [[immune]] responses."],["b-ly-o2","b:Lymphatic tissue is reticular connective tissue, the [[stroma]], plus lymphocytes, the [[parenchyma]]."],["b-ly-o3","b:Innate immunity is [[non-specific|nonspecific]]; acquired immunity is specific to [[antigens|antigen]]."],["b-ly-o4","b:Antibody-mediated immunity is called [[humoral]] immunity; T-cells provide [[cellular|cell-mediated]] immunity."],["b-ly-o5","b:Activated B-cells become [[plasma]] cells in the tissues."],["b-ly-o6","b:Lymph flows from capillaries to vessels and nodes, then to [[trunks]], then to [[ducts]]."],["b-ly-o7","b:In the skin, lymph vessels follow [[veins]]; in the viscera, they follow [[arteries]]."],["b-ly-o8","b:Lacteals of the small intestine carry fat-rich lymph called [[chyle]]."],["b-ly-o9","b:Edema occurs when filtration exceeds [[reabsorption]]; swelling from failed lymph drainage is [[lymphedema|lymphoedema]]."],["b-ly-p1","b:The primary lymphatic organs are the red bone marrow and the [[thymus]]."],["b-ly-p2","b:Thymocytes undergo positive selection in the thymic [[cortex]] and negative selection in the [[medulla]]."],["b-ly-p3","b:After puberty the thymus undergoes [[involution]], and much of it is replaced by [[adipose|fat|adipose tissue]]."],["b-ly-p4","b:The thymus lies in the [[mediastinum]]."],["b-ly-p5","b:B-cells and T-cells arise from [[lymphoid]] stem cells; erythrocytes and platelets from [[myeloid]] stem cells."],["b-ly-s1","b:L     if(s&&s.list){const list=s.list.map(k=>FBY.get(k)).filter(Boolean);
      if(list.length){fig={list,i:Math.min(s.i,list.length),stats:s.stats||{},inputs:s.inputs||{},ovr:s.ovr||{},checked:s.checked,revealed:s.revealed};renderID(true);return}}}
  const src=FIGS.filter(f=>(!st.lec||f.lec===st.lec)&&(!st.flagOnly||flags.has(fKey(f))));
  if(!src.length&&st.flagOnly){emptyFlagged('figures');return}
  fig={list:shuffle(src),i:0,stats:{},inputs:{}};
  renderID();
}
function renderID(replay){
  const n=fig.list.length;
  if(!replay){fig.inputs={};fig.ovr={};fig.checked=false;fig.revealed=false}
  saveID();
  if(fig.i>=n){
    let r=0,t=0;Object.values(fig.stats).forEach(s=>{r+=s.r;t+=s.t});
    const retry=fig.list.filter((x,i)=>!fig.stats[i]||fig.stats[i].r<fig.stats[i].t);
    view.innerHTML=`<div class="meta"><span>All figures done</span><span class="score"><b>${r}</b> / ${t} labels</span></div><div class="progress"><i style="width:100%"></i></div>
    <div class="card done"><h2>${r} of ${t} labels correct</h2><p>Scores count your first check on each figure.${retry.length?' '+retry.length+' figure'+(retry.length>1?'s':'')+' had a miss or were skipped.':''}</p><div class="nav" style="justify-content:center">${retry.length?'<button class="btn primary" id="retry">Retry missed ('+retry.length+')</button>':''}<button class="btn${retry.length?'':' primary'}" id="again">Shuffle figures again</button>${!st.flagOnly&&flagCount()?'<button class="btn" id="revflag">Review flagged ('+flagCount()+')</button>':''}</div></div>`;
    $('#again').onclick=()=>startID(true);
    if($('#retry'))$('#retry').onclick=()=>{fig={list:shuffle(retry),i:0,stats:{},inputs:{},ovr:{}};renderID();window.scrollTo({top:0})};if($('#revflag'))$('#revflag').onclick=()=>{st.flagOnly=true;sync()};return;
  }
  const f=fig.list[fig.i];
  view.innerHTML=`<div class="meta"><span>Figure ${fig.i+1} of ${n} · ${restartBtn}</span><span>${LECT[f.lec]}</span></div>
  <div class="progress"><i style="width:${fig.i/n*100}%"></i></div>
  <div class="card"><div class="cardhead"><span class="tag">${LECT[f.lec]} · lab image</span>${flagBtn(fKey(f))}</div><div class="fig-title">${esc(f.title)}</div>
  <div class="idgrid"><div class="figcol"><div class="plate"><img src="${IMG[f.img]}" alt="${esc(f.title)} with numbered structures" id="figimg"></div>
  <p class="hint">Tap the image to enlarge. Type the structure for each number; spelling within a letter or two counts.</p></div>
  <div class="anscol"><div class="blanks">${f.answers.map(a=>`<label class="blank" for="b${a.n}"><span class="num">${a.n}</span><span class="fld"><input id="b${a.n}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"><div class="fb" id="fb${a.n}"></div></span></label>`).join('')}</div>
  <div class="nav"><button class="btn primary" id="chk">Check</button><button class="btn" id="rev">Show answers</button><span class="spacer"></span><button class="btn" id="prev" ${fig.i?'':'disabled'}>Back</button><button class="btn" id="nxt">Next figure</button></div></div></div></div>`;
  wireFlag(); $('#restart').onclick=()=>startID(true);
  $('#figimg').onclick=()=>{$('#zimg').src=IMG[f.img];$('#zoom').hidden=false};
  const ins=f.answers.map(a=>$('#b'+a.n));
  f.answers.forEach((a,k)=>{const el=ins[k];if(fig.inputs[a.n])el.value=fig.inputs[a.n];el.addEventListener('input',()=>{fig.inputs[a.n]=el.value;saveID()})});
  ins.forEach((el,k)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $('#chk').click()}}));
  $('#chk').onclick=()=>{let r=0;const first=!fig.stats[fig.i];f.answers.forEach(a=>{const el=$('#b'+a.n),fb=$('#fb'+a.n),g=grade(el.value,a,f.answers.filter(x=>x!==a));
      el.classList.remove('ok','no');fb.className='fb';
      if((fig.ovr||{})[a.n]){el.classList.add('ok');fb.classList.add('ok');fb.textContent='Marked correct (answer: '+a.a+')';r++}
      else if(g==='ok'){el.classList.add('ok');fb.classList.add('ok');fb.textContent='Correct';r++}
      else if(g==='near'){el.classList.add('ok');fb.classList.add('near');fb.textContent='Counts. Spelling: '+a.a;r++}
      else{el.classList.add('no');fb.classList.add('no');fb.innerHTML='Answer: '+esc(a.a)+(el.value.trim()?' <button class="markok" data-n="'+a.n+'">Mark correct</button>':'');if(first)missed.add(lKey(f,a))}});
    saveMissed();
    if(!fig.stats[fig.i])fig.stats[fig.i]={r,t:f.answers.length};fig.checked=true;saveID();
    view.querySelectorAll('.markok').forEach(bt=>bt.onclick=()=>{const n=+bt.dataset.n,a=f.answers.find(x=>x.n===n);fig.ovr=fig.ovr||{};fig.ovr[n]=true;
      if(fig.stats[fig.i])fig.stats[fig.i].r=Math.min(fig.stats[fig.i].t,fig.stats[fig.i].r+1);missed.delete(lKey(f,a));saveMissed();saveID();$('#chk').onclick();});};
  $('#rev').onclick=()=>f.answers.forEach(a=>{const fb=$('#fb'+a.n);if(!fb.textContent){fb.className='fb no';fb.textContent='Answer: '+a.a;missed.add(lKey(f,a));saveMissed()}
      if(!fig.stats[fig.i])fig.stats[fig.i]={r:0,t:f.answers.length};fig.revealed=true;saveID();});
  if(replay){if(fig.checked)$('#chk').onclick();if(fig.revealed)$('#rev').onclick()}
  $('#nxt').onclick=()=>{fig.i++;renderID();window.scrollTo({top:0})};
  $('#prev').onclick=()=>{fig.i--;renderID();window.scrollTo({top:0})};
}

  if(st.mode!=='mcq'&&st.mode!=='mt')return;

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.metaKey||e.ctrlKey||e.altKey||!$('#zoom').hidden)return;
  const vis=id=>{const el=$(id);return el&&!el.hidden&&!el.disabled&&el.offsetParent!==null};
  let go=null;
  if(st.mode==='mcq'||st.mode==='mt'){ if(vis('#next'))go='#next'; else if(vis('#submit')&&e.target.closest&&!e.target.closest('.optrow'))go='#submit'; }
  else if(st.mode==='fb'&&(fbx.checked||fbx.revealed)&&vis('#nxt'))go='#nxt';
  else if(st.mode==='id'&&(fig.checked||fig.revealed)&&vis('#nxt'))go='#nxt';
  if(go){e.preventDefault();e.stopPropagation();$(go).click();}
},true);

function saveFB(){putSess('fb',{list:fbx.list.map(b=>b.key),i:fbx.i,stats:fbx.stats,inputs:fbx.inputs||{},ovr:fbx.ovr||{},checked:!!fbx.checked,revealed:!!fbx.revealed})}

  wireFlag(); $('#restart').onclick=()=>startFB(true);
  const ins=b.answers.map(a=>$('#f'+a.n));
  b.answers.forEach((a,k)=>{const el=ins[k];if(fbx.inputs[a.n])el.value=fbx.inputs[a.n];el.addEventListener('input',()=>{fbx.inputs[a.n]=el.value;saveFB()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $('#chk').click()}})});

      el.classList.remove('ok','no');fb.className='fb';
      if((fbx.ovr||{})[a.n]){el.classList.add('ok');fb.classList.add('ok');fb.textContent='Marked correct ('+a.a+')';r++}
      else if(g==='ok'){el.classList.add('ok');fb.textContent='';r++}
      else if(g==='near'){el.classList.add('ok');fb.classList.add('near');fb.textContent='Spelling: '+a.a;r++}
      else{el.classList.add('no');fb.classList.add('no');fb.innerHTML=esc(a.a)+(el.value.trim()?' <button class="markok" data-n="'+a.n+'">Mark correct</button>':'');anyMiss=true}});
    if(first&&anyMiss){missed.add(b.key);saveMissed()}
    view.querySelectorAll('.markok').forEach(bt=>bt.onclick=()=>{const n=+bt.dataset.n;fbx.ovr=fbx.ovr||{};fbx.ovr[n]=true;
      if(fbx.stats[fbx.i])fbx.stats[fbx.i].r=Math.min(fbx.stats[fbx.i].t,fbx.stats[fbx.i].r+1);saveFB();$('#chk').onclick();
