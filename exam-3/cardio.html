sphate"],"e":"Hypoxia drives EPO release from the peritubular interstitial cells (fibroblasts) of the kidneys, with hypoxia-inducible factors (HIF).","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","said":"Dr. Fox's own check question at the end of Erythrocytes.","note":"Hypoxia → EPO: low oxygen is the trigger."},{"l":3,"t":"Erythrocytes","q":"Select ALL correct statements about erythrocyte structure.","c":["They are biconcave discs, which minimizes the diffusion distance for oxygen","They are 7 to 8 µm across, just fitting through 5 to 10 µm capillaries","They are anucleate and lack mitochondria","They are essentially bags of hemoglobin"],"w":["They have many mitochondria to power oxygen transport","They live about 7 to 10 days before the spleen removes them"],"e":"They live about 120 days on average and are made at about 2 million per second.","lo":"Describe the structure, composition, development and function of erythrocytes.","deep":true},{"l":3,"t":"Erythrocytes","q":"The average lifespan of an erythrocyte is about:","c":"120 days","w":["7 to 10 days","Less than a week","1 to 2 years","About 30 days"],"e":"7 to 10 days is thrombocytes; under a week is neutrophils; 1 to 2 years is basophils.","lo":"Describe the structure, composition, development and function of erythrocytes."},{"l":3,"t":"Erythrocytes","q":"In an adult, erythropoietin is secreted mainly by:","c":"Peritubular interstitial cells (fibroblasts) of the kidneys","w":["Hepatocytes of the liver, around the central veins","Megakaryocytes in the red bone marrow","Juxtaglomerular (granular) cells of the kidney's afferent arteriole","Cells of the red bone marrow itself, sensing their own oxygen"],"e":"In the fetus, perisinusoidal cells of the liver secrete it. EPO can rise from about 10 to 10,000 mU/mL in hypoxia.","lo":"Describe the structure, composition, development and function of erythrocytes.","note":"EPO = production of red blood cells: it stimulates the bone marrow to make RBCs."},{"l":3,"t":"Erythrocytes","q":"Normal hematocrit is about 38 to 54%. Select ALL correct statements.","c":["Below the range is anemia; above it is polycythemia","Hematocrit can change through RBC numbers or plasma volume (e.g. hemorrhage, dehydration)","Below about 15% risks cardiac failure; above about 60% risks spontaneous clotting","After a hemorrhage, plasma recovers quickly but RBCs take about 10 days"],"w":["Dehydration lowers hematocrit by removing red blood cells from the circulation","Hematocrit is the percentage of blood volume made up of leukocytes"],"e":"Hematocrit = percentage of RBCs of total blood volume. Dehydration loses plasma, which raises the percentage. Erythropoiesis takes about 10 days.","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","deep":true,"note":"Hematocrit = the amount of RBCs in the blood."},{"l":3,"t":"Erythrocytes","q":"Right after a large hemorrhage, blood volume returns within a day or so but the patient stays anemic for over a week. Why?","c":"Plasma returns quickly, but erythropoiesis takes about 10 days to replace red cells","w":["The spleen destroys the newly made red blood cells for about a week after bleeding","EPO is released only once hematocrit drops below 15%, about a week later","Red blood cells are replaced first, within a day, and plasma lags behind for a week","The bone marrow stops making red cells for a week after any blood loss"],"e":"Replacing plasma before red cells dilutes the remaining RBCs, so hematocrit stays low until erythropoiesis catches up.","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","deep":true,"note":"Formed elements take time to recover."},{"l":3,"t":"Hemoglobin","q":"Which hemoglobin type is dominant in a fetus during the third trimester?","c":"2α2γ","w":["2α2β","2α2δ","2α2ε","2β2γ"],"e":"2α2γ = fetal hemoglobin (HbF). 2α2β = adult HbA (97 to 98% of adult Hb). 2α2δ = HbA2. Beta overtakes gamma about four weeks after birth.","lo":"Describe the structure, function and ontogeny of hemoglobin.","said":"Dr. Fox's own check question at the end of Hemoglobin."},{"l":3,"t":"Hemoglobin","q":"Which statement correctly distinguishes hypoxemia from hypoxia?","c":"Hypoxemia is low oxygen in the blood; hypoxia is low oxygen in the tissues, from anemia, ischemia, poisoning or low output","w":["Hypoxemia is low oxygen in the tissues; hypoxia is low oxygen in the blood, from anemia, ischemia, poisoning or low output","They are synonyms for low oxygen anywhere in the body, whether in the blood or in the tissues","Hypoxemia is low oxygen in the blood; hypoxia is low CO2 in the tissues, caused mainly by hyperventilation","Hypoxia is low oxygen in the blood only; hypoxemia is low oxygen in the lungs only"],"e":"An anemic patient's fewer RBCs may be fully loaded with oxygen (normal blood oxygen per cell) yet still deliver too little to tissues, which is hypoxia.","lo":"Discuss the importance of oxygen to humans.","deep":true},{"l":3,"t":"Hemoglobin","q":"Why do humans need oxygen?","c":"It is the terminal proton acceptor in chemiosmosis, so mitochondria can make much ATP","w":["It is needed to build the heme group of hemoglobin inside developing red blood cells","It buffers blood pH by combining with excess protons in the plasma to form water","It drives the kidneys to produce erythropoietin whenever blood levels rise","It is the main fuel that mitochondria break down to release energy as heat"],"e":"Without oxygen, metabolically active tissues don't have enough energy.","lo":"Discuss the importance of oxygen to humans."},{"l":3,"t":"Hemoglobin","q":"Select ALL correct statements about hemoglobin's structure and genetics.","c":["It is a heterotetramer of four polypeptides, each with an iron-containing heme","Every type has two alpha chains plus two of another chain (beta, delta or gamma)","Alpha globin is coded on chromosome 16; beta and beta-like globins on chromosome 11","It is about a third of an erythrocyte's weight and nearly all of its dry weight"],"w":["Adult hemoglobin A is 2α2γ, with the gamma chains coded on chromosome 16","All four globin chains are coded on chromosome 11, with no chains from chromosome 16"],"e":"About 280 million Hb molecules per RBC; about 33% of the cell's weight vs. 96% dehydrated.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true,"note":"Dehydrated weight = weight without water."},{"l":3,"t":"Hemoglobin","q":"Select ALL correct pairs of binding type and molecule.","c":["Cooperative: O2 (each bound O2 raises affinity for more)","Competitive: CO (binds the heme site in place of O2)","Allosteric: CO2 and H+ (and nitric oxide), at other sites that change O2 binding"],"w":["Competitive: CO2 (binds the heme site in place of O2)","Cooperative: CO (each bound CO raises affinity for O2)"],"e":"Most CO2 travels as bicarbonate; about 10 to 20% is carried by hemoglobin. Binding H+ lets hemoglobin act a little as a pH buffer.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true,"note":"Cooperative: each O2 that binds helps more O2 bind. Allosteric: binding at a different part of the molecule."},{"l":3,"t":"Hemoglobin","q":"Near metabolically active tissues (higher temperature, higher CO2, lower pH), what happens to hemoglobin's affinity for oxygen?","c":"It decreases (a right shift), so hemoglobin unloads oxygen to the tissues","w":["It increases (a left shift), so hemoglobin holds on to oxygen more tightly there","It stays the same; only carbon monoxide can change hemoglobin's affinity","It increases (a right shift), which is why active tissues receive more oxygen","It decreases (a left shift), so hemoglobin holds on to oxygen more tightly there"],"e":"Lung conditions (cooler, lower CO2, higher pH) shift the curve left for loading. Tissue conditions shift it right for unloading.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true},{"l":3,"t":"Hemoglobin","q":"Why is carbon monoxide so dangerous?","c":"Hemoglobin binds CO about 240 times more strongly than O2, so CO fills heme sites and O2 delivery falls","w":["CO destroys erythrocytes directly by hemolysis, so hemoglobin spills into the plasma and is filtered out","CO binds the globin chains, not heme, and blocks the CO2 that hemoglobin carries back to the lungs","CO lowers blood pH below 7.35 by forming carbonic acid, so hemoglobin's heme groups denature","CO binds plasma albumin, so oncotic pressure falls and fluid floods the lungs"],"e":"CO is colorless, odorless and tasteless, made by incomplete combustion (furnaces, heaters, generators, grills). CO detectors save lives.","lo":"Discuss the ramifications of carbon monoxide poisoning.","deep":true},{"l":3,"t":"Hemoglobin","q":"Which set lists symptoms of carbon monoxide poisoning?","c":"Headache, dizziness, nausea, confusion, chest pain, dyspnea, ataxia, seizures, coma","w":["Fever, rash, joint pain, swollen lymph nodes, sore throat, muscle aches, night sweats","Jaundice, itching, dark urine, pale stools, abdominal pain, fatigue and weight loss","Bleeding gums, easy bruising, nosebleeds, petechiae, heavy periods and blood in the urine","Itchy eyes, sneezing, runny nose, hives and wheezing after exposure"],"e":"Because CO is undetectable by the senses, symptoms are often the first sign.","lo":"Discuss the ramifications of carbon monoxide poisoning."},{"l":3,"t":"Hemoglobin","q":"Which hemoglobin makes up nearly all hemoglobin in a healthy adult?","c":"HbA (2α2β)","w":["HbF (2α2γ)","HbA2 (2α2δ)","Embryonic Hb (2α2ε)","Carboxyhemoglobin (HbCO)"],"e":"HbA2 (2α2δ) and a little HbF (2α2γ) make up the rest.","lo":"Describe the structure, function and ontogeny of hemoglobin."},{"l":3,"t":"Blood type","q":"For which blood type would it be easiest to find a transfusion donor?","c":"Type AB","w":["Type A","Type B","Type O negative","Type O positive"],"e":"AB has no anti-A or anti-B antibodies, so it can receive A, B, AB or O: the universal recipient. Type O can receive only O.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","said":"Dr. Fox's own check question at the end of Blood Type."},{"l":3,"t":"Blood type","q":"Which statement about how blood groups are determined is correct?","c":"They are based on RBC surface antigens (agglutinogens); an antibody meeting its antigen causes agglutination","w":["They are based on antibodies on the surface of leukocytes; an antigen meeting its antibody causes hemolysis","There are only two systems, ABO and Rh, both based on plasma proteins that make blood clot when mismatched","They are based on the hemoglobin type inside the RBC; a mismatch makes donor hemoglobin hold oxygen too tightly","They are based on the number of red cells per microliter; too many causes agglutination"],"e":"Over 100 genetically identified blood types and about 35 recognized systems. ABO and Rh are the two most important for crossmatching.","lo":"Describe the nature of blood groups and how they are determined.","deep":true},{"l":3,"t":"Blood type","q":"Select ALL correct pairs of ABO type and plasma antibodies.","c":["Type A: anti-B","Type B: anti-A","Type AB: neither anti-A nor anti-B","Type O: both anti-A and anti-B"],"w":["Type O: neither","Type AB: both anti-A and anti-B"],"e":"People typically carry IgM against the A/B antigen they don't have. ABO antigens are glycosphingolipids.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","deep":true},{"l":3,"t":"Blood type","q":"A type B patient is given whole blood from a type A donor. What happens?","c":"The patient's anti-A antibodies agglutinate the donor's red cells, a potentially lethal reaction","w":["Nothing happens, because types A and B share the same agglutinogens on their red cells","The donor's anti-B antibodies destroy only the patient's leukocytes, a mild reaction","The patient's anti-B antibodies agglutinate the donor's red cells, a potentially lethal reaction","The donor's red cells are accepted, but the patient's own red cells then agglutinate"],"e":"Always ask: does the recipient's plasma have antibodies against the donor's RBC antigens? A crossmatch (donor RBCs + recipient plasma) tests this directly.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","deep":true},{"l":3,"t":"Blood type","q":"Type O is called the universal donor because:","c":"Its red cells carry neither A nor B antigen","w":["Its plasma has no anti-A or anti-B antibodies","Its red cells carry both A and B antigens","It is Rh negative by definition, so it lacks the D antigen","Its plasma carries both anti-A and anti-Rh antibodies"],"e":"Type O plasma has both anti-A and anti-B, which is why O can receive only O.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions."},{"l":3,"t":"Blood type","q":"A crossmatch test mixes:","c":"Donor red cells with recipient plasma","w":["Donor plasma with recipient red cells","Donor and recipient leukocytes","Recipient red cells with anti-Rh serum","Donor red cells with donor plasma"],"e":"No agglutination = safe to transfuse. Most transfusions today are packed RBCs or fresh frozen plasma; whole blood is rare.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","note":"No agglutination → safe to transfuse."},{"l":3,"t":"Blood type","q":"Why can an Rh− mother's antibodies harm an Rh+ fetus when ABO antibodies usually don't?","c":"Anti-Rh antibodies include IgG, small enough to cross the placenta; ABO antibodies are IgM, too large to cross","w":["Rh antigens are small glycosphingolipids that cross the placenta; ABO antigens are too large to cross","The fetus makes anti-Rh antibodies against the mother, which then cross back to attack its own red cells","Anti-Rh antibodies are IgM, small enough to cross the placenta; ABO antibodies are IgG, too large to cross","Rh antibodies form only in the fetus, so the mother's ABO antibodies have no target"],"e":"Hemolytic disease of the newborn: after fetal blood reaches the mother, she makes anti-Rh antibodies; the IgG crosses the placenta and causes hemolysis and agglutination. Most common in later pregnancies; prevented by RhoGAM.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn.","deep":true,"note":"IgG is small (crosses the placenta); IgM is large."},{"l":3,"t":"Blood type","q":"Hemolytic disease of the newborn is a risk in which pregnancy?","c":"An Rh− mother with an Rh+ fetus","w":["An Rh+ mother with an Rh− fetus","A type O mother with a type O fetus","An Rh+ mother with an Rh+ fetus","An Rh− mother with an Rh− fetus"],"e":"RhoGAM given to Rh− mothers prevents the immune response.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn."},{"l":3,"t":"Blood type","q":"Rh antigens are:","c":"Integral membrane proteins","w":["Glycosphingolipids","IgM antibodies","Plasma proteins made by the liver","Carbohydrate chains on leukocytes"],"e":"ABO antigens are glycosphingolipids; Rh antigens are proteins in the RBC membrane.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn.","note":"Rh+ = has the Rh antigen; Rh− = doesn't."},{"l":3,"t":"Leukocytes","q":"Which leukocyte would you presume to be the most abundant in the blood smear?","c":"Neutrophils","w":["Basophils","Eosinophils","Lymphocytes","Monocytes"],"e":"Neutrophils ~60%, lymphocytes ~25%, monocytes ~10%, eosinophils ~3%, basophils <1%.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","said":"Dr. Fox's own check question at the end of Leukocytes."},{"l":3,"t":"Leukocytes","q":"Select ALL correct pairs of leukocyte and feature.","c":["Neutrophil: multilobed nucleus, phagocytic, first on the scene, dead ones make pus","Eosinophil: major basic protein kills endoparasites such as schistosomes","Basophil: releases histamine and heparin; lives 1 to 2 years","Monocyte: becomes a macrophage or dendritic cell in tissues","Lymphocyte: never phagocytic; basis of acquired immunity"],"w":["Basophil: the most abundant leukocyte, living only a few hours","Lymphocyte: the main phagocyte of bacteria, whose dead cells make pus"],"e":"Neutrophils <1 week; eosinophils <2 weeks; monocytes <3 days in blood but months as macrophages; basophils 1 to 2 years.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true,"note":"Neutrophils are first on the scene; pus is a sign of active infection. Basophils release substances that encourage vasodilation."},{"l":3,"t":"Leukocytes","q":"Eosinophils release both leukotrienes and histaminidase. What is the effect on allergies?","c":"Leukotrienes exacerbate allergic responses while histaminidase breaks down histamine and slows them","w":["Both slow allergic responses: leukotrienes and histaminidase each break down histamine","Both exacerbate allergic responses: leukotrienes and histaminidase each release histamine","Histaminidase exacerbates allergic responses while leukotrienes break down histamine and slow them","Leukotrienes kill parasites directly and histaminidase triggers mast cells to release histamine"],"e":"Eosinophils are found in blood and especially mucosae, with limited phagocytosis. Major basic protein is their anti-parasite weapon.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"How do basophils contribute to anaphylaxis?","c":"Once activated, they stimulate IgE that binds mast cells, which then release histamine","w":["They phagocytose allergens and present them to helper T cells, which then release histamine","They release major basic protein, which dilates blood vessels and drops blood pressure suddenly","They become plasma cells that secrete IgG, which attaches to mast cells and releases histamine","They release fibrinogen, which clots small vessels and starves the tissues of blood"],"e":"Basophils amplify allergies (e.g. food allergies) and help fight ectoparasites such as fleas and ticks. They are mostly in the blood and rare in tissues.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"Movement of a leukocyte toward a chemical signal is called:","c":"Chemotaxis","w":["Emigration (diapedesis)","Phagocytosis","Degranulation","Agglutination"],"e":"Chemotaxis draws the cell to the site; emigration is leaving the vessel into tissue; phagocytosis is “cell eating”.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Phagocytosis = cell eating. Chemotaxis = drawn toward a chemical signal. Emigration = the leukocyte leaves the vessel."},{"l":3,"t":"Leukocytes","q":"Which cells become antigen-presenting cells (APCs) that link innate and adaptive immunity?","c":"Dendritic cells derived from monocytes","w":["Neutrophils derived from myeloid stem cells","Basophils","Natural killer cells","Erythrocytes that carry antigens on their surface"],"e":"Monocytes mature in tissues into macrophages (fixed or wandering) or dendritic cells, which present pieces of pathogens to lymphocytes.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes."},{"l":3,"t":"Leukocytes","q":"Select ALL correct statements about lymphocytes.","c":["T cells include helper, cytotoxic and suppressor (regulatory) types","B cells become plasma cells that secrete antibodies","Natural killer cells act in innate immunity without prior exposure","About 90% in blood are small; large ones are activated"],"w":["Lymphocytes come from myeloid stem cells, like neutrophils","Lymphocytes are the most phagocytic leukocyte in the blood"],"e":"Lymphocytes come from lymphoid stem cells, are found in blood, lymph and tissues, and are about 25% of WBCs.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"A WBC count above about 11,000/µL is called:","c":"Leukocytosis","w":["Leukopenia","Thrombocytosis","Polycythemia","Leukemia"],"e":"Leukopenia is below about 4,000/µL. The same pattern applies to each type (neutropenia, monocytosis, etc.).","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes."},{"l":3,"t":"Leukocytes","q":"Which leukocytes are granular?","c":"Neutrophils, eosinophils and basophils","w":["Monocytes, lymphocytes and basophils","Neutrophils, eosinophils and lymphocytes","Monocytes, eosinophils and basophils","Lymphocytes, monocytes and neutrophils"],"e":"Granular: neutrophils, eosinophils, basophils (all myeloid). Agranular: monocytes (myeloid) and lymphocytes (lymphoid).","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Granular: neutrophils, eosinophils, basophils. Agranular: monocytes, lymphocytes."},{"l":3,"t":"Thrombocytes","q":"With which blood protein must thrombocytes interact to form a clot?","c":"Fibrin","w":["Albumin","IgG","IgM","Hemoglobin"],"e":"Fibrin forms the mesh that traps and anchors thrombocytes. Albumin is for oncotic pressure; IgG and IgM are antibodies.","lo":"Describe the role of thrombocytes in the clotting process.","said":"Dr. Fox's own check question at the end of Thrombocytes.","note":"Fibrin makes the mesh that catches thrombocytes."},{"l":3,"t":"Thrombocytes","q":"Select ALL correct statements about thrombocytes.","c":["They are anucleate fragments of cytoplasm from megakaryocytes","They work in hemostasis by degranulating clot-promoting substances","They live about 7 to 10 days","The spleen stores them and removes old ones"],"w":["They are the least abundant formed element in blood","They are made from lymphoid stem cells in the thymus"],"e":"Thrombocytes (150,000 to 400,000/µL) are less abundant than RBCs but more abundant than WBCs, and come from the myeloid line.","lo":"Describe the structure and function of thrombocytes.","deep":true},{"l":3,"t":"Thrombocytes","q":"Trace thrombocyte development.","c":"Pluripotent stem cell → myeloid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","w":["Pluripotent stem cell → lymphoid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → megakaryocyte → megakaryoblast → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → monoblast → monocyte → proplatelets shed into lymph node sinuses → platelets","Pluripotent stem cell → myeloid stem cell → erythroblast → reticulocyte → proplatelets shed into marrow sinusoids → platelets"],"e":"Thrombopoietin (TPO) increases megakaryocyte formation and activates them. Splenic macrophages phagocytize old thrombocytes.","lo":"Describe the development and factors affecting development of thrombocytes.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombopoietin (TPO):","c":"Increases megakaryocyte formation and activates megakaryocytes","w":["Stimulates erythrocyte production by acting on the kidneys","Converts fibrinogen to fibrin at the site of a vascular injury","Breaks down old platelets in the spleen and recycles their iron","Carries oxygen on the surface of platelets to injured tissue"],"e":"EPO is for RBCs; thrombin converts fibrinogen; splenic macrophages remove old platelets.","lo":"Describe the development and factors affecting development of thrombocytes."},{"l":3,"t":"Thrombocytes","q":"Put the clotting steps in order.","c":"Injury → platelets bind exposed collagen via vWF → platelets form pseudopodia and degranulate → thrombin converts fibrinogen to fibrin → fibrin mesh traps more platelets","w":["Injury → platelets bind exposed collagen via vWF → thrombin converts fibrin to fibrinogen → platelets form pseudopodia and degranulate → fibrinogen mesh traps more platelets","Injury → platelets bind exposed albumin via vWF → platelets form pseudopodia and degranulate → albumin converts fibrinogen to fibrin → albumin mesh traps more platelets","Injury → fibrin binds exposed collagen directly → vWF converts fibrinogen to fibrin → platelets form pseudopodia and degranulate → the mesh traps more platelets","Injury → thrombin converts fibrinogen to fibrin → platelets bind exposed collagen via vWF → fibrin mesh traps more platelets → platelets form pseudopodia and degranulate"],"e":"Fibrinogen is soluble; fibrin is insoluble and forms the mesh. Von Willebrand factor is the intermediate between collagen and platelets.","lo":"Describe the role of thrombocytes in the clotting process.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombin converts:","c":"Soluble fibrinogen into insoluble fibrin","w":["Insoluble fibrin into soluble fibrinogen","Albumin into fibrin","Prothrombin into von Willebrand factor","Fibrinogen into von Willebrand factor"],"e":"The insoluble fibrin mesh is the basis of the clot.","lo":"Describe the role of thrombocytes in the clotting process.","note":"Fibrin forms the mesh network in which thrombocytes are captured."},{"l":3,"t":"Thrombocytes","q":"A patient has 600,000 platelets/µL and is bleeding from a small wound that won't clot. How can too many platelets cause bleeding?","c":"Paradoxical bleeding: excess platelets overwhelm von Willebrand factor, so it can't bridge collagen and platelets","w":["The extra platelets use up all the plasma albumin, so oncotic pressure falls and the small wound keeps oozing","Too many platelets block the capillaries around the wound, so fibrinogen can't reach the injured site","The spleen destroys fibrinogen when platelet counts are high, so no fibrin mesh can form at the wound","Extra platelets release thrombopoietin, which dissolves any fibrin already formed at the wound"],"e":"Thrombocytosis (>400,000/µL) risks spontaneous clotting (e.g. DVT → PE) or, paradoxically, dysfunctional clotting and bleeding.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombocytopenia (<150,000/µL) mainly increases the risk of:","c":"Bleeding or hemorrhage","w":["Spontaneous clotting in the veins","Deep vein thrombosis","Polycythemia","Hemolytic disease of the newborn"],"e":"-penia = shortage. Spontaneous clotting is a risk of thrombocytosis.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytopenia = thin blood."},{"l":3,"t":"Thrombocytes","q":"Which is a spontaneous-clotting risk of thrombocytosis?","c":"Deep vein thrombosis that can embolize to the lungs","w":["Hemolytic disease of the newborn in later pregnancies","Carbon monoxide poisoning","Leukopenia from crowding out of the marrow","Anemia from excess destruction of red blood cells"],"e":"A DVT of the lower limb can travel through the heart into the pulmonary arteries, a life-threatening pulmonary embolism.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytosis = thick blood."},{"l":1,"t":"Pericardium","q":"Select ALL correct statements about the location and gross structure of the pericardium.","c":["It is a sac surrounding the heart within the middle mediastinum","Inferiorly it is associated with and fused to the diaphragm","It has a tough outer fibrous layer and an inner serous layer"],"w":["It lies in the anterior mediastinum, directly behind the sternum only","It is part of the myocardium, fused to the cardiac muscle"],"e":"The pericardium defines the middle mediastinum. The fibrous pericardium is fused to the diaphragm below; the serous pericardium has parietal and visceral (epicardium) layers.","lo":"Understand the location and gross structure of the pericardium.","deep":true},{"l":1,"t":"Auscultation","q":"Select ALL correct statements about the heart sounds.","c":["S1 (lub) and S2 (dub) are the primary heart sounds","S3 and S4 are the secondary heart sounds","Murmurs are abnormal sounds that in adults most often point to a valve disorder"],"w":["S1 is the louder sound because the semilunar valves close","S3 and S4 are always normal findings in older adults"],"e":"S3 = Kentucky gallop (ventricular filling); S4 = Tennessee gallop (atrium contracting into a stiff ventricle). Murmurs are common and usually benign in children.","lo":"Describe the heart sounds.","deep":true},{"l":2,"t":"Common iliac artery","q":"At about which vertebral level does the abdominal aorta bifurcate into the common iliac arteries?","c":"L4","w":["T12","L1","S2","T4"],"e":"T12 is the aortic hiatus. After the L4 bifurcation, the common iliac arteries split again at the pelvic brim.","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the overall pattern of blood supply to the upper limb.","c":["One continuous vessel changes name: subclavian, then axillary, then brachial","The name changes at landmarks: lateral margin of rib 1 (axillary), teres major (brachial)","The brachial artery ends near the cubital fossa by dividing into radial and ulnar arteries","The radial and ulnar arteries feed the palmar arches, which may anastomose"],"w":["The upper limb gets most of its blood from the internal thoracic artery","The axillary artery divides into radial and ulnar arteries in the axilla"],"e":"Subclavian → axillary → brachial → radial + ulnar → palmar arches. Deep veins follow the same pattern as venae comitantes.","lo":"Describe the high-level pattern of blood supply to the upper limb.","deep":true},{"l":3,"t":"Introduction to blood","q":"Rank the formed elements from most to least abundant.","c":"Erythrocytes → thrombocytes → leukocytes","w":["Leukocytes → thrombocytes → erythrocytes","Thrombocytes → erythrocytes → leukocytes","Erythrocytes → leukocytes → thrombocytes","Leukocytes → erythrocytes → thrombocytes"],"e":"Leukocytes are the least abundant even though they come in five types.","lo":"Describe the basics of the formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"Select ALL correct statements about the formed elements.","c":["Erythrocytes are the most abundant and transport gases","Thrombocytes are the next most abundant and work in clotting","Leukocytes are the least abundant and handle immune responses","There are five major types of leukocytes"],"w":["Thrombocytes are complete cells with nuclei","Leukocytes are the most abundant formed element"],"e":"Erythrocytes and thrombocytes are anucleate. The five leukocytes: neutrophils, lymphocytes, monocytes, eosinophils, basophils.","lo":"Describe the basics of the formed elements.","deep":true},{"l":3,"t":"Blood type","q":"Blood types are categories based on:","c":"Surface antigens (agglutinogens) on red blood cells","w":["The type of hemoglobin inside the red blood cells","The number and kind of leukocytes in a sample","The clotting proteins made by the liver and found in plasma","The plasma volume compared with the formed elements"],"e":"An antibody meeting the antigen it recognizes causes a reaction such as agglutination or complement-mediated destruction.","lo":"Describe the nature of blood groups and how they are determined."},{"l":3,"t":"Thrombocytes","q":"Thrombocytes are best described as:","c":"Anucleate pieces of cytoplasm shed from megakaryocytes","w":["Small nucleated cells that develop from lymphoid stem cells","Immature erythrocytes that still hold their ribosomes","Granular leukocytes released from the red bone marrow","Agranular leukocytes that circulate in lymph"],"e":"Also called platelets; they work in hemostasis by degranulating clot-promoting substances.","lo":"Describe the structure and function of thrombocytes."},{"l":2,"t":"Vessels and circulation","q":"Which layer helps pull an artery wall back together after it is deformed?","c":"Tunica media, via its external elastic lamina","w":["Tunica externa, via its elastin and collagen","Tunica interna, via its endothelial lining","Basement membrane, via its collagen network","Tunica interna, via the vasa vasorum it carries"],"e":"On the slide, the tunica media has smooth muscle (ANS controlled) plus an elastic lamina that helps bring the walls back together after deformation. When the heart stretches the artery, that more robust outer lamina recoils and also helps drive blood forward. The interna's thin elastic lamina just adds a little elasticity; the externa is elastin and collagen.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"The media's elastic lamina helps bring the walls back together after deformation."},{"l":2,"t":"Vessels and circulation","q":"Structurally, a capillary is like an artery that has lost which layers?","c":"Tunica externa, tunica media and the internal elastic lamina","w":["Only the tunica externa, keeping the media and elastic lamina","The endothelium and basement membrane, keeping the media","Tunica interna and tunica media, keeping the externa","Only the internal elastic lamina, keeping the media and externa"],"e":"A capillary wall is just tunica interna: endothelium on a basement membrane. Strip an artery of its externa, media and internal elastic lamina and that is what is left.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"A capillary is an artery stripped of its externa, media and internal elastic lamina."},{"l":2,"t":"Vessels and circulation","q":"How does breathing (respiratory milking) help return venous blood to the heart?","c":"The diaphragm changes cavity volume, and so the pressure on the veins","w":["The lungs squeeze the venae cavae directly with each breath","Inhaled oxygen makes venous smooth muscle contract","The intercostal arteries pump blood into the azygos veins","Exhaled carbon dioxide relaxes the venous valves"],"e":"As the diaphragm moves, thoracic and abdominal cavity volumes change, changing pressure and drawing venous blood toward the heart. Muscle milking is the other pump: skeletal muscle squeezing nearby veins.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"The diaphragm can change cavity volume, which changes pressure."},{"l":2,"t":"Aorta and branches","q":"Which branch of the abdominal aorta arises at about L3 and supplies the hindgut?","c":"Inferior mesenteric a.","w":["Superior mesenteric a.","Celiac trunk","Gonadal aa.","Renal aa."],"e":"Celiac trunk ~T12 (foregut), superior mesenteric a. ~L1 (midgut), inferior mesenteric a. ~L3 (hindgut: last third of the transverse colon to the rectum).","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"Matching question: levels, where the branches go, and which artery or trunk."},{"l":2,"t":"Aorta and branches","q":"The superior mesenteric artery arises at about which level, and what does it supply?","c":"About L1; the midgut","w":["About T12; the foregut","About L3; the hindgut","About L2; the gonads","About L4; the pelvis"],"e":"SMA ~L1 → midgut (distal duodenum to about two thirds of the transverse colon). Renal aa. also arise ~L1; gonadal aa. ~L2.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"Matching question: levels, where the branches go, and which artery or trunk."},{"l":2,"t":"Aorta and branches","q":"Which opening in the diaphragm is the lowest?","c":"Aortic hiatus (T12)","w":["Esophageal hiatus (T10)","Caval opening (T8)","Superior thoracic aperture (T1)","Caval opening (T12)"],"e":"Caval opening T8, esophageal hiatus T10, aortic hiatus T12 (“I 8 10 eggs at 12”). The thoracic aorta is above the diaphragm; below the aortic hiatus it is the abdominal aorta.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"The aortic hiatus (T12) is the lowest of the caval, esophageal and aortic openings."},{"l":2,"t":"Subclavian artery and upper limb","q":"The second part of the axillary artery lies:","c":"Posterior to pectoralis minor","w":["Medial to pectoralis minor","Lateral to pectoralis minor","Posterior to the anterior scalene","Anterior to pectoralis minor"],"e":"Pectoralis minor defines the axillary artery's parts: 1st medial to it (from the lateral margin of rib 1), 2nd posterior to it, 3rd lateral to it (to teres major). The anterior scalene defines the subclavian artery's parts.","lo":"Describe the axillary a. and its parts (and what defines them).","note":"2nd part: posterior to pec minor."},{"l":2,"t":"Inferior vena cava","q":"The inferior vena cava is formed by the union of the:","c":"Common iliac veins","w":["External iliac veins","Internal iliac veins","Left and right renal veins","Hepatic veins"],"e":"The internal and external iliac veins join to form each common iliac vein, and the two common iliac veins unite to form the IVC.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","note":"IVC = union of the common iliac veins."},{"l":2,"t":"Inferior vena cava","q":"Which superficial vein passes the medial malleolus?","c":"Great saphenous v.","w":["Small saphenous v.","Popliteal v.","Femoral v.","Basilic v."],"e":"Great saphenous v.: medial lower limb, past the medial malleolus, into the femoral v. Small saphenous v.: lateral, past the lateral malleolus, into the popliteal v.","lo":"Explain regions drained by IVC tributaries.","note":"Great saphenous: medial malleolus. Small saphenous: lateral malleolus."},{"l":3,"t":"Leukocytes","q":"Emigration of a leukocyte means that it:","c":"Leaves the bloodstream to work in the tissues","w":["Moves through the blood toward a chemical signal","Engulfs and digests a pathogen in the tissues","Releases the contents of its granules","Divides to make more leukocytes of its own type"],"e":"Emigration = leaving the vessel. Chemotaxis = moving toward a chemical signal; phagocytosis = cell eating; degranulation = releasing granule contents.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Emigration = the leukocyte leaves the vessel."},{"l":3,"t":"Blood type","q":"A crossmatch shows no agglutination. What does that mean?","c":"The donor blood is safe to transfuse to that recipient","w":["The recipient has no plasma antibodies of any kind","The donor and recipient match for Rh type only","The donor's red cells must be washed before use","The recipient will make new antibodies against the donor cells"],"e":"A crossmatch mixes donor RBCs with recipient plasma. No agglutination means the recipient's antibodies don't attack the donor's cells, so the transfusion is safe.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","note":"No agglutination → safe to transfuse."},{"l":3,"t":"Thrombocytes","q":"In terms of how the blood behaves, thrombocytopenia and thrombocytosis are:","c":"Thin blood and thick blood","w":["Thick blood and thin blood","Low WBCs and high WBCs","Anemia and polycythemia","Polycythemia and anemia"],"e":"Too few platelets (<150k/µL) means bleeding risk, “thin blood”; too many (>400k/µL) means spontaneous clotting risk, “thick blood” (though paradoxical bleeding can occur).","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytopenia = thin blood; thrombocytosis = thick blood."},{"l":4,"t":"Respiratory structures & functions","q":"A person with a sore throat and a stuffy nose also has a deep, productive cough. Which infection do they have?","c":"Both upper and lower respiratory tract","w":["Upper respiratory tract only","Lower respiratory tract only","Neither; these are digestive symptoms","Upper tract only, since the cough starts at the carina"],"e":"Sore throat (pharynx) and stuffy nose (nasal cavity) are proximal to the vocal folds, so upper tract. A deep productive cough points to the bronchi or lungs, distal to the vocal folds, so lower tract. Both (Respiration slides 3 and 5).","lo":"Outline the major constituents of the respiratory system, and understand the boundary between the upper and lower respiratory tracts.","deep":true,"said":"Dr. Fox's own check question at the end of the Respiratory Structures & Functions video.","note":"sore throat, stuffy nose = upper (slide 3)"},{"l":4,"t":"Respiratory structures & functions","q":"Which structure marks the boundary between the upper and lower respiratory tracts?","c":"Vocal folds","w":["Epiglottis","Laryngeal inlet","Carina","Soft palate"],"e":"Upper tract = proximal to the vocal folds (nose, nasal and oral cavities, pharynx, proximal larynx). Lower tract = distal to the vocal folds (distal larynx, tracheobronchial tree, lungs) (Respiration slide 3).","lo":"Outline the major constituents of the respiratory system, and understand the boundary between the upper and lower respiratory tracts."},{"l":4,"t":"Respiratory structures & functions","q":"Select ALL structures that belong to the lower respiratory tract.","c":["Infraglottic cavity","Trachea","Tertiary bronchi","Alveoli"],"w":["Nasopharynx","Laryngeal vestibule"],"e":"Anything distal to the vocal folds is lower tract. The infraglottic cavity sits just below the vocal folds, so it is lower; the laryngeal vestibule is above the vestibular and vocal folds, so it is upper, like the nasopharynx (Respiration slides 3 and 41).","lo":"Outline the major constituents of the respiratory system, and understand the boundary between the upper and lower respiratory tracts.","deep":true},{"l":4,"t":"Respiratory structures & functions","q":"Which regions make up the aerodigestive pathway, shared by the respiratory and digestive systems?","c":"Mouth, oral cavity and pharynx","w":["Nose, nasal cavity and larynx","Larynx, trachea and esophagus","Nasal cavity, larynx and trachea","Nasal cavity, nasopharynx and trachea"],"e":"The nose and nasal cavity are exclusively respiratory. The mouth, oral cavity and pharynx carry both air and food; at the laryngopharynx material goes either to the esophagus or to the larynx (Respiration slide 3).","lo":"Outline the major constituents of the respiratory system, and understand the boundary between the upper and lower respiratory tracts.","deep":true},{"l":4,"t":"Respiratory structures & functions","q":"A patient's blood pH is 7.30. How can the respiratory system help bring it back toward normal?","c":"Increase ventilation to blow off more CO2","w":["Slow ventilation to hold on to more CO2","Increase ventilation to load more O2","Slow ventilation to hold on to bicarbonate","Hold the breath to retain more O2"],"e":"pH below 7.35 is acidemia. CO2 is a volatile acid, so breathing faster blows it off and raises pH. In alkalosis (above 7.45) we slow ventilation to keep CO2 (Respiration slide 4; Dr. Fox in the first video).","lo":"Outline the major functions of the respiratory system.","deep":true},{"l":4,"t":"Respiratory structures & functions","q":"Which list gives the three major respiratory functions from lecture?","c":"Gas exchange, sound and vocalization, olfaction","w":["Gas exchange, olfaction, filtering blood plasma","Sound and vocalization, digestion, gas exchange","Olfaction, blood pressure control, swallowing","Gas exchange, surfactant storage, taste"],"e":"The three functions: gas exchange (O2 and CO2, plus pH homeostasis), sound and vocalization, and olfaction (Respiration slide 4).","lo":"Outline the major functions of the respiratory system."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Which external feature of the nose is the skin-covered cartilage around each nostril, the part that flares?","c":"Ala","w":["Columella","Naris","Choana","Concha"],"e":"Ala means wing: the skin-covered cartilage around each naris. The columella is the fleshy strip between the nares, in line with the septum; the choanae are at the back of the nasal cavity (Respiration slide 8).","lo":"Describe the features of the nose."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Which order does air follow from the nostril to the throat?","c":"Naris → nasal vestibule → nasal cavity → choana → nasopharynx","w":["Naris → nasal cavity → nasal vestibule → choana → nasopharynx","Nasal vestibule → naris → nasal cavity → choana → oropharynx","Naris → nasal vestibule → choana → nasal cavity → nasopharynx","Naris → choana → nasal vestibule → nasal cavity → nasopharynx"],"e":"The nasal vestibule connects the naris to the nasal cavity, and the choanae at the back of the nasal cavity open into the nasopharynx (Respiration slide 9).","lo":"Describe the features and functions of the nasal cavity.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"What is the main job of the large mucosa-covered surface the conchae give the nasal cavity?","c":"Warm and moisten air and trap impurities","w":["Exchange O2 and CO2 with the blood","Drain tears from the orbit to the pharynx","Seal the nasopharynx during swallowing","Detect odorants across its whole surface"],"e":"The conchae are mucosa-covered bony shelves. Their surface area lets the nasal mucosa warm and humidify air and trap impurities. Gas exchange only happens in the respiratory zone of the lungs (Respiration slides 9 and 10).","lo":"Describe the features and functions of the nasal cavity.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Someone crying hard also gets a runny nose. Through which communication do the tears reach the nasal cavity?","c":"Nasolacrimal duct, into the inferior meatus","w":["Paranasal sinus, into the middle meatus","Choana, into the nasal cavity","Pharyngotympanic tube, into the nasopharynx","Choana, into the nasopharynx"],"e":"The nasolacrimal duct drains tears from the medial orbit into the inferior nasal meatus. The meatuses also communicate with the paranasal sinuses, but tears don't travel that way (Respiration slide 10; Dr. Fox in the nose video).","lo":"Describe the features and functions of the nasal cavity.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"A patient chews normally but can't close their lips tightly around a straw. Which nerve is most likely injured?","c":"Facial n. (CN VII)","w":["Mandibular n. (V3)","Maxillary n. (V2)","Vagus n. (CN X)","Glossopharyngeal n. (CN IX)"],"e":"Whether the oral fissure is open or closed depends on the muscles of facial expression, mainly orbicularis oris, all supplied by CN VII. Chewing (muscles of mastication) is V3. V2 is purely sensory, and the vagus has no role in the face (Respiration slides 11 and 13).","lo":"Describe the mouth and the muscles that affect the oral fissure vs. movement of the mandible.","deep":true,"said":"Dr. Fox's own check question at the end of the Nose, Mouth, Nasal & Oral Cavities video.","note":"V2 = sensory; V3 = muscles of mastication (slide 13)"},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Which pairing of movement, muscle and nerve is correct?","c":"Parting the lips: orbicularis oris, CN VII; dropping the jaw: mastication muscles, V3","w":["Parting the lips: masseter, V3; dropping the jaw: orbicularis oris, CN VII","Parting the lips: orbicularis oris, V3; dropping the jaw: mastication muscles, CN VII","Parting the lips: temporalis, CN VII; dropping the jaw: orbicularis oris, V3","Parting the lips: orbicularis oris, V2; dropping the jaw: mastication muscles, CN X"],"e":"The oral fissure is controlled by muscles of facial expression (orbicularis oris), CN VII. The mandible is moved by the muscles of mastication (masseter, temporalis), V3 (Respiration slide 11).","lo":"Describe the mouth and the muscles that affect the oral fissure vs. movement of the mandible.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"What separates the oral cavity proper from the oropharynx?","c":"Palatoglossal arch","w":["Palatopharyngeal arch","Soft palate","Teeth and gingiva","Uvula"],"e":"The palatoglossal arch (palatoglossus muscle under mucosa) divides the oral cavity proper from the oropharynx. The teeth and gingiva divide the oral vestibule from the oral cavity proper; the soft palate separates the nasopharynx from the oropharynx (Respiration slides 12 and 17).","lo":"Describe the oral cavity with an emphasis for ventilation.","deep":true},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"The space between the teeth and gums and the lips and cheeks is the:","c":"Oral vestibule","w":["Oral cavity proper","Sublingual space","Fauces","Oropharynx"],"e":"Everything outside the teeth but inside the lips and cheeks is the oral vestibule. Inside the teeth is the oral cavity proper (Respiration slide 12).","lo":"Describe the oral cavity with an emphasis for ventilation."},{"l":4,"t":"Nose, mouth, nasal & oral cavities","q":"Which part of the tongue lies in the oral cavity proper?","c":"Anterior two-thirds","w":["Posterior one-third","Anterior one-third","Posterior two-thirds","Only the tip"],"e":"Only the anterior two-thirds of the tongue is in the oral cavity proper. The posterior third (the root, with the lingual tonsil) is in the oropharynx (Respiration slides 12 and 19).","lo":"Describe the oral cavity with an emphasis for ventilation."},{"l":4,"t":"Pharynx","q":"At the laryngopharynx, where do swallowed food and inhaled air go?","c":"Food: posteriorly to the esophagus; air: anteriorly to the larynx","w":["Food: anteriorly to the esophagus; air: posteriorly to the larynx","Food: anteriorly to the trachea; air: posteriorly to the esophagus","Food: posteriorly to the larynx; air: anteriorly to the esophagus","Food: anteriorly to the larynx; air: posteriorly to the trachea"],"e":"The pharynx communicates with the larynx (respiratory, anterior) and the esophagus (digestive, posterior). The laryngopharynx is where that decision is made (Respiration slides 16 and 22; Dr. Fox in the first video).","lo":"Describe the pharynx and adjacent communicating spaces and how they function as part of either the respiratory or digestive systems.","deep":true},{"l":4,"t":"Pharynx","q":"What are the boundaries of the nasopharynx?","c":"From the choanae to the soft palate","w":["From the choanae to the epiglottis","From the soft palate to the epiglottis","From the palatoglossal arch to the soft palate","From the nares to the choanae"],"e":"Nasopharynx: choanae to soft palate. Oropharynx: palatoglossal arch to the epiglottis and pharyngo-epiglottic fold. Laryngopharynx: down to the laryngeal inlet and the esophagus at the cricoid (C6) (Respiration slide 17).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true},{"l":4,"t":"Pharynx","q":"Which pharyngeal spaces host significant lymphoid tissue, such as tonsils?","c":"Nasopharynx and oropharynx","w":["Oropharynx and laryngopharynx","Laryngopharynx only","Nasopharynx and laryngopharynx","Laryngopharynx and oropharynx only"],"e":"Nasopharynx: pharyngeal tonsil (adenoid) and tubal tonsils. Oropharynx: palatine and lingual tonsils. The laryngopharynx has no tonsils (Respiration slides 18, 19 and 23).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true,"said":"Dr. Fox's own check question at the end of the Pharynx video.","note":"tubal = naso; others = oro (slide 23)"},{"l":4,"t":"Pharynx","q":"A child has their adenoid removed. Where was it?","c":"Roof of the nasopharynx","w":["Lateral wall of the oropharynx","Root of the tongue","Lateral wall of the laryngopharynx","Palatine fossa"],"e":"The adenoid is the pharyngeal tonsil, on the roof of the nasopharynx. The palatine tonsils are in the oropharynx's lateral walls, and the lingual tonsil is on the root of the tongue (Respiration slides 18 and 19).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true},{"l":4,"t":"Pharynx","q":"On a plane, your ears feel full and then pop when you swallow. What opened to equalize the pressure?","c":"Pharyngotympanic tube","w":["Nasolacrimal duct","Choana","Piriform recess","Laryngeal inlet"],"e":"The pharyngotympanic (auditory, Eustachian) tube connects the nasopharynx to the middle ear. Swallowing or chewing opens it so the pressures equalize. A small tubal tonsil can sit around its opening (Respiration slide 18; Dr. Fox in the pharynx video).","lo":"Describe the pharynx and adjacent communicating spaces and how they function as part of either the respiratory or digestive systems.","deep":true},{"l":4,"t":"Pharynx","q":"Where are the palatine tonsils?","c":"In the palatine fossae, between the palatoglossal and palatopharyngeal folds","w":["On the root of the tongue, just in front of the epiglottic valleculae","On the roof of the nasopharynx, just above the soft palate","Around the opening of the pharyngotympanic tube, in the nasopharynx","In the piriform recesses, on either side of the laryngeal inlet"],"e":"The fauces are bounded by the palatoglossal folds (anterior) and palatopharyngeal folds (posterior). In each palatine fossa between them sits a palatine tonsil. The root of the tongue has the lingual tonsil, and the nasopharynx roof has the pharyngeal tonsil (Respiration slide 19).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true},{"l":4,"t":"Pharynx","q":"During laryngoscopy with a Macintosh-style blade, where does the blade tip go to lift the tongue and expose the larynx?","c":"Epiglottic valleculae","w":["Piriform recesses","Palatine fossae","Laryngeal ventricle","Nasopharynx"],"e":"The valleculae, between the root of the tongue and the epiglottis, are a key laryngoscopy landmark. The blade sits there and pulls the tongue forward for a view of the vocal folds (Respiration slide 20; Dr. Fox in the pharynx video).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true},{"l":4,"t":"Pharynx","q":"A swallowed pill lodges in the pharynx just lateral to the larynx. Where is it most likely stuck?","c":"Piriform recess","w":["Epiglottic vallecula","Laryngeal ventricle","Palatine fossa","Pharyngotympanic tube"],"e":"Read the stem as two clues: \"in the pharynx\" and \"just lateral to the larynx\". The piriform recesses are exactly that: pockets of the laryngopharynx on either side of the larynx, and Dr. Fox says swallowed pills or bits of food can jam there (Respiration slide 22, where they are listed but not pictured). The epiglottic vallecula sits in front of the epiglottis, between it and the root of the tongue (slides 19 and 20). The laryngeal ventricle is inside the larynx, not the pharynx (slide 41). The palatine fossa is in the oropharynx and the pharyngotympanic tube opens into the nasopharynx.","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true},{"l":4,"t":"Pharynx","q":"Which best describes the piriform recesses?","c":"Pockets of the laryngopharynx on either side of the larynx","w":["Pockets of the oropharynx between the tongue and epiglottis","Spaces inside the larynx between the two pairs of folds","Pockets of the nasopharynx around the tubal openings","Grooves of the oropharynx holding the palatine tonsils"],"e":"The piriform recesses belong to the pharynx (the laryngopharynx) but sit lateral to the larynx, one on each side (Respiration slide 22; Dr. Fox in the pharynx video). Between the tongue and the epiglottis are the epiglottic valleculae (slide 20); between the vestibular and vocal folds is the laryngeal ventricle (slide 41).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true,"note":"Guessed r-ph8: didn't know where the piriform recess is"},{"l":4,"t":"Pharynx","q":"A fish bone is stuck just in front of the epiglottis, between it and the root of the tongue. Where is it?","c":"Epiglottic vallecula","w":["Piriform recess","Laryngeal ventricle","Palatine fossa","Laryngeal inlet"],"e":"In front of the epiglottis, behind the root of the tongue, are the epiglottic valleculae, which normally trap saliva (Respiration slide 20). Compare the piriform recesses, which are beside the larynx in the laryngopharynx (slide 22). Front of the epiglottis: vallecula. Side of the larynx: piriform recess.","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true,"note":"Guessed r-ph8: vallecula vs piriform recess"},{"l":4,"t":"Pharynx","q":"What do the epiglottic valleculae do?","c":"Collect saliva so the swallowing reflex triggers less often","w":["Funnel air toward the vocal folds during inhalation","Trap inhaled antigens for the lymphatic system","Connect the middle ear to the pharynx","Hold the lingual tonsil in place"],"e":"The valleculae collect and trap saliva, delaying the deglutition reflex so you aren't swallowing constantly. They are also the laryngoscopy landmark (Respiration slide 20).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils.","deep":true,"note":"traps saliva so swallowing reflex isn't triggered as often (slide 20)"},{"l":4,"t":"Pharynx","q":"What is the purpose of Waldeyer's ring?","c":"Exposing antigens in food, drink and air to lymphoid tissue early","w":["Filtering pathogens out of blood leaving the head and neck","Warming and humidifying air before it reaches the larynx","Sealing off the nasopharynx from the oropharynx in swallowing","Moving food from the oral cavity into the esophagus"],"e":"Waldeyer's ring (pharyngeal, tubal, palatine and lingual tonsils) is a ring of MALT. Anything swallowed or inhaled brushes against it, giving the immune system a head start (Respiration slide 21).","lo":"Describe the pharynx and adjacent communicating spaces and how they function as part of either the respiratory or digestive systems.","deep":true,"note":"gives immune system head start via lymph (slide 21)"},{"l":4,"t":"Pharynx","q":"At which landmark does the laryngopharynx become the esophagus?","c":"Inferior border of the cricoid cartilage (C6)","w":["Inferior border of the thyroid cartilage (C4)","Body of the hyoid bone (C3)","Sternal angle (T4/5)","Thoracic plane (T4/5)"],"e":"The laryngopharynx opens into the esophagus at the inferior border of the cricoid cartilage, level with C6 (Respiration slides 17 and 22).","lo":"Describe the divisions of the pharynx, their boundaries, and major contents, e.g. tonsils."},{"l":4,"t":"Pharyngeal muscles & nervous plexus","q":"Which muscle of the pharyngeal wall is NOT innervated by the pharyngeal plexus?","c":"Stylopharyngeus","w":["Palatopharyngeus","Salpingopharyngeus","Inferior pharyngeal constrictor","Superior pharyngeal constrictor"],"e":"All three constrictors and two of the three longitudinal muscles get motor fibers from CN X through the pharyngeal plexus. Stylopharyngeus is the exception: it is supplied by the glossopharyngeal nerve (CN IX), which runs along it (Respiration slides 27 and 29).","lo":"Describe the muscles that comprise the walls of the pharynx and the pharyngeal neural plexus.","deep":true,"said":"Dr. Fox's own check question at the end of the Pharyngeal Muscles & Nervous plexus video."},{"l":4,"t":"Pharyngeal muscles & nervous plexus","q":"How do the two groups of pharyngeal muscles differ?","c":"Constrictors narrow it in sequence; longitudinal muscles shorten and widen it","w":["Constrictors shorten and widen it; longitudinal muscles narrow it in sequence","Constrictors depress the larynx; longitudinal muscles narrow it in sequence","Both groups narrow it in sequence; only the constrictors raise the larynx","Constrictors widen it; longitudinal muscles narrow it and lower the larynx"],"e":"Superior, middle and inferior constrictors nest like cups and constrict one after another. The longitudinal muscles (salpingo-, palato- and stylopharyngeus) shorten and widen the pharynx by elevating the larynx. Both move a bolus during swallowing (Respiration slides 26 and 27).","lo":"Describe the muscles that comprise the walls of the pharynx and the pharyngeal neural plexus.","deep":true},{"l":4,"t":"Pharyngeal muscles & nervous plexus","q":"Select ALL correctly matched contributions to the pharyngeal plexus.","c":["CN IX: sensory from the pharyngeal mucosa","CN X: motor to the pharyngeal muscles","CN X: parasympathetic to the mucosal glands","Superior cervical ganglion: vasomotor"],"w":["CN IX: motor to the pharyngeal constrictors","CN XII: motor to the palatopharyngeus"],"e":"CN IX brings somatic sensory (afferent) fibers. CN X brings somatic motor fibers to the muscles and visceral motor (parasympathetic) fibers to the mucosa. The superior cervical sympathetic ganglia add vasomotor fibers. IX and X both leave the skull through the jugular foramen (Respiration slide 28).","lo":"Describe the muscles that comprise the walls of the pharynx and the pharyngeal neural plexus.","deep":true},{"l":4,"t":"Pharyngeal muscles & nervous plexus","q":"Something unexpected touches the back of a patient's throat and they gag. Which nerves carry the two limbs of that reflex?","c":"Sensory: CN IX; motor: CN X","w":["Sensory: CN X; motor: CN IX","Sensory: CN V; motor: CN VII","Sensory: CN IX; motor: CN XII","Sensory: CN X; motor: CN XII"],"e":"The gag (pharyngeal) reflex runs through the pharyngeal plexus: CN IX brings the sensation from the pharynx, and CN X drives the muscles that expel the foreign body (Respiration slide 28).","lo":"Describe the muscles that comprise the walls of the pharynx and the pharyngeal neural plexus.","deep":true},{"l":4,"t":"Pharyngeal muscles & nervous plexus","q":"Where does the middle pharyngeal constrictor attach anteriorly?","c":"Hyoid bone","w":["Thyroid and cricoid cartilages","Buccopharyngeal raphe","Styloid process","Mandible"],"e":"Superior constrictor: skull, buccopharyngeal raphe, mandible. Middle: hyoid. Inferior: thyroid and cricoid cartilages of the larynx. All meet posteriorly at the pharyngeal raphe (Respiration slide 26).","lo":"Describe the muscles that comprise the walls of the pharynx and the pharyngeal neural plexus."},{"l":4,"t":"Larynx & laryngoskeleton","q":"Which best describes where the larynx sits?","c":"Below the hyoid, in front of the laryngopharynx, above the trachea","w":["Above the hyoid, behind the laryngopharynx, above the trachea","Below the hyoid, behind the esophagus, below the trachea","Below the hyoid, behind the laryngopharynx, below the trachea","Above the hyoid, in front of the laryngopharynx, below the trachea"],"e":"Check each option one part at a time. Above the larynx is the hyoid bone, which the larynx hangs from by the thyrohyoid membrane, so the larynx is below the hyoid. Behind it is the laryngopharynx, so the larynx is in front of it. Below it is the trachea, which hangs from the cricoid by the cricotracheal ligament, so the larynx is above the trachea. Only one option gets all three right. It spans roughly C4 to C6 (Respiration slide 32; Dr. Fox in the larynx video).","lo":"Describe the larynx, where is it located, how it relates to adjacent structures, and its functions.","deep":true},{"l":4,"t":"Larynx & laryngoskeleton","q":"Which structure lies directly posterior to the larynx?","c":"Laryngopharynx","w":["Trachea","Hyoid bone","Thyroid gland","Cricothyroid m."],"e":"The larynx sits anterior to the laryngopharynx, so food passes behind the larynx on its way to the esophagus (Respiration slides 22 and 32). The trachea is below the larynx and the hyoid is above it. The thyroid gland is anterolateral to the larynx (Dr. Fox, laryngeal neurovasculature video), and the cricothyroid is on the front of the larynx itself (slide 51).","lo":"Describe the larynx, where is it located, how it relates to adjacent structures, and its functions.","deep":true,"note":"Guessed r-lx1: where the larynx sits"},{"l":4,"t":"Larynx & laryngoskeleton","q":"What does the larynx hang from above, and what hangs from it below?","c":"Hyoid, by the thyrohyoid membrane; trachea, by the cricotracheal lig.","w":["Hyoid, by the cricotracheal lig.; trachea, by the thyrohyoid membrane","Mandible, by the thyrohyoid membrane; trachea, by the cricotracheal lig.","Hyoid, by the thyrohyoid membrane; esophagus, by the cricotracheal lig.","Mandible, by the cricotracheal lig.; esophagus, by the thyrohyoid membrane"],"e":"The names give the answer: the thyrohyoid membrane joins the thyroid cartilage to the hyoid above, and the cricotracheal ligament joins the cricoid to the trachea below (Respiration slide 32). That puts the larynx below the hyoid and above the trachea.","lo":"Describe the larynx, where is it located, how it relates to adjacent structures, and its functions.","deep":true,"note":"Guessed r-lx1: where the larynx sits"},{"l":4,"t":"Larynx & laryngoskeleton","q":"Which structure suspends the larynx from the hyoid bone?","c":"Thyrohyoid membrane","w":["Cricotracheal ligament","Median cricothyroid ligament","Quadrangular membrane","Conus elasticus"],"e":"The thyrohyoid membrane suspends the thyroid cartilage from the hyoid. The cricotracheal ligament suspends the trachea from the cricoid (Respiration slide 32).","lo":"Describe the larynx, where is it located, how it relates to adjacent structures, and its functions."},{"l":4,"t":"Larynx & laryngoskeleton","q":"Which major laryngeal cartilage has many intrinsic muscle attachments but does not move?","c":"Cricoid","w":["Arytenoid","Thyroid","Epiglottic","Corniculate"],"e":"The cricoid is the stable base: the posterior and lateral crico-arytenoids and the cricothyroid pull from it, but it is the one akinetic cartilage. The arytenoids are the most kinetic; the thyroid and epiglottis also move (Respiration slides 35 to 37).","lo":"Describe the laryngoskeleton, detailing constituent cartilages and their features.","deep":true,"said":"Dr. Fox's own check question at the end of the Larynx & Laryngoskeleton video.","note":"arytenoid = most kinetic; thyroid & epiglottic kinetic (slide 37) · the question asks which cartilage is least kinetic: cricoid, the only akinetic one"},{"l":4,"t":"Larynx & laryngoskeleton","q":"What is the Adam's apple?","c":"The laryngeal prominence of the thyroid cartilage","w":["The anterior arch of the cricoid cartilage","The leaf of the epiglottic cartilage","The body of the hyoid bone","The inferior horn of the thyroid cartilage"],"e":"The two thyroid laminae meet in the midline; the upper end of that meeting is the laryngeal prominence, or Adam's apple (Respiration slide 34).","lo":"Describe the laryngoskeleton, detailing constituent cartilages and their features.","deep":true,"note":"laryngeal prominence = Adam's apple (slide 34)"},{"l":4,"t":"Larynx & laryngoskeleton","q":"What attaches to the two processes of each arytenoid cartilage?","c":"Vocal process: the vocal ligament; muscular process: intrinsic muscles","w":["Vocal process: intrinsic muscles; muscular process: the vocal ligament","Vocal process: the hyoid; muscular process: the thyroid cartilage","Vocal process: the epiglottis; muscular process: the vocal ligament","Vocal process: the cricoid; muscular process: the epiglottis"],"e":"The vocal process (anterior) anchors the vocal ligament, which runs forward to the thyroid cartilage. The muscular process (lateral) is where intrinsic muscles such as the crico-arytenoids pull to pivot the cartilage (Respiration slide 36).","lo":"Describe the laryngoskeleton, detailing constituent cartilages and their features.","deep":true},{"l":4,"t":"Larynx & laryngoskeleton","q":"The inferior horns of the thyroid cartilage articulate with the:","c":"Cricoid cartilage","w":["Hyoid bone","Arytenoid cartilages","First tracheal ring","Epiglottic cartilage"],"e":"Inferior horns meet the cricoid at the cricothyroid joints. Superior horns point up toward the greater horns of the hyoid (Respiration slide 34).","lo":"Describe the laryngoskeleton, detailing constituent cartilages and their features."},{"l":4,"t":"Laryngeal membranes & cavities","q":"Which intrinsic membrane funnels air out of the larynx and contains the vocal ligaments?","c":"Conus elasticus","w":["Quadrangular membrane","Thyrohyoid membrane","Aryepiglottic ligament","Cricotracheal ligament"],"e":"The quadrangular membranes (proximal) funnel air in and contain the aryepiglottic and vestibular ligaments. The conus elasticus (distal) funnels air out over the vocal ligaments and includes the cricothyroid membranes (Respiration slide 40).","lo":"Describe the intrinsic laryngeal membranes, their major features, and functions.","deep":true},{"l":4,"t":"Laryngeal membranes & cavities","q":"In which order does inhaled air pass through the spaces of the larynx?","c":"Vestibule → rima vestibuli → ventricle → rima glottidis → infraglottic cavity","w":["Vestibule → rima glottidis → ventricle → rima vestibuli → infraglottic cavity","Rima vestibuli → vestibule → ventricle → rima glottidis → infraglottic cavity","Vestibule → ventricle → rima vestibuli → rima glottidis → infraglottic cavity","Infraglottic cavity → rima glottidis → ventricle → rima vestibuli → vestibule"],"e":"Laryngeal vestibule (entry), rima vestibuli (between the vestibular folds), laryngeal ventricle, rima glottidis (between the vocal folds), infraglottic cavity, then trachea (Respiration slide 41; Dr. Fox in the membranes video).","lo":"Describe the intrinsic laryngeal membranes, their major features, and functions.","deep":true},{"l":4,"t":"Laryngeal membranes & cavities","q":"What is the space separating the vocal folds from the vestibular folds?","c":"Laryngeal ventricle","w":["Laryngeal vestibule","Rima glottidis","Rima vestibuli","Infraglottic cavity"],"e":"The laryngeal ventricle lies between the vestibular (false) and vocal (true) folds. The vestibule is where air first enters; the rimae are the gaps between each pair of folds (Respiration slides 41 and 43).","lo":"Describe the intrinsic laryngeal membranes, their major features, and functions.","deep":true,"said":"Dr. Fox's own check question at the end of the Laryngeal Membranes & Cavities video.","note":"vestibule = where air enters; rima = space between folds (slide 43)"},{"l":4,"t":"Laryngeal membranes & cavities","q":"Throat singing produces sound by vibrating which folds?","c":"Vestibular (false vocal) folds","w":["Vocal (true vocal) folds","Aryepiglottic folds","Palatopharyngeal folds","Aryepiglottic and vocal folds together"],"e":"The vestibular folds are mainly protective for the vocal folds, but they can vibrate; that is throat singing. Normal speech uses the true vocal folds (Dr. Fox in the membranes video; Respiration slide 40).","lo":"Describe the intrinsic laryngeal membranes, their major features, and functions.","deep":true},{"l":4,"t":"Laryngeal membranes & cavities","q":"In an emergency, you slide a finger down from the laryngeal prominence to the soft spot just above the cricoid. What do you cut through?","c":"Median cricothyroid ligament","w":["Thyrohyoid membrane","Cricotracheal ligament","Second tracheal ring","Quadrangular membrane"],"e":"A cricothyrotomy incises and cannulates the median cricothyroid ligament, between the thyroid and cricoid cartilages. Good surface landmarks and no superficial vessels make it safe to do emergently (Respiration slide 42).","lo":"Relate the anatomy of the larynx and surrounding structures to methods of gaining airway access.","deep":true},{"l":4,"t":"Laryngeal membranes & cavities","q":"Why must a tracheostomy be done surgically, while a cricothyrotomy can be done emergently?","c":"Vessels such as inferior thyroid veins or a thyroid ima artery may be in the way","w":["The cricothyroid site lies directly over the thyroid ima artery","The trachea can only be reached by passing behind the esophagus","The tracheostomy site has no reliable surface landmarks to palpate","A tracheostomy must cut through the cricoid cartilage"],"e":"A tracheostomy is a vertical incision about 1 cm above the jugular notch, where inferior thyroid veins and, in about 10% of people, a thyroid ima artery can bleed. The cricothyroid site has no superficial vessels (Respiration slide 42; Dr. Fox in the membranes video).","lo":"Relate the anatomy of the larynx and surrounding structures to methods of gaining airway access.","deep":true},{"l":4,"t":"Laryngeal membranes & cavities","q":"A patient will need an artificial airway for several weeks. Which approach fits?","c":"Tracheostomy, about 1 cm above the jugular notch","w":["Cricothyrotomy through the median cricothyroid ligament","Incision through the thyrohyoid membrane","Cricothyrotomy through the lateral cricothyroid membrane","Incision through the cricotracheal ligament"],"e":"A cricothyrotomy is for emergencies; its small size and location make it poor for long-term use. A surgical tracheostomy is used for long-term airway maintenance (Respiration slide 42; Dr. Fox in the membranes video).","lo":"Relate the anatomy of the larynx and surrounding structures to methods of gaining airway access.","deep":true},{"l":4,"t":"Laryngeal muscles","q":"What distinguishes extrinsic from intrinsic laryngeal muscles?","c":"Extrinsic link the larynx to other structures; intrinsic link its own cartilages","w":["Intrinsic link the larynx to other structures; extrinsic link its own cartilages","Extrinsic adjust vocal fold tension; intrinsic only raise or lower the larynx","Extrinsic are all supplied by the recurrent laryngeal nerves; intrinsic are not","Intrinsic are all suprahyoid muscles; extrinsic are all infrahyoid muscles"],"e":"Extrinsic muscles (suprahyoids, infrahyoids, longitudinal pharyngeal muscles) move the whole larynx up or down. Intrinsic muscles connect laryngoskeleton parts to each other to abduct/adduct and tense the vocal folds (Respiration slides 46 and 47).","lo":"Describe and give examples of extrinsic vs. intrinsic muscles of the larynx and their functions.","deep":true},{"l":4,"t":"Laryngeal muscles","q":"A singer lowers their larynx to get a deeper resonance. Which muscle does that?","c":"Sternothyroid","w":["Thyrohyoid","Stylopharyngeus","Mylohyoid","Posterior crico-arytenoid"],"e":"A higher larynx gives a brighter, fuller voice; a lower larynx gives deeper resonance. Sternothyroid depresses the larynx. Thyrohyoid, the suprahyoids (such as mylohyoid) and the longitudinal pharyngeal muscles elevate it (Respiration slide 46).","lo":"Describe and give examples of extrinsic vs. intrinsic muscles of the larynx and their functions.","deep":true,"note":"Sternothyroid = depresses larynx = deeper resonance (slide 46)"},{"l":4,"t":"Laryngeal muscles","q":"How should the vocal folds be positioned to favor ventilation over phonation?","c":"Abducted, widening the rima glottidis","w":["Adducted, narrowing the rima glottidis","Adducted, widening the rima glottidis","Abducted, narrowing the rima glottidis","Halfway between, to balance airflow and voice"],"e":"Ventilation is wide: abducted folds, open rima glottidis. Phonation is narrow: adducted folds that vibrate as air passes (Respiration slides 47 and 48).","lo":"Outline the effects of intrinsic muscle actions on the rima glottidis, ventilation pathway, and phonation.","deep":true,"said":"Dr. Fox's own check question at the end of the Laryngeal Muscles video.","note":"close = phonation = adduction; open = ventilation = abduction (slide 52)"},{"l":4,"t":"Laryngeal muscles","q":"To raise the pitch of the voice, what has to change at the vocal ligaments?","c":"More tension","w":["Less tension","More abduction","Less adduction","A lower larynx"],"e":"Pitch is proportional to tension on the vocal ligaments. Abduction moves the folds out of position for phonation entirely (Respiration slide 47).","lo":"Outline the effects of intrinsic muscle actions on the rima glottidis, ventilation pathway, and phonation.","deep":true},{"l":4,"t":"Intrinsic laryngeal muscles","q":"Which intrinsic laryngeal muscle is most important for ventilation?","c":"Posterior crico-arytenoid","w":["Lateral crico-arytenoid","Transverse arytenoid","Cricothyroid","Thyro-arytenoid"],"e":"The posterior crico-arytenoids rotate the arytenoids laterally, abducting the vocal ligaments and opening the rima glottidis. They are the only intrinsic muscles that open the airway (Respiration slides 55 and 57).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true,"said":"Dr. Fox's own check question at the end of the Intrinsic Laryngeal Muscles video.","note":"maximally opens rima glottidis (slide 55)"},{"l":4,"t":"Intrinsic laryngeal muscles","q":"Both posterior crico-arytenoid muscles are paralyzed. What would you expect?","c":"The folds can't abduct, so the airway stays narrow","w":["The folds can't adduct, so the voice is breathy","Pitch can't rise, but breathing is unaffected","The epiglottis can't swing down when swallowing","The thyroid can't tip, so the voice stays low"],"e":"The posterior crico-arytenoids are the only abductors. Without them nothing opens the rima glottidis, so ventilation suffers while the adductors still work (Respiration slides 52 and 55; Dr. Fox in the intrinsic muscles video).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true},{"l":4,"t":"Intrinsic laryngeal muscles","q":"What does the cricothyroid muscle do?","c":"Tips the thyroid forward and down, tensing the folds to raise pitch","w":["Rotates the arytenoids outward, opening the rima glottidis wide","Pulls the arytenoids forward, slackening the folds to lower pitch","Glides the arytenoids together, closing the rima glottidis tight","Lifts the whole larynx up toward the hyoid bone"],"e":"At the cricothyroid hinge joint, the cricothyroid tips the thyroid cartilage anteriorly and downward. Since the vocal ligaments run from the arytenoids to the thyroid, that stretches them and raises pitch (Respiration slide 51).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true},{"l":4,"t":"Intrinsic laryngeal muscles","q":"Select ALL muscles that adduct the vocal ligaments and close the rima glottidis.","c":["Transverse arytenoid","Oblique arytenoid","Lateral crico-arytenoid"],"w":["Posterior crico-arytenoid","Cricothyroid"],"e":"The arytenoid muscles glide the arytenoids together and the lateral crico-arytenoids rotate the vocal processes inward: both adduct for phonation. Posterior crico-arytenoids abduct; cricothyroid changes tension, not position (Respiration slides 52 to 54).","lo":"Describe the attachments, innervations, and effects on ventilation and phonation of the intrinsic laryngeal muscles and their parts.","deep":true,"note":"arytenoid = adducting; cricothyroid = pitch increaser; LCA = adductors (slide 57)"},{"l":4,"t":"Intrinsic laryngeal muscles","q":"Which muscle narrows the laryngeal inlet and swings the epiglottis down to protect the airway during swallowing?","c":"Oblique arytenoid","w":["Posterior crico-arytenoid","Cricothyroid","Thyro-arytenoid","Lateral crico-arytenoid"],"e":"Besides adducting the folds, the arytenoid muscles (th
