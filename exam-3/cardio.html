ta and branches","q":"Select ALL correct pairs of abdominal aorta branch, approximate level and territory.","c":["Celiac trunk, ~T12: foregut (distal esophagus, stomach, proximal duodenum)","Superior mesenteric a., ~L1: midgut (distal duodenum to about two thirds of the transverse colon)","Inferior mesenteric a., ~L3: hindgut (last third of transverse colon to rectum)","Renal aa., ~L1: kidneys","Gonadal aa., ~L2: ovaries or testes"],"w":["Inferior mesenteric a., ~L1: midgut (distal duodenum to two thirds of the transverse colon)","Celiac trunk, ~L4: hindgut (last third of transverse colon to rectum)"],"e":"Anterior visceral branches (celiac, SMA, IMA) serve the gut. Lateral visceral branches (renal, gonadal) serve paired organs. Parietal branches (e.g. inferior phrenic, lumbar) serve the body wall. Bifurcation at L4.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","deep":true,"note":"Matching question: levels, where the branches go, and which artery or trunk. · Celiac ~T12 comes first; SMA and renals ~L1; gonadals ~L2, in between; IMA lowest (~L3)."},{"l":2,"t":"Aorta and branches","q":"Where does the thoracic aorta lie, and where does it pass through the diaphragm?","c":"Left posterior mediastinum; aortic hiatus at T12","w":["Middle mediastinum, behind the heart; aortic hiatus at T8","Superior mediastinum; esophageal hiatus at T10","Right posterior mediastinum; caval opening at T8"],"e":"The aortic hiatus is the lowest of the three diaphragm openings: caval T8, esophageal T10, aortic T12.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied.","note":"The aortic hiatus (T12) is the lowest of the caval, esophageal and aortic openings."},{"l":2,"t":"Aorta and branches","q":"Branches of the thoracic aorta to the intercostal spaces are called:","c":"Parietal branches","w":["Visceral branches","Anterior visceral branches","Mesenteric branches"],"e":"Parietal (paries = wall) branches serve the thoracic wall; visceral branches serve contents such as the bronchi, pericardium and esophagus.","lo":"Describe the aorta, including its parts, vertebral levels, major branches and areas supplied."},{"l":2,"t":"Common carotid artery","q":"Which areas external to the cranial cavity are served by the internal carotid arteries?","c":"Orbit and forehead","w":["Deep face","External cranium and scalp","Face"],"e":"The ophthalmic branch supplies the orbit and reaches the forehead. Deep face = maxillary a.; scalp = superficial temporal a.; face = facial a. (all external carotid).","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served.","said":"Dr. Fox's own check question at the end of Common Carotid Artery & Branches.","note":"Orbit and forehead = ophthalmic a., a branch of the ICA."},{"l":2,"t":"Common carotid artery","q":"Select ALL correct statements about the common carotid artery.","c":["The right one arises from the brachiocephalic trunk and the left from the arch of the aorta","It ascends in the carotid sheath with the internal jugular v. and the vagus n. (CN X)","Its terminal branches are the internal and external carotid arteries"],"w":["It passes through the carotid canal into the cranial cavity before it branches","The left one arises from the brachiocephalic trunk and the right from the arch of the aorta"],"e":"Terminal branches are the two vessels the common carotid ends by splitting into: the internal and external carotids. The ophthalmic a. does not come off the common carotid at all. It is a branch of the internal carotid, given off after the ICA passes through the carotid canal, so it sits one level further down the tree. The external carotid works the same way: it has its own terminal branches (maxillary, superficial temporal) plus other branches such as the facial. Only the internal carotid enters the carotid canal; the external carotid stays outside the skull.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true},{"l":2,"t":"Common carotid artery","q":"Following the common carotid a. up the neck in a dissection, where would you find the origin of the ophthalmic a.?","c":"On the internal carotid a., after the carotid canal","w":["On the common carotid a., just below its bifurcation","On the external carotid a., near the facial a.","On the maxillary a., in the infratemporal fossa"],"e":"The common carotid gives rise to the internal and external carotids. The ophthalmic a. is a branch of the internal carotid, after the ICA has passed through the carotid canal; it supplies the orbit and forehead. The facial and maxillary aa. are external carotid branches.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true,"note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common carotid artery","q":"Why does the ophthalmic a. not contradict the rule that the internal and external carotids are the terminal branches of the common carotid?","c":"It comes off the internal carotid, after the common carotid has ended","w":["It is a third terminal branch, too small to be named on most slides","It comes off the vertebral a., after it passes through foramen magnum","It branches off the common carotid, but only after entering the skull"],"e":"Terminal means the vessel ends by splitting into those branches. The common carotid ends by dividing into the internal and external carotids; the ophthalmic comes off the internal carotid, one level down. The vertebral aa. enter through foramen magnum and supply the posterior brain, not the orbit.","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a.","deep":true,"note":"You asked how the ICA and ECA can be terminal branches if the ophthalmic branch exists."},{"l":2,"t":"Common carotid artery","q":"Which structures share the carotid sheath with the common carotid artery?","c":"Internal jugular vein and vagus nerve","w":["External jugular vein and phrenic nerve","Vertebral artery and sympathetic trunk","Subclavian vein and hypoglossal nerve"],"e":"Carotid sheath: common carotid a., internal jugular v., vagus n. (CN X).","lo":"Describe the pathway of the common carotid a. and its two terminal branches: internal carotid a. and external carotid a."},{"l":2,"t":"Common carotid artery","q":"Match the external carotid branches to their territories. Which set is correct?","c":"Facial a.: superficial face; maxillary a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp","w":["Facial a.: deep face (infratemporal fossa, muscles of mastication); maxillary a.: external cranium and scalp; superficial temporal a.: superficial face","Facial a.: orbit and forehead; maxillary a.: superficial face (lips, nose, cheek); superficial temporal a.: the brain and meninges","Maxillary a.: superficial face; facial a.: deep face (infratemporal fossa, muscles of mastication); superficial temporal a.: external cranium and scalp"],"e":"The maxillary and superficial temporal arteries are the two terminal branches of the external carotid. The facial artery crosses the mandible to the muscles of facial expression.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served.","deep":true,"note":"Facial a. → muscles of facial expression. * = terminal branch (maxillary, superficial temporal)."},{"l":2,"t":"Common carotid artery","q":"The two terminal branches of the external carotid artery are the:","c":"Maxillary and superficial temporal arteries","w":["Facial and superficial temporal arteries","Superficial temporal and posterior auricular arteries","Maxillary and occipital arteries"],"e":"They're starred on the slide. The facial artery is a branch, but not terminal.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served."},{"l":2,"t":"Common carotid artery","q":"The internal carotid artery enters the cranium through the:","c":"Carotid canal","w":["Foramen magnum","Jugular foramen","Transverse foramina"],"e":"The vertebral arteries use the transverse foramina (C6 to C1) and foramen magnum.","lo":"Describe the pathways of the external carotid a. and internal carotid a., major branches and regions served."},{"l":2,"t":"Common carotid artery","q":"Which statement about the blood supply to the brain is correct?","c":"Internal carotids supply the anterior circulation and vertebrals the posterior; only about 1 in 5 people have a complete cerebral arterial circle","w":["Vertebral arteries supply the anterior circulation through the carotid canals; nearly everyone has a complete cerebral arterial circle","External carotids supply most of the cerebrum and internal carotids the face; about 1 in 5 people have a complete cerebral arterial circle","Internal carotids supply the posterior circulation and vertebrals the anterior; nearly everyone has a complete cerebral arterial circle"],"e":"Internal carotids enter through the carotid canals (anterior); vertebrals through foramen magnum (posterior). The anterior and posterior communicating arteries complete the circle and allow left-right and front-back collateral flow.","lo":"Diagram the major blood supply to the brain.","deep":true},{"l":2,"t":"Common carotid artery","q":"The vertebral arteries reach the brain by passing through:","c":"The transverse foramina of C6 to C1, then foramen magnum","w":["The carotid canals of the temporal bones","The jugular foramina, alongside the internal jugular veins","The intervertebral foramina of C7 to C1, then the foramen ovale"],"e":"They're branches of the first part of the subclavian a. and join each other inside the skull (forming the basilar a.).","lo":"Diagram the major blood supply to the brain."},{"l":2,"t":"Common carotid artery","q":"The completeness of the cerebral arterial circle (of Willis) depends on the:","c":"Communicating arteries","w":["External carotid arteries","Maxillary arteries","Subclavian arteries"],"e":"With the communicating arteries in place, blood can be shared left-right and anterior-posterior.","lo":"Diagram the major blood supply to the brain."},{"l":2,"t":"Common iliac artery","q":"Which landmark indicates the transition of the external iliac a. to the femoral a.?","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Pelvic brim","Popliteal fossa"],"e":"The adductor hiatus marks femoral → popliteal. The pelvic brim is where the common iliac splits into internal and external.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","said":"Dr. Fox's own check question at the end of Common Iliac Artery & Branches."},{"l":2,"t":"Common iliac artery","q":"Select ALL correct statements about the common iliac arteries.","c":["They arise when the abdominal aorta bifurcates at about L4","They bifurcate at the pelvic brim into internal and external iliac arteries","The ureters cross into the pelvis near that bifurcation"],"w":["They bifurcate at the inguinal ligament into internal and external iliac arteries","They arise when the aorta passes the aortic hiatus at about T12"],"e":"Internal iliac → pelvis, viscera and perineum. External iliac → lower limb. The ureter reliably crosses at the common iliac bifurcation.","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery.","deep":true},{"l":2,"t":"Common iliac artery","q":"Which statement about the divisions of the internal iliac artery is correct?","c":"Anterior division (most of the flow): pelvic viscera, perineum and gluteal region; posterior division: posterior pelvic wall and gluteal region","w":["Anterior division: lower limb and posterior pelvic wall; posterior division (most of the flow): perineum, pelvic viscera and gluteal region","Posterior division (most of the flow): pelvic viscera and perineum; anterior division: posterior pelvic wall only, never the gluteal region","Anterior division (most of the flow): pelvic viscera and perineum only; posterior division: lower limb and anterior abdominal wall"],"e":"Between them, everything in and making up the pelvis is served by the internal iliac artery. Both divisions send branches to the gluteal region.","lo":"Describe the divisions of the internal iliac artery and regions served.","deep":true},{"l":2,"t":"Common iliac artery","q":"The internal iliac artery serves the:","c":"Pelvis, pelvic viscera and perineum","w":["Lower limb, through the femoral artery","Kidneys and suprarenal glands","Anterior abdominal wall only"],"e":"The external iliac takes the lower limb.","lo":"Describe the divisions of the internal iliac artery and regions served."},{"l":2,"t":"Common iliac artery","q":"Trace blood from the external iliac a. to the plantar surface of the foot.","c":"External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot","w":["External iliac → (adductor hiatus) femoral → (inguinal ligament) popliteal → posterior tibial → branches to the plantar foot","External iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → anterior tibial → branches to the plantar foot","Internal iliac → (inguinal ligament) femoral → (adductor hiatus) popliteal → posterior tibial → branches to the plantar foot"],"e":"The popliteal artery sends a branch to the anterior leg and dorsal foot, and continues as the larger posterior tibial a. (posterior and lateral leg), whose branches serve the plantar surface.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","deep":true,"note":"Posterior tibial a. = plantar surface of the foot. The path to the sole never goes through the branch to the anterior leg and dorsal foot."},{"l":2,"t":"Common iliac artery","q":"The posterior thigh is served by:","c":"A branch of the femoral artery (the deep femoral)","w":["The posterior tibial artery, through its ascending branches","The anterior division of the internal iliac artery only","The popliteal artery"],"e":"The femoral a. serves the anterior thigh and gives a branch to the posterior thigh.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery."},{"l":2,"t":"Common iliac artery","q":"Which structures are found in the femoral triangle?","c":"Femoral vein, artery and nerve (plus lymphatics)","w":["Femoral artery and great saphenous nerve, with no veins","Popliteal artery and vein, with the tibial nerve","External iliac artery and vein, with the ureter"],"e":"The femoral triangle sits just below the inguinal ligament, bordered by sartorius and adductor longus.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery."},{"l":2,"t":"Common iliac artery","q":"The femoral artery becomes the popliteal artery at the:","c":"Adductor hiatus","w":["Inguinal ligament","Pelvic brim","Medial malleolus"],"e":"The adductor hiatus is the tunnel through the adductor muscles into the popliteal fossa behind the knee.","lo":"Describe the pathway, branches and regions of the lower limb served by the external iliac artery.","note":"Femoral → popliteal at the adductor hiatus."},{"l":2,"t":"Subclavian artery and upper limb","q":"If present, an anastomosis with which artery allows for safe cannulation of the radial artery?","c":"Ulnar a.","w":["Axillary a.","Brachial a.","Deep brachial a.","Subclavian a."],"e":"The radial (deep palmar arch) and ulnar (superficial palmar arch) arteries may anastomose. If they do, the hand still gets blood when the radial is cannulated. The Allen test checks this.","lo":"Explain the Allen test.","said":"Dr. Fox's own check question at the end of Subclavian Artery & Branches."},{"l":2,"t":"Subclavian artery and upper limb","q":"What is the order of arteries supplying the upper limb?","c":"Subclavian → axillary → brachial → radial and ulnar","w":["Axillary → subclavian → brachial → radial and ulnar","Subclavian → brachial → axillary → radial and ulnar","Brachiocephalic → axillary → radial → brachial"],"e":"Subclavian becomes axillary at the lateral margin of rib 1; axillary becomes brachial at teres major; brachial divides near the cubital fossa.","lo":"Describe the high-level pattern of blood supply to the upper limb."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the subclavian artery.","c":["The right one arises from the brachiocephalic trunk; the left from the arch of the aorta","Its three parts are defined by the anterior scalene muscle: medial, posterior and lateral to it","The first part gives off the vertebral a. (brain) and the internal thoracic a. (anterior thoracic and abdominal walls)","It becomes the axillary a. at the lateral margin of rib 1"],"w":["Its three parts are defined by pectoralis minor: medial, posterior and lateral to it","It becomes the axillary a. at the inferior border of teres major"],"e":"Pectoralis minor defines the axillary parts, and teres major marks axillary → brachial. The first part of the subclavian has the most significant branches.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve.","deep":true,"note":"1st part: medial to anterior scalene (vertebral a. → posterior brain supply). 2nd: posterior to it. 3rd: lateral to it, to the first rib."},{"l":2,"t":"Subclavian artery and upper limb","q":"The internal thoracic artery is a branch of the:","c":"First part of the subclavian artery","w":["Third part of the axillary artery","Thoracic aorta","Second part of the subclavian artery"],"e":"It's the major supply to the anterior thoracic wall and some abdominal wall muscles.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"Which muscle defines the second part of the subclavian artery?","c":"Anterior scalene","w":["Pectoralis minor","Teres major","Sternocleidomastoid"],"e":"First part: medial to anterior scalene. Second: posterior to it. Third: lateral, out to the lateral margin of rib 1.","lo":"Describe the subclavian a., its parts (and what defines them), and important branches of the first part and what they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"Which statement about the axillary artery is correct?","c":"It runs from the lateral margin of rib 1 to teres major, in three parts defined by pectoralis minor; its branches mainly serve the shoulder","w":["It runs from the anterior scalene to the cubital fossa, in three parts defined by teres major; its branches mainly serve the forearm","It runs from the lateral margin of rib 1 to teres major, in two parts defined by subclavius; its first part gives off the vertebral artery","It runs from teres major to the lateral margin of rib 1, where it becomes the subclavian artery; its branches serve the neck"],"e":"Part 1: rib 1 to the medial margin of pectoralis minor. Part 2: behind pectoralis minor. Part 3: lateral to it, down to teres major, where it becomes the brachial a.","lo":"Describe the axillary a. and its parts (and what defines them).","deep":true,"note":"1st part: lateral margin of rib 1 to the medial margin of pec minor. 2nd: posterior to pec minor. 3rd: lateral to pec minor, to teres major. Brachial = arm."},{"l":2,"t":"Subclavian artery and upper limb","q":"The axillary artery becomes the brachial artery at the:","c":"Inferior border of teres major","w":["Lateral margin of the first rib","Inferior border of pectoralis minor","Cubital fossa"],"e":"Brachial = arm.","lo":"Describe the axillary a. and its parts (and what defines them)."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the brachial, radial and ulnar arteries.","c":["The brachial a. supplies the arm and has a branch to the posterior arm","The brachial a. divides near the cubital fossa","The radial a. serves the lateral anterior forearm and hand, and feeds the deep palmar arch","The ulnar a. serves the medial and deep anterior forearm and some of the hand, and feeds the superficial palmar arch"],"w":["The radial a. serves the medial anterior forearm and hand, and feeds the superficial palmar arch","The brachial a. divides at the inferior border of teres major, high in the arm"],"e":"Radial = lateral (thumb side), deep arch. Ulnar = medial, superficial arch. The arches may anastomose.","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve.","deep":true},{"l":2,"t":"Subclavian artery and upper limb","q":"The radial artery primarily feeds the:","c":"Deep palmar arch","w":["Superficial palmar arch","Dorsal venous arch","Cubital fossa"],"e":"Ulnar → superficial palmar arch.","lo":"Describe the brachial a., ulnar a. and radial a., and the regions they serve."},{"l":2,"t":"Subclavian artery and upper limb","q":"During an Allen test, both radial and ulnar arteries are compressed and the hand is clenched. When pressure on the ulnar artery is released, the palm stays pale. What does this mean?","c":"The ulnar–radial anastomosis is inadequate, so cannulating the radial artery is not safe","w":["The test passed; collateral flow is adequate, so the radial artery is safe to cannulate","The radial artery is blocked, so it should be cannulated to restore flow to the palm","The brachial artery is occluded above the elbow, so neither forearm artery can be used"],"e":"The test occludes both arteries, then releases one at a time and watches the palm flush with color. If color doesn't return with only the ulnar side open, the ulnar can't supply the hand on its own, a failed Allen test.","lo":"Explain the Allen test.","deep":true},{"l":2,"t":"Superior vena cava","q":"The venous angle is the union of the subclavian v. with which other vein?","c":"Internal jugular v.","w":["External jugular v.","Inferior vena cava","Superior vena cava"],"e":"Internal jugular + subclavian = brachiocephalic v. The venous angle is where lymph (thoracic duct or right lymphatic duct) returns to venous blood.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","said":"Dr. Fox's own check question at the end of Superior Vena Cava & Tributaries."},{"l":2,"t":"Superior vena cava","q":"Select ALL correct statements about the superior vena cava and its tributaries.","c":["The SVC drains everything above the diaphragm into the right atrium","It is the union of the right and left brachiocephalic veins","The left brachiocephalic v. is longer and more oblique than the right","The internal jugular v. drains the head and neck; the subclavian v. drains the upper limb, neck and thorax"],"w":["The SVC is formed by the union of the two internal jugular veins behind the manubrium","The right brachiocephalic v. is longer and more oblique than the left"],"e":"Each brachiocephalic v. = internal jugular + subclavian, meeting at the venous angle. The SVC empties into the sinus venarum of the right atrium.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","deep":true,"note":"The left brachiocephalic vein is longer. · SVC = union of the right and left brachiocephalic veins."},{"l":2,"t":"Superior vena cava","q":"Which statement about the superficial veins of the upper limb is correct?","c":"Cephalic v.: lateral, into the axillary v. Basilic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","w":["Basilic v.: lateral, into the axillary v. Cephalic v.: medial, joins the brachial veins to form the axillary v. Median cubital v.: links them; used for venipuncture","Cephalic v.: lateral, joins the brachial veins to form the axillary v. Basilic v.: medial, into the cephalic v. Median cubital v.: a deep vena comitans","Cephalic v.: medial, into the subclavian v. Basilic v.: lateral, into the cephalic v. Median cubital v.: links them; avoided for venipuncture"],"e":"Basilic + brachial veins = axillary v.; the cephalic v. joins the axillary v. later. All deep veins of the limb are venae comitantes.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava.","deep":true},{"l":2,"t":"Superior vena cava","q":"Which vein is commonly used for venipuncture?","c":"Median cubital vein","w":["Cephalic vein at the deltopectoral groove","Brachial vein","Internal jugular vein"],"e":"It connects the cephalic and basilic veins across the cubital fossa.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava."},{"l":2,"t":"Superior vena cava","q":"The axillary vein is formed by:","c":"The basilic vein joining the brachial veins","w":["The cephalic and basilic veins joining at the elbow","The internal jugular and subclavian veins joining","The radial and ulnar veins joining in the cubital fossa"],"e":"The cephalic v. drains into the axillary v. as it crosses the axilla.","lo":"Identify and describe the tributaries and regions drained of the superior vena cava."},{"l":2,"t":"Inferior vena cava","q":"Which structures' venous pathway includes the left renal vein?","c":"Left gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland","w":["Left inferior surface of the diaphragm, left kidney, left suprarenal gland and liver","Spleen, and left inferior surface of the diaphragm, kidney and suprarenal gland","Right gonad, left inferior surface of the diaphragm, left kidney and left suprarenal gland"],"e":"The long left renal v. collects the left gonadal v. and a common trunk from the left hemidiaphragm and left suprarenal gland. The spleen drains to the hepatic portal system, and the liver through the hepatic veins.","lo":"Explain regions drained by IVC tributaries.","said":"Dr. Fox's own check question at the end of Inferior Vena Cava & Tributaries."},{"l":2,"t":"Inferior vena cava","q":"Select ALL correct statements about the inferior vena cava.","c":["It drains everything inferior to the diaphragm into the right atrium","It passes through the caval hiatus of the diaphragm at about T8","It lies to the right of the abdominal aorta","It begins as the union of the common iliac veins"],"w":["It receives the superior and inferior mesenteric veins directly","It passes through the aortic hiatus at T12"],"e":"Diaphragm hiatuses: caval T8, esophageal T10, aortic T12. Gut blood goes through the hepatic portal system and reaches the IVC only via the hepatic veins.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","deep":true,"note":"The IVC is the conduit of blood return below the diaphragm; it is formed by the union of the common iliac veins. · The gut territories of the celiac, SMA and IMA drain into the hepatic portal system, not straight into the IVC."},{"l":2,"t":"Inferior vena cava","q":"IVC tributaries roughly mirror the branches of the abdominal aorta. What is the major exception, and why?","c":"No veins match the celiac trunk, SMA or IMA, because gut blood goes to the liver through the hepatic portal system","w":["No veins match the renal arteries, because the kidneys drain into the hepatic portal system instead of the IVC","No veins match the gonadal arteries, because the gonads drain into the internal iliac veins instead of the IVC","No veins match the lumbar arteries, because the body wall drains only into the azygos system instead of the IVC"],"e":"Gut blood enters the hepatic portal v., passes through the liver sinusoids, and returns to the IVC via the three hepatic veins.","lo":"Describe the position and major tributaries of the inferior vena cava (IVC).","deep":true,"note":"No celiac or superior mesenteric veins: they are part of the hepatic portal system, the exception to arteries being mirrored."},{"l":2,"t":"Inferior vena cava","q":"Where does the right gonadal vein drain, compared with the left?","c":"Right: directly into the IVC; left: into the left renal vein","w":["Right: into the right renal vein; left: directly into the IVC","Both drain into the hepatic portal vein","Both drain directly into the IVC"],"e":"The asymmetry of the left veins is mostly about the long left renal vein, which crosses the aorta (under the SMA) to reach the IVC on the right.","lo":"Explain regions drained by IVC tributaries.","deep":true},{"l":2,"t":"Inferior vena cava","q":"The great saphenous vein drains into the:","c":"Femoral vein, in the femoral triangle","w":["Popliteal vein, in the popliteal fossa","External iliac vein, above the inguinal ligament","Small saphenous vein at the knee"],"e":"Great saphenous: medial foot (closely related to the medial malleolus), up the medial limb to the femoral v. Small saphenous: lateral foot, up the leg to the popliteal v.","lo":"Explain regions drained by IVC tributaries.","note":"Great saphenous: medial, passes the medial malleolus. · Small saphenous drains into the popliteal v.; great saphenous drains into the femoral v."},{"l":2,"t":"Inferior vena cava","q":"The boundary between the external iliac vein and the femoral vein is the:","c":"Inguinal ligament","w":["Adductor hiatus","Anterior superior iliac spine","Medial malleolus"],"e":"Same landmark as for the arteries.","lo":"Explain regions drained by IVC tributaries."},{"l":2,"t":"Inferior vena cava","q":"The small saphenous vein drains the:","c":"Lateral foot and leg, into the popliteal vein","w":["Medial foot and leg, into the femoral vein","Plantar foot, into the posterior tibial artery","Medial thigh, into the great saphenous vein"],"e":"Deep lower limb veins are venae comitantes (posterior tibial, popliteal, femoral).","lo":"Explain regions drained by IVC tributaries.","note":"Small saphenous: lateral, passes the lateral malleolus."},{"l":2,"t":"Hepatic portal system","q":"The hepatic portal system delivers material from which source tissues to the sinusoids of the liver?","c":"GI tract","w":["Esophagus, proximal","Kidneys","Lower limbs"],"e":"From the distal esophagus to the rectum. Kidneys and lower limbs drain to the caval system.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","said":"Dr. Fox's own check question at the end of Hepatic Portal System."},{"l":2,"t":"Hepatic portal system","q":"Trace absorbed nutrients from the small intestine back to the heart.","c":"GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → IVC → right atrium","w":["GI capillaries → superior mesenteric v. → hepatic veins → liver sinusoids → hepatic portal v. (SMV + splenic v.) → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + renal v.) → liver sinusoids → hepatic veins → IVC → right atrium","GI capillaries → superior mesenteric v. → hepatic portal v. (SMV + splenic v.) → liver sinusoids → hepatic veins → SVC → right atrium"],"e":"The hepatic portal v. is portal (connects GI capillaries to liver sinusoids). The three hepatic veins are caval. The inferior mesenteric v. usually drains into the splenic v.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","deep":true},{"l":2,"t":"Hepatic portal system","q":"The hepatic portal vein is formed by the union of the:","c":"Superior mesenteric vein and splenic vein","w":["Inferior mesenteric vein and splenic vein","Superior and inferior mesenteric veins","Hepatic veins and the IVC"],"e":"SMV + splenic v. = hepatic portal v. Everything else is a tributary of one of those two.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses."},{"l":2,"t":"Hepatic portal system","q":"Select ALL sites where portacaval anastomoses can form varices in portal hypertension.","c":["Distal esophagus (esophageal varices)","Periumbilical region (caput medusae)","Anorectal submucosa (superior with inferior rectal veins)"],"w":["The dorsal venous arch of the foot (saphenous varices)","The venous angle of the neck (jugular varices)"],"e":"Portal hypertension (e.g. cirrhosis, thrombosis) enlarges portal tributaries until they connect with nearby caval veins. Mnemonic: “butts, guts and caputs.” Esophageal varices are the most diagnostic.","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","deep":true,"note":"Varices = enlarged blood vessels from raised pressure."},{"l":2,"t":"Hepatic portal system","q":"Which pairing of portal and caval veins forms the esophageal portacaval anastomosis?","c":"Left gastric v. (portal) with esophageal veins (caval)","w":["Paraumbilical v. (portal) with epigastric veins (caval)","Superior rectal v. (portal) with inferior rectal v. (caval)","Splenic v. (portal) with left renal v. (caval)"],"e":"Periumbilical: paraumbilical with epigastric veins. Anorectal: superior rectal (portal) with inferior rectal (caval).","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses."},{"l":2,"t":"Hepatic portal system","q":"Are the hepatic veins part of the portal or the caval system?","c":"Caval: they drain the liver sinusoids into the IVC","w":["Portal: they carry absorbed GI blood into the liver sinusoids","Neither: they are lymphatic vessels of the liver","Portal: they connect two capillary beds in series"],"e":"Hepatic portal v. = portal (into the liver). Hepatic veins (3) = caval (out of the liver).","lo":"Diagram the hepatic portal system, differentiate between hepatic portal and hepatic vein (caval) systems, and identify examples of portacaval anastomoses.","note":"Hepatic portal vein: portal in nature. The 3 hepatic veins: caval in nature."},{"l":3,"t":"Introduction to blood","q":"A patient experiencing acidemia may compensate for that with which mechanism?","c":"An elevated rate of respiration","w":["A depressed rate of respiration","Increased retention of protons by the kidneys","Increased rate of excretion of bicarbonate by the kidneys"],"e":"Hyperventilating blows off more CO2, a volatile acid, which raises pH. In acidemia the kidneys should excrete protons and retain bicarbonate, the opposite of the other options.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","said":"Dr. Fox's own check question at the end of Intro to Blood."},{"l":3,"t":"Introduction to blood","q":"Select ALL correct statements about the components of whole blood.","c":["Plasma is about 55% of whole blood and formed elements about 45%","Plasma is about 92% water","Erythrocytes are the most abundant formed element (4.8 to 5.4 million/µL)","Leukocytes are the least abundant formed element (5,000 to 10,000/µL)"],"w":["Thrombocytes are the most abundant formed element","Formed elements make up about 55% of whole blood"],"e":"Thrombocytes (150,000 to 400,000/µL) sit between erythrocytes and leukocytes. Whole blood is about 8% of body weight.","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Introduction to blood","q":"Select ALL correct pairs of blood function category and example.","c":["Transportation: gases, nutrients, wastes, hormones and cytokines","Regulation: pH, temperature and water balance","Protection: immune responses and clotting"],"w":["Regulation: producing antibodies in the liver","Protection: maintaining oncotic pressure"],"e":"Transportation, regulation and protection are the three buckets. Blood is a part-time host to the immune system; the lymphatic system is the other host.","lo":"Describe the functions, components and relative abundances of components of blood.","deep":true},{"l":3,"t":"Introduction to blood","q":"Blood pH below 7.35 is called:","c":"Acidemia","w":["Alkalemia","Hypoxemia","Acidosis of the tissues only"],"e":"Normal range 7.35 to 7.45 (“physiologically neutral”, slightly alkaline chemically). Above 7.45 = alkalemia.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis."},{"l":3,"t":"Introduction to blood","q":"Why must blood pH stay between 7.35 and 7.45? Select ALL reasons given in lecture.","c":["Protein chemistry: proteins can stop working or denature","Neuron and muscle cell physiology depends on delicate ion balances","Oxygen delivery to tissues","Electrolyte balance"],"w":["It keeps erythrocytes from developing nuclei","It sets the ABO blood type"],"e":"Outside the range, cardiac, skeletal and smooth muscle and the nervous system stop working optimally.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true,"note":"7.35 to 7.45 is physiologically neutral."},{"l":3,"t":"Introduction to blood","q":"Which statement about compensation for a pH disturbance is correct?","c":"Lungs adjust pH quickly through ventilation (CO2 loss); kidneys adjust slowly by excreting or retaining H+ and HCO3−","w":["Kidneys adjust pH quickly by excreting or retaining H+ and HCO3−; lungs adjust slowly over days by changing ventilation","In alkalemia the lungs hyperventilate to retain CO2, and the kidneys retain extra bicarbonate to help","In acidemia the kidneys excrete bicarbonate and retain protons, and the lungs slow ventilation to match"],"e":"Acidemia: hyperventilate, kidneys excrete H+ and retain HCO3−. Alkalemia: hypoventilate (retain CO2), kidneys excrete HCO3− and retain H+.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true,"note":"Hyperventilation moves more gas through the lungs; hypoventilation decreases gas exchange. The kidneys are slow."},{"l":3,"t":"Introduction to blood","q":"By Le Châtelier's principle, what happens to the carbonic acid–bicarbonate system when protons build up in the blood?","c":"It shifts toward carbonic acid, then CO2 and water, and the CO2 can be breathed out","w":["It shifts toward more bicarbonate and protons, which the kidneys then excrete in urine","It stops working, because the buffer system operates only during alkalemia","Hemoglobin releases more oxygen so that the extra protons are absorbed"],"e":"An equilibrium shifts to counteract a disturbance. CO2 is volatile, so the lungs can remove it. Carbonic acid and bicarbonate are also how most CO2 is transported.","lo":"Explain the importance of blood pH homeostasis, the role and functions of the carbonic acid–bicarbonate buffer system, and how the respiratory and urinary systems can help compensate to maintain blood pH homeostasis.","deep":true},{"l":3,"t":"Introduction to blood","q":"The three major formed elements and their main jobs are:","c":"Erythrocytes: gas transport; thrombocytes: clotting; leukocytes: immune responses","w":["Erythrocytes: clotting; thrombocytes: gas transport; leukocytes: immune responses","Erythrocytes: immune responses; thrombocytes: oncotic pressure; leukocytes: gas transport","Albumins: clotting; globulins: gas transport; fibrinogens: immunity"],"e":"Formed elements are the cells and cell fragments; albumins, globulins and fibrinogens are plasma proteins.","lo":"Describe the basics of the formed elements."},{"l":3,"t":"Blood plasma","q":"Most blood proteins are produced by which organ(s)?","c":"Liver","w":["Endocrine glands","Kidneys","Spleen","Stomach"],"e":"The liver makes the lion's share. Kidneys, hematopoietic tissue and some endocrine glands make a minor portion; the stomach makes none.","lo":"Describe blood plasma, its components and their functions.","said":"Dr. Fox's own check question at the end of Blood Plasma.","note":"The liver is the primary organ."},{"l":3,"t":"Blood plasma","q":"Select ALL correct pairs of plasma protein and function.","c":["Albumins: oncotic pressure","Alpha and beta globulins: transport and modulating immune responses","Gamma globulins (immunoglobulins): antibodies such as IgG, IgA and IgM","Fibrinogens: clotting"],"w":["Albumins: antibodies such as IgG, IgA and IgM","Fibrinogens: oncotic pressure and transport of lipids"],"e":"Oncotic pressure holds water in the vessels and balances blood hydrostatic pressure, which pushes water out.","lo":"Describe blood plasma, its components and their functions.","deep":true},{"l":3,"t":"Blood plasma","q":"A patient's albumin is very low. What would you expect?","c":"Lower oncotic pressure, so fluid leaks out of the vessels into the tissues","w":["Poor clotting, because albumin normally forms the fibrin mesh at wounds","Fewer circulating antibodies, because albumins are the main immunoglobulins","Higher oncotic pressure, so more fluid is drawn into the vessels from the tissues"],"e":"Albumin favors water staying in the vasculature. With less of it, blood hydrostatic pressure wins and fluid moves out.","lo":"Describe blood plasma, its components and their functions.","deep":true,"note":"Albumin is an important part of the movement of water."},{"l":3,"t":"Blood plasma","q":"Which is the correct breakdown of plasma?","c":"About 92% water, 7% proteins and 1 to 1.5% other solutes","w":["About 55% water, 45% proteins and under 1% other solutes","About 92% proteins, 7% water and 1 to 1.5% other solutes","About 70% water, 29% electrolytes and 1% dissolved proteins"],"e":"Other solutes: electrolytes, nutrients, wastes, hormones and signaling molecules.","lo":"Describe blood plasma, its components and their functions."},{"l":3,"t":"Formed elements","q":"Leukocytes are the product of which stem cells?","c":"Myeloid and lymphoid stem cells","w":["Erythroid and megakaryocyte progenitors","Lymphoid stem cells only","Myeloid stem cells only"],"e":"Myeloid stem cells give the granular leukocytes and monocytes; lymphoid stem cells give the lymphocytes (T, B and NK cells). So both.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","said":"Dr. Fox's own check question at the end of Formed Elements."},{"l":3,"t":"Formed elements","q":"Order the leukocytes from most to least abundant.","c":"Neutrophils → lymphocytes → monocytes → eosinophils → basophils","w":["Lymphocytes → neutrophils → monocytes → basophils → eosinophils","Neutrophils → monocytes → lymphocytes → eosinophils → basophils","Basophils → eosinophils → monocytes → lymphocytes → neutrophils"],"e":"Mnemonic: Never Let Monkeys Eat Bananas.","lo":"Describe the basics of the formed elements.","note":"Most to least abundant: Never Let Monkeys Eat Bananas."},{"l":3,"t":"Formed elements","q":"Select ALL current uses of a blood smear.","c":["A follow-up to a complete blood count (CBC)","Estimating the relative abundances of formed elements","Checking cell size and shape (microcytic, normocytic, macrocytic)","Looking for blood parasites"],"w":["Measuring blood pH and bicarbonate levels","Determining ABO blood type and Rh status before a transfusion"],"e":"The smear was the original CBC. Abnormally small (microcytic) or large (macrocytic) cells can point to various pathologies.","lo":"Describe the uses of a blood smear.","deep":true},{"l":3,"t":"Formed elements","q":"On a blood smear, erythrocytes that are abnormally large are described as:","c":"Macrocytic","w":["Microcytic","Normocytic","Polycythemic"],"e":"Micro = abnormally small; normo = typical; macro = abnormally large.","lo":"Describe the uses of a blood smear."},{"l":3,"t":"Formed elements","q":"Select ALL formed elements that come from myeloid stem cells.","c":["Erythrocytes","Thrombocytes","Neutrophils, eosinophils and basophils","Monocytes","Mast cells"],"w":["T cells (helper and cytotoxic)","B cells","Natural killer cells"],"e":"Myeloid stem cells give nearly everything except most agranular leukocytes. Lymphoid stem cells give the lymphocytes: T cells, B cells (→ plasma cells) and NK cells.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"How does the main site of hematopoiesis change over a lifetime?","c":"Yolk sac (first trimester) → liver and spleen (second trimester) → red bone marrow, which dominates after birth","w":["Red bone marrow (first trimester) → liver and spleen (second trimester) → yolk sac, which dominates after birth","Spleen (first trimester) → yolk sac (second trimester) → liver, which dominates after birth","Lymph nodes (first trimester) → yolk sac (second trimester) → red bone marrow, which dominates after birth"],"e":"After birth, red bone marrow (hematopoietic connective tissue) of the vertebrae, pelvis, sternum and ribs is the main source; the long bones decline with age.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"Which growth factor stimulates production of thrombocytes?","c":"Thrombopoietin (TPO)","w":["Erythropoietin (EPO)","Interleukins","Hypoxia-inducible factors"],"e":"EPO → erythrocytes. TPO → thrombocytes. Interleukins → mitosis and development of hemopoietic cells (notably leukocytes).","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements."},{"l":3,"t":"Formed elements","q":"Hemopoiesis mainly begins in which tissue after birth?","c":"Red bone marrow","w":["Yolk sac","Liver","Yellow bone marrow"],"e":"Red bone marrow, also called hematopoietic connective tissue, in the epiphyses and metaphyses of long bones and in flat bones.","lo":"Describe hematopoiesis, detailing the types of stem cells and tissues involved, and the major developmental pathways of formed elements.","note":"Hematopoiesis = formation of blood cells."},{"l":3,"t":"Erythrocytes","q":"Low levels of what substance will immediately increase the production of erythropoietin?","c":"Oxygen","w":["Carbon dioxide","Iron","Magnesium","Phosphate"],"e":"Hypoxia drives EPO release from the peritubular interstitial cells (fibroblasts) of the kidneys, with hypoxia-inducible factors (HIF).","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","said":"Dr. Fox's own check question at the end of Erythrocytes.","note":"Hypoxia → EPO: low oxygen is the trigger."},{"l":3,"t":"Erythrocytes","q":"Select ALL correct statements about erythrocyte structure.","c":["They are biconcave discs, which minimizes the diffusion distance for oxygen","They are 7 to 8 µm across, just fitting through 5 to 10 µm capillaries","They are anucleate and lack mitochondria","They are essentially bags of hemoglobin"],"w":["They have many mitochondria to power oxygen transport","They live about 7 to 10 days before the spleen removes them"],"e":"They live about 120 days on average and are made at about 2 million per second.","lo":"Describe the structure, composition, development and function of erythrocytes.","deep":true},{"l":3,"t":"Erythrocytes","q":"The average lifespan of an erythrocyte is about:","c":"120 days","w":["7 to 10 days","Less than a week","1 to 2 years"],"e":"7 to 10 days is thrombocytes; under a week is neutrophils; 1 to 2 years is basophils.","lo":"Describe the structure, composition, development and function of erythrocytes."},{"l":3,"t":"Erythrocytes","q":"In an adult, erythropoietin is secreted mainly by:","c":"Peritubular interstitial cells (fibroblasts) of the kidneys","w":["Hepatocytes of the liver, around the central veins","Megakaryocytes in the red bone marrow","Juxtaglomerular (granular) cells of the kidney's afferent arteriole"],"e":"In the fetus, perisinusoidal cells of the liver secrete it. EPO can rise from about 10 to 10,000 mU/mL in hypoxia.","lo":"Describe the structure, composition, development and function of erythrocytes.","note":"EPO = production of red blood cells: it stimulates the bone marrow to make RBCs."},{"l":3,"t":"Erythrocytes","q":"Normal hematocrit is about 38 to 54%. Select ALL correct statements.","c":["Below the range is anemia; above it is polycythemia","Hematocrit can change through RBC numbers or plasma volume (e.g. hemorrhage, dehydration)","Below about 15% risks cardiac failure; above about 60% risks spontaneous clotting","After a hemorrhage, plasma recovers quickly but RBCs take about 10 days"],"w":["Dehydration lowers hematocrit by removing red blood cells from the circulation","Hematocrit is the percentage of blood volume made up of leukocytes"],"e":"Hematocrit = percentage of RBCs of total blood volume. Dehydration loses plasma, which raises the percentage. Erythropoiesis takes about 10 days.","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","deep":true,"note":"Hematocrit = the amount of RBCs in the blood."},{"l":3,"t":"Erythrocytes","q":"Right after a large hemorrhage, blood volume returns within a day or so but the patient stays anemic for over a week. Why?","c":"Plasma returns quickly, but erythropoiesis takes about 10 days to replace red cells","w":["The spleen destroys the newly made red blood cells for about a week after bleeding","EPO is released only once hematocrit drops below 15%, about a week later","Red blood cells are replaced first, within a day, and plasma lags behind for a week"],"e":"Replacing plasma before red cells dilutes the remaining RBCs, so hematocrit stays low until erythropoiesis catches up.","lo":"Discuss hematocrit, anemia, polycythemia and erythropoiesis.","deep":true,"note":"Formed elements take time to recover."},{"l":3,"t":"Hemoglobin","q":"Which hemoglobin type is dominant in a fetus during the third trimester?","c":"2α2γ","w":["2α2β","2α2δ","2α2ε"],"e":"2α2γ = fetal hemoglobin (HbF). 2α2β = adult HbA (97 to 98% of adult Hb). 2α2δ = HbA2. Beta overtakes gamma about four weeks after birth.","lo":"Describe the structure, function and ontogeny of hemoglobin.","said":"Dr. Fox's own check question at the end of Hemoglobin."},{"l":3,"t":"Hemoglobin","q":"Which statement correctly distinguishes hypoxemia from hypoxia?","c":"Hypoxemia is low oxygen in the blood; hypoxia is low oxygen in the tissues, from anemia, ischemia, poisoning or low output","w":["Hypoxemia is low oxygen in the tissues; hypoxia is low oxygen in the blood, from anemia, ischemia, poisoning or low output","They are synonyms for low oxygen anywhere in the body, whether in the blood or in the tissues","Hypoxemia is low oxygen in the blood; hypoxia is low CO2 in the tissues, caused mainly by hyperventilation"],"e":"An anemic patient's fewer RBCs may be fully loaded with oxygen (normal blood oxygen per cell) yet still deliver too little to tissues, which is hypoxia.","lo":"Discuss the importance of oxygen to humans.","deep":true},{"l":3,"t":"Hemoglobin","q":"Why do humans need oxygen?","c":"It is the terminal proton acceptor in chemiosmosis, so mitochondria can make much ATP","w":["It is needed to build the heme group of hemoglobin inside developing red blood cells","It buffers blood pH by combining with excess protons in the plasma to form water","It drives the kidneys to produce erythropoietin whenever blood levels rise"],"e":"Without oxygen, metabolically active tissues don't have enough energy.","lo":"Discuss the importance of oxygen to humans."},{"l":3,"t":"Hemoglobin","q":"Select ALL correct statements about hemoglobin's structure and genetics.","c":["It is a heterotetramer of four polypeptides, each with an iron-containing heme","Every type has two alpha chains plus two of another chain (beta, delta or gamma)","Alpha globin is coded on chromosome 16; beta and beta-like globins on chromosome 11","It is about a third of an erythrocyte's weight and nearly all of its dry weight"],"w":["Adult hemoglobin A is 2α2γ, with the gamma chains coded on chromosome 16","All four globin chains are coded on chromosome 11, with no chains from chromosome 16"],"e":"About 280 million Hb molecules per RBC; about 33% of the cell's weight vs. 96% dehydrated.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true,"note":"Dehydrated weight = weight without water."},{"l":3,"t":"Hemoglobin","q":"Select ALL correct pairs of binding type and molecule.","c":["Cooperative: O2 (each bound O2 raises affinity for more)","Competitive: CO (binds the heme site in place of O2)","Allosteric: CO2 and H+ (and nitric oxide), at other sites that change O2 binding"],"w":["Competitive: CO2 (binds the heme site in place of O2)","Cooperative: CO (each bound CO raises affinity for O2)"],"e":"Most CO2 travels as bicarbonate; about 10 to 20% is carried by hemoglobin. Binding H+ lets hemoglobin act a little as a pH buffer.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true,"note":"Cooperative: each O2 that binds helps more O2 bind. Allosteric: binding at a different part of the molecule."},{"l":3,"t":"Hemoglobin","q":"Near metabolically active tissues (higher temperature, higher CO2, lower pH), what happens to hemoglobin's affinity for oxygen?","c":"It decreases (a right shift), so hemoglobin unloads oxygen to the tissues","w":["It increases (a left shift), so hemoglobin holds on to oxygen more tightly there","It stays the same; only carbon monoxide can change hemoglobin's affinity","It increases (a right shift), which is why active tissues receive more oxygen"],"e":"Lung conditions (cooler, lower CO2, higher pH) shift the curve left for loading. Tissue conditions shift it right for unloading.","lo":"Describe the structure, function and ontogeny of hemoglobin.","deep":true},{"l":3,"t":"Hemoglobin","q":"Why is carbon monoxide so dangerous?","c":"Hemoglobin binds CO about 240 times more strongly than O2, so CO fills heme sites and O2 delivery falls","w":["CO destroys erythrocytes directly by hemolysis, so hemoglobin spills into the plasma and is filtered out","CO binds the globin chains, not heme, and blocks the CO2 that hemoglobin carries back to the lungs","CO lowers blood pH below 7.35 by forming carbonic acid, so hemoglobin's heme groups denature"],"e":"CO is colorless, odorless and tasteless, made by incomplete combustion (furnaces, heaters, generators, grills). CO detectors save lives.","lo":"Discuss the ramifications of carbon monoxide poisoning.","deep":true},{"l":3,"t":"Hemoglobin","q":"Which set lists symptoms of carbon monoxide poisoning?","c":"Headache, dizziness, nausea, confusion, chest pain, dyspnea, ataxia, seizures, coma","w":["Fever, rash, joint pain, swollen lymph nodes, sore throat, muscle aches, night sweats","Jaundice, itching, dark urine, pale stools, abdominal pain, fatigue and weight loss","Bleeding gums, easy bruising, nosebleeds, petechiae, heavy periods and blood in the urine"],"e":"Because CO is undetectable by the senses, symptoms are often the first sign.","lo":"Discuss the ramifications of carbon monoxide poisoning."},{"l":3,"t":"Hemoglobin","q":"About what percentage of adult hemoglobin is HbA (2α2β)?","c":"97 to 98%","w":["About 50%","About 75%","About 33%"],"e":"HbA2 (2α2δ) and a little HbF (2α2γ) make up the rest.","lo":"Describe the structure, function and ontogeny of hemoglobin."},{"l":3,"t":"Blood type","q":"For which blood type would it be easiest to find a transfusion donor?","c":"Type AB","w":["Type A","Type B","Type O negative"],"e":"AB has no anti-A or anti-B antibodies, so it can receive A, B, AB or O: the universal recipient. Type O can receive only O.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","said":"Dr. Fox's own check question at the end of Blood Type."},{"l":3,"t":"Blood type","q":"Which statement about how blood groups are determined is correct?","c":"They are based on RBC surface antigens (agglutinogens); an antibody meeting its antigen causes agglutination","w":["They are based on antibodies on the surface of leukocytes; an antigen meeting its antibody causes hemolysis","There are only two systems, ABO and Rh, both based on plasma proteins that make blood clot when mismatched","They are based on the hemoglobin type inside the RBC; a mismatch makes donor hemoglobin hold oxygen too tightly"],"e":"Over 100 genetically identified blood types and about 35 recognized systems. ABO and Rh are the two most important for crossmatching.","lo":"Describe the nature of blood groups and how they are determined.","deep":true},{"l":3,"t":"Blood type","q":"Select ALL correct pairs of ABO type and plasma antibodies.","c":["Type A: anti-B","Type B: anti-A","Type AB: neither anti-A nor anti-B","Type O: both anti-A and anti-B"],"w":["Type O: neither","Type AB: both anti-A and anti-B"],"e":"People typically carry IgM against the A/B antigen they don't have. ABO antigens are glycosphingolipids.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","deep":true},{"l":3,"t":"Blood type","q":"A type B patient is given whole blood from a type A donor. What happens?","c":"The patient's anti-A antibodies agglutinate the donor's red cells, a potentially lethal reaction","w":["Nothing happens, because types A and B share the same agglutinogens on their red cells","The donor's anti-B antibodies destroy only the patient's leukocytes, a mild reaction","The patient's anti-B antibodies agglutinate the donor's red cells, a potentially lethal reaction"],"e":"Always ask: does the recipient's plasma have antibodies against the donor's RBC antigens? A crossmatch (donor RBCs + recipient plasma) tests this directly.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","deep":true},{"l":3,"t":"Blood type","q":"Type O is called the universal donor because:","c":"Its red cells carry neither A nor B antigen","w":["Its plasma has no anti-A or anti-B antibodies","Its red cells carry both A and B antigens","It is Rh negative by definition, so it lacks the D antigen"],"e":"Type O plasma has both anti-A and anti-B, which is why O can receive only O.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions."},{"l":3,"t":"Blood type","q":"A crossmatch test mixes:","c":"Donor red cells with recipient plasma","w":["Donor plasma with recipient red cells","Donor and recipient leukocytes","Recipient red cells with anti-Rh serum"],"e":"No agglutination = safe to transfuse. Most transfusions today are packed RBCs or fresh frozen plasma; whole blood is rare.","lo":"Discuss the ABO blood group, its blood types, and the ramifications of various donor blood types with recipients' blood types in transfusions.","note":"No agglutination → safe to transfuse."},{"l":3,"t":"Blood type","q":"Why can an Rh− mother's antibodies harm an Rh+ fetus when ABO antibodies usually don't?","c":"Anti-Rh antibodies include IgG, small enough to cross the placenta; ABO antibodies are IgM, too large to cross","w":["Rh antigens are small glycosphingolipids that cross the placenta; ABO antigens are too large to cross","The fetus makes anti-Rh antibodies against the mother, which then cross back to attack its own red cells","Anti-Rh antibodies are IgM, small enough to cross the placenta; ABO antibodies are IgG, too large to cross"],"e":"Hemolytic disease of the newborn: after fetal blood reaches the mother, she makes anti-Rh antibodies; the IgG crosses the placenta and causes hemolysis and agglutination. Most common in later pregnancies; prevented by RhoGAM.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn.","deep":true,"note":"IgG is small (crosses the placenta); IgM is large."},{"l":3,"t":"Blood type","q":"Hemolytic disease of the newborn is a risk in which pregnancy?","c":"An Rh− mother with an Rh+ fetus","w":["An Rh+ mother with an Rh− fetus","A type O mother with a type O fetus","An Rh+ mother with an Rh+ fetus"],"e":"RhoGAM given to Rh− mothers prevents the immune response.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn."},{"l":3,"t":"Blood type","q":"Rh antigens are:","c":"Integral membrane proteins","w":["Glycosphingolipids","IgM antibodies","Plasma proteins made by the liver"],"e":"ABO antigens are glycosphingolipids; Rh antigens are proteins in the RBC membrane.","lo":"Discuss the Rh blood group, especially in the context of hemolytic disease of the newborn.","note":"Rh+ = has the Rh antigen; Rh− = doesn't."},{"l":3,"t":"Leukocytes","q":"Which leukocyte would you presume to be the most abundant in the blood smear?","c":"Neutrophils","w":["Basophils","Eosinophils","Lymphocytes","Monocytes"],"e":"Neutrophils ~60%, lymphocytes ~25%, monocytes ~10%, eosinophils ~3%, basophils <1%.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","said":"Dr. Fox's own check question at the end of Leukocytes."},{"l":3,"t":"Leukocytes","q":"Select ALL correct pairs of leukocyte and feature.","c":["Neutrophil: multilobed nucleus, phagocytic, first on the scene, dead ones make pus","Eosinophil: major basic protein kills endoparasites such as schistosomes","Basophil: releases histamine and heparin; lives 1 to 2 years","Monocyte: becomes a macrophage or dendritic cell in tissues","Lymphocyte: never phagocytic; basis of acquired immunity"],"w":["Basophil: the most abundant leukocyte, living only a few hours","Lymphocyte: the main phagocyte of bacteria, whose dead cells make pus"],"e":"Neutrophils <1 week; eosinophils <2 weeks; monocytes <3 days in blood but months as macrophages; basophils 1 to 2 years.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true,"note":"Neutrophils are first on the scene; pus is a sign of active infection. Basophils release substances that encourage vasodilation."},{"l":3,"t":"Leukocytes","q":"Eosinophils release both leukotrienes and histaminidase. What is the effect on allergies?","c":"Leukotrienes exacerbate allergic responses while histaminidase breaks down histamine and slows them","w":["Both slow allergic responses: leukotrienes and histaminidase each break down histamine","Both exacerbate allergic responses: leukotrienes and histaminidase each release histamine","Histaminidase exacerbates allergic responses while leukotrienes break down histamine and slow them"],"e":"Eosinophils are found in blood and especially mucosae, with limited phagocytosis. Major basic protein is their anti-parasite weapon.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"How do basophils contribute to anaphylaxis?","c":"Once activated, they stimulate IgE that binds mast cells, which then release histamine","w":["They phagocytose allergens and present them to helper T cells, which then release histamine","They release major basic protein, which dilates blood vessels and drops blood pressure suddenly","They become plasma cells that secrete IgG, which attaches to mast cells and releases histamine"],"e":"Basophils amplify allergies (e.g. food allergies) and help fight ectoparasites such as fleas and ticks. They are mostly in the blood and rare in tissues.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"Movement of a leukocyte toward a chemical signal is called:","c":"Chemotaxis","w":["Emigration (diapedesis)","Phagocytosis","Degranulation"],"e":"Chemotaxis draws the cell to the site; emigration is leaving the vessel into tissue; phagocytosis is “cell eating”.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Phagocytosis = cell eating. Chemotaxis = drawn toward a chemical signal. Emigration = the leukocyte leaves the vessel."},{"l":3,"t":"Leukocytes","q":"Which cells become antigen-presenting cells (APCs) that link innate and adaptive immunity?","c":"Dendritic cells derived from monocytes","w":["Neutrophils derived from myeloid stem cells","Basophils","Natural killer cells"],"e":"Monocytes mature in tissues into macrophages (fixed or wandering) or dendritic cells, which present pieces of pathogens to lymphocytes.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes."},{"l":3,"t":"Leukocytes","q":"Select ALL correct statements about lymphocytes.","c":["T cells include helper, cytotoxic and suppressor (regulatory) types","B cells become plasma cells that secrete antibodies","Natural killer cells act in innate immunity without prior exposure","About 90% in blood are small; large ones are activated"],"w":["Lymphocytes come from myeloid stem cells, like neutrophils","Lymphocytes are the most phagocytic leukocyte in the blood"],"e":"Lymphocytes come from lymphoid stem cells, are found in blood, lymph and tissues, and are about 25% of WBCs.","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","deep":true},{"l":3,"t":"Leukocytes","q":"A WBC count above about 11,000/µL is called:","c":"Leukocytosis","w":["Leukopenia","Thrombocytosis","Polycythemia"],"e":"Leukopenia is below about 4,000/µL. The same pattern applies to each type (neutropenia, monocytosis, etc.).","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes."},{"l":3,"t":"Leukocytes","q":"Which leukocytes are granular?","c":"Neutrophils, eosinophils and basophils","w":["Monocytes, lymphocytes and basophils","Neutrophils, eosinophils and lymphocytes","Monocytes, eosinophils and basophils"],"e":"Granular: neutrophils, eosinophils, basophils (all myeloid). Agranular: monocytes (myeloid) and lymphocytes (lymphoid).","lo":"Discuss the types, development, functions, locations and relative abundances of the leukocytes.","note":"Granular: neutrophils, eosinophils, basophils. Agranular: monocytes, lymphocytes."},{"l":3,"t":"Thrombocytes","q":"With which blood protein must thrombocytes interact to form a clot?","c":"Fibrin","w":["Albumin","IgG","IgM"],"e":"Fibrin forms the mesh that traps and anchors thrombocytes. Albumin is for oncotic pressure; IgG and IgM are antibodies.","lo":"Describe the role of thrombocytes in the clotting process.","said":"Dr. Fox's own check question at the end of Thrombocytes.","note":"Fibrin makes the mesh that catches thrombocytes."},{"l":3,"t":"Thrombocytes","q":"Select ALL correct statements about thrombocytes.","c":["They are anucleate fragments of cytoplasm from megakaryocytes","They work in hemostasis by degranulating clot-promoting substances","They live about 7 to 10 days","The spleen stores them and removes old ones"],"w":["They are the least abundant formed element in blood","They are made from lymphoid stem cells in the thymus"],"e":"Thrombocytes (150,000 to 400,000/µL) are less abundant than RBCs but more abundant than WBCs, and come from the myeloid line.","lo":"Describe the structure and function of thrombocytes.","deep":true},{"l":3,"t":"Thrombocytes","q":"Trace thrombocyte development.","c":"Pluripotent stem cell → myeloid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","w":["Pluripotent stem cell → lymphoid stem cell → megakaryoblast → megakaryocyte → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → megakaryocyte → megakaryoblast → proplatelets shed into marrow sinusoids → platelets","Pluripotent stem cell → myeloid stem cell → monoblast → monocyte → proplatelets shed into lymph node sinuses → platelets"],"e":"Thrombopoietin (TPO) increases megakaryocyte formation and activates them. Splenic macrophages phagocytize old thrombocytes.","lo":"Describe the development and factors affecting development of thrombocytes.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombopoietin (TPO):","c":"Increases megakaryocyte formation and activates megakaryocytes","w":["Stimulates erythrocyte production by acting on the kidneys","Converts fibrinogen to fibrin at the site of a vascular injury","Breaks down old platelets in the spleen and recycles their iron"],"e":"EPO is for RBCs; thrombin converts fibrinogen; splenic macrophages remove old platelets.","lo":"Describe the development and factors affecting development of thrombocytes."},{"l":3,"t":"Thrombocytes","q":"Put the clotting steps in order.","c":"Injury → platelets bind exposed collagen via vWF → platelets form pseudopodia and degranulate → thrombin converts fibrinogen to fibrin → fibrin mesh traps more platelets","w":["Injury → platelets bind exposed collagen via vWF → thrombin converts fibrin to fibrinogen → platelets form pseudopodia and degranulate → fibrinogen mesh traps more platelets","Injury → platelets bind exposed albumin via vWF → platelets form pseudopodia and degranulate → albumin converts fibrinogen to fibrin → albumin mesh traps more platelets","Injury → fibrin binds exposed collagen directly → vWF converts fibrinogen to fibrin → platelets form pseudopodia and degranulate → the mesh traps more platelets"],"e":"Fibrinogen is soluble; fibrin is insoluble and forms the mesh. Von Willebrand factor is the intermediate between collagen and platelets.","lo":"Describe the role of thrombocytes in the clotting process.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombin converts:","c":"Soluble fibrinogen into insoluble fibrin","w":["Insoluble fibrin into soluble fibrinogen","Albumin into fibrin","Prothrombin into von Willebrand factor"],"e":"The insoluble fibrin mesh is the basis of the clot.","lo":"Describe the role of thrombocytes in the clotting process.","note":"Fibrin forms the mesh network in which thrombocytes are captured."},{"l":3,"t":"Thrombocytes","q":"A patient has 600,000 platelets/µL and is bleeding from a small wound that won't clot. How can too many platelets cause bleeding?","c":"Paradoxical bleeding: excess platelets overwhelm von Willebrand factor, so it can't bridge collagen and platelets","w":["The extra platelets use up all the plasma albumin, so oncotic pressure falls and the small wound keeps oozing","Too many platelets block the capillaries around the wound, so fibrinogen can't reach the injured site","The spleen destroys fibrinogen when platelet counts are high, so no fibrin mesh can form at the wound"],"e":"Thrombocytosis (>400,000/µL) risks spontaneous clotting (e.g. DVT → PE) or, paradoxically, dysfunctional clotting and bleeding.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","deep":true},{"l":3,"t":"Thrombocytes","q":"Thrombocytopenia (<150,000/µL) mainly increases the risk of:","c":"Bleeding or hemorrhage","w":["Spontaneous clotting in the veins","Deep vein thrombosis","Polycythemia"],"e":"-penia = shortage. Spontaneous clotting is a risk of thrombocytosis.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytopenia = thin blood."},{"l":3,"t":"Thrombocytes","q":"Which is a spontaneous-clotting risk of thrombocytosis?","c":"Deep vein thrombosis that can embolize to the lungs","w":["Hemolytic disease of the newborn in later pregnancies","Carbon monoxide poisoning","Leukopenia from crowding out of the marrow"],"e":"A DVT of the lower limb can travel through the heart into the pulmonary arteries, a life-threatening pulmonary embolism.","lo":"Describe the conditions and risks of thrombocytopenia and thrombocytosis.","note":"Thrombocytosis = thick blood."},{"l":1,"t":"Pericardium","q":"Select ALL correct statements about the location and gross structure of the pericardium.","c":["It is a sac surrounding the heart within the middle mediastinum","Inferiorly it is associated with and fused to the diaphragm","It has a tough outer fibrous layer and an inner serous layer"],"w":["It lies in the anterior mediastinum, directly behind the sternum only","It is part of the myocardium, fused to the cardiac muscle"],"e":"The pericardium defines the middle mediastinum. The fibrous pericardium is fused to the diaphragm below; the serous pericardium has parietal and visceral (epicardium) layers.","lo":"Understand the location and gross structure of the pericardium.","deep":true},{"l":1,"t":"Auscultation","q":"Select ALL correct statements about the heart sounds.","c":["S1 (lub) and S2 (dub) are the normal heart sounds","S3 and S4 are extra sounds, also called gallops","Murmurs are abnormal sounds that in adults most often point to a valve disorder"],"w":["S1 is the louder sound because the semilunar valves close","S3 and S4 are always normal findings in older adults"],"e":"S3 = Kentucky gallop (ventricular filling); S4 = Tennessee gallop (atrium contracting into a stiff ventricle). Murmurs are common and usually benign in children.","lo":"Describe the heart sounds.","deep":true},{"l":2,"t":"Common iliac artery","q":"At about which vertebral level does the abdominal aorta bifurcate into the common iliac arteries?","c":"L4","w":["T12","L1","S2"],"e":"T12 is the aortic hiatus. After the L4 bifurcation, the common iliac arteries split again at the pelvic brim.","lo":"Describe the pathway and bifurcation of the aorta into the common iliac artery."},{"l":2,"t":"Subclavian artery and upper limb","q":"Select ALL correct statements about the overall pattern of blood supply to the upper limb.","c":["One continuous vessel changes name: subclavian, then axillary, then brachial","The name changes at landmarks: lateral margin of rib 1 (axillary), teres major (brachial)","The brachial artery ends near the cubital fossa by dividing into radial and ulnar arteries","The radial and ulnar arteries feed the palmar arches, which may anastomose"],"w":["The upper limb gets most of its blood from the internal thoracic artery","The axillary artery divides into radial and ulnar arteries in the axilla"],"e":"Subclavian → axillary → brachial → radial + ulnar → palmar arches. Deep veins follow the same pattern as venae comitantes.","lo":"Describe the high-level pattern of blood supply to the upper limb.","deep":true},{"l":3,"t":"Introduction to blood","q":"Rank the formed elements from most to least abundant, with their approximate counts.","c":"Erythrocytes (4.8 to 5.4 million/µL) → thrombocytes (150,000 to 400,000/µL) → leukocytes (5,000 to 10,000/µL)","w":["Leukocytes (4.8 to 5.4 million/µL) → thrombocytes (150,000 to 400,000/µL) → erythrocytes (5,000 to 10,000/µL)","Thrombocytes (4.8 to 5.4 million/µL) → erythrocytes (150,000 to 400,000/µL) → leukocytes (5,000 to 10,000/µL)","Erythrocytes (4.8 to 5.4 million/µL) → leukocytes (150,000 to 400,000/µL) → thrombocytes (5,000 to 10,000/µL)"],"e":"Leukocytes are the least abundant even though they come in five types.","lo":"Describe the basics of the formed elements.","deep":true},{"l":3,"t":"Formed elements","q":"Select ALL correct statements about the formed elements.","c":["Erythrocytes are the most abundant and transport gases","Thrombocytes are the next most abundant and work in clotting","Leukocytes are the least abundant and handle immune responses","There are five major types of leukocytes"],"w":["Thrombocytes are complete cells with nuclei","Leukocytes are the most abundant formed element"],"e":"Erythrocytes and thrombocytes are anucleate. The five leukocytes: neutrophils, lymphocytes, monocytes, eosinophils, basophils.","lo":"Describe the basics of the formed elements.","deep":true},{"l":3,"t":"Blood type","q":"Blood types are categories based on:","c":"Surface antigens (agglutinogens) on red blood cells","w":["The type of hemoglobin inside the red blood cells","The number and kind of leukocytes in a sample","The clotting proteins made by the liver and found in plasma"],"e":"An antibody meeting the antigen it recognizes causes a reaction such as agglutination or complement-mediated destruction.","lo":"Describe the nature of blood groups and how they are determined."},{"l":3,"t":"Thrombocytes","q":"Thrombocytes are best described as:","c":"Anucleate pieces of cytoplasm shed from megakaryocytes","w":["Small nucleated cells that develop from lymphoid stem cells","Immature erythrocytes that still hold their ribosomes","Granular leukocytes released from the red bone marrow"],"e":"Also called platelets; they work in hemostasis by degranulating clot-promoting substances.","lo":"Describe the structure and function of thrombocytes."},{"l":2,"t":"Vessels and circulation","q":"Which layer helps pull an artery wall back together after it is deformed?","c":"Tunica externa (elastin and collagen)","w":["Tunica media (smooth muscle)","Tunica interna (endothelium)","Basement membrane of the endothelium"],"e":"The tunica externa's elastin and collagen help the wall recoil after deformation. The media's smooth muscle sets vessel diameter under autonomic control; the elastic laminae add elasticity.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"The externa helps bring the wall back together after deformation."},{"l":2,"t":"Vessels and circulation","q":"Structurally, a capillary is like an artery that has lost which layers?","c":"Tunica externa, tunica media and the internal elastic lamina","w":["Only the tunica externa, keeping the media and elastic lamina","The endothelium and basement membrane, keeping the media","Tunica interna and tunica media, keeping the externa"],"e":"A capillary wall is just tunica interna: endothelium on a basement membrane. Strip an artery of its externa, media and internal elastic lamina and that is what is left.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"A capillary is an artery stripped of its externa, media and internal elastic lamina."},{"l":2,"t":"Vessels and circulation","q":"How does breathing (respiratory milking) help return venous blood to the heart?","c":"The diaphragm changes cavity volume, and so the pressure on the veins","w":["The lungs squeeze the venae cavae directly with each breath","Inhaled oxygen makes venous smooth muscle contract","The intercostal arteries pump blood into the azygos veins"],"e":"As the diaphragm moves, thoracic and abdominal cavity volumes change, changing pressure and drawing venous blood toward the heart. Muscle milking is the other pump: skeletal muscle squeezing nearby veins.","lo":"Describe functions, physical characteristics and features of arteries, arterioles, capillaries and veins.","note":"The diaphragm can change cavity volume, which changes pressure."},{"l":2,"t":"Aorta and branches","q":"Which branch of the abdominal aorta arises at about L3 and supplies the hindgut?","c":"Inferior mesenteric a.","w":["Superior
