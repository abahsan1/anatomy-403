function submitMulti(replay){

function pick(k,replay){

const STOP=new Set(['the','of','n','nn','nerve','nerves','a','artery','an','cn']);
const ROMAN={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12};
function norm(s){
  return s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w))
    .map(w=>ROMAN[w]?String(ROMAN[w]):w).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const OPP=[['afferent','efferent'],['medial','lateral'],['anterior','posterior'],['superior','inferior'],['dorsal','ventral'],['flexor','extensor'],['ipsilateral','contralateral'],['left','right'],['presynaptic','postsynaptic'],['sensory','motor'],['cranial','caudal'],['internal','external'],['internum','externum'],['epineurium','perineurium','endoneurium'],['gyri','gyru','sulci','sulcu'],['proximal','distal'],['maxillary','mandibular'],['monosynaptic','polysynaptic'],['cervical','sacral'],['periosteal','meningeal'],['gracili','cuneatu']];
function opposite(a,b){const A=a.split(' '),B=b.split(' ');for(let i=0;i<Math.min(A.length,B.length);i++){if(A[i]===B[i])continue;if(OPP.some(g=>g.includes(A[i])&&g.includes(B[i])))return true;
  if(OPP.some(g=>g.some(w=>A[i].startsWith(w.slice(0,5)))&&g.some(w=>B[i].startsWith(w.slice(0,5)))&&A[i].slice(0,3)!==B[i].slice(0,3)))return true}return false}
function grade(input,ans,others){
  const base=ans.a, opts=[base, base.replace(/\s*\(.*?\)\s*/g,' '), ...((base.match(/\((.*?)\)/)||[])[1]?[base.match(/\((.*?)\)/)[1]]:[]), ...ans.alt];
  const v=norm(input);
  if(!v){if(!input.trim())return 'empty';const raw=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim();return opts.map(raw).includes(raw(input))?'ok':'no'}
  const N=opts.map(norm).filter(Boolean);
  if(N.includes(v))return 'ok';
  if(others.some(o=>[o.a,o.a.replace(/\s*\(.*?\)\s*/g,' '),...o.alt].map(norm).includes(v)))return 'no';
  for(const t of N){const d=lev(v,t);if(d<=(t.length>7?2:t.length>4?1:0)&&!opposite(v,t))return 'near';}
  return 'no';
}

  const b=fbx.list[fbx.i];
  const html=b.segs.map(sg=>sg.text!=null?esc(sg.text):(()=>{const a=b.answers[sg.blank-1];const w=Math.max(6,Math.min(22,a.a.length+2));
    return `<span class="bl"><input id="f${a.n}" aria-label="Blank ${a.n}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"><span class="fb" id="ff${a.n}"></span></span>`})()).join('');
  view.innerHTML=`<div class="meta"><span>Sentence ${fbx.i+1} of ${n} · ${restartBtn}</span><span>${b.answers.length} blank${b.answers.length>1?'s':''}</span></div>
  <div class="progress"><i style="width:${fbx.i/n*100}%"></i></div>
  <div class="card"><div class="cardhead"><span class="tag">${LECT[b.l]} · ${esc(b.t)} ${saidBadge(b)}</span>${flagBtn(b.key)}</div>
  <div class="fb-s">${html}</div><div id="fbsaid" hidden>${b.e?'<div class="explain">'+esc(b.e)+'</div>':''}${saidNote(b)}</div>
  <div class="nav"><button class="btn primary" id="chk">Check</button><button class="btn" id="rev">Show answers</button><span class="spacer"></span><button class="btn" id="prev" ${fbx.i?'':'disabled'}>Back</button><button class="btn" id="nxt">Next</button></div></div>`;
  wireFlag(); $('#restart').onclick=()=>startFB(true);
  const ins=b.answers.map(a=>$('#f'+a.n));
  b.answers.forEach((a,k)=>{const el=ins[k];if(fbx.inputs[a.n])el.value=fbx.inputs[a.n];el.addEventListener('input',()=>{fbx.inputs[a.n]=el.value;saveFB()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $('#chk').click()}})});
  $('#chk').onclick=()=>{let r=0;const first=!fbx.stats[fbx.i];let anyMiss=false;
    b.answers.forEach(a=>{const el=$('#f'+a.n),fb=$('#ff'+a.n),g=grade(el.value,a,b.answers.filter(x=>x!==a&&x.a.toLowerCase()!==a.a.toLowerCase()));
      el.classList.remove('ok','no');fb.className='fb';
      if((fbx.ovr||{})[a.n]){el.classList.add('ok');fb.classList.add('ok');fb.textContent='Marked correct ('+a.a+')';r++}
      else if(g==='ok'){el.classList.add('ok');fb.textContent='';r++}
      else if(g==='near'){el.classList.add('ok');fb.classList.add('near');fb.textContent='Spelling: '+a.a;r++}
      else{el.classList.add('no');fb.classList.add('no');fb.innerHTML=esc(a.a)+(el.value.trim()?' <button class="markok" data-n="'+a.n+'">Mark correct</button>':'');anyMiss=true}});
    if(first&&anyMiss){missed.add(b.key);saveMissed()}
    view.querySelectorAll('.markok').forEach(bt=>bt.onclick=()=>{const n=+bt.dataset.n;fbx.ovr=fbx.ovr||{};fbx.ovr[n]=true;
      if(fbx.stats[fbx.i])fbx.stats[fbx.i].r=Math.min(fbx.stats[fbx.i].t,fbx.stats[fbx.i].r+1);saveFB();$('#chk').onclick();
      if(!view.querySelector('.fb-s input.no')){missed.delete(b.key);saveMissed()}});
    $('#fbsaid').hidden=false;
    if(!fbx.stats[fbx.i])fbx.stats[fbx.i]={r,t:b.answers.length};fbx.checked=true;saveFB()};
  $('#rev').onclick=()=>{let any=false;b.answers.forEach(a=>{const fb=$('#ff'+a.n);if(!fb.textContent&&!$('#f'+a.n).classList.contains('ok')){fb.className='fb no';fb.textContent=a.a;any=true}});
    if(any&&!fbx.checked){missed.add(b.key);saveMissed()}
    if(!fbx.stats[fbx.i])fbx.stats[fbx.i]={r:0,t:b.answers.length};fbx.revealed=true;saveFB()};
  $('#nxt').onclick=()=>{fbx.i++;renderFB();window.scrollTo({top:0})};
  $('#prev').onclick=()=>{fbx.i--;renderFB();window.scrollTo({top:0})};
  if(replay){if(fbx.checked)$('#chk').onclick();if(fbx.revealed)$('#rev').onclick()}
}

/* ---------- flashcards ---------- */
function wc(s){return s.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).length}
function kind(a){
  const s=a.trim();
  if(/\(CN [IVX]+\)$/.test(s)||/ n\.$/.test(s)||/\bnerves?\b/i.test(s)&&wc(s)<=4)return 'Nerve name';
  if(/ a\.$/.test(s)||/\barter(y|ies)\b/i.test(s)&&wc(s)<=5)return 'Artery name';
  if(/^\d+$/.test(s))return 'A number';
  if(/^[CTLS]\d/.test(s))return 'Spinal level(s)';
  if(/^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)(, | and |$)/.test(s))return 'Cranial nerve number(s)';
  if(/\blobes?\b/i.test(s)&&wc(s)<=3)return 'Lobe';
  if(/\b(sulcus|fissure|gyrus|gyri|lobule)\b/i.test(s)&&wc(s)<=4)return 'Brain landmark';
  if(/\b(ventricle|aqueduct|foramen|canal)\b/i.test(s)&&wc(s)<=5)return 'Part of the ventricular system';
  if(/\b(sinus|falx|tentorium|confluens)\b/i.test(s)&&wc(s)<=4)return 'Dural fold or sinus';
  if(/(cells?|cytes?|glia|neurons?)$/i.test(s)&&wc(s)<=4)return 'Cell type';
  if(/(mater|neurium)$/i.test(s)&&wc(s)<=3)return 'Covering layer';
  return null;
}
function fmtHint(c){
  if(c.type==='l'){const k=kind(c.a.a);const n=wc(c.a.a);return (k||'Structure name')+' · '+n+' word'+(n>1?'s':'')}
  if(c.type==='m')return 'Give each: '+c.m.f.map(x=>x[0]).join(' · ');
  if(c.type==='b'){const ws=c.b.answers.map(a=>wc(a.a));return c.b.answers.length+' blank'+(c.b.answers.length>1?'s':'')+' · '+ws.map(w=>w+' word'+(w>1?'s':'')).join(', ')}
  const q=c.q, ans=q.c;
  if(Array.isArray(ans))return 'List '+ans.length+' items';
  if(/full profile of CN/.test(q.q))return 'Name · modality (sensory / motor / mixed) · targets · brain stem attachment';
  if(ans.includes('→')&&/\. [A-Z]/.test(ans))return 'Order of the layers, then their functions';
  if(ans.includes('→'))return 'Sequence of '+(ans.split('→').length)+' steps, in order';
  const segs=ans.split(' · ');
  if(segs.length>1){const labs=segs.map(s=>{const m=s.match(/^([^:]{1,25}):/);return m?m[1].trim():null});
    if(labs.every(Boolean))return 'Give each: '+labs.join(' · ');
    return segs.length+' parts';}
  const k=kind(ans); if(k)return k+(wc(ans)>1?' · '+wc(ans)+' words':'');
  const n=wc(ans);
  if(n<=4)return 'Short answer · '+n+' word'+(n>1?'s':'');
  return 'One-sentence description';
}
const needsChoices=q=>/\bNOT\b|EXCEPT/.test(q.q);

let fc={src:'missed',deck:[],i:0,got:0};
function buildDeck(src){
  const inLec=l=>!st.lec||l===st.lec, cards=[];
  QUESTIONS.forEach(q=>{if(!inLec(q.l))return;const k=qKey(q);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(k)))cards.push({type:'q',q,key:k})});
  BL.forEach(b=>{if(!inLec(b.l))return;if(src==='all'||(src==='missed'&&missed.has(b.key))||(src==='flagged'&&flags.has(b.key)))cards.push({type:'b',b,key:b.key})});
  MUSCLES.forEach(m=>{if(!inLec(m.l))return;if(src==='all'||src==='muscles')cards.push({type:'m',m,key:m.key})});
  FIGS.forEach(f=>{if(!inLec(f.lec))return;f.answers.forEach(a=>{const k=lKey(f,a);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(fKey(f))))cards.push({type:'l',f,a,key:k})})});
  return cards;
}
function cardFromKey(k){
  if(k.startsWith('m:')){const m=MUSCLES.find(x=>x.key===k);return m?{type:'m',m,key:k}:null}
  if(k.startsWith('b:')){const b=BLBY.get(k);return b?{type:'b',b,key:k}:null}
  if(k.startsWith('l:')){const [img,n]=k.slice(2).split('|');const f=FBY.get(img);const a=f&&f.answers.find(x=>String(x.n)===n);return a?{type:'l',f,a,key:k}:null}
  const q=QBY().get(k);return q?{type:'q',q,key:k}:null;
}
function saveFC(){putSess('fc',{deck:fc.deck.map(c=>c.key),i:fc.i,got:fc.got,flipped:!!fc.flipped});try{localStorage.setItem('gi-fcsrc',fc.src)}catch(e){}}
function startFC(src,fresh){
  if(src)fc.src=src;
  if(!fresh){const s=getSess('fc');
    if(s&&s.deck){const deck=s.deck.map(cardFromKey).filter(Boolean);
      if(deck.length){fc={src:fc.src,deck,i:Math.min(s.i,deck.length),got:s.got,flipped:s.flipped};renderFC(true);return}}}
  fc={src:fc.src,deck:shuffle(buildDeck(fc.src)),i:0,got:0,flipped:false};
  renderFC();
}
try{const s=localStorage.getItem('gi-fcsrc');if(s)fc.src=s}catch(e){}
function srcChips(){
  const n=s=>buildDeck(s).length;
  return `<div class="src" role="group" aria-label="Deck">
   <button class="chip" data-src="missed" aria-pressed="${fc.src==='missed'}">Missed (${n('missed')})</button>
   <button class="chip" data-src="flagged" aria-pressed="${fc.src==='flagged'}">Flagged (${n('flagged')})</button>
   ${MUSCLES.length?`<button class="chip" data-src="muscles" aria-pressed="${fc.src==='muscles'}">Muscles (${n('muscles')})</button>`:''}
   <button class="chip" data-src="all" aria-pressed="${fc.src==='all'}">Everything (${n('all')})</button></div>`;
}
function wireSrc(){view.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>startFC(b.dataset.src))}
function renderFC(replay){
  const n=fc.deck.length, left=n-fc.i;
  if(!replay)fc.flipped=false;
  saveFC();
  if(!n){
    const msg=fc.src==='missed'?'Every question you miss, and every fill-in sentence you miss on its first check, lands here automatically.'
      :fc.src==='flagged'?'Tap Flag on a question or sentence and it shows up here.':'Nothing in this lecture.';
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>${fc.src==='missed'?'No misses yet':'Nothing here yet'}</h2><p>${msg}</p><div class="nav" style="justify-content:center"><button class="btn primary" id="goall">Study everything instead</button></div></div>`;
    wireSrc();$('#goall').onclick=()=>startFC('all');return;
  }
  if(fc.i>=n){
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>Deck done</h2><p>${fc.got} card${fc.got===1?'':'s'} marked "Got it"${fc.src==='missed'?' and removed from your misses':''}.</p><div class="nav" style="justify-content:center"><button class="btn primary" id="again">Go again</button></div></div>`;
    wireSrc();$('#again').onclick=()=>startFC(null,true);return;
  }
  const c=fc.deck[fc.i];
  let front,back,tag;
  if(c.type==='m'){tag=LECT[c.m.l]+' · '+esc(c.m.g)+' · muscle';front=`<div class="front">${esc(c.m.n)}</div>`;
    back=c.m.f.map(([k,v])=>`<div class="why"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');}
  else if(c.type==='b'){tag=LECT[c.b.l]+' · '+esc(c.b.t)+' · fill in '+saidBadge(c.b);
    front=`<div class="front" style="font-weight:500">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'_____').join('')}</div>`;
    back=`<div class="why filled" style="font-size:1.05rem">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'<b>'+esc(c.b.answers[sg.blank-1].a)+'</b>').join('')}</div>`;}
  else if(c.type==='q'){tag=LECT[c.q.l]+' · '+esc(c.q.t)+' '+saidBadge(c.q);front=(c.q.lo?`<p class="lo"><b>Objective:</b> ${esc(c.q.lo)}</p>`:'')+`<div class="front">${esc(c.q.q)}</div>`;
    if(needsChoices(c.q)){const ch=shuffle([...(Array.isArray(c.q.c)?c.q.c:[c.q.c]),...c.q.w]);front+=`<ol class="choices" type="A">${ch.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`;}
    back=(Array.isArray(c.q.c)?`<ul class="ans-list">${c.q.c.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:`<div class="ans">${esc(c.q.c)}</div>`)+`<div class="why">${esc(c.q.e)}</div>`+saidNote(c.q);
  }
  else{tag=LECT[c.f.lec]+' · '+esc(c.f.title);front=`<div class="front">What is structure <span class="num" style="display:inline-grid;vertical-align:middle;margin:0 2px">${c.a.n}</span>?</div>
    <div class="plate"><img src="${IMG[c.f.img]}" alt="${esc(c.f.title)}" style="cursor:pointer"></div><div><button class="btn" id="fczoom" style="padding:6px 12px;font-size:.82rem">Enlarge image</button></div>`;
    back=`<div class="ans">${esc(c.a.a)}</div>`;}
  view.innerHTML=srcChips()+`<div class="meta"><span>Card ${fc.i+1} of ${n} · ${restartBtn}</span><span class="score">${left} left · <b>${fc.got}</b> got it</span></div>
  <div class="progress"><i style="width:${fc.i/n*100}%"></i></div>
  <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card"><span class="tag">${tag}</span>${front}
   <div class="fmt"><span class="fl">Answer format</span><span>${esc(fmtHint(c))}</span></div>
   <div class="back" id="back" hidden>${back}</div><div class="tapnote" id="tapnote">Tap the card to see the answer</div></div>
  <div class="nav"><button class="btn" id="fcback" ${fc.i?'':'disabled'}>Back</button><span class="spacer"></span><span id="rate" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn again" id="again">Still learning</button><button class="btn got" id="got">Got it</button></span></div>`;
  wireSrc(); $('#restart').onclick=()=>startFC(null,true);
  const show=()=>{$('#back').hidden=false;$('#tapnote').hidden=true;$('#rate').hidden=false};
  const flip=()=>{if(fc.flipped)return;fc.flipped=true;show();saveFC()};
  if(replay&&fc.flipped)show();
  $('#flash').onclick=e=>{if(e.target.id==='fczoom'){e.stopPropagation();$('#zimg').src=IMG[c.f.img];$('#zoom').hidden=false;return}flip()};
  $('#flash').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const next=()=>{fc.i++;renderFC();window.scrollTo({top:0})};
  $('#fcback').onclick=()=>{fc.i--;renderFC();window.scrollTo({top:0})};
  $('#got').onclick=()=>{fc.got++;if(fc.src==='missed'){missed.delete(c.key);saveMissed()}next()};
  $('#again').onclick=()=>{const pos=Math.min(fc.deck.length,fc.i+4);fc.deck.splice(pos,0,c);next()};
}

/* ---------- controls ---------- */
function sync(){
  if(!FIGS.length&&st.mode==='id')st.mode='mcq';
  $('#m-mcq').setAttribute('aria-pressed',st.mode==='mcq');$('#m-id').setAttribute('aria-pressed',st.mode==='id');$('#m-fb').setAttribute('aria-pressed',st.mode==='fb');$('#m-fc').setAttribute('aria-pressed',st.mode==='fc');
  $('#fchip').hidden=st.mode==='fc'; if(st.mode==='fc')st.flagOnly=false;
  document.querySelectorAll('.chip[data-l]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.l===st.lec));
  {const sel=document.querySelector('.chip[data-l][aria-pressed="true"]'),row=$('#chips');if(sel&&row.scrollWidth>row.clientWidth)row.scrollLeft=Math.max(0,sel.offsetLeft-row.offsetLeft-16);}
  document.body.dataset.mode=st.mode; updateFchip(); save();
  view.innerHTML='<div class="card" style="padding:32px 28px"><h2 style="margin:0 0 8px;font-size:1.5rem">No questions yet</h2><p style="margin:0;color:var(--x-stage-muted);line-height:1.5">This exam\'s lectures are added here as they\'re covered. Multiple choice, fill in the blank and flashcards will all show up on this page.</p><p style="margin:18px 0 0"><a class="btn primary" href="/" style="display:inline-flex;text-decoration:none">Back to all exams</a></p></div>';return;
  st.mode==='mcq'?startMCQ():st.mode==='id'?startID():st.mode==='fb'?startFB():startFC();
}
$('#m-mcq').onclick=()=>{st.mode='mcq';sync()};
$('#m-id').onclick=()=>{st.mode='id';sync()};
$('#m-fc').onclick=()=>{st.mode='fc';sync()};
$('#m-fb').onclick=()=>{st.mode='fb';sync()};
document.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{st.lec=+c.dataset.l;history.replaceState(null,'',st.lec?'#lecture-'+st.lec:location.pathname);sync()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#lecture-([1-6])$/);const n=m?+m[1]:0;if(n!==st.lec){st.lec=n;sync()}});
$('#fchip').onclick=()=>{st.flagOnly=!st.flagOnly;sync()};
sync();
})();
</script>
