","Loss of smell","Hearing loss"],"e":"Dislocation is a separate clinical issue: the condyle passes anterior to the articular tubercle."},{"l":3,"t":"Muscles of the head","q":"What makes the muscles of facial expression unusual compared with most skeletal muscles?","c":"They lie in subcutaneous tissue and attach distally to skin","w":["They attach only to the mandible","They are innervated by CN V3","They are smooth muscle","They lack innervation"],"e":"They move the skin and change facial expression. All are innervated by the facial n. (CN VII)."},{"l":3,"t":"Muscles of the head","q":"A patient with Bell palsy would show all of the following on the affected side EXCEPT:","c":"Weakness when clenching the jaw","w":["Inability to close the eye tightly","Drooping at the corner of the mouth","Food collecting between cheek and gums","Unilateral loss of facial expression"],"e":"Jaw clenching uses the muscles of mastication (CN V3), not CN VII."},{"l":3,"t":"Muscles of the head","q":"Food keeps pocketing between a patient's cheek and molars. Which muscle is weak?","c":"Buccinator","w":["Masseter","Orbicularis oris","Temporalis","Medial pterygoid"],"e":"The buccinator presses the cheek against the molars and, together with the tongue, keeps food out of the oral vestibule. It also resists distension when blowing."},{"l":3,"t":"Muscles of the head","q":"Which muscle pairing is correct?","c":"Orbicularis oculi: closes eyelids; orbicularis oris: closes the oral fissure and protrudes the lips","w":["Orbicularis oculi: elevates the eyeball","Orbicularis oris: presses cheek on molars","Both are muscles of mastication","Both are innervated by CN III"],"e":"Both are sphincteric muscles of facial expression."},{"l":3,"t":"Muscles of the head","q":"The extra-ocular muscles attach distally to the:","c":"Sclera","w":["Cornea","Eyelid skin","Orbital floor","Optic nerve"],"e":"They control eyeball movements: elevation/depression, abduction/adduction, and intorsion/extorsion."},{"l":3,"t":"Muscles of the head","q":"Complete damage to CN III would affect how many of the six extra-ocular muscles?","c":"4","w":["1","2","6","3"],"e":"CN III supplies 4 of the 6. CN IV and CN VI supply one each."},{"l":3,"t":"Muscles of the head","q":"Compression of CN V3 would most weaken which movement?","c":"Elevation of the mandible (biting)","w":["Closing the eyelid","Moving the tongue","Elevating the eyeball","Smiling"],"e":"All muscles of mastication attach to the mandible and are innervated by V3. Elevation is their most powerful movement."},{"l":3,"t":"Muscles of the head","q":"Which muscle of mastication both elevates and retrudes the mandible, attaching to the coronoid process?","c":"Temporalis","w":["Masseter","Medial pterygoid","Lateral pterygoid","Buccinator"],"e":"The temporalis is palpable at the temple."},{"l":3,"t":"Muscles of the head","q":"A patient can't open the jaw against resistance or jut the chin forward. Which muscle is most affected?","c":"Lateral pterygoid","w":["Masseter","Temporalis","Medial pterygoid","Orbicularis oris"],"e":"The lateral pterygoid has two heads and is the only muscle of mastication that depresses the mandible."},{"l":3,"t":"Muscles of the head","q":"The masseter and medial pterygoid 'mirror' each other because they:","c":"Attach to the superficial and deep sides of the ramus, and both elevate and protrude","w":["Both attach to the coronoid process","Both depress the mandible","Are both muscles of facial expression","Are both innervated by CN VII"],"e":"The masseter is palpable. The medial pterygoid is not."},{"l":3,"t":"Muscles of the head","q":"Which pairing of tongue muscles is correct?","c":"Extrinsic: originate outside the tongue, change its position; intrinsic: entirely within, change its shape","w":["Extrinsic: change shape; intrinsic: change position","Both are innervated by CN VII","Intrinsic muscles attach to the hyoid","There are 8 extrinsic muscles"],"e":"There are 4 extrinsic and 4 intrinsic muscles. Most are innervated by the hypoglossal n. (CN XII)."},{"l":3,"t":"Bones & joints of neck & back","q":"Which statement about the hyoid is correct?","c":"It articulates with no other bone and is suspended by muscles and ligaments between the mandible and larynx","w":["It articulates with C3","It is part of the viscerocranium","It is paired","It forms the floor of the orbit"],"e":"The hyoid is unpaired and supports the tongue."},{"l":3,"t":"Bones & joints of neck & back","q":"Which is NOT a function of the vertebral column?","c":"Producing cerebrospinal fluid","w":["Protecting the spinal cord","Allowing movement","Providing attachment for bones and muscles","Bearing weight"],"e":"CSF sits within the vertebral canal, but the column doesn't produce it."},{"l":3,"t":"Bones & joints of neck & back","q":"A typical vertebra consists of:","c":"A body, a vertebral arch, and 7 processes","w":["A body and 4 processes","An arch and 2 transverse processes only","A body, dens, and 7 processes","A ring of bone with no body"],"e":"The 7 processes are 2 transverse, 1 spinous, and 4 articular."},{"l":3,"t":"Bones & joints of neck & back","q":"A surgeon removes the broad, flat plates of the vertebral arch to decompress the spinal cord. Which parts are removed?","c":"Laminae","w":["Pedicles","Vertebral bodies","Transverse processes","Intervertebral discs"],"e":"The pedicles project posteriorly from the body and unite with the laminae."},{"l":3,"t":"Bones & joints of neck & back","q":"The vertebral foramen is formed by:","c":"The vertebral arch and the posterior surface of the body","w":["Adjacent vertebral notches and the IV disc","The transverse processes","The spinous process and laminae only","The articular facets"],"e":"A succession of vertebral foramina forms the vertebral canal, which contains the spinal cord, spinal nerve roots, meninges, epidural fat, and CSF."},{"l":3,"t":"Bones & joints of neck & back","q":"A herniated disc compresses a spinal nerve as it exits the column. Where does the nerve exit, and what lies there?","c":"Intervertebral foramen; dorsal root ganglia","w":["Vertebral foramen; spinal cord","Transverse foramen; vertebral a.","Foramen magnum; medulla","Sacral hiatus; cauda equina"],"e":"The intervertebral foramen is formed by the vertebral notches of adjacent vertebrae plus the IV disc."},{"l":3,"t":"Bones & joints of neck & back","q":"Which processes provide attachment for the deep back muscles?","c":"Transverse and spinous processes","w":["Articular processes only","Pedicles and laminae","Vertebral bodies","Dens and odontoid"],"e":"The spinous process extends posteriorly and is palpable. The transverse processes extend posterolaterally."},{"l":3,"t":"Bones & joints of neck & back","q":"A vertebra has small body, bifid spinous process, and holes in its transverse processes. Identify it and what passes through the holes.","c":"Cervical; vertebral aa.","w":["Thoracic; ribs","Lumbar; spinal nerves","Cervical; spinal cord","Sacral; ventral rami"],"e":"Transverse foramina carry the vertebral arteries. C2/3–C6 have bifid spinous processes."},{"l":3,"t":"Bones & joints of neck & back","q":"A vertebra is a ring of bone with no body and no spinous process. It articulates with:","c":"The occipital condyles and C2","w":["The ribs","The sacrum","C1 and C3","The hyoid"],"e":"This is C1, the atlas."},{"l":3,"t":"Bones & joints of neck & back","q":"Which vertebral type articulates with both the head and the tubercle of a rib, and where?","c":"Thoracic; costal facets on the body and on the transverse process","w":["Cervical; transverse foramina","Lumbar; articular processes","Thoracic; the spinous process","Sacral; the auricular surface"],"e":"The head of the rib meets the body, and the tubercle meets the transverse process."},{"l":3,"t":"Bones & joints of neck & back","q":"Which vertebrae are largest and have superior articular processes directed medially?","c":"Lumbar","w":["Cervical","Thoracic","Sacral","Coccygeal"],"e":"Lumbar vertebrae support a lot of weight. The vertebral bodies get larger toward the lumbar region."},{"l":3,"t":"Bones & joints of neck & back","q":"Which curvatures are concave anteriorly, and when did they develop?","c":"Thoracic and sacral (kyphoses); fetal period (primary)","w":["Cervical and lumbar (lordoses); fetal period","Thoracic and sacral; after birth (secondary)","Cervical and lumbar; primary","All four; fetal period"],"e":"The primary curvatures come from the flexed fetal position. The secondary curvatures, cervical and lumbar, come from extension and align with developmental landmarks."},{"l":3,"t":"Bones & joints of neck & back","q":"What are the main functions of the adult spinal curvatures?","c":"Flexibility and shock-absorbing resilience","w":["Protecting the ribs","Producing CSF","Preventing all rotation","Anchoring the hyoid"],"e":"Adults have 4 curvatures."},{"l":3,"t":"Bones & joints of neck & back","q":"An elderly woman has a hunched upper back and multiple vertebral compression fractures. Which curvature is this, and what's the likely cause?","c":"Excessive thoracic kyphosis; osteoporosis","w":["Excessive lumbar lordosis; weight gain","Scoliosis; muscle weakness","Excessive cervical lordosis; trauma","Normal sacral kyphosis"],"e":"Osteoporosis often causes excessive thoracic kyphosis."},{"l":3,"t":"Bones & joints of neck & back","q":"A patient with weak trunk muscles and recent large weight gain has an anterior pelvic tilt. Which atypical curvature fits?","c":"Excessive lumbar lordosis","w":["Excessive thoracic kyphosis","Scoliosis","Loss of sacral kyphosis","Excessive cervical kyphosis"],"e":"Scoliosis is an atypical lateral curvature."},{"l":3,"t":"Bones & joints of neck & back","q":"Which statement about intervertebral discs is FALSE?","c":"There is a disc between C1 and C2","w":["They are symphyses between vertebral bodies","They get thicker inferiorly","The anulus fibrosus is thinner posteriorly","The nucleus pulposus is semifluid"],"e":"There is no IV disc bet rae","It forms part of the pelvic brim","It articulates with the hip bones"],"e":"The tip of the coccyx forms the posterior boundary of the pelvic outlet."},{"l":5,"t":"Bones & joints of the pelvis","q":"The sacro-iliac joint is best classified as:","c":"A weight-bearing compound joint, part synovial (atypical plane) and part syndesmosis","w":["A pure ball & socket joint","A symphysis","A synchondrosis","A hinge joint"],"e":"It is formed by the auricular surfaces of the hip bone and the sacrum."},{"l":5,"t":"Bones & joints of the pelvis","q":"The pubic symphysis is which type of joint?","c":"Cartilaginous symphysis","w":["Fibrous syndesmosis","Synovial plane","Synchondrosis","Synostosis"],"e":"The symphyseal surfaces of the two pubic bones meet in the anterior midline."},{"l":5,"t":"Muscles of the pelvis","q":"The piriformis is called 'key to the hip.' What are its attachments and actions?","c":"Sacrum → greater trochanter; lateral rotation and abduction of the hip","w":["Ilium → lesser trochanter; hip flexion","Ischial tuberosity → tibia; knee flexion","Sacrum → linea aspera; adduction","Coccyx → greater trochanter; medial rotation"],"e":"The piriformis traverses the greater sciatic foramen."},{"l":5,"t":"Muscles of the pelvis","q":"The pelvic diaphragm consists of:","c":"Levator ani and (ischio)coccygeus","w":["Piriformis and levator ani","Obturator internus and coccygeus","Gluteus maximus and levator ani","Iliacus and psoas major"],"e":"This sling of muscles separates the pelvic cavity from the perineum, with openings for the urethra, vagina, and rectum/anal canal."},{"l":5,"t":"Muscles of the pelvis","q":"After a difficult vaginal delivery, which pelvic floor component is most likely injured?","c":"The most medial portions of the levator ani, around the vaginal canal","w":["The (ischio)coccygeus","The piriformis","The sacrotuberous ligament","The obturator membrane"],"e":"The levator ani is the most commonly injured component of the pelvic floor."},{"l":5,"t":"Muscles of the pelvis","q":"Which pelvic diaphragm muscle forms its posterior portion and plays a similar supportive role to the levator ani?","c":"(Ischio)coccygeus","w":["Piriformis","Obturator internus","Gluteus minimus","Psoas major"],"e":"The perineal muscles are covered in the reproductive portion of the course."},{"l":5,"t":"Bones of the lower limb","q":"What are the four main regions of the lower limb?","c":"Gluteal, thigh (femoral), leg (crural), ankle and foot","w":["Hip, knee, ankle, foot","Pelvic, femoral, tibial, pedal","Gluteal, knee, leg, toes","Thigh, knee, shin, ankle"],"e":"Lower limb functions: support body weight, locomotion, and balance."},{"l":5,"t":"Bones of the lower limb","q":"The femur articulates with which bones?","c":"Hip bone, patella, tibia","w":["Hip bone, tibia, fibula","Sacrum, patella, tibia","Hip bone, fibula, talus","Patella, tibia, calcaneus"],"e":"The femur is the longest and heaviest bone. It forms the hip, patellofemoral, and knee joints."},{"l":5,"t":"Bones of the lower limb","q":"An elderly woman falls and is told she 'broke her hip.' Which part of the femur is most likely fractured?","c":"Neck","w":["Greater trochanter","Linea aspera","Medial condyle","Lesser trochanter"],"e":"The neck is the constricted area distal to the head."},{"l":5,"t":"Bones of the lower limb","q":"Which muscles attach distally to the greater trochanter vs. the lesser trochanter?","c":"Greater: gluteus medius/minimus and lateral rotators (incl. piriformis); lesser: iliopsoas","w":["Greater: iliopsoas; lesser: gluteus medius","Greater: adductors; lesser: hamstrings","Greater: quadriceps; lesser: sartorius","Greater: gluteus maximus; lesser: piriformis"],"e":"The greater trochanter is a massive lateral projection. The lesser trochanter is smaller and posterior."},{"l":5,"t":"Bones of the lower limb","q":"The femoral condyles are:","c":"Bulbous articular projections, more prominent posteriorly, that articulate with the tibial condyles","w":["Flat surfaces that articulate with the fibula","Attachment sites for the iliopsoas","Found on the proximal femur","Part of the hip joint"],"e":"They form the knee joint."},{"l":5,"t":"Bones of the lower limb","q":"Which statement about the patella is correct?","c":"It is the largest sesamoid bone, forms within the quadriceps femoris tendon, and articulates with the femur","w":["It articulates with the tibia","It forms within the hamstring tendon","It is part of the pelvic girdle","It is the smallest sesamoid bone"],"e":"The patella articulates anteriorly with the femur at the patellofemoral joint."},{"l":5,"t":"Bones of the lower limb","q":"Which pairing of leg bone and features is correct?","c":"Tibia: larger, medial, weight-bearing; fibula: smaller, lateral, muscle attachments","w":["Fibula: weight-bearing, medial","Tibia: lateral, muscle attachments only","Fibula: forms the medial malleolus","Tibia: forms the lateral malleolus"],"e":"The tibia is the 'shin bone.'"},{"l":5,"t":"Bones of the lower limb","q":"The quadriceps femoris tendon (via the patellar ligament) attaches distally to the:","c":"Tibial tuberosity","w":["Head of the fibula","Medial malleolus","Linea aspera","Lateral tibial condyle"],"e":"The tibial tuberosity is on the anterior proximal tibia."},{"l":5,"t":"Bones of the lower limb","q":"The medial and lateral 'ankle bones' you can palpate are, respectively:","c":"Medial malleolus of the tibia; lateral malleolus of the fibula","w":["Medial malleolus of the fibula; lateral malleolus of the tibia","Both are parts of the talus","Both are parts of the calcaneus","Medial condyle; lateral condyle"],"e":"Both malleoli are distal, inferior projections."},{"l":5,"t":"Bones of the lower limb","q":"A roofer lands on his heels after a fall. Which tarsal bone should be evaluated, and which tarsal forms the ankle joint with the tibia and fibula?","c":"Calcaneus; talus","w":["Talus; calcaneus","Navicular; cuboid","Calcaneus; cuboid","Talus; navicular"],"e":"The calcaneus is the weight-bearing 'heel bone.' The talus is the 'ankle bone' and forms the talocrural joint."},{"l":5,"t":"Bones of the lower limb","q":"How are the metatarsals numbered, and what do they articulate with?","c":"1–5 medial to lateral; distal tarsals (TMT joints) and proximal phalanges (MTP joints)","w":["1–5 lateral to medial; proximal tarsals and middle phalanges","1–5 medial to lateral; talus and distal phalanges","1–5 lateral to medial; calcaneus and proximal phalanges","They aren't numbered"],"e":"The 1st metatarsal is on the big toe side."},{"l":5,"t":"Bones of the lower limb","q":"Which toe lacks an intermediate phalanx, and so has no DIP joint?","c":"1st (big toe)","w":["2nd","3rd","5th","None"],"e":"There are 5 proximal, 4 intermediate, and 5 distal phalanges. Interphalangeal joints: PIP and DIP."},{"l":5,"t":"Joints of the hip & knee","q":"The hip joint's articular surfaces and joint type are:","c":"Acetabulum and femoral head; ball & socket","w":["Acetabulum and greater trochanter; hinge","Femoral head and sacrum; plane","Femoral condyles and tibia; modified hinge","Ilium and femoral neck; condyloid"],"e":"The hip allows flexion/extension, abduction/adduction, circumduction, and medial/lateral rotation."},{"l":5,"t":"Joints of the hip & knee","q":"You can stand upright for a long time without much muscle effort, partly because a strong anterior ligament prevents hip hyperextension. Which ligament?","c":"Iliofemoral","w":["Pubofemoral","Ischiofemoral","Patellar","Sacrotuberous"],"e":"The iliofemoral ligament is called the 'strongest' ligament in the body. It is anterior and superficial."},{"l":5,"t":"Joints of the hip & knee","q":"The knee region's single joint capsule contains:","c":"The right and left femorotibial joints and the femoropatellar joint","w":["One femorotibial joint and the tibiofibular joint","The hip and knee joints","The patellofemoral joint only","The femorotibial and talocrural joints"],"e":"The femorotibial surfaces are the medial and lateral condyles of the femur and tibia."},{"l":5,"t":"Joints of the hip & knee","q":"The knee is a modified hinge joint. Which rotation 'locks' it in full extension, and which 'unlocks' it?","c":"Medial rotation locks; lateral rotation unlocks","w":["Lateral locks; medial unlocks","Flexion locks; extension unlocks","Abduction locks; adduction unlocks","The knee cannot rotate"],"e":"The main movements are flexion and extension, with slight gliding and rotation."},{"l":5,"t":"Joints of the hip & knee","q":"Why is the medial meniscus often torn together with the tibial (medial) collateral ligament?","c":"The TCL is attached to the medial meniscus","w":["They are the same structure","The medial meniscus attaches to the FCL","Both are inside the ACL","The meniscus is part of the patellar ligament"],"e":"The collateral ligaments are the fibular/lateral (FCL/LCL) and the tibial/medial (TCL/MCL)."},{"l":5,"t":"Joints of the hip & knee","q":"The anterior knee capsule is incomplete. Which ligament provides most of the anterior protection?","c":"Patellar ligament (patella → tibial tuberosity)","w":["ACL","PCL","FCL","TCL"],"e":"The patellar ligament is the distal portion of the quadriceps femoris tendon."},{"l":5,"t":"Joints of the hip & knee","q":"On exam, the tibia slides excessively forward relative to the femur. Which ligament is torn, and how commonly is it injured?","c":"ACL; weaker and more commonly injured","w":["PCL; more commonly injured","ACL; rarely injured","PCL; rarely injured","TCL; prevents anterior displacement"],"e":"The ACL prevents anterior displacement of the tibia, and the PCL prevents posterior displacement. The cruciates lie within the joint capsule."},{"l":5,"t":"Joints of the hip & knee","q":"A dashboard injury pushes the tibia backward. Which ligament resists this?","c":"PCL","w":["ACL","FCL","Patellar ligament","Iliofemoral"],"e":"The PCL prevents posterior displacement of the tibia."},{"l":5,"t":"Joints of the hip & knee","q":"The menisci are:","c":"Crescent-shaped fibrocartilage plates on the tibial condyles","w":["Hyaline cartilage on the femoral head","Ligaments inside the hip","Bursae around the patella","Complete articular discs"],"e":"The medial meniscus is attached to the TCL."},{"l":5,"t":"Joints of the hip & knee","q":"A football player takes a blow to the lateral side of an extended knee. The 'terrible triad' injures:","c":"TCL, medial meniscus, and ACL","w":["FCL, lateral meniscus, and PCL","ACL, PCL, and patellar ligament","TCL, lateral meniscus, and PCL","Iliofemoral, pubofemoral, and ischiofemoral ligaments"],"e":"The terrible triad can also come from excessive twisting. Ligament sprains are common in contact sports."},{"l":5,"t":"Joints of the ankle region","q":"What are the three tibiofibular joints?","c":"Superior tibiofibular (synovial plane), the interosseous membrane, and the inferior tibiofibular joint (syndesmoses)","w":["Three synovial hinge joints","The talocrural, subtalar, and transverse tarsal joints","Superior, middle, and inferior synovial joints","The knee, ankle, and interosseous joints"],"e":"The interosseous membrane and the inferior tibiofibular joint are the tibiofibular syndesmoses."},{"l":5,"t":"Joints of the ankle region","q":"A 'high ankle sprain' injures which ligaments, and how does it compare with a typical sprain?","c":"Ligaments of the tibiofibular syndesmoses; more serious, with longer healing","w":["The ATFL; milder","The deltoid ligament; heals faster","The patellar ligament; more serious","The plantar aponeurosis; heals faster"],"e":"High ankle sprains are generally more serious than typical sprains."},{"l":5,"t":"Joints of the ankle region","q":"What are the articular surfaces of the talocrural (ankle) joint?","c":"The distal tibia (greater surface area) and fibula, including both malleoli, with the talus","w":["The calcaneus and talus","The talus and navicular","The tibia and calcaneus only","The fibula and cuboid"],"e":"It is a hinge joint that allows plantarflexion and dorsiflexion."},{"l":5,"t":"Joints of the ankle region","q":"Turning the sole of the foot inward (inversion) mainly occurs at which joints?","c":"Subtalar and transverse tarsal joints","w":["Talocrural joint","Superior tibiofibular joint","Knee joint","Metatarsophalangeal joints"],"e":"The talocrural joint handles plantarflexion and dorsiflexion. Inversion and eversion occur at the subtalar and transverse tarsal joints."},{"l":5,"t":"Joints of the ankle region","q":"Which ligament group interweaves on the medial malleolus, is more robust, and stabilizes the ankle during eversion?","c":"Deltoid (medial) ligaments","w":["Lateral ligaments","Tibiofibular syndesmosis","Patellar ligament","Plantar aponeurosis"],"e":"The deltoid ligaments are more robust than the lateral ligaments."},{"l":5,"t":"Joints of the ankle region","q":"Which statement about the lateral ankle ligaments is correct?","c":"Three separate ligaments attach to the lateral malleolus without interweaving and stabilize the ankle during inversion","w":["They interweave on the medial malleolus","They stabilize during eversion","They are a single ligament","They are the most robust ankle ligaments"],"e":"The anterior talofibular ligament (ATFL) is the most commonly injured."},{"l":5,"t":"Joints of the ankle region","q":"A basketball player rolls the ankle, turning the sole inward. What is the mechanism, and which ligament is most likely damaged?","c":"Over-inversion; ATFL","w":["Over-eversion; deltoid ligament","Over-inversion; deltoid ligament","Hyperextension; iliofemoral","Over-eversion; ATFL"],"e":"Ankle sprains are among the most common musculoskeletal injuries. Their severity depends on how much ligament is damaged."},{"l":5,"t":"Muscles of the gluteal region","q":"Order the gluteal muscles from superficial to deep:","c":"Maximus, medius, minimus","w":["Minimus, medius, maximus","Medius, maximus, minimus","Maximus, minimus, medius","Piriformis, maximus, medius"],"e":"All three act on the hip joint."},{"l":5,"t":"Muscles of the gluteal region","q":"What is the distal attachment of the gluteus maximus?","c":"Iliotibial (IT) tract/band","w":["Greater trochanter","Lesser trochanter","Linea aspera only","Tibial tuberosity"],"e":"The gluteus maximus is innervated by the inferior gluteal n. It extends and laterally rotates the hip."},{"l":5,"t":"Muscles of the gluteal region","q":"A patient struggles to rise from a chair and climb stairs, both of which need powerful hip extension. Which nerve is most likely compressed?","c":"Inferior gluteal n.","w":["Superior gluteal n.","Femoral n.","Obturator n.","Deep fibular n."],"e":"The inferior gluteal n. supplies the gluteus maximus."},{"l":5,"t":"Muscles of the gluteal region","q":"The gluteus medius and minimus attach distally to the ___ and are innervated by the ___.","c":"Greater trochanter; superior gluteal n.","w":["IT tract; inferior gluteal n.","Lesser trochanter; femoral n.","Linea aspera; obturator n.","Greater trochanter; inferior gluteal n."],"e":"They stabilize the hip, abduct it, and medially rotate it."},{"l":5,"t":"Muscles of the gluteal region","q":"Standing on the right leg, a patient's left hip drops because the right hip can't stabilize. Which muscles and nerve are weak?","c":"Right gluteus medius/minimus; right superior gluteal n.","w":["Right gluteus maximus; inferior gluteal n.","Left adductors; obturator n.","Right hamstrings; tibial n.","Left quadriceps; femoral n."],"e":"The gluteus medius and minimus stabilize the hip joint and abduct it."},{"l":5,"t":"Muscles of the gluteal region","q":"The piriformis and the other muscles deep to the gluteus maximus mainly perform:","c":"Lateral rotation of the hip","w":["Medial rotation of the hip","Hip flexion","Knee extension","Adduction"],"e":"They are the lateral rotators of the hip."},{"l":5,"t":"Muscles of the thigh","q":"Which statement about the iliopsoas is correct?","c":"Psoas major and iliacus share a common tendon on the lesser trochanter; they flex the hip and can move the trunk","w":["It attaches to the greater trochanter and abducts the hip","Its bellies lie in the posterior thigh","It extends the knee","It is innervated by the obturator n."],"e":"It belongs to the anterior compartment, but its muscle bellies lie in the abdomen and pelvis."},{"l":5,"t":"Muscles of the thigh","q":"What are the distal attachment, actions, and innervation of the sartorius?","c":"Proximal tibia; weak hip flexion, abduction, and lateral rotation plus knee flexion; femoral n.","w":["Tibial tuberosity; knee extension; femoral n.","Linea aspera; adduction; obturator n.","Ischial tuberosity; hip extension; tibial n.","Lesser trochanter; hip flexion; obturator n."],"e":"The sartorius is the longest muscle in the body and is superficial. Its actions are relatively weak and synergistic."},{"l":5,"t":"Muscles of the thigh","q":"After a femoral n. injury, a patient can't straighten the knee. Which muscle and attachment are involved?","c":"Quadriceps femoris; tibial tuberosity","w":["Hamstrings; ischial tuberosity","Sartorius; proximal tibia","Gastrocnemius; calcaneus","Adductor magnus; linea aspera"],"e":"The quadriceps femoris is the major knee extensor, and the patella forms within its tendon."},{"l":5,"t":"Muscles of the thigh","q":"Which describes the medial compartment of the thigh?","c":"Adductor longus, brevis, magnus, and gracilis; mostly attach to the linea aspera; adduct and flex the hip; mostly the obturator n.","w":["Hamstrings; knee flexion; tibial n.","Quadriceps; knee extension; femoral n.","Gluteals; hip extension; gluteal nn.","Iliopsoas; hip flexion; femoral n."],"e":"These are primarily adductor muscles."},{"l":5,"t":"Muscles of the thigh","q":"A hockey player feels sudden pain high in the inner thigh during a stride. A 'groin pull' involves:","c":"Strain or tearing of tendinous attachments of the adductor and flexor muscles in the anteromedial thigh","w":["A hamstring tear at the ischial tuberosity","A quadriceps tear at the tibial tuberosity","An ACL sprain","A gluteus medius tear"],"e":"The 'groin' is the anteromedial thigh."},{"l":5,"t":"Muscles of the thigh","q":"Which correctly describes the hamstrings?","c":"Biceps femoris (lateral), semitendinosus (medial, superficial), semimembranosus (medial, deep); ischial tuberosity; knee flexion and hip extension; mostly the tibial division of the sciatic n.","w":["Three quadriceps heads; tibial tuberosity; knee extension; femoral n.","Adductors; linea aspera; adduction; obturator n.","Gluteals; IT tract; hip extension; inferior gluteal n.","Biceps femoris (medial); knee extension; femoral n."],"e":"The hamstrings form the posterior compartment of the thigh."},{"l":5,"t":"Muscles of the thigh","q":"In the upper limb, 'radial n. = posterior.' Which nerve plays the posterior role in the lower limb (thigh and leg)?","c":"Tibial n.","w":["Femoral n.","Obturator n.","Common fibular n.","Superior gluteal n."],"e":"The tibial n. supplies the posterior thigh (via the sciatic), the posterior leg, and the plantar foot."},{"l":5,"t":"Muscles of the thigh","q":"A sprinter's hamstring tears at its origin. Which movements will be weak?","c":"Knee flexion and hip extension","w":["Knee extension and hip flexion","Hip adduction and flexion","Ankle plantarflexion","Hip abduction"],"e":"The hamstrings attach proximally to the ischial tuberosity."},{"l":5,"t":"Muscles of the leg & foot","q":"Which describes the anterior compartment of the leg?","c":"4 muscles (tibialis anterior most prominent); deep fibular n.; dorsiflexion, digit extension, inversion/eversion","w":["2 muscles; superficial fibular n.; eversion","Gastrocnemius and soleus; tibial n.; plantarflexion","Popliteus; tibial n.; knee flexion","Fibularis longus; eversion; tibial n."],"e":"The tibialis anterior is the most prominent muscle of the anterior compartment."},{"l":5,"t":"Muscles of the leg & foot","q":"A new runner who increased mileage fast has pain and edema along the distal two-thirds of the tibia. What is the mechanism?","c":"Shin splints: microtrauma of the tibialis anterior, possibly damaging the periosteum","w":["Achilles tendon rupture","High ankle sprain","Plantar fasciitis","Terrible triad"],"e":"Shin splints are microtrauma of the tibialis anterior. (A stress fracture is also possible in runners.)"},{"l":5,"t":"Muscles of the leg & foot","q":"A patient's toes drag because they can't dorsiflex the ankle. Which nerve is most likely injured?","c":"Deep fibular n.","w":["Superficial fibular n.","Tibial n.","Femoral n.","Obturator n."],"e":"The deep fibular n. supplies the anterior compartment of the leg."},{"l":5,"t":"Muscles of the leg & foot","q":"The lateral compartment of the leg:","c":"Fibularis longus and brevis; eversion plus plantarflexion; superficial fibular n.","w":["Tibialis anterior; dorsiflexion; deep fibular n.","Gastrocnemius; plantarflexion; tibial n.","Popliteus; knee flexion; tibial n.","Fibularis longus; inversion; deep fibular n."],"e":"The lateral compartment has 2 muscles."},{"l":5,"t":"Muscles of the leg & foot","q":"A lateral knee injury damages the superficial fibular n. Which action is most affected?","c":"Eversion of the foot","w":["Dorsiflexion","Toe extension","Inversion","Knee flexion"],"e":"The superficial fibular n. supplies the fibularis longus and brevis."},{"l":5,"t":"Muscles of the leg & foot","q":"The superficial posterior leg muscles attach to the calcaneus via the ___ and are innervated by the ___.","c":"Calcaneal (Achilles) tendon; tibial n.","w":["Patellar ligament; femoral n.","Plantar aponeurosis; plantar nn.","IT tract; inferior gluteal n.","Calcaneal tendon; deep fibular n."],"e":"These are the gastrocnemius (superficial, 2 heads) and the soleus (deep to it)."},{"l":5,"t":"Muscles of the leg & foot","q":"Which superficial posterior leg muscle also flexes the knee?","c":"Gastrocnemius","w":["Soleus","Tibialis anterior","Fibularis longus","Sartorius"],"e":"Both plantarflex the ankle, but only the gastrocnemius flexes the knee."},{"l":5,"t":"Muscles of the leg & foot","q":"The deep posterior compartment of the leg performs all EXCEPT:","c":"Dorsiflexion of the ankle","w":["Flexion of the digits","Plantarflexion","Inversion","Knee flexion (popliteus)"],"e":"Dorsiflexion belongs to the anterior compartment. The deep posterior compartment is innervated by the tibial n."},{"l":5,"t":"Muscles of the leg & foot","q":"The dorsal muscles of the foot:","c":"Are only 2; extend the digits; deep fibular n.","w":["Are 4 layers; flex the digits; plantar nn.","Evert the foot; superficial fibular n.","Plantarflex; tibial n.","Abduct the digits; tibial n."],"e":"The dorsal foot has only 2 muscles, innervated by the deep fibular n."},{"l":5,"t":"Muscles of the leg & foot","q":"A runner has sharp heel pain with the first steps each morning. Which structure is involved, and what are its roles?","c":"Plantar aponeurosis; protects the sole and supports the medial longitudinal arch","w":["Calcaneal tendon; plantarflexion","Deltoid ligament; stabilizes eversion","ATFL; stabilizes inversion","Patellar ligament; anterior knee support"],"e":"This is plantar fasciitis. The plantar aponeurosis is the central part of the plantar fascia, running from the calcaneus to the digital sheaths."},{"l":5,"t":"Muscles of the leg & foot","q":"Which describes the plantar muscles of the foot?","c":"3–4 layers; flex digits, abduct/adduct digits, with lumbricals and interossei extending the IP joints; medial and lateral plantar nn. (from the tibial n.)","w":["2 muscles; extend digits; deep fibular n.","Evert the foot; superficial fibular n.","One layer; plantarflex; femoral n.","Invert the foot; obturator n."],"e":"The plantar nerves are branches of the tibial n."},{"l":5,"t":"Muscles of the leg & foot","q":"A complete tibial n. injury in the leg would spare which action?","c":"Dorsiflexion of the ankle","w":["Plantarflexion","Toe flexion","Inversion (deep posterior)","Plantar foot muscle actions"],"e":"Dorsiflexion is performed by the anterior compartment, supplied by the deep fibular n."}];
const BLANKS=[{"l":1,"t":"Components of skeletal system","s":"In a tackle, the tibia is pushed forward while the femur is held back. The knee's bones must resist [[shear|shearing]] stress.","e":"Shear stress: forces pushing in opposite directions."},{"l":1,"t":"Components of skeletal system","s":"Vessel carrying blood from bone tissue back toward the heart: [[vein|veins]]","e":"Arteries carry blood away from the heart to tissues. Veins return it. Nerves are bundles of axons outside the CNS."},{"l":1,"t":"Bone cells","s":"A mesenchyme-derived cell divides, then begins secreting collagen and initiating calcification. At this stage it is a(n) [[osteoblast]].","e":"Lineage: mesenchyme → osteogenic cell (divides) → osteoblast (builds) → osteocyte (trapped in matrix)."},{"l":1,"t":"Bone cells","s":"In osteoporosis, the [[osteoclasts|osteoclast]] outpace the bone-building cells.","e":"Resorption exceeds deposition."},{"l":1,"t":"Extracellular matrix","s":"Bone appears white on an X-ray mainly because of the crystallized mineral [[hydroxyapatite|calcium salts|calcium mineral salts|calcium]].","e":"Hydroxyapatite: calcium salts deposited in the collagen framework that crystallize and harden."},{"l":1,"t":"Organization of bone","s":"The bone type filling vertebral bodies, epiphyses, and flat bones. Give an alternate name, not \"spongy\": [[trabecular|cancellous]]","e":"Spongy bone is also called trabecular or cancellous bone."},{"l":1,"t":"Organization of bone","s":"A fracture tears the fibers anchoring the periosteum to the outer lamellae. These are called [[perforating|sharpey|sharpeys|sharpey's]] fibers.","e":"Perforating (Sharpey's) fibers."},{"l":1,"t":"Parts of a long bone","s":"A single layer of cells with some CT lines the bony canals and the surfaces of spongy bone. It is the [[endosteum]].","e":"Endosteum."},{"l":1,"t":"Parts of a long bone","s":"Long bone region whose name means \"growing between\": [[diaphysis]]","e":"Diaphysis, also called the shaft or body."},{"l":1,"t":"Formation & growth","s":"An infant's fontanels are replaced by bone through [[intramembranous]] ossification.","e":"Fontanels are dense CT that is ossified directly."},{"l":1,"t":"Formation & growth","s":"Embryonic CT from which most mature CT, including the early skeleton, develops: [[mesenchyme]]","e":"Both ossification methods replace pre-existing CT derived from mesenchyme."},{"l":1,"t":"Formation & growth","s":"Process by which bone forms: [[ossification|osteogenesis]]","e":"Ossification occurs during initial formation, growth, remodeling, and fracture repair."},{"l":1,"t":"Formation & growth","s":"A genetic defect limits cartilage cell proliferation at the growth plate, producing short limbs. The impaired growth type is [[interstitial]].","e":"Interstitial growth is endogenous growth within the cartilage and is what lengthens bone."},{"l":1,"t":"Remodeling & factors","s":"A patient with chronic kidney disease has poor intestinal calcium absorption because the kidneys cannot make [[calcitriol]].","e":"PTH stimulates the kidneys to make calcitriol, the active form of vitamin D."},{"l":1,"t":"Remodeling & factors","s":"Hormone from the thyroid that inhibits osteoclasts: [[calcitonin]]","e":"Calcitonin lowers blood calcium and promotes bone formation."},{"l":1,"t":"Aging & osteoporosis","s":"A bisphosphonate treats osteoporosis by reducing the activity of [[osteoclasts|osteoclast]].","e":"Bisphosphonates are antiresorptive."},{"l":1,"t":"Aging & osteoporosis","s":"With age, slowed [[collagen]] production makes bones brittle.","e":"Less collagen means less flexibility and tensile strength."},{"l":1,"t":"Fractures","s":"An 8-year-old's radius cracks on one side and bends on the other. Fracture type: [[greenstick]]","e":"Greenstick fractures are partial and specific to juveniles, whose bone isn't fully calcified."},{"l":1,"t":"Fractures","s":"A cast placed after a fracture is set serves the treatment goal of [[immobilization|immobilisation]].","e":"The goals are realignment, immobilization to maintain alignment, and restoration of function."},{"l":1,"t":"Fractures","s":"First step of fracture repair: formation of a fracture [[hematoma]].","e":"Hematoma → fibrocartilaginous callus → bony callus → remodeling."},{"l":1,"t":"Divisions & features","s":"A rounded articular projection supported on a constricted neck: [[head]]","e":"Head, as in the head of the femur."},{"l":1,"t":"Divisions & features","s":"Furrow in a bone: [[sulcus]]","e":"Sulcus. A fissure is a narrow slit between neighboring bones."},{"l":2,"t":"Joint basics & classification","s":"An ankle sprain tears dense CT that connects the fibula to the talus. Structure type: [[ligament|ligaments]]","e":"Ligaments are dense CT connecting bone to bone. They stabilize the joint and limit range of motion."},{"l":2,"t":"Joint basics & classification","s":"Skull sutures in advanced age can ossify into a [[synostosis]].","e":"A synostosis is a bony, immobile joint, like the fused frontal bones or the epiphysis and diaphysis after the plate closes."},{"l":2,"t":"Fibrous joints","s":"Joint type of the distal tibiofibular joint: [[syndesmosis|fibrous syndesmosis]]","e":"Syndesmosis: bound by relatively long collagen fibers."},{"l":2,"t":"Fibrous joints","s":"Fibrous joints between skull bones: [[sutures|suture]]","e":"Sutures, held together by sutural ligaments."},{"l":2,"t":"Cartilaginous joints","s":"Cartilaginous joint type of the pubic symphysis: [[symphysis]]","e":"Symphysis."},{"l":2,"t":"Cartilaginous joints","s":"Cartilage type forming the disc in a symphysis: [[fibrocartilage|fibrous cartilage]]","e":"Fibrocartilage disc; the bone ends are covered with hyaline cartilage."},{"l":2,"t":"Synovial joint structure","s":"Main molecule (besides filtered interstitial fluid) in synovial fluid: [[hyaluronic acid|hyaluronan|hyaluronic]]","e":"Synovial fluid is slippery and clear to pale yellow. It supplies O2 and nutrients to the articular cartilage and contains phagocytic cells."},{"l":2,"t":"Accessory structures","s":"Lubricated sac located OUTSIDE the joint cavity where friction is high: [[bursa|bursae]]","e":"Bursae reduce friction. Tendon sheaths are tube-like bursae around long tendons."},{"l":2,"t":"Movements & types","s":"Flexion → abduction → extension → adduction in sequence: [[circumduction]]","e":"Circumduction is a complex angular movement, and it can run in either order."},{"l":2,"t":"Movements & types","s":"Synovial joint type at the base of the thumb (1st CMC): [[saddle]]","e":"Saddle: one saddle-shaped surface, biaxial."},{"l":2,"t":"Movements & types","s":"Synovial joint type of the acromioclavicular joint: [[plane|gliding]]","e":"Plane joints have flat or slightly curved surfaces and allow gliding, possibly with some rotation. The intercarpal and intertarsal joints are other examples."},{"l":2,"t":"Movements & types","s":"Movement toward the midline in the frontal plane: [[adduction]]","e":"Adduction. Abduction is movement away from the midline."},{"l":2,"t":"Arthritis","s":"Joint most commonly affected by gouty arthritis: [[1st mtp|first mtp|big toe|1st metatarsophalangeal|first metatarsophalangeal|mtp of big toe|mp joint of 1st digit of foot|1st mp of foot]]","e":"The MP joint of the 1st digit of the foot (the big toe)."},{"l":2,"t":"Arthritis","s":"Any painful disorder of the body's supporting structures: [[rheumatism]]","e":"Arthritis is a type of rheumatism that affects joints."},{"l":2,"t":"Muscle properties, functions, types","s":"Muscle property: a local electrical change triggers a wave of excitation along the fiber: [[conductivity]]","e":"Conductivity."},{"l":2,"t":"Muscle properties, functions, types","s":"Muscle's main role in glycemic control is that skeletal muscle absorbs, stores, and uses [[glucose]].","e":"By taking up glucose, skeletal muscle can help stabilize blood glucose concentrations."},{"l":2,"t":"CT of muscle","s":"CT layer surrounding a fascicle: [[perimysium]]","e":"Perimysium."},{"l":2,"t":"CT of muscle","s":"Flattened, broad sheet of tendon: [[aponeurosis]]","e":"Aponeurosis."},{"l":2,"t":"CT of muscle","s":"The endomysium, perimysium, and epimysium are all [[continuous]] with each other and with the tendon.","e":"The CT is continuous, and it is the CT that actually attaches the muscle to bone."},{"l":2,"t":"Myofibers","s":"Plasma membrane of a muscle fiber: [[sarcolemma]]","e":"Sarcolemma. T tubules are infoldings of it that penetrate the cell."},{"l":2,"t":"Myofibers","s":"One T tubule plus two terminal cisternae: [[triad]]","e":"Triad."},{"l":2,"t":"Myofibers","s":"Huge springy elastic protein in the sarcomere: [[titin]]","e":"Titin."},{"l":2,"t":"Myofibers","s":"Functional contractile unit, from one Z disc to the next: [[sarcomere]]","e":"Sarcomere. The Z disc bisects the I band and provides anchorage."},{"l":2,"t":"Myofibers","s":"Small mesodermal cells that fuse to form a muscle fiber: [[myoblasts|myoblast]]","e":"More than 100 myoblasts fuse, which is why the fiber is multinucleate."},{"l":2,"t":"Myofibers","s":"Enlargement of existing muscle fibers: [[hypertrophy]]","e":"Hypertrophy increases myofibrils and organelles and results from forceful, repetitive activity."},{"l":2,"t":"Myofibers","s":"Cytoplasm of a muscle fiber: [[sarcoplasm]]","e":"The sarcoplasm is filled with numerous organelles."},{"l":2,"t":"Contraction & functional groups","s":"Isotonic contraction in which the muscle shortens: [[concentric]]","e":"Concentric."},{"l":2,"t":"Contraction & functional groups","s":"Muscle producing the most force during a given joint action: [[prime mover|agonist]]","e":"Prime mover."},{"l":3,"t":"Neurocranium","s":"Three components of the skull: [[cranium|neurocranium]], [[facial skeleton|viscerocranium]], [[mandible]].","e":"Cranium, facial skeleton, and mandible."},{"l":3,"t":"Neurocranium","s":"Temporal bone passageway that lets sound reach the tympanic membrane: [[external acoustic meatus|external acoustic opening|external auditory meatus]]","e":"External acoustic meatus. Meatus means passageway."},{"l":3,"t":"Neurocranium","s":"Ossicles from the tympanic membrane inward: [[malleus]], [[incus]], [[stapes]].","e":"The malleus attaches to the tympanic membrane, and the stapes sits in the oval window."},{"l":3,"t":"Neurocranium","s":"Opening transmitting CN VII and CN VIII: [[internal acoustic meatus|internal acoustic opening|internal auditory meatus]]","e":"Internal acoustic meatus, in the posterior cranial fossa."},{"l":3,"t":"Viscerocranium","s":"Paranasal sinuses drain into the [[lateral]] nasal wall.","e":"Inflammation of the lining of one or more sinuses is sinusitis."},{"l":3,"t":"Viscerocranium","s":"Adult dental formula per quadrant (I:C:P:M): [[2:1:2:3|2 1 2 3|2123]]","e":"2:1:2:3, for 32 permanent teeth. Deciduous teeth follow 2:1:2, for 20."},{"l":3,"t":"Viscerocranium","s":"Number of deciduous teeth: [[20|twenty]]","e":"20 deciduous vs. 32 permanent."},{"l":3,"t":"Joints of the head","s":"Suture uniting the parietal and temporal bones: [[squamous]]","e":"The squamous suture is paired."},{"l":3,"t":"Joints of the head","s":"Suture uniting both parietals with the occipital: [[lambdoid]]","e":"Lambdoid."},{"l":3,"t":"Joints of the head","s":"TMJ classification: modified [[hinge]] joint.","e":"Modified hinge."},{"l":3,"t":"Muscles of the head","s":"Nerve to the muscles of facial expression: [[facial|cn vii|cn 7|vii]]","e":"Facial n. (CN VII)."},{"l":3,"t":"Muscles of the head","s":"Medial rotation of the eyeball: [[intorsion]]","e":"Intorsion. Lateral rotation is extorsion."},{"l":3,"t":"Muscles of the head","s":"Nerve innervating most tongue muscles: [[hypoglossal|cn xii|cn 12|xii]]","e":"Hypoglossal n. (CN XII)."},{"l":3,"t":"Bones & joints of neck & back","s":"Joints formed by the articular processes: [[facet]] joints","e":"Each of the 4 articular processes bears a facet."},{"l":3,"t":"Bones & joints of neck & back","s":"C2 process forming a pivot joint with C1: [[dens|odontoid process|odontoid]]","e":"The dens (odontoid process) of the axis."},{"l":3,"t":"Bones & joints of neck & back","s":"Number of cervical, thoracic, lumbar vertebrae: [[7|seven]], [[12|twelve]], [[5|five]]","e":"The sacrum is 5 fused vertebrae and the coccyx is 4."},{"l":3,"t":"Bones & joints of neck & back","s":"Outer fibrocartilaginous ring of the IV disc: anulus [[fibrosus]]","e":"The anulus fibrosus surrounds the nucleus pulposus."},{"l":3,"t":"Muscles of neck & back","s":"Erector spinae columns, lateral to medial: [[iliocostalis]], [[longissimus]], [[spinalis]]","e":"Mnemonic: I Love Spine."},{"l":4,"t":"Bones of the thorax","s":"Sternum, superior to inferior: [[manubrium]], [[body]], [[xiphoid process|xiphoid]].","e":"Manubrium, body, xiphoid process."},{"l":4,"t":"Bones of the thorax","s":"Rib at the level of the sternal angle: [[2|second|2nd|rib 2]]","e":"The sternal angle is the manubrium–body junction, at the level of rib 2."},{"l":4,"t":"Bones of the thorax","s":"Palpable superior midline depression of the manubrium: [[jugular notch|suprasternal notch|jugular|suprasternal]]","e":"Jugular (suprasternal) notch. The aortic arch and trachea lie deep to it."},{"l":4,"t":"Bones of the thorax","s":"Ribs 8–10: [[false]] ribs.","e":"True (1–7) attach directly via costal cartilage. False (8–10) connect indirectly and form the costal margin. Floating (11–12) don't reach the sternum."},{"l":4,"t":"Muscles of the thorax","s":"Elevate the ribs during inhalation: [[external intercostal|external intercostals|external intercostal muscles]]","e":"External intercostals (11 pairs). Internal intercostals draw ribs together in forced exhalation."},{"l":4,"t":"Muscles of the thorax","s":"Diaphragm innervation: [[phrenic]] nerve, spinal levels [[c3-c5|c3 c5|c3 4 5|c3 c4 c5|c345|c3 to c5|3 4 5|c3-5|c3 5]].","e":"\"C3, 4, & 5 keep the diaphragm alive.\" Phrenic n."},{"l":4,"t":"Muscles of the thorax","s":"Diaphragm opening for the IVC: [[caval opening|caval|caval foramen]]","e":"Caval opening: IVC. Esophageal hiatus: esophagus + vagus nn. Aortic hiatus: descending aorta + thoracic duct."},{"l":4,"t":"Muscles of the abdomen","s":"Anterolateral abdominal wall, superficial to deep: [[external oblique]], [[internal oblique]], [[transversus abdominis|transverse abdominis]].","e":"All three support/compress the viscera and flex and laterally flex the trunk."},{"l":4,"t":"Muscles of the abdomen","s":"Midline raphe where the aponeuroses of both sides interweave: [[linea alba]]","e":"Linea alba separates the two rectus abdominis muscles."},{"l":4,"t":"Pectoral girdle","s":"Bones of the pectoral girdle: [[clavicle]] and [[scapula]].","e":"They attach the axial skeleton to the free upper limb, held in place by axio-appendicular muscles."},{"l":4,"t":"Pectoral girdle","s":"Joint formed by the medial end of the clavicle: [[sternoclavicular|sc joint|sc]]","e":"Sternal (medial) end is rounded → sternoclavicular. Acromial (lateral) end is flattened → AC joint."},{"l":4,"t":"Pectoral girdle","s":"Scapular process projecting anterolaterally; anchors pectoralis minor and the short head of biceps: [[coracoid process|coracoid]]","e":"Coracoid process."},{"l":4,"t":"Pectoral girdle","s":"Shallow scapular socket for the humeral head: [[glenoid fossa|glenoid cavity|glenoid]]","e":"Glenoid fossa (cavity) → glenohumeral joint."},{"l":4,"t":"Arm & forearm bones","s":"Fracture site on the humerus that endangers the axillary n.: [[surgical neck]]","e":"Surgical neck: constriction distal to the tubercles. The anatomical neck is just distal to the head."},{"l":4,"t":"Arm & forearm bones","s":"Groove traversed by the long head of biceps brachii: [[intertubercular sulcus|bicipital groove|intertubercular groove|intertubercular]]","e":"Intertubercular sulcus (bicipital groove), between the greater and lesser tubercles."},{"l":4,"t":"Arm & forearm bones","s":"Nerve running behind the medial epicondyle (\"funny bone\"): [[ulnar]]","e":"Medial epicondyle: forearm flexor origin. Lateral epicondyle: extensor origin."},{"l":4,"t":"Arm & forearm bones","s":"Humeral condyle that articulates with the radial head: [[capitulum]]","e":"Capitulum (lateral) ↔ radial head. Trochlea (medial) ↔ trochlear notch of ulna."},{"l":4,"t":"Arm & forearm bones","s":"Ulnar landmark where brachialis inserts: [[coronoid process|coronoid]]","e":"Coronoid process: anterior projection at the end of the trochlear notch."},{"l":4,"t":"Arm & forearm bones","s":"Distal attachment of biceps brachii: [[radial tuberosity]]","e":"Radial tuberosity: medial projection just distal to the radial head."},{"l":4,"t":"Arm & forearm bones","s":"Distal radius fracture from forced wrist extension (FOOSH), common with osteoporosis: [[colles|colles'|colles's]] fracture","e":"Colles fracture."},{"l":4,"t":"Wrist & hand bones","s":"Most frequently fractured carpal: [[scaphoid]]","e":"Often from a FOOSH, often missed on early X-ray, and at risk of avascular necrosis."},{"l":4,"t":"Wrist & hand bones","s":"Nerve compressed in carpal tunnel syndrome: [[median]]","e":"Causes tingling, lost sensation, and progressive weakness of thumb muscles."},{"l":4,"t":"Wrist & hand bones","s":"Roof of the carpal tunnel: [[flexor retinaculum|transverse carpal ligament]]","e":"Floor: carpal bones. Roof: flexor retinaculum / transverse carpal ligament. Contents: long flexor tendons + sheaths, median n."},{"l":4,"t":"Wrist & hand bones","s":"Total phalanges in one hand: [[14|fourteen]]","e":"5 proximal + 4 intermediate + 5 distal. The thumb has no intermediate phalanx."},{"l":4,"t":"Joints of the shoulder","s":"AC joint type: [[plane|gliding]]","e":"Plane synovial joint; gliding movements of the scapula."},{"l":4,"t":"Joints of the shoulder","s":"Clinical name for AC joint dislocation: [[shoulder separation|separated shoulder|separation]]","e":"Degree depends on which ligaments are disrupted. Mechanism: direct blow or FOOSH."},{"l":4,"t":"Joints of the shoulder","s":"Most common clinical description of a shoulder dislocation: [[anterior]]","e":"Most occur inferiorly but are described clinically as anterior (most common) or posterior."},{"l":4,"t":"Elbow & wrist joints","s":"Humero-ulnar joint type: [[hinge]]","e":"Hinge synovial: flexion/extension. Radial and ulnar collateral ligaments are capsule thickenings."},{"l":4,"t":"Elbow & wrist joints","s":"Proximal radio-ulnar joint type: [[pivot]]; its movements: [[pronation]] and [[supination]].","e":"Pivot: radial head in the radial notch."},{"l":4,"t":"Elbow & wrist joints","s":"Ligament encircling the radial head: [[anular ligament|annular ligament|anular|annular]]","e":"Anular ligament forms a collar around the radial head."},{"l":4,"t":"Elbow & wrist joints","s":"Radiocarpal joint type: [[condyloid|ellipsoid|condylar]]","e":"Condyloid: flexion/extension, abduction (radial deviation)/adduction (ulnar deviation), circumduction."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Heads of pectoralis major: [[clavicular]] and [[sternocostal]].","e":"Actions: adducts, medially rotates, flexes/extends the shoulder."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Nerve injured in a \"winged scapula\": [[long thoracic]]","e":"Long thoracic n. → serratus anterior weakness or paralysis."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Trapezius innervation: [[accessory|spinal accessory|cn xi|cn 11|xi]]","e":"Accessory n. (CN XI). Proximal: external occipital protuberance and midline. Distal: clavicle, acromion, spine of scapula."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Deltoid innervation: [[axillary]]","e":"Three parts: clavicular, acromial, spinal. Actions: abduction, flexion/extension, medial/lateral rotation."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Rotator cuff muscle that initiates abduction: [[supraspinatus]]","e":"Its tendon is also the most commonly injured."},{"l":4,"t":"Axio-appendicular & shoulder muscles","s":"Only rotator cuff muscle on the lesser tubercle: [[subscapularis]]","e":"Subscapularis: anterior, medial rotation."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Nerve of the anterior compartment of the arm: [[musculocutaneous]]","e":"Musculocutaneous n.: biceps brachii and brachialis (elbow flexion, supination)."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Nerve of the posterior compartments of the arm and forearm: [[radial]]","e":"Radial n.: triceps, forearm extensors, brachioradialis."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Usual prime mover of elbow flexion: [[brachialis]]","e":"Deep to biceps; humerus to coronoid process of the ulna."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Distal attachment of triceps brachii: [[olecranon|olecranon process]]","e":"Three heads: long, medial, lateral. Extends the forearm."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Flexor carpi ulnaris innervation: [[ulnar]]","e":"FCU: flexes and adducts (ulnar deviation) the wrist. FCR: flexes and abducts."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Elbow flexor that belongs to the posterior compartment: [[brachioradialis]]","e":"Brachioradialis: radial n., flexion of the forearm."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Proximal attachment of the forearm extensors: [[lateral epicondyle]]","e":"Via the common extensor tendon."},{"l":4,"t":"Arm, forearm & hand muscles","s":"Thenar compartment innervation: [[median]]. Hypothenar: [[ulnar]].","e":"Thenar: digit 1. Hypothenar: digit 5. Both are intrinsic hand muscles, mostly on the palmar side."},{"l":5,"t":"Bones & joints of the pelvis","s":"The pelvic brim runs from the sacral [[promontory]] to the superior part of the pubic symphysis.","e":"The pelvic brim is the bony edge surrounding and defining the pelvic inlet."},{"l":5,"t":"Bones & joints of the pelvis","s":"Pelvis superior to the pelvic brim that holds abdominal viscera: [[false|greater]] pelvis","e":"The false (greater) pelvis."},{"l":5,"t":"Bones & joints of the pelvis","s":"Sacral openings where the ventral and dorsal rami exit: [[sacral foramina|foramina|anterior and posterior sacral foramina]]","e":"The sacral foramina, anterior and posterior."},{"l":5,"t":"Bones & joints of the pelvis","s":"Articulating surfaces of the SI joint: [[auricular]] surfaces of the hip bone and sacrum","e":"Auricular surfaces."},{"l":5,"t":"Muscles of the pelvis","s":"Largest portion of the pelvic diaphragm: [[levator ani]]","e":"The levator ani can be divided into additional parts."},{"l":5,"t":"Bones of the lower limb","s":"Vertical ridge on the posterior femur where the adductors attach: [[linea aspera]]","e":"Linea aspera."},{"l":5,"t":"Bones of the lower limb","s":"Proximal end of the fibula: [[head]]","e":"The head of the fibula."},{"l":5,"t":"Bones of the lower limb","s":"Number of tarsal bones per limb: [[7|seven]]","e":"Seven, much larger than the carpals."},{"l":5,"t":"Joints of the hip & knee","s":"Three hip joint ligaments: iliofemoral, [[pubofemoral|ischiofemoral]], [[ischiofemoral|pubofemoral]]","e":"Iliofemoral, pubofemoral, ischiofemoral."},{"l":5,"t":"Joints of the hip & knee","s":"Knee rotation that 'locks' the knee: [[medial]] rotation","e":"Medial rotation locks the knee. Lateral rotation unlocks it."},{"l":5,"t":"Joints of the ankle region","s":"Most commonly injured ankle ligament: [[atfl|anterior talofibular|anterior talofibular ligament]]","e":"The anterior talofibular ligament (ATFL)."},{"l":5,"t":"Muscles of the gluteal region","s":"Nerve to the gluteus medius and minimus: [[superior gluteal]]","e":"Superior gluteal n."},{"l":5,"t":"Muscles of the thigh","s":"Quadriceps heads: rectus femoris, vastus [[lateralis|intermedius|medialis]], vastus [[intermedius|lateralis|medialis]], vastus [[medialis|lateralis|intermedius]]","e":"Rectus femoris plus the vastus lateralis, intermedius, and medialis."},{"l":5,"t":"Muscles of the thigh","s":"Nerve of the medial thigh compartment: [[obturator]]","e":"Obturator n. (mostly)."},{"l":5,"t":"Muscles of the thigh","s":"Nerve of the anterior thig function startMCQ(pool,fresh){
  if(!pool&&!fresh){const s=getSess('mcq');
    if(s&&s.list&&s.list.length){const list=s.list.map(([k,o])=>{const q=QBY().get(k);if(!q)return null;const cur=[...(Array.isArray(q.c)?q.c:[q.c]),...q.w];const same=Array.isArray(o)&&o.length===cur.length&&cur.every(x=>o.includes(x));return {...q,multi:Array.isArray(q.c),opts:same?o:shuffle(cur),stale:!same}}).filter(Boolean);
      if(list.length){mq={list,i:Math.min(s.i,list.length),right:s.right,answered:s.answered,missed:s.missed.map(k=>QBY().get(k)).filter(Boolean),ans:s.ans||(s.chosen!=null?{[s.i]:s.chosen}:{}),cross:s.cross||{}};list.forEach((q,j)=>{if(q.stale){delete mq.ans[j];delete mq.cross[j]}});renderMCQ(true);return}}}
  const src=pool||QUESTIONS.filter(q=>(!st.lec||q.l===st.lec)&&(!st.flagOnly||flags.has(qKey(q)))&&styleOk(q,st.style));
  if(!src.length&&st.flagOnly){emptyFlagged('questions');return}

function submitMulti(replay){
  const q=mq.list[mq.i], btns=[...view.querySelectorAll('.opt')];
  const selIdx=btns.filter(b=>b.classList.contains('sel')).map(b=>+b.dataset.k);
  const chosen=new Set(selIdx.map(k=>q.opts[k]));
  const ok=q.c.length===chosen.size&&q.c.every(x=>chosen.has(x));
  if(!replay){mq.answered++; if(ok)mq.right++; else {mq.missed.push(q);missed.add(qKey(q));saveMissed();} mq.ans[mq.i]=selIdx; saveMCQ();}
  btns.forEach(b=>{const o=q.opts[+b.dataset.k], isC=q.c.includes(o), sel=chosen.has(o);b.disabled=true;b.classList.remove('sel');
    if(isC&&sel)b.classList.add('right');
    else if(isC){b.classList.add('missedopt');b.insertAdjacentHTML('beforeend','<span class="lab">Missed</span>')}
    else if(sel){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="lab">Wrong</span>')}
    else b.classList.add('dim');});
  const nMiss=q.c.filter(x=>!chosen.has(x)).length, nWrong=[...chosen].filter(x=>!q.c.includes(x)).length;
  $('#ex').innerHTML=`<div class="explain ${ok?'ok':'no'}"><b>${ok?'Correct, all '+q.c.length+' found':'Not quite: '+[nMiss?nMiss+' missed':'',nWrong?nWrong+' wrong pick'+(nWrong>1?'s':''):''].filter(Boolean).join(', ')}</b>${esc(q.e)}${saidNote(q)}</div>`;
  $('#skip').hidden=true;$('#submit').hidden=true;const nx=$('#next');nx.hidden=false;nx.focus({preventScroll:true});
  document.querySelector('.score').innerHTML=`Score <b>${mq.right}</b> / ${mq.answered}`;
}
function pick(k,replay){
  const q=mq.list[mq.i], chosen=q.opts[k], ok=chosen===q.c;
  if(!replay){mq.answered++; if(ok)mq.right++; else {mq.missed.push(q);missed.add(qKey(q));saveMissed();} mq.ans[mq.i]=k; saveMCQ();}
  view.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;const o=q.opts[j];
    if(o===q.c)b.classList.add('right');else if(j===k)b.classList.add('wrong');else b.classList.add('dim');});
  $('#ex').innerHTML=`<div class="explain ${ok?'ok':'no'}"><b>${ok?'Correct':'Not quite. Answer: '+esc(q.c)}</b>${esc(q.e)}${saidNote(q)}</div>`;
  $('#skip').hidden=true; const nx=$('#next'); nx.hidden=false; nx.focus({preventScroll:true});
  document.querySelector('.score').innerHTML=`Score <b>${mq.right}</b> / ${mq.answered}`;
}

/* ---------- identification ---------- */
const STOP=new Set(['the','of','n','nn','nerve','nerves','a','artery','an','cn']);
const ROMAN={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12};
function norm(s){
  return s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w))
    .map(w=>ROMAN[w]?String(ROMAN[w]):w).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const OPP=[['afferent','efferent'],['medial','lateral'],['anterior','posterior'],['superior','inferior'],['dorsal','ventral'],['flexor','extensor'],['ipsilateral','contralateral'],['left','right'],['presynaptic','postsynaptic'],['sensory','motor'],['cranial','caudal'],['internal','external'],['internum','externum'],['epineurium','perineurium','endoneurium'],['gyri','gyru','sulci','sulcu'],['proximal','distal'],['maxillary','mandibular'],['monosynaptic','polysynaptic'],['cervical','sacral'],['periosteal','meningeal'],['gracili','cuneatu']];
function opposite(a,b){const A=a.split(' '),B=b.split(' ');for(let i=0;i<Math.min(A.length,B.length);i++){if(A[i]===B[i])continue;if(OPP.some(g=>g.includes(A[i])&&g.includes(B[i])))return true;
  if(OPP.some(g=>g.some(w=>A[i].startsWith(w.slice(0,5)))&&g.some(w=>B[i].startsWith(w.slice(0,5)))&&A[i].slice(0,3)!==B[i].slice(0,3)))return true}return false}
function grade(input,ans,others){
  const base=ans.a, opts=[base, base.replace(/\s*\(.*?\)\s*/g,' '), ...((base.match(/\((.*?)\)/)||[])[1]?[base.match(/\((.*?)\)/)[1]]:[]), ...ans.alt];
  const v=norm(input);
  if(!v){if(!input.trim())return 'empty';const raw=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim();return opts.map(raw).includes(raw(input))?'ok':'no'}
  const N=opts.map(norm).filter(Boolean);
  if(N.includes(v))return 'ok';
  if(others.some(o=>[o.a,o.a.replace(/\s*\(.*?\)\s*/g,' '),...o.alt].map(norm).includes(v)))return 'no';
  for(const t of N){const d=lev(v,t);if(d<=(t.length>7?2:t.length>4?1:0)&&!opposite(v,t))return 'near';}
  return 'no';
}

  if(!fresh){const s=getSess('fb');
    if(s&&s.list){const list=s.list.map(k=>BLBY.get(k)).filter(Boolean);
      if(list.length){fbx={list,i:Math.min(s.i,list.length),stats:s.stats||{},inputs:s.inputs||{},ovr:s.ovr||{},checked:s.checked,revealed:s.revealed};renderFB(true);return}}}
  const src=BL.filter(b=>(!st.lec||b.l===st.lec)&&(!st.flagOnly||flags.has(b.key)));
  if(!src.length&&st.flagOnly){emptyFlagged('sentences');return}
  fbx={list:shuffle(src),i:0,stats:{},inputs:{}};renderFB();
}
function renderFB(replay){
  const n=fbx.list.length;
  if(!replay){fbx.inputs={};fbx.ovr={};fbx.checked=false;fbx.revealed=false}
  saveFB();
  if(fbx.i>=n){
    let r=0,tt=0;Object.values(fbx.stats).forEach(s=>{r+=s.r;tt+=s.t});
    const retry=fbx.list.filter((x,i)=>!fbx.stats[i]||fbx.stats[i].r<fbx.stats[i].t);
    view.innerHTML=`<div class="meta"><span>All sentences done</span><span class="score"><b>${r}</b> / ${tt} blanks</span></div><div class="progress"><i style="width:100%"></i></div>
    <div class="card done"><h2>${r} of ${tt} blanks correct</h2><p>${retry.length?retry.length+' sentence'+(retry.length>1?'s':'')+' to retry (any wrong blank, or skipped). Blanks you marked correct don\'t count as misses.':'Every sentence correct.'} Missed sentences are also in your flashcards.</p><div class="nav" style="justify-content:center">${retry.length?'<button class="btn primary" id="retry">Retry missed ('+retry.length+')</button>':''}<button class="btn${retry.length?'':' primary'}" id="again">Shuffle again</button>${!st.flagOnly&&flagCount()?'<button class="btn" id="revflag">Review flagged ('+flagCount()+')</button>':''}</div></div>`;
    $('#again').onclick=()=>startFB(true);
    if($('#retry'))$('#retry').onclick=()=>{fbx={list:shuffle(retry),i:0,stats:{},inputs:{},ovr:{}};renderFB();window.scrollTo({top:0})};if($('#revflag'))$('#revflag').onclick=()=>{st.flagOnly=true;sync()};return;
  }
  const b=fbx.list[fbx.i];
  const html=b.segs.map(sg=>sg.text!=null?esc(sg.text):(()=>{const a=b.answers[sg.blank-1];const w=Math.max(6,Math.min(22,a.a.length+2));
    return `<span class="bl"><input id="f${a.n}" aria-label="Blank ${a.n}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"><span class="fb" id="ff${a.n}"></span></span>`})()).join('');
  view.innerHTML=`<div class="meta"><span>Sentence ${fbx.i+1} of ${n} · ${restartBtn}</span><span>${b.answers.length} blank${b.answers.length>1?'s':''}</span></div>
  <div class="progress"><i style="width:${fbx.i/n*100}%"></i></div>
  <div class="card"><div class="cardhead"><span class="tag">${LECT[b.l]} · ${esc(b.t)} ${saidBadge(b)}</span>${flagBtn(b.key)}</div>
  <div class="fb-s">${html}</div><div id="fbsaid" hidden>${b.e?'<div class="explain">'+esc(b.e)+'</div>':''}${saidNote(b)}</div>
  <div class="nav"><button class="btn primary" id="chk">Check</button><button class="btn" id="rev">Show answers</button><span class="spacer"></span><button class="btn" id="prev" ${fbx.i?'':'disabled'}>Back</button><button class="btn" id="nxt">Next</button></div></div>`;
  wireFlag(); $('#restart').onclick=()=>startFB(true);
  const ins=b.answers.map(a=>$('#f'+a.n));
  b.answers.forEach((a,k)=>{const el=ins[k];if(fbx.inputs[a.n])el.value=fbx.inputs[a.n];el.addEventListener('input',()=>{fbx.inputs[a.n]=el.value;saveFB()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $('#chk').click()}})});
  $('#chk').onclick=()=>{let r=0;const first=!fbx.stats[fbx.i];let anyMiss=false;
    b.answers.forEach(a=>{const el=$('#f'+a.n),fb=$('#ff'+a.n),g=grade(el.value,a,b.answers.filter(x=>x!==a&&x.a.toLowerCase()!==a.a.toLowerCase()));
      el.classList.remove('ok','no');fb.className='fb';
      if((fbx.ovr||{})[a.n]){el.classList.add('ok');fb.classList.add('ok');fb.textContent='Marked correct ('+a.a+')';r++}
      else if(g==='ok'){el.classList.add('ok');fb.textContent='';r++}
      else if(g==='near'){el.classList.add('ok');fb.classList.add('near');fb.textContent='Spelling: '+a.a;r++}
      else{el.classList.add('no');fb.classList.add('no');fb.innerHTML=esc(a.a)+(el.value.trim()?' <button class="markok" data-n="'+a.n+'">Mark correct</button>':'');anyMiss=true}});
    if(first&&anyMiss){missed.add(b.key);saveMissed()}
    view.querySelectorAll('.markok').forEach(bt=>bt.onclick=()=>{const n=+bt.dataset.n;fbx.ovr=fbx.ovr||{};fbx.ovr[n]=true;
      if(fbx.stats[fbx.i])fbx.stats[fbx.i].r=Math.min(fbx.stats[fbx.i].t,fbx.stats[fbx.i].r+1);saveFB();$('#chk').onclick();
      if(!view.querySelector('.fb-s input.no')){missed.delete(b.key);saveMissed()}});
    $('#fbsaid').hidden=false;
    if(!fbx.stats[fbx.i])fbx.stats[fbx.i]={r,t:b.answers.length};fbx.checked=true;saveFB()};
  $('#rev').onclick=()=>{let any=false;b.answers.forEach(a=>{const fb=$('#ff'+a.n);if(!fb.textContent&&!$('#f'+a.n).classList.contains('ok')){fb.className='fb no';fb.textContent=a.a;any=true}});
    if(any&&!fbx.checked){missed.add(b.key);saveMissed()}
    if(!fbx.stats[fbx.i])fbx.stats[fbx.i]={r:0,t:b.answers.length};fbx.revealed=true;saveFB()};
  $('#nxt').onclick=()=>{fbx.i++;renderFB();window.scrollTo({top:0})};
  $('#prev').onclick=()=>{fbx.i--;renderFB();window.scrollTo({top:0})};
  if(replay){if(fbx.checked)$('#chk').onclick();if(fbx.revealed)$('#rev').onclick()}
}

/* ---------- flashcards ---------- */
function wc(s){return s.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).length}
function kind(a){
  const s=a.trim();
  if(/\(CN [IVX]+\)$/.test(s)||/ n\.$/.test(s)||/\bnerves?\b/i.test(s)&&wc(s)<=4)return 'Nerve name';
  if(/ a\.$/.test(s)||/\barter(y|ies)\b/i.test(s)&&wc(s)<=5)return 'Artery name';
  if(/^\d+$/.test(s))return 'A number';
  if(/^[CTLS]\d/.test(s))return 'Spinal level(s)';
  if(/^(I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII)(, | and |$)/.test(s))return 'Cranial nerve number(s)';
  if(/\blobes?\b/i.test(s)&&wc(s)<=3)return 'Lobe';
  if(/\b(sulcus|fissure|gyrus|gyri|lobule)\b/i.test(s)&&wc(s)<=4)return 'Brain landmark';
  if(/\b(ventricle|aqueduct|foramen|canal)\b/i.test(s)&&wc(s)<=5)return 'Part of the ventricular system';
  if(/\b(sinus|falx|tentorium|confluens)\b/i.test(s)&&wc(s)<=4)return 'Dural fold or sinus';
  if(/(cells?|cytes?|glia|neurons?)$/i.test(s)&&wc(s)<=4)return 'Cell type';
  if(/(mater|neurium)$/i.test(s)&&wc(s)<=3)return 'Covering layer';
  return null;
}
function fmtHint(c){
  if(c.type==='l'){const k=kind(c.a.a);const n=wc(c.a.a);return (k||'Structure name')+' · '+n+' word'+(n>1?'s':'')}
  if(c.type==='m')return 'Give each: '+c.m.f.map(x=>x[0]).join(' · ');
  if(c.type==='b'){const ws=c.b.answers.map(a=>wc(a.a));return c.b.answers.length+' blank'+(c.b.answers.length>1?'s':'')+' · '+ws.map(w=>w+' word'+(w>1?'s':'')).join(', ')}
  const q=c.q, ans=q.c;
  if(Array.isArray(ans))return 'List '+ans.length+' items';
  if(/full profile of CN/.test(q.q))return 'Name · modality (sensory / motor / mixed) · targets · brain stem attachment';
  if(ans.includes('→')&&/\. [A-Z]/.test(ans))return 'Order of the layers, then their functions';
  if(ans.includes('→'))return 'Sequence of '+(ans.split('→').length)+' steps, in order';
  const segs=ans.split(' · ');
  if(segs.length>1){const labs=segs.map(s=>{const m=s.match(/^([^:]{1,25}):/);return m?m[1].trim():null});
    if(labs.every(Boolean))return 'Give each: '+labs.join(' · ');
    return segs.length+' parts';}
  const k=kind(ans); if(k)return k+(wc(ans)>1?' · '+wc(ans)+' words':'');
  const n=wc(ans);
  if(n<=4)return 'Short answer · '+n+' word'+(n>1?'s':'');
  return 'One-sentence description';
}
const needsChoices=q=>/\bNOT\b|EXCEPT/.test(q.q);

let fc={src:'missed',deck:[],i:0,got:0};
function buildDeck(src){
  const inLec=l=>!st.lec||l===st.lec, cards=[];
  QUESTIONS.forEach(q=>{if(!inLec(q.l))return;const k=qKey(q);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(k)))cards.push({type:'q',q,key:k})});
  BL.forEach(b=>{if(!inLec(b.l))return;if(src==='all'||(src==='missed'&&missed.has(b.key))||(src==='flagged'&&flags.has(b.key)))cards.push({type:'b',b,key:b.key})});
  MUSCLES.forEach(m=>{if(!inLec(m.l))return;if(src==='all'||src==='muscles')cards.push({type:'m',m,key:m.key})});
  FIGS.forEach(f=>{if(!inLec(f.lec))return;f.answers.forEach(a=>{const k=lKey(f,a);
    if(src==='all'||(src==='missed'&&missed.has(k))||(src==='flagged'&&flags.has(fKey(f))))cards.push({type:'l',f,a,key:k})})});
  return cards;
}
function cardFromKey(k){
  if(k.startsWith('m:')){const m=MUSCLES.find(x=>x.key===k);return m?{type:'m',m,key:k}:null}
  if(k.startsWith('b:')){const b=BLBY.get(k);return b?{type:'b',b,key:k}:null}
  if(k.startsWith('l:')){const [img,n]=k.slice(2).split('|');const f=FBY.get(img);const a=f&&f.answers.find(x=>String(x.n)===n);return a?{type:'l',f,a,key:k}:null}
  const q=QBY().get(k);return q?{type:'q',q,key:k}:null;
}
function saveFC(){putSess('fc',{deck:fc.deck.map(c=>c.key),i:fc.i,got:fc.got,flipped:!!fc.flipped});try{localStorage.setItem('msk-fcsrc',fc.src)}catch(e){}}
function startFC(src,fresh){
  if(src)fc.src=src;
  if(!fresh){const s=getSess('fc');
    if(s&&s.deck){const deck=s.deck.map(cardFromKey).filter(Boolean);
      if(deck.length){fc={src:fc.src,deck,i:Math.min(s.i,deck.length),got:s.got,flipped:s.flipped};renderFC(true);return}}}
  fc={src:fc.src,deck:shuffle(buildDeck(fc.src)),i:0,got:0,flipped:false};
  renderFC();
}
try{const s=localStorage.getItem('msk-fcsrc');if(s)fc.src=s}catch(e){}
function srcChips(){
  const n=s=>buildDeck(s).length;
  return `<div class="src" role="group" aria-label="Deck">
   <button class="chip" data-src="missed" aria-pressed="${fc.src==='missed'}">Missed (${n('missed')})</button>
   <button class="chip" data-src="flagged" aria-pressed="${fc.src==='flagged'}">Flagged (${n('flagged')})</button>
   ${MUSCLES.length?`<button class="chip" data-src="muscles" aria-pressed="${fc.src==='muscles'}">Muscles (${n('muscles')})</button>`:''}
   <button class="chip" data-src="all" aria-pressed="${fc.src==='all'}">Everything (${n('all')})</button></div>`;
}
function wireSrc(){view.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>startFC(b.dataset.src))}
function renderFC(replay){
  const n=fc.deck.length, left=n-fc.i;
  if(!replay)fc.flipped=false;
  saveFC();
  if(!n){
    const msg=fc.src==='missed'?'Every question you miss, and every fill-in sentence you miss on its first check, lands here automatically.'
      :fc.src==='flagged'?'Tap Flag on a question or sentence and it shows up here.':'Nothing in this lecture.';
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>${fc.src==='missed'?'No misses yet':'Nothing here yet'}</h2><p>${msg}</p><div class="nav" style="justify-content:center"><button class="btn primary" id="goall">Study everything instead</button></div></div>`;
    wireSrc();$('#goall').onclick=()=>startFC('all');return;
  }
  if(fc.i>=n){
    view.innerHTML=srcChips()+`<div class="card done" style="margin-top:14px"><h2>Deck done</h2><p>${fc.got} card${fc.got===1?'':'s'} marked "Got it"${fc.src==='missed'?' and removed from your misses':''}.</p><div class="nav" style="justify-content:center"><button class="btn primary" id="again">Go again</button></div></div>`;
    wireSrc();$('#again').onclick=()=>startFC(null,true);return;
  }
  const c=fc.deck[fc.i];
  let front,back,tag;
  if(c.type==='m'){tag=LECT[c.m.l]+' · '+esc(c.m.g)+' · muscle';front=`<div class="front">${esc(c.m.n)}</div>`;
    back=c.m.f.map(([k,v])=>`<div class="why"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');}
  else if(c.type==='b'){tag=LECT[c.b.l]+' · '+esc(c.b.t)+' · fill in '+saidBadge(c.b);
    front=`<div class="front" style="font-weight:500">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'_____').join('')}</div>`;
    back=`<div class="why filled" style="font-size:1.05rem">${c.b.segs.map(sg=>sg.text!=null?esc(sg.text):'<b>'+esc(c.b.answers[sg.blank-1].a)+'</b>').join('')}</div>`;}
  else if(c.type==='q'){tag=LECT[c.q.l]+' · '+esc(c.q.t)+' '+saidBadge(c.q);front=(c.q.lo?`<p class="lo"><b>Objective:</b> ${esc(c.q.lo)}</p>`:'')+`<div class="front">${esc(c.q.q)}</div>`;
    if(needsChoices(c.q)){const ch=shuffle([...(Array.isArray(c.q.c)?c.q.c:[c.q.c]),...c.q.w]);front+=`<ol class="choices" type="A">${ch.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`;}
    back=(Array.isArray(c.q.c)?`<ul class="ans-list">${c.q.c.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:`<div class="ans">${esc(c.q.c)}</div>`)+`<div class="why">${esc(c.q.e)}</div>`+saidNote(c.q);
  }
  else{tag=LECT[c.f.lec]+' · '+esc(c.f.title);front=`<div class="front">What is structure <span class="num" style="display:inline-grid;vertical-align:middle;margin:0 2px">${c.a.n}</span>?</div>
    <div class="plate"><img src="${IMG[c.f.img]}" alt="${esc(c.f.title)}" style="cursor:pointer"></div><div><button class="btn" id="fczoom" style="padding:6px 12px;font-size:.82rem">Enlarge image</button></div>`;
    back=`<div class="ans">${esc(c.a.a)}</div>`;}
  view.innerHTML=srcChips()+`<div class="meta"><span>Card ${fc.i+1} of ${n} · ${restartBtn}</span><span class="score">${left} left · <b>${fc.got}</b> got it</span></div>
  <div class="progress"><i style="width:${fc.i/n*100}%"></i></div>
  <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card"><span class="tag">${tag}</span>${front}
   <div class="fmt"><span class="fl">Answer format</span><span>${esc(fmtHint(c))}</span></div>
   <div class="back" id="back" hidden>${back}</div><div class="tapnote" id="tapnote">Tap the card to see the answer</div></div>
  <div class="nav"><button class="btn" id="fcback" ${fc.i?'':'disabled'}>Back</button><span class="spacer"></span><span id="rate" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn again" id="again">Still learning</button><button class="btn got" id="got">Got it</button></span></div>`;
  wireSrc(); $('#restart').onclick=()=>startFC(null,true);
  const show=()=>{$('#back').hidden=false;$('#tapnote').hidden=true;$('#rate').hidden=false};
  const flip=()=>{if(fc.flipped)return;fc.flipped=true;show();saveFC()};
  if(replay&&fc.flipped)show();
  $('#flash').onclick=e=>{if(e.target.id==='fczoom'){e.stopPropagation();$('#zimg').src=IMG[c.f.img];$('#zoom').hidden=false;return}flip()};
  $('#flash').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const next=()=>{fc.i++;renderFC();window.scrollTo({top:0})};
  $('#fcback').onclick=()=>{fc.i--;renderFC();window.scrollTo({top:0})};
  $('#got').onclick=()=>{fc.got++;if(fc.src==='missed'){missed.delete(c.key);saveMissed()}next()};
  $('#again').onclick=()=>{const pos=Math.min(fc.deck.length,fc.i+4);fc.deck.splice(pos,0,c);next()};
}

/* ---------- controls ---------- */
function sync(){
  if(!FIGS.length&&st.mode==='id')st.mode='mcq';
  $('#m-mcq').setAttribute('aria-pressed',st.mode==='mcq');$('#m-id').setAttribute('aria-pressed',st.mode==='id');$('#m-fb').setAttribute('aria-pressed',st.mode==='fb');$('#m-fc').setAttribute('aria-pressed',st.mode==='fc');
  $('#fchip').hidden=st.mode==='fc'; if(st.mode==='fc')st.flagOnly=false;
  document.querySelectorAll('.chip[data-l]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.l===st.lec));
  {const sel=document.querySelector('.chip[data-l][aria-pressed="true"]'),row=$('#chips');if(sel&&row.scrollWidth>row.clientWidth)row.scrollLeft=Math.max(0,sel.offsetLeft-row.offsetLeft-16);}
  document.body.dataset.mode=st.mode; updateFchip(); save(); st.mode==='mcq'?startMCQ():st.mode==='id'?startID():st.mode==='fb'?startFB():startFC();
}
$('#m-mcq').onclick=()=>{st.mode='mcq';sync()};
$('#m-id').onclick=()=>{st.mode='id';sync()};
$('#m-fc').onclick=()=>{st.mode='fc';sync()};
$('#m-fb').onclick=()=>{st.mode='fb';sync()};
document.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{st.lec=+c.dataset.l;history.replaceState(null,'',st.lec?'#lecture-'+st.lec:location.pathname);sync()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#lecture-([1-5])$/);const n=m?+m[1]:0;if(n!==st.lec){st.lec=n;sync()}});
$('#fchip').onclick=()=>{st.flagOnly=!st.flagOnly;sync()};
sync();
})();
</script>
