<style>

.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}

// Built by src/build-exams.mjs from the MSK lecture quizzes, on the Exam 2 page's engine. Edit the sources, not this file.
const QUESTIONS=[{"l":1,"t":"Components of skeletal system","q":"A biopsy of a 65-year-old's femoral shaft shows a medullary cavity filled mostly with adipocytes. What is this tissue primarily doing?","c":"Storing triglycerides","w":["Producing formed elements of blood","Storing most of the body's calcium","Secreting collagen","Resorbing bone"],"e":"Yellow bone marrow is mostly adipocytes and stores triglycerides. In adults, the medullary cavity holds yellow marrow, and hemopoiesis happens in red marrow."},{"l":1,"t":"Components of skeletal system","q":"A patient on chemotherapy develops low red and white blood cell counts. Which skeletal system component is most directly affected?","c":"Red bone marrow","w":["Yellow bone marrow","Osseous tissue","Hyaline cartilage","Periosteum"],"e":"Red bone marrow carries out hemopoiesis, the process by which the formed elements of blood develop."},{"l":1,"t":"Components of skeletal system","q":"Standing loads the tibia along its long axis, while the patellar tendon pulls on the tibial tuberosity. Which stresses are these, in order?","c":"Compressive; tensile","w":["Tensile; compressive","Shear; tensile","Compressive; shear","Tensile; shear"],"e":"Body weight pressing down along the axis is compression. A tendon pulling on bone is tension, and collagen resists it."},{"l":1,"t":"Components of skeletal system","q":"Which of the following is NOT made primarily of dense connective tissue?","c":"Articular cartilage","w":["Periosteum","Ligaments","Tendons","Fibrous outer layer of the periosteum"],"e":"Articular cartilage is hyaline cartilage. The periosteum, ligaments, and tendons are dense CT."},{"l":1,"t":"Components of skeletal system","q":"Which pairing of skeletal component and role is INCORRECT?","c":"Nerves: carry blood away from the heart to bone","w":["Red marrow: hemopoiesis","Cartilage: covers the ends of long bones","Yellow marrow: triglyceride storage","Periosteum: dense CT surrounding bone"],"e":"Arteries carry blood away from the heart. Nerves are bundles of axons outside the CNS."},{"l":1,"t":"Components of skeletal system","q":"A metal plate is placed on the femur. Beneath it, the bone slowly remodels and changes its internal architecture. This best illustrates that bone:","c":"Is dynamic and adapts to stress","w":["Is static once growth ends","Grows only at the epiphyseal plate","Cannot remodel in adults","Is purely mineral tissue"],"e":"Bone is dynamic. It remodels and adapts to the stresses placed on it."},{"l":1,"t":"Components of skeletal system","q":"A collagen-poor bone is most vulnerable to which force?","c":"Tensile (stretching)","w":["Compressive (crushing)","Neither, because collagen doesn't affect strength","Only shear","Only torsion"],"e":"Collagen gives bone its tensile strength."},{"l":1,"t":"Components of skeletal system","q":"Which role is NOT listed for cartilage in the skeletal system?","c":"Storing triglycerides","w":["Serving as a model for bone ossification","Forming joints","Covering the ends of long bones","Being mostly hyaline cartilage"],"e":"Triglyceride storage is the job of yellow marrow."},{"l":1,"t":"Bone cells","q":"An experimental drug blocks the fusion of monocytes. Which process would be most directly reduced?","c":"Bone resorption","w":["Collagen secretion","Initiation of calcification","Division of osteogenic cells","Nutrient exchange by osteocytes"],"e":"Osteoclasts form from the fusion of up to 50 monocytes. Without fusion there are fewer osteoclasts, so less resorption."},{"l":1,"t":"Bone cells","q":"A mutation disrupts gap junctions in bone. Which cell's primary function is most directly impaired?","c":"Osteocyte","w":["Osteoclast","Osteogenic cell","Osteoblast","Chondrocyte"],"e":"Osteocytes maintain bone metabolism and exchange nutrients and waste with the blood through gap junctions."},{"l":1,"t":"Bone cells","q":"A proton pump inhibitor that acts at bone surfaces would most directly impair:","c":"Osteoclast breakdown of the matrix at the ruffled border","w":["Osteoblast collagen production","Osteocyte communication","Mitosis of osteogenic cells","Mineral deposition in the collagen framework"],"e":"The ruffled border releases protons (acid) and lysosomal enzymes to resorb bone."},{"l":1,"t":"Bone cells","q":"An osteoblast becomes surrounded by the matrix it secreted. What does it become, and which cell type can still divide?","c":"Osteocyte; osteogenic cell","w":["Osteoclast; osteoblast","Osteocyte; osteocyte","Osteogenic cell; osteoclast","Osteoclast; osteogenic cell"],"e":"Trapped osteoblasts become osteocytes. Only osteogenic (stem) cells are described as dividing."},{"l":1,"t":"Bone cells","q":"Which bone cell does NOT share a developmental lineage with the others?","c":"Osteoclast","w":["Osteoblast","Osteocyte","Osteogenic cell"],"e":"Osteoclasts come from fused monocytes. The other three come from mesenchyme."},{"l":1,"t":"Bone cells","q":"A drug blocks osteoblast signaling to osteoclasts. Which osteoblast function is being targeted?","c":"Its key role in hormonal regulation of bone resorption","w":["Initiating calcification","Producing collagen","Becoming an osteocyte","Forming trabeculae"],"e":"Osteoblasts play a key role in the hormonal regulation of bone resorption, and osteoclasts respond to their signals."},{"l":1,"t":"Bone cells","q":"You are looking for dividing stem cells of bone to culture. Which location would be LEAST useful?","c":"The center of an osteon's concentric lamellae, embedded in matrix","w":["The deep side of the periosteum","The endosteum","Neurovascular canals","Endosteum lining spongy bone"],"e":"Osteogenic cells live in the deep periosteum, the endosteum, and the neurovascular canals. Cells embedded in the matrix are osteocytes."},{"l":1,"t":"Bone cells","q":"Which pairing of cell and primary function is correct?","c":"Osteoblast: produces the organic matrix and initiates calcification","w":["Osteocyte: resorbs matrix at a ruffled border","Osteoclast: exchanges nutrients through gap junctions","Osteogenic cell: secretes lysosomal enzymes","Osteoclast: becomes an osteocyte"],"e":"Osteoblasts build bone, osteocytes maintain it, osteoclasts resorb it, and osteogenic cells are the stem cells."},{"l":1,"t":"Extracellular matrix","q":"A genetic disorder causes defective collagen synthesis. The patient's bones are most likely to be:","c":"Brittle and prone to fracture","w":["Soft and easily bent","Denser than normal","Unusually flexible","Normal, since minerals give strength"],"e":"Collagen provides tensile strength and flexibility, so losing it makes bone brittle. Losing minerals would make bone soft and bendable instead."},{"l":1,"t":"Extracellular matrix","q":"A child's bones are poorly mineralized but have normal collagen. Under body weight, the long bones would most likely:","c":"Bend and deform","w":["Shatter into fragments","Become brittle","Grow faster in length","Be unaffected"],"e":"The inorganic component gives hardness and rigidity. Without it, the flexible collagen framework bends."},{"l":1,"t":"Extracellular matrix","q":"Which composition of the bony ECM is correct?","c":"30–40% organic, 45–55% inorganic, 15% water","w":["45–55% organic, 30–40% inorganic, 15% water","15% organic, 70% inorganic, 15% water","50% organic, 50% inorganic, no water","60% organic, 25% inorganic, 15% water"],"e":"The matrix is mostly inorganic, with about 15% water."},{"l":1,"t":"Extracellular matrix","q":"Bone is classified as a connective tissue mainly because it has:","c":"Abundant extracellular matrix with widely separated cells","w":["Tightly packed cells with little matrix","Contractile proteins","A free apical surface","No blood supply"],"e":"Bone is mineralized CT, one of the five major types of connective tissue."},{"l":1,"t":"Extracellular matrix","q":"Bone is called a composite because it:","c":"Combines organic and inorganic materials to get the best properties of each","w":["Is made of several bone cell types","Contains both red and yellow marrow","Has both compact and spongy regions","Is covered by periosteum"],"e":"Organic collagen provides flexibility and tensile strength. Inorganic mineral provides hardness."},{"l":1,"t":"Extracellular matrix","q":"Minerals harden bone through which sequence?","c":"Osteoblasts secrete collagen → mineral salts are deposited in the collagen framework → they crystallize and harden","w":["Minerals crystallize first → osteoclasts add collagen","Osteocytes secrete hydroxyapatite directly","Collagen calcifies without minerals","Cartilage converts directly to mineral"],"e":"This process is calcification."},{"l":1,"t":"Extracellular matrix","q":"Which is NOT a characteristic of osseous tissue?","c":"Tightly packed cells with little extracellular matrix","w":["Mineralized connective tissue","Abundant extracellular matrix","Widely separated cells","One of the major types of connective tissue"],"e":"Like all connective tissue, bone has abundant matrix and widely separated cells."},{"l":1,"t":"Organization of bone","q":"A histology slide shows concentric rings of matrix around central channels with no marrow spaces. Which site was most likely sampled?","c":"Diaphysis of a long bone","w":["Interior of a vertebral body","Interior of the femoral head","Interior of a carpal bone","Interior of a flat skull bone"],"e":"Osteons belong to compact bone, which forms the bulk of the diaphysis. The other sites are mostly spongy bone."},{"l":1,"t":"Organization of bone","q":"Which structure links the central canals with each other and with the periosteum's blood supply?","c":"Perforating canals","w":["Concentric lamellae","Trabeculae","Medullary cavity","Inner circumferential lamellae"],"e":"Perforating canals run transversely, carrying neurovasculature from the periosteum to the central canals and medullary cavity."},{"l":1,"t":"Organization of bone","q":"Which feature lets spongy bone resist load while keeping bones light?","c":"Trabeculae aligned along lines of stress, with marrow-filled spaces","w":["Densely packed osteons","Thick circumferential lamellae","A cartilage core","Large central canals"],"e":"Spongy bone has no osteons. Its trabeculae ('little beams') follow lines of stress, and the spaces between them reduce weight."},{"l":1,"t":"Organization of bone","q":"Damage to the outer circumferential lamellae and the overlying periosteum would most impair:","c":"Appositional growth","w":["Interstitial growth","Hemopoiesis","Growth at the epiphyseal plate","Formation of trabeculae"],"e":"Circumferential lamellae matter in appositional (width) growth. Interstitial growth happens within cartilage at the growth plate."},{"l":1,"t":"Organization of bone","q":"Which order runs correctly from deep to superficial in the wall of a diaphysis?","c":"Medullary cavity → inner circumferential lamellae → osteons → outer circumferential lamellae → periosteum","w":["Periosteum → osteons → medullary cavity → endosteum","Medullary cavity → periosteum → osteons → outer lamellae","Osteons → medullary cavity → periosteum → inner lamellae","Endosteum → periosteum → osteons → medullary cavity"],"e":"Inner lamellae line the medullary cavity. Outer lamellae lie directly deep to the periosteum."},{"l":1,"t":"Organization of bone","q":"A radiology report mentions \"cortical thinning.\" Which tissue is thinning?","c":"Compact bone","w":["Spongy bone","Trabecular bone","Red marrow","Articular cartilage"],"e":"Cortical and dense are other names for compact bone."},{"l":1,"t":"Organization of bone","q":"A surgeon harvests a \"cancellous graft\" from the iliac crest. What is being taken?","c":"Spongy bone","w":["Compact bone","Periosteum","Hyaline cartilage","Cortical bone"],"e":"Cancellous and trabecular are other names for spongy bone."},{"l":1,"t":"Organization of bone","q":"A cross-section of a flat skull bone would most likely show:","c":"Compact bone on the outer surfaces with spongy bone in between","w":["Only compact bone with osteons","Only spongy bone","A large medullary cavity","An epiphyseal plate"],"e":"Compact bone forms the external layer of all bones. Spongy bone forms most of the short, flat, and irregular bones and the epiphyses."},{"l":1,"t":"Organization of bone","q":"Which layer of an osteon lies closest to the central canal?","c":"The innermost concentric lamella","w":["Outer circumferential lamellae","Inner circumferential lamellae","Periosteum","Perforating fibers"],"e":"Concentric lamellae are circular plates of mineralized matrix that increase in diameter away from the central canal."},{"l":1,"t":"Organization of bone","q":"Osteons in the femoral diaphysis run mostly parallel to its long axis. Why?","c":"Osteons align along lines of stress","w":["Osteons align with blood flow from the heart","The epiphyseal plate dictates their direction","They are randomly arranged","Muscles pull them into position"],"e":"Osteons are aligned along lines of stress and are dynamic."},{"l":1,"t":"Organization of bone","q":"Which lamellae line the medullary cavity?","c":"Inner circumferential lamellae","w":["Outer circumferential lamellae","Concentric lamellae","Interstitial trabeculae","Periosteal lamellae"],"e":"Outer lamellae sit deep to the periosteum. Inner lamellae line the medullary cavity."},{"l":1,"t":"Organization of bone","q":"Compared with compact bone, spongy bone:","c":"Lacks osteons, and its spaces are filled with marrow and visible to the naked eye","w":["Has more osteons","Has no alignment with stress","Is heavier","Lacks any mineralized matrix"],"e":"Spongy bone is organized into trabeculae."},{"l":1,"t":"Parts of a long bone","q":"An X-ray of a 12-year-old's femur shows a dark line between the shaft and the expanded end. Where is it, and what joint type is it?","c":"Metaphysis; synchondrosis","w":["Epiphysis; symphysis","Diaphysis; synostosis","Metaphysis; symphysis","Epiphysis; syndesmosis"],"e":"The epiphyseal (growth) plate sits in the metaphysis. It is a synchondrosis of hyaline cartilage and drives growth in length."},{"l":1,"t":"Parts of a long bone","q":"A fracture through the growth plate of a 9-year-old's distal tibia is most concerning because it may:","c":"Impair lengthening of the tibia","w":["Impair widening of the tibia","Destroy the tibia's red marrow","Prevent formation of the periosteum","Convert compact bone to spongy bone"],"e":"The epiphyseal plate is where interstitial growth lengthens the bone."},{"l":1,"t":"Parts of a long bone","q":"A surgeon strips the periosteum from a section of diaphysis. Which consequence is most expected?","c":"Reduced blood supply and fewer osteogenic cells for repair and growth","w":["Loss of articular cartilage","Increased hemopoiesis","Closure of the epiphyseal plate","Conversion of yellow to red marrow"],"e":"Perforating canals bring neurovasculature from the periosteum, and its deep layer holds osteogenic cells."},{"l":1,"t":"Parts of a long bone","q":"Which statement about the medullary cavity of an adult is FALSE?","c":"It is lined by periosteum","w":["It lies within the diaphysis","It contains yellow marrow and blood vessels","It reduces bone weight","It is lined by endosteum"],"e":"The endosteum lines the medullary cavity. The periosteum covers the outer surface."},{"l":1,"t":"Parts of a long bone","q":"Articular cartilage is damaged in a knee injury. Why is healing expected to be poor?","c":"It is avascular hyaline cartilage","w":["It is fibrocartilage with little collagen","It lacks a periosteum only in children","It is replaced by bone in adults","It contains no cells"],"e":"Articular cartilage lacks blood vessels, which limits repair."},{"l":1,"t":"Parts of a long bone","q":"Which pairing of long bone region and main tissue is correct?","c":"Diaphysis: mostly compact; epiphysis: mostly spongy with a compact covering","w":["Diaphysis: mostly spongy; epiphysis: mostly compact","Both are entirely spongy","Metaphysis: mostly yellow marrow","Epiphysis: hyaline cartilage only"],"e":"Diaphysis means 'growing between.' Epiphysis means 'growing upon,' and the epiphyses are enlarged to provide extra surface area."},{"l":1,"t":"Parts of a long bone","q":"An adult's X-ray shows a faint line where the growth plate used to be. What joint type is this now?","c":"Synostosis","w":["Synchondrosis","Symphysis","Syndesmosis","Synovial"],"e":"Once the plate closes, the epiphysis and diaphysis fuse."},{"l":1,"t":"Parts of a long bone","q":"Which describes the two layers of the periosteum?","c":"Outer dense irregular CT; inner cellular layer","w":["Outer hyaline cartilage; inner endosteum","Outer cellular layer; inner fibrocartilage","A single layer of cells only","Outer compact bone; inner spongy bone"],"e":"Perforating (Sharpey's) fibers attach the periosteum to the underlying bone."},{"l":1,"t":"Formation & growth","q":"Which bone forms without a cartilage model?","c":"Parietal bone","w":["Femur","Humerus","Rib","Tibia"],"e":"Flat bones of the skull form by intramembranous ossification. So do most facial bones, the mandible, and the medial clavicle."},{"l":1,"t":"Formation & growth","q":"A fetus cannot form hyaline cartilage models normally. Which bones would still develop most normally?","c":"Flat bones of the skull and the mandible","w":["Long bones of the limbs","Vertebrae","Ribs","Bones of the pelvis"],"e":"Endochondral ossification needs a hyaline cartilage model and forms most bones. Intramembranous bones do not."},{"l":1,"t":"Formation & growth","q":"A healing femoral fracture, a teen's growth spurt, and the daily replacement of microdamaged bone are ossification during, respectively:","c":"Fracture repair, growth, remodeling","w":["Growth, remodeling, fracture repair","Initial formation, growth, remodeling","Remodeling, initial formation, growth","Fracture repair, initial formation, remodeling"],"e":"The four situations are initial formation, growth, remodeling, and fracture repair."},{"l":1,"t":"Formation & growth","q":"During childhood the humerus gets both longer and thicker. Which match is correct?","c":"Length: interstitial at the epiphyseal plate; width: appositional at the surface","w":["Length: appositional; width: interstitial","Both by interstitial growth","Both by appositional growth","Length: remodeling; width: interstitial"],"e":"Interstitial growth is endogenous and lengthens bone. Appositional growth is exogenous and widens it."},{"l":1,"t":"Formation & growth","q":"Which type of growth can occur in both a cartilage model and in bone?","c":"Appositional","w":["Interstitial","Intramembranous only","Neither","Endochondral only"],"e":"Interstitial growth happens only in a cartilage model. Appositional growth happens in cartilage and bone."},{"l":1,"t":"Formation & growth","q":"Which set of bones ALL form by intramembranous ossification?","c":"Flat skull bones, most facial bones, mandible, medial clavicle","w":["Femur, tibia, humerus","Vertebrae and ribs","Carpals and tarsals","Hip bones and sacrum"],"e":"Most other bones form by endochondral ossification."},{"l":1,"t":"Formation & growth","q":"The correct order of endochondral ossification is:","c":"Hyaline cartilage replaces mesenchyme → the cartilage model grows → bone replaces the cartilage","w":["Bone forms directly in mesenchyme","Bone replaces mesenchyme → cartilage covers the bone","Fibrocartilage model → bone","Mesenchyme → dense CT → bone"],"e":"Both methods replace pre-existing connective tissue."},{"l":1,"t":"Remodeling & factors","q":"Astronauts on long missions lose bone mass. Which principle best explains this?","c":"Bone remodels according to mechanical stress; less loading means less bone","w":["Microgravity blocks hemopoiesis","Collagen can't be made in space","Osteocytes die without gravity","The epiphyseal plates reopen"],"e":"Bone is dynamic. Remodeling adapts to stress and redistributes tissue along lines of stress."},{"l":1,"t":"Remodeling & factors","q":"Which site would show the fastest bone turnover?","c":"Vertebral body","w":["Mid-diaphysis of the femur","Outer circumferential lamellae","Cortex of the tibia","Shaft of the humerus"],"e":"Spongy bone, like the inside of a vertebral body, renews faster than compact bone."},{"l":1,"t":"Remodeling & factors","q":"Blood calcium drops sharply. Which response is NOT expected?","c":"Increased calcitonin secretion","w":["Increased PTH secretion","Increased osteoclast activity","Increased calcitriol synthesis by the kidneys","Increased calcium absorption from the gut"],"e":"Calcitonin lowers blood calcium, so it would not rise. PTH raises osteoclast activity and calcitriol."},{"l":1,"t":"Remodeling & factors","q":"After a total thyroidectomy (without hormone replacement), which bone-related hormones are lost?","c":"Thyroid hormone and calcitonin","w":["PTH and calcitriol","hGH and IGFs","Calcitonin and PTH","Estrogen and testosterone"],"e":"The thyroid secretes thyroid hormone (stimulates osteoblasts) and calcitonin (inhibits osteoclasts). PTH comes from the parathyroid glands."},{"l":1,"t":"Remodeling & factors","q":"Vitamin C deficiency weakens bone mainly by:","c":"Impairing synthesis of bone proteins such as collagen","w":["Blocking calcium absorption from the gut","Overstimulating osteoclasts","Closing the epiphyseal plates early","Preventing hemopoiesis"],"e":"Vitamins C, K, and B12 are needed to synthesize the proteins of osseous tissue. Vitamin D handles calcium absorption."},{"l":1,"t":"Remodeling & factors","q":"A 10-year-old with excess growth hormone would most likely show:","c":"Increased height from cell division at the epiphyseal plates","w":["Increased osteoclast activity","Early closure of growth plates","Decreased IGF levels","Loss of bone density"],"e":"hGH promotes IGFs, stimulates osteoblasts, and drives cell division at the epiphyseal plate and periosteum."},{"l":1,"t":"Remodeling & factors","q":"Which vitamin is described as directly stimulating osteoblasts?","c":"Vitamin A","w":["Vitamin D","Vitamin K","Vitamin B12","Vitamin C"],"e":"Vitamin A stimulates osteoblasts. Vitamin D increases GI calcium absorption. Vitamins C, K, and B12 support synthesis of bone proteins."},{"l":1,"t":"Remodeling & factors","q":"The dramatic growth spurt at puberty results mainly from sex hormones:","c":"Increasing osteoblast activity","w":["Inhibiting osteoblasts","Stimulating monocyte fusion","Converting yellow to red marrow","Decreasing calcium absorption"],"e":"Estrogens and testosterone increase osteoblast activity."},{"l":1,"t":"Remodeling & factors","q":"Which is an advantage of bone remodeling?","c":"New tissue is less brittle and stronger","w":["It permanently stops bone turnover","It converts spongy bone to cartilage","It increases brittleness","It removes the periosteum"],"e":"Remodeling also redistributes bone along lines of mechanical stress."},{"l":1,"t":"Remodeling & factors","q":"Which statement about minerals and bone is correct?","c":"The skeleton is the major calcium storage site, and calcium homeostasis influences growth and remodeling","w":["Bone stores little calcium","Only calcium matters; phosphorus and magnesium play no role","Minerals are organic nutrients","Fluoride has no link to bone"],"e":"Minerals are inorganic elements concentrated mostly in the skeleton. Calcium is the primary one, alongside phosphorus, magnesium, and fluoride."},{"l":1,"t":"Remodeling & factors","q":"A patient's thyroid hormone is very low. Which bone effect is expected?","c":"Less bone growth, since thyroid hormone stimulates osteoblasts","w":["More osteoclast activity from calcitonin","Higher blood calcium","More calcitriol","Faster closure of growth plates"],"e":"Thyroid hormone promotes bone growth by stimulating osteoblasts."},{"l":1,"t":"Aging & osteoporosis","q":"An 80-year-old's bones fracture with minor falls. Which pair of age-related changes best explains this?","c":"Demineralization and slowed collagen production","w":["More collagen and more minerals","Faster remodeling and thicker cortices","Reopened growth plates and marrow loss","More osteoblasts and fewer osteoclasts"],"e":"Aging causes loss of bone mass (demineralization) and brittleness from reduced collagen."},{"l":1,"t":"Aging & osteoporosis","q":"Why are vertebral fractures the most common presentation of osteoporosis?","c":"Vertebral bodies are mostly spongy bone, which osteoporosis affects most","w":["Vertebrae are mostly compact bone","Vertebrae have no periosteum","Vertebrae don't remodel","Vertebrae have no marrow"],"e":"Osteoporosis affects spongy bone more, and vertebral bodies are primarily spongy."},{"l":1,"t":"Aging & osteoporosis","q":"Which patient has the highest risk of osteoporosis?","c":"A small-framed, postmenopausal 68-year-old who smokes","w":["A large-framed 30-year-old man who lifts weights","A 16-year-old athlete","A 40-year-old premenopausal runner with a good diet","A large-framed 50-year-old man who doesn't smoke"],"e":"The main risk factor is a small body build. Advanced age, postmenopause (low estrogen), and smoking add to it."},{"l":1,"t":"Aging & osteoporosis","q":"A woman's vertebral fracture raises suspicion of osteoporosis. Which test confirms low bone density?","c":"DEXA (DXA) scan","w":["MRI","Blood calcium level","Standard radiograph only","Bone marrow biopsy"],"e":"Dual-energy X-ray absorptiometry measures bone density."},{"l":1,"t":"Aging & osteoporosis","q":"Which is a prevention strategy rather than a pharmacologic treatment?","c":"Weight-bearing exercise","w":["Bisphosphonates","Selective estrogen receptor modulators","Hormone replacement therapy","Antiresorptive therapy"],"e":"Prevention means weight-bearing exercise and diet."},{"l":1,"t":"Aging & osteoporosis","q":"Why are postmenopausal individuals at greater risk of osteoporosis?","c":"Lower estrogen reduces osteoblast activity, so resorption outpaces deposition","w":["Higher estrogen activates osteoclasts","Growth plates reopen","Calcitonin rises","Collagen production increases"],"e":"Estrogen supports osteoblast activity. With less of it, osteoclast activity outpaces osteoblast activity."},{"l":1,"t":"Aging & osteoporosis","q":"A graph shows bone mass rising through young adulthood and then falling steadily. The decline mainly reflects:","c":"Demineralization (loss of bone mass)","w":["Increased collagen production","Increased osteoblast activity","New growth plates forming","Increased hemopoiesis"],"e":"Loss of bone mass is one of the two main effects of aging. The other is brittleness from slowed collagen production."},{"l":1,"t":"Aging & osteoporosis","q":"Which statement defines osteoporosis correctly?","c":"Severe loss of bone density ('porous bone') in which osteoclast activity outpaces osteoblast activity","w":["A crystal arthritis of joints","An infection of the marrow","Excess mineral deposition","Failure of the growth plates to close"],"e":"Osteoporosis is the most common bone disease, and it affects spongy bone more."},{"l":1,"t":"Aging & osteoporosis","q":"Which set lists the common osteoporotic fracture sites, most common first?","c":"Vertebrae, then hip and wrist","w":["Skull, then ribs","Femoral shaft, then tibia","Wrist, then vertebrae, then skull","Clavicle, then scapula"],"e":"Osteoporosis is most commonly diagnosed from fractures, with the vertebrae as the most common site."},{"l":1,"t":"Aging & osteoporosis","q":"Why is a relatively small body build the main risk factor for osteoporosis?","c":"The bones are less dense to begin with","w":["Small people have more osteoclasts","Small bones can't remodel","Small people don't absorb calcium","It raises estrogen levels"],"e":"Other risk factors are age, postmenopause, smoking, diabetes, poor diet, and lack of weight-bearing exercise."},{"l":1,"t":"Aging & osteoporosis","q":"Which pharmacologic option works by replacing a hormone whose loss after menopause increases risk?","c":"Hormone (estrogen) replacement therapy","w":["Bisphosphonates","Weight-bearing exercise","Calcium-rich diet","Open reduction"],"e":"Selective estrogen receptor modulators are another option. Bisphosphonates are antiresorptive."},{"l":1,"t":"Fractures","q":"A motorcyclist's tibia is broken into four pieces, and one fragment protrudes through the skin. Classify it.","c":"Open, comminuted","w":["Closed, comminuted","Open, greenstick","Closed, impacted","Open, stress"],"e":"Through the skin makes it open (compound). Three or more fragments makes it comminuted."},{"l":1,"t":"Fractures","q":"After a fall from height onto the feet, one fragment of the femoral neck is jammed forcefully into the other. This is a(n):","c":"Impacted fracture","w":["Comminuted fracture","Greenstick fracture","Stress fracture","Open fracture"],"e":"Impacted: one fragment is driven into another."},{"l":1,"t":"Fractures","q":"Two weeks after a fracture, collagen and cartilage bridge the broken ends. Which step is this, and what comes next?","c":"Fibrocartilaginous callus; bony callus","w":["Fracture hematoma; fibrocartilaginous callus","Bony callus; remodeling","Remodeling; bony callus","Fibrocartilaginous callus; fracture hematoma"],"e":"Hematoma → fibrocartilaginous callus → bony callus → remodeling."},{"l":1,"t":"Fractures","q":"A military recruit has gradually worsening shin pain after weeks of marching; the first X-ray is normal. Most likely diagnosis?","c":"Stress fracture of the tibia","w":["Greenstick fracture","Comminuted fracture","Impacted fracture","Open fracture"],"e":"Stress fractures come from repetitive stress, may not show on early radiographs, and often involve the tibia."},{"l":1,"t":"Fractures","q":"A comminuted fracture is treated with plates and screws. How does this differ from a closed reduction?","c":"Open reduction uses surgery; closed reduction is manual manipulation with the skin intact","w":["Open reduction uses no hardware","Closed reduction requires an incision","Only closed reduction realigns fragments","They are the same procedure"],"e":"Both are reduction, meaning realignment ('setting' the fracture)."},{"l":1,"t":"Fractures","q":"In fracture repair, the final step that restores the bone's original shape and strength is:","c":"Remodeling","w":["Bony callus formation","Fracture hematoma","Fibrocartilaginous callus","Reduction"],"e":"Remodeling is the fourth step of repair."},{"l":1,"t":"Fractures","q":"A wrist fracture leaves the skin intact. It is classified as:","c":"Closed (simple)","w":["Open (compound)","Comminuted","Greenstick","Stress"],"e":"An open (compound) fracture breaks through the skin."},{"l":1,"t":"Fractures","q":"Why might a stress fracture be missed on an initial radiograph?","c":"It is often a microscopic fissure","w":["It only affects cartilage","It always involves the skull","It only occurs in children","It heals within hours"],"e":"Stress fractures come from repetitive stress or disease processes, and many involve the tibia."},{"l":1,"t":"Fractures","q":"A displaced fracture is pulled back into alignment by hand in the ER, without an incision. This is:","c":"Closed reduction","w":["Open reduction","Immobilization only","Remodeling","Internal fixation"],"e":"Closed reduction aligns the fractured ends by manual manipulation with the skin intact."},{"l":1,"t":"Fractures","q":"Physical therapy after a cast is removed mainly addresses which treatment goal?","c":"Restoration of function","w":["Realignment","Immobilization","Hematoma formation","Reduction"],"e":"The three goals are realignment, immobilization, and restoration of function."},{"l":1,"t":"Divisions & features","q":"Which list contains ONLY appendicular bones?","c":"Scapula, hip bone, femur, phalanges","w":["Sternum, clavicle, humerus, radius","Rib, scapula, femur, tibia","Sacrum, hip bone, femur, patella","Hyoid, clavicle, ulna, carpals"],"e":"Axial (80): skull, vertebral column (including the sacrum), thoracic cage, hyoid. Appendicular (126): limbs and girdles."},{"l":1,"t":"Divisions & features","q":"A nerve leaves the skull through a hole in a bone. Which feature term fits?","c":"Foramen","w":["Condyle","Tuberosity","Crest","Trochanter"],"e":"Depressions and openings let soft tissue pass through or form joints. Processes form joints or attachment points."},{"l":1,"t":"Divisions & features","q":"A large, roughened projection on the radius anchors a tendon. It is best called a:","c":"Tuberosity","w":["Trochanter","Condyle","Facet","Fossa"],"e":"Trochanters occur only on the femur. A tubercle is small; a tuberosity is large and roughened."},{"l":1,"t":"Divisions & features","q":"Which pair of features BOTH typically form joints?","c":"Condyle and facet","w":["Crest and line","Tubercle and tuberosity","Spinous process and epicondyle","Trochanter and crest"],"e":"Joint-forming features: condyle, facet, head."},{"l":1,"t":"Divisions & features","q":"The external acoustic meatus is named for being a:","c":"Tubelike opening","w":["Narrow slit","Shallow depression","Furrow","Sharp projection"],"e":"Meatus = tubelike opening. Fissure = slit. Fossa = shallow depression. Sulcus = furrow."},{"l":1,"t":"Divisions & features","q":"The ribs, hyoid, and sacrum belong to which division?","c":"Axial","w":["Appendicular","Ribs axial; sacrum appendicular","Hyoid appendicular","None of them"],"e":"Axial (80 bones) lies around the body's longitudinal axis: skull, vertebral column, and thoracic cage."},{"l":1,"t":"Divisions & features","q":"Which pair correctly contrasts two attachment features?","c":"Crest: prominent elongated ridge; line: long, narrow, less prominent ridge","w":["Crest: shallow depression; line: hole","Crest: joint surface; line: rounded head","Both are openings for nerves","Line: very large projection only on the femur"],"e":"Attachment processes: crest, epicondyle, line, spinous process, trochanter, tubercle, tuberosity."},{"l":1,"t":"Divisions & features","q":"Bone features serve three broad functions. Which list is correct?","c":"Passage of neurovasculature, joint formation, connective tissue attachment","w":["Hemopoiesis, calcium storage, fat storage","Growth, remodeling, repair","Protection, movement, heat production","Filtering blood, storing glycogen, making hormones"],"e":"Depressions and openings let soft tissue pass or form joints. Processes form joints or attachment points."},{"l":2,"t":"Joint basics & classification","q":"A joint is described as 'slightly movable.' Which classification system is being used?","c":"Functional","w":["Structural","Histological","Synovial","Cartilaginous"],"e":"Functional classification is based on how much movement a joint permits. Structural classification is based on what connects the bones, and it is the course's focus."},{"l":2,"t":"Joint basics & classification","q":"Two bones are joined by a solid sheet of tissue with no space between them, and a biopsy shows chondrocytes in the connecting tissue. Classify the joint.","c":"Cartilaginous","w":["Fibrous","Synovial","Synostosis","Gomphosis"],"e":"No cavity plus cartilage means a cartilaginous joint. A fibrous joint would show dense irregular CT, and a synovial joint has a cavity."},{"l":2,"t":"Joint basics & classification","q":"Which statement about all joints is TRUE?","c":"The articulating bones never actually touch; connective tissue always lies between them","w":["Bones touch directly in synovial joints","All joints have a synovial cavity","Fibrous joints contain hyaline cartilage","Synostoses are freely movable"],"e":"Structural classification rests on the presence or absence of a synovial cavity and the type of CT holding the bones together."},{"l":2,"t":"Joint basics & classification","q":"Around 9 months of age the right and left frontal bones fuse, and later the epiphyseal plates close. What do both become?","c":"Synostoses","w":["Synchondroses","Symphyses","Sutures","Syndesmoses"],"e":"A synostosis is a bony, immobile joint where the gap has ossified."},{"l":2,"t":"Joint basics & classification","q":"A surgeon reinforces a joint with a structure that stabilizes it and limits range of motion by connecting bone to bone. Which statement about this structure is correct?","c":"It is dense CT and can be an intrinsic binding structure or an extrinsic supporting band","w":["It connects muscle to bone","It is made of hyaline cartilage","It secretes synovial fluid","It is a tube-like bursa"],"e":"Ligaments connect bone to bone. The two basic types are intrinsic binding structures and extrinsic supporting bands."},{"l":2,"t":"Joint basics & classification","q":"A student classifies a joint by asking, \"Is there a space between the bones, and what tissue holds them together?\" Which system is this, and why does the course focus on it?","c":"Structural; it is based on what connects the bones","w":["Functional; it is based on movement","Structural; it is based on how much the joint moves","Functional; it is based on the tissue type","Histological; it is based on cell type"],"e":"Structural classification looks at the presence or absence of a synovial cavity and the type of connecting CT. Functional classification looks at how much movement is permitted."},{"l":2,"t":"Joint basics & classification","q":"Which correctly pairs each structural joint type with its connecting tissue and cavity status?","c":"Fibrous: dense irregular CT, no cavity; cartilaginous: cartilage, no cavity; synovial: dense CT enveloping the bones, with a cavity","w":["Fibrous: cartilage, cavity; cartilaginous: dense CT, no cavity; synovial: bone, no cavity","All three have a synovial cavity","Fibrous: dense CT, cavity; synovial: cartilage, no cavity","Cartilaginous: dense irregular CT, cavity"],"e":"Only synovial joints have a cavity. There, the dense CT surrounds the joint on the sides of the bones instead of filling the gap."},{"l":2,"t":"Joint basics & classification","q":"Which joint would be classified as a synostosis?","c":"The fused epiphysis and diaphysis of an adult femur","w":["The epiphyseal plate of a 10-year-old","An infant's coronal suture","The pubic symphysis","The interosseous membrane"],"e":"A growth plate is a synchondrosis until it closes. After closure, it becomes a synostosis."},{"l":2,"t":"Fibrous joints","q":"In a fibrous joint, collagen fibers:","c":"Emerge from one bone, cross the gap, and penetrate the other bone","w":["Form a disc of fibrocartilage between hyaline-covered surfaces","Line a synovial cavity","Form a sleeve-like capsule around the joint","Attach muscle to bone"],"e":"Fibrous joints: a solid mass of dense irregular CT, with no cavity."},{"l":2,"t":"Fibrous joints","q":"A dentist loosens a tooth by stretching the periodontal ligament. What joint is involved, and how mobile is it?","c":"Gomphosis; functionally immovable with very slight movement","w":["Suture; freely movable","Syndesmosis; the most mobile fibrous joint","Synchondrosis; immovable","Symphysis; slightly movable"],"e":"A gomphosis is a bone–tooth joint held by the periodontal ligament (sometimes considered a syndesmosis)."},{"l":2,"t":"Fibrous joints","q":"Which fibrous joint allows the MOST movement?","c":"Interosseous membrane between the radius and ulna","w":["Sagittal suture of an adult","Gomphosis of a molar","Coronal suture of an infant","Epiphyseal plate"],"e":"Syndesmoses have relatively long collagen fibers. The interosseous membrane is the most mobile fibrous joint, though its movement is still very slight."},{"l":2,"t":"Fibrous joints","q":"Why are an infant's skull sutures slightly movable when an adult's are not?","c":"They are sites of growth and shock absorption during development","w":["They contain synovial fluid","They are synchondroses","They are covered in articular cartilage","They are held by the periodontal ligament"],"e":"Sutures are held by sutural ligaments. They are immovable in adults and can become synostoses in advanced age."},{"l":2,"t":"Fibrous joints","q":"Rank these fibrous joints from least to most mobile:","c":"Adult suture → gomphosis → syndesmosis","w":["Syndesmosis → gomphosis → suture","Gomphosis → syndesmosis → suture","Suture → syndesmosis → gomphosis","All are equally immobile"],"e":"Adult sutures are immovable. A gomphosis allows very slight movement. A syndesmosis, like the interosseous membrane, is the most mobile fibrous joint."},{"l":2,"t":"Cartilaginous joints","q":"The epiphyseal plate and the joint between the manubrium and 1st rib share which features?","c":"Hyaline cartilage connecting the bones; immovable (synchondrosis)","w":["A fibrocartilage disc; slight movement (symphysis)","Long collagen fibers; slight movement (syndesmosis)","A synovial cavity; freely movable","Ossified gap; immovable (synostosis)"],"e":"Both are synchondroses. The epiphyseal plate will later become a synostosis."},{"l":2,"t":"Cartilaginous joints","q":"The pubic symphysis and an intervertebral disc both have:","c":"Hyaline-covered bone ends with a fibrocartilage disc between, allowing slight movement","w":["Hyaline cartilage only, and are immovable","Dense irregular CT and no movement","A synovial cavity","Long collagen fibers only"],"e":"Symphysis: slight movement."},{"l":2,"t":"Cartilaginous joints","q":"Which pairing of joint and example is INCORRECT?","c":"Synchondrosis: pubic symphysis","w":["Symphysis: intervertebral disc","Syndesmosis: interosseous membrane","Gomphosis: tooth in socket","Suture: sagittal suture"],"e":"The pubic symphysis is a symphysis, not a synchondrosis."},{"l":2,"t":"Cartilaginous joints","q":"What do ALL cartilaginous joints have in common?","c":"The bones are bound by a solid sheet of cartilage, with no synovial cavity","w":["A fibrocartilage disc","Hyaline cartilage only","Slight movement","A synovial cavity"],"e":"The two types are the synchondrosis (hyaline, immovable) and the symphysis (fibrocartilage disc, slight movement)."},{"l":2,"t":"Synovial joint structure","q":"Which feature is found in ALL synovial joints but in NO fibrous or cartilaginous joints?","c":"A synovial (articular) cavity","w":["Hyaline cartilage","Ligaments","Collagen fibers","Menisci"],"e":"The cavity is the major difference. Synovial joints are the most numerous type, and all are freely movable (diarthroses)."},{"l":2,"t":"Synovial joint structure","q":"The articular capsule differs from the CT of a fibrous joint because it:","c":"Surrounds the joint like a sleeve rather than forming a solid sheet between the bones","w":["Is made of hyaline cartilage","Lacks collagen","Directly binds the articular cartilages together","Has no inner layer"],"e":"The capsule has two layers: the fibrous membrane and the synovial membrane."},{"l":2,"t":"Synovial joint structure","q":"A patient's joint cavity has too little lubricating fluid. Which layer's cells are most likely dysfunctional?","c":"Synovial membrane","w":["Fibrous membrane","Articular cartilage","Periosteum","Labrum"],"e":"The synovial membrane is the inner cellular layer of areolar tissue and secretes synovial fluid."},{"l":2,"t":"Synovial joint structure","q":"Which layer attaches to the periosteum of the articulating bones and is often reinforced by ligaments?","c":"Fibrous membrane","w":["Synovial membrane","Articular cartilage","Articular disc","Bursa"],"e":"The fibrous membrane is the outer layer of dense irregular CT."},{"l":2,"t":"Synovial joint structure","q":"A 'double-jointed' gymnast has increased range of motion. The anatomical basis and trade-off are:","c":"Greater flexibility of the capsule and ligaments; less structural stability","w":["Extra synovial joints; more stability","Thicker articular cartilage; less motion","Additional menisci; more stability","Absent ligaments; no change in stability"],"e":"Hypermobility comes from looser capsules and ligaments, not extra joints."},{"l":2,"t":"Synovial joint structure","q":"Articular cartilage depends on synovial fluid for nutrients because it:","c":"Is mostly avascular","w":["Is covered by periosteum","Is fibrocartilage","Binds the bones together","Contains red marrow"],"e":"Articular cartilage is hyaline, a remnant of endochondral ossification. It does not bind the bones and heals poorly."},{"l":2,"t":"Synovial joint structure","q":"Which statement about articular cartilage is FALSE?","c":"It binds the articulating bones together","w":["It is hyaline cartilage","It is a remnant of endochondral ossification","It heals poorly","It covers the articulating surfaces"],"e":"The capsule and ligaments hold the bones together; the cartilage does not."},{"l":2,"t":"Accessory structures","q":"Arthroscopy of the TMJ reveals a nearly complete fibrocartilage plate dividing the cavity into two parts. What is it?","c":"Articular disc","w":["Meniscus","Labrum","Bursa","Tendon sheath"],"e":"An articular disc divides the cavity so different movements can occur in each part."},{"l":2,"t":"Accessory structures","q":"A knee MRI shows a tear in an incomplete, crescent-shaped fibrocartilage pad. Which function is most affected?","c":"Redistributing weight and slightly improving fit","w":["Secreting synovial fluid","Deepening a socket","Reducing friction outside the joint","Anchoring tendons to bone"],"e":"Menisci improve fit, redistribute weight, and possibly absorb shock (that last role is controversial)."},{"l":2,"t":"Accessory structures","q":"A hip labrum tear would most directly reduce:","c":"The depth of the socket and the fit of the femoral head","w":["Synovial fluid production","Friction outside the joint","Blood supply to the femur","Division of the joint cavity"],"e":"A labrum is a fibrocartilage lip on the socket of a ball & socket joint."},{"l":2,"t":"Accessory structures","q":"A carpet installer who kneels all day develops painful swelling in front of the knee with reduced range of motion. Most likely:","c":"Bursitis","w":["Osteoarthritis","Meniscus tear","Gouty arthritis","Labral tear"],"e":"Bursitis is inflammation of a bursa, usually from repetitive irritation."},{"l":2,"t":"Accessory structures","q":"Which is true of ALL accessory structures of synovial joints?","c":"They are not present in every synovial joint","w":["They are all made of hyaline cartilage","They are all inside the joint cavity","They all secrete synovial fluid","They are present in every synovial joint"],"e":"Accessory structures are typical of more complex synovial joints."},{"l":2,"t":"Movements & types","q":"The carpal bones slide slightly past each other with no significant change in angle. Which movement is this, at which joint type?","c":"Gliding; plane","w":["Rotation; pivot","Circumduction; condyloid","Flexion; hinge","Abduction; saddle"],"e":"Gliding: slight back-and-forth or side-to-side motion."},{"l":2,"t":"Movements & types","q":"Raising the arm out to the side, away from the body, is:","c":"Abduction in the frontal plane","w":["Flexion in the sagittal plane","Adduction in the frontal plane","Lateral rotation","Extension in the sagittal plane"],"e":"Abduction means away from the midline and typically happens in the frontal plane."},{"l":2,"t":"Movements & types","q":"Bending the elbow to bring the hand toward the shoulder:","c":"Decreases the angle between bones: flexion","w":["Increases the angle: extension","Moves toward the midline: adduction","Revolves around the long axis: rotation","Is a gliding movement"],"e":"Flexion and extension typically occur in the sagittal plane."},{"l":2,"t":"Movements & types","q":"Turning the thigh so the kneecap faces toward the midline is:","c":"Medial (internal) rotation","w":["Lateral rotation","Adduction","Flexion","Circumduction"],"e":"Rotation means the bone revolves around its longitudinal axis."},{"l":2,"t":"Movements & types","q":"A joint allows flexion/extension, abduction/adduction, and circumduction, but NOT rotation. Which joints fit?","c":"Condyloid or saddle","w":["Ball & socket or pivot","Hinge or plane","Pivot only","Plane only"],"e":"Condyloid (e.g., radiocarpal) and saddle (e.g., 1st CMC) joints are both biaxial."},{"l":2,"t":"Movements & types","q":"A joint moves only in one plane, like a door, and its surfaces are one convex and one concave. Which is an example?","c":"Interphalangeal joint","w":["Radiocarpal joint","Atlanto-axial joint","Glenohumeral joint","Acromioclavicular joint"],"e":"Hinge joints (elbow, ankle, interphalangeal) are uniaxial: flexion/extension."},{"l":2,"t":"Movements & types","q":"Shaking your head 'no' uses a joint where a pointed process turns within a ring of bone and ligament. Which type is it, and which other joint shares this type?","c":"Pivot; proximal radio-ulnar","w":["Hinge; elbow","Plane; acromioclavicular","Saddle; 1st carpometacarpal","Ball & socket; hip"],"e":"Pivot joints (atlanto-axial, proximal radio-ulnar) allow uniaxial rotation."},{"l":2,"t":"Movements & types","q":"Which joint is multiaxial?","c":"Hip","w":["Elbow","Radiocarpal","1st carpometacarpal","Atlanto-axial"],"e":"Ball & socket joints (glenohumeral, hip) allow flexion/extension, abduction/adduction, circumduction, and medial/lateral rotation."},{"l":2,"t":"Movements & types","q":"Joint movements are described relative to what reference?","c":"Anatomical position","w":["The position the patient is currently in","The sitting position","The fetal position","Whichever limb is dominant"],"e":"All movements are defined relative to anatomical position."},{"l":2,"t":"Movements & types","q":"Which best distinguishes gliding from angular movement?","c":"Gliding is slight back-and-forth or side-to-side motion with no significant change in angle; angular movement changes the angle between bones","w":["Gliding changes the angle greatly","Angular movement occurs only at plane joints","Gliding occurs only at ball & socket joints","They are the same"],"e":"Gliding is typical of plane joints. Angular movements include flexion/extension, abduction/adduction, and circumduction."},{"l":2,"t":"Movements & types","q":"Which is NOT a movement of a ball & socket joint?","c":"None; ball & socket joints allow flexion/extension, abduction/adduction, circumduction, and rotation","w":["Flexion","Abduction","Medial rotation","Circumduction"],"e":"Ball & socket joints are multiaxial and allow all of these movements."},{"l":2,"t":"Arthritis","q":"Which statement best describes the relationship between rheumatism and arthritis?","c":"Arthritis is a type of rheumatism that affects joints","w":["Rheumatism is a type of arthritis","They are unrelated","Rheumatism affects only bones","Arthritis affects only muscles"],"e":"Rheumatism is any painful disorder of the body's supporting structures."},{"l":2,"t":"Arthritis","q":"A 45-year-old has symmetric swelling that began in the MP joints of the hands and feet and has now spread to larger joints. Blood work suggests an autoimmune process. Diagnosis?","c":"Rheumatoid arthritis","w":["Osteoarthritis","Gouty arthritis","Bursitis","Stress fracture"],"e":"RA: the immune system attacks the joints, most commonly the synovial membrane."},{"l":2,"t":"Arthritis","q":"After a large steak dinner, a patient wakes with a red, extremely painful big toe joint. What is the underlying pathology?","c":"Sodium urate crystal deposition from high blood uric acid","w":["Autoimmune attack on the synovial membrane","Wear-and-tear loss of articular cartilage","Inflamed bursa","Torn meniscus"],"e":"Gouty arthritis is a crystal arthritis that classically affects the 1st MTP joint."},{"l":2,"t":"Arthritis","q":"A 70-year-old retired carpenter has knee and hip pain that worsens with use, with no signs of an autoimmune process. Why does the damage persist?","c":"Articular cartilage breaks down and heals poorly","w":["Urate crystals accumulate","The synovial membrane is attacked by antibodies","Bursae become infected","Ligaments ossify"],"e":"Osteoarthritis is degenerative 'wear and tear' and the most common arthritis. It affects the hands, knees, hips, and vertebral column."},{"l":2,"t":"Arthritis","q":"Match each arthritis to the structure primarily attacked: OA, RA, gout.","c":"Articular cartilage; synovial membrane; soft tissues of the joint (urate crystals)","w":["Synovial membrane; articular cartilage; bursae","Bursae; ligaments; articular cartilage","Urate crystals; articular cartilage; synovial membrane","Menisci; bone marrow; tendons"],"e":"OA is degenerative wear and tear. RA is autoimmune. Gout is a crystal arthritis."},{"l":2,"t":"Muscle properties, functions, types","q":"Which muscle property is shared with nerve cells and describes responding to a stimulus with electrical changes across the sarcolemma?","c":"Excitability","w":["Contractility","Extensibility","Elasticity","Tonicity"],"e":"Excitability. Conductivity is when a local change triggers a wave of excitation."},{"l":2,"t":"Muscle properties, functions, types","q":"A calf muscle is passively stretched during a lunge, then returns to its resting length. Which two properties are shown, in order?","c":"Extensibility, then elasticity","w":["Elasticity, then extensibility","Contractility, then conductivity","Excitability, then contractility","Conductivity, then elasticity"],"e":"Extensibility is the ability to stretch. Elasticity is the ability to return to the original length and shape."},{"l":2,"t":"Muscle properties, functions, types","q":"A patient shivers in a cold room, and after a meal their skeletal muscle takes up glucose. Which muscle functions are these?","c":"Heat production; glycemic control","w":["Stability; movement","Control of openings; heat production","Glycemic control; stability","Movement; control of openings"],"e":"The functions of muscle are movement, stability, control of body openings, heat production, and glycemic control."},{"l":2,"t":"Muscle properties, functions, types","q":"A tissue sample is striated and under involuntary control. Its source is most likely:","c":"The heart","w":["The biceps brachii","The stomach wall","Blood vessel walls","The diaphragm"],"e":"Cardiac muscle is striated and involuntary. Skeletal muscle is striated and voluntary. Smooth muscle is non-striated and involuntary."},{"l":2,"t":"Muscle properties, functions, types","q":"A neurotoxin leaves muscle fibers able to respond electrically but unable to shorten. Which property is lost?","c":"Contractility","w":["Excitability","Conductivity","Extensibility","Elasticity"],"e":"Contractility is the ability to shorten when stimulated."},{"l":2,"t":"Muscle properties, functions, types","q":"The postural muscles keep you upright while you stand still, and sphincter muscles control when you urinate. Which functions of muscle are these?","c":"Stability; control of body openings","w":["Movement; heat production","Glycemic control; movement","Heat production; stability","Control of openings; glycemic control"],"e":"Muscle stabilizes joints, maintains posture, and controls body openings."},{"l":2,"t":"Muscle properties, functions, types","q":"Which pairing of muscle type and features is correct?","c":"Smooth: no striations, involuntary","w":["Cardiac: no striations, voluntary","Skeletal: striated, involuntary","Smooth: striated, voluntary","Cardiac: no striations, involuntary"],"e":"Skeletal muscle is striated and voluntary. Cardiac muscle is striated and involuntary."},{"l":2,"t":"CT of muscle","q":"What actually attaches a skeletal muscle to bone?","c":"Continuous connective tissue that becomes the tendon","w":["Muscle fibers inserting directly into bone","Sarcolemma fused to periosteum","Articular cartilage","The synovial membrane"],"e":"All of the muscle's CT is continuous, and it is the CT that attaches to bone."},{"l":2,"t":"CT of muscle","q":"Order the connective tissues from most microscopic to most external:","c":"Endomysium → perimysium → epimysium → fascia","w":["Perimysium → endomysium → epimysium → fascia","Epimysium → perimysium → endomysium → fascia","Fascia → epimysium → perimysium → endomysium","Endomysium → epimysium → perimysium → fascia"],"e":"Endo- (single cell) → peri- (fascicle) → epi- (muscle belly) → fascia (groups of muscles)."},{"l":2,"t":"CT of muscle","q":"The muscles of one leg compartment share similar actions and the same nerve supply. Which tissue defines that compartment?","c":"Fascia","w":["Epimysium","Perimysium","Aponeurosis","Endomysium"],"e":"Fascia is grossly visible CT surrounding groups of muscles that share function and neurovascular supply."},{"l":2,"t":"CT of muscle","q":"A soccer player's muscle strain is slow to heal. The injury most likely involves a structure that is:","c":"A tendon, which is poorly vascularized","w":["The endomysium, which lacks collagen","Articular cartilage","The sarcoplasmic reticulum","A bursa"],"e":"Tendons are highly organized collagen with poor blood supply, and muscle strains often affect them."},{"l":2,"t":"CT of muscle","q":"A pathologist looks at a single muscle cell and the thin CT wrapping it. Which layer is this?","c":"Endomysium","w":["Perimysium","Epimysium","Fascia","Tendon"],"e":"Endo- means within."},{"l":2,"t":"CT of muscle","q":"Which layer surrounds the ENTIRE muscle belly?","c":"Epimysium","w":["Endomysium","Perimysium","Aponeurosis","Sarcolemma"],"e":"Epi- means upon. Beyond the epimysium, fascia surrounds groups of muscles."},{"l":2,"t":"Myofibers","q":"Why is a skeletal muscle fiber multinucleate?","c":"It forms from the fusion of 100+ myoblasts","w":["It divides repeatedly without cytokinesis in adults","It absorbs satellite neurons","Nuclei migrate in from the endomysium","Each sarcomere has its own nucleus"],"e":"Myoblasts are small mesodermal cells."},{"l":2,"t":"Myofibers","q":"After months of heavy resistance training, an athlete's muscles are larger. What happened at the cellular level?","c":"Existing fibers enlarged by adding myofibrils and organelles (hypertrophy)","w":["Mature fibers divided to make new fibers","Fibroblasts converted to muscle cells","Sarcomeres got longer at rest","Endomysium thickened into new fibers"],"e":"Mature muscle cells can't divide. Forceful, repetitive activity causes hypertrophy."},{"l":2,"t":"Myofibers","q":"A drug prevents Ca²⁺ storage in relaxed muscle. Which organelle is targeted?","c":"Sarcoplasmic reticulum","w":["Sarcolemma","Sarcoplasm","Actin","Dystrophin"],"e":"The SR is smooth ER forming a network around each myofibril. Its terminal cisternae store calcium."},{"l":2,"t":"Myofibers","q":"Which protein pairing is correct?","c":"Thick filament: myosin; thin filament: actin + tropomyosin/troponin","w":["Thick filament: actin; thin filament: myosin","Elastic filament: dystrophin","Accessory protein: titin","Thin filament: titin + myosin"],"e":"Titin is the elastic filament. Dystrophin is an accessory protein linking the myofilaments to the sarcolemma and endomysium."},{"l":2,"t":"Myofibers","q":"Duchenne muscular dystrophy involves a missing protein that links the outermost myofilaments to the sarcolemma. Which protein?","c":"Dystrophin","w":["Titin","Troponin","Tropomyosin","Myosin"],"e":"Dystrophin connects, through a series of links, to the endomysium."},{"l":2,"t":"Myofibers","q":"Under a microscope, the light bands of a muscle fiber shorten during contraction but the dark bands do not. What does this tell you?","c":"Thick filaments (A band) don't change length; thin filaments slide past them","w":["Myosin filaments shorten","Actin filaments shorten","Z discs disappear","Sarcomeres lengthen"],"e":"The myofilaments themselves don't shorten. They slide past each other, so the sarcomeres and the whole muscle shorten."},{"l":2,"t":"Myofibers","q":"A signal at the sarcolemma must reach deep inside a thick muscle fiber. Which structure carries it inward?","c":"Transverse (T) tubules","w":["Terminal cisternae","Myofibrils","Z discs","Endomysium"],"e":"T tubules are tubular infoldings of the sarcolemma that penetrate the cell."},{"l":2,"t":"Myofibers","q":"Long protein cords running the full length of a muscle fiber and made of myofilaments are:","c":"Myofibrils","w":["Fascicles","T tubules","Sarcomeres only","Endomysium"],"e":"Myofibrils are made of myofilaments. The SR forms a network around each myofibril."},{"l":2,"t":"Myofibers","q":"Which proteins convert ATP's chemical energy into the mechanical energy of contraction?","c":"Myosin and actin","w":["Titin and dystrophin","Tropomyosin and troponin","Dystrophin and actin","Titin and myosin"],"e":"Myosin and actin are the contractile proteins. Tropomyosin and troponin are regulatory proteins."},{"l":2,"t":"Myofibers","q":"Which correctly describes the striations of skeletal muscle?","c":"Dark A band = thick filaments; light I band = thin filaments, bisected by the Z disc","w":["Dark I band = thin filaments; light A band = thick filaments","Z discs sit in the middle of the A band","The A band contains only titin","Striations come from the endomysium"],"e":"A sarcomere runs from one Z disc to the next."},{"l":2,"t":"Myofibers","q":"A sarcomere shortens during contraction. What happens to the length of the thick and thin filaments?","c":"They stay the same length and slide past each other","w":["Both shorten","Only the thin filaments shorten","Only the thick filaments shorten","Both lengthen"],"e":"This is the sliding filament mechanism. Sarcomeres shorten, so the whole muscle shortens."},{"l":2,"t":"Contraction & functional groups","q":"Holding a plank position with no visible movement, the core muscles are performing:","c":"Isometric contraction","w":["Concentric contraction","Eccentric contraction","Reflexive contraction","Circumduction"],"e":"Isometric: tension develops without a change in length, and energy is still expended."},{"l":2,"t":"Contraction & functional groups","q":"While running downhill, the quadriceps lengthen under load to control knee flexion. Which contraction is this, and why does it matter clinically?","c":"Eccentric; injuries are more common","w":["Concentric; injuries are more common","Isometric; no energy is used","Eccentric; it produces no tension","Tonic; it is involuntary"],"e":"Eccentric contraction is isotonic lengthening. Muscle injuries happen more often during it."},{"l":2,"t":"Contraction & functional groups","q":"A doctor taps the patellar tendon and the leg kicks. Compare this with the constant low-level tension in postural muscles.","c":"Reflexive (produces movement); tonic (no movement)","w":["Tonic; reflexive","Isometric; eccentric","Concentric; isometric","Voluntary; reflexive"],"e":"Reflexive contractions are involuntary and produce movement. Tonic contraction is muscle tone."},{"l":2,"t":"Contraction & functional groups","q":"During elbow flexion, the triceps brachii keeps some tension to control the speed of movement. Its role is:","c":"Antagonist","w":["Prime mover","Synergist","Fixator","Agonist"],"e":"An antagonist opposes the prime mover. It can relax completely but more typically limits speed or range."},{"l":2,"t":"Contraction & functional groups","q":"While you do a biceps curl, muscles hold the scapula steady so the biceps pulls effectively on the forearm. Those scapular muscles act as:","c":"Fixators","w":["Prime movers","Antagonists","Synergists modifying direction","Reflexive contractors"],"e":"To 'fix' a bone means to hold it steady."},{"l":2,"t":"Contraction & functional groups","q":"Which best describes a synergist?","c":"Aids the prime mover, often by stabilizing a joint or modifying the direction of movement","w":["Produces the most force","Opposes the prime mover","Prevents a bone from moving at all","Contracts only reflexively"],"e":"A synergist can also have a redundant action."},{"l":2,"t":"Contraction & functional groups","q":"Which contraction does NOT produce external movement?","c":"Tonic","w":["Reflexive","Concentric","Eccentric","Isotonic"],"e":"Tonic contraction is muscle tone. Muscles are almost always slightly contracted. (An isometric contraction also produces no external movement.)"},{"l":2,"t":"Contraction & functional groups","q":"Which statement about isotonic contraction is correct?","c":"The muscle changes length while keeping constant tension","w":["The muscle develops tension without changing length","No energy is used","It is always involuntary","It only lengthens the muscle"],"e":"Isotonic contractions come in two types: concentric (shortening) and eccentric (lengthening)."},{"l":3,"t":"Neurocranium","q":"A trauma report describes a fracture of the calvaria. Which region is injured?","c":"The dome-like roof of the cranium","w":["The cranial base","The facial skeleton","The mandible","The orbit floor"],"e":"Calvaria means skull cap. The basicranium is the cranial base, and the viscerocranium is the facial skeleton."},{"l":3,"t":"Neurocranium","q":"Using the course's definitions, which bone is part of the skull but NOT part of the cranium (neurocranium)?","c":"Mandible","w":["Frontal","Occipital","Sphenoid","Parietal"],"e":"The skull is the whole bony skeleton of the head: cranium, facial skeleton, and mandible. Most definitions treat the cranium as the neurocranium, or brain case."},{"l":3,"t":"Neurocranium","q":"The two components of the cranium are:","c":"Calvaria and basicranium","w":["Viscerocranium and mandible","Frontal and occipital bones","Neurocranium and calvaria","Cranial fossae and sutures"],"e":"The calvaria is the dome-like roof and the basicranium is the base."},{"l":3,"t":"Neurocranium","q":"Which set contains ONLY unpaired bones of the neurocranium?","c":"Frontal, occipital, sphenoid, ethmoid","w":["Parietal, temporal, frontal","Temporal, sphenoid, ethmoid","Parietal, occipital, sphenoid","Frontal, parietal, temporal"],"e":"The parietal and temporal bones are paired."},{"l":3,"t":"Neurocranium","q":"The supra-orbital margin of the frontal bone marks:","c":"The boundary between the squamous and orbital parts, at the eyebrow region","w":["The frontal–parietal suture","The roof of the nasal cavity","The attachment of the temporalis","The site of the frontal sinus opening"],"e":"The frontal bone forms the forehead and the roofs of the orbits."},{"l":3,"t":"Neurocranium","q":"Which pair of bones forms the major portion of the lateral walls and roof of the calvaria?","c":"Parietal bones","w":["Temporal bones","Frontal and occipital bones","Sphenoid wings","Zygomatic bones"],"e":"The parietal bones are paired flat bones."},{"l":3,"t":"Neurocranium","q":"A patient's jaw locks open after a wide yawn. The mandibular condyle has slid anterior to which temporal bone feature?","c":"Articular tubercle","w":["Mastoid process","Styloid process","External acoustic meatus","Petrous part"],"e":"The articular tubercle is an inferior projection of the zygomatic process, just anterior to the mandibular fossa."},{"l":3,"t":"Neurocranium","q":"A child has pain and swelling in the bony prominence behind the ear, with infection spreading into air-filled spaces. Which feature is involved, and which muscle attaches there?","c":"Mastoid process; sternocleidomastoid","w":["Styloid process; tongue muscles","Articular tubercle; lateral pterygoid","Zygomatic process; masseter","Occipital condyle; trapezius"],"e":"The mastoid process contains the mastoid air cells and is the superior attachment of the SCM."},{"l":3,"t":"Neurocranium","q":"A patient's hearing loss is traced to an ossicle fixed in the oval window. Which ossicle is it, and which part of the temporal bone houses it?","c":"Stapes; petrous part","w":["Malleus; mastoid process","Incus; squamous part","Stapes; zygomatic process","Malleus; petrous part"],"e":"The petrous part is part of the basicranium and houses the middle and inner ear."},{"l":3,"t":"Neurocranium","q":"The styloid process serves mainly as:","c":"An attachment point for muscles and ligaments of the tongue and neck","w":["The articulation for the mandible","A container for air cells","The attachment of the trapezius","A passageway for CN VII"],"e":"It is a slender, inferior projection of the temporal bone."},{"l":3,"t":"Neurocranium","q":"Which occipital bone feature forms a joint with C1, and which serves as an attachment for the trapezius and nuchal ligament?","c":"Occipital condyles; external occipital protuberance","w":["External occipital protuberance; occipital condyles","Foramen magnum; occipital condyles","Jugular foramen; mastoid process","Occipital condyles; foramen magnum"],"e":"The occipital condyles form the atlanto-occipital joint with C1."},{"l":3,"t":"Neurocranium","q":"Why is the sphenoid called the 'keystone' of the basicranium?","c":"It sits in the middle of the cranial base and articulates with many bones, with many foramina for neurovasculature","w":["It is the largest bone of the calvaria","It forms the entire orbit","It houses the inner ear","It forms the foramen magnum"],"e":"The sphenoid is unpaired and butterfly-shaped. It also forms a small part of the calvaria and the orbit."},{"l":3,"t":"Neurocranium","q":"After a head injury, a patient can no longer smell and has clear fluid leaking from the nose. Which bone is most likely fractured?","c":"Ethmoid (cribriform foramina)","w":["Sphenoid (sella turcica)","Temporal (petrous part)","Occipital (foramen magnum)","Frontal (supra-orbital margin)"],"e":"Axons of the olfactory nerve (CN I) pass through the cribriform foramina of the ethmoid, in the anterior cranial fossa."},{"l":3,"t":"Neurocranium","q":"Why does the internal cranial base have three stepped fossae?","c":"The cranial bones form around the brain, so their shape follows brain structure","w":["Muscles of mastication pull on them","They follow the paranasal sinuses","The vertebral column shapes them","They form from cartilage models"],"e":"The anterior, middle, and posterior fossae each hold different parts of the brain."},{"l":3,"t":"Neurocranium","q":"Match each cranial fossa to its contents (anterior, middle, posterior):","c":"Frontal lobes; temporal lobes and pituitary; cerebellum, pons, medulla","w":["Temporal lobes; frontal lobes; cerebellum","Cerebellum; pituitary; frontal lobes","Frontal lobes; cerebellum; temporal lobes","Pituitary; frontal lobes; medulla"],"e":"The anterior fossa is formed by the frontal bone, ethmoid, and lesser wings of the sphenoid. The middle fossa by the sphenoid and temporal bone. The posterior fossa mostly by the occipital bone plus the temporal bone."},{"l":3,"t":"Neurocranium","q":"A pituitary tumor enlarges the hypophyseal fossa. Which structure is eroded, and in which fossa?","c":"Sella turcica of the sphenoid; middle cranial fossa","w":["Cribriform foramina; anterior fossa","Jugular foramen; posterior fossa","Internal acoustic meatus; posterior fossa","Foramen magnum; posterior fossa"],"e":"The sella turcica is a saddle-like midline structure."},{"l":3,"t":"Neurocranium","q":"A lesion compresses everything passing through the superior orbital fissure. Which nerve is SPARED?","c":"Optic n. (CN II)","w":["Oculomotor n. (CN III)","Trochlear n. (CN IV)","Ophthalmic n. (CN V1)","Abducens n. (CN VI)"],"e":"CN II and the ophthalmic artery travel through the optic canal instead."},{"l":3,"t":"Neurocranium","q":"A tumor at the jugular foramen causes hoarseness, trouble swallowing, and weak shoulder shrugging. Which nerve would NOT be affected?","c":"Facial n. (CN VII)","w":["Glossopharyngeal n. (CN IX)","Vagus n. (CN X)","Accessory n. (CN XI)","None; all four pass through"],"e":"The jugular foramen transmits the internal jugular v., CN IX, CN X, and CN XI. CN VII passes through the internal acoustic meatus."},{"l":3,"t":"Neurocranium","q":"Which structures pass through the foramen magnum?","c":"Medulla/spinal cord transition, vertebral aa., CN XI","w":["CN IX, X, XI and the internal jugular v.","CN VII and VIII","CN III, IV, V1, VI","CN II and the ophthalmic a."],"e":"CN XI is also listed with the jugular foramen."},{"l":3,"t":"Viscerocranium","q":"Which bone is NOT part of the viscerocranium?","c":"Parietal","w":["Maxilla","Zygomatic","Lacrimal","Vomer"],"e":"The viscerocranium is the facial skeleton, the mostly irregular bones surrounding the mouth, nose, and most of the orbit."},{"l":3,"t":"Viscerocranium","q":"A punch fractures the bridge of the nose. Which bones are injured, and what do they protect?","c":"Nasal bones; the superior entry of the nasal cavity","w":["Vomer; the nasal septum","Lacrimal bones; the tear duct","Maxillae; the hard palate","Ethmoid; the cribriform foramina"],"e":"The nasal bones are small and flattened."},{"l":3,"t":"Viscerocranium","q":"Which features belong to the maxillae?","c":"Maxillary teeth, most of the hard palate, maxillary sinuses","w":["Mandibular teeth and the coronoid process","The posterior hard palate only","The inferior nasal septum","The lateral orbital wall only"],"e":"The maxillae form the upper jaw."},{"l":3,"t":"Viscerocranium","q":"Which bone does NOT contain a paranasal sinus?","c":"Parietal","w":["Maxilla","Frontal","Sphenoid","Ethmoid"],"e":"Paranasal sinuses are mucous membrane-lined cavities in four bones: the maxillae, frontal, sphenoid, and ethmoid."},{"l":3,"t":"Viscerocranium","q":"The nasal conchae increase mucosal and vascular surface area in order to:","c":"Warm and humidify inhaled air","w":["Produce tears","Form the nasal septum","Anchor the teeth","Drain the paranasal sinuses"],"e":"The superior and middle conchae are part of the ethmoid. The inferior concha is a separate paired bone."},{"l":3,"t":"Viscerocranium","q":"A deviated septum involves its bony INFERIOR portion. Which bone is it?","c":"Vomer","w":["Ethmoid","Nasal bone","Palatine","Septal cartilage"],"e":"The ethmoid forms the septum superiorly, the vomer inferiorly, and septal cartilage anteriorly."},{"l":3,"t":"Viscerocranium","q":"A cleft involves only the posterior part of the hard palate, where the soft palate attaches. Which bones are involved?","c":"Palatine bones","w":["Maxillae","Vomer","Mandible","Zygomatic bones"],"e":"The maxillae form most of the hard palate, and the palatine bones form its posterior portion."},{"l":3,"t":"Viscerocranium","q":"An orbital floor fracture after a blow to the cheek most likely involves:","c":"The zygomatic bone","w":["The lacrimal bone only","The nasal bone","The vomer","The parietal bone"],"e":"The zygomatic bones ('cheekbones') form the lateral wall and floor of the orbit."},{"l":3,"t":"Viscerocranium","q":"A patient's tears don't drain into the nose. Which small bone forms a fossa (with the maxilla) along this pathway?","c":"Lacrimal","w":["Nasal","Palatine","Vomer","Zygomatic"],"e":"The lacrimal bones are the smallest bones of the face."},{"l":3,"t":"Viscerocranium","q":"Which statement about the mandible is correct?","c":"It is the only movable skull bone besides the ossicles","w":["Its ramus holds the mandibular teeth","Its body is the vertical portion","It articulates with the maxilla at the TMJ","It has no foramina"],"e":"The body is horizontal, U-shaped, and holds the teeth. The ramus is vertical and posterior."},{"l":3,"t":"Viscerocranium","q":"A dentist numbs the lower teeth by injecting near an opening on the inner ramus. Which nerve and foramen are targeted?","c":"Inferior alveolar n.; mandibular foramen","w":["Facial n.; stylomastoid foramen","Hypoglossal n.; foramen magnum","Mandibular n.; jugular foramen","Lingual n.; mental foramen"],"e":"This is the inferior alveolar nerve (IAN) block."},{"l":3,"t":"Viscerocranium","q":"Match the tooth to its shape: thin cutting edge, single cone, 2 cusps, 3+ cusps.","c":"Incisor, canine, premolar, molar","w":["Canine, incisor, molar, premolar","Incisor, premolar, canine, molar","Molar, canine, premolar, incisor","Premolar, canine, incisor, molar"],"e":"A premolar is also called a bicuspid."},{"l":3,"t":"Joints of the head","q":"Skull sutures are classified as:","c":"Fibrous joints, immovable in adults","w":["Cartilaginous joints, slightly movable","Synovial joints, freely movable","Symphyses","Synchondroses"],"e":"Sutures are held by sutural ligaments."},{"l":3,"t":"Joints of the head","q":"Which suture lies in the coronal plane and unites the frontal bone with both parietal bones?","c":"Coronal","w":["Sagittal","Squamous","Lambdoid","Frontal-occipital"],"e":"Sagittal: parietals in the midline. Squamous: parietal and temporal (paired). Lambdoid: parietals and occipital."},{"l":3,"t":"Joints of the head","q":"After a blow to the side of the head, a patient is lucid briefly and then deteriorates. The fracture is at the pterion. Why is this site dangerous?","c":"Branches of the middle meningeal a. run deep to it, so an epidural hematoma can form","w":["It overlies the internal jugular v.","It overlies the pituitary","The TMJ dislocates","The vertebral aa. are torn"],"e":"At the pterion, the frontal, parietal, temporal, and sphenoid bones meet."},{"l":3,"t":"Joints of the head","q":"Why do infants have fontanels?","c":"Dense CT between incompletely developed bones allows growth and flexibility; it is later replaced by bone through intramembranous ossification","w":["They are synovial joints for chewing","They are air-filled sinuses","They are cartilage models for endochondral ossification","They drain CSF"],"e":"Fontanels are the infant skull's 'soft spots.'"},{"l":3,"t":"Joints of the head","q":"What are the articular surfaces of the TMJ?","c":"Mandibular condyle and mandibular fossa of the temporal bone, separated by an articular disc","w":["Coronoid process and zygomatic arch","Mandibular condyle and occipital condyle","Ramus and maxilla","Articular tubercle and styloid process"],"e":"The disc splits the joint into superior and inferior compartments."},{"l":3,"t":"Joints of the head","q":"Jutting the chin forward (protraction) mainly happens in which TMJ compartment, and elevation/depression in which?","c":"Superior; inferior","w":["Inferior; superior","Both in the superior compartment","Both in the inferior compartment","Neither; it's a plane joint"],"e":"The structure of the disc and compartments is what lets the TMJ perform these specific movements."},{"l":3,"t":"Joints of the head","q":"Which presentation best fits temporomandibular disorder (TMD)?","c":"Jaw pain with reduced mobility","w":["A condyle locked anterior to the articular tubercle","Unilateral facial paralysis
